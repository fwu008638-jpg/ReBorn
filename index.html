色双肩包，脚边立着一只银灰色行李箱。小桌板上放着还没熄屏的手机，购票软件的行程页面停留在上面。\n\n云梦南。\n\n不是第一次了。\n\n我抬手按住太阳穴，指尖下的血管一跳一跳，像有什么东西正试图从脑袋里钻出来。\n\n车厢里很安静，只有邻座大叔刷短视频时漏出的几声笑，和前排小孩小声问妈妈还有多久才到站。\n\n这样的混乱，我已经不是第一次经历了。\n\n最初那几天，我确实试过许多毫无意义的办法：掐自己的手臂，在深夜反复确认手机日期，对着镜子看那张与记忆里并无不同的脸，甚至认真思考过要不要用撞墙来检验世界真实性。\n\n事实证明，世界并不会因为我的怀疑给出任何明确提示，脑袋倒是会疼得更加真实。\n\n所以现在，我只好慢慢呼出一口气，把额头靠在冰凉的车窗上。\n\n我真正醒来的地方，并不是这趟高铁。\n\n而是一个多月前的医院。\n\n消毒水的味道，天花板的白色，床边仪器规律的滴声，还有趴在床边的母亲微微发红的眼角。那时我从一场长得像死亡本身的昏睡中睁开眼，第一反应是自己竟然还活着。\n\n我刚想尝试抬起自己的手指，可母亲几乎在下一秒就惊醒了。\n\n她先是怔怔地看着我，像是不敢确认那双眼睛真的睁开了。随后她站起来，椅子腿在地面上划出刺耳的声响，眼泪一下子涌出来，却又慌得连哭都顾不上，只反复按床头铃，叫我的名字，问我疼不疼、能不能听见、知不知道自己在哪。\n\n父亲赶来时，衬衫领口歪着。他站在病床边，嘴唇动了几下，最后只是伸手摸了摸我的头。\n\n那天没有人提任何多余的话题。\n\n他们只问我疼不疼，只问我想不想喝水，只问医生人醒了是不是就没事了。直到几天后，我能坐起来，能自己拿勺子喝粥，也能连续说完一整句话，那个真正不对劲的问题才一点点浮出来。\n\n我记得那个夏天被分数压得喘不过气，记得屏幕前漫长的沉默，记得有人把手机倒扣在桌上，像是不想再看第二眼。记忆里的班主任在电话里客气地说“也不是没有别的选择”，亲戚们则用一种努力不显得怜悯的语气劝我“复读也挺好”。\n\n可现在，父母却小心翼翼地告诉我，录取通知已经到了。\n\n云梦师范大学。\n\n物理学类。\n\n立华书院。\n\n这些词像一串完全陌生的文字，被他们一点点摆到我面前。\n\n起初我以为自己是在做梦。\n\n后来我以为父母精心布置了一个善意的谎言来安慰自己。\n\n可再后来，当父亲把录取通知书、身份证、准考证、高中档案复印件、获奖证书一件件拿给我看时，我终于不得不承认，摆在眼前的世界比梦更荒唐。\n\n那张身份证上的人是我。\n\n学生档案上的名字是我。\n\n物理竞赛省二等奖证书上的照片也是我。\n\n甚至连家中的高中毕业照，那张站在第二排、头发有点乱、表情不太自然的脸，也和镜子里的自己没有任何区别。\n\n可问题是，我不记得。\n\n我不记得自己什么时候成了老师口中的理科尖子生，不记得自己什么时候参加过物理竞赛，也不记得自己为什么会在填志愿时不顾父母、师长的劝告一再坚持要去云梦师大。\n\n那个在父母口中的自己，陌生得让我害怕。\n\n可医生说，这是事故后的记忆紊乱。\n\n医生说得很谨慎，尽量把每个词都解释得通俗，好让惊魂未定的父母明白：脑部受到撞击后，人的记忆可能出现缺损、混乱、错位；有些东西需要慢慢恢复，有些东西也许永远不会恢复。\n\n但好消息是，我的语言、判断、生活能力都还在，身体恢复也比预想得好。\n\n“如果病人本人愿意，回到原本熟悉的人生轨道，也许对恢复有帮助。”\n\n不管我如何去接受或理解这个突如其来、无比荒唐的现实，对病房里的父母来说，这句话都像是一根能让日子继续往前走的绳子。\n\n母亲问医生，去外地上学会不会太勉强。父亲问，如果突然头疼或者想不起事，该怎么办。医生一一回答，说不要过度刺激，不要逼我回忆，也不要把我当成完全失去能力的病人。\n\n回家后的一个多月里，我就在这种小心翼翼的空气中生活。\n\n父亲照常上班，只是每天中午都会发一条消息，问我有没有吃饭。母亲把请来的假分成一小段一小段，能在家就尽量在家，不能在家就提前把饭菜放进冰箱，再在便签纸上写清楚怎么加热。\n\n后来我常常觉得，父母其实比我想象中要了不起得多。\n\n这种了不起并不是因为他们能立刻拿出小说里那种冷静而正确的判断。恰恰相反，他们会担心，会失眠，会在厨房里压低声音争论“要不要让我去上大学”，也会在听见我走出房间时立刻停止对话，装作只是在讨论晚饭吃什么。\n\n他们只是两个普通人，却硬是把一个普通家庭突然塌下来的那部分，安安静静地撑住了。\n\n我不是没有愧疚。\n\n一个人如果在疑似灵魂交换后，还要被原本属于这具身体的父母这样照顾，那么愧疚几乎是一种基本礼貌。\n\n但愧疚不能解释问题。\n\n我花了一个多月验证这个世界。\n\n我翻过书桌、相册、聊天记录，也试过用搜索引擎查询自己记忆里的高中、考试、新闻和城市细节。结果越查越乱。\n\n这个世界里也有另一个姜岚。\n\n同名同姓，同父同母，同一张脸，甚至连身份证号都没有任何差别。\n\n可那个姜岚理综能考接近满分，参加过物理竞赛，书架上摆着《力学》《电磁学》《资本论》和一堆我连书名都读得磕绊的东西；而我记忆里的自己，却始终和逼仄的客厅、沉默的饭桌、查分页面上刺眼的数字纠缠在一起。\n\n两套人生像两张被强行叠在一起的试卷，姓名栏完全相同，答案却没有一道能对上。\n\n于是某个凌晨，我坐在书桌前，盯着屏幕上密密麻麻的搜索记录，给自己找到了一个听起来最不靠谱，却也最能让我暂时喘口气的答案。\n\n平行世界。\n\n灵魂交换。\n\n随便什么轻小说编辑看到后，都会立刻皱眉说“这设定也太老套了”的东西。\n\n我知道这个解释漏洞很多。\n\n可如果不这么想，我就只能承认另一种可能：这些陌生的成绩、书、志愿、关系，原本也许都属于我，只是被我忘得一干二净。\n\n那反而更可怕。\n\n所以我只能暂时相信，自己是被某场事故扔进了另一个姜岚留下的人生里。至于那个真正的姜岚去了哪里，我不知道，也不敢深想。\n\n可能去了我的世界，可能沉睡在某个我无法抵达的地方，也可能就像许多故事里被替换掉的原主一样，安静地消失了。\n\n每当想到最后一种可能，我就觉得心里一阵发沉。\n\n所以我只能给自己找一个听起来还算体面的理由：既然暂时无法回去，也无法确认另一个姜岚的去向，那至少不要把对方留下的人生弄得一团糟。\n\n云梦师范大学，就是这段人生留下的第一个存档点。\n\n既然已经读不了旧档，那就先从这里继续走下去吧……\n\n手机震了一下。\n\n我从回忆里抽身，拿起小桌板上的手机。屏幕亮起，是母亲发来的微信。\n\n> 醒了吗？快到云梦了吧？\n>\n> 头还疼不疼？\n>\n> 你爸把材料都放在书包夹层了。\n>\n> 到学校以后先去物理班报到点，有班导接新生。\n>\n> 不舒服就给我打电话，别硬撑。\n\n我看着那几行字，手指悬停在输入框上方，不知该向哪里移动。\n\n这些关心具体得让人难受。\n\n既然这是别人的人生，那么这份细致入微的关心当然也不是给我的。\n\n这个念头像一根细针，在胸口很轻地扎了一下。\n\n我低头看着自己的手，手背上还有事故后留下的一道浅色疤痕。医生说再过几个月就会淡下去，母亲每次看见却还是会皱眉。\n\n我慢慢打字。\n\n> 醒了，快到了。\n>\n> 头不疼，材料我知道。\n\n想了想，又补了一句：\n\n> 到学校给你发消息。\n\n消息发送成功。\n\n几乎是下一秒，母亲回了一个“好”。\n\n没有多余的叮嘱，像是生怕多说一句就会给我压力。\n\n这反而比长篇大论更难应付。过分小心的温柔，连让人不耐烦的缝隙都不留。\n\n我把手机放回小桌板上，抬头看向车厢尽头的电子屏。红色小字滚动显示着车次、温度和即将到达的站点。离云梦南站还有十分钟。\n\n我拉开双肩包最外侧的拉链，手伸进去摸了半天，只摸到充电线、纸巾和一本硬壳笔记本。\n\n夹层。\n\n我把手伸进靠近背部的暗袋，果然摸出一个文件袋。\n\n录取通知书、身份证、新生报到单、银行卡、几张证件照，全都被整整齐齐地装在里面。文件袋最下面，还压着一张云梦师范大学的校园地图。\n\n我看着那些材料，忽然有点想笑。\n\n从某种意义上来说，我大概是史上准备最充分的穿越者。别人醒来时不是在山洞，就是在战场，运气差一点还会被绑在祭坛上等人念咒。我倒好，文件袋、身份证、银行卡、校园地图一应俱全，甚至连母亲都提前提醒了材料存放位置。\n\n除了我本人完全没有准备好之外，一切都很周到。\n\n笑意只持续了一秒。\n\n因为我很快看见文件袋里夹着的另一张纸。\n\n那是一张医院复诊提示单，折过两次，被父亲随手放在材料之间。纸面上有医生潦草的字迹，提醒我开学后如果出现持续头痛、眩晕、睡眠障碍或记忆混乱，应及时就医。\n\n我盯着“记忆混乱”四个字看了很久。\n\n如果换成别人，大概会顺着这张纸想：有没有一种可能，我真的只是出了车祸，所以记忆坏掉了？\n\n这个念头我当然也想过。\n\n不如说，在过去一个多月里，我每天都会想。\n\n可问题是，如果一切都只是记忆坏掉了，那么我梦里那个高考失败的自己又算什么？那些关于失败、羞耻、车祸和死亡的感受为什么会真实到像亲手摸过的伤口？一个人的大脑可以凭空编出一整段人生吗？可以编出父母沉默时的神情、县城夏夜的潮气，以及奔驰车灯撞进眼睛里的白光吗？\n\n更何况，这个世界的姜岚优秀得过分。\n\n优秀到让我不敢相信那是“自己”。\n\n我把复诊提示单重新夹回文件袋，像是把某个危险的问题重新压了回去。\n\n我知道自己的解释有漏洞。\n\n灵魂交换当然不科学，平行世界当然更不科学。可人总要找一个能暂时活下去的解释。与其承认自己可能遗忘了一个完全陌生、完全优秀、完全不像自己的过去，我宁愿相信世界在某个夏天开了一个恶劣的玩笑。\n\n至少那样，我还可以把这份人生理解成借来的。\n\n借来的东西，总比本来属于自己却被自己忘得一干二净要容易面对一些。\n\n列车终于开始进站。\n\n最先靠近的是一排排白色站台灯，随后是灰色钢梁、玻璃顶棚、安检口外模糊的人影。云梦南站像一头伏在铁轨尽头的金属巨物，张开被阳光照得发亮的口腔，缓慢而沉默地将整列车吞了进去。\n\n车厢里随即醒了过来。行李架被陆续打开，塑料袋摩擦声、电话声、孩子的催促声从四面八方冒出来。空调冷风里混进泡面调料、行李箱塑料和站台涌入的湿热气息，刚才那点短暂的安静被人群揉碎了。\n\n我把文件袋塞回书包夹层，拉好拉链，又弯腰扶住脚边的行李箱。\n\n我忽然想起母亲清晨在家门口送我时的样子。\n\n那时父亲把行李箱搬进网约车后备箱，母亲站在楼道灯下，她本来好像有很多话想说，最后却只帮我理了理衣领。\n\n“到了别急。”她说，“慢慢来。”\n\n我当时点了点头，没有回答。\n\n现在列车即将停下，我才后知后觉地意识到，这句话也许并不只是说报到。\n\n**慢慢来。**\n\n**可是列车已经停下了。**\n\n车厢里的人开始往外走，行李箱一个接一个被拖过过道。我被人流轻轻推了一下，只好把那个暂时无解的问题也一并塞回心里。\n\n不管平行世界、灵魂交换，或者记忆混乱究竟哪一个才是真的，我接下来要做的第一件事都很简单。\n\n我要去一所大学报到。\n\n这听起来实在不像什么伟大冒险的开端。\n\n但当列车停稳，车门打开，门外嘈杂的人声隔着缝隙涌进来时，我还是握紧了行李箱拉杆。\n\n如果这个世界真的给了我一次重新开始的机会，那我至少不能在第一天就逃走。\n\n如果这不是机会，而是某个陌生姜岚留给我的残局，那我至少也该替对方走到该去的地方。\n\n我跟着人流走下高铁。\n\n站台的热浪扑面而来，广播声、人群脚步声和行李箱滚轮碾过地砖的声音混在一起。我抬头，看见透明顶棚外的天空被切成几块刺眼的蓝色，像一张刚刚展开、还来不及写下任何内容的纸。\n\n而在那片亮得几乎没有阴影的天光下，我再一次说服了自己。\n\n”就从这开始认识这个世界吧。“"},{"title":"第二章：登记人生","file":"2、第二章.md","text":"从云梦南站到云梦师范大学，地图上只有不到二十公里。\n\n如果放在游戏里，这大概只是一段加载界面：主角从新手村乘坐交通工具抵达第一座主城，屏幕上跳出几行世界观提示，顺便播放一段气势恢宏却不能跳过的过场动画。\n\n可现实中的过场动画通常没有那么体贴。\n\n我先是在出站口被人流推着走错了方向，又在地铁站口对着线路图沉默了半分钟，最后才拖着行李箱挤进一列开往城区的地铁。\n\n这半分钟里，我认真学习了云梦地铁的换乘逻辑。\n\n学习成果约等于没有。\n\n车厢里全是和我差不多年纪的新生，行李箱、双肩包、帆布袋、家长手里的遮阳伞和各个学院的迎新指引挤在一起，像是整座城市都在同一天把十八九岁的年轻人倒进了同一条管道。\n\n有人靠在门边打电话。\n\n“妈，我真知道怎么走，群里发了定位。”\n\n有人低头研究新生手册。\n\n“木兰广场在哪啊？怎么还有书院和学院两个地方？”\n\n还有人兴致勃勃地和身边刚认识的同学讨论宿舍条件，语气里满是对大学生活的好奇和期待。\n\n我坐在靠近车门的位置，一只手扶着行李箱拉杆，另一只手按着手机导航。屏幕上那条蓝色路线从云梦南站一路蜿蜒到云梦师范大学，像某种过分明确的命运提示。\n\n我不喜欢这种明确。\n\n父母整理好的材料，手机里提前保存的校园地图，微信里被置顶的新生群，甚至行李箱侧袋里那包被母亲塞进去的常用药，都让这条路显得太顺了。\n\n顺到我反而不知道该把自己放在哪里。\n\n可如果那条顺畅的路线不是你自己铺出来的，它就很容易变成一条传送带。你只要站上去，下一秒就会被送到某个写着“请在此处成为优秀大学生”的窗口前。\n\n这个世界的姜岚并不是空手来到云梦的。\n\n那个人准备过这里，也期待过这里。\n\n开什么玩笑……何止是期待呢？那个在填志愿时几乎执拗到非此不取的人，恐怕早就在无数个夜晚，把抵达云梦的这一天于心里重复过几百上千遍了吧？\n\n校门、宿舍、报到点，甚至这一天的天气，无论晴天还是下雨，大概都曾被他想象过。\n\n地铁在“云梦师大站”停下时，车门一开，热气就像等在外面的某种活物，迫不及待地钻进车厢。我跟着人流走上扶梯，刚出站，就看见路边停着几辆印有“云梦师范大学欢迎新同学”的接驳车。\n\n志愿者们穿着统一的蓝色马甲，举着学院和书院的牌子，声音在太阳底下喊得发哑。\n\n“物电院、计信院这边！”\n\n“立华书院的新生先到这边登记！”\n\n“家长可以一起上车，行李放后面！”\n\n我站在人群的边缘，犹豫着。\n\n我本来想自己过去。\n\n按照导航走到学校，找到木兰广场，排队，交材料，拿一卡通和宿舍信息，然后尽快离开人最多的地方。流程越普通越好，普通到没有人会记住我，普通到我可以像一滴水混进另一片水里。\n\n可志愿者已经注意到了我。\n\n“同学，你是立华书院的吗？”\n\n我还没来得及编出一个“不用麻烦我自己走”的理由，对方就很熟练地接过我手里的行李箱，往接驳车方向一指。\n\n“正好最后几个位置，先上车吧。外面太热了。”\n\n于是我就这样被安排进了车里。\n\n我甚至还没来得及展示一下独立成年男性拒绝帮助的尊严。\n\n接驳车开得不快，沿着云麓南路慢慢往前挪。道路并不算宽，迎新车辆、出租车、外卖电动车和拖着行李箱的新生挤在一起，路边的粉店、水果店和打印店把招牌伸到树荫底下。\n\n再往远处看，云麓山的轮廓被暑气蒸得发蓝，像一整片安静的阴影压在城市背后。车里有人在翻新生群，有人举着手机拍窗外一闪而过的校门，有家长压低声音叮嘱孩子“到了别乱花钱”，还有一个穿白T恤的男生从上车开始就没停过嘴，已经和旁边三个人交换了专业、籍贯和高考分数。\n\n我把视线移向窗外。\n\n云梦师范大学的校门比我想象中更大。\n\n石质门柱立在宽阔的道路两侧，校名被阳光照得发亮。门口挂着红色迎新横幅，保安、志愿者、家长、新生和来往车辆在同一片热气里缓慢移动。远处能看见一片湖，湖面被风吹出细碎的反光，像是有人把玻璃敲碎后撒在水上。\n\n如果这是另一个姜岚期待已久的地方，那他的审美倒是不差。\n\n我在心里这样想着，接驳车已经驶进校门。\n\n木兰广场在校园中轴线附近。广场中央立着一座我暂时不明含义的雕塑，四周搭满了遮阳棚。每个棚子前都挂着学院、书院、社团、绿色通道、户籍迁移、校园卡办理等各式各样的牌子。广播循环播放着新生报到须知，志愿者在人群里穿梭，行李箱滚轮声像某种不知疲倦的背景音乐。\n\n我拖着行李箱站在广场边缘，忽然产生了一种奇怪的感觉。\n\n好像这里的所有人都知道自己要做什么。\n\n家长知道要找哪个窗口，志愿者知道要把新生带到哪里，新生知道自己要办理什么手续，连广场上乱飞的传单都知道自己应该被塞进谁的手里……\n\n只有我，像一只混进精密仪器里的螺丝，暂时还不知道自己该拧在哪。\n\n“立华书院物理班，在那边。”\n\n接驳车上的志愿者把行李箱还给我，顺手指了指广场西侧的一排棚子。\n\n我道了谢，沿着对方指的方向走过去。\n\n立华书院的报到点比周围几个学院都要安静一些。不是人少，而是队伍排得更规整，桌面上的材料也摆得更齐。遮阳棚下坐着几名高年级志愿者，胸前挂着工作证，面前放着电脑、扫码枪、一卡通、宿舍钥匙和厚厚一叠表格。\n\n我排在队伍末尾。\n\n排队的人并不多，但每个人看起来都很会排队。他们安静地翻材料，低声和父母说话，轮到自己时快速上前，扫码、核验、签字、领卡，再拖着行李离开。\n\n这种高效让我稍稍安心。\n\n只要照着做就行。\n\n我最擅长的，至少现在最想擅长的，就是照着做。\n\n十分钟后，轮到我。\n\n“身份证，新生码，还有录取通知书看一下。”\n\n负责登记的女生抬头笑了笑，声音因为说了太多遍相同的话而显得有些机械，却仍然保持着迎新志愿者应有的亲切。\n\n我把文件袋打开。\n\n身份证。\n\n新生码。\n\n录取通知书。\n\n女生接过材料，先核对身份证，又扫了新生码。\n\n电脑屏幕上的页面跳转了两次。\n\n然后停住。\n\n女生脸上的笑意微微顿了一下。\n\n她又看了一眼身份证，再看屏幕，像是确认自己没有扫错。\n\n“姜岚同学，稍等一下。”\n\n她没有表现出明显异常，只是转头朝身后叫了一声。\n\n“物理班班导在吗？这边有个需要确认的。”\n\n需要确认。\n\n这四个字落进我耳朵里，比头顶的太阳还要刺眼。\n\n我的第一反应是病历。\n\n第二反应是车祸。\n\n第三反应则更加荒唐：难道这个世界的大学报到系统已经先进到能识别灵魂交换异常？\n\n当然，理智告诉我不可能。\n\n可理智这种东西在过去一个多月里已经多次证明，它在解释现实方面并不总是比轻小说设定更可靠。\n\n我的手指轻轻按在文件袋边缘，塑料薄膜被我压出一点细小的皱痕。\n\n“哪位？”\n\n一个男生的声音从旁边传来。\n\n我抬头。\n\n来人很高，穿着一件干净的黑色短袖，脖子上挂着立华书院班导证，头发修得整齐，眼镜后面的眼睛很亮。他走过来时没有急着问志愿者发生了什么，而是先低头看了一眼电脑屏幕，再把目光落到我脸上。\n\n那目光很平静。\n\n平静到不像是在看一个刚报到的新生，而像是在看一份早就读过、现在终于摆到面前的材料。\n\n“姜岚，是吧？”\n\n他接过志愿者递来的登记表，指尖在纸面上轻轻点了点。随后像是在核对，又像是在提醒周围的人注意，声音比刚才稍微抬高了一些。\n\n“徽州一中，物竞省二，理综二百八十多。”\n\n周围的声音短暂地停了一下。\n\n并不是所有人都看了过来。迎新现场太吵，太阳太晒，很多人只顾着自己的材料和行李。但排在我身后的几个新生明显抬起了头，旁边队伍里也有家长小声问了句“理综多少”。不远处另一个窗口前，几个正在签字的人也被这句话带得偏了一下目光，高马尾的女生、背着琴盒的男生，还有一位陪同的家长，不过他们又很快被志愿者的一句提醒拉回各自的表格前。\n\n那一瞬间，我觉得自己像是被人从队伍里拎了出来，放到广场中央晒太阳。\n\n我觉得对方未必是故意要让我难堪。\n\n或者说，正因为对方不觉得这有什么问题，才更让人不舒服。\n\n这个男生的语气里没有恶意，甚至带着一种理所当然的欣赏。可那种欣赏本身就像一把尺子，把我从头到脚量了一遍，又把结果当众贴在了我胸口。\n\n优秀的人就该被看见。\n\n优秀的人也应该经得起看。\n\n我似乎能从对方的神情里读出这样的逻辑。\n\n“我是物理班班导，尹渊。”\n\n尹渊把登记表放回桌上，微微笑了一下。\n\n“书院这边对你有点关注，之后可能会有一些培养安排。你身体情况如果影响学习，要提前和书院说明。”\n\n他这话说得很体面。\n\n体面到周围任何一个不明真相的人听见，都会觉得这是高年级学长对优秀新生的关心。\n\n而体面有时候就是这样，它能把一根针磨得很亮，让人被扎了以后还不好意思喊疼。\n\n可我听见的却是另一层意思。\n\n你是不是那个物竞省二？\n\n你现在还能不能保持那个水平？\n\n事故之后，你还有没有资格被期待？\n\n我张了张嘴，喉咙有些发紧。\n\n“我……应该没什么问题。”\n\n“应该？”\n\n尹渊突然对这个词很感兴趣。\n\n他没有追问身体情况，而是把话题轻轻一拐，拐到了更让我不安的地方。\n\n“你竞赛主要学的哪部分？力学？电磁？还是热学？”\n\n这句话问得太自然了。\n\n自然到像是两个竞赛生在迎新现场随口寒暄，也自然到我根本没有理由不回答。\n\n我脑中闪过一些零碎的画面：写满公式的草稿纸，黑板上的受力分析图，某本蓝色封皮的竞赛教材，老师拿粉笔敲着讲台说“这个模型你们要记住”。那些画面像被水浸过，轮廓还在，字迹却糊成一团。\n\n“力学……”我停了一下，“多一点吧。”\n\n“是吗？”\n\n尹渊看着我。\n\n他的笑意没有消失，只是变得更淡。\n\n“徽州一中的竞赛团队，我记得不是一直更偏电磁吗？”\n\n我的心猛地沉了一下。\n\n我不知道这句话是真的，还是试探。\n\n更糟糕的是，无论真假，我都不知道该怎么接。\n\n如果说“不是”，就要解释自己为什么知道；如果说“可能吧”，又像是在承认自己连曾经学过什么都记不清。那个真实的姜岚也许可以很轻松地纠正尹渊，甚至顺便聊几句教练、题型和省赛风格。可现在站在这里的人，只能感到后背的汗一点点贴住衣服。\n\n就在这时，有人从旁边伸手，拿走了桌上的登记表。\n\n“尹渊，后面还有人在排队。”\n\n声音不高，却很清楚。\n\n像一杯冷水落进闷热空气里。\n\n尹渊转过头。\n\n我也跟着看过去。\n\n站在旁边的是一个女生。\n\n她穿着很简单的米黄色短袖，袖口整齐地挽到小臂，胸前挂着和尹渊一样的班导证。长发在脑后松松束起，几缕碎发被汗水贴在耳侧。遮阳棚边缘漏下来的光落在她肩上，把衣料照出一层柔和的浅金色。\n\n周围仍然很吵。\n\n广播还在念迎新须知，家长还在询问宿舍路线，志愿者还在重复“身份证和新生码提前准备一下”。可在看见她的瞬间，我忽然觉得，那些声音好像都退远了一些。\n\n女生低头看了一眼登记表。\n\n那一眼很快，快到我几乎无法确定，她是不是在看到名字时停顿了半拍。\n\n随后她抬起头，神色自然地看向我。\n\n“姜岚同学，你好。我是物理班班导，霍钰。”\n\n霍钰。\n\n这个名字在我心里轻轻落了一下。\n\n不是惊雷，也不是久别重逢。\n\n更像是某个很久以前听过的旋律，被人隔着墙弹错了一个音。我说不出熟悉从哪里来，只觉得自己本能地不讨厌这个名字。\n\n霍钰没有给我胡思乱想的时间。\n\n她把登记表递还给志愿者，又把电脑屏幕转回正常报到页面。\n\n“备注里的事之后可以和辅导员单独说明，后面还有其他报到的同学，不适合处理这些。”她说，“先把一卡通和宿舍信息办完吧。”\n\n语气很平静。\n\n没有明显偏袒，也没有替我解释什么。她只是把尹渊刚刚抛出来的问题重新放回流程之外，像把一根越界的线轻轻推回原位。\n\n尹渊看了她一眼。\n\n“我只是确认一下重点新生情况。”\n\n“确认完就可以了。”\n\n霍钰说。\n\n这句话甚至称不上强硬。\n\n可尹渊短暂地停了停，最后只是笑了一下，没有继续问。\n\n志愿者重新开始办理报到。\n\n“姜岚同学，这是你的一卡通。宿舍在立华书院A109，钥匙暂时去宿管处领取。这里签个字。”\n\n我接过笔，签下自己的名字。\n\n笔尖落在纸面上时，我忽然有一种很微妙的感觉。\n\n过去一个多月里，我已经在很多地方看过这个名字：身份证、录取通知书、病历、证书、手机账号。可这是我第一次在云梦师范大学的报到表上亲手写下“姜岚”两个字。\n\n像是某种手续终于完成。\n\n也像是某种冒名顶替终于被系统盖章。\n\n签完字，志愿者又从旁边的文件夹里抽出一张小纸条。\n\n“对了，你这里还有一个包裹领取单。寄件人是你父母，寄到书院的包裹统一都会暂存在那边坡上的菜鸟驿站。今天晚上七点以前可以取。”\n\n“包裹？”\n\n我愣了一下。\n\n母亲没有和我说过这件事。\n\n至少我不记得。\n\n志愿者点点头。\n\n“应该是家里提前寄来的东西吧。很多新生都会把书和被褥先寄过来。”\n\n书。\n\n我的手指顿了一下。\n\n我当然不知道那个包裹里到底是什么。也许只是被褥、衣架、洗衣液，或者父母临时想起来替我补寄的一些生活用品。\n\n可志愿者随口提到的那个字，还是让我想起家里书架上那些过分陌生的书脊。\n\n如果包裹里真的有书，里面也许会有那个人的批注、折角，或者某一页上随手划下的线。\n\n这些东西比成绩单更私人，也更难假装和自己无关。\n\n霍钰的目光从领取单上掠过，没有好奇，也没有露出意外，只是把一卡通、宿舍信息和领取单一起整理好，递给我。\n\n“别弄丢。”\n\n她的指尖松开纸张。\n\n我接过来，道了声谢。\n\n“不用谢。”霍钰说，“A109，从木兰广场后面那条路过去，会近一点。行李箱重的话，别走正门台阶，绕一下坡道更方便。”\n\n她说得太顺。\n\n顺到我下意识抬头看了她一眼。\n\n霍钰却像是早就预料到我会疑惑，很自然地补了一句：\n\n“今天很多新生都问过。”\n\n“哦。”\n\n这个解释很合理。合理到我如果继续怀疑，就显得像某种自我意识过剩。\n\n我点点头。\n\n办理完成后，我拖着行李箱离开报到点。\n\n太阳比刚才更高了一些，广场上的人也更多了。一个家长在旁边和志愿者争论床位能不能换，一个新生蹲在地上重新绑行李绳，远处有社团提前支起了帐篷，音响里放着不知道哪一届学长学姐录的迎新歌。\n\n一切都乱糟糟地向前推进。\n\n我走出几步，忍不住回头看了一眼。\n\n尹渊站在遮阳棚的阴影里，正低头和另一个新生说话。即使隔着一段距离，我也能从他的站姿里看出那种从容：他很清楚自己在这里的位置，也很清楚别人应该怎么看他。\n\n霍钰则坐回桌后，低头整理刚刚被风吹乱的材料。她胸前的班导证轻轻晃了一下，阳光从塑料壳边缘反出一点亮光，又稍纵即逝了。\n\n我低头看向手里的领取单。\n\n收件人：姜岚。\n\n收件地址：云梦师范大学立华书院快递驿站。\n\n我把领取单收进文件袋。\n\n纸张很薄，边角被我的手指捏出了一点折痕。\n\n木兰广场后方的道路比正门安静一些，两侧种着一排排木兰树。九月已经过了花期，枝叶却仍然浓密，树影落在地面上，被风吹得轻轻晃动，像一张还没完全展开的地图，又像一行行艰深晦涩的字。\n\n我走在这片树影里。"},{"title":"第三章：A一零九","file":"3、第三章.md","text":"我拖着行李箱沿着树荫走着，箱轮碾过路面细小的接缝，发出一阵均匀的轻响。\n\n木兰树的叶片被晒得发亮，偶尔有风从枝叶间漏下来，热意稍稍散开，又很快重新聚拢。\n\n路边不断有新生和家长经过。\n\n有人拎着两个巨大的编织袋，走几步就停下来换手；有人把校园地图举到眼前，和手机导航上的箭头反复比对；还有一个女生站在树下给父母拍照，父亲紧张地整理衣领，母亲则笑着把遮阳伞收到身后，像是怕挡住镜头里的校门。\n\n立华书院是一栋灰白色建筑。正门不高，却显得很规整，门口两侧摆着几盆还没完全适应暑气的绿植，叶尖微微打卷。大厅里铺着浅色地砖，空调开得不算足，但至少能把外面的热浪挡下一半。\n\n宿管窗口在一楼左侧。\n\n窗口前排着三四个人，有人来领钥匙，有人问洗衣机在哪，还有家长隔着玻璃反复确认“晚上能不能进宿舍楼”。宿管阿姨一边翻钥匙柜，一边熟练地回答问题，语气平稳得像已经把同样的句子说过几百遍。\n\n轮到我时，我把一卡通和宿舍信息递过去。\n\n“A109，姜岚。”\n\n宿管阿姨低头扫了一眼，把一把钥匙从小格子里取出来。\n\n“钥匙收好，丢了补办。寝室门别随便敞着，贵重东西自己看好。空调遥控器在旁边箱子里，一间寝室一个，自己看好寝室号再拿。”\n\n我接过钥匙，又按她说的走到旁边那个分格塑料箱前。\n\n塑料箱里塞着许多透明袋子，每个袋子外面贴着一小块白色标签，上面用黑色马克笔字迹潦草地写着宿舍号。因为被人翻过好几次，有些袋子横着、斜着压在一起。\n\n我翻了几下。\n\nA108。\n\nA110。\n\nA107。\n\n没有A109。\n\n我的动作停了一下。\n\n寝室里已经有人到了。\n\n没错。\n\n大学生活第一个需要面对的现实问题，不是理想、爱情、学业或人生意义，而是如何和陌生室友自然打招呼。\n\n“下一个。”\n\n后面的人已经等不及地递上材料。\n\nA109在一楼走廊尽头附近。\n\n走廊比大厅安静一些，墙边堆着几只还没拆封的快递箱，偶尔有学生拿着水杯从水房方向走出来。门牌一间间从眼前掠过，A105、A106、A107……等到看见A109时，门已经开着。\n\n屋里有人。\n\n我在门口停了一下，还是抬手敲了敲门框。\n\n“请进。”\n\n回应我的是一道清晰的男声。\n\n我推着行李箱进去。\n\n寝室是四人间，上床下桌，左右各两张。靠窗的位置已经放了一个整理到一半的行李箱，桌面上摆着笔记本电脑、插线板和几本被摞得很齐的书。一个男生站在桌前，正把网线绕成不容易打结的圈。\n\n他听见动静，回过头来。\n\n“A109？”\n\n“嗯。”\n\n“李向阳。”\n\n男生朝我点了点头，语气不热络，但也不冷淡。\n\n我把行李箱拉进来。\n\n“姜岚。”\n\n李向阳的目光在我脸上停了一瞬，似乎想起了什么，但没有多问，只是指了指靠门右侧那张桌子。\n\n这让我稍微松了口气。\n\n如果他开口第一句也是“徽州一中，物竞省二，理综二百八十多”，那我可能会当场申请更换世界线。\n\n“床位贴在桌边。你应该是那边。”\n\n我看过去，果然在桌角看见一张白色小标签，上面打印着自己的名字。\n\n我把行李箱推到桌边。\n\n寝室里还有另一个人。\n\n靠里的一张椅子上坐着一个瘦高男生，黑色双肩包放在脚边，正摆弄着手中的手机。听见我进来，他抬了下头。\n\n“袁林修。”\n\n声音很轻。\n\n我也回了一句你好。\n\n袁林修点点头，又低下眼睛。\n\n作为初次见面的短暂问候就这样结束，房间里一时只剩下行李箱拉链被拉开的声音。\n\n从效率角度看，这大概是非常成功的社交。\n\n我把书包放到桌上，先没有急着收拾。\n\n桌面擦得很干净，床位标签贴在右上角，旁边还有一小块没撕干净的透明胶痕。\n\n“你刚才在宿管那边拿遥控器了吗？”\n\n李向阳的声音把我拉了回来。\n\n我转过头。\n\n“我没找到A109的。”我说，“我以为已经有人拿走了。”\n\n李向阳手里的网线停住。\n\n李向阳看了一眼袁林修，又很快收回目光。\n\n“我没拿。”李向阳说，“我来的时候，寝室里只有袁林修。”\n\n空气安静了一下。\n\n这份安静很短，短到几乎称不上尴尬，却又确实让人无法忽略。\n\n袁林修抬起头。\n\n“不是我。”\n\n并不像解释或辩解的语气。\n\n李向阳立刻说：“我不是这个意思。”\n\n“现在只是确认流程。遥控器要么在我们寝室，要么被别人拿错了。先找一下吧。”\n\n这句话比“我相信你”更有效。\n\n因为它没有把话题继续留在“谁拿了”上，而是直接把事情推进到下一步。\n\n我也弯下腰，打开桌下柜门看了一眼。柜子里空空荡荡，只有几片新家具特有的木屑。我又看了看抽屉和床梯旁边，什么都没有。\n\n李向阳检查得更细。\n\n桌面、抽屉、床板边缘、窗台、衣柜上层，他都看了一遍，还顺手把墙上的空调插座和电源开关确认了一下。\n\n“应该不在寝室。”\n\n他说。\n\n袁林修没有说话，只是把自己脚边的包提起来，让我们看清下面也没有东西。\n\n就在这时，门外传来一阵拖箱子的声音。\n\n那声音先是在走廊尽头响起，随后越来越近，中间还夹着某个人压低却依然明显的喘气声。\n\n“请问……A109是这儿吗？”\n\n门口探进来一个人。\n\n那是个个子很高的男生，肩膀宽，背上背着一个鼓鼓囊囊的双肩包，左右两只手各拖着一个行李箱。额前的头发被汗水打湿了一点，脸上的表情却很诚恳。\n\n“是。”李向阳说。\n\n男生像是终于看见了安全区，松了口气。\n\n“太好了！兄弟们。”\n\n我下意识让开位置，顺手帮他扶住其中一只箱子。\n\n“谢了谢了。”\n\n男生把行李推进来，抬手擦了把汗。\n\n“我叫朱铭，松江人。物理班。”\n\n他说完，又看了一圈屋里。\n\n“你们这是……已经开始寝室会议了？”\n\n“空调遥控器找不到。”我说。\n\n朱铭看了一眼头顶安静得近乎冷漠的空调。\n\n“那确实是重大议题。”\n\n他说这句话时很认真，让气氛稍微松了一点。\n\n有些人天生适合在尴尬场合里把空气搅动一下。\n\n李向阳简单把情况说了一遍。\n\n朱铭听完，把刚放下的箱子往旁边一推。\n\n“那再找一遍吧。我看桌底和床下。”\n\n他说完就蹲下身。\n\n这次四个人都动了起来。\n\n李向阳负责把可能藏东西的位置按顺序排查，袁林修爬到床梯上，确认了空调上也没有放着什么东西。朱铭蹲在地上，甚至把门后也看了一遍。我则翻了翻自己刚推来的行李旁边，虽然我知道遥控器不可能凭空混进我的箱子里。\n\n几分钟后，结论没有变化。\n\n遥控器不在A109。\n\n屋里闷热得厉害。\n\n“去宿管那边问问吧。”李向阳说，“应该不是我们的问题。”\n\n朱铭立刻直起身。\n\n“走。”\n\n袁林修也跟了出来。\n\n我本来以为这件事最多两个人去就够了，可几个人都已经迈出门，我也只好把钥匙带上，走在最后。\n\n宿管窗口前的人比刚才少了一些。\n\n阿姨正低头整理钥匙，听见我们说明来意，抬头看了四个男生一眼。\n\n“箱子就在那边，你们自己拿的，我哪知道谁拿了哪个。”\n\n“阿姨。”李向阳说，“我们想看看是不是其他寝室拿错了。”\n\n宿管阿姨显然见过太多开学第一天的小混乱，虽然绝对算不上热情，但还是把旁边的塑料箱往我们这边拖了拖。\n\n“自己看，别翻乱啊。”\n\n李向阳没有立刻去翻相邻寝室。\n\n“先别看缺了哪些。”李向阳说，“今天有人早来有人晚来，袋子少几个不说明问题。”\n\n朱铭站在旁边，小声说：“那看什么？”\n\n“看哪个号容易被认错。”\n\n我看着那只塑料箱。\n\n透明袋上贴的标签都出自同一支黑色马克笔，字迹不算难看，但因为写得急，有些数字被拉得很长。尤其是“1”，常常只是一道竖线；“9”的圆圈被压得扁扁的，尾巴往下拖。\n\n“不一定是相邻编号。”\n\n我开口。\n\n李向阳看向我。\n\n我指了指箱子里那些歪斜的标签。\n\n“如果拿的时候袋子是倒着的，可能就不是按正常顺序看错。”\n\n李向阳没有立刻开口。他低头看了两秒，很快就顺着这个思路往下走。\n\n“倒着看……”\n\n袁林修刚才一直站在旁边没说话。这时，他忽然指了指箱子里那些倒放的标签。\n\n“109倒过来，不就是601吗？”\n\n这句话落下后，几个人都安静了一瞬。\n\n朱铭低头看了看袋子。\n\n“还真像。”\n\n李向阳立刻在箱子另一侧翻了翻。\n\n“A601……”\n\n他把一个袋子抽出来。\n\n袋子里装着遥控器，白色标签上写着“A601”。\n\n它还在。\n\n李向阳看了一眼，眉头终于松开一点。\n\n“那就对上了。A601的遥控器还在，A109的不见了。大概率是601把我们的拿错了。”\n\n“601？”\n\n朱铭抬头看了看楼梯方向。\n\n立华书院A区的一到三层是男寝，四到六层是女寝。\n\n所以，601并不在我们可以随便上去确认的范围里。\n\n几个人几乎是同时意识到这一点。\n\n气氛变得有点微妙。\n\n朱铭摸了摸鼻子。\n\n“这个问题突然变得不适合由我方自行解决了。”\n\n李向阳看了一眼宿管窗口。\n\n按理说，最稳妥的办法当然是请宿管阿姨帮忙问一声。可此刻阿姨正低头给下一个新生找钥匙，窗口外又排起了队。一个家长半个身子探到玻璃前，追问水卡在哪里办；后面还有人拖着行李箱，轮子卡在门槛处，发出一阵不耐烦的响动。\n\n更麻烦的是，我们手里只有一个推断。\n\nA601的遥控器还在，不代表A109的一定就在601手里。万一不是，几个刚入学的男生围在宿管窗口前，请阿姨帮忙联系女寝，只为了问一句“你们是不是拿了我们的遥控器”，听起来多少有些难以启齿。\n\n尤其是在我们甚至还没有完全记住彼此名字的情况下。\n\n朱铭大概也想到了这一层，刚才那点玩笑劲也收了回去。\n\n“要不……”朱铭迟疑了一下，“先回去等等？”\n\n我也觉得这是眼下最不尴尬的选择。\n\n虽然没有空调的A109很难称得上适合等待，但比起在宿管窗口前继续研究女寝遥控器归属问题，回去热一会儿似乎还更体面一点。\n\n我刚想点头，楼梯那边忽然传来急促的脚步声。\n\n一个穿着白色短袖的短发女生从楼梯口处一路小跑了下来，手里还拿着一个袋子。\n\n虽然跑得有些急，却不显得狼狈，反而带一股明亮的生气。\n\n像是开学季里少见的那种，明明也很忙，却仍然能把忙乱处理得很自然的人。\n\n她先看了一眼宿管窗口旁边的塑料箱，又看见站在箱子旁的几个男生，脚步慢了半拍。\n\n女生低头看了一眼手里袋子上的标签，又把它翻过来，再翻回来。\n\n她像是确认了什么，抬头看向我们。\n\n“请问是A109的同学吗？”\n\n李向阳点头。\n\n女生双手把袋子递过来，很认真地弯了下腰。\n\n“对不起！我们寝室拿错了。”\n\n这一下太正式，反而让几个男生都有点不好意思。\n\n朱铭下意识往旁边让了半步。\n\n“没事没事，也没造成什么严重后果。”\n\n女生直起身，脸上露出一点歉意的笑。\n\n“刚才是我室友顺手领的。她拿回去以后把袋子往桌上一放，我一看，心想我们寝室什么时候改名叫A109了。”\n\n她说到这里，又有些不好意思地笑了笑。\n\n李向阳接过袋子。\n\n“开学第一天事情多，弄错很正常。”\n\n“主要是这个字真的有点像。”\n\n李向阳把刚才翻出来的写着A601的袋子递给她。\n\n“这个应该才是你们的。”\n\n“谢谢。”\n\n女生接过真正属于她们寝室的遥控器。\n\n“你们看，倒过来以后是不是很像109？”\n\n朱铭点头。\n\n“确实容易看错。”\n\n我也跟着看了一眼。\n\n从109到601，只需要一个倒置的视角。\n\n女生笑了一下。\n\n她把A601的袋子抱回怀里，又转向我们。\n\n“我叫王伊，物理班的。以后见面，还请不要第一时间就想起空调遥控器这件事噢。”\n\n朱铭想了想，很认真地点头。\n\n“那我们就记住你是把遥控器送回来的人。”\n\n王伊眨了眨眼。\n\n“这个版本听起来好多了。”\n\n她说这话时笑得很轻，刚才那点尴尬也就跟着淡了下去。\n\n李向阳报了自己的名字，又顺手介绍了另外三个人。\n\n介绍到袁林修时，袁林修只是点头。王伊却没有露出任何被冷落的神色，很自然地也朝他点了点头，像是完全接受每个人有不同的回应方式。\n\n最后轮到我。\n\n“姜岚。”\n\n我说。\n\n王伊看了我一眼。\n\n那一眼很短，几乎和看其他人没有区别。\n\n“你好。”\n\n王伊又向我们道了一次歉，才拿着A601的遥控器转身上楼。\n\n等她的身影消失在楼梯转角，朱铭才看向手里的A109遥控器。\n\n“走吧，复活仪式。”\n\n李向阳纠正他：“只是开空调。”\n\n“差别不大。”\n\n几个人回到A109。\n\n进门后，李向阳把遥控器取出来，按下开关键。\n\n空调发出“滴”的一声。\n\n几秒后，送风口缓缓打开。\n\n朱铭站在下面等了一会儿，伸手试了试。\n\n“有风。”\n\n他说这句话时的语气，郑重得像宣布某项科学实验成功。\n\n我把书包从桌上拿下来，终于开始收拾自己的东西。\n\n我带来的行李不算多。衣服被母亲分门别类装进几个收纳袋，常用药和充电器放在最容易拿的位置，洗漱用品外面还套着防水袋。每样东西都被安排得很妥帖，妥帖到我几乎不需要思考。\n\n朱铭那边则是另一种风格。\n\n他打开第一个行李箱时，里面最上层是一件厚外套。\n\n李向阳看了一眼。\n\n“你带这个来云梦？”\n\n朱铭把外套拿起来，也沉默了一下。\n\n“我妈说南方没有暖气，冬天冷。”\n\n“她说得也没错。”李向阳说，“只是现在九月。”\n\n朱铭把外套叠好放进衣柜。\n\n“这叫战略储备。”\n\n袁林修终于开口：“占地方。”\n\n朱铭转头看袁林修。\n\n袁林修补了一句：“柜子不大。”\n\n朱铭低头看了看自己的两个箱子，又看了看衣柜，表情严肃起来。\n\n“有道理。”\n\n他没有反驳，而是真的开始重新规划空间。\n\n我发现，朱铭虽然说话偶尔跳脱，做事却并不马虎。\n\n李向阳则很快进入了某种管理状态。\n\n他没有宣布自己要负责什么，只是在收拾自己的东西时顺手确认了寝室里的插座、网口、水电缴费方式，又提醒大家空调温度别调太低，第一天空调滤网可能有灰，最好先开送风。\n\n这些话不算令人讨厌。\n\n至少比“以后寝室听我的安排”要好得多。\n\n袁林修依旧话少。他的行李也少，一个箱子，一个背包，很快就把东西放好。别人说话时他大多不接，只在确实需要的时候给出简短回应。\n\n我把几件衣服挂进柜子，回头看了一眼这间刚刚因为一个遥控器而折腾了半天的寝室。\n\n四张床，四张桌子，四个来自不同地方的人。\n\n还有一台终于开始工作的空调。\n\n不知为什么，我觉得比刚进门时稍微真实了一点。\n\n我把文件袋从书包夹层里拿出来时，里面的包裹领取单滑到桌面上。\n\n我低头看见那张纸，又想起来了还有这件事。\n\n领取单背面贴着一张小小的提示纸。\n\n> 请于当天19:00前凭取件码领取。\n\n“快递？”\n\n床位相邻的朱铭正在靠近我的这一侧整理柜子，恰巧就瞥到了一眼。\n\n“嗯。家里寄的。”我说。\n\n“包裹大吗？”\n\n“不知道。”\n\n“装的是啥？”\n\n“嗯…不太清楚。”\n\n“我和你一块儿去吧。”朱铭把柜门关上，“如果是被褥之类的，一个人搬麻烦。”\n\n我本来想说不用，可奈何朱铭盛情难却，最后还是点了点头。\n\n“谢谢。”\n\n“客气啥。”朱铭说，“正好熟悉一下地形，免得今晚吃饭迷路。”\n\n快递驿站在立华书院出门右手边，大概要往上走一百米。\n\n宿舍楼后面就是云麓山。山坡并不陡，却足够让拖着行李箱的新生走几步就开始后悔自己为什么带了那么多东西。路边的树荫往下斜斜压着，蝉声贴在叶片后面，叫得人心里发热。\n\n驿站开在坡上的一排小门面里，门口比我想象中窄得多。两边堆着刚拆开的快递袋和纸箱，中间只留出一条勉强能让两个人错身的通道。有人抱着被褥往外挤，有人低头扫码取件，印着logo的电动三轮车停在门边，把本来就不宽的入口又占去一截。\n\n里面堆满了新生提前寄来的行李箱、纸箱和编织袋，快递单上的名字密密麻麻贴在外面。门口排着几个人，队伍走得不快，因为不少包裹都被压在里面，工作人员每找一个都要弯腰翻半天。\n\n排在我前面的是个卷发男生。\n\n他穿着一件白T恤，胸前印着一团黑色线条。离得近了，我才看清那图案像一只眼睛，瞳孔里套着齿轮、书页和一小截断开的锁链。图案下方有一行很小的英文，最后一个单词是“freedom”。\n\n工作人员从货架下层拖出一个纸箱时，那男生立刻蹲下去扶了一把。\n\n箱子看起来不大，却沉得有些夸张。工作人员刚松手，纸箱一角的胶带就被压得裂开了一点，里面露出几本书脊。有一本封面是深蓝色，另一本书名长得几乎占满整个书脊，我只扫到“存在”“历史”“批判”几个字。\n\n朱铭看着那只纸箱，表情里有一种同病相怜的敬意。\n\n“你这都是书？”\n\n卷发男生抬头看了我一眼，似乎有些惊讶于朱铭的自来熟。\n\n“不然呢？”\n\n他说着把箱子往旁边挪了挪，又从工作人员手里接过签字笔。\n\n“谷懿。哲学系。”\n\n这句话像是顺手递出来的自我介绍，并没有特意对准谁。\n\n朱铭也顺口接上。\n\n“朱铭。立华书院物理。”\n\n“物理好啊。”谷懿在单子上签完名，把笔还回去，“研究世界如何运动。不过我们更多时候是在问：它为什么要这样运动。”\n\n朱铭想了想。\n\n“那世界要是说它也不知道呢？”\n\n“那就说明你已经初步理解哲学了。”\n\n谷懿说这话时很认真，认真到我一时间分不清他是不是在开玩笑。\n\n这大概就是哲学系的可怕之处：他们说玩笑时像在讲真理，讲真理时又像在开玩笑。\n\n轮到我时，工作人员按领取单上的编号找了半天，最后从角落里搬出一个中等大小的纸箱。\n\n箱子不算特别大，却比看上去沉得多。\n\n朱铭伸手掂了一下。\n\n“好家伙，这重量不像被褥。”\n\n我接过一边。\n\n“可能是书。”\n\n谷懿刚把自己的箱子扶起来，听见这句，目光立刻转了过来。\n\n“书？”\n\n我还没来得及回答，朱铭已经替我点头。\n\n“八成是。”\n\n谷懿看向我，眼神忽然亲切了几分。\n\n“同道中人？”\n\n这个问题来得太快，我只好含糊地说：“可能吧。”\n\n“可能吧？”\n\n谷懿像是对这个答案很满意。\n\n“很好，至少不是那种只背了两个书名就急着给自己贴标签的人。”\n\n我沉默了。\n\n他说得很有道理。问题是我连那两个书名都未必背得熟。\n\n朱铭转头看我，小声说：“你听懂了吗？”\n\n我也小声回答：“没有。”\n\n谷懿倒不介意，反而笑了笑。他把自己那只快要裂开的纸箱抱起来，箱底明显往下坠了一点。\n\n“我先回去抢救一下人类思想史。”\n\n他说完，抱着箱子向外走去，临了出门前又补了一句：\n\n“友情提醒，书这种东西，买的时候很轻，搬的时候才会显露本质。”\n\n朱铭看着他的背影。\n\n“哲学系都这么聊天吗？”\n\n我扶着自己的纸箱，诚实地说：“我也不知道。”\n\n但我隐约觉得，自己可能遇到了一个很麻烦的人。\n\n“看来你家是打算让你刚开学就进入学习状态。”\n\n这句话说完，两个人都笑了一下。\n\n回到寝室后，门一推开，冷气就从屋里扑了出来。李向阳坐在桌前整理校园卡和各种报到材料，袁林修则戴上耳机，安静地看手机。\n\n我用钥匙划开纸箱胶带。\n\n最上面是一只透明收纳袋，里面装着两条毛巾、一卷晾衣绳，还有些其余的杂物。旁边还塞着一张折起来的便签。\n\n我把便签拿出来。\n\n> 书是从你书架上收的，想看的时候就看。不想看就先放着，别勉强自己。\n>\n> 记得报平安。\n\n字写得不算漂亮，却很认真。\n\n我盯着“别勉强自己”几个字看了一会儿，把便签重新折好，放进抽屉。\n\n再往下，果然是书。\n\n《普通物理学》。\n\n《力学》。\n\n《电磁学》。\n\n还有几本封面更旧一些的书，被牛皮纸包过，书脊上有轻微磨损。我把它们一本本拿出来，动作不自觉放慢。\n\n直到一本厚重的黑色书脊露出来。\n\n《资本论》。\n\n我的手指停在封面边缘。\n\n我当然知道这本书。\n\n更准确地说，我已经在另一个姜岚的记忆和记录中，反复见过与它相关的影子。那些影子像很远处的灯，有时亮一下，有时又沉进雾里。\n\n可真正把它从纸箱里拿出来时，我还是觉得心口微微发紧。\n\n这不像一本书，更像某种被人小心寄来的旧物，等我自己决定要不要翻开。\n\n“是书吧？”\n\n朱铭看见我的动作，随口问了一句。\n\n我回过神。\n\n“嗯。”\n\n我把剩下的书取出来，按大小放进书架。那本《资本论》被我放在最里面，书脊朝外，黑色封面在一排教材中显得格外沉默。\n\n我忙完这些后顺手摸出手机看时间，屏幕刚亮起来，就弹出了一条消息。\n\n立华书院新生群里，尹渊发了一条通知。\n\n> 全体21级新生，于今晚19:00在联云讲堂召开军训动员会。请至少提前十分钟到场，不要迟到。\n\n“今晚就动员会？”\n\n朱铭刚把最后一件衣服放进柜子。\n\n“我还以为今天的主要任务是把床铺出来。”\n\n下面很快又弹出一条消息。\n\n发信人是霍钰。\n\n> 不熟悉路的同学，可以18:40在立华书院门口集合，会有班导带路。\n\n李向阳把通知读完，说：“要不先一起去食堂吃个饭吧。六点半左右从寝室走，时间应该够。”\n\n“可以。”朱铭立刻点头，“我现在对食堂的期待，比对军训动员会高很多。”\n\n窗外的太阳还没落下去，楼外依旧亮得晃眼。\n\n我把手机放到桌面上，又把书架最里面那本《资本论》往里推了推。\n\n黑色书脊被几本物理教材遮住一半。\n\n“走吗？”\n\n朱铭已经拿起饭卡，站在门口回头看我。\n\n“走吧。”\n\n门被带上时，A109的空调还在身后安静地吹着冷风。"},{"title":"第四章：名为军训","file":"4、第四章.md","text":"晚饭吃得比朱铭想象中仓促。\n\n朱铭原本还打算认真评价一下云梦师大食堂，甚至已经从窗口数量、排队速度和菜系、色泽四个角度搭好了发言框架。可惜刚坐下没多久，班群里就弹出新的通知。\n\n> 全体21级新生，请于18:40前至联云讲堂侧门领取军训服。\n>\n> 领取后按要求穿戴整齐，19:00于联云讲堂召开军训动员大会。\n>\n> 请各位同学不要迟到。\n\n朱铭低头看了眼自己刚扒了没几口的饭。\n\n“大学生活第一天，就开始和晚饭抢时间。”\n\n李向阳看了眼时间。\n\n“现在过去来得及。先吃完，不用急。”\n\n“话虽如此。”朱铭说，“可更换穿戴好军训服还需要时间吧。”\n\n李向阳把手机放回桌边。\n\n“那就快点。”\n\n我原本没什么胃口，听见这句，还是把筷子重新拿稳了。\n\n而一旁的朱铭已经开始埋头扒饭。\n\n我们没有在食堂多停留。外面天色还没有完全暗下去，酷热的温度像是在提醒白天还没有结束，只有少许阳光悄悄退到了树叶后面。\n\n两旁的路灯却已一盏盏亮起来，把地面照出一片片淡黄色的光。白天喧闹的校园在傍晚短暂地空了一层，像是还没来得及换气。\n\n联云讲堂侧门却正好相反。\n\n那里已经排起了队。\n\n几张折叠桌临时拼在一起，后面堆着一排纸箱。纸箱外侧用粗马克笔写着尺码：上衣170、175、180，裤子170、175、180，作训鞋39、40、41、42。还有几个箱子的字被胶带遮住一半，只能看见“混码”两个字。\n\n军训服被装在透明塑料袋里，深浅不一的迷彩色挤在一起。袋子里还塞着帽子、腰带和一双黑色作训鞋。新布料、塑料袋、橡胶鞋底和纸箱受潮后的味道混在空气里，被傍晚的热气一蒸，闻起来像某种刚从仓库里搬出来的二手旧物。\n\n我排在队伍中间，前后都是身着短袖的新生。\n\n有人拿到袋子后当场拆开，把上衣往身前一比，立刻皱起脸。\n\n“这也太大了吧？”\n\n“大的拿腰带扎一下。”发放军训服的学长头也没抬，“后面还有人，先别堵着。”\n\n旁边一个女生抱着鞋盒问：“学长，请问有没有三十七码的鞋子？”\n\n“先拿三十八。”另一个负责发鞋的学生说，“鞋码不够，明天再统一换。”\n\n“可是我穿三十八会掉。”\n\n“那就垫鞋垫。”\n\n那人说得很快，语气中毫不掩饰的不耐烦。\n\n女生抿了抿嘴，没有继续说，只把那双明显不合脚的鞋抱回怀里，往旁边退了一步。\n\n队伍继续往前动。\n\n我看着她站在台阶边，手指无意识地抠着鞋盒边缘。那双鞋的盒盖没有合紧，里面的黑色鞋面露出来一截，显得比她的脚踝还要宽。\n\n这当然不是什么大事。\n\n至少在这个场合里，所有人都会觉得这不是什么大事。鞋大一点，衣服肥一点，帽子歪一点，忍一忍就过去了。军训本来就不是让人舒服的。发放的人忙，新生多，尺码总会不合适，谁都能说出一长串理由。\n\n我甚至已经替对方把理由想好了。\n\n可正因为这些理由都很合理，我才觉得心里有些发闷。\n\n可这时，另一侧队伍里一个有些熟悉的身影离开了队伍。\n\n是王伊，还穿着下午那件白色的短袖。她没有直接挡在发鞋的人面前，而是等对方把下一双鞋递完，才很自然地上前搭话。\n\n“不好意思，打扰一下。”\n\n发鞋的男生抬头看向她。\n\n“怎么了？”\n\n“这位同学的那双鞋真的太大了。”王伊指了指旁边的女生，语气很轻，“能不能再帮忙看一眼，有没有合适的鞋码？如果现在没有，我就陪她明天再来换。但她今晚就要穿去动员会，鞋掉了会很尴尬的吧？”\n\n男生看了眼女生怀里的鞋盒，又看了眼后面还在排队的人。\n\n“三十七真不一定有。”\n\n“那边不是还有一箱没拆吗？”王伊指了指桌下压着的纸箱，“上面好像写了37到38混码。要不我也来一起找，两个人翻得快一点。”\n\n她说完已经弯下了腰，蹲下去拽住了纸箱边缘。\n\n动作太自然了。\n\n自然到那个男生连“不行”或是“不用”都没来得及说，只好一起把箱子拖了出来。\n\n纸箱被胶带封得很紧，王伊从口袋里摸出一枚小小的钥匙，钥匙尖沿着胶带划开。\n\n“不好意思，耽误大家半分钟。”\n\n后面的几位同学摆了摆手。\n\n“没事。”\n\n箱子刚一打开，二人就毫不费力地从中找出了一双三十七码鞋。\n\n王伊回头，把鞋递给了那位女生。\n\n“你试试？”\n\n女生明显松了口气，小声说了句谢谢。\n\n王伊笑着摇头。\n\n“不客气。军训还没开始，先别被鞋打败。”\n\n这句话说得有点俏皮，旁边几个人都笑了。刚才那点因为排队和尺码积起来的烦躁，也被她轻轻带过去了。\n\n我站在队伍里，看着王伊把纸箱重新推回桌下，又拍拍手站起来。\n\n她没有做什么惊天动地的事。\n\n只是刚好在别人退到一边时，往前走了一步。\n\n“姜岚。”\n\n李向阳的声音从前面传来。\n\n我回过神了，才发现这列已经排到我了。\n\n“身高？”发放军训服的学长问。\n\n“一七零。”\n\n对方从箱子里抽出一套，熟练地递给我。\n\n我低头看了一眼，袋子里的迷彩上衣被折得方方正正，帽檐被压在腰带下面，露出一截硬硬的弧度。\n\n朱铭领到的是一八零码。\n\n李向阳已经在自言自语地确认袋子里的东西是否齐全。\n\n“上衣、裤子、帽子、腰带、鞋……”\n\n“李哥。”朱铭说，“你检查东西的样子很像那种会提前三天把旅行清单打印出来的人。”\n\n“不打印。”李向阳说，“手机备忘录就够了。”\n\n讲堂后方临时开放了几间空教室给新生换衣服。\n\n推开门，教室里挤满了人，桌椅被推到墙边，大家把塑料袋放在桌上或地上，动作别扭地换着那套还带着折痕的军训服。\n\n迷彩上衣比我想象中硬。\n\n布料擦过手臂时有一点粗糙，领口内侧的标签扎在后颈，腰带扣是廉价金属，扣上时发出一声轻响。裤腰偏松，裤脚又有些长，鞋底薄得几乎能隔着地面感到瓷砖的硬度。\n\n教室里到处都是一阵窸窸窣窣和金属片碰撞的声音。有人对着手机屏幕整理帽子，有人把腰带扣反了又拆开重扣，有人一边系鞋带一边抱怨这鞋像没有缓冲。\n\n朱铭的裤脚明显长了一截，他低头看了几秒，最后把裤脚往上折了一道。\n\n“看起来咋样？”\n\n我看了他一眼。\n\n“反正不像军人。”\n\n“行。”\n\n李向阳正在把腰带多出来的部分塞进腰侧。\n\n“先这样吧。动员会结束再回去调整。”\n\n我也低头整理自己的袖口。迷彩布料贴在皮肤上，汗意很快从后背冒出来。刚才那股塑料和橡胶的味道没有散，反而因为大家都换上同样的衣服，而变得更加明显。\n\n我忽然有一瞬间的恍惚。\n\n不是车灯，也不是医院。\n\n而是一间闷热的屋子。很多双相似的鞋踩在水泥地上，空气里有机油、汗味和某种廉价胶水的气味。有个人站在门口喊着：“发什么就穿什么，干活哪有那么多合不合适。”\n\n那声音很近，又像隔着很厚的一层水。\n\n我抬起头。\n\n教室仍旧是教室。\n\n窗外的天色一点点暗了下去，走廊里有班导在催促新生入场。\n\n“走吧。”李向阳说，“差不多该进去了。”\n\n我把换下来的衣服塞进袋子里，和他们一起走出教室。\n\n联云讲堂比想象中大。\n\n灯光已经全部打开，冷白色的光从头顶照下来，把每个人身上的迷彩都照得颜色发浅。空调开得很足，刚从外面进来时甚至有些冷。可人一多，热气和布料味又很快在座位之间浮起来。\n\n新生陆续入场。\n\n大家都穿着相似的军训服，抱着塑料袋和鞋盒，动作还不太习惯。有人帽子歪着，有人腰带松着，有人裤脚折得一边高一边低。椅脚摩擦地面，塑料袋被踩到时发出沙沙声，低声说话的声音在讲堂里散开。\n\n朱铭看了一眼。\n\n“坐哪？”\n\n李向阳说：“中间靠前吧。太前面不方便，太后面容易听不清。”\n\n“这判断很有经验。”朱铭说。\n\n“常识。”\n\n我们最后在第六排偏右的位置坐下。前排中间坐着几位老师和班导，桌上放着矿泉水和打印好的会议流程。靠近讲台的位置太亮，也太安静，而且一坐过去就会被几乎所有人看见。\n\n我刚把塑料袋放到脚边，就看见谷懿从另一侧过道走进来。\n\n他也穿着军训服。\n\n可不知道为什么，同样一套衣服穿在他身上，仍然有一种不太服帖的感觉。帽子被他夹在胳膊下，领口里面露出那件白T恤的一角，黑色线条从迷彩领口边缘探出来，像没有被完全遮住的某种注释。\n\n谷懿显然也看见了我。\n\n他隔着几排座位朝这边抬了抬下巴，算是打招呼。\n\n距离通知里的十九点还有十分钟。\n\n讲堂里已经坐了大半。\n\n班导们站在过道两侧维持秩序，提醒后来的学生往里坐。尹渊站在前排左侧，手里拿着一份名单，时不时低头确认人数。他穿着干净的白衬衫，在一群迷彩服之间显得格外清爽。\n\n霍钰则站在另一侧，长发被挽了起来，比坐在遮阳棚下时少了几分被暑气困住的匆忙。\n\n我原本只是想确认班导站在哪边，视线却在她身上多余地停了一下。\n\n十九点整，会议没有开始。\n\n十九点零三分，讲堂里的说话声开始变多。\n\n又过了几分钟，后排开始有人低声抱怨“不是说不要迟到吗”。旁边的人笑了一声，又很快压低声音。班导们没有说什么，只是偶尔回头看向入口。\n\n朱铭靠在椅背上，小声说：“我们收到的通知时间，和领导们的压根不是同一个时间吧？”\n\n李向阳说：“正式会议一般会预留组织时间。”\n\n“你这句话听起来像替别人开脱。”\n\n“只是陈述事实。”\n\n朱铭转头看向我。\n\n“姜哥，如何评价？”\n\n我刚想回答，讲堂入口处忽然传来整齐的脚步声。\n\n声音并不大，却很齐。\n\n原本散在空气里的低语像被一只看不见的手按住，慢慢停了下来。所有人都下意识朝门口看去。\n\n一队穿着统一制服的教官从侧门进入。\n\n他们不是普通地走进来，而是排成两列，步伐整齐地穿过过道。靴底落在地面上，声音一下一下敲在讲堂里。\n\n他们身上的那套衣服显然和发给新生的军训服不是同一种东西。新生们的迷彩布料薄而松，折痕还没散开，有些人的裤脚甚至堆在鞋面上；他们的衣服却挺括得多，肩线、腰带、帽檐都被压在恰到好处的位置，袖口也像被某种看不见的尺子量过。\n\n教官们在讲台前停下。\n\n为首的男人个子不算特别高，肩背却绷得很直。他站定后没有立刻说话，只用目光从后排扫到前排，又从左侧扫到右侧。\n\n讲堂彻底安静下来。\n\n几秒后，他突然开口。\n\n“后排的，往前坐。”\n\n没有用麦克风。\n\n后排的学生愣了一下。\n\n“没听见？”\n\n教官的声音陡然拔高。\n\n“我说后排全部往前坐！前面空着这么多位置，你们是来看戏的，还是来开会的？”\n\n后排这才开始动。\n\n椅脚拖过地面，塑料袋被人慌乱地拎起。有人弯腰去捡掉下去的帽子，动作稍微慢了一点。\n\n“快点！”\n\n男人盯着那片移动的人群。\n\n“走个路拖拖拉拉，像什么样子？没人教过你们怎么排队，怎么走路吗？”\n\n几个正在过道里挪位置的学生明显僵了一下。\n\n拥挤中，一个男生手里的袋子掉到了地上，袋子散开，里面的鞋滚出半只。他刚想弯腰去捡，讲台上，教官的声音又压下来。\n\n“看路！这点协调能力都没有，明天到了训练场怎么办？”\n\n男生的脸一下子红了。\n\n我坐在第六排，没有被要求移动。可我却觉得自己的后背也跟着绷紧了。\n\n等后排学生全部坐下，教官才走到讲台中央，拿起麦克风。\n\n音响里传出一声刺耳的啸叫。\n\n不少人下意识皱眉。\n\n“我叫毛锐，是你们这次军训的总教官。”\n\n他停顿了一下，目光扫视着台下。\n\n“从今天晚上开始，到军训结束，你们见到我，要喊毛教官。见到其他教官，也要喊‘教官好！’听明白没有？”\n\n“听明白了。”\n\n台下响起稀稀拉拉的回答。\n\n毛锐帽檐下的神情显得阴晴不定。\n\n“听不见！”\n\n这一次，声音大了一些。\n\n“听明白了！”\n\n“还是听不见！”\n\n“听明白了！”\n\n讲堂里的声音被迫抬高，撞到墙面后又反弹回来。\n\n我也跟着喊了，身边所有人都在喊，于是我的声音也被卷了进去。\n\n毛锐这才稍微点头。\n\n“你们能考进云梦师范大学，说明脑子应该都不差。尤其是立华书院，听说都是各个专业的优秀学生。”\n\n他说到“优秀学生”时，语气里没有赞赏。\n\n更像是把这四个字拎起来，放在手里掂了掂，然后不怎么满意地丢回去。\n\n“但是我告诉你们，到了训练场，没人管你以前考多少分，拿过什么奖，家里什么条件。军训只有一条，服从命令。”\n\n他抬起手，指了指台下。\n\n“衣服不合身，自己克服。鞋磨脚，自己克服。天气热，自己克服。站着累，自己克服。你们不是来这里享受的，也不是来这里跟教官讨价还价的。”\n\n刚才换衣服时闪过的那点画面，又在脑子里浮起来。\n\n闷热的屋子。\n\n水泥地。\n\n很多双相似的鞋。\n\n有人低着头，把右手往袖口里藏了藏。\n\n“忍两天就习惯了。”\n\n下一秒，画面被毛锐的声音撕开。\n\n“明天早上六点二十，所有人在木兰广场集合。迟到一个人，全阵加练。队伍里有一个人不听指挥，全阵加练。你们可以不服气，但不服气也给我憋着。听懂没有？”\n\n“听懂了！”\n\n这一次，几乎没有人敢压低声音。\n\n毛锐把麦克风放回桌上。\n\n“好。希望你们明天也能这么有精神。”\n\n他坐下时，讲堂里安静得只能听见空调送风的声音。\n\n我低头看了一眼自己的鞋。\n\n深绿色的军训鞋整齐地踩在地面上。鞋尖和旁边人的鞋尖几乎平行，好像刚才那些散乱的脚步，也终于被台上的声音按成了同一个方向。\n\n随后上台的是辅导员彭悦。\n\n她没有穿军装，站到麦克风前时先微笑了一下。\n\n“同学们好，我是你们未来四年的辅导员，彭悦。”\n\n她的声音比毛锐柔和许多，讲堂里的空气也终于松了一点。\n\n不过她接下来的话，依旧是那些大家大概都能猜到的内容：\n\n进入大学是新的起点，军训是磨炼意志的重要一课，希望大家增强组织纪律观念，培养集体荣誉感，展现立华学子的精神风貌。\n\n字句都很整齐。\n\n整齐得像宣传栏里刚贴上去的纸。\n\n我跟着鼓掌。\n\n彭悦讲话后，是各班班导自我介绍。\n\n前面几个班导依次站起来，介绍姓名、专业和联系方式。\n\n班导说到底也只是比我们大上一、两届的学生。\n\n有人紧张，有人熟练，也有人试图讲两句轻松的话，却因为刚才毛锐留下的气氛，没有多少人敢笑得太大声。\n\n很快轮到了尹渊。\n\n他站起身，转向台下。\n\n“各位学弟学妹好，我叫尹渊，是19级立华书院物理班学生，也是物理班的班导。”\n\n他的声音清晰、稳定，和白天在报到点时一样，带着一种很容易让人相信他知道自己在做什么的从容。\n\n“我入学以来担任过班级团支书，获得过校一等奖学金，也参加过建模竞赛和一些科研项目。选择担任班导，是希望能在大家刚进入大学时提供一些帮助，也希望大家尽快适应立华书院的节奏。”\n\n他停了一下。\n\n“立华书院给大家的资源，比普通班级更多一些。更多资源当然意味着更多机会，但也意味着更高的标准。”\n\n他的语气非常礼貌，听起来却透着一丝丝的压力。\n\n“大学和高中不一样，不会有人每天盯着你。你可以选择放松，也可以选择继续严格要求自己。四年的时间里，差距往往就是这样拉开的。”\n\n台下安静了一点。\n\n“我知道大家能进这里，已经证明过一次自己。但过去的证明只代表过去。立华书院不缺聪明的人，也不缺高考成绩好的人。真正能留下优势的，是自律、效率，以及对规则的适应能力。”\n\n他说到“适应能力”时，目光很自然地从台下扫过。\n\n“所以我希望大家从第一天开始，就用更高的标准要求自己。军训也是一样。它不只是让大家晒太阳、站队列，而是让你们尽快明白：集体生活里，规则永远先于个人感受。之后学习和生活上如果遇到问题，可以来找我，但我也希望大家先学会自己解决问题。”\n\n台下响起掌声。\n\n下一位是霍钰。\n\n她站起来时，前排有几个男生明显坐直了一点。朱铭也下意识看过去，小声说：“霍学姐人气很高啊。”\n\n李向阳看着台上，声音压得很低。\n\n“她本来就很有名。”\n\n“为什么？”\n\n李向阳顿了一下。\n\n“很多原因。”\n\n朱铭还想追问，霍钰已经走到麦克风前。\n\n麦克风架对她来说稍微高了一点。她伸手调低时，音响又发出一声很轻的杂音。她愣了半秒，随即笑了笑。\n\n“不好意思，今晚大家的耳朵辛苦了。”\n\n台下终于有了几声很轻的笑。\n\n她没有拿稿子。\n\n“大家好，我叫霍钰，也是19级立华书院物理班学生，之后会和尹渊一起担任物理班班导。”\n\n她说话时语速不快，声音也不高，却很容易让人听清。\n\n“今天大家刚报到，应该已经被流程、材料、宿舍、军训服折腾过一轮了。后面军训会更辛苦一点，如果只是累，那可能大家都得慢慢适应。但如果身体真的不舒服，或者遇到自己处理不了的问题，不要硬撑，可以及时联系班导、辅导员或者教官。”\n\n她低头看了一眼台下的新生。\n\n“能自己处理的事情，可以先试着处理。真的处理不了，也不用觉得丢人。大学不是让大家第一天就变成无所不能的人。”\n\n这句话落下后，讲堂里安静了一瞬。\n\n随后掌声响起来。\n\n比刚才更真一点。\n\n我也抬手鼓掌。\n\n掌心拍在一起时，我忽然想到毛锐刚才说的那些话。\n\n衣服不合身，自己克服。\n\n鞋磨脚，自己克服。\n\n站着累，自己克服。\n\n我看着台上的霍钰，忽然觉得她像一盏放在很远处的灯。\n\n当然，也不能排除其他人唱白脸，她负责唱红脸的可能……\n\n会议后半段变得快了许多。\n\n彭悦宣读了明天的集合时间、训练地点、请假流程和注意事项。毛锐坐在一旁，始终没有再说话，可他的沉默像一块压在桌上的铁，所有人都知道它还在那里。\n\n散会时，班群里同步发出正式通知。\n\n> 明日6:20，木兰广场集合。\n>\n> 请穿戴全套军训服，携带水杯，不得迟到。\n>\n> 如有迟到，全阵加练。\n\n朱铭看完通知，长长吸了一口气。\n\n“六点二十。”\n\n李向阳拿起手机，在屏幕上点了几下。\n\n“五点五十起床比较稳。”\n\n朱铭看着李向阳。\n\n“你这话对我来说有点残忍。”\n\n“那你可以设五点五十五的闹钟。”\n\n“谢谢你给我五分钟自由。”\n\n我们跟着人流往外走。\n\n夜色已经完全落了下来。联云讲堂外的台阶被路灯照得发亮，空气比白天凉了一点，却仍然闷着。刚才在讲堂里被空调吹冷的军训服一出门又贴回皮肤上，布料摩擦手臂，领口的标签继续扎着后颈。\n\n路上到处都是穿着同样迷彩服的新生。\n\n有人抱怨鞋硬，有人讨论明早几点起，也有人问军训能不能带冰袖。可大家说话的声音都比刚才进会场前低了许多，大概是毛锐的声音还萦绕在耳边，没有完全散掉。\n\n朱铭走在我旁边，忽然把帽子摘下来，拿在手里扇了两下风。\n\n“这帽子也太热了吧。”\n\n他说完大概是觉得这动作不太有效，却也没再戴回头上，干脆就拿在了手里。\n\n“好歹也是所全国知名的985大学，连顶帽子都要偷工减料。”\n\n李向阳走在前面，听见这句，回头看了朱铭一眼。\n\n“有本事，这话你明天对教官或者辅导员说去。”\n\n“那咋可能。”朱铭说，“我又不傻。”\n\n他停了一下，又补了一句。\n\n“就是觉得有点憋。”\n\n这一次，李向阳没有回答。\n\n我们四个沿着木兰路往立华书院走。夜风没能把白天留下的热气完全吹散，裤脚和袜口都闷着。远处还能听见其他新生的说笑声，一阵近，一阵远。\n\n回到宿舍时，空调还在运转。\n\n屋里比外面凉很多，冷气扑到身上，军训服上的汗意一下子变得明显。朱铭进门第一件事就是把帽子摘下来，放到桌上。\n\n他刚想说话，视线忽然落到空调出风口上。\n\n“等一下。”朱铭愣了一下，“我们走的时候是不是没关空调？”\n\n李向阳抬头看了一眼。\n\n“原计划是吃完饭回来收拾东西，再去讲堂。”他说，“但后来直接被通知去领军训服了。”\n\n“那它岂不是在寝室里空转了两个多小时？”朱铭说。\n\n走在最后的我把门带上，心里也有些发虚。\n\n“电费怎么算？”我问。\n\n“寝室平摊。”李向阳说。\n\n朱铭沉默了两秒。\n\n“从现在开始，我宣布它每一口冷风都很珍贵。”\n\n我坐到自己的椅子上，解开腰带，把衣服换下来挂到椅背。军训服离开身体的瞬间，后颈被标签磨过的地方才后知后觉地泛起一点疼。\n\n我伸手摸了摸，碰到一小块肿起。\n\n不严重，大概很快就会消下去。\n\n> 今天报到顺利吗？\n>\n> 军训是不是明天开始？\n\n我低头打字。\n\n> 顺利。\n>\n> 明天早上集合。\n\n我想了想，又补了一句。\n\n> 衣服有点不合身，不过问题不大。\n\n消息发出去后，母亲很快回了。\n\n> 衣服不合身就及时更换，身体不舒服就找老师请假。\n\n我看着这段文字，忽然想起霍钰在台上说的话。\n\n也想起毛锐说的那句自己克服。\n\n我还没想好该回什么，朱铭忽然在旁边清了清嗓子。\n\n“按照大学宿舍传统。”他说，“第一天晚上睡觉之前，是不是应该来一场毫无意义但很有必要的夜聊？”\n\n李向阳正在整理桌面，头也没抬。\n\n“明天要早起。”\n\n“所以我申请精简版。”朱铭说，“三分钟。”\n\n他说完，也不等别人同意，就把椅子往后一靠。\n\n“我今天发现一件事。”\n\n“什么？”\n\n寝室里安静了一下。\n\n我原本已经准备收起手机，听见这句话，动作停在半空。\n\n“霍学姐好像有点不一般。”\n\n“你这个发现的创新点在哪里？”李向阳原来也是会开玩笑的。\n\n“不够创新吗？”\n\n“她本来就很有名。”\n\n朱铭立刻来了精神。\n\n“展开说说。”\n\n“成绩很好，竞赛、学生工作、社团活动，在各方面都很活跃。”李向阳说，“但她出名不只是因为这些。”\n\n“还有什么？”\n\n“不好说。”李向阳顿了顿，“有人觉得她很温柔，也有人觉得她其实不太好接近。”\n\n朱铭想了想。\n\n“这两个评价不冲突吗？”\n\n“不一定。”李向阳说。\n\n他没有继续解释。\n\n朱铭却没有放过他。\n\n“不对啊。”他说，“你为什么知道这么多？”\n\n李向阳把桌上的材料叠好，放进抽屉。\n\n“三分钟到了。”\n\n“这也能卡点？”\n\n“能。”李向阳说，“熄灯，睡觉。”\n\n朱铭张了张嘴，最后只好把话咽回去。\n\n当寝室的灯光熄灭，黑暗降下来后，我躺在不大的床上，脑子里反复出现的，却是霍钰站在讲台前，说“不用觉得丢人”的话语。\n\n黑暗里，手机屏幕又亮了一下。\n\n是班群里有人发了一个“收到”。很快，下面跟着一排相同的“收到”。\n\n我没有跟着回复。\n\n军训服就挂在床下我看不见的椅背上。我只能想象它在黑暗里空空地垂着，连同整个世界一起安静下来。\n\n明天早上六点二十，所有人都会穿上这件相同的衣服，站到同一个广场上。有时候仔细想想，这种事情还真有点神奇。与这种匪夷所思却又理所当然的“同一”相比，“合不合身”这点渺小的差异，好像就变得不那么重要了。\n\n我闭上眼睛。\n\n领口磨过的地方还在隐隐发疼。\n\n而在这点疼痛消下去以前，名为“军训”的生活，就要先一步开始了。"},{"title":"第五章：晴空万里","file":"5、第五章.md","text":"我是被闹钟叫醒的。\n\n铃声很普通。\n\n普通到它响起来的那一瞬间，我没有找到任何可以迁怒的对象。只是手机在枕边嗡嗡震动，屏幕亮起，提醒我五点五十分已经到了。\n\n我不想起床。\n\n这个念头清晰得像有人把它写在了天花板上。\n\n宿舍里还很暗，空调的冷气在夜里积了一层，薄薄地压在皮肤上。我怕闭上眼睛就被困意裹挟着又睡过去，但一时又没有适应醒着的感觉，于是睁着眼睛呆呆地看了许久的天花板，直到五分钟后，闹钟第二次响起。\n\n身体比意识更早想起今天要发生什么。\n\n后颈昨晚被领口磨过的地方还在疼，像有一小片皮肤被细砂纸轻轻擦过。腿倒是不疼，毕竟昨天真正的军训还没有开始，可那双军训鞋已经提前给了我一点预告：鞋帮硬，鞋底薄，穿上以后脚背和脚掌都不太舒服。\n\n我坐起来，摸黑把眼镜戴上。\n\n镜腿有点凉，贴到耳侧时，我才真正意识到自己已经醒了。\n\n门外走廊上有很轻的脚步声，像是有人踩着拖鞋经过。那声音停了一下，又继续往前，最后被隔壁寝室卫生间里断断续续的水声盖过去。\n\n军训服挂在椅背上，黑暗里只能看清一个大致的轮廓。迷彩上衣套过头顶，后颈的那块皮肤立刻被领口碰到，我下意识缩了一下。\n\n朱铭那边传来一声很轻的叹息。\n\n“我现在相信了。”他含糊地说，“大学生活确实很锻炼意志。”\n\n没人接话。\n\n不是不想接，而大概是这个时间点，连“吐槽“都还没完全醒。\n\n卫生间里的灯已经亮着，水声断断续续，闹钟响第一次的时候，李向阳就已经翻身下床，穿衣洗漱了。\n\n当我来到卫生间，洗手台边还留着一点没擦干的水痕。\n\n镜子里的人已经穿上了军训服，不过帽子还没戴、腰带也还没扣紧，整个人看上去像是被清晨临时装进了一套并不熟悉的外壳里。\n\n我把牙刷塞进嘴里，忽然觉得这场面有些好笑。\n\n可牙膏的薄荷味很快把那点笑意压下去。\n\n六点十分左右，我们离开A109。\n\n楼道里已经有不少新生走出来。\n\n大家都穿着同一种迷彩服，却因为衣服大小不一，显得各有各的狼狈：有人袖口盖过手背，有人裤脚堆在鞋面，有人帽子被头发顶得歪到一边。\n\n宿舍楼外的天很好。\n\n有点过分得好。\n\n早晨的阳光还不算毒，清亮地铺在路面上，远处云麓山的轮廓干净得像刚被水洗过。天空没有一丝要下雨的意思，也没有一块云。\n\n如果今天没有军训，大概会是一个适合拍开学照片、逛校园、在朋友圈发“大学第一天Vlog”的天气。\n\n可惜我们穿着军训服。\n\n从立华书院去木兰广场的路上，已经有高年级学生陆续经过。有人穿短裤和拖鞋，手里拎着早餐；有人背着电脑包，耳机线从肩边垂下来；还有女生穿着浅色裙子，走过我们旁边时带起一点洗衣液和防晒霜混在一起的味道。\n\n他们看起来都很轻。\n\n轻到不像和我们属于同一所大学。\n\n有两个学姐从路边经过时，声音不大不小地说了句什么。我没听清前半句，只听见后面的“又到军训了”。旁边那个女生笑了一下，笑声很轻，很快就被她们的脚步带远。\n\n谁都经历过军训。对高年级学生来说，新生穿着一身迷彩服在校园里移动，本来就是九月最常见的景象之一。\n\n但我还是不太自在。像是身上这套衣服有了某种标记，把我们从所有自由行走的人里单独拎出来，贴上一张看不见的标签。\n\n“不用觉得尴尬。”\n\n李向阳的声音从旁边传来。\n\n“军训服虽然做工一般，但也算半件军服。”他说，“穿上它，说明我们接下来是要完成一项正式的训练，又不是参加什么奇怪活动。”\n\n他停了一下，又补充道：\n\n“从这个角度看，它是一种荣誉。”\n\n我一时间不知道该作何感想。\n\n朱铭在旁边小声说：“李哥，你这话要是让卖军训服的厂家听见，他们估计会感动得给你打折。”\n\n李向阳看了他一眼。\n\n“我只是说它的象征意义。”\n\n“我知道。”朱铭说，“但我现在脚后跟比较唯物。”\n\n木兰广场上已经站了不少人。\n\n一片迷彩铺在广场，像被人撒开的某种粗糙颜料。各班班导站在边上确认人数，辅导员在前方和几个教官说话。昨晚见过的毛锐站在升旗台旁边，背挺得很直，像一根插进地面的标尺。\n\n我没有看见霍钰。\n\n也没有看见尹渊。\n\n这让我莫名有些不安。\n\n当然，就算他们在，也不可能替我们挡掉军训。可人有时候就是这样，明知道某个安全感没有实际用处，还是会在它不见时觉得身边少了一块东西。\n\n六点二十，集合开始。\n\n“立华书院全体新生，按专业班级集合！”\n\n毛锐拿着扩音器，声音在广场上滚了一圈。\n\n人群开始移动。\n\n巧合的是，物理班和哲学班都被分到了C军阵。\n\n听见“哲学班”三个字时，我下意识往旁边看了一眼，很快就在不远处看见了谷懿，毕竟他相当的显眼：\n\n谷懿穿着军训服，帽子倒是规规矩矩戴在头上，腰带也扣着，单看哪一处都挑不出明显问题。\n\n可如果要用一个词来形容他的状态，那一定是“松松垮垮”。\n\n我们穿上这身衣服后，多少都会下意识去规范自己的姿势举止。谷懿却一手拎着水杯，另一只手懒懒地搭在腰带边，领口最上面那颗扣子没有扣上，袖口也随意卷起一点，依然隐约能看见里面那件昨天一样的白色短袖。\n\n他似乎也看见了我，隔着人群抬了抬下巴。\n\n我还没来得及回应，一个声音就在队列前方响起来。\n\n“都站好了！”\n\n那声音不算特别浑厚，却很尖利，像是故意把每一个字都往人耳朵里钉。\n\n我赶紧转过头。\n\nC军阵前方站着一个高瘦的教官。\n\n他看起来并不比我们年长多少，甚至脸上还留着一点青涩。可他的腰带扣得很紧，帽檐压得很低，衣服比我们身上的军训服挺括得多。\n\n他的下巴微微抬着，没有立刻做自我介绍，而是沿着队列走了一圈。\n\n“帽子戴正。”\n\n“腰带扣好。”\n\n“水杯不要拿在手上。”\n\n“裤脚放下来，像什么样子？”\n\n他每说一句，都会停顿一下，等被点到的人慌忙调整。那种停顿很短，却足够让周围的人跟着紧张。\n\n走到我们这一列前面时，他忽然停住。\n\n“你们是来军训的，不是来旅游的。”\n\n他说这句话时，目光从每个人脸上扫过去。\n\n“在我这里，不管你们以前是什么重点中学，拿过什么奖，高考考了多少分，都不好使。军训只有一条，服从命令。”\n\n这句话和昨晚毛锐说过的话很像。\n\n“听明白没有？”\n\n“听明白了。”\n\n“听不见！”\n\n“听明白了！”\n\n他这才稍微点头。\n\n“我姓张，叫张迪。接下来两周，C军阵由我来带。”\n\n没有人鼓掌。\n\n或许是因为这次大家没有收到明确的指令。\n\n毛锐在最前方继续宣布各军阵安排。张教官站在我们前面，双手背在身后，眼神时不时从队列里扫过。每当他的视线停在某个人身上，那个人就会下意识站直一点。\n\n很快，四个军阵分完。\n\n“C军阵！”\n\n张教官转身。\n\n“目标二里半校区田径场，跑步前进！”\n\n队伍动了起来。\n\n但是，这完全不是一般意义上的校园跑，因为云梦师大并没有真正意义上的围墙。\n\n从木兰广场到二里半校区田径场，中间并不是一条可以完全封闭的校园路。我们要经过校道、路口、红绿灯，还要与骑车的学生、推车的保洁阿姨、送早餐的电动车和零星行人共享同一片早晨。\n\n这件事平时大概会显得很自由。\n\n但在张教官要求“保持队形”的前提下，它很快变成了一种折磨。\n\n前排刚过绿灯，后排就被红灯截住。\n\n张教官在前面回头喊“跟上”，后面的人只能急急忙忙小跑。路边有电动车从队列旁绕过去，队伍被迫往里收缩，原本整齐的间距立刻变得歪歪斜斜。\n\n有人鞋带松了。\n\n我看见那人低头看了一眼，却没有停下，只能一边跑一边把脚尖往鞋里收，像试图用脚趾把松开的鞋子固定住。\n\n我自己的鞋也不舒服。\n\n鞋底太薄了，踩在柏油路上时，脚掌很快感到一阵发热。不是被烫到的那种热，而是硬邦邦的震动一路从脚底传上来，硌得人心烦。\n\n队伍经过一个小路口时，几个高年级学生停靠在路边，让我们先行通过。\n\n有人低声说：“第一天就跑啊。”\n\n另一个人接了一句：“正常，先杀威风。”\n\n等我们终于跑到田径场时，队伍已经散得差不多了。\n\n张教官站在跑道边，右手握拳举起。\n\n“C军阵！在我面前集合！”\n\n所有人开始重新找位置。\n\n可刚才一路跑过来，谁还记得自己原本前后左右分别是谁？\n\n我只记得左边大概是李向阳，后面大概是朱铭。右边原本是哲学班的队伍，刚才跑动时混了一下，现在站在我右侧的是一个个子不高的女生。\n\n她的脸很小，军帽压下来，帽檐几乎贴到眉上，反而显得那双眼睛更安静。几缕细碎的刘海被汗粘在额前，脸色不太好，却仍然低头认真调整着脚尖的位置，左脚又往后收了半寸。\n\n“第四排第四列，出列！”\n\n队列里安静了一瞬。\n\n我快速地数了一下。\n\n我在第五排。\n\n被点到的是我前面那个个子不高、有些胖的男生。\n\n他先是在原地愣了几秒之后，才小心翼翼地走出去。\n\n张教官盯着他。\n\n“这是你自己的位置吗？”\n\n男生低着头，沉默着没吭声。\n\n“说话！”\n\n“报告教官，我……我个子矮，站后面看不见。”\n\n“我问你为什么换位置了吗？”\n\n张教官往前走了一步。\n\n男生明显抖了一下。\n\n“我问的是，你换位置之前，有没有报告？”\n\n男生张了张嘴。\n\n“没有……”\n\n“大点声！”\n\n“报告教官！没有！”\n\n“没有报告，谁让你换的？”\n\n男生又低下头。\n\n“我看不见……”\n\n“你看不见，就可以随便换位置？你觉得不方便，就可以不报告？那以后训练过程中，你觉得累了，是不是也可以自己坐下？你觉得热了，是不是可以自己回宿舍？”\n\n张教官的声音越来越高。\n\n田径场很空，声音被跑道和看台反弹回来，听起来比实际更刺耳。\n\n“大学生了，就这个纪律性？”\n\n男生站在他面前，脸涨得通红。\n\n“这不欺负人吗。”\n\n身后的朱铭很轻地骂了一句。\n\n“归队！”\n\n张教官终于放过他。\n\n男生回到队列里时，头几乎低到胸口。\n\n可事情并没有结束。\n\n张教官转身看向所有人。\n\n“刚才跑过来，一路上乱七八糟。到了田径场，连自己的位置都找不到。第一天上午就这样，后面还训不训？”\n\n没人回答。\n\n“所有人，五圈。”\n\n他抬手指向跑道。\n\n“绕着操场，跑五圈，十分钟内回到原位。没完成的，自己站出来！”\n\n这句话落下时，队列里先是静了一下，随后响起几声很轻的吸气。\n\n五圈。\n\n两千米。\n\n十分钟。\n\n如果是在高中，如果穿着正常的运动鞋和短袖短裤，对于一部分有保持运动习惯的人来说，大概并不是什么特别困难的事。\n\n可现在我们穿着军训服，刚从木兰广场跑到田径场，体力还压根没有恢复，况且队伍里还有一些像刚才那位胖胖的男生一样，一看就不擅长运动的人。\n\n教官不可能不知道。\n\n但他没有给任何解释和回旋的余地。\n\n“跑！”\n\n队伍动了起来。\n\n第一圈时，大家还带着一点被命令推着走的紧张。跑道外圈的草地颜色很深，早晨的阳光落在上面，甚至还有些漂亮。我听见身边有人调整呼吸，有人鞋底踩在跑道上发出沉闷的声响。\n\n第二圈，队伍就散开了。\n\n有人开始超过别人，有人被落在后面。呼吸声变得粗重，像一台台不太稳定的风箱。帽檐压在额头上，汗从发根往下渗，军训服贴住后背，每一次摆臂都能感到布料磨过皮肤。\n\n第三圈，我的喉咙开始发干。\n\n右侧那个女生已经不在我旁边了。\n\n我在弯道处看见她落在后面一段，手按着肋侧，步子很小，却没有停。她跑得不快，甚至称得上吃力，但每次抬脚都很认真，但即便姿势再怎么认真，也没办法改变她眼下的速度比走路只快上一点点的事实。\n\n第四圈时，汗水流到了镜片边缘。\n\n世界变得有些模糊。\n\n跑道边的张教官站在终点附近，双手背在身后，目光从一个个跑过的人脸上扫过去。\n\n他并没有在看表。\n\n至少我跑过他身边时，没有。\n\n第五圈，我已经不再想十分钟到底合不合理。\n\n也不再想张教官是不是故意找茬或是出于什么其他目的。\n\n我只想赶紧跑完，赶紧停下，赶紧重新恢复正常呼吸的权利。\n\n过了一段不知道究竟有多久的时间后，我终于勉强跑完了五圈。\n\n回到队列附近时，我弯着腰，双手撑在膝盖上，喉咙里有一股铁锈似的味道。\n\n朱铭已经站在原来的位置上了，看样子似乎早就跑完了。李向阳也回到了队列里，正拧开自己的水杯。\n\n我没有力气和他们说话，只是抬头看了一眼四周。\n\n队列里到处都是空缺。\n\n此时回来的大概只有一半人。有些人站在原地喘气，有些人干脆蹲到了跑道边，还有人弯着腰，半天没能直起来。\n\n我下意识想看一眼时间。\n\n手刚碰到口袋，朱铭的声音就从旁边传来。\n\n“不用看了，早过十分钟了。”\n\n我愣了一下，转头看向他。\n\n朱铭拧开水杯喝了一口，抹了把嘴。\n\n“十分钟两千米，体力好的能跑完，其他人呢？一些个子小的女生呢？”\n\n他说完，看了眼站在跑道边的张教官。\n\n“他一开始就没打算真按十分钟算。只要别跑得太难看，他多半连时间都懒得看。”\n\n这话听起来十分有道理。\n\n当然，以我现在大脑缺氧的程度，只要有人语气足够坚定地说“马克思其实早就是一个中国人了”，我可能也会认真思考两秒。\n\n我顺着朱铭的目光看过去。\n\n张教官站在终点附近，双手背在身后，确实没有看表。他只是看着一个个跑回来的人，偶尔皱一下眉，像是在等队伍慢慢补齐。\n\n开跑前，水杯就被随手放在田径场草坪上。杯壁已经被晒得发烫，水也不凉了。我拿起来喝了一口，那点温水顺着喉咙往下，暂时压住了干涩。\n\n越来越多的人跑完回来了。\n\n有些人几乎是拖着步子回到队列；一些人弯着腰，手撑在大腿上，半天直不起身。\n\n刚才站在我右侧的那个女生也回来了。\n\n她停在队列边，几缕刘海湿在额前，脸颊被晒出一点浅红，嘴唇却没什么血色。\n\n人差不多该齐了……吧？\n\n正当我这么想时，跑道远处忽然有一道人影，正朝这边“跑来”。\n\n与其说“跑”，不如说那姿态更像是游戏“求生之路”里的丧尸……\n\n谷懿。\n\n他居然还在跑。\n\n看那样子，别提多卖力了。而且似乎还呛到风了，边跑还边咳着，简直就差把肺给咳出来了。\n\n终于，谷懿跑完了他的五圈，回到了他忠诚的C军阵。\n\n这时，除了几个累到直不起腰来的以外，几乎所有人的目光都齐刷刷地看向他，其中也包括教官。\n\n可那位刚才还凶神恶煞的教官，此时脸上竟出现了一副关切的神情。\n\n“你们两个，快去扶一下他。”\n\n看着仿佛下一秒就要倒地不起的谷懿，他赶紧扭头对两个前排的同学说道。\n\n“报……报告教官！我没有按时完成任务！请教官处罚我！”\n\n可还未等那两位同学走到谷懿跟前，像要行将就木的谷懿如同回光返照了一般，居然扯着嗓子向教官吼了起来。\n\n谷懿这几乎是强撑着从嗓子缝中挤出来的声音把我们所有人都吓了一跳，声音的内容更是让我们震惊不已。\n\n这所谓的“十分钟跑完”不就是说说而已吗？\n\n那么多同学都没有按时跑完，教官不也没说什么吗？\n\n虽然不知道谷懿是怎么会跑成现在这副奄奄一息的样子，但他都这样了居然还主动请求教官责罚？\n\n正当我愣在原地时，身后的朱铭却突然放声大笑。\n\n他那旁若无人的笑声着实把我吓了一跳，我赶忙看了一眼教官，在发现教官此时注意力全部在谷懿身上后，我才放下心来。\n\n“铭哥，你笑什么？”\n\n可朱铭并没有回答我这个问题。\n\n不过很快我就明白朱铭为什么不回答我了，因为我突然发现此时军阵的气氛变得无比诡异。\n\n许多同学的样子都非常紧张，目不转睛地盯着军阵前方的教官和谷懿，尤其是那几个堪堪就在谷懿前头跑完五圈的女生。\n\n而教官的脸色此时竟非常难看，眼神也闪烁不定，隔着好几米的距离，似乎能看见他几次张了张嘴，却没有一点声音发出，就这样站在那儿，像是被谁定住了一般。\n\n“咳咳，你们虽然没有按时完成任务，但是看在你们都全力以赴了的份上，我这次就破例就不惩罚你们了。”\n\n原本镇定自若、统摄一切的教官此时看上去竟有些心虚，似乎是没料到刚才的这一幕。\n\n“但是仅此一次，下不为例！”\n\n这句话的音量提高了几分，但听起来不知为何总有一种虚张声势的感觉。\n\n原来如此！\n\n如果教官处罚谷懿的话，就必须一视同仁地处罚其他所有没能在他规定时间内完成任务的同学。\n\n而这显然是不可能的，因为教官之所以惩罚，目的在于立威，但任何事情要是过了头，都有适得其反的可能。\n\n所以，教官本来根本没把这个时间限制认真当一回事儿。如果不是谷懿这个变数，大概率就就会像朱铭所说的一样。他自己绝不可能主动提起——甚至这件事日后还能成为他向我们施压的资本。\n\n可谷懿……却似乎是掐准了教官这个心理，以身涉险。\n\n但是，既然不是为自己未能完成任务开脱，谷懿又为什么要这样做呢？\n\n不过无论如何，在教官说完这几句话后，不少同学悬着的心终于是放下了。\n\n可就当几乎我们所有人都以为这件事就这样结束了时，更夸张的一幕出现了——\n\n如果说谷懿刚才的举动只是令我们“看不懂，但大为震撼”，那么这一刻，谷懿的行为，却是让我们在场的每一个人，都永远地记住了这个身形瘦削的卷发男生。\n\n教官的话才出口，刚才还拖曳着瘦弱的身躯仿佛贴在地面上爬行的谷懿竟然像换了个人似的，腿也不抖了，气也不喘了，两只眼睛中的虚弱也不知所踪，反而立刻炯炯有神起来。\n\n这样子，哪像是一个刚刚拼了命才跑完两千米的人？你说他这是享受完一整套服务刚从洗脚城里出来我都信！\n\n场上的空气像是凝固了般，所有同学的目光都像在看怪物般看着他。\n\n谷懿却是毫不在意这些目光，竟是蹦蹦跳跳着回到了队列。\n\n我们这才明白，谷懿哪里是体力不支！这时候就算让他再去跑个五圈，可能都不成问题。\n\n他明显能够在十分钟内跑完，却故意不紧不慢地遛弯似的应付着教官的惩罚，直到最后一圈——甚至可能是最后一百米，不，甚至可能是出现在我们所有人的视野中后，才立马装出一副拼尽全力、体力不支的样子。\n\n而就在刚才，教官乃至很多和他一样没按时跑完五圈的同学的一系列反应，恐怕都在他的预料之内。\n\n想到这儿，我不禁倒吸一口冷气。\n\n不仅是惊叹于谷懿的聪明，更是震惊于他的选择。他这样做根本就不是为自己开脱，而竟是选择以身设局去触教官的逆鳞。\n\n果然，看到这副样子的谷懿后，教官刚刚才恢复一些的脸色瞬间变成了猪肝色。\n\n看到威风凛凛的教官被谷懿耍成这副这样，想必不少同学都和我一样，正在心中默默暗爽吧。\n\n情况也正如我所想的这样，最开始那位被教官拉出列针对的同学，此刻竟已在队列中笑得龇牙咧嘴、歪七扭八。\n\n一上来就被教官拿来开刀、受气最多的他，当时心里有多憋屈，现在心里就有多痛快。\n\n正当周围不少同学在他的影响下，也一个个先后喜形于色起来。\n\n可身边的李向阳却是板着脸，一动不动地站着军姿。\n\n他的与众不同也提醒了我，我赶紧收起了刚才的一丝放纵。\n\n我趁机瞥了眼教官，只见印象中狼狈不堪的教官此时却是已经恢复了一贯的严肃神情，紧盯着那几个笑得前仰后合的同学，不动声色地向队列中走来。\n\n“得意忘形”啊！人要是太得意，就容易忘记自己的“形状”。\n\n包括刚才那几位在内，不少同学此时恐怕都忘了自己的身份，是教官手底下的“兵”，更准确的说，是被军训的对象！\n\n“这么喜欢笑吗？”\n\n还沉浸在刚刚那一幕喜剧中的几个同学丝毫没有注意到刚刚还在队列外的教官此时竟已走到了他们面前。\n\n看着这近在咫尺的身影，几个人顿时噤了声。\n\n“你们几个刚刚笑的，给我出列！”\n\n即便有一千一万个不情愿，在那身军服所代表着的绝对的权威面前，这几个同学还是乖乖出列走到了前面，其中自然也包括了最开始的那位，这回可是“二进宫”了。\n\n“既然那么喜欢笑，就干脆给我笑个够吧！”\n\n教官沉着脸命令到。\n\n那几个人站在前面，面面相觑，这时候恐怕只有白痴才敢笑。\n\n“这么简单的话，也听不懂吗？”\n\n教官边说着边走到其中一个同学面前。\n\n“你！笑！”\n\n那名同学不得已只能挤出几声干笑，嘴角勉强扯出了一个僵硬的弧度。\n\n其他几个同学见状，也赶紧跟着“笑”了起来。那样子，简直比哭还难看。\n\n于是，就在这诡异的一幕中：\n\n“记住，队列里没有你们想笑就笑、想动就动的自由！”\n\n“在接下来的两周内，你们要学会怎么成为一个军人！齐步走、踢正步，这些都是最基础的！”\n\n“而今天，是第一天！我们就从最基本的站军姿开始！如果连个军姿都站不好！就根本不配站在这里！”\n\n“听明白了没有！”\n\n好家伙，又是经典环节，跟昨晚一个样。模仿海绵宝宝里的独眼船长是云梦师大教官队的传统艺能吗？\n\n不过见识了刚才那几位倒霉蛋的牺牲后，一时间倒是没人再出来跟张教官唱反调了，就连谷懿此时都老老实实地站在那。\n\n——好吧，至少表面看上去是这样的。\n\n短暂的“小插曲”过后，军训第一天正式开始了，从最基本的站姿开始。\n\n最基本。\n\n这三个字听上去简单，真正站起来却完全不是那么回事。\n\n脚跟并拢，脚尖分开，膝盖绷直，手指并拢贴在裤缝，肩膀打开，下巴微收，眼睛平视前方。每一个要求单独拎出来都不难，可当它们同时压到一个正在出汗、喘气、喉咙发干的人身上，就变成了另一种东西。\n\n太阳升得更高了。\n\n帽檐遮住一部分光，也把热气牢牢扣在额头上。汗从鬓角往下流，滑到下巴，最后滴进领口。领口那块磨破的地方被汗一浸，疼痛变得更清楚。\n\n眼镜被汗水弄得有些滑，镜框一点点在往下坠。我想伸手扶一下，却不敢动。于是只能用鼻梁顶着它，顶到最后，连鼻梁都开始酸。\n\n足下的橡胶跑道无时无刻不在散发着灼热的气息，地面的炙热正透过军训服中那双饱受诟病的鞋子烘烤着我。\n\n而相比于肉体上的煎熬，更难熬的要属精神上的无聊。  \n  \n远处天际线模糊不清，仿佛在被烈日融化。除了前面人的后脑勺外，我什么也看不清楚，唯一的乐趣似乎就是看着一颗颗的汗珠从别人的脖颈上滑落。  \n  \n这般无休止的炎热与干燥，直让人觉得生命力正在不断衰竭……\n\n至于偷懒、松懈，在这个过程中不是一个明智的选择，因为这时张教官早就不站在队列前方了，而是不断地在队列中穿插。\n\n有时从左边走过，有时从右边走过，有时忽然停在某个人身后。你看不见他在哪里，却知道他随时可能出现。\n\n“手贴紧！”\n\n“腿绷直！”\n\n“低头看什么？”\n\n“肩膀塌成这样，是没吃早饭吗？”\n\n每一句都像突然落下来的鞭子。\n\n一旦产生放松的念头，或是两只脚靠的过近了，又或是双腿不够笔直了，还或是手掌贴裤子贴得不齐了，张教官可能下一秒就会从你身后出现，对着你想略微放松一会儿的地方狠狠地来上一下。  \n\n果然，相比已知的危险，始终高悬的达摩克里斯之剑才最让人畏惧。\n  \n队列中不少人都被光顾过了，其中谷懿被关注的次数最多。\n\n也许是转移注意力的缘故，我时不时就瞥一眼身旁的人。\n\n这极端的天气和长时间的站立似乎并没有对李向阳产生太大影响，他依旧是笔挺地站在那儿，动作极其规范，至少我是挑不出一点毛病来。  \n\n右侧那个女生站得也很认真，张教官从我们前方走过时，她把背挺得更直了一点。\n\n第一组二十分钟结束，张教官终于喊休息。\n\n所有人几乎同时松下来。\n\n有人立刻蹲到地上，有人冲向放水杯的地方，有人掀开帽子扇风。刚才那种被强行绷住的安静一下子裂开，喘气声和低声抱怨从各处冒出来。\n\n我拿起水杯，喝了几口。\n\n水已经被晒得温吞，顺着喉咙往下时，像是连塑料杯壁上的热气也一并咽了进去。\n\n放下杯子时，我看见右侧那个女生蹲在地上系鞋带。\n\n她蹲得很低，帽檐几乎挡住半张脸。鞋带大概是在刚才跑步时松开的，沾了点灰，贴在鞋面上。她用两根手指捏着绳头，绕了一圈，又停下来，像是先把呼吸压稳，再重新绕。\n\n我看了两秒，才意识到这样盯着别人似乎不太合适，于是移开视线。\n\n可很快，旁边传来鞋底轻轻蹭过塑胶跑道的声音。\n\n她半蹲的身体晃了一下，手撑住膝盖，才重新稳住。\n\n我迟疑了一下。\n\n“你还好吗？”\n\n她的动作停了一下，才转头看向我。\n\n帽檐抬起时，我才看清她的眼睛。她看起来很累，却还是认真地看了我一眼。\n\n“没事，谢谢。”\n\n然后她低下头，把鞋带最后绕紧，绳结并不漂亮。\n\n我不知道该怎么接，只好“嗯”了一声。\n\n她把鞋带系好，站起来时扶了一下膝盖。\n\n我们之间重新安静下来，短暂的休息也很快结束。\n\n张教官的哨声重新响起。\n\n上午剩下的时间，被切成一段一段相同的站军姿训练。\n\n半小时。\n\n休息。\n\n再半个小时。\n\n再休息。\n\n到了后来，时间不再像钟表上的数字，而像一条被太阳晒软的绳子，黏在身上，怎么也甩不开。\n\n中午解散时，所有人都像被从某个看不见的模具里倒出来的一样。\n\n我走出田径场，才发现自己的腿在微微地发抖。\n\n午饭也绝对谈不上愉快。\n\n朱铭原本大概是想挨个测评一下各个窗口的，最后只和我一起随便找了家排队人少的，拿到饭后就往嘴里扒。\n  \n经过一上午的训练，我甚至一度忘了谷懿的事。  \n  \n可能唯一称得上有趣的，是我在站军姿的休息间隙中偶然发现，我双脚所站过的那个地方，留下了一个深色的水印——这破鞋子的质量……\n\n回到宿舍后，空调冷气扑过来，汗湿的军训服贴在背上，冷得我打了个很轻的颤。明明上午一直盼着凉快，可真正凉下来时，身体反而像被抽空了一截。\n\n我只躺了不到二十分钟。\n\n闹钟又响了。\n\n下午的田径场，比上午更像绞肉机。\n\n上午至少还有一点早晨留下来的清亮。到了下午，阳光完全压下来，跑道、看台、草地、升旗杆和远处教学楼的墙面都被照得发白。天空蓝得没有一点犹豫，连云都没有。\n\n晴空万里。\n\n我从来没有这样讨厌过晴天。\n\n所有东西都在明亮的天光下无处可藏，连痛苦都变得理所当然。\n\n张教官似乎也比上午更有耐心。\n\n但这种耐心不意味着温和，他开始一点点消磨我们。\n\n站军姿，齐步走分解动作，原地踏步，转体，反复集合，反复散开，再反复集合。每一个动作都简单，每一个动作都可以被纠正，每一个动作都能成为他让人出列的理由。\n\n“手臂摆到位！”\n\n“脚抬高！”\n\n“你们这是齐步走还是逛街？”\n\n“这一排，重新来！”\n\n鞋底踩在跑道上，脚掌疼得像一直垫着一层硬纸板。汗水从帽檐内侧往下滴，流进眼角时有一点刺痛。有人报告头晕，张教官先看了他几秒。\n\n“能不能坚持？”\n\n那人张了张嘴。\n\n“能……”\n\n“能就回去。”\n\n于是他回去了。\n\n我右侧的那个女生下午明显更吃力。\n\n有一次原地踏步结束，她的身体晃了一下，很轻，但我看见了。她很快重新站稳，把手重新贴回裤缝。\n\n又一次休息时，朱铭终于找到机会凑到谷懿旁边。\n\n我也在旁边。\n\n准确来说，是朱铭拽着我过去的，他说“这么精彩的人类行为样本，不近距离观察一下太可惜了”。\n\n谷懿正坐在跑道边，帽子放在膝盖上，头发被汗水打湿了一点。\n\n朱铭开门见山。\n\n“你上午是不是故意的？”\n\n谷懿抬头看他。\n\n“什么故意的？”\n\n“别装。”朱铭说，“最后那一段。”\n\n谷懿笑了笑。\n\n“我只是认真执行教官命令。”\n\n“执行到差点把教官执行死机？”\n\n“那是系统兼容性问题。”谷懿说，“不能怪用户。”\n\n朱铭乐了。\n\n我看着谷懿，问：\n\n“你不怕他真罚你？”\n\n谷懿转头看向我。\n\n这大概是我们第一次认真观察彼此。\n\n之前在快递驿站，我们曾被书和纸箱短暂地挤到一件屋子里；而此刻，汗水、太阳、跑道和张教官的哨声又把我们压在同一片大地上。\n\n他的眼睛很亮。\n\n不像温和的光，而像一团熊熊燃烧的火焰。\n\n“怕啊。”\n\n他说得很自然。\n\n“所以才要挑他不敢真罚的时候。”\n\n我愣了一下。\n\n谷懿把帽子重新扣到头上。\n\n“不怕的人反而没意思。”他说，“不怕就只是莽。怕，还要算清楚哪里能动一下，这才稍微有点技术含量。”\n\n哨声响了。\n\n休息结束。\n\n谷懿站起来，拍了拍裤腿，回到自己的位置。\n\n我也跟着站起身。\n\n那时太阳正高，我们脚下的影子被压得很短，短到几乎看不出来每个人原本是什么形状。\n\n下午剩下的时间，比上午更慢。\n\n慢到我开始怀疑时间是不是被晒化了。\n\n张教官仍旧在队列里来回走。谷懿又被他重点盯了几次，可令人意想不到的是，即便如此他也没被挑出什么毛病。\n\n身旁朱铭的脸色越来越难看，但一直没有多说。李向阳动作依旧标准，只是休息时喝水的速度比上午快了很多。\n\n不断有同学因为中暑或体力不支被迫“出列”，以被张教官言语羞辱为代价，换得了短暂的喘息。\n\n而那个明明从上午时就开始“摇摇欲坠”的女生，竟奇迹般地坚持到了现在。\n\n我全部的注意力仅限于此了。\n\n到最后，我只记得自己的脚掌、后颈、眼镜、喉咙，还有那片蓝得没有一点遮拦的天空。\n\n收操时，太阳已经偏西。\n\n张教官喊完“解散”，人群却没有立刻活过来。大家动作都很慢，有人摘下帽子，头发已经全湿；有人弯腰揉小腿；有人坐到跑道边，半天没有站起来。\n\n我把帽子拿在手里，感觉头顶终于透进了一点风。\n\n那一点风很轻。\n\n轻得像一种迟到的补偿。\n\n走出田径场时，夕阳已经烧到了田径场的西边。\n\n斜斜地压过田径场外的围栏，压过远处的教学楼，压过一群刚刚被放出来的新生，把整座校园都染成一种接近燃烧的橘红色。\n\n远处的云麓山只剩下一道深色的轮廓，山后大片大片的晚霞铺开，像是有人不小心把颜料打翻在天边。颜色太浓了，浓到让人产生一种错觉，好像这座城市再往前走几步，就会被那片燃着的天空整个吞下去。\n\n归功于烈日骄阳一整个白天的暴晒，现在的黄昏竟显得近乎温柔——即便温度依旧没有低于30度，即便今天这样的日子还要再重复上演13天。\n\n不管怎样，至少此刻我们的确感受到了久违的自由。不用刻意维持一个频率行走，也不用在这之中加上一些毫无意义的动作，更不需要继续将双手紧贴裤子。\n\n当我和朱铭走到那个已经开始变得熟悉的十字路口时，我们巧合地看到了谷懿。\n\n“谷懿。”\n\n被叫名字的人转过身来。\n\n“厉害啊，教官盯了你一天，愣是没给他挑出毛病。”\n\n朱铭说得很认真。\n\n谷懿显然很受用。\n\n他嘴角扬了一下，却装出一副并不在意的样子。\n\n“一般。”\n\n“一般？”朱铭说，“你老实说，上午你是不是少跑了一圈。”\n\n谷懿终于笑了。\n\n“两圈。”\n\n“你少跑了两圈？”\n\n我惊讶到失声。\n\n“呵呵，我只跑了两圈。”\n\n好吧……这下可算是给他如愿以偿地装到了。\n\n夕阳从我们身后追上来，把三个人的影子歪歪斜斜地铺在路面上。\n\n“他要的不是我们真在十分钟内跑完。”谷懿说，“他要的是我们怕那个十分钟。”\n\n朱铭点头。\n\n“所以你利用了规则本身。”\n\n“对。”谷懿说，“所谓规则，就是这样，规则的内容不重要，规则成为规则的那一刻，它就已经达到了自己的目的。”\n\n他说得很玄乎、也很绕。\n\n我没太听懂，却觉得好像有什么东西在身体里轻轻动了一下。\n\n“当然。”谷懿又说，“这种事不能天天玩。玩多了，人家就该真收拾你了。”\n\n“淹死的都是会游泳的。”朱铭揶揄道。\n\n“确实，历史证明，会游泳是件很危险的事。”\n\n这次朱铭没能接上这个梗，我也一头雾水。\n\n见状谷懿似乎有那么一瞬间的失望，不过下一刻他又说起了其他的话题。\n\n夕阳落在谷懿脸上。\n\n他讲到兴奋时，眼睛亮得很明显，有颜色，有温度，也有一种让人想要靠近的错觉。\n\n我确实觉得他很厉害。\n\n甚至不只是厉害。\n\n在被晒空、被训斥、被命令消耗了一整天之后，谷懿轻松幽默的话，像是这片快要暗下去的城市里突然冒出来的一抹晚霞。\n\n明知晚霞留不住，却还是会让人想再多看一眼。\n\n途中，我看见上午那个被罚笑的男生从我们身边绕了过去。\n\n他没有同行的人，走路的姿势似乎也有些不自然。\n\n不过此时，我的眼睛更多停在谷懿的身上，停在他被夕阳照亮的侧脸上，停在朱铭兴致勃勃的追问里，停在这一天终于结束后、才显得格外好看的天空里。\n\n谷懿还在喋喋不休。\n\n朱铭听得很仔细，时不时还认真地点头。  \n  \n什么“收拾这个姓张的不过分分钟的事”、“迟早让姓张的在我们面前跪下”，这种完全口嗨式的话语，朱铭竟也起劲地捧哏。\n  \n于是谷懿越说越起劲，越说越没边……\n\n远处的太阳一点点落下去。\n\n晴空万里的第一天，终于要结束了。\n\n就这样，我们三人的身形，连同谷懿吹的那些牛，一道隐没在这片夕阳下。"},{"title":"第六章：烈日灼心","file":"6、第六章.md","text":"两周军训，说来短暂，却又漫长，像被人拿镊子夹住了，一分一秒地往外拖。\n\n尤其是在云梦九月的太阳底下。\n\n据李向阳所说，今年的云梦比往年这时候还要热上几分。这个判断听起来很有数据精神，尽管他并没有拿出任何气象局报告作为支撑。但考虑到他平时连去食堂都像提前规划过路线，我姑且愿意相信这不是一句普通抱怨。\n\n当然，就算他说错了，也不影响我们在田径场上被晒得像一排等待出炉的失败烤肠。\n\n军训第一天结束后，我曾天真地以为，人类对痛苦的适应能力应该是很强的。比如第二天会比第一天轻松一点，第三天会比第二天麻木一点，第四天开始或许就能进入某种“既然反抗不了那就享受”的玄学境界。\n\n事实证明，我对人类这一物种多少有些盲目信任。\n\n因为军训这种东西，并不会因为你逐渐熟悉它而变得温柔。\n\n它只会换一种方式折磨你。\n\n第一天最痛苦的是站军姿。第二天最痛苦的是齐步走。第三天最痛苦的是踢正步。第四天最痛苦的是你发现前三天的东西竟然全部还要继续练。\n\n而到了第五天，最痛苦的已经不是某一个具体项目了。\n\n而是你终于意识到，这些痛苦会像课程表一样准时出现，甚至比课程表更加值得信赖。\n\n在第一天地狱般的军姿训练后，无论我们回去后怎么拿肥皂搓洗身子，被汗水浸泡过的皮肤都始终像弥漫着一股发酵后的酸味。\n\n只要一闲下来，这股味道几乎瞬间就会侵袭鼻腔。\n\n它无孔不入。\n\n它难以逃离。\n\n因为它就是我们自身。\n\n这时我才明白，名为“军训”的记忆，原来真的会以气味的形式扎根在人心里。\n\n不过值得庆幸的是，之后几天里，我们不再需要像第一天那样从早到晚都站军姿。\n\n但这点最起码的安慰大概不是教官们的仁慈，而是他们需要为其他训练项目腾出时间。\n\n在这样的天气里，即便什么都不做，只是站在太阳底下，就足以令人头晕眼花。至于踢正步、齐步走、跑步、原地踏步、反复集合和解散，那些东西就更像是在“人类为什么要直立行走”这个问题上，对我们进行了一场过于深入的实践研究。\n\n也就是在这几天里，我慢慢发现，这具身体的体质确实比我想象中要好得多。\n\n明明通过我的了解，他也不是什么篮球队核心、足球场猛男，甚至从中学履历来看，他的人生大部分时间应该都和书籍、竞赛、考试待在一起。可真正跑起来、站起来、撑起来时，这具身体却相当耐用。\n\n这个发现让我心情复杂。\n\n一方面，身体素质好当然是好事。另一方面，这也让我越发觉得自己像是一个临时借号上号的人，正在使用别人辛辛苦苦练出来的角色属性。\n\n当然，不管怎样，这具身体也比不上朱铭和李向阳。\n\n朱铭虽然始终都对军训怀有强烈抵触情绪，但在正式训练里却从未有一丝一毫的懈怠。如果不是认识他，光看他训练时的表现，我大概会以为他是最热爱军训的那几个人之一。\n\n对此，他自己的解释叫“一码事归一码事”。\n\n“反对这个制度，和我不想被张迪抓出来当众骂，是两码事。”朱铭某天晚上洗完澡后这样总结，“前者是思想问题，后者是生存问题。”\n\n我觉得他说得很有道理。\n\n甚至过于有道理，以至于我一时间分不清他究竟是在反军训，还是在为军训中的个人优秀表现寻找理论支撑。\n\n同样一丝不苟的还有李向阳。\n\n练习踢正步时，所有人的腿都发酸发麻，忍不住趁张迪不注意略微降低高度，以争得短暂喘息时，李向阳却始终高高抬着。向教官喊报告时，他的声音也最标准，像是真的经过“声音从胸腔发出”这门课程的系统训练。\n\n我不喜欢军训。\n\n但这并不妨碍我佩服李向阳这种人。\n\n只不过那种佩服里多少带着一点疏离。\n\n我知道自己做不到他那样。\n\n我不可能在被人呵斥时，还摆出一副“任尔东西南北风，我自岿然不动”的架势。更没必要像他那样，明知一件事荒唐、无聊、甚至带着某种侮辱意味，却依然能把它完成得像一道满分题。\n\n即便是军训这种无法拒绝的不可抗力，我至少也会在心里象征性地有所抵抗。\n\n真要说到抵抗，我立刻就想到了谷懿。\n\n在第一天那场让张迪差点表情管理失败的跑圈事件之后，谷懿算是在C军阵出了名。\n\n不过这种“出名”显然不是一件适合写进综测材料的事。\n\n接下来的几天里，张迪对谷懿的关注明显增多。齐步走时看他，站军姿时看他，休息前也要看他一眼。那眼神不像是在看学生，更像是在看某种还没来得及拆封的定时炸弹。\n\n但谷懿偏偏表现得非常老实。\n\n至少表面上非常老实。\n\n帽子戴正，腰带扣好，队列里不乱动。张迪越盯他，他越能在规则允许的范围内站得端端正正，甚至端正得有些嘲讽。\n\n每天下训后，他都会找到我和朱铭结伴去食堂。\n\n也许是他所学的哲学专业对我来说过于陌生且神秘的缘故，我总会下意识把他的性格和哲学关联起来。\n\n再想想中学政治课本里那张经典插图，柏拉图和亚里士多德一个指天一个指地，大概学哲学的人都是如此狂放不羁的吧。\n\n对于这样以偏概全的想法，我并不觉得有什么问题。\n\n谁让我在哲学班里只认识谷懿一个人呢？\n\n谷懿和我们聊天时，偶尔会谈到哲学。\n\n由于他说得非常认真、非常激情，所以我发誓，一开始我是尝试过认真理解的。\n\n但什么“主体性”“大他者”之类的词已经足以让我云里雾里，更可怕的是，这些词还经常没有规律地排列组合。一件事情，刚才还叫“规训身体”，没一会儿又成了“符号秩序的内化”，再过十分钟，甚至能突然拐到“现代大学如何生产合格主体”上。\n\n久而久之，我也就放弃了理解。\n\n或者在他说这些时，干脆把它们统一归进脑内一个名叫“谷懿吹的牛逼”的文件夹里。\n\n不同的是，朱铭从一开始就对谷懿说的这些很感兴趣。\n\n虽然我并不确定同为理科生出身的朱铭到底能听懂多少，但他每次都听得很认真，甚至偶尔还会点头。\n\n这让我一度怀疑，朱铭或许并不是听懂了哲学，而是在欣赏谷懿把话说得非常像哲学的能力。\n\n总之，在这样的几天里，除每个人的皮肤依稀逐渐变黑外，人与人之间也渐渐熟络起来。\n\n谷懿和朱铭，算是我在大学这个新环境里结下的第一个圈子。\n\n至于这个圈子未来会不会变成大学四年的挚友小队，还是某种在军训结束后就自然散开的临时避难所，现在的我没有工夫去仔细思考。\n\n时间过得很慢。\n\n但终于也是来到了军训第五天。\n\n那天下午的天气一如既往地令人沮丧。\n\n别说万里无云的天空什么时候才能奇迹般地落下雨滴了，就连空气中那点稀薄的水分都像被太阳蒸发干净。\n\n“要是能喝口水就好了。”\n\n在跑道上踢着正步时，我这样想。\n\n但这显然是不可能的。\n\n训练时，我们的手机和水杯都远远放在大树下的阴影里。只有张迪吹哨宣布休息时，我们才能按顺序一列一列过去补充水分。\n\n停在烈日暴晒下的我，从未像此刻这样理解沙漠中迷途的旅人对绿洲、水源的渴望。\n\n既然想喝水是不可能的，那我也只好效仿曹军士兵，试图来一个望梅止渴。\n\n于是我微侧着脖颈，眼神始终瞥向远处大树下那片沁人心脾的阴影，以及整整齐齐摆放在那里的一圈水杯。\n\n里面装着我此刻最渴求的东西。\n\n但就在这时，一道身影突然出现在我的视线中。\n\n尹渊。\n\n他穿着一件淡紫色短袖，下身是灰色休闲短裤，不疾不徐地走到那棵大树下，手中还拿着一杯奶茶。\n\n尽管没有任何规定要求班导在军训过程中陪同新生，但这几天还是有不少班导会到田径场看各班训练。隔壁生科班的班导甚至还雪中送炭，给疲惫的同学们送来了两大箱柠檬水。\n\n所以尹渊出现本身并不奇怪。\n\n奇怪的是，似乎因为他的出现，我望梅止渴的方法突然失效了。\n\n在大多数人没有注意到的地方，一身清凉穿着的尹渊正站在那片树荫里，边喝着手中的奶茶，边像是饶有趣味地看着训练中的我们。\n\n准确地说，是看着穿着厚重臃肿的军训服、傻乎乎站在大太阳底下一动不动的我们。\n\n他的脸上挂着一抹淡淡的名为”优雅“笑意。\n\n在军训场上，我们是受训的新生，是被军训纪律管束的对象。\n\n而已经大三的尹渊，理所当然地站在这套纪律之外。\n\n在所有新生都在烈日烘烤下训练、不能喝水的时候，他却可以轻松站在那片巴掌大小的树荫中，享受手里的那杯奶茶。\n\n看尹渊那样子，似乎只是在做一件再正常不过的事情。\n\n的确。\n\n尹渊是班导，是大三学长，不是军训对象。愿意从开着空调的教室或宿舍走到田径场来看我们一眼，都已经算是额外付出。\n\n至于奶茶也好，树荫也罢，那不过是人家的自由。\n\n难不成尹渊还应该走到太阳底下和我们一起军训、同甘共苦不成？\n\n我不是不懂这些简单道理。\n\n可正因为眼前这个画面如此合理，我那没来由的负面情绪才更加强烈。\n\n头顶的烈日炙烤着的不再只是我的肉体，更是我那因为尹渊出现而不再平静，甚至有些扭曲的内心。\n\n我不断在心里重复告诉自己：尹渊不用军训，人家也没碍着别人，那不过是人家的自由。\n\n但直到尹渊看了一会儿后离去为止，我的心都没能平静下来。\n\n我清楚地意识到自己这样的想法多么不讲道理且恶劣。\n\n我居然仅仅因为别人不用和我们一起受苦，就心生怨恨。\n\n比起有这样的想法，更让我痛苦的是，我竟无法从心里把这些念头驱赶出去。\n\n尹渊那道悠闲、轻松、置身事外的身影，不断在我眼前浮现。\n\n下午训练结束时，我整个人几乎像从水里捞出来一样。\n\n军训服贴在身上，领口磨过的地方又疼又痒。朱铭把帽子摘下来，头发被汗压得乱七八糟，看上去像一只刚被迫参加完游泳测试的陆生动物。\n\n“今天晚饭我一定要吃点有尊严的东西。”朱铭说。\n\n“比如？”\n\n“比如能让我意识到自己还活着的东西。”\n\n他这句话听起来要求很高。\n\n但最后我们只是去了食堂二楼，点了一份普通得不能再普通的盖浇饭。\n\n人类的尊严有时候也没那么贵。\n\n我和朱铭、谷懿正端着餐盘找位置时，手机忽然震了一下。\n\n不是只有我的手机。\n\n周围不少人都陆续停下动作，低头看屏幕。那种此起彼伏的停顿，让人瞬间意识到这不是某个班级的小通知，而是某种范围更大的事情。\n\n我打开手机。\n\n立华书院新生通知群里，辅导员转发了一条消息：\n\n【各位21级新生请于今晚七点按班级前往至善楼相关教室，进行入学相关事宜说明及校园通讯服务登记。具体教室安排见附件。请各班班导协助组织，务必通知到每位同学。】\n\n下面跟着一张表。\n\n物理班：115。\n\n哲学班：117。\n\n中文班：119。\n\n……\n\n我还没来得及说话，谷懿就把手机屏幕转了过来。\n\n“看来是惊喜。”\n\n朱铭皱了皱眉。\n\n“入学相关事宜？之前线上和报到那天不都弄完了吗？”\n\n“大学里的相关事宜就像游戏里的每日任务。”谷懿说，“你以为清完了，它第二天还会刷新。”\n\n我看着通知里“校园通讯服务登记”那几个字，心里忽然有一种很轻的不适。\n\n倒也不是因为我看出了什么问题。\n\n只是“登记”这个词和“务必通知到每位同学”放在一起，总让人有种说不上来的麻烦感。\n\n李向阳也看见了消息。\n\n他坐在对面，很快打开附件确认了一遍。\n\n“应该是统一事项。”他说，“七点，吃完饭回去换身衣服可能来不及，直接过去比较稳。”\n\n“李哥，你对人生的理解是不是只有‘稳’和‘不稳’两个选项？”朱铭问。\n\n李向阳看他一眼。\n\n“还有‘很不稳’。”\n\n朱铭沉默了两秒。\n\n“好分类。”\n\n这次连谷懿都笑了一下。\n\n我没有笑。\n\n尹渊站在树荫下喝奶茶的画面又一次在脑子里浮出来。\n\n我不知道他今晚会不会也在。\n\n晚上七点前，至善楼前已经聚了不少新生。\n\n军训第五天的夜晚，大家身上还有白天没有完全散去的疲惫。有人换了便服，有人像我们一样懒得折腾，仍然穿着军训裤和短袖。空气里混着汗味、洗发水味、食堂油烟味，以及楼道里空调外机吹出来的热风。\n\n至善楼一楼走廊很亮。\n\n几间教室门口都摆着临时桌子，桌上放着宣传单、表格、几摞还没拆封的手机卡。穿着运营商马甲的人和几个学长学姐坐在后面，面前贴着微信和支付宝收款码。\n\n如果只看这个布置，它甚至有点像开学报到。\n\n只是我们明明已经报过到了。\n\n“这阵仗……”\n\n朱铭停在115门口。\n\n“我怎么感觉不太像说明入学相关事宜。”\n\n谷懿往隔壁117瞥了一眼。\n\n哲学班那边也是一样的长桌、表格、收款码和手机卡。\n\n“说明的内容大概是，”谷懿说，“如何让入学相关事宜变成运营商相关收入。”\n\n“你这话似乎有点危险。”\n\n“放心。”谷懿说，“危险的话我一般会说得更响一点。”\n\n我没接话。\n\n因为我已经看见了尹渊。\n\n如果我会日语的话，此时此刻我绝对会感慨一句：やっぱり……\n\n他站在115教室门口，胸前挂着班导证，正在和一个穿白衬衫的学姐说话。那副样子依旧很自然，很体面，像是在执行一件再正常不过的书院工作。\n\n看见我们过来，尹渊抬头笑了一下。\n\n“物理班的同学进115，按顺序排队就行。先听学长学姐说明，然后再登记。”\n\n李向阳走上前。\n\n“尹学长，今晚主要是办校园电话卡吗？”\n\n“可以这么理解。”尹渊说，“这是书院和运营商这边合作的新生校园通讯服务，方便之后接收通知、联系辅导员和班导。不是强制，不过建议大家都办理，后续统一管理也会方便一点。”\n\n他说得很平静。\n\n甚至还特意加上了“不是强制”四个字。\n\n可这四个字听起来，并没有让我安心多少。\n\n我们跟着队伍进了115。\n\n教室里已经有不少人了。\n\n几张长桌摆成一排，桌后坐着几个高年级学生和运营商工作人员。讲台旁边投影着套餐说明：三个月优惠、每月流量、通话分钟数、校园网绑定权益、首充金额。\n\n看上去确实很正规。\n\n正规到很难让人立刻说它哪里不对。\n\n排在前面的同学陆续填表、扫码、领卡。有些人很快，有些人犹豫一下，但最后也还是把手机掏出来。\n\n李向阳排在我们前面。\n\n轮到他时，他没有立刻填表，而是先看了套餐说明，又问了几个问题。\n\n“可以不激活吗？”\n\n“可以，不过建议激活，优惠期内比较划算。”\n\n“三个月后自动续费？”\n\n“到期后按标准套餐走，你可以自己取消。”\n\n“和校园网绑定是必须的吗？”\n\n“不是必须，但绑定后以后用校园网会方便一点。”\n\n李向阳点点头。\n\n然后他填了表，扫码付款。\n\n整个过程不超过两分钟。\n\n我看着他把手机收起来，忽然觉得这很李向阳。\n\n他不是没有意识到这件事有点奇怪。\n\n只是对他来说，九十九块钱、三个月套餐、可以取消、不会影响自己，这些条件加在一起，构成了一个很清楚的结论：不值得为了这件事耗费额外成本。\n\n很快轮到朱铭。\n\n桌后的长发学长笑着把表推过来。\n\n“同学，姓名专业填一下，然后扫这个码付款就行。”\n\n朱铭低头看了看表。\n\n“学长，我不办。”\n\n学长愣了一下。\n\n“是这样的，这个套餐是书院这边统一推荐给新生的。你们刚来学校，之后联系辅导员、班导、接收通知都会比较方便。”\n\n“我有两张电话卡了。”朱铭说，“再办一张的话，我的人生就要正式进入三卡时代了。”\n\n长发学长显然没想到他会这么说。\n\n他停顿了半秒，继续保持笑容。\n\n“同学，这个不是普通电话卡，是校园通讯服务。大家基本都会办，你不办的话，后续有些通知和统计可能会不太方便。”\n\n“我微信能收通知，QQ能收通知，手机也能打电话。”朱铭说，“再不济还能托梦。”\n\n我差点没绷住。\n\n长发学长脸上的笑容终于有点僵。\n\n“那你先到旁边等一下吧。”\n\n朱铭没有继续争，转身就朝着教室外走去。\n\n经过我身边时，他拍了拍我的肩膀。\n\n力度不重。\n\n可那一下却像把某种选择递到了我手里。\n\n轮到我了。\n\n桌上的表格被推到我面前。\n\n姓名、学院、专业、班级、联系电话、身份证后六位。\n\n笔就放在表格旁边。\n\n我低头看着那张表，忽然觉得那支笔很沉。\n\n“同学？”\n\n长发学长提醒了一声。\n\n“填一下就可以。”\n\n“学长。”我说，“这个一定要办吗？”\n\n“不是一定。”他说，“但是建议办理。刚才尹学长应该也和你们说了，这是书院统一推进的校园通讯服务，后面通知、管理、联系都会方便一点。”\n\n我看向前排。\n\n尹渊正站在讲台旁边，和另一个班导低声说话。他没有看我，或者说，即便看到了，也没有表现出任何异常。\n\n教室里很热。\n\n空调开着，但人太多，冷气被一层层身体挡住，只剩下一点不完整的凉意。\n\n我拿起笔。\n\n笔尖碰到表格上的那一瞬间，我脑子里忽然响起了谷懿前几天说过的话。\n\n别因为人家是班导、成绩好，就对人家言听计从。\n\n言听计从。\n\n这的确很像我一贯的处事风格。\n\n不如说，我来到这个世界之后，大部分时间都在试图对这段人生言听计从。\n\n别人说我该去哪里，我就去哪里。\n\n材料上写我是什么样的人，我就试着装成什么样的人。\n\n通知要求我做什么，我就尽量按时到场。\n\n好像只要我足够配合，就不会有人发现我其实根本没有准备好成为“姜岚”。\n\n可这似乎并不是那个姜岚的风格。\n\n我的手停在表格上方。\n\n下一秒，某种模糊的声音从很远的地方传来。\n\n不是教室。\n\n不是至善楼。\n\n是一台老旧打印机运转时发出的咔哒声。\n\n纸张被一页一页吐出来，带着一点温热的墨粉味。夏天的小房间里没有开空调，风扇摇头时吱呀作响。桌上堆着一摞摞练习册，有人压低声音说：\n\n“岚哥，你这样学校的领导会找你麻烦的。”\n\n另一道声音很年轻，也很焦急。\n\n“这又不是你一个人的事。”\n\n我看见一只手把刚复印好的纸张整理齐，纤细的手指被纸边割出一道很浅的口子。\n\n然后有一句话从更深处浮上来。\n\n“我是学生的一员。”\n\n那声音很近，又像隔着很厚的一层水。\n\n“我当然要维护学生的权益。”\n\n我猛地回过神。\n\n笔尖还悬在表格上方。\n\n手心全是汗。\n\n我并不认为那是我的记忆。\n\n至少此刻不认为。\n\n那更像是这具身体里残留的某段画面，被眼前这张表、这支笔、这间教室里过于熟悉的话术短暂唤醒。\n\n物质是精神的载体。\n\n如果身体真的承载着另一个人的精神痕迹，那么某些动作、某些气味、某些场合，也许就会把它们重新挤出来。\n\n这解释很不科学。\n\n但我愿意相信，科学并不能解释这个世界的全部。\n\n“同学？”\n\n长发学长又叫了我一声。\n\n“这个不是强制，但建议你现在就办一下。后面宿舍通知、学院消息、校园网验证，很多地方都会默认用这张卡。你现在不办，之后自己再去营业厅处理，会比较麻烦。”\n\n他说得很熟练。\n\n熟练到像这句话已经重复了很多遍。\n\n但有些话，并不是重复的次数足够多，就能变成真理。\n\n我把笔放回桌上。\n\n“我不办。”\n\n对面的人表情唰的一下变了。\n\n“你已经有卡了？”\n\n“嗯。”\n\n事实上这不是重点。\n\n但我还是点了头。\n\n“有卡也可以办。”他有些勉强地又恢复了笑容，“这个主要是校园套餐，优惠期很划算，大家都办了。你不办的话，之后班里统计起来也麻烦。”\n\n“那如果不办会影响正常收通知吗？”\n\n“这个我们不能保证。”他说，“所以我们还是建议……”\n\n“所以到底是会还是不会。”\n\n“一般来说是不会，但……”\n\n“如果不影响正常收通知，那我不办。”\n\n一连串的话语全部脱口而出后，我才发现自己的声音有点紧。\n\n不是热血漫画里那种清澈坚定的少年音。\n\n更像是被班主任点名背课文时，明明背得下来，却还是担心下一句会卡壳。\n\n“同学，你这样我们很难做。”\n\n长发学长的笑容一点点收了回去。\n\n“今天不是只针对你，整个立华书院新生都在办。大家都配合，流程很快就走完了。你要是有特殊情况，可以和班导说明，但不要在这里影响后面同学。”\n\n后面同学。\n\n影响流程。\n\n大家都配合。\n\n这些词一个个落下来，听起来都很合理。\n\n合理得让我有点喘不过气。\n\n就在这时，尹渊竟也走了过来。\n\n“怎么了？”\n\n他的语气依旧温和。\n\n“尹学长，这位同学不太想办。”\n\n尹渊看向我。\n\n他似乎这才认出我，眼神在我脸上停了一下。\n\n“姜岚？”\n\n我点头。\n\n“有什么顾虑吗？”\n\n“我已经有电话卡了。”我说，“而且刚才学长也说，不办不会影响正常收通知。”\n\n尹渊没有立刻反驳。\n\n他甚至轻轻点了下头。\n\n“理论上是这样。”\n\n然后他说：\n\n“但大学里很多事情不是只看理论上的必要性，也要看协作成本。大家都配合，事情就简单；每个人都按自己的想法来，后面执行起来就会很麻烦。”\n\n平静、合理、体面。\n\n没有一句脏话，也没有一句明显的威胁。\n\n“姜岚。”尹渊继续说，“你应该不是不理解这个道理的人。”\n\n教室里安静了一些。\n\n不是所有人都在看我。\n\n但离得近的同学已经放慢了填表动作。有人低头假装研究套餐说明，有人用余光往这边瞥。\n\n我忽然很想把笔重新拿起来。\n\n填完。\n\n付款。\n\n拿卡。\n\n然后离开。\n\n九十九块钱而已。\n\n三个月而已。\n\n平摊到一个月也就是三十多块，不过几次早餐的钱……\n\n比起接下来可能发生的麻烦，它简直便宜得像给我开出的优惠套餐。\n\n可就在我这样想的时候，那台老旧打印机的声音又一次在脑子里咔哒响了一下。\n\n纸张被吐出来。\n\n温热的，粗糙的，带着墨粉味的。\n\n我的喉咙动了动。\n\n“如果这是自愿，那就应该允许有人不办。”\n\n我听见自己这样说。\n\n声音不大。\n\n但足够周围人听见。\n\n尹渊看着我。\n\n“当然允许。”\n\n“可如果不办会让你们很难做，让班级统计很麻烦，让后续管理不方便，那它就不是单纯的自愿。”\n\n我停了一下，语速开始不受控制地变快。\n\n“如果这是学校或者书院正式要求，那应该有正式通知，明确写清楚必须办理、费用多少、用途是什么。如果不是正式要求，那就不能用‘统一安排’或者‘大家都配合’来要求每个人都办。”\n\n说到这里时，我忽然意识到自己好像说得有点太快。\n\n快到像在赶着把一段尚未背熟的台词念完。\n\n但我已经停不下来了。\n\n“我不是说套餐一定有问题，也不是说别人不能办。想办的人当然可以办。但我不想办，所以我不办。”\n\n教室里彻底安静下来。\n\n安静得我甚至能听见隔壁117教室传来的说话声。\n\n那边似乎也有人在和学长争执。\n\n或者只是我的错觉。\n\n尹渊看着我。\n\n他脸上几乎看不出什么表情变化。\n\n如果一定要说，我甚至觉得那点笑意比刚才更明显了。\n\n我没看懂。\n\n那比他直接冷下脸更让我不舒服。\n\n“我明白你的意思。”\n\n他说。\n\n“既然你坚持，那当然可以不办。”\n\n这句话听起来像让步。\n\n但我并没有因此松一口气。\n\n因为尹渊紧接着又说：\n\n“只是大学不是高中，很多时候你要学会判断什么事情值得做，什么事情不值得做。”\n\n我没有回答。\n\n因为我知道自己如果继续说下去，很可能会把刚才好不容易攒起来的一点气势全部说漏。\n\n于是我转身往教室外走。\n\n这应该是一个很有尊严的举动。\n\n如果这是热血漫画，这里说不定该响起BGM，镜头从我略带落寞的背影慢慢拉远，所有人都在沉默中目送主角潇洒离场。\n\n可下一秒的现实中，只有我因为走得太急、太紧张，结果被门口一块凸起的瓷砖绊了一下。\n\n我非常明显地踉跄了半步，几乎差一点就和地面来了个亲密接触。\n\n身后隐约能听到惊呼声，我敢肯定那不是我的BGM。\n\n不能回头……一定不能回头。\n\n“真男人从不回头看爆炸。”\n\n我努力地无视这份尴尬到极点的“尴尬”，假装什么都没发生。\n\n终于，这一幕Cut了。\n\n走廊里的空气比教室里似乎还要凉上一些。\n\n这一刻，我才发现自己的手还在抖。\n\n不是很明显。\n\n但确实在抖。\n\n朱铭靠在不远处的墙边，见我出来，直起身。\n\n他没有问我办没办。\n\n只是看了眼我刚才差点绊倒的地方。\n\n“前半段挺帅的。”\n\n我沉默了一下。\n\n“后半段呢？”\n\n“后半段物理规律差点战胜你。”\n\n我突然有点想笑。\n\n但只是呼出一口气。\n\n“别笑。”我说，“我现在腿还有点软。”\n\n“看出来了。”朱铭说，“你现在的表情相当不错。”\n\n我这才注意到自己的表情管理在走出教室的那一刻就已经彻底崩坏。\n\n“那你还夸我帅？”\n\n“人生总有那么几个高光时刻。”\n\n我们两个正说着，隔壁117教室门口忽然传来一阵骚动。\n\n我转头看去。\n\n谷懿从里面走了出来。\n\n他手里也拿着一张空白登记表，像是刚从某个战场缴获的敌军文件。\n\n看见我，他眼睛亮了一下。\n\n“哟。”\n\n“你也不办？”\n\n“我本来想看看他们能把‘自愿’这个词变出多少种花样。”谷懿说，“结果发现这门手艺在各个专业之间发展得相当均衡。”\n\n朱铭问：“你们那边怎么样？”\n\n“差不多。”谷懿把表格折起来，“他们说整个书院都在推进，不办会影响后续管理。我问他们，既然是通讯服务，为什么不先服务一下我的通讯自由。”\n\n“通讯自由？”\n\n“比如呢，我在入学之前就想和大四的蔡学姐和大二的王学姐她们建立一些友好的个人关系了，只是苦于一直没要到她们的联系方式……”\n\n“行了行了，别扯远了，然后呢？”\n\n“然后我就出来了。”谷懿说，“再说下去，我们班导可能要陷入对人生意义的怀疑了。”\n\n他说得轻松。\n\n今晚这件事确实不是尹渊一个人的主意。\n\n它来自书院的通知，来自管理层的默许，来自班导的执行，来自运营商的桌子，来自“大家都办”的人群，也来自每个觉得“算了，就这样吧”的瞬间。\n\n这才更麻烦。\n\n谷懿走到我旁边，忽然神情严肃、郑重其事地拍了拍我的肩膀：\n\n“很遗憾错过了小岚你慷慨激昂的演讲。”\n\n我愣了一下。\n\n“你听见了？”\n\n“门没关严。”他说，“再加上你后半段音量又大、语速又快，不知道的以为在做战前动员。”\n\n“……我那时候可紧张了好吗，他们可是车轮战2对1……”\n\n“行了行了，夸你两句还喘上了。”\n\n谷懿发自内心地笑了。\n\n“少得意，下次哥给你表演个真正的演讲，到时候好好看，好好学，噢，最好是能随身携带个相机，这样就可以把我的英姿记录下来，以便后人反复观摩学习……”\n\n谷懿又开始不负责任的口嗨了。\n\n我当时当然没有把这句话放在心上。\n\n后来想起来，倒是真有点后悔那天没有随身携带相机。\n\n我却在一旁静静地陷入了无止境的尴尬中。\n\n真正的黑历史不会因为你离开教室而结束，它只会被隔壁专业进行跨学科旁听。\n\n谷懿看着我，笑意淡了一点。\n\n“不过说真的，你刚才最有意思的地方，不是你拒绝了。”\n\n“那是什么？”\n\n“是你明明怕得要死，逻辑居然没崩。”\n\n他说得很平常。\n\n却让我一时间不知道该怎么接。\n\n我当然怕。\n\n怕自己刚才说错话。\n\n怕尹渊以后针对我。\n\n怕教室里的人觉得我矫情。\n\n……\n\n怕那个并不属于我的姜岚，如果真的站在这里，只会比我做得更漂亮。\n\n“行了。”\n\n朱铭拍了拍我的肩膀。\n\n“走吧。再待下去，我怕他们现场迭代打法、对齐颗粒度，推出第二阶段套餐，拒绝办卡的人统一赠送思想教育大礼包。”\n\n谷懿装作认真思考的样子。\n\n“这个套餐如果有夜间流量，我可能会考虑。”\n\n“你考虑个屁。”\n\n我们三个人沿着楼梯往下走。\n\n至善楼外的夜色已经压下来。\n\n白天晒了一整天的地面还残留着热气，走出楼门时，那股闷热重新扑到脸上。远处操场方向隐约传来口号声，也不知道是哪一个学院的军阵还没结束训练。\n\n我回头看了一眼。\n\n115教室的灯还亮着。\n\n透过窗户，尹渊会不会正在和长发学长说些什么，教室里其他的同学会不会在窃窃私语着议论我这个“刺头”。\n\n我不知道。\n\n这一刻，我好像没有那么想知道。\n\n朱铭走在我旁边，忽然问：\n\n“所以你真的不办？”\n\n“不办。”\n\n“行。”他说，“那我也不办第三张了。”\n\n我看了他一眼。\n\n“你本来就不该办第三张。”\n\n“话不能这么说。”朱铭一本正经，“人类文明很多伟大进步，都是从不该开始的。”\n\n谷懿在旁边点头。\n\n“比如资本主义。”\n\n“比如你少跑两圈。”我说。\n\n谷懿很自然地把手里的空白登记表塞进口袋。\n\n“那不叫少跑。”\n\n“叫什么？”\n\n“叫对不进行价值生产的无意义重复性机械劳动的理性拒绝。”\n\n朱铭沉默两秒。\n\n“太长了我没记住，你能再说一遍吗？我下次请假想用。”\n\n夜风从教学楼之间穿过来，带着一点还没散尽的热。\n\n我走在他们中间，手心的汗终于慢慢干了。\n\n其实我知道，刚才那场所谓的反抗并不漂亮。\n\n我说得很急。\n\n差点摔倒。\n\n走出教室后腿还在发软。\n\n如果把这件事写进什么龙傲天爽文里，大概连编辑都会委婉建议：主角气场不足，建议重写。\n\n可我没有重写的机会。\n\n现实里的每一句话都只能说一次。\n\n说出口之后，不管漂亮还是狼狈，它都会留在那里。\n\n就像那张我没有填完的表。\n\n就像那支被我放回桌上的笔。\n\n也像很远很远的某个地方，那台还在咔哒作响的打印机。\n\n我不知道那个被我称作原主的姜岚，现在究竟在什么地方。\n\n也不知道今晚过后，尹渊会不会把闹得欢的我拉进某个清单里。\n\n但至少此刻，走在至善楼外闷热的夜风里，我忽然觉得，自己好像没有完全辜负那个在复印机旁说话的他。\n\n哪怕只是很小、很笨拙的一点。\n\n手机又震了一下。\n\n这次是朱铭在A109小群里发的消息。\n\n【朱铭：今晚有玩家解锁新成就：拒绝校园通讯服务。】\n\n紧接着，他又发了一条。\n\n【朱铭：附加成就：差点被瓷砖单杀。】\n\n我面无表情地把手机锁屏。\n\n大学生活真是太丰富了。\n\n丰富到连一次不办电话卡的插曲，都能险些变成我的人生最终章。\n\n大学城的街区已经入夜，周围一片寂静，只有远处偶尔传来汽车鸣笛的声音。街道两侧的树木在微风中沙沙作响，偶尔几片被吹下的落叶，似乎是秋天在倔强地证明自己已经来到。"},{"title":"第七章：不速之客","file":"7、第七章.md","text":"顶撞尹渊的那天晚上，我一度以为自己的大学生活就此进入了某种全新路线。\n\n按照比较常见的爽文剧情发展，我应该从此觉醒主角之魂，在立华书院的各类不公面前一路高歌猛进，拳打尹渊，脚踢张迪，最后在夕阳下对着镜头说出一句足以被做成短视频封面的台词。\n\n可第二天早上，闹钟响起的时候，我面对的第一件事不是命运，也不是理想，而是军训服。\n\n而且是没有任何选择余地的军训服。\n\n现实就是这样。\n\n它不管你前一天晚上有没有完成什么人格上的小小升级，也不管你是不是刚刚拒绝了一张校园通讯卡。只要早上六点二十到来，你就必须从床上爬起来，把那套又闷、又硬、还带着一点洗不干净的汗味的迷彩服重新穿到身上。\n\n于是，那份刚刚冒头的英雄感，在我和腰带扣搏斗了十秒后，迅速夭折。\n\n之后的几天也大抵如此。\n\n白天站军姿、踢正步、跑步、喊口号。\n\n晚上回宿舍洗澡、洗衣服、吹头发，然后在身体还没有完全属于自己的时候睡着。\n\n第三天开始，军训服的味道就变得很难形容了。\n\n朱铭对此的评价是：\n\n“这衣服现在已经有灵性了。”\n\n“什么灵性？”我问。\n\n“它开始主动拒绝被清洁。”\n\n我当时很想反驳。\n\n但低头闻了一下袖口后，我决定尊重事实。\n\n它当然被洗过。\n\n甚至每天都被我们用不同品牌、不同香型、不同价格区间的洗衣液认真洗过。\n\n但那种汗水、尘土、晒干后的布料、塑胶鞋底和廉价迷彩布混在一起的气味，仿佛已经不再是一种气味，而是军训这件事本身以物理形式扎根在了衣服里。\n\n“自由”、“自我”，这样的字眼在这些日子里是找不到的，就连下训后将头发从军帽下拯救出来的自由，也被毛教官剥夺了——\n  \n那天早上集合时，毛教官突然大踏步走到所有军阵的前方，问我们究竟明不明白这身军装意味着什么。  \n  \n我们自然是答不上来，于是他开始痛斥“一些同学”下训后就把军帽脱下，甚至拿在手里把玩的大逆不道之行，说这是对身上这套军服的严重侮辱和亵渎、军人就要有一个军人的样子……  \n  \n最后才下达了结论式的命令：军装必须穿在身上，军帽必须戴在头上。\n\n在这种日子里，我越来越能理解谷懿的一些话。\n\n他说军训是服从性测试。\n\n刚开始我只把这句话和他其他危险发言一起归进“谷懿吹牛文件夹”。毕竟这个文件夹的容量很大，从资本主义到跑步少跑两圈，从哲学系的尊严到他未来可能改变世界，什么都能装。\n\n可当一个人连续几天站在太阳底下，按照别人的口令抬腿、放下、转身、立正、稍息，并且逐渐开始习惯这种生活时，他很难不对自己产生一点怀疑。\n\n尤其是当我意识到，我并没有比别人更痛苦，也没有比别人更清醒。\n\n我只是和大家一样，在哨声响起时动，在口令落下时停。\n\n这并不是什么值得大书特书的堕落。\n\n更糟糕的是，它甚至很普通。\n\n九月二十一日，中秋。\n\n按理说，这个词应该让人想到月饼、晚饭、家里的群聊，以及客厅电视里不知道第几次响起的晚会开场白。\n\n可在云梦师大，它首先意味着一整天照旧的哨声、集合和操场。\n\n集合前，母亲给我发来微信。\n\n【妈：中秋快乐。今天还军训吗？天气热，做好防晒。】\n\n我看着那条消息，手指在屏幕上停了一会儿。\n\n这条消息很普通。\n\n可我偏偏在这种普通面前迟疑了几秒。\n\n因为它来自这具身体的母亲。\n\n也是我正在努力扮演的那个身份的母亲。\n\n最后我只回了四个字。\n\n【我：中秋快乐。】\n\n想了想，又补了一句。\n\n【我：放心。】\n\n发完之后，我把手机放进口袋。\n\n当天上午的训练内容依旧没有什么新意。\n\n张迪让我们练高抬腿。\n\n所谓高抬腿，听起来像是一种简单动作。\n\n可当它被放在九月的太阳底下，放在已经站了许久军姿的腿上，放在一个随时会喊“抬高”的教官面前时，就会变成某种不太适合人类长期保持的姿势。\n\n“腿抬高！”\n\n张迪站在队列前方，声音又硬又亮。\n\n“你们这是高抬腿还是散步？第四排，重来！”\n\n队列里响起一阵压低的吸气声。\n\n没人敢抱怨。\n\n或者说，抱怨这种行为已经被大家自动压缩成了脸上的细小表情。\n\n我右侧站着的那个女生，后来我才知道她的名字。\n\n我前几天就注意到她了。\n\n倒不是因为发生过什么特别的事。\n\n她个子不高，军帽压下来时，脸显得更小。\n\n张迪喊“脚尖绷直”时，她是真的会低头确认自己脚尖的人；别人趁休息小声抱怨时，她也会先听完，再露出一点像是在认真思考的神情。\n\n这种认真有点笨拙，也有点固执。\n\n真正让我在那天上午注意到她的，是她的水瓶。\n\n上一次休息时，她的水瓶就已经空了，透明瓶身里面只剩下一点被太阳晒出的水汽。\n\n训练间隙很短，张迪又早早说过，任何人不许离开军训场去买水。\n\n“休息就是让你们调整状态，不是让你们逛超市！”\n\n他说这话时，语气理直气壮得仿佛军训场边卖水的自动贩卖机是某种敌对势力。\n\n我自己的水还剩小半瓶。\n\n说实话，那点水对我来说也很重要。\n\n人在太阳底下站久了以后，会对每一口水产生一种近乎宗教般的敬意。平时两块钱一瓶的矿泉水，在那种时刻足以拥有被供奉在神龛上的资格。\n\n休息哨响起时，大家几乎同时蹲下、坐下、摘帽子、喝水。\n\n我拧开瓶盖，喝了一口。\n\n水已经被晒得有些温。\n\n称不上好喝。\n\n但它可是水啊。\n\n我看见陈小云拿起自己的空瓶，停了一下，又把瓶子放回角落，抬手用手背擦了擦额角的汗。\n\n我把瓶盖重新拧好。\n\n“如果不介意的话，要不喝我的？”\n\n陈小云侧过头看向我。\n\n她明显地愣了一下。\n\n“不用。”\n\n她声音很轻。\n\n“等会还要训练。”我补了一句，“教官也不让出去买。”\n\n她低头看了一眼自己的瓶子。\n\n她又看了看我手里的水瓶，迟疑了一下。\n\n同喝一个瓶子的水，这件事无论放在哪种青春校园作品里，都很容易被作者拿去做一些不必要的暧昧文章。\n\n而我们现在的关系无限接近于陌生人，显然没有熟到可以支撑这种剧情。\n\n我赶紧补充到：“你把瓶子拿过来，我倒一点给你吧？”\n\n她这才点了点头以示同意，把自己的空瓶递了过来。\n\n我的动作很慢，尽量不让瓶口有碰上的可能。\n\n水落进空瓶里，发出清脆的声响。透明的水线往下落着，很快越过了瓶身中间那道标签边缘。\n\n她伸手轻轻碰了一下瓶身。\n\n“你也留一点。”\n\n我闻言怔了一下，连同手上的动作也停了下来。\n\n“没事。”\n\n“谢谢，但是已经够了。”\n\n她只喝了一小口，就拧上了瓶盖。\n\n“我叫陈小云。”\n\n我没想到她会突然自我介绍，反应慢了半拍。\n\n“姜岚。物理系。”\n\n“嗯，哲学系。”\n\n哨声很快响起。\n\n休息结束。\n\n所有人重新站起来。\n\n但当我重新站回队列时，右侧那个有些倔强的女生不再只是“右侧那个女生”了。\n\n她有了名字。\n\n有些东西，似乎因为这半瓶水改变了。\n\n下午三点多，主席台方向忽然传来一阵哨声。\n\n这并不稀奇。\n\n军训期间，哨声是一种比人类语言更高级的存在。它不负责解释，只负责让所有人立刻停止当前动作，并开始各自猜测下一步会发生什么。\n\n张迪听见哨声后，一路小跑到主席台附近，和其他几个教官一起站成一排。\n\n又过了几分钟，张迪终于回来了——当然，我们并不期待他的回归，倒是巴不得他晚些回来，被毛教官扣在主席台那边最好。  \n  \n“全体都有！立正！”  \n  \n“稍息！”  \n  \n“接下来，我通知一件重要的事情！”  \n  \n“今天是中秋节。等会，我们的谭校长要前来慰问大家。”  \n  \n“这是一个难得的展示我们训练成果的机会！大家从现在开始打起十二分的精神！拿出最好的状态！随时准备迎接谭校长的到来！”  \n  \n“全体都有！继续训练！”\n\n话音刚落，队列里响起一阵压低的骚动。\n\n“什么？领导要来？”\n\n“你听清刚才他说的名字了吗？”\n\n“不是哥们，你连谭院士都没听过啊？”\n\n“我……”\n\n“肃静！”\n\n张迪扫了我们一眼。\n\n“继续训练！都给我打起精神。谁要是到时候给我掉链子，别怪我不客气。”\n\n谭校长。\n\n这个名字我并不陌生。\n\n准确地说，在进入云梦师大之后，我已经从各种场合听过很多次。\n\n开学典礼材料里有他。\n\n学校官网首页有他。\n\n校园宣传栏里有他。\n\n甚至今年的开学宣传短片，主角也是他：《云梦师范大学谭子厚院士寄语2021级新生》。\n\n视频封面上的谭子厚穿着蓝白格子衬衫，头发半白，神情温和，看起来不像一个副校长，倒更像某种会在纪录片里缓慢讲述海洋与生命奥秘的长辈。\n\n但对新生而言，他当然不只是“长辈”。\n\n光是“院士”这两个字，就足以说明一切。\n\n一时间，院士要来慰问我们的消息便在整个田径场炸开了锅，尽管几个教官都在努力维持着秩序，但同学们的兴奋还是难以掩饰。  \n  \n尤其是不远处生科班的同学，“谭子厚”这个名字对他们无疑更加熟悉，甚至可能是他们中不少人的偶像，听说自己的偶像、学术界的大拿要亲自来慰问他们，军训带来的紧张、疲惫几乎顿时间就一扫而空了。\n\n“真的是谭院士吗？”\n\n“废话，云梦师大姓谭的校长不就这一位？”\n\n“他可是工程院院士啊！”\n\n“我听说他爸也是院士。”\n\n“一门双院士？”\n\n“对，谭家好像就是搞海洋生物研究这一块的，特别牛。”\n\n“我靠，这是什么学阀。”\n\n最后一句话来自朱铭。\n\n他说完之后，又被李向阳纠正：\n\n“学术世家、书香门第，什么‘学阀’，祸从口出。”\n\n朱铭看向他。\n\n“李哥你真的很不幽默。”\n\n李向阳没有理会他的吐槽，只是看着主席台方向。\n\n他的神情比平时更认真一点。\n\n“谭校长本科、硕士、博士应该都是在国内读的，后来去国外做过访问学者，回来之后拿了国家级项目，三十多岁就做了重点实验室方向负责人。”\n\n“你怎么连这个都知道？”朱铭问。\n\n“学校官网有。”\n\n“你没事看学校官网干嘛？”\n\n李向阳沉默了一下。\n\n“了解学校资源。”\n\n朱铭又一次露出了敬畏的表情。\n\n“我输了。我到现在连教务系统密码都没设置。”\n\n周围的人们脸上的兴奋是真实的。\n\n甚至连这几天被军训折磨得没什么表情的人，也在听见“院士”“谭校长”“慰问”这些词后，也重新露出了一点亮光。\n\n我也忍不住往主席台那边看。\n\n那时我甚至还没见到谭校长本人，只是听着周围人一遍遍说“院士”“国家级项目”“一门双院士”，心里就已经跟着浮起一点说不清的期待。\n\n这种期待有点俗。\n\n但操场上大概没几个人能完全免俗。\n\n大约二十分钟后，主席台附近的人群明显多了起来。\n\n毛锐站在台侧。\n\n辅导员彭悦也在。\n\n几个穿白衬衫的老师从教学楼方向走来，身后还有拿相机和摄像机的人。\n\n整个田径场的气氛随之发生变化。\n\n教官们变得比平时更严肃。\n\n学生们也开始下意识站直。\n\n这种变化很微妙。\n\n明明没有人正式宣布什么，但所有人都知道，“被看见”的时刻就要到了。\n\n很快，一个穿蓝白格子衬衫的男人走上主席台。\n\n他看起来比宣传片里更瘦一些，头发半黑半白，袖口挽得不高，走路时没有刻意摆出什么领导架子。身边围着几位老师和教官，他却好像和他们不在一个画风里，就像一位普通的老人。\n\n田径场上安静了一瞬。\n\n随后，掌声响了起来。\n\n一开始只是主席台附近。\n\n很快，掌声像从中间扩散开的水纹，一层层传到各个军阵。\n\n我也跟着鼓掌。\n\n谭校长走到话筒前，微微弯腰。\n\n“同学们，下午好。”\n\n他的声音通过音响传出来，比想象中更温和。\n\n没有张迪那种刻意拔高的命令感，也没有动员会上那些领导讲话里常见的油滑腔调。\n\n只是很慢，很稳。\n\n“今天是中秋节，是我们中国传统文化里一个很重要的日子。我代表学校，来看望大家，也和大家一起度过这个节日。”\n\n掌声再次响起。\n\n这一次更热烈。\n\n谭校长继续说：\n\n“我刚刚在场边看了一会儿，我们的同学们训练得很认真，也很有精神。”\n\n几位教官站在主席台侧面，腰背挺得很直。\n\n张迪也一样。\n\n他看起来比平时更像一名合格教官了。\n\n至少从远处看是这样。\n\n谭校长停顿了一下，语气放缓了一些。\n\n“这几天军训，同学们辛苦了。”\n\n话音落下的那一瞬间，田径场上出现了极短暂的安静。\n\n那种安静不是没人听见。\n\n恰恰相反，是所有人都听见了。\n\n辛苦了。\n\n这三个字其实很普通。\n\n普通到食堂阿姨递给你一份打包好的饭时可以说，快递员把包裹送到宿舍楼下时也可以说。\n\n可在军训场上，它却突然变得很重。\n\n因为这几天，教官每天都会问我们：\n\n“累不累？”\n\n而正确答案永远只有一个。\n\n“不累。”\n\n哪怕汗水从帽檐往下滴。\n\n哪怕脚底磨得发疼。\n\n哪怕有人晚上回宿舍时连楼梯都不想爬。\n\n我们也只能喊不累。\n\n所以当“辛苦了”这三个字从主席台上说出来时，像是有人终于替我们承认了一个所有人都知道、但一直不能说出口的事实。\n\n下一秒，掌声炸开。\n\n真正意义上的炸开。\n\n有人一边鼓掌一边喊。\n\n有人把手拍得很响。\n\n还有人甚至吹了声口哨，又立刻被旁边同学用胳膊肘撞了一下。\n\n我听见朱铭在旁边低声说：\n\n“我现在宣布，谭校长是今天唯一一个说人话的人。”\n\n“注意措辞。”李向阳说。\n\n“那我改一下。”朱铭立刻从善如流，“谭校长是今天唯一一个说出了人类可理解语言的。”\n\n李向阳白了他一眼。\n\n掌声持续了很久。\n\n久到谭校长不得不抬手向下压了压，示意大家安静。\n\n等田径场重新恢复秩序后，他抬了抬手，像是在接住刚才那阵过于热烈的掌声。\n\n“看来大家确实辛苦。”\n\n这一次，台下响起一阵笑声。\n\n不是很大。\n\n但很真实。\n\n那一刻，我忽然理解了为什么很多人会崇拜这样的人。\n\n他不需要大声。\n\n不需要训斥。\n\n不需要让谁立正、稍息、跑五圈。\n\n只要站在主席台上，说一句所有人都愿意听的话，整个田径场的气氛就会向他靠拢。\n\n这大概也是一种权力。\n\n只是它看起来更温和，也更容易让人心甘情愿。\n\n谭校长接下来又讲了几句。\n\n关于中秋。\n\n关于青年。\n\n关于云梦师大欢迎大家。\n\n这些话并不新鲜。\n\n但由他说出来，学生们依然听得很认真。\n\n就像同样一句“努力学习”，如果由班主任说出来，可能会让人想逃；可如果由院士说出来，就会突然多出某种仿佛可以被验证的重量。\n\n我也不知道这算不算人类的奇怪之处。\n\n“今天既然是和同学们一起过节，我也不想只是自己站在这里自顾自地讲话。”\n\n谭校长看向台下。\n\n“有没有同学愿意上来，谈谈这几天军训的感受？”\n\n田径场先是安静了一瞬。\n\n然后，许多军阵里都传来细碎的骚动。\n\n有人明显动心了。\n\n毕竟那可是和院士同台讲话的机会。\n\n哪怕只是说几句“军训让我收获了成长”“教官很辛苦”“我会继续努力”之类的标准答案，回头发到朋友圈里，也足够让高中同学点赞到手软。\n\n更何况，旁边还有摄像机。\n\n摄像机这种东西很危险。\n\n它会让人突然相信，自己的人生也许正在进入某个值得被记录的时刻。\n\n“不用紧张，随便说说就好。”\n\n生科班那边最先有人举手。\n\n紧接着，其他军阵里也有人举手。\n\n“我！”\n\n“谭校长，看这里！”\n\n“选我选我！”\n\n整个场面一下子从军训慰问变成了大型抽奖现场。\n\n可就在所有人都还停留在“举手争取机会”的常规玩法里时，一个声音突然从身后响了起来。\n\n“谭校长！”\n\n那声音很亮。\n\n也很熟。\n\n我心里一跳。\n\n还没等我转头，就看见哲学班的队列里冲出一个人。\n\n谷懿。\n\n他没有举手。\n\n也没有等人点名。\n\n他直接跑出了军阵。\n\n那种感觉很难形容，像一张表格里突然有一个单元格开始播放视频。\n\n“谭校长！选我！”\n\n谷懿一边跑，一边喊。\n\n“21级哲学班谷懿！请求发言！”\n\n台下瞬间炸开。\n\n“我靠，还能这样？”\n\n“这哥们谁啊？”\n\n“哲学班的怪人，难怪啊！”\n\n“不是，哲学班也不能直接冲主席台吧？”\n\n张迪的脸色变了。\n\n“谷懿！归队！”\n\n张迪明白，眼前的这一幕正是自己疏忽造成的，但又不敢在众目睽睽下直接把谷懿给抓回来。\n\n可就是这犹豫的瞬间，谷懿已经飞一般跑到了主席台前。\n\n站在主席台侧面的总教官，立刻向前迈了一步，似乎打算拦住谷懿。\n\n但看着那个一路跑来的男生，谭校长非但没有生气，反而抬手示意旁边的人先别动。\n\n于是，谷懿竟就这样一口气跑上了主席台。\n\n负责递话筒的主持人显然还没从震惊中反应过来，手里的话筒停在半空，像是突然忘了自己该把它递给谁。\n\n说时迟那时快，谷懿一个箭步上前，几乎是顺手的，一把将话筒从主持人手里拿了过来。\n\n“谭校长，请您允许我代表同学们发言！”\n\n语气认真到仿佛刚才那一路狂奔不是鲁莽，而是一种必要的礼节。\n\n谭校长下一秒说出的话同样把众人惊掉了下巴。\n\n“好，那就请这位同学给大家开个头吧。”\n\n谭校长大手一挥，原谅了谷懿的鲁莽，也给了他这个旁人无比艳羡的机会。  \n  \n看着如此不守规矩的谷懿，整个田径场上大概除如释重负的张迪外，其余众人脸上都流露着懊恼、遗憾……还有，鄙夷的神情。  \n  \n“我靠，这小子这不作弊吗！”  \n  \n“不是哥们，还能这样玩啊？”\n\n台下顿时响起一片夹杂着惊讶、羡慕、懊恼和不服气的声音。\n\n“不是吧，真给他上了？”\n\n“这也行？”\n\n“早知道我也冲了。”\n\n“你冲一个试试，教官能把你按地上。”\n\n朱铭站在我旁边，同样目瞪口呆，只不过他的关注点，略微有些奇怪。\n\n“明明体能这么好，却还要少跑那几圈吗……谷懿，你这家伙！”\n\n我没有接话。\n\n因为就在谷懿走上主席台的那一刻，我忽然想起了几天前在至善楼外，他笑着对我说的那句话。\n\n“下次哥给你表演个真正的演讲，到时候好好看，好好学，最好随身携带个相机。”\n\n谷懿接过话筒。\n\n主席台上风很大，吹得他额前的碎发轻轻晃了一下。\n\n他没有立刻说话。\n\n而是先看了一眼台下。\n\n那一眼扫过无数穿着相同迷彩服的新生，扫过站在队列旁的教官，扫过主席台侧面的毛锐，似乎也和我的视线交叉了一瞬间。\n\n然后，他的脸上绽出一个明亮的笑容。\n\n我忽然有些后悔。\n\n后悔自己没有真的随身携带一个相机。\n\n“大家好。”\n\n谷懿开口了。\n\n音响把他的声音送到整个田径场的所有角落。\n\n“我是21级哲学班的谷懿。”\n\n一个非常普通的开场白。\n\n普通到如果只听这一句，谁都会以为他接下来要说“军训让我收获了纪律意识和集体荣誉感”。\n\n可我知道不会。\n\n我说不上来为什么。\n\n大概因为我认识谷懿。\n\n也大概因为，他此刻站在主席台上的样子，实在不像一个准备说标准答案的人。\n\n田径场安静下来。\n\n谷懿握着话筒，停顿了一秒。\n\n“在我看来，军训的意义。”\n\n“就是没有意义。”"}]},"ja":{"htmlLang":"ja","siteTitle":"僕の青春転生物語はやっぱり何かがおかしい","description":"『僕の青春転生物語はやっぱり何かがおかしい』オンライン読書ページ。","eyebrow":"REBORN / ONLINE READER","subtitle":"もし転生がゲームなら、姜嵐は強そうなのに説明書が半分破れたアカウントを引いたようなものだった。成績はいい。経歴もきれい。未来も明るい。問題は、本人がそのことを何ひとつ知らないことだ。だから雲夢師大の夏、彼はわかったふりをしながら、具体的な人、具体的な痛み、そして具体的すぎる大学生活をもう一度学んでいく。","navButton":"目次","langMobile":"中文","navTitle":"目次","characterTitle":"キャラクター","characterPlaceholder":"キャラクターカードは今後追加予定","volumeTitle":"第一巻：物語の始まりは平凡すぎるくらいでいい","secondTitle":"第二巻：近日公開","thirdTitle":"第三巻：近日公開","pending":"未同期","prev":"前の章","next":"次の章","top":"上へ","themeNight":"夜間","themeClassic":"原色","themeSky":"空色","themeGreen":"若葉","themeWisteria":"藤色","countPrefix":"本章","countSuffix":"文字","chapters":[{"title":"第一章：雲夢の夏","file":"1、第一章.md","text":"贛西の長いトンネルを抜けると、そこは雲夢の夏だった。\n\n九月のはじめだというのに、南方の暑さはまだ身を引く気配を見せていなかった。陽射しは車窓に貼りつくように列車を追いかけ、遠くのビル群や工場、高架橋は熱気の中でかすかに揺れている。ガラスには薄い水気が曇りのように張りついていた。車内の冷房はかなり効いているはずなのに、僕は全身に汗をかいていた。\n\n僕を起こしたのは、列車のアナウンスだった。\n\nその前に、僕は一度死んでいた。\n\nもちろん、こんなことを医者に話せば、事故後の悪夢だとか、トラウマのフラッシュバックだとか、あるいはもっと専門的な響きを持つ睡眠障害の一種だとか、そういう分類に収められるのだろう。どれもきっと正しい。病院の廊下に敷かれた、磨き上げられた床みたいに正しい。清潔で、平らで、そして少しも温度がない。\n\nけれど目を覚ました時、呼吸は喉の奥で引っかかったままだった。視界の中では白い光が断続的に明滅している。列車は滑るように安定して進んでいたのに、車輪が線路を踏む音は、あのブレーキ音の中で迫ってきたヘッドライトの白さを僕に思い出させた。\n\nあれは夢ではなかった。\n\n夢の中の夏は、窓のない教室みたいに蒸し暑かった。高考が終わったあとの県城は、夕立の前みたいに顔をしかめている。古い団地の階段には湿った黴の匂いが漂い、道端のクスノキの葉は風に裏返されて白く光っていた。灰色の雲が通りの突き当たりに低く垂れ込め、今にも世界ごと押し潰しそうだった。\n\n狭い居間で古びた扇風機がぎしぎしと首を振っていたことを覚えている。スマホの画面に表示された点数は、遅れて届いた判決文みたいだった。誰かが僕の隣に座っていて、雨に浸された木片みたいに黙り込んでいた。けれどその人の顔を見ようとするたびに、夢の中の光はふっと暗くなり、最後には汗で湿った受験票を握る自分の手だけが残った。\n\nあの薄い紙切れには、もう実用的な価値なんて何もなかった。けれど、まるで退場することを拒む証拠のように、僕がたしかに人生に判を押されるほどの試験を受け、そしてその試験に完膚なきまでに敗れたのだと証明していた。\n\n父は僕を叱らなかった。\n\n母も泣かなかった。\n\n二人はただ、いつもより少しだけ黙っていた。食卓では扇風機の音だけが大きく響き、青椒肉絲の油が皿の縁で固まりかけていた。テレビでは、どこかの家の子どもが名門大学に受かったという地元ニュースが流れている。母は何度か何かを言おうとして、結局そのたびに料理を一箸、僕の茶碗に入れただけだった。父は箸を置き、「先に少し寝るか」と訊いた。\n\nその時、僕はわかった。\n\nこの家に残っていた「未来」についての最後の想像まで、僕はたぶん、自分の点数で考えられなくしてしまったのだ。\n\nその後の場面は、途切れ途切れだった。\n\n外に出たような気もするし、どこへ向かっていたのかも覚えていない。ポケットの中でスマホが何度か震えたが、僕は出なかった。雨の前の湿気で路面はてらてらと光っていて、遠くから車のクラクションが聞こえた。次にあったのは、過剰なほど眩しい光、現実味を失うほど鋭いブレーキ音、そして体が強く弾き飛ばされる瞬間だった。\n\n痛みは長く続かなかった。\n\nいや、ある一点を越えたあとの痛みは、もう痛みとは呼べないものになっていた。\n\n世界は、突然ぐしゃりと丸められた試験用紙みたいだった。音も、光も、雨も、アスファルトも、自分の呼吸も、全部が混ざり合っている。最後に覚えているのは、額が冷たい路面に触れていた感触と、遠くで誰かが慌てた声を上げたことだけだった。\n\nその次に来たのは、暗闇だった。\n\n二度と目覚めることなんてないのではないかと思うほど、長い暗闇だった。\n\n「ご乗車のお客様にご案内いたします。まもなく雲夢南駅に到着いたします。お降りのお客様は、お忘れ物のないようお支度ください……」\n\n女性の声は穏やかで、澄んでいて、標準的だった。高速鉄道のアナウンス特有の、妙に冷静な響きを帯びている。\n\n僕は目を開けた。\n\n眼鏡のレンズには薄い曇りがかかっていた。眼鏡を外し、反射的に服の裾で拭こうとしたが、その布も汗を吸って湿っていた。レンズは綺麗になるどころか、かえって濁った水の跡を大きく広げただけだった。\n\n車窓の外は、境界線を失うほど明るかった。大きな白い光がガラスいっぱいに広がり、遠くの街の輪郭は淡く浮かぶだけだった。鉛筆の線が水で滲んだみたいに、見極めようとする間もなく、列車の速度にかき消されていく。\n\n僕は窓側の席に座っていた。膝の前には黒いリュック。足元には銀灰色のスーツケース。テーブルにはまだ画面の消えていないスマホが置かれていて、チケットアプリの行程ページが表示されたままになっている。\n\n雲夢南。\n\n初めてではなかった。\n\n僕はこめかみを押さえた。指先の下で血管が跳ね、何かが頭の内側から出てこようとしているみたいだった。\n\n車内は静かだった。隣の席のおじさんがショート動画を見ていて、そこから漏れる笑い声が少し。前の席の子どもが、小さな声で母親に「あとどれくらい？」と訊く声が少し。\n\nこんな混乱は、もう初めてではない。\n\n最初の数日間、僕は実に無意味なことをいくつも試した。自分の腕をつねった。深夜に何度もスマホの日付を確認した。鏡に映る、記憶の中の自分と何も変わらない顔を眺めた。挙げ句の果てには、壁に頭をぶつけて世界の真偽を確かめるべきかどうか、真剣に考えた。\n\n結論から言うと、世界は僕の疑いに対して何ひとつ明確なヒントをくれなかった。頭だけは、かなり現実的に痛くなった。\n\nだから今の僕は、ゆっくり息を吐き、額を冷たい窓に預けるしかなかった。\n\n僕が本当に目を覚ました場所は、この高速鉄道ではない。\n\n一ヶ月と少し前の、病院だった。\n\n消毒液の匂い。白い天井。ベッド脇の機械が規則正しく鳴らす電子音。そして、ベッドのそばに突っ伏していた母の、少し赤くなった目元。死そのものみたいに長い眠りから目を開けた時、僕が最初に思ったのは、自分がまだ生きているのだということだった。\n\n指を動かしてみようとした瞬間、母はほとんど同時に目を覚ました。\n\n最初、彼女は呆然と僕を見つめていた。僕の目が本当に開いているのか、信じられないという顔だった。次の瞬間、彼女は立ち上がり、椅子の脚が床を擦って耳障りな音を立てた。涙が一気にあふれたのに、泣いている余裕すらないという様子で、彼女は何度もナースコールを押し、僕の名前を呼び、痛くないか、聞こえるか、自分がどこにいるかわかるかと問い続けた。\n\n父が駆けつけた時、シャツの襟は曲がっていた。彼はベッドのそばに立ち、唇を何度か動かした。結局、何も言わずに僕の頭を撫でただけだった。\n\nその日、余計な話をする人は誰もいなかった。\n\n痛くないか。水は飲みたいか。目が覚めたなら、もう大丈夫なのか。両親が訊いたのは、そんなことばかりだった。数日後、僕が起き上がれるようになり、自分でスプーンを持って粥を食べられるようになり、ひと続きの文章を最後まで言えるようになって、ようやく本当におかしな問題が少しずつ浮かび上がってきた。\n\n僕は覚えている。あの夏、点数に胸を押し潰されそうになっていたこと。画面の前で続いた長い沈黙。誰かがスマホを伏せたこと。もう二度と見たくないと言わんばかりに。記憶の中の担任は電話越しに、妙に丁寧な声で「他に選択肢がないわけじゃない」と言った。親戚たちは、同情に見えないよう努力した口調で、「浪人も悪くないよ」と慰めた。\n\nだが今、両親はひどく慎重に、合格通知はもう届いているのだと僕に告げた。\n\n雲夢師範大学。\n\n物理学類。\n\n立華書院。\n\nそれらの言葉は、完全に見知らぬ文字列みたいに、一つずつ僕の前に並べられていった。\n\n最初、僕は夢を見ているのだと思った。\n\n次に、両親が僕を慰めるために、善意の嘘を用意したのだと思った。\n\nけれど父が合格通知書、身分証、受験票、高校の学籍資料のコピー、受賞証明を一つずつ僕に見せた時、目の前の世界が夢よりもずっと荒唐無稽なのだと、ついに認めざるを得なくなった。\n\n身分証の上の人間は僕だった。\n\n学籍資料に書かれた名前も僕だった。\n\n物理競賽省二等賞の証明書に貼られた写真も僕だった。\n\n家にあった高校の卒業写真でさえ、二列目に立つ、少し髪が乱れていて、表情のぎこちないその顔は、鏡の中の僕と何も違わなかった。\n\n問題は、僕が覚えていないことだった。\n\nいつ自分が教師の言う理系の優等生になったのか、いつ物理競賽に出たのか、なぜ志望校を書く時に両親や教師の勧めを押し切ってまで雲夢師大にこだわったのか、僕は何も覚えていなかった。\n\n両親の口から語られるその「僕」は、怖くなるほど見知らぬ人間だった。\n\nけれど医者は、事故後の記憶障害だと言った。\n\n彼はとても慎重に、できるだけ平易な言葉を選んで説明してくれた。脳に衝撃を受けたあと、人の記憶には欠落、混乱、ずれが起こることがある。少しずつ戻るものもあれば、永遠に戻らないものもあるかもしれない。\n\nただ幸いなことに、僕の言語能力、判断力、生活能力は残っていた。身体の回復も、予想よりずっと良好だった。\n\n「ご本人が望むなら、もともとの生活の流れに戻ることが、回復の助けになる可能性もあります」\n\nこの突然すぎる、あまりにも荒唐無稽な現実を僕がどう受け止めるかとは別に、病室にいた両親にとって、その言葉は日々を前に進めるための一本の綱のようだった。\n\n母は、外地の大学へ行かせても無理はないのかと医者に訊いた。父は、もし急に頭痛がしたり、何かを思い出せなくなったりしたらどうすればいいのかと訊いた。医者は一つひとつ答えた。過度な刺激は避けること。無理に思い出させようとしないこと。そして、完全に能力を失った病人のようには扱わないこと。\n\n退院して家に戻ってからの一ヶ月あまり、僕はそんな慎重すぎる空気の中で暮らした。\n\n父はいつも通り仕事へ行った。ただ、毎日昼になると必ず、昼飯は食べたかとメッセージを送ってきた。母は取った休みを細切れに使い、家にいられる日はできるだけ家にいた。どうしても出かける日は、料理を冷蔵庫に入れ、どう温めればいいかを付箋に書いて残してくれた。\n\nあとになって、僕はよく思うようになった。両親は、僕が思っていたよりずっとすごい人たちだったのだと。\n\nそのすごさは、小説に出てくるような冷静で正しい判断をすぐ下せるからではない。むしろ逆だった。彼らは心配したし、眠れなかったし、台所で声を潜めて「大学へ行かせるべきか」を言い争ったりもした。そして僕が部屋から出てくる音を聞くと、すぐに話をやめ、ただ夕飯の献立を相談していただけだという顔をした。\n\n二人はただの普通の人だった。\n\nそれでも、普通の家庭の上に突然崩れ落ちてきたものを、黙って支えていた。\n\n罪悪感がなかったわけではない。\n\n疑似的な魂の入れ替わりのあと、本来この身体の持ち主に向けられるべき両親の世話を受けているのだ。罪悪感くらい抱くのが、最低限の礼儀というものだろう。\n\nけれど、罪悪感は問題を説明してくれない。\n\n僕は一ヶ月以上かけて、この世界を検証した。\n\n机を漁り、アルバムを見返し、チャット履歴を読み、記憶の中にある高校、試験、ニュース、街の細部を検索エンジンで調べたりもした。結果は、調べれば調べるほど混乱するばかりだった。\n\nこの世界には、もう一人の姜嵐がいた。\n\n同姓同名。同じ父と母。同じ顔。身分証番号でさえ、少しも違わない。\n\nけれどその姜嵐は、理科総合で満点近い点を取り、物理競賽にも参加し、本棚には『力学』『電磁気学』『資本論』と、僕が書名を読むだけでもつまずきそうな本が並んでいた。一方、僕の記憶の中の自分は、いつまでも窮屈な居間と、沈黙した食卓と、点数確認ページに光る刺々しい数字に絡め取られている。\n\n二つの人生は、無理やり重ねられた二枚の答案用紙みたいだった。名前欄だけは完全に一致しているのに、答えは一問たりとも合わない。\n\nそしてある明け方、僕は机の前に座り、画面いっぱいに並んだ検索履歴を見つめながら、いちばん胡散臭くて、それでいて自分を少しだけ呼吸させてくれる答えを見つけた。\n\n平行世界。\n\n魂の交換。\n\nどこのライトノベル編集者でも、一目見た瞬間に「その設定、いまさら古すぎない？」と眉をひそめそうな代物だ。\n\nこの説明に穴が多いことはわかっている。\n\nけれど、そう考えなければ、僕は別の可能性を認めるしかなくなる。つまり、これらの見知らぬ成績、本、志望校、人間関係は、もともとすべて僕のもので、ただ僕が一つ残らず忘れてしまっただけなのだ、という可能性を。\n\nその方が、よほど怖かった。\n\nだから僕は、ひとまず信じるしかなかった。自分は何かの事故によって、もう一人の姜嵐が残した人生の中に放り込まれたのだ、と。では本当の姜嵐はどこへ行ったのか。僕にはわからないし、深く考える勇気もなかった。\n\n僕の世界へ行ったのかもしれない。僕の手の届かないどこかで眠っているのかもしれない。あるいは、多くの物語で入れ替えられた「元の持ち主」がそうであるように、静かに消えてしまったのかもしれない。\n\n最後の可能性を思うたび、胸の奥が沈んだ。\n\nだから僕は、自分にそれなりに体裁のいい理由を与えるしかなかった。今すぐ戻る方法がなく、もう一人の姜嵐の行方も確かめられないのなら、せめて彼の残した人生をめちゃくちゃにしないようにしよう、と。\n\n雲夢師範大学は、この人生に残された最初のセーブポイントだった。\n\n旧データがもう読み込めないのなら、ひとまずここから続きを歩くしかない。\n\nスマホが震えた。\n\n僕は回想から引き戻され、テーブルの上のスマホを手に取った。画面が明るくなり、母からの微信が表示されている。\n\n> 起きた？　もうすぐ雲夢に着くころ？\n>\n> 頭は痛くない？\n>\n> お父さんが書類をリュックの内ポケットに入れておいたからね。\n>\n> 学校に着いたら、まず物理班の受付へ行って。班導が新入生を案内してくれるから。\n>\n> 具合が悪くなったら電話して。無理しないでね。\n\n僕はその数行を見つめたまま、入力欄の上に指を浮かせ、どこへ動かせばいいのかわからなくなった。\n\nこの気遣いは、あまりにも具体的すぎて苦しかった。\n\nこれが他人の人生なら、この細やかすぎる心配だって当然、僕に向けられたものではない。\n\nその考えは細い針みたいに、胸の奥を軽く刺した。\n\n僕は自分の手を見下ろした。手の甲には、事故のあとに残った薄い傷跡がまだある。医者は数ヶ月すれば薄くなると言ったが、母はそれを見るたびに眉を寄せた。\n\n僕はゆっくり文字を打った。\n\n> 起きた。もうすぐ着く。\n>\n> 頭は痛くない。書類のこともわかってる。\n\n少し考えて、もう一文足した。\n\n> 学校に着いたら連絡する。\n\n送信完了。\n\nほとんど次の瞬間、母から「うん」と返ってきた。\n\n余計な言葉はなかった。もう一言でも多く言えば、僕に負担をかけてしまうと恐れているみたいだった。\n\nそれは長文の説教より、かえって扱いづらかった。慎重すぎる優しさには、こちらが苛立つための隙間すらない。\n\n僕はスマホをテーブルに戻し、車両の端にある電光掲示板を見上げた。赤い文字が列車番号、温度、次の停車駅を流している。雲夢南駅まであと十分。\n\nリュックのいちばん外側のファスナーを開け、手を突っ込んでしばらく探った。充電ケーブル、ティッシュ、硬い表紙のノートしか出てこない。\n\n内ポケット。\n\n背中側の隠しポケットに手を入れると、たしかにファイルケースがあった。\n\n合格通知書、身分証、新入生登録表、銀行カード、証明写真が数枚。どれもきちんとまとめられている。ファイルケースのいちばん下には、雲夢師範大学のキャンパスマップも挟まっていた。\n\nそれらを見て、僕は少し笑いそうになった。\n\nある意味、僕は史上もっとも準備の整った異世界転移者なのかもしれない。普通、目を覚ます場所といえば洞窟か戦場で、運が悪ければ祭壇に縛られて誰かに呪文を唱えられているものだ。ところが僕ときたら、ファイルケース、身分証、銀行カード、キャンパスマップまで一式揃っている。母に至っては、書類の収納場所まで事前に教えてくれた。\n\n僕本人がまるで準備できていないことを除けば、すべてが行き届いていた。\n\n笑いは一秒で消えた。\n\nファイルケースに挟まっている、もう一枚の紙が目に入ったからだ。\n\nそれは病院の再診案内だった。二つ折りにされ、父が書類の間に何気なく挟んだらしい。紙面には医者の癖のある字で、入学後に持続的な頭痛、めまい、睡眠障害、あるいは記憶の混乱が出た場合は、速やかに受診するようにと書かれていた。\n\n僕は「記憶の混乱」という四文字を長いあいだ見つめた。\n\nもし別の人間なら、この紙を見てこう考えるのかもしれない。もしかして自分は本当に事故に遭って、記憶が壊れただけなのではないか、と。\n\nその考えを、僕だってもちろん持たなかったわけではない。\n\nむしろ、この一ヶ月あまり、毎日のように考えていた。\n\n問題は、もしすべてが記憶の故障にすぎないのなら、夢の中の、高考に失敗した僕は何なのかということだった。失敗、恥辱、交通事故、死。あの感触は、なぜ自分の手で触れた傷口みたいに生々しいのか。人間の脳は、何もないところから丸ごと一つの人生を編み出せるのか。両親が黙り込んだ時の表情も、県城の夏夜の湿気も、ベンツのヘッドライトが目に飛び込んでくる白さも、全部作れるのか。\n\nそのうえ、この世界の姜嵐は優秀すぎた。\n\n優秀すぎて、それが「自分」だとは信じられなかった。\n\n僕は再診案内をファイルケースに戻した。危険な問いを、もう一度そこへ押し込めるみたいに。\n\n自分の説明に穴があることはわかっている。\n\n魂の交換が科学的でないことも、平行世界がもっと科学的でないこともわかっている。けれど、人はとりあえず生きていくための説明を必要とする。完全に見知らぬ、完全に優秀で、まるで自分らしくない過去を自分が忘れてしまったのだと認めるくらいなら、僕は世界がどこかの夏に悪質な冗談を仕掛けたのだと信じたい。\n\n少なくともその方が、この人生を借りものとして理解できる。\n\n借りものなら、もともと自分のものだったのに一つ残らず忘れてしまったものよりは、まだ向き合いやすい。\n\n列車はいよいよ駅に入り始めた。\n\n最初に近づいてきたのは、白いホーム照明の列だった。次に、灰色の鉄骨、ガラスの屋根、改札の外に揺れるぼんやりした人影。雲夢南駅は線路の尽きる場所に伏せた金属の巨獣のようで、陽光に照らされた口腔を開き、ゆっくりと、黙ったまま、列車まるごと呑み込んでいった。\n\n車内はたちまち目を覚ました。荷物棚が次々に開かれ、ビニール袋の擦れる音、電話の声、子どものせかす声が四方から湧き上がる。冷房の風に、カップ麺の調味料、スーツケースのプラスチック、ホームから流れ込む湿った熱気が混ざった。さっきまでの短い静けさは、人の波に揉み砕かれていく。\n\n僕はファイルケースをリュックの内ポケットに戻し、ファスナーを閉め、足元のスーツケースに手をかけた。\n\nふと、今朝、家の入口で母が僕を見送っていた姿を思い出した。\n\n父がスーツケースを配車アプリで呼んだ車のトランクに入れていた時、母は廊下の灯りの下に立っていた。彼女は本当はたくさん言いたいことがあるようだった。けれど最後には、ただ僕の襟元を直しただけだった。\n\n「着いても焦らないでね」と彼女は言った。「ゆっくりでいいから」\n\nその時、僕は頷いただけで、何も返さなかった。\n\n列車がまもなく停まろうとしている今になって、僕はようやく気づいた。\n\nその言葉は、たぶん登録手続きのことだけを言っていたわけではない。\n\n**ゆっくりでいい。**\n\n**けれど、列車はもう止まってしまった。**\n\n車内の人々が出口へ向かい始める。スーツケースが一つ、また一つと通路を転がっていく。僕も人の流れに軽く押され、仕方なく、答えの出ない問いも一緒に胸の奥へ押し戻した。\n\n平行世界だろうと、魂の交換だろうと、記憶の混乱だろうと、どれが本当なのかはわからない。\n\nそれでも、これから僕が最初にやるべきことは、とても単純だった。\n\n大学へ行って、入学手続きをする。\n\nそれはどう考えても、偉大な冒険の始まりらしくはなかった。\n\nけれど列車が完全に停まり、ドアが開き、外のざわめきが隙間から流れ込んできた時、僕はやはりスーツケースのハンドルを強く握った。\n\nもしこの世界が本当に、僕にやり直しの機会を与えてくれたのなら、少なくとも初日に逃げ出すわけにはいかない。\n\nもしこれが機会ではなく、見知らぬ姜嵐が僕に残した残局なのだとしても、せめて彼が行くはずだった場所までは、代わりに歩いていくべきだと思った。\n\n僕は人の流れに従って、高速鉄道を降りた。\n\nホームの熱気が正面から押し寄せてくる。アナウンス、人々の足音、スーツケースの車輪がタイルを転がる音が混ざり合った。顔を上げると、透明な屋根の向こうにある空が、いくつもの眩しい青に切り分けられていた。まだ何も書かれていない紙を、たった今広げたみたいだった。\n\nその影のほとんどない光の下で、僕はもう一度、自分に言い聞かせた。\n\n「ここから、この世界を知っていこう」"},{"title":"第二章：登録される人生","file":"2、第二章.md","text":"雲夢南駅から雲夢師範大学までは、地図の上では二十キロにも満たない。\n\nゲームだったら、たぶんただのロード画面だ。主人公が初心者村から交通機関に乗って最初の主城へ向かい、画面には世界観を説明する数行のテキストが表示され、ついでに壮大な音楽つきの、しかもスキップできないムービーが流れる。\n\nけれど現実のムービーは、たいていそんなに親切ではない。\n\n僕はまず出口で人の流れに押されて方向を間違え、次に地下鉄の入口で路線図を前にして三十秒ほど沈黙し、最後にようやくスーツケースを引きずって、市街地方面へ向かう地下鉄に押し込まれた。\n\nその三十秒で、僕は雲夢地下鉄の乗り換えロジックを真剣に学んだ。\n\n学習成果は、ほぼゼロだった。\n\n車内には僕と同じくらいの年齢の新入生が溢れていた。スーツケース、リュック、キャンバスバッグ、保護者の手にある日傘、各学院の新入生案内が一緒くたになっている。まるで街全体が、十八、九歳の若者を同じ日に同じ管の中へ流し込んだみたいだった。\n\nドアのそばで電話している人がいた。\n\n「お母さん、ほんとに道わかってるから。グループに位置情報送られてるって」\n\n新入生手帳を低頭して読んでいる人もいた。\n\n「木蘭広場ってどこ？　なんで書院と学院が両方あるの？」\n\nさっき知り合ったばかりらしい同級生と、寮の条件について楽しそうに話している人もいた。その声には、大学生活への好奇心と期待がいっぱいに詰まっていた。\n\n僕はドアに近い席に座り、片手でスーツケースのハンドルを押さえ、もう片方の手でスマホのナビを確認していた。画面上の青いルートは雲夢南駅から雲夢師範大学までうねうねと伸びていて、まるであまりにも明確すぎる運命の案内表示みたいだった。\n\n僕は、こういう明確さが好きではない。\n\n両親が整えてくれた書類。スマホに保存されたキャンパスマップ。微信でピン留めされた新入生グループ。スーツケースの側面ポケットに母が入れてくれた常備薬の袋。どれも、この道をあまりにも順調なものに見せていた。\n\n順調すぎて、逆に自分をどこに置けばいいのかわからなくなる。\n\nただ、もしその順調な道が自分で敷いたものではないのなら、それは簡単にベルトコンベアに変わる。そこに立った瞬間、次には「ここで優秀な大学生になってください」と書かれた窓口まで運ばれてしまう。\n\nこの世界の姜嵐は、手ぶらで雲夢に来たわけではなかった。\n\nその人は、ここに来る準備をしていた。\n\nここに来ることを、きっと期待していた。\n\nいや、期待どころではない。何を冗談みたいなことを。志望校を書く時、ほとんど意地になるほど「ここでなければ駄目だ」と決めていた彼は、きっと数え切れない夜の中で、雲夢に到着するこの一日を、心の中で何百回、何千回も繰り返していたのだろう。\n\n校門、寮、受付。いや、晴れでも雨でも、この日の天気さえ、彼は想像したことがあったのかもしれない。\n\n地下鉄が「雲夢師大駅」に停まると、ドアが開いた瞬間、熱気が外で待ち構えていた生き物みたいに、待ちきれない様子で車内へ潜り込んできた。僕は人の流れについてエスカレーターを上がり、駅を出てすぐ、道路脇に「雲夢師範大学は新入生を歓迎します」と書かれたシャトルバスが何台か停まっているのを見つけた。\n\nボランティアたちは揃いの青いベストを着て、学院や書院の札を掲げていた。太陽の下で声を張りすぎたのか、その声は少し枯れている。\n\n「物電院、計信院はこちらです！」\n\n「立華書院の新入生は、まずこちらで登録してください！」\n\n「保護者の方も一緒に乗れます。荷物は後ろへお願いします！」\n\n僕は人混みの端に立ち、少し迷った。\n\n本当は自分で行くつもりだった。\n\nナビに従って学校まで歩き、木蘭広場を探し、列に並び、書類を提出し、キャンパスカードと寮の情報を受け取り、できるだけ早く人の多い場所から離れる。手順は普通であればあるほどよかった。誰にも覚えられないくらい普通に。一滴の水が、別の水面へ溶け込むように普通に。\n\nけれど、ボランティアはもう僕に気づいていた。\n\n「同学、立華書院ですか？」\n\n「自分で行くので大丈夫です」という理由を考え出す暇もなく、相手は慣れた手つきで僕のスーツケースを受け取り、シャトルバスの方を指した。\n\n「ちょうど最後の数席が空いてます。先に乗ってください。外、暑いですから」\n\nそうして僕は、そのまま車に乗せられた。\n\n独立した成人男性として「手助けを断る尊厳」を示す間すらなかった。\n\nシャトルバスは速くは走らず、雲麓南路をゆっくり進んだ。道はそれほど広くない。新入生送迎の車、タクシー、デリバリーの電動バイク、スーツケースを引く新入生が一緒に詰まり、道沿いの米粉店、果物屋、印刷店は、看板を木陰の下へ突き出していた。\n\nさらに遠くを見ると、雲麓山の輪郭が暑気に蒸されて青く滲み、街の背後に一面の静かな影のように横たわっていた。車内では、新入生グループを見ている人がいた。窓の外を通り過ぎる校門をスマホで撮っている人がいた。保護者が声を潜めて「着いたら無駄遣いしないでね」と子どもに言い聞かせていた。そして白いTシャツを着た男子が、乗ってから一度も口を止めず、すでに隣の三人と専攻、出身地、高考の点数を交換し終えていた。\n\n僕は視線を窓の外へ移した。\n\n雲夢師範大学の校門は、想像していたより大きかった。\n\n石造りの門柱が広い道路の両側に立ち、校名は陽射しを受けて光っている。入口には赤い新入生歓迎の横断幕が掛けられ、警備員、ボランティア、保護者、新入生、車が同じ熱気の中でゆっくり動いていた。遠くには湖が見え、湖面は風に細かくきらめいている。まるで誰かがガラスを砕き、水面に撒いたみたいだった。\n\nもしここが、もう一人の姜嵐がずっと待ち望んでいた場所なのだとしたら、彼の審美眼は悪くない。\n\nそんなことを心の中で思っているうちに、シャトルバスは校門をくぐった。\n\n木蘭広場はキャンパスの中軸線の近くにあった。広場の中央には、現時点では意味のわからない彫刻が立っている。周囲には日除けテントがびっしり並び、それぞれの前に学院、書院、サークル、グリーンチャンネル、戸籍移転、キャンパスカード手続きなど、さまざまな札が掛かっていた。放送は新入生登録の注意事項を繰り返し、ボランティアは人混みの中を行き交い、スーツケースの車輪の音は疲れを知らないBGMみたいに響いていた。\n\n僕はスーツケースを引いて広場の端に立ち、妙な感覚に襲われた。\n\nここにいる全員が、自分のやるべきことを知っているみたいだった。\n\n保護者はどの窓口を探すべきかを知っている。ボランティアは新入生をどこへ連れて行くべきかを知っている。新入生はどの手続きをすべきかを知っている。広場を飛び交うチラシでさえ、自分が誰の手に押し込まれるべきかを知っているように見えた。\n\n僕だけが、精密機械の中に紛れ込んだネジみたいに、まだ自分がどこへ締め込まれるべきなのかわからずにいた。\n\n「立華書院の物理班は、あちらです」\n\nシャトルバスのボランティアはスーツケースを返しながら、広場の西側に並んだテントを指差した。\n\n僕は礼を言い、相手が示した方向へ歩いた。\n\n立華書院の受付は、周囲のいくつかの学院より少し静かだった。人が少ないわけではない。列の並び方がより整っていて、机の上の資料もよりきちんと置かれているのだ。日除けテントの下には高学年のボランティアが数人座り、胸にはスタッフ証を掛けている。目の前にはパソコン、QRコードリーダー、キャンパスカード、寮の鍵、分厚い書類の束が並んでいた。\n\n僕は列の最後尾に並んだ。\n\n並んでいる人数は多くない。けれど一人ひとりが、いかにも列に並ぶのが上手そうだった。静かに書類をめくり、保護者と低い声で話し、自分の番になると素早く前へ出る。コードを読み取り、本人確認をし、署名をし、カードを受け取り、スーツケースを引いて去っていく。\n\nその効率のよさに、僕は少し安心した。\n\n見よう見まねでやればいい。\n\n僕がいちばん得意なこと、少なくとも今いちばん得意でいたいことは、たぶんそれだった。\n\n十分後、僕の番になった。\n\n「身分証、新入生コード、それから合格通知書をお願いします」\n\n登録を担当している女子学生は顔を上げて微笑んだ。あまりにも何度も同じ言葉を繰り返したせいで、その声は少し機械的だったが、それでも新入生歓迎のボランティアらしい親切さは保っていた。\n\n僕はファイルケースを開いた。\n\n身分証。\n\n新入生コード。\n\n合格通知書。\n\n彼女は書類を受け取り、まず身分証を確認し、次に新入生コードを読み取った。\n\nパソコンの画面が二回切り替わった。\n\nそして止まった。\n\n女子学生の笑みが、ほんのわずかに止まった。\n\n彼女は身分証をもう一度見て、画面を見直した。自分が読み間違えたのではないか確認しているようだった。\n\n「姜嵐同学、少々お待ちください」\n\n彼女は明らかな異常を顔には出さず、ただ後ろを振り返って声をかけた。\n\n「物理班の班導、いますか？　こちら、確認が必要な方です」\n\n確認が必要。\n\nその四文字は、頭上の太陽よりも眩しく耳に刺さった。\n\n僕が最初に思い浮かべたのは病歴だった。\n\n次に事故。\n\n三番目の反応は、さらに馬鹿げていた。まさかこの世界の大学登録システムは、魂の交換異常まで識別できるほど進んでいるのか？\n\nもちろん、理性は「ありえない」と言っている。\n\nただ、この一ヶ月あまりで理性というものは、現実を説明する能力において必ずしもライトノベル設定より優秀ではないと、何度も証明してしまっていた。\n\n僕の指先はファイルケースの縁を軽く押さえ、プラスチックの表面に細かな皺を作った。\n\n「どなた？」\n\n横から男子学生の声がした。\n\n僕は顔を上げた。\n\nやって来たのは背の高い男子だった。清潔な黒いTシャツを着て、首には立華書院の班導証を掛けている。髪はきちんと整えられ、眼鏡の奥の目は明るい。彼は近づいてくるなり、ボランティアに何があったのか急いで訊くのではなく、まずパソコンの画面に目を落とし、それから僕の顔へ視線を移した。\n\nその目はとても穏やかだった。\n\n穏やかすぎて、登録に来たばかりの新入生を見ているというより、前から読んでいた資料がようやく目の前に置かれたのを確認しているみたいだった。\n\n「姜嵐、だよね？」\n\n彼はボランティアから受け取った登録表を手にし、指先で紙面を軽く叩いた。それから確認するように、あるいは周囲に注意を促すように、声をさっきより少しだけ大きくした。\n\n「徽州一中。物理競賽省二等賞。理科総合二百八十点台」\n\n周囲の音が、一瞬だけ途切れた。\n\n全員がこちらを見たわけではない。新入生歓迎の会場は騒がしく、太陽は暑すぎて、多くの人は自分の書類と荷物に気を取られていた。けれど僕の後ろに並んでいた数人の新入生は明らかに顔を上げた。隣の列でも、保護者が「理科総合、いくらですって？」と小声で訊いた。少し離れた別の窓口では、署名していた何人かもその言葉に目を逸らした。高いポニーテールの女子、楽器ケースを背負った男子、付き添いの保護者。ただ彼らは、すぐにボランティアの一言でそれぞれの書類へ引き戻された。\n\nその瞬間、僕は自分が列からつまみ上げられ、広場の真ん中に置かれて日干しにされているような気がした。\n\n相手が僕に恥をかかせようとしているとは、必ずしも思わなかった。\n\nむしろ、彼がそれを問題だと思っていないことの方が、かえって居心地悪かった。\n\n彼の声には悪意がなかった。むしろ、当然のような賞賛が混じっていた。けれどその賞賛自体が一本
