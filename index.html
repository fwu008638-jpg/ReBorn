割引プランみたいに安い。\n\nだがそう思った瞬間、頭の中で古いプリンターの音がもう一度カタカタと鳴った。\n\n紙が吐き出される。\n\n温かく、ざらついて、トナーの匂いがする紙。\n\n喉が動いた。\n\n「これが自願なら、办理しない人がいることも認められるべきです」\n\n自分がそう言うのが聞こえた。\n\n声は大きくなかった。\n\nでも周囲には届いた。\n\n尹淵は僕を見た。\n\n「もちろん認められるよ」\n\n「でも办理しないと、あなたたちがやりにくくなる。クラスの統計が面倒になる。後の管理が不便になる。そういうことなら、それは単純な自願ではありません」\n\n僕は一度止まった。話す速度が自分でも抑えられないくらい速くなり始めた。\n\n「もしこれが学校や書院の正式な要求なら、正式な通知があるべきです。必ず办理しなければならないこと、費用がいくらなのか、用途は何なのかを明確に書くべきです。正式な要求ではないなら、『統一安排』や『みんなが協力している』という言い方で、全員に办理を求めるべきではありません」\n\nそこまで言ったところで、自分が少し速く言いすぎていることに気づいた。\n\n速すぎて、まだ完全に覚えていない台詞を、急いで最後まで読み上げようとしているみたいだった。\n\nそれでも、止まれなかった。\n\n「僕はプランに必ず問題があると言っているわけではありません。他の人が办理するなと言っているわけでもありません。办理したい人は办理すればいい。でも僕は办理したくない。だから办理しません」\n\n教室は完全に静かになった。\n\n静かすぎて、隣の117教室から聞こえる話し声まで耳に入った。\n\nあちらでも誰かが先輩と言い争っているのかもしれない。\n\nそれとも、僕の錯覚かもしれない。\n\n尹淵は僕を見ていた。\n\n彼の顔には、ほとんど表情の変化が見えなかった。\n\nどうしても言うなら、むしろその笑みがさっきより少しはっきりしているようにさえ見えた。\n\n僕には理解できなかった。\n\n直接冷たい顔をされるより、そちらの方がずっと居心地悪かった。\n\n「君の言いたいことはわかった」\n\n彼は言った。\n\n「君がそこまで言うなら、もちろん办理しなくていい」\n\nその言葉は譲歩のように聞こえた。\n\nけれど僕は、それで安心できなかった。\n\n尹淵はすぐに続けたからだ。\n\n「ただ、大学は高校とは違う。多くの場合、何がやる価値のあることか、何がやる価値のないことか、自分で判断できるようにならないといけない」\n\n僕は答えなかった。\n\nこのまま言い続ければ、さっきようやく積み上げた少しの勢いを、全部漏らしてしまいそうだったからだ。\n\nだから僕は教室の外へ向かった。\n\n本来なら、とても尊厳のある行動だったはずだ。\n\nもしこれが熱血漫画なら、ここでBGMが流れ、カメラは少し寂しげな主人公の背中をゆっくり引きながら、全員が沈黙の中で彼の颯爽とした退場を見送るのかもしれない。\n\nだが次の瞬間、現実では、僕は急ぎすぎ、緊張しすぎたせいで、入口の少し盛り上がったタイルにつまずいた。\n\nかなりはっきりと半歩よろけ、あと少しで地面と親密な接触を交わすところだった。\n\n背後から小さなどよめきが聞こえた気がした。少なくとも、僕のBGMではなかった。\n\n振り返るな。絶対に振り返るな。\n\n「真の男は爆発を振り返らない」\n\n僕はこの極限まで気まずい「気まずさ」を必死に無視し、何事もなかったふりをした。\n\nようやく、この一幕はカットされた。\n\n廊下の空気は、教室の中より少し涼しいように感じた。\n\nその瞬間、僕は自分の手がまだ震えていることに気づいた。\n\n目立つほどではない。\n\nけれど確かに震えていた。\n\n朱銘は少し離れた壁にもたれていた。僕が出てくると、身体を起こした。\n\n办理したのかとは訊かなかった。\n\nただ、さっき僕がつまずきかけた場所を見た。\n\n「前半はかなりかっこよかった」\n\n僕は少し沈黙した。\n\n「後半は？」\n\n「後半は物理法則が君に勝ちかけた」\n\n急に少し笑いたくなった。\n\nけれど、息を吐いただけだった。\n\n「笑うなよ」僕は言った。「まだ脚が少し震えてる」\n\n「わかる」朱銘は言った。「今の表情、かなりいい」\n\nその時ようやく、教室を出た瞬間に自分の表情管理が完全に崩壊していたことに気づいた。\n\n「それでもかっこいいって言ったのか？」\n\n「人生には、いくつかハイライトがあるものだ」\n\n僕たちがそう話していると、隣の117教室の入口からふいに騒ぎが聞こえた。\n\n振り向く。\n\n谷懿が中から出てきた。\n\n手には空白の登録表を持っている。どこかの戦場から鹵獲した敵軍文書みたいだった。\n\n僕を見ると、彼の目が光った。\n\n「よう」\n\n「君も办理しないの？」\n\n「僕は本当は、彼らが『自願』という言葉をどれだけ変化させられるのか見てみたかったんだ」谷懿は言った。「結果、この技術は専攻を問わず、かなり均衡に発展していることがわかった」\n\n朱銘が訊いた。\n\n「そっちはどうだった？」\n\n「だいたい同じ」谷懿は表を折った。「書院全体で進めている、不办理だと後の管理に影響する、と言っていた。だから僕は訊いた。通信サービスなら、まず僕の通信の自由にサービスしてくれないのか、と」\n\n「通信の自由？」\n\n「たとえばね、入学前から僕は大四の蔡学姐や大二の王学姐と友好的な個人関係を築きたかったんだが、残念ながら連絡先を得る機会に恵まれなくて……」\n\n「はいはい、脱線するな。それで？」\n\n「それで出てきた」谷懿は言った。「あのまま続けたら、うちの班導が人生の意義に疑問を抱き始めるところだった」\n\n彼は軽く言った。\n\n今夜の件は、確かに尹淵一人の考えではない。\n\nそれは書院の通知から来ていた。管理層の黙認から来ていた。班導の実行から来ていた。通信会社の机から来ていた。「みんな办理している」という人群から来ていた。そして、それぞれが「まあいいか」と思う瞬間からも来ていた。\n\nだからこそ、より面倒だった。\n\n谷懿は僕の横へ来ると、急に真面目な顔になり、重々しく僕の肩を叩いた。\n\n「小嵐の慷慨激昂な演説を聞き逃したのは、まことに遺憾だ」\n\n僕は固まった。\n\n「聞こえてたの？」\n\n「ドアがちゃんと閉まってなかった」彼は言った。「それに後半、君は音量も上がっていたし、話す速度も速かった。知らない人が聞いたら戦前動員かと思う」\n\n「……あの時、めちゃくちゃ緊張してたんだけど。相手は二対一の車輪戦だったし」\n\n「はいはい、二言褒めたらすぐ調子に乗る」\n\n谷懿は心から笑った。\n\n「得意になるなよ。次は僕が本物の演説を見せてやる。その時はよく見て、よく学ぶこと。あ、できればカメラを携帯しておけ。僕の英姿を記録して、後世の人々が繰り返し観摩学習できるように……」\n\n谷懿はまた、責任感ゼロの大言壮語を始めた。\n\n当時の僕は当然、その言葉を本気にしなかった。\n\nあとで思い返すと、あの日カメラを携帯していなかったことは、少しだけ後悔することになる。\n\n僕は隣で、ひたすら終わりのない気まずさに沈んでいた。\n\n本物の黒歴史は、教室を出たからといって終わるわけではない。隣の専攻によって、学際的に聴講されるだけなのだ。\n\n谷懿は僕を見て、少し笑みを薄めた。\n\n「でも本当に、さっき一番面白かったのは、君が拒否したことじゃない」\n\n「じゃあ何？」\n\n「死ぬほど怖がっていたのに、論理が崩れなかったこと」\n\n彼はごく普通に言った。\n\nそのせいで、僕は一瞬返す言葉を失った。\n\n僕はもちろん怖かった。\n\n自分がさっき何か間違ったことを言ったのではないか。\n\n尹淵にこれから目をつけられるのではないか。\n\n教室の人に面倒くさいやつだと思われたのではないか。\n\n……。\n\nそして、僕のものではないはずの姜嵐が本当にここに立っていたなら、もっと綺麗にやれたのではないか。\n\n「行こう」\n\n朱銘が僕の肩を叩いた。\n\n「ここにこれ以上いたら、奴らがその場で打法をアップデートし、粒度を揃えて、第二段階プランを出してくるかもしれない。不办理者には統一で思想教育ギフトパックをプレゼント、みたいな」\n\n谷懿は真剣に考えるふりをした。\n\n「そのプランに夜間データ容量があるなら、僕は検討するかもしれない」\n\n「検討すんな」\n\n僕たち三人は階段を下りていった。\n\n至善楼の外には、もう夜が降りていた。\n\n昼間ずっと焼かれていた地面には、まだ熱が残っている。建物を出ると、そのむっとする熱がまた顔に押し寄せた。遠くの運動場の方からは、どこかの学院の軍陣がまだ訓練を終えていないのか、かすかに掛け声が聞こえてきた。\n\n僕は振り返った。\n\n115教室の灯りはまだついていた。\n\n窓越しに、尹淵が長髪の先輩と何か話しているのだろうか。教室に残った他の同学は、僕という「刺頭」についてひそひそ話しているのだろうか。\n\n僕にはわからなかった。\n\nそしてこの瞬間は、そこまで知りたいとも思わなかった。\n\n朱銘が隣を歩きながら、ふいに訊いた。\n\n「で、本当に办理しないの？」\n\n「しない」\n\n「よし」彼は言った。「じゃあ俺も三枚目は办理しない」\n\n僕は彼を見た。\n\n「そもそも三枚目を办理するべきじゃないだろ」\n\n「そうとも限らない」朱銘は真顔で言った。「人類文明の偉大な進歩の多くは、やるべきではないことから始まった」\n\n谷懿が横で頷いた。\n\n「たとえば資本主義」\n\n「たとえば君の二周省略」と僕は言った。\n\n谷懿は自然な動作で、手の空白登録表をポケットへ入れた。\n\n「あれは省略ではない」\n\n「じゃあ何？」\n\n「価値を生産しない無意味な反復的機械労働に対する理性的拒否だ」\n\n朱銘は二秒沈黙した。\n\n「長すぎて覚えられなかった。もう一回言ってくれ。次に休みを申請する時使いたい」\n\n夜風が教学楼のあいだを抜けてきた。まだ残っている熱を少しだけ運んでいる。\n\n僕は二人のあいだを歩きながら、手のひらの汗がようやく少しずつ乾いていくのを感じた。\n\n実のところ、さっきの反抗が美しいものではなかったことはわかっている。\n\n僕は早口だった。\n\n危うく転びかけた。\n\n教室を出たあとも脚が震えていた。\n\nもしこれを何かの俺TUEEE系爽文に書き込んだら、編集者に「主人公のオーラが足りないので書き直しましょう」とやんわり言われるかもしれない。\n\nけれど、僕に書き直しの機会はない。\n\n現実の言葉は、一度しか言えない。\n\n言ってしまえば、それが綺麗でも狼狽えていても、そこに残る。\n\n僕が記入しなかったあの表のように。\n\n机の上に戻したあのペンのように。\n\nそして、遠い遠いどこかで、まだカタカタと鳴っている古いプリンターのように。\n\n僕が「原主」と呼んでいる姜嵐が、今どこにいるのかはわからない。\n\n今夜のあと、尹淵が騒がしかった僕をどこかのリストに入れるのかどうかもわからない。\n\nそれでも少なくとも今、至善楼の外の蒸し暑い夜風の中を歩きながら、僕は少しだけ思った。\n\n複写機のそばで話していた彼を、完全には裏切らなかったのかもしれない。\n\nたとえそれが、ごく小さく、ひどく不器用な一歩にすぎないとしても。\n\nスマホがまた震えた。\n\n今度は朱銘がA109の小グループに送ったメッセージだった。\n\n【朱銘：今夜、あるプレイヤーが新実績を解除しました：キャンパス通信サービス拒否。】\n\n続けて、もう一通。\n\n【朱銘：追加実績：危うくタイルに単独キルされる。】\n\n僕は無表情でスマホをロックした。\n\n大学生活は実に豊かだ。\n\n一回電話カードを办理しないだけの小事件が、ほとんど僕の人生最終章になりかけるくらいには。\n\n大学城の街区はすでに夜に沈んでいた。周囲は静かで、遠くから時折車のクラクションが聞こえるだけだった。道の両側の木々は微風にさらさらと鳴り、たまに数枚の葉が吹き落とされる。それはまるで、秋が頑固に、自分はもう来ているのだと証明しようとしているようだった。"},{"title":"第七章：招かれざる客","file":"7、第七章.md","volumeTitle":"第一巻：物語の始まりは平凡すぎるくらいでいい","text":"尹淵に言い返したあの夜、僕は一時、自分の大学生活がこれでまったく新しいルートへ入ったのではないかと思った。\n\nよくある爽文の展開に従うなら、僕はここから主人公の魂に目覚め、立華書院のさまざまな不公正の前で一路高歌猛進し、尹淵を拳で打ち、張迪を足で蹴り、最後には夕陽の下でカメラに向かって、ショート動画のサムネイルにできるような決め台詞を言うべきだった。\n\nけれど翌朝、アラームが鳴った時、僕が最初に直面したのは運命でも理想でもなく、軍訓服だった。\n\nしかも、選択の余地など一切ない軍訓服である。\n\n現実とはそういうものだ。\n\n前日の夜に、人格上の小さなアップグレードを完了したかどうかなど気にしない。キャンパス通信カードを一枚拒否したばかりかどうかも気にしない。朝六時二十分が来れば、ベッドから這い出し、あの蒸れて、硬くて、洗っても落ち切らない汗の匂いを少し帯びた迷彩服を、もう一度身体に着なければならない。\n\nそうして、少しだけ芽生えた英雄感は、僕がベルトの金具と十秒ほど格闘したあと、あっさり夭折した。\n\nその後の数日も、だいたいそんなものだった。\n\n昼間は軍姿、正歩、跑歩、掛け声。\n\n夜は寮に戻ってシャワーを浴び、服を洗い、髪を乾かし、身体がまだ完全には自分に戻らないうちに眠る。\n\n三日目から、軍訓服の匂いは説明しがたいものになった。\n\n朱銘の評価はこうだった。\n\n「この服、もう霊性を持ち始めてる」\n\n「どんな霊性？」と僕は訊いた。\n\n「自発的に洗浄を拒否し始めた」\n\nその時、僕は反論したかった。\n\nだが袖口を低頭して嗅いだあと、事実を尊重することにした。\n\nもちろん洗ってはいる。\n\nしかも毎日、違うブランド、違う香り、違う価格帯の洗剤で真面目に洗っている。\n\nけれど汗、埃、日に干された布、プラスチックの靴底、安っぽい迷彩布が混ざったその匂いは、もはや一つの匂いではなかった。軍訓という出来事そのものが、物理的な形で服に根を下ろしたようだった。\n\n「自由」や「自我」などという言葉は、この数日間どこにも見つからなかった。訓練後に軍帽の下から髪を救い出す自由でさえ、毛教官に奪われた。\n\nある朝の集合時、毛教官は突然すべての軍陣の前へ大股で歩き出て、僕たちにこの軍装が何を意味するのか本当にわかっているのかと訊いた。\n\n当然、僕たちは答えられなかった。すると彼は、「一部の同学」が訓練後すぐ軍帽を脱ぎ、さらには手に持って弄ぶという大逆不道の行為を痛烈に叱責し始めた。それは身にまとう軍服への深刻な侮辱であり冒瀆であり、軍人は軍人らしくあるべきだ、というわけだ。\n\nそして最後に、結論のような命令を下した。軍装は必ず身につけ、軍帽は必ず頭にかぶること。\n\nそんな日々の中で、僕は谷懿の言葉のいくつかを、だんだん理解できるようになっていった。\n\n彼は、軍訓は服従性テストだと言った。\n\n最初、僕はその言葉も、彼のほかの危険発言と一緒に「谷懿の大風呂敷フォルダ」へ入れていた。なにしろそのフォルダは容量が大きい。資本主義から跑歩二周省略、哲学系の尊厳から彼が将来世界を変えるかもしれない話まで、何でも入る。\n\nだが、人が何日も続けて太陽の下に立たされ、他人の号令に合わせて足を上げ、下ろし、向きを変え、立正し、稍息し、少しずつその生活に慣れていく時、自分に対して何の疑いも持たないのは難しい。\n\n特に、僕がほかの人より苦しんでいるわけでも、ほかの人より清醒であるわけでもないと気づいた時には。\n\n僕はただみんなと同じように、笛が鳴れば動き、口令が落ちれば止まった。\n\nそれは大げさに書き立てるほどの堕落ではない。\n\nもっと悪いことに、それはあまりにも普通だった。\n\n九月二十一日、中秋。\n\n本来なら、その言葉は月餅、夕飯、家族のグループチャット、そして居間のテレビから何度目かわからないほど流れてくる祝賀番組のオープニングを思い出させるはずだった。\n\nけれど雲夢師大では、それはまず、いつも通りの笛、集合、運動場を意味していた。\n\n集合前、母から微信が届いた。\n\n【母：中秋快乐。今日も軍訓？　暑いから日焼けに気をつけてね。】\n\n僕はそのメッセージを見つめ、指を画面の上で少し止めた。\n\n普通のメッセージだった。\n\nけれど、僕はその普通さの前で数秒ためらってしまった。\n\nそれはこの身体の母親から届いたものだった。\n\nそして僕が今、一生懸命演じようとしている身分の母親から届いたものでもあった。\n\n最後に、僕は四文字だけ返した。\n\n【僕：中秋快乐。】\n\n少し考えて、もう一文足した。\n\n【僕：心配しないで。】\n\n送信してから、スマホをポケットに入れた。\n\nその日の午前の訓練内容にも、相変わらず新鮮味はなかった。\n\n張迪は僕たちに高抬腿を練習させた。\n\n高抬腿という名前だけ聞けば、簡単な動作のように思える。\n\nだがそれが九月の太陽の下に置かれ、すでに長時間軍姿を立った脚に課され、そしていつでも「もっと高く」と叫ぶ教官の前で行われると、人類が長時間維持するのにあまり向いていない姿勢へ変わる。\n\n「脚を上げろ！」\n\n張迪は隊列の前に立ち、硬く明るい声で叫んだ。\n\n「これは高抬腿か、それとも散歩か？　第四列、やり直し！」\n\n隊列の中に、抑えた息を吸う音が広がった。\n\n誰も文句を言わなかった。\n\nいや、文句という行為は、すでにみんなの顔に浮かぶ細かな表情へ自動圧縮されていた。\n\n僕の右側に立っていた女子の名前を知ったのは、その後のことだ。\n\n数日前から、僕は彼女に気づいていた。\n\n何か特別な出来事があったからではない。\n\n彼女は背が高くなく、軍帽をかぶると顔がさらに小さく見えた。\n\n張迪が「つま先を伸ばせ」と叫ぶと、本当に低頭して自分のつま先を確認する人だった。休憩中、ほかの人が小声で不満を言っている時も、彼女はまず最後まで聞き、それから何かを真面目に考えているような表情を少し見せた。\n\nその真面目さは、少し不器用で、少し頑固だった。\n\nその日の午前、僕が本当に彼女に注意を向けたのは、彼女の水筒だった。\n\n前の休憩の時点で、彼女の水筒はもう空だった。透明なボトルの中には、太陽に晒されてできた水気が少し残っているだけだった。\n\n訓練の合間は短い。しかも張迪は早いうちから、誰も軍訓場を離れて水を買いに行ってはならないと言っていた。\n\n「休憩は状態を整えるためのものだ。お前たちがコンビニをぶらつくためのものじゃない！」\n\n彼がそう言う時の口調は、軍訓場の端にある自動販売機が何かの敵対勢力であるかのように理直気壮だった。\n\n僕の水はまだ小半分残っていた。\n\n正直、その水は僕にとってもかなり重要だった。\n\n太陽の下に長く立った人間は、一口の水にほとんど宗教的な敬意を抱くようになる。普段なら二元のミネラルウォーターも、その瞬間には神棚に祀られる資格を得る。\n\n休憩の笛が鳴ると、みんなほとんど同時にしゃがみ、座り、帽子を脱ぎ、水を飲んだ。\n\n僕はボトルの蓋を開け、一口飲んだ。\n\n水はすでに少し温かくなっていた。\n\nおいしいとは言えない。\n\nでも、水だった。\n\n陳小雲が自分の空のボトルを持ち上げ、一度止まり、また隅へ置くのが見えた。彼女は手の甲で額の汗を拭った。\n\n僕はもう一度蓋を閉めた。\n\n「よければ、僕のを飲む？」\n\n陳小雲は横を向いて僕を見た。\n\n明らかに少し驚いていた。\n\n「大丈夫です」\n\n声は軽かった。\n\n「あとでまた訓練だし」僕は付け足した。「教官も外へ買いに行かせてくれないし」\n\n彼女は自分のボトルを低頭して見た。\n\nそれから、僕の手の中の水筒を見た。少しためらった。\n\n同じボトルから水を飲むという行為は、青春キャンパス作品ならどこにでも、作者が不必要な曖昧さを盛り込む材料として使いがちだ。\n\nそして今の僕たちの関係は、ほとんど陌生人に近い。そんな展開を支えられるほど親しくはない。\n\n僕は慌てて付け足した。\n\n「君のボトルを出してくれたら、少し移すよ」\n\n彼女はようやく同意するように頷き、自分の空ボトルを差し出した。\n\n僕はゆっくり動いた。できるだけボトルの口同士が触れないようにした。\n\n水が空のボトルへ落ち、澄んだ音を立てた。透明な水の線が落ちていき、すぐにボトル中央のラベルの縁を越えた。\n\n彼女は指先でボトルに軽く触れた。\n\n「あなたも残して」\n\n僕はその言葉に少し固まり、手の動きも止まった。\n\n「大丈夫」\n\n「ありがとう。でももう十分です」\n\n彼女はほんの一口だけ飲み、すぐに蓋を閉めた。\n\n「陳小雲です」\n\n突然自己紹介されると思っていなかったので、僕は反応が半拍遅れた。\n\n「姜嵐。物理系」\n\n「うん。哲学系」\n\nすぐに笛が鳴った。\n\n休憩終了。\n\n全員がもう一度立ち上がる。\n\nけれど僕が隊列に戻った時、右側のあの少し頑固な女子は、もうただの「右側の女子」ではなくなっていた。\n\n彼女には名前があった。\n\n何かが、その半分の水のせいで少し変わったような気がした。\n\n午後三時過ぎ、主席台の方から突然笛が鳴った。\n\nこれは珍しいことではない。\n\n軍訓期間中、笛の音は人類の言語より上位の存在である。説明はしない。ただ全員に即座に今の動作を止めさせ、次に何が起こるのかを各自推測させる。\n\n張迪は笛を聞くと、主席台の近くまで小走りし、ほかの教官数人と一緒に一列に並んだ。\n\nさらに数分後、張迪はようやく戻ってきた。もちろん、僕たちは彼の帰還を期待していたわけではない。むしろ、できればもう少し遅く戻ってきて、毛教官に主席台の方で捕まっていてほしかった。\n\n「全体！　立正！」\n\n「稍息！」\n\n「これから重要なことを通知する！」\n\n「今日は中秋節だ。しばらくしたら、譚校長がみなさんを慰問に来られる」\n\n「これは我々の訓練成果を示す貴重な機会だ！　今から全員、十二分に気を引き締めろ！　最高の状態を見せろ！　いつでも譚校長を迎えられるよう準備しろ！」\n\n「全体！　訓練続行！」\n\n言い終わると、隊列の中で低くざわめきが起きた。\n\n「何？　偉い人が来るの？」\n\n「今、名前聞こえた？」\n\n「いやお前、譚院士も知らないの？」\n\n「え……」\n\n「静かに！」\n\n張迪は僕たちを見渡した。\n\n「訓練続行！　気を引き締めろ。もし誰かがその時に足を引っ張ったら、容赦しない」\n\n譚校長。\n\nその名前は、僕にとって陌生ではなかった。\n\n正確に言えば、雲夢師大に入ってから、僕はすでにいろいろな場所で何度も聞いていた。\n\n開学式の資料に彼はいた。\n\n学校公式サイトのトップページにもいた。\n\nキャンパスの掲示板にもいた。\n\nそれどころか、今年の開学宣伝動画の主役も彼だった。『雲夢師範大学譚子厚院士、2021級新入生へ寄語』。\n\n動画のサムネイルの譚子厚は青白いチェックシャツを着て、髪は半分白く、表情は温和だった。副校長というより、ドキュメンタリーで海洋と生命の神秘をゆっくり語る年長者のように見えた。\n\nけれど新入生にとって、彼はもちろんただの「長者」ではない。\n\n「院士」という二文字だけで、すべてを説明するには十分だった。\n\n院士が慰問に来るという知らせは、瞬く間に田径場全体へ炸裂した。教官たちは秩序を維持しようとしていたが、学生たちの興奮は隠しきれなかった。\n\n特に少し離れた生科班の学生にとって、「譚子厚」という名前は間違いなくさらに馴染み深いものだった。中には彼を偶像のように見ている人もいるかもしれない。自分の憧れで、学術界の大物が直接慰問に来ると聞いて、軍訓の緊張や疲労は一瞬で吹き飛んだようだった。\n\n「本当に譚院士なの？」\n\n「当たり前だろ、雲夢師大で譚って名字の校長はあの人だけだろ」\n\n「工程院院士だぞ！」\n\n「父親も院士って聞いた」\n\n「一門双院士？」\n\n「そう。譚家は海洋生物研究の家系らしい。めちゃくちゃ強い」\n\n「うわ、何それ学閥じゃん」\n\n最後の一言は朱銘だった。\n\n言い終えたあと、李向陽に訂正された。\n\n「学術世家、書香門第だ。何が『学閥』だ。口は禍の元だぞ」\n\n朱銘は彼を見た。\n\n「李哥、君ほんとにユーモアないな」\n\n李向陽はそのツッコミを無視し、主席台の方向を見ていた。\n\n表情は普段より少し真剣だった。\n\n「譚校長は本科、修士、博士、おそらく全部国内で、その後海外で訪問学者をして、帰国後に国家級プロジェクトを取った。三十代で重点実験室の方向責任者になっている」\n\n「なんでそこまで知ってるんだ？」朱銘が訊いた。\n\n「学校公式サイトにある」\n\n「暇な時に学校公式サイト見るの？」\n\n李向陽は少し沈黙した。\n\n「学校資源を理解するためだ」\n\n朱銘はまた敬意の表情を浮かべた。\n\n「負けた。俺なんかまだ教務システムのパスワードも設定してない」\n\n周囲の人々の顔に浮かぶ興奮は本物だった。\n\nこの数日軍訓に苦しめられ、ほとんど表情を失っていた人でさえ、「院士」「譚校長」「慰問」という言葉を聞いたあと、少しだけ光を取り戻していた。\n\n僕も思わず主席台の方を見た。\n\nその時、僕はまだ譚校長本人を見ていない。ただ周囲の人が「院士」「国家級プロジェクト」「一門双院士」と何度も口にするのを聞いているだけで、胸の中には何とも言えない期待が少し浮かび始めていた。\n\nその期待は少し俗っぽい。\n\nだが運動場にいる人間で、完全に俗を免れている人など、たぶんほとんどいなかった。\n\nおよそ二十分後、主席台の近くに明らかに人が増えた。\n\n毛鋭が台の横に立っている。\n\n輔導員の彭悦もいた。\n\n白いシャツを着た教師が数人、教学楼の方から歩いてきた。その後ろにはカメラやビデオカメラを持つ人もいる。\n\n田径場全体の空気が、それに伴って変わった。\n\n教官たちは普段より厳粛になった。\n\n学生たちも無意識に背筋を伸ばし始めた。\n\nその変化はとても微妙だった。\n\n誰も正式に何かを発表したわけではない。けれど全員が、「見られる」瞬間が近づいていることを知っていた。\n\nまもなく、青白いチェックシャツの男が主席台へ上がった。\n\n彼は宣伝動画より少し痩せて見えた。髪は黒と白が半々で、袖口はそれほど高くまくっていない。歩く時も、わざと指導者らしさを出そうとはしていなかった。周りには教師や教官が数人ついていたが、彼だけ少し画風が違っていた。普通の老人のように見えた。\n\n田径場が一瞬静かになった。\n\n次に、拍手が起きた。\n\n最初は主席台の近くからだった。\n\nすぐに、拍手は中央から広がる水紋のように、一層ずつ各軍陣へ伝わっていった。\n\n僕もそれに合わせて拍手した。\n\n譚校長はマイクの前へ歩き、軽く身をかがめた。\n\n「同学のみなさん、こんにちは」\n\n彼の声は音響を通して流れ、想像よりずっと温和だった。\n\n張迪のようにわざと声を張り上げる命令感はなく、動員会の指導者挨拶によくある滑らかな腔調もなかった。\n\nただ、ゆっくりで、安定していた。\n\n「今日は中秋節です。中国の伝統文化において、とても大切な日です。私は学校を代表して、みなさんを見に来ました。そして、みなさんと一緒にこの祝日を過ごしたいと思います」\n\n拍手が再び起きた。\n\n今度はさらに熱かった。\n\n譚校長は続けた。\n\n「先ほど、場の外で少し見ていました。私たちの同学は、訓練にとても真面目に取り組んでいて、精神もあります」\n\n数人の教官が主席台の横に立ち、背筋をまっすぐ伸ばしていた。\n\n張迪も同じだった。\n\n少なくとも遠くから見れば、普段よりずっと合格した教官らしく見えた。\n\n譚校長は少し止まり、口調を緩めた。\n\n「この数日の軍訓、同学のみなさん、本当にお疲れさまでした」\n\nその言葉が落ちた瞬間、田径場にはごく短い静けさが生まれた。\n\n誰も聞いていない静けさではない。\n\nむしろ全員が聞いていたからこその静けさだった。\n\nお疲れさまでした。\n\nその言葉自体はとても普通だ。\n\n食堂のおばさんが持ち帰りの飯を渡す時にも言える。宅配員が荷物を寮の下まで運んできた時にも言える。\n\nけれど軍訓場では、それが突然重くなった。\n\nこの数日、教官は毎日僕たちに訊いていた。\n\n「疲れたか？」\n\nそして正しい答えは、いつも一つしかなかった。\n\n「疲れていません」\n\n汗が帽子のつばから滴っていても。\n\n足裏が擦れて痛んでいても。\n\n夜、寮へ戻る時、階段を上ることさえ嫌になっていても。\n\n僕たちは疲れていないと叫ぶしかなかった。\n\nだから「お疲れさまでした」という言葉が主席台から出た時、それは誰かがようやく、全員が知っているのにずっと口に出せなかった事実を認めてくれたようだった。\n\n次の瞬間、拍手が爆発した。\n\n本当に爆発した。\n\n拍手しながら叫ぶ人がいた。\n\n手を強く叩く人がいた。\n\n口笛を吹く人さえいて、すぐ隣の同学に肘で突かれていた。\n\n僕は隣の朱銘が低声で言うのを聞いた。\n\n「今ここに宣言します。譚校長は今日唯一、人間の言葉を話した人です」\n\n「言葉に注意しろ」と李向陽が言った。\n\n「じゃあ言い直す」朱銘はすぐ従った。「譚校長は今日唯一、人類が理解可能な言語を発した人です」\n\n李向陽は彼を白い目で見た。\n\n拍手は長く続いた。\n\n長すぎて、譚校長は手を上げて下へ押し、みんなに静まるよう示さなければならなかった。\n\n田径場がもう一度秩序を取り戻すと、彼は手を少し上げた。さっきの熱烈すぎる拍手を受け止めるような動作だった。\n\n「どうやら、みなさん本当に辛かったようですね」\n\n今度は台下から笑い声が起きた。\n\n大きくはない。\n\nけれど、とても本物だった。\n\nその瞬間、僕はなぜ多くの人がこういう人を崇拝するのか、少しわかった気がした。\n\n彼は大声を出す必要がない。\n\n叱責する必要もない。\n\n誰かに立正、稍息、五周走れと命じる必要もない。\n\n主席台に立ち、全員が聞きたい一言を言うだけで、田径場全体の空気が彼の方へ寄っていく。\n\nこれも一種の権力なのだろう。\n\nただ、それはより温和に見え、そして人を心から従わせやすい。\n\n譚校長はその後もいくつか話した。\n\n中秋について。\n\n青年について。\n\n雲夢師大がみなさんを歓迎していることについて。\n\nどれも新しい話ではなかった。\n\nだが彼が言うと、学生たちはやはり真面目に聞いた。\n\n同じ「努力して勉強しなさい」でも、担任が言えば逃げ出したくなるかもしれない。だが院士が言えば、突然、検証可能な重みのようなものが増す。\n\n僕にはそれが人類の奇妙さなのかどうか、わからなかった。\n\n「今日はみなさんと一緒に祝日を過ごすのですから、私だけがここで一方的に話すのもよくありません」\n\n譚校長は台下を見た。\n\n「この数日の軍訓について、感想を話してくれる同学はいませんか？」\n\n田径場はまず一瞬静かになった。\n\nそれから、多くの軍陣で細かなざわめきが起きた。\n\n明らかに心が動いた人がいた。\n\n何しろ、院士と同じ台で話す機会なのだ。\n\nたとえ「軍訓で成長を得ました」「教官は辛いです」「これからも努力します」といった標準回答を数句言うだけでも、あとで朋友圈に上げれば、高校の同級生から十分な数のいいねをもらえる。\n\nしかも、横にはカメラまである。\n\nカメラというものは危険だ。\n\nそれは突然、自分の人生が今、記録されるに値する瞬間へ入ろうとしているのではないかと、人に信じさせる。\n\n「緊張しなくていいですよ。気軽に話してくれれば」\n\n生科班の方で、最初に手を上げる人が出た。\n\n続いて、ほかの軍陣でも手が上がった。\n\n「私！」\n\n「譚校長、こっちです！」\n\n「選んでください！」\n\n場面は一瞬で、軍訓慰問から大型抽選会へ変わった。\n\nしかし、全員がまだ「手を上げて機会を争う」という通常の遊び方に留まっていた時、一つの声が背後から突然響いた。\n\n「譚校長！」\n\nその声は明るかった。\n\nそして、聞き覚えがあった。\n\n胸が跳ねた。\n\n振り返る前に、哲学班の隊列から一人が飛び出すのが見えた。\n\n谷懿。\n\n彼は手を上げなかった。\n\n誰かに指名されるのも待たなかった。\n\n彼は直接、軍陣から走り出した。\n\nその感じを説明するのは難しい。表計算シートの一つのセルが、突然動画を再生し始めたようだった。\n\n「譚校長！　僕を選んでください！」\n\n谷懿は走りながら叫んだ。\n\n「21級哲学班、谷懿！　発言を申請します！」\n\n台下は一瞬で爆発した。\n\n「うわ、そんなのあり？」\n\n「あいつ誰だ？」\n\n「哲学班の変人か。そりゃそうだ」\n\n「いや、哲学班でも主席台に突撃はしないだろ」\n\n張迪の顔色が変わった。\n\n「谷懿！　帰隊！」\n\n張迪は、目の前のこの場面が自分の隙から生まれたものだと理解していた。だが衆目の中で、谷懿を直接捕まえて引き戻すこともできなかった。\n\nそのためらいの一瞬で、谷懿はすでに飛ぶように主席台の前まで走っていた。\n\n主席台の横に立っていた総教官が、すぐに一歩前へ出た。谷懿を止めようとしたのだろう。\n\nけれど一路走ってきた男子を見て、譚校長は怒らなかった。それどころか、横の人たちにまだ動かないよう手で示した。\n\nこうして谷懿は、本当に一息に主席台へ駆け上がった。\n\nマイクを渡す役の司会者は、明らかにまだ驚きから戻っていなかった。手に持ったマイクは半空中で止まり、突然それを誰に渡すべきか忘れてしまったみたいだった。\n\n言うが早いか、谷懿は一歩踏み出し、ほとんど流れるような動作で、司会者の手からマイクを奪い取った。\n\n「譚校長、どうか僕に同学を代表して発言することをお許しください！」\n\nその口調は、さっきの全力疾走が無謀ではなく、必要な礼節だったかのように真剣だった。\n\n譚校長が次の瞬間に発した言葉も、同じく全員の顎を落とした。\n\n「いいでしょう。では、この同学に口火を切ってもらいましょう」\n\n譚校長は大きく手を振り、谷懿の無作法を許しただけでなく、周囲の人が羨んでやまない機会を彼に与えた。\n\nこれほど規則を破った谷懿を見て、田径場全体で張迪だけはおそらく胸を撫で下ろしていた。ほかの人々の顔には、悔しさ、残念さ……そして、軽蔑が浮かんでいた。\n\n「うわ、あいつズルじゃん！」\n\n「いや、そんな遊び方ありなのかよ？」\n\n台下には、驚き、羨望、悔しさ、不服が入り混じった声が一斉に広がった。\n\n「嘘だろ、本当に上がれたの？」\n\n「これもあり？」\n\n「早く知ってたら俺も突っ込んだのに」\n\n「突っ込んでみろよ。教官に地面へ押さえつけられるぞ」\n\n朱銘は僕の横に立ち、同じように呆然としていた。ただ、彼の注目点は少し妙だった。\n\n「こんなに体力あるのに、あの数周を少なく走ったのか……谷懿、お前というやつは！」\n\n僕は返事をしなかった。\n\n谷懿が主席台へ上がった瞬間、数日前、至善楼の外で彼が笑いながら僕に言った言葉を思い出したからだ。\n\n「次は僕が本物の演説を見せてやる。その時はよく見て、よく学ぶこと。できればカメラを携帯しておけ」\n\n谷懿はマイクを受け取った。\n\n主席台の上は風が強く、彼の額の前髪を軽く揺らした。\n\n彼はすぐには話さなかった。\n\nまず、台下を見た。\n\nその一瞥は、同じ迷彩服を着た無数の新入生を通り過ぎ、隊列の横に立つ教官たちを通り過ぎ、主席台側の毛鋭を通り過ぎ、どうやら一瞬、僕の視線とも交差したようだった。\n\nそして、彼の顔に明るい笑みが咲いた。\n\n僕はふと後悔した。\n\n本当にカメラを携帯していなかったことを。\n\n「みなさん、こんにちは」\n\n谷懿が口を開いた。\n\n音響は彼の声を田径場の隅々まで運んだ。\n\n「21級哲学班の谷懿です」\n\nとても普通の冒頭だった。\n\n普通すぎて、ここだけ聞けば、誰もが彼はこれから「軍訓を通じて規律意識と集団栄誉感を得ました」と言うのだろうと思ったはずだ。\n\nだが、僕はそうはならないと知っていた。\n\nなぜそう思ったのかは、うまく言えない。\n\nたぶん、僕が谷懿を知っていたからだ。\n\nあるいは、今主席台に立つ彼の姿が、標準答案を言う準備をしている人間にはまったく見えなかったからだ。\n\n田径場は静かになった。\n\n谷懿はマイクを握り、一秒止まった。\n\n「僕から見ると、軍訓の意義は」\n\n「意義がない、ということです」"},{"title":"第八章：夏夜のこだま","file":"8、第八章.md","volumeTitle":"第一巻：物語の始まりは平凡すぎるくらいでいい","text":"「僕から見ると、軍訓の意義は」\n\n「意義がない、ということです」\n\n谷懿の声が落ちたあと、田径場全体が誰かに突然ミュートボタンを押されたみたいになった。\n\nさっきまでひそひそ話し、不満を言い、悔しがり、羨ましがっていた人群が、ふいに全部止まった。言い終えられなかった言葉が喉に引っかかり、飛び立ったばかりで空中に凍りついた鳥の列みたいだった。\n\n僕には主席台の横で、旗のロープが風に揺れる音さえ聞こえた。\n\nぱん。\n\nぱん。\n\nとても小さい。\n\nけれどその瞬間だけは、信じられないほどはっきりしていた。\n\nたぶん、最後の幻想を抱いていたのは僕一人ではなかった。\n\nたとえば谷懿が次に、「軍訓の意義とは固定された意義がないことであり、汗と集団の中で自分だけの答えを見つける必要がある」と言うかもしれない。あるいは、「無意味であることこそ最大の意味であり、無意味の中に意味を創造することを僕たちに学ばせる」と言うかもしれない。\n\nそういう言葉は、どこかの作文コンクール一等賞みたいに聞こえる。\n\n空っぽだが、安全だ。\n\n誰かが好んで聞くとは限らないが、少なくとも自分を妙なリストへ送り込むことはない。\n\nけれど谷懿は明らかに、そんなことを言うために主席台へ駆け上がったのではなかった。\n\n彼はマイクを握り、夕方の風の中に立っていた。落日はすでに田径場西側の観客席へ傾き、光が彼の背後から差して、身体を少し薄く見せていた。その一方で、軍帽の下の目だけがひどく明るく見えた。\n\nその瞬間、彼は入学して七日目の新入生には見えなかった。\n\nむしろ、校领导の慰問現場に迷い込んだ舞台俳優みたいだった。\n\n問題は、この芝居に台本がないことだった。\n\nそして、彼が台詞をどこまで読み上げるつもりなのか、誰にもわからなかったことだった。\n\n「僕たちはこの数日、いったい何を訓練したんでしょうか」\n\n谷懿は誰の返答も待たなかった。\n\n「軍姿、正歩、齐步走、跑歩、掛け声。さらに軍姿、さらに正歩、さらに齐步走、さらに掛け声」\n\n彼の声は音響を通して広がり、塑胶跑道、芝生、観客席、教学楼の外壁へ幾層にもぶつかっていった。\n\n「もちろん、これらは隊列訓練であり、紀律訓練であり、軍訓に不可欠な構成部分だ、と言うことはできます」\n\n谷懿は笑った。\n\n「とても合理的に聞こえます。大学では、一つの物事に『必要な構成部分』という言葉をつけるだけで、それはただちに神聖不可侵になりますから。試験は学習の必要な構成部分、GPAは評価の必要な構成部分、総合評価は成長の必要な構成部分。そうして最後には、僕たち全員の人生が一枚一枚の表の中にある必要な構成部分へ分解されていく」\n\n台下のいくつかの場所から、低い笑い声が漏れた。\n\nだがその笑いはすぐに止まった。\n\n主席台の横に立っていた毛鋭が、一歩前へ出たからだ。\n\n彼の制服は、僕たちに配られた軍訓服とは明らかに違っていた。布はより張りがあり、色は深く、帽子のつばの線は押し下げられる影みたいに硬かった。夕方の光が肩章とベルトに落ち、冷たく明るい質感を返していた。\n\nその質感は、人を本能的に黙らせる。\n\nけれど谷懿は黙らなかった。\n\n「しかし問題は、軍訓は本当にこれだけなのか、ということです」\n\n彼は首を少し傾げた。主席台の下にいるすべての教官に訊いているようでもあり、台上の教師たちに訊いているようでもあった。\n\n「軍事技能、軍事理論、隊列動作、戦術動作、衛生と救護、国防教育。文書にははっきり書かれています」\n\n僕は少し驚いた。\n\n谷懿がいつそんなものを調べたのか知らなかった。\n\nたぶんどこかの下訓後の夜、僕たちが寮で洗っても落ちない軍訓服を前に人生を疑っている時、彼はもう103の机に座り、関連文書を一通りめくっていたのだろう。\n\nいかにも谷懿だった。\n\n彼はいつも口だけのように見えるのに、妙なところで準備が過剰に十分だったりする。\n\n「けれど僕たちが実際に受けているものは何ですか」\n\n「身体を口令の部品に分解することです」\n\n「手を貼りつけろ、脚を高く上げろ、目は前へ、口は閉じろ」\n\n「笛が鳴れば身体が動く。口令が落ちれば身体が止まる」\n\n「なぜ、と訊いてはいけない。ただまず、自分が服従したかどうかを確認すればいい」\n\n今度は誰も笑わなかった。\n\n僕は数日前、張迪が何度も僕たちの動作を直していた様子を思い出した。\n\nつま先がまっすぐではない。\n\n腕の振り角度が足りない。\n\n列の面が揃っていない。\n\n声が小さい。\n\nどんな細部も指摘され、調整され、再び置き直される。最後には人が人ではなく、永遠に調整完了しない装置みたいになる。\n\n「あなたたちは、軍訓は身体を鍛えるためだと言う」\n\n谷懿の声が少し高くなった。\n\n「では、なぜ水筒が空になった人が、隊列を離れて水を汲みに行くことさえできないのですか」\n\n僕は反射的に右側を見た。\n\n陳小雲がそこに立っていた。\n\n彼女は主席台を見上げず、前方を見ていた。軍帽のつばが低く、目は見えない。ただズボンの縫い目の横に置かれた手指が、かすかに強く握られるのだけが見えた。\n\n「あなたたちは、軍訓は意志を磨くためだと言う」\n\n谷懿は続けた。\n\n「では、なぜ全員が明らかに疲れていると知っているのに、『疲れたか』と訊かれた時だけは『疲れていません』と叫ばなければならないのですか」\n\n「なぜ痛みを口に出した瞬間、それは意志が弱いことになるのですか」\n\n「なぜ服従が紀律という外衣を着ると、まず自分の身体を否定することまで要求できるのですか」\n\n張迪は隊列の前で、顔色をひどく悪くしていた。\n\n顎が固く張り、今にも飛び出そうとする怒りを歯で噛み止めているみたいだった。\n\nだが彼は動かなかった。\n\n譚校長がまだ主席台にいたからだ。\n\nカメラがまだ回っていたからだ。\n\n無数の目に見られているこの瞬間、張迪でさえ、まず自分より一段高い紀律に服従しなければならなかった。\n\n僕はその光景を、少し荒唐だと思った。\n\n荒唐すぎて、どこか浪漫的でさえあった。\n\n普段は口令で僕たちを押さえつける人が、今は別の見えない口令によってその場に押さえつけられている。\n\n「あなたたちは、苦労は人を成長させると言う」\n\n谷懿は語速を落とした。\n\n「けれど、なぜいつも権力を持たない人が苦労するのですか」\n\nその言葉が落ちた時、風がちょうど主席台の後ろから吹いてきた。\n\n遠くの赤い旗が一斉に膨らみ、何か目を覚ました火のようだった。\n\n「なぜ木陰に立つ人が、太陽の下に立つ人へ、痛みは必要だと告げられるのですか」\n\n「なぜミネラルウォーターを手にした人が、唇の白い人へ、堅持を学べと教育できるのですか」\n\n「なぜ口令に身体を支配される必要のない人ほど、服従の意義を説明したがるのですか」\n\nその数句のあと、台下にはさっきより明らかなざわめきが起きた。\n\n拍手ではなかった。\n\n歓声でもなかった。\n\nもっと複雑な音だった。\n\n多くの人が同時に息を吸い込み、その息を本当に吐き出すことはできなかったような音。\n\nほかの人が何を思い出したのか、僕にはわからない。\n\n僕が思い出したのは、あの日、木陰でミルクティーを飲んでいた尹淵だった。\n\n彼はもちろん張迪ではない。\n\n厳密に言えば、彼は何かを間違えたわけでもない。\n\nけれどその画面は、谷懿の言葉と突然重なり合い、薄く鋭い紙になって僕の頭の中を切っていった。\n\n「痛みが成長と説明され、服従が紀律と包装され、沈黙が成熟と呼ばれる時」\n\n谷懿は一字一句、言った。\n\n「それはもはや教育ではありません」\n\n「規訓です」\n\n隣で誰かが小さく罵るのが聞こえた。\n\n「狂ってるだろ……」\n\nまた誰かが低く言った。\n\n「よく言えるな」\n\n朱銘は何も言わなかった。\n\n余光で見ると、彼はまっすぐ立っていた。両手はズボンの縫い目に貼りつき、肩がわずかに強張っている。\n\nそれは軍姿の標準ではなかった。\n\nむしろ、誰かがようやく火を見つけた時、本能的に少し前へ身を傾けるような姿だった。\n\n「あなたたちは、これは集団のためだと言うかもしれない」\n\n谷懿は台下を見た。\n\nその瞬間、彼の視線は無数の若い顔を通り過ぎた。顔たちは同じ軍帽、同じ迷彩服、同じ汗と埃に包まれ、刈り揃えられた草地のようだった。\n\n「けれど集団とは何ですか」\n\n「全員が自分の疲れを言えないことですか」\n\n「誰かが倒れた時、ほかの人はまず隊列の整齐を保たなければならないことですか」\n\n「検閱台の人を満足させるために、自分の身体と声を差し出し、最後にはこの過程が自分を成長させたと感謝しなければならないことですか」\n\n彼は少し止まった。\n\n「もし一つの集団が、一人一人の痛みを否認することによってしか整齐を保てないのなら」\n\n「それはいったい集団を訓練しているのでしょうか」\n\n「それとも、順従を訓練しているのでしょうか」\n\nその言葉が落ちたあと、田径場は巨大な湖みたいに静かになった。\n\n谷懿は湖心へ石を投げ込んだようだった。\n\n水紋がまだ広がりきらないうちに、岸辺の人々はそれが自分の足元へ届くことを恐れ始めていた。\n\n毛鋭はついに我慢できず、また一歩前へ出た。\n\n今度は、その場で止まらなかった。\n\nだが彼が手を伸ばす前に、譚校長が手をわずかに上げた。\n\n毛鋭の動きは止まった。\n\n譚校長は谷懿を見た。\n\n顔にはまだ少し温和な表情があった。ただその温和さは、さっき「お疲れさまでした」と言った時ほど人を安心させるものではなかった。\n\n柔らかな色をしたガラスのようだった。\n\n「この同学」\n\n譚校長が口を開いた。\n\n彼の声は別のマイクを通して流れ、谷懿がまだ言っていない次の言葉を押さえた。\n\n「名前は？」\n\n「谷懿です」谷懿は言った。「21級哲学班、谷懿」\n\n「谷懿同学」\n\n譚校長はうなずいた。\n\n「君が今言ったことは、君がよく考えており、表現したい欲求も強いことを示しています。大学は同学たちが問題を考えることを歓迎しますし、意見を表明することも歓迎します」\n\nこの言葉は綺麗だった。\n\nここだけ切り取れば、そのまま学校の公式アカウントに載せられる。\n\n写真は譚校長が主席台で新入生の発言を辛抱強く聞いているものを使い、タイトルは『雲夢師大：すべての青年の声を聞く』でいい。\n\n僕はほとんどその記事のレイアウトまで想像できた。\n\n残念ながら、現実の話はたいてい宣伝に最も適した場所では止まらない。\n\n「しかし」\n\n譚校長は言った。\n\n「思考は事実から離れてはいけません。表現にも場に対する配慮が必要です。君は入学したばかりで、学校に対しても、軍訓に対しても、社会に対しても理解がまだ未熟です。若者に情熱があるのは良いことです。しかし情熱だけで基本的な判断がなければ、容易に偏激へ向かいます」\n\n偏激。\n\nその言葉が出たあと、台下の多くの人は、ようやく緊張を一時的に下ろせる出口を見つけたようだった。\n\n偏激。\n\nそうか、これは偏激なのだ。\n\n一人の言葉をこの単語へ入れてしまえば、その中で人を不快にさせる部分には、ひとまず向き合わなくてもよくなる。\n\n「軍訓は国家が定めた大学生の必修科目であり、国防教育の重要な構成部分です。教官たちもこの数日、とても辛苦しています。学校と書院は同学たちの訓練と生活を保障するため、最大限努力しています」\n\n譚校長の語速は速くなかった。\n\n声は相変わらず温和だった。\n\n「訓練の過程で具体的な問題が本当に存在するなら、輔導員、班導、書院などの正规渠道を通じて反映できます。学校は必ず真摯に聞き取り、適切に処理します」\n\n正规渠道。\n\n真摯に聞き取り。\n\n適切に処理。\n\n僕はそれらの言葉自体が間違っていないことを知っていた。\n\nけれど、それらが一つずつ谷懿の言葉の後ろに置かれると、火の上へ湿った布を何枚も重ねるようだった。\n\n火はすぐには消えない。\n\nただ、息苦しい煙を上げ始める。\n\n「しかし今日のような場で、このように片面的で、激烈で、無責任な方式で、個人的な感情をほかの同学へ拡散することは、勇敢ではありません」\n\n譚校長は谷懿を見た。\n\n「それは集団秩序への不尊重です」\n\n谷懿は言葉を奪わなかった。\n\nただマイクを握り、静かにそこに立っていた。\n\nその瞬間、彼はむしろさっきよりも大一新生らしく見えた。\n\n痩せて、若く、汗で額の前髪がくっつき、一路走って壇上へ上がったせいで軍訓服の袖口が少し歪んでいた。\n\n彼は大きくなかった。\n\nむしろ譚校長、毛鋭、何人かの教師たちの間に立つと、少し孤零として見えた。\n\nけれどそういう一人が、さっき田径場の夕方を一筋引き裂いたのだ。\n\n「学校には君を導く責任があり、ほかの同学の正常な訓練秩序を守る責任もあります」\n\n譚校長は言った。\n\n「今日はここまでにしましょう。先に下りなさい。このあと輔導員と書院の先生が君と話します」\n\n言い終えると、彼はわずかに横を向き、毛鋭を見た。\n\n毛鋭はすぐ前に出た。\n\n谷懿はマイクを隣の司会者へ渡した。\n\n動作は自然だった。\n\n本当に普通の発言を終えたかのように自然だった。\n\n「結構です」\n\n近づいてきた毛鋭に、彼は言った。\n\n「自分で降ります」\n\nそして谷懿は身を翻し、主席台横の階段を降りていった。\n\n彼の背中がその夕方の光の中を通る時、影は長く引き伸ばされ、塑胶跑道の縁まで落ちた。\n\n僕はふいに、彼が台上から何かを持ち去ったようにも思えた。\n\nまた、何かをそこに置いていったようにも思えた。\n\n……\n\n谷懿は輔導員と数人の教官に囲まれ、主席台の後方へ連れていかれた。\n\n田径場の秩序は、想像以上に早く戻った。\n\nそれは少し怖いことだった。\n\nさっきの言葉は明らかにまだ空気の中で響いていた。風に吹き上げられた灰塵のように、すぐには落ちきるはずがなかった。けれど笛が鳴り、教官が再び隊列の前へ戻るだけで、人群は自動的に立つべき場所を取り戻した。\n\n何も起きなかったみたいに。\n\nそして、すべてが起きてしまったみたいに。\n\n譚校長は二人目の同学を招かなかった。\n\nただ「軍訓の時間を大切に」「充実した精神で大学生活を迎えて」などと簡単に言い、その後、教師とカメラに囲まれて田径場を去った。\n\n来た時と同じく众星环绕だったのに、どこか雑に幕を引いた狼狽が見えた。\n\n拍手はやはり起きた。\n\nただ今回は、拍手の中に何かためらいが混ざっていた。\n\nさっきの「辛苦了」の後の熱烈さでも、院士を迎える時の興奮でもなかった。\n\nもっと手続きに近かった。\n\n拍手すべきだから、拍手する。\n\n拍手が終わる頃、夕方もほとんど終わっていた。\n\n太陽は完全に観客席の向こうへ沈み、空の色は橙から少しずつ冷えていった。\n\n遠くの教学楼の窓が一つずつ明るくなり、暮色の中で誰かが小さな格子をたくさん灯しているようだった。\n\nもし僕たちがまだ田径場に立っていなければ、これは随筆に書き込むのにかなり向いた夏の夜だっただろう。\n\n夜風、灯り、運動場、少年。\n\nそこへ少しの青春の痛み。\n\n文芸映画の素材としては、かなり完整なセットだ。\n\n残念ながら張迪はすぐに証明した。現実は僕たちに文芸映画フィルターを配るつもりなどない。\n\n彼はC軍陣の前へ戻ってきた。\n\nすぐには怒鳴らなかった。\n\n僕の想像のように激怒もしなかった。\n\nただそこに立ち、顔を沈めて僕たちを見ていた。\n\nその沈黙は、罵声より不安だった。\n\n「さっき、なかなかいいことを言った人がいたな」\n\n張迪がようやく口を開いた。\n\n声は大きくなかったが、地面に打ちつけた鉄片みたいに硬かった。\n\n「訓練内容が単一だと言った」\n\n誰も返事をしなかった。\n\n「軍姿と正歩しかできないと言った」\n\n彼は一歩前へ出た。\n\n「なら今日は、単一ではないものを少し練らせてやる」\n\n心が沈んだ。\n\n隣で誰かが小さく息を吸う音がした。\n\n「全体」\n\n張迪が笛を吹いた。\n\n「しゃがめ！」\n\n笛の音が鋭く夜色を裂いた。\n\n僕たちはほとんど同時にしゃがんだ。\n\n「起立！」\n\n「しゃがめ！」\n\n「起立！」\n\n「右へならえ！」\n\n「前へならえ！」\n\n「番号！」\n\n「やり直し！」\n\n口令は次々と落ち、僕たちに考える隙を残さなかった。\n\nこれは普通の訓練ではなかった。\n\n旧版の意味での罰しゃがみでもなかった。\n\nもっと巧妙に包装された懲罰だった。\n\n張迪は「谷懿のせいで罰する」とは言わなかった。ただ谷懿がさっき批判した言葉を分解し、もう一度訓練項目の中へ押し込んだ。\n\n内容が単一だと言うのか。\n\nなら内容を増やす。\n\n軍姿しかできないと言うのか。\n\nなら反復してしゃがませ、立たせる。\n\nこれが規訓だと言うのか。\n\nなら身体で改めて理解させてやる。規訓とは何かを。\n\n「動作を速く！」\n\n「お前たちは考えが多いんだろう？」\n\n「考えが多いなら、動作はもっと標準的にしろ！」\n\n「一人の行為が集団全体に影響する。これも軍訓が教えるものだ！」\n\nその言葉が出たあと、隊列の中で誰かが歯を食いしばる音がした。\n\n一人ではなかった。\n\n多くの人だった。\n\n怨気は夜の湿気のように、塑胶跑道と芝生の間からゆっくり上がってきた。\n\n方向はなかった。\n\n名前もなかった。\n\n最初、みんなはたぶんまだ張迪を恨んでいた。\n\nけれど、しゃがめ、起立、番号、やり直しが十数分続くと、その怨気はもっと近く、もっと掴みやすい対象を探し始めた。\n\n「あいつだけ言いたいこと言って、俺らが練るのかよ」\n\n隊列の後方で、誰かが低く言った。\n\n「病気だろ。何で今言うんだよ」\n\n「自分が主人公だと思ってるのか」\n\n「先に他人の気持ち考えられないの？」\n\nそれらの声は小さかった。\n\n風が吹けば散ってしまうほど小さかった。\n\nけれど僕には聞こえた。\n\n朱銘にも聞こえたと思う。\n\n彼の肩が明らかに一度強張ったからだ。\n\n陳小雲にも聞こえていた。\n\n彼女は僕の右前方の少し離れた位置に立っていた。\n\n再整隊のせいで、僕たちはもう隣同士ではない。彼女の姿は何人かに遮られ、隊列が上下する時に横顔が少し見えるだけだった。\n\nまた誰かが言った。\n\n「哲学班のあの男、マジで格好つけすぎ」\n\n陳小雲がふいに振り向いた。\n\n声は高くなかった。\n\n「彼は目立ちたかったわけじゃない」\n\nその言葉は小さかった。\n\n張迪の口令に飲み込まれそうなほど小さかった。\n\nけれど近くの何人かには聞こえた。\n\n誰かが返した。\n\n「じゃあ今ここで罰受けてるのは誰？」\n\n陳小雲は口を開いた。\n\nけれど続けなかった。\n\n彼女はまた前を向いた。\n\n軍帽の下から覗く首筋の一部が汗に濡れ、ほつれた髪がそこへ貼りついていた。\n\n僕も何も言わなかった。\n\nもちろん、「張迪にああ訓練させたのは谷懿じゃない」と言うことはできた。\n\n「本当に問題があるのは張迪だ」と言うこともできた。\n\nその二つはどちらも正しい。\n\n政治の教科書の後ろに載っている参考答案みたいに正しい。\n\nけれど僕たちが何度もしゃがみ、立ち、膝と足首を痛みに磨かれて痺れさせている時、その正しい言葉は急に口にしづらくなった。\n\n痛みは本物だからだ。\n\n怨みも本物だからだ。\n\n正しさは、人の脚の痛みを少しも減らしてくれない。\n\n「しゃがめ！」\n\n「起立！」\n\n「もう一度！」\n\n夜色が完全に落ちた。\n\n田径場の照明が灯り、白い光の柱が高いところから打ち下ろされ、跑道を冷たく硬い川のように照らした。全員の影は足元に引き寄せられ、しゃがむたびに短くなり、伸び、また短くなった。\n\n初めて、影も疲れるのだと思った。\n\n僕たちは影を引きずりながら、何度も地面へ跪かせ、何度も立たせていた。\n\nその後、張迪は短い折り返し走をさせた。\n\n跑道の端から芝生の線まで走り、また戻る。\n\nまたしゃがむ。\n\nまた立つ。\n\nまた番号。\n\n間違えたらやり直し。\n\nその流れは下手だが有効な機械みたいで、人の不満、怒り、困惑をすべて喘ぎ声に削っていった。\n\n喉に鉄錆の味がした。\n\n眼鏡は鼻梁の下へ滑り、レンズは汗の曇りでいっぱいだった。手を上げて拭きたかったが、張迪は休憩と言わなかった。\n\n世界は水気の層の向こうにあった。\n\n主席台も水気の向こう。\n\n灯りも水気の向こう。\n\n谷懿がさっき立っていた場所も、水気の向こうにあった。\n\nあの言葉が本当に起きたのか、それとも酸欠で生まれた幻覚だったのか、少しわからなくなった。\n\nもし幻覚なら、あまりにうるさい幻覚だった。\n\n今でもまだ聞こえるほどに。\n\n「痛みが成長と説明され、服従が紀律と包装され、沈黙が成熟と呼ばれる時」\n\n僕は心の中でその言葉を繰り返した。\n\nそして次にしゃがんだ時、膝に鋭い痛みが走った。\n\nよし。\n\n哲学は最終的に関節へ落ちた。\n\nこれがおそらく、いわゆる理論と実践の結合なのだろう。\n\n谷懿がここにいれば、この冷笑話をもっと複雑に展開してくれたはずだ。\n\nだが谷懿はいない。\n\n彼のいた場所は空いていた。\n\nひどく響くほど空いていた。\n\n……\n\n補訓は夜八時過ぎまで続いた。\n\n張迪がようやく下訓の笛を吹いた時、隊列から歓声は上がらなかった。\n\nみんなただ、とてもゆっくり立ち上がった。雨に濡れたあと無理やり乾かされた紙人形の群れみたいだった。\n\n「明日から、夜訓の時間を延長する」\n\n張迪は言った。\n\n「六時から九時まで」\n\n声には何の感情もなかった。\n\n「今日のことも、お前たち一人一人に覚えておいてほしい。集団は、一部の人間が自分を表現する舞台ではない。一人が紀律を守らなければ、全体が結果を引き受ける」\n\n誰も答えなかった。\n\nあるいは、もう答える力がなかった。\n\n帰り道、夜風が田径場の外から吹いてきて、草地と塑胶跑道が混ざった匂いを運んできた。\n\nその匂いは奇妙だった。\n\n昼間は太陽に焼かれ、プラスチック、汗、埃を一緒に煮込んだスープみたいだった。夜になると冷え、湿り気を帯び、皮膚に貼りついて内側へ潜ろうとした。\n\n僕たちは街灯に沿って寮の方へ歩いた。\n\n人群は散っていた。\n\n普段みたいに大声で文句を言う人はいなかった。\n\n譚校長のことをもう一度話す人もいなかった。\n\n夕陽に一瞬照らされた興奮、崇拝、期待は、谷懿が連れていかれた時、一緒に主席台の後ろへ消えたようだった。\n\n朱銘は僕の隣を歩いていた。\n\n普段の彼は歩幅が大きく、歩く時に肩が自然に揺れる。北方の男子特有の、率直で、何かをあまり気にしない感じがある。\n\nけれど今日は、歩くのが遅かった。\n\n誰かを待っているみたいに遅かった。\n\n僕は彼が誰を待っているのかわかっていた。\n\n道の途中で、朱銘はスマホを取り出し、低頭して何度か打った。\n\n「谷懿にメッセージ送る」\n\n彼は言った。\n\n「どこにいるか訊く」\n\n僕は返事をした。\n\n数秒後、朱銘はまたスマホを見た。\n\n画面はすぐ暗くなった。\n\n谷懿から返信はなかった。\n\n僕たちの間には距離が空いていた。\n\nその距離は、本来なら谷懿のものだった。\n\n普段なら、彼は歩きながらまた危険な発言をしていただろう。たとえば「今夜の訓練は、現代大学がいかに身体規訓を通して合格した主体を製造するかを十分に証明した」とか。それから朱銘に「まず人間の言葉で話せ」と吐槽されていたはずだ。\n\nだが今は誰も話さなかった。\n\n沈黙は僕たちの間で揺れていた。本人の谷懿よりも存在感があった。\n\n書院の側門近くまで来た時、朱銘がふいに止まった。\n\n「待て」\n\n僕も止まった。\n\n「どうした？」\n\n朱銘は後ろを見た。\n\n僕も視線を追った。\n\n十数メートル後方で、見覚えのある人影が路边の欄干に手をかけ、少し頭を下げ、身体をわずかに前へ傾けていた。\n\n街灯が彼の頭上から落ち、影を足元へ押しつけていた。短く、薄い影だった。\n\n「袁林修？」\n\n朱銘が呼んだ。\n\n袁林修は明らかに身体を硬くした。\n\n彼は顔を上げてこちらを見たが、すぐまた下を向いた。\n\n「大丈夫」\n\nそれは明らかに大丈夫な声ではなかった。\n\n朱銘は数歩で近づいた。\n\n「どうした？」\n\n「本当に大丈夫」\n\n袁林修はまっすぐ立とうとした。\n\nだが力を入れた瞬間、顔色が少し変わった。\n\n手が素早く右足首のあたりを押さえた。けれど僕たちに見られたくなかったのか、すぐに離した。\n\nあまりにもはっきりした動作だった。\n\n僕でさえ見なかったふりはできないほど、はっきりしていた。\n\n「足、捻った？」僕は訊いた。\n\n袁林修は半秒黙った。\n\n「たぶん」\n\n「いつ？」\n\n「さっきの訓練の時」\n\n声は相変わらず低かった。\n\n「起立の時に少し変で、そのあと歩いてたら……」\n\n彼は最後まで言わなかった。\n\n朱銘は眉をひそめた。\n\n「じゃあさっき何で言わなかったんだよ」\n\n袁林修は唇を押さえた。\n\n「言っても意味ない」\n\nその言葉に、朱銘は一瞬続けられなかった。\n\n夜風が路边の低木を吹き、細かな葉が擦れ合って、さらさらと鳴った。\n\nその音は、遠くで誰かが本をめくっているようだった。\n\nけれどここには本などない。\n\n欄干に手をかけ、歩けないことを認めたがらない人が一人いるだけだった。\n\n「行こう。まず戻る」\n\n朱銘は言いながら彼を支えようと手を伸ばした。\n\n袁林修は反射的に避けた。\n\n「いい」\n\n「いいわけあるか」\n\n朱銘の語気が少し重くなった。\n\n「こんな時まで強がるなよ」\n\n袁林修の顔色はさらに悪くなった。\n\n僕はふいに、彼にとって朱銘にそう言われることが、足首の痛みより楽だとは限らないと気づいた。\n\n彼は大げさにしているわけではない。\n\n単に人に迷惑をかけるのが怖いだけでもない。\n\nこの数日、袁林修はほとんど話さず、ほとんど文句も言わなかった。張迪が軍姿を命じれば立ち、跑歩と言えば走り、脚を上げろと言えば上げた。隊列の一列目はいつも見られやすいのに、自分のために理由を探したこともなかった。\n\nそして今、彼は本来起きるべきではなかった補訓で、道もまともに歩けなくなっている。\n\n彼にとってそれは、たぶん痛みだけではない。\n\nひどく恥ずかしいことでもある。\n\n「とりあえず支えられて」\n\n僕はできるだけ声を低くした。\n\n「そうしないと、明日の方が面倒になる」\n\n「明日の方が面倒」という言葉が、「助けが必要」より受け入れやすかったのかもしれない。袁林修はようやく避けなかった。\n\n朱銘が彼の腕を支えた。\n\nだが数歩歩いただけで、袁林修の額に汗が浮いた。\n\n「だめだ」\n\n朱銘は止まった。\n\n「背負う」\n\n「いい」\n\n「相談してるんじゃない」\n\n朱銘はしゃがんだ。\n\n彼の背中は広く、軍訓服の背中は汗で大片が濃く染まり、街灯の下で水に濡れた地図みたいだった。\n\n袁林修はその場に立ち、顔色を青くしたり白くしたりした。\n\nまだ拒むと思った。\n\nけれど最後に、彼はとても小さく言った。\n\n「悪い」\n\nその声はほとんど聞こえなかった。\n\n朱銘は振り返らなかった。\n\n「悪いと思うなら動くな」\n\n袁林修は彼の背に乗った。\n\n朱銘が立ち上がる時、足取りは明らかに一瞬沈んだが、すぐに安定した。\n\n彼はまだ振り返る余裕さえあった。\n\n「姜嵐、彼の水筒持って」\n\n「うん」\n\n僕は袁林修の手から水筒を受け取った。\n\n透明なプラスチックの中には、ほんの少しだけ水が残っていて、街灯の下で揺れていた。\n\nその水は揺れ、揺れて、まるで小さな月のようだった。\n\n今日は中秋だった。\n\n僕はふいにそれを思い出した。\n\nけれど雲夢の空には月が見えなかった。\n\n雲に隠れていたのかもしれない。\n\nあるいは僕たちがずっと下を向いていて、探す時間がなかっただけかもしれない。\n\n……\n\nA109へ戻ると、李向陽はすでに戻っていた。\n\n彼は机の前に座り、スマホの画面を点けて、何かの通知を見ているようだった。\n\n入口の音を聞いて振り向く。\n\n朱銘が袁林修を背負って入ってきたのを見ると、表情が明らかに変わった。\n\n「どうした」\n\n朱銘は袁林修を椅子に下ろした。\n\n「足をやった」\n\n袁林修はすぐ言った。\n\n「たぶんちょっと捻っただけ」\n\n李向陽は立ち上がり、彼の横へ来た。\n\n朱銘のようにすぐ手を出すことも、「強がるな」と言うこともなかった。\n\nまず袁林修の足首を見て、それから表情を見た。\n\n「動かせるか」\n\n袁林修は少し足を回そうとした。\n\n動きは小さかった。\n\nだがすぐに眉をひそめた。\n\n「痛い？」\n\n「まあ」\n\n「まあ、は痛いってことだ」\n\n李向陽は平静に言った。\n\n確かに彼らしい言い方だった。\n\n彼はスマホを取り、何かを調べ始めた。\n\n「校医院はこの時間だともう閉まりかけてるはずだ。急診に骨科があるとは限らない。今報告すれば、輔導員、班導、教官側が全部、具体的な状況を訊いてくる」\n\n「訊かせとけばいいだろ」\n\n朱銘は眉を寄せた。\n\n「人がこうなってるんだぞ」\n\n李向陽はすぐには返事をしなかった。\n\n彼はスマホを見下ろし、画面の冷たい光で顔が照らされ、表情が普段よりさらに淡く見えた。\n\n「放っておくとは言っていない」\n\n彼は言った。\n\n「どう処理するのが一番安定か判断している」\n\n「安定？」\n\n朱銘の声が少し上がった。\n\n「今この状況で何を安定させるんだよ」\n\n李向陽は顔を上げて彼を見た。\n\n「明日も訓練がある。もし彼が明日行けないなら、休暇を申請する必要がある。理由を何と書く？　訓練で負傷？　誰が証明する？　見た人はいる？　今夜の加訓に触れるのか？　触れたら状況説明を書かされるのか？　輔導員にどうして今になって言うのかと訊かれたら、何と答える？」\n\n一気にいくつも問うた。\n\nどの問いも現実的だった。\n\n現実的すぎて、嫌になるほどだった。\n\n朱銘は半秒言葉に詰まった。\n\n「だからって、このまま我慢するわけにはいかないだろ」\n\n「だから先に判断すると言っている」\n\n李向陽の声は相変わらず安定していた。\n\n「ただの捻挫なら、まず冷やして、明朝の状態を見る。ひどいなら今夜病院へ行く。いきなり事を大きくしない」\n\n「大きく？」\n\n朱銘は彼を見た。\n\n「袁林修が足を怪我した。それを大きくするって言うのか？」\n\n寮の中が一瞬静かになった。\n\n空調の風が上から吹き、まだ完全に乾いていない軍訓服をかすめ、湿った布の匂いを立ち上げた。\n\n僕は机の横に立ち、袁林修の水筒を持ったままだった。\n\nそのわずかな水はもう揺れていなかった。\n\n「そういう意味じゃない」\n\n李向陽は言った。\n\nだがその語気には、あまり謝罪の色はなかった。\n\nもっと、表現が不正確だったので修正しているようだった。\n\n「僕が言いたいのは、今僕たちはこの件がどう定義されるかわからないということだ。普通の捻挫、訓練中の事故、それとも今夜の補訓による負傷。言い方が違えば、その後の処理も違う」\n\n「定義なんかいるか？」\n\n朱銘が言った。\n\n「張迪が無茶な訓練で人を怪我させた。それだけだろ」\n\n李向陽は彼を見た。\n\n「証明できるのか」\n\nその三文字が落ちたあと、朱銘は完全に黙った。\n\n説得されたからではない。\n\nその言葉があまりに冷たかったからだ。\n\n寮の空調温度を、誰かが突然何度も下げたみたいに冷たかった。\n\n僕も何も言えなかった。\n\n朱銘が正しいことはわかっている。\n\n今夜の訓練は異常だった。\n\n張迪は明らかに借題发挥していた。\n\n袁林修はその補訓の中で怪我をした。\n\nけれど、証明できるのか？\n\n動画はあるのか。\n\n記録はあるのか。\n\n誰かが証言に出てくれるのか。\n\nそれとも、四つの疲れた顔、一つの痛む足首、いつでも「正常な訓練強度」と説明され得る記憶だけで、今夜起きたことを証明するしかないのか。\n\n「じゃあ何だよ」\n\n朱銘がふいに言った。\n\n「証明が面倒だから、今夜は何もなかったことにするのか？」\n\n彼は少し止まった。\n\n「谷懿が午後言ったこと、間違ってたのか？」\n\n李向陽はしばらく黙った。\n\n「全部間違っているとは言っていない」\n\n彼はスマホを机に置いた。\n\n「でもああいう人間は、一番都合がいい」\n\n朱銘は眉をひそめた。\n\n「どういう意味だ？」\n\n「言いたいことを言って、行ってしまう」\n\n李向陽は机の上を見た。\n\n「残った結果は他人が処理する」\n\n今度は袁林修まで顔を上げて彼を見た。\n\n朱銘の顔は完全に沈んだ。\n\n「それはどういう意味だよ。谷懿が張迪にああ訓練しろって言ったのか？」\n\n「違う」\n\n「じゃあ何で谷懿を責める？」\n\n「僕は責めたか？」\n\n李向陽は聞き返した。\n\n声は大きくなかったが、はっきりしていた。\n\n「僕はただ、彼は何かをする前に、他人がどんなコストを払うのか考えたのかと言っている」\n\n「今日処分されるのが彼だけなら、それは彼の選択だ。だが今加訓されているのは全員で、怪我をしたのは袁林修だ」\n\n「彼はもちろん、自分はみんなのためだと言える」\n\n「けれど、みんなは同意したのか？」\n\n朱銘は口を開いた。\n\nその表情は、罵りたいのに、どの一言から罵ればいいのかわからないようだった。\n\n僕は横に立ち、胸の奥が少し詰まるのを感じた。\n\n李向陽の言葉は刺耳だった。\n\n刺耳すぎて、本能的に反論したくなった。\n\nけれど反論できなかった。\n\n少なくとも数学の問題を解くように、綺麗に線を引いて消すことはできなかった。\n\n谷懿は確かに、僕が言いたくても言えなかった言葉を言った。\n\nそして袁林修は確かにここに座り、足首が痛くて動かせなかった。\n\nこの二つは同時に成り立っていた。\n\n互いを打ち消さない。\n\nただ一緒に、狭い寮の空気の中へ重くのしかかった。\n\n袁林修が低く言った。\n\n「谷懿は関係ない」\n\n声は小さかった。\n\nけれど全員に聞こえた。\n\n李向陽は彼を見た。\n\n袁林修は顔を上げなかった。\n\n「自分が気をつけなかっただけ」\n\nその言葉のあと、寮はさらに静かになった。\n\n僕には、彼がなぜそう言ったのかわかった。\n\n彼は谷懿を弁護しているのではない。\n\n張迪をかばっているのでもない。\n\nただ、自分の怪我を、他人の議論の証拠にされたくなかったのだ。\n\n彼はもう十分痛い。\n\nそれなのに、僕たちが彼を使って誰が正しいか間違っているかを証明しようとするのは、さすがに少し酷すぎた。\n\n朱銘は深く息を吸った。\n\n「先にこの話はやめよう」\n\n声が低くなった。\n\n「姜嵐、校医院の電話調べて。俺は洗面所でタオル濡らして、先に冷やす」\n\n「わかった」\n\n僕はようやく、自分にできることを一つ見つけた。\n\nとても小さなことだった。\n\n小さすぎて、少し笑えてくるほどだった。\n\n谷懿は午後、主席台で規訓、集団、痛み、順従について語った。\n\nそして今の僕にできるのは、校医院が何時に閉まるか調べることだけだ。\n\nけれど少なくとも、それは本物だった。\n\nスマホの画面が点いた。\n\n学校の公式サイトを開き、地図アプリも開き、指で画面を滑らせた。\n\n校医院の位置は書院から遠くなかった。\n\n夜間当直電話はページの一番下にあり、文字はわざと隠したみたいに小さかった。\n\n僕は番号を朱銘に読み上げた。\n\n朱銘が洗面所の中で返事をした。\n\n蛇口が開き、水の音がざあざあと鳴った。\n\n李向陽はそれ以上何も言わなかった。\n\n彼は椅子へ戻り、またスマホを手に取り、休暇申請の流れを調べているようだった。\n\n横顔が画面に照らされ、表情は平静に近いほど淡かった。\n\n親指が何度か画面を滑り、また止まった。何かの情報を照合しているようだった。\n\n洗面所の水音はまだ続き、袁林修は椅子に座り、片手で机の縁を支え、足首の横の靴下口は皺になっていた。\n\n僕は画面に照らされた彼の横顔を見て、彼に調べるのをゆっくりしてほしいのか、早くしてほしいのか、突然わからなくなった。\n\n……\n\n朱銘が袁林修を冷やしている時、クラスグループが突然騒がしくなった。\n\n最初は誰かが動画を送った。\n\nファイル名はとても長く、スマホが自動生成した時刻番号のようだった。\n\n僕が開いた時、動画はすでに最初の一フレームを読み込んでいた。\n\n主席台。\n\n夕方。\n\n谷懿がマイクの前に立っている。\n\n画面はかなり揺れていて、誰か学生が隊列の間からこっそり撮ったものだろう。距離が遠く、谷懿の顔ははっきりしない。ただ彼の姿と、主席台の後ろで暗くなりつつある空だけが見えた。\n\n再生を押す前に、画面に一行の通知が跳ねた。\n\n【このメッセージは撤回されました】\n\n動画は消えた。\n\nチャット欄は一瞬空いた。\n\nすぐに誰かが送った。\n\n【？】\n\n【さっき何】\n\n【誤爆】\n\n【これ出さない方がいいだろ】\n\n【輔導員、グループにいるっぽい】\n\nそれらのメッセージもすぐ止まった。\n\n数分後、輔導員の彭悦が年級グループに通知を送った。\n\n【各位同学、本日の軍訓中、個別同学の発言内容には片面的理解と不適切な表現が存在しました。未確認の動画および情報を伝播・拡散せず、ネット平台に関連内容を投稿しないようお願いします。軍訓安排に意見や提案がある場合は、正规渠道を通じて輔導員、班導または書院の先生へ反映してください。理性的に受け止め、安心して訓練に臨んでください。】\n\nそのメッセージの後ろには赤い感嘆符の絵文字がついていた。\n\n感嘆符は大きかった。\n\nまるで一本立てられた指のようだった。\n\nグループではもう誰も話さなかった。\n\nさっき寮の中で響いていた水音が止まった。\n\n朱銘は濡れタオルを手に出てきて、スマホを見た。\n\n「未確認？」\n\n彼は怒りで笑ったようだった。\n\n「あんな人数が聞いてたのに、何を確認すんだ？　耳が純正かどうかか？」\n\n李向陽が言った。\n\n「グループでは返すな」\n\n「わかってる」\n\n朱銘はスマホを机に置いた。\n\n「俺だって馬鹿じゃない」\n\nそう言って、タオルを袁林修の足首に当てた。\n\n袁林修は痛みで息を吸ったが、避けなかった。\n\n僕はグループの通知を見ていた。\n\n個別同学。\n\n片面的理解。\n\n不適切な表現。\n\n未確認。\n\n正规渠道。\n\n安心して訓練。\n\nそれらの言葉が並ぶと、細かい網のようだった。\n\nそれは谷懿が何を言ったかを直接否定していない。\n\n今夜の補訓が存在しなかったとも言っていない。\n\nただ、全員の目の前で起きたばかりの出来事を、少しずつ、確認が必要で、渠道が必要で、理性的に見るべきものへ変えていった。\n\n僕は谷懿が主席台に立っていた時、風が彼の前髪を吹き上げた様子を思い出した。\n\nあの時、彼の声はあんなに明瞭だった。\n\n田径場全体が聞いたほど明瞭だった。\n\nけれど今、動画は撤回され、グループは静かになり、通知が覆いかぶさった。\n\nその声は水の中に落ちたようだった。\n\n誰かが手を伸ばしてすくう前に、もう沈み始めている。\n\n僕はそれを覚えていたかった。\n\nけれどそう思えば思うほど、自分が忘れてしまうことが怖くなった。\n\n彼が言った一言一言を忘れること。\n\nあの夕方の風を忘れること。\n\n台下の、ほとんど贅沢なくらい短い静けさを忘れること。\n\n陳小雲の言い切れなかった「彼は目立ちたかったわけじゃない」を忘れること。\n\n袁林修が欄干に手をかけ、顔を伏せていたことを忘れること。\n\n李向陽の、刺耳なのに簡単には退けられない問いを忘れること。\n\n朱銘が人を背負う時、低く抑えた息を忘れること。\n\nそして、整件の出来事の中で、僕がずっと見ていただけだったことさえ忘れること。\n\n僕はスマホの画面を消した。\n\n画面が黒くなった瞬間、そこに自分の顔が映った。\n\n顔色は白い。\n\n眼鏡は歪んでいる。\n\n髪は汗と帽子でめちゃくちゃに押しつぶされている。\n\nどう見ても、宏大な問題に答えられる人間には見えなかった。\n\nまして英雄などではない。\n\n……\n\nその夜、A109はなかなか寝なかった。\n\n朱銘は何度か袁林修を冷やし、校医院の当直状況を電話で訊いた。相手は、痛みが強いなら来てもいいが、できれば激しく歩かず、明朝レントゲンが必要か見た方がいい、と言った。\n\nその答えはほとんど無駄話みたいだった。\n\nけれど人は不安な時、たとえ無駄話でも少しの支えになる。\n\n少なくとも、電話の向こうに本当に人がいるとわかる。\n\nすべての問題が撤回されるだけではないとわかる。\n\n僕も谷懿に微信を一通送った。\n\n【僕：今どうしてる？】\n\n送ると、横にすぐ時間が表示された。\n\n赤い感嘆符はない。\n\n返信もない。\n\n袁林修はその後、朱銘に支えられてベッドへ上がった。\n\n彼は何度もありがとうと言った。\n\n毎回、とても小さな声だった。\n\n朱銘は言われすぎて面倒になったのか、最後にこう返した。\n\n「本当に礼を言いたいなら、明日はもう大丈夫って言うな」\n\n袁林修はしばらく黙った。\n\n「うん」\n\nそれが彼にできる最大の約束だったのだろう。\n\n李向陽は休暇申請に使えそうな情報を整理し、いくつかのリンクをA109の小グループへ送った。\n\n【李向陽：校医院当直電話。】\n\n【李向陽：書院休暇手続き。】\n\n【李向陽：明朝訓練に参加できないなら、まずグループで彭先生に身体原因を説明する。今夜の補訓には自分から触れない。相手が追問した場合だけ。】\n\n朱銘は読み終えて彼を見上げた。\n\n「お前って本当に……」\n\n何かを評しようとしたようだった。\n\nだが最後まで評せなかった。\n\n李向陽も説明しなかった。\n\nただスマホを置き、デスクライトを消した。\n\n寮が暗くなった。\n\n空調はまだ吹いていた。\n\nカーテンの隙間からキャンパスの街灯が少し入り、床に細い一本の光を敷いていた。\n\nその光は月光ではなかった。\n\n月光ならもっと柔らかく、もっと遠く、詩人たちに何度も使い回されるのに向いているはずだ。\n\n街灯の光は人工のものだった。固定され、少し冷たい白を帯び、規定された幅の川みたいだった。\n\n僕はベッドに横たわり、目を閉じた。\n\n身体は疲れていた。\n\n筋肉の一つ一つを誰かに取り外され、適当に取り付け直されたみたいに疲れていた。\n\nけれど眠れなかった。\n\n耳元でときどき蚊が飛んだ。\n\n軍訓期間中は蚊帳を吊るすことも、蚊取り線香を使うこともできない。理由はたぶん内務要求と消防安全だ。\n\nつまり、この制度の中で蚊は僕たちより十分な行動自由を獲得している。\n\n彼らは勝手にベッドの境界を越え、低空偵察し、正確に攻撃し、僕が手を上げる前に瀟洒に撤退できる。\n\nいつか蚊も軍訓に参加するなら、僕は彼らが機動性過強として張迪に重点的に目をつけられると信じている。\n\n僕は手を振った。\n\n何も当たらなかった。\n\n暗闇は再び静かになった。\n\nだがそのぶんぶんという音はまだあった。\n\n小さく、しつこいこだまのように。\n\n谷懿の声もあった。\n\n張迪の口令もあった。\n\n輔導員のグループ通知もあった。\n\n李向陽の「ああいう人間は一番都合がいい」もあった。\n\n僕は寝返りを打ち、膝とふくらはぎに酸痛が走った。\n\nその痛みが、今夜は幻覚ではなかったと知らせてくれた。\n\nすべて起きた。\n\n谷懿は主席台に立ち、陳小雲は彼のために何かを言おうとし、袁林修は路边に取り残され、朱銘は彼を背負って戻り、李向陽はリスクを一条ずつ並べた。そして僕は最初から最後まで、それらの出来事の間を遅く移動していただけだった。\n\n主席台に立たなかった。\n\n張迪に反論しなかった。\n\n陳小雲のあの言葉を代わりに言い切らなかった。\n\n李向陽の刺耳な言葉に対して、綺麗な答えを返すこともできなかった。\n\n僕はただ校医院の電話を調べた。\n\n袁林修の水筒を持った。\n\nグループメッセージが撤回されたあと、黒くなった画面をしばらく見ていた。\n\nそれらはあまりに小さなことだった。\n\n英雄物語に書き込めば、編集に「主線を推進しない」と言われて削られるだろう。\n\nけれどぼんやりと、もしかすると、こういう物語らしくもないほど小さなことこそが、今夜を本当に残したのかもしれないと思った。\n\n谷懿は問題を田径場全体へ投げた。\n\nそして夜は、その問題を一人一人の具体的な人へ少しずつ返した。\n\n陳小雲の言い切れなかった言葉へ。\n\n袁林修の痛む足首へ。\n\n朱銘の曲がった背中へ。\n\n李向陽の冷静すぎて残酷に近い判断へ。\n\nそして僕の、この疲れ、ためらい、怖がりながら、それでももう何も聞かなかったふりはできない身体へ。\n\n窓の外に月はなかった。\n\n雲夢の中秋の月は、雲に隠されていたのかもしれない。\n\nあるいは、僕たちの見えない場所にただ懸かっていて、田径場を照らし、主席台を照らし、寮へ戻る道を照らし、撤回された一本の動画メッセージを照らし、今どこへ連れていかれたかわからない谷懿をも照らしていたのかもしれない。\n\n僕は暗闇の中で目を開けていた。心のどこかで、まだモーセの出現を期待していたのかもしれない。彼が、奴隷としてしか生きられないこのエジプトから僕を連れ出し、自由の約束の地へ導いてくれることを。\n\nけれど僕に返ってきたこだまは、蚊の羽音だけだった。"},{"title":"第九章：恋は雨上がりのように","file":"9、第九章.md","volumeTitle":"第一巻：物語の始まりは平凡すぎるくらいでいい","text":"徹夜したことは、翌日の軍訓を拒否する理由にはならない。\n\n少なくとも、雲夢師大の新入生管理制度においては、ならない。\n\nもし「昨夜、蚊と人生の意味に連携攻撃を受けたため、本日は訓練に参加できません」などという理由で休みを取れるのなら、僕は雲夢師範大学が人文的配慮において全国の大学、いや世界の大学の先頭を走っていると認めてもいい。\n\n残念ながら、それは幻想タイムにすぎなかった。\n\n朝六時二十分、スマホのアラームが鳴った。\n\nそのメロディが枕元から這い出してきた時、寮の中はまだ暗かった。カーテンの隙間の外にある空の色は、黒でも明るい色でもなく、水に浸した灰色のようだった。\n\n僕は目を開けたまま、ベッドカーテンの内側から垂れている短い糸くずを見ていた。\n\nそれは空調の風で揺れていた。\n\n一度。\n\nまた一度。\n\n数秒それを見つめてから、隣のベッドで李向陽が降りる気配がして、ようやくゆっくりスマホを止めた。\n\nA109には二人足りなかった。\n\nその「足りなさ」は人数を数えてわかったものではなく、音の中から漏れ出してきたものだった。普段ならこの時間、朱銘はだいたい先にベッド板を大きく鳴らし、それから半分死にかけた声で自分と朝は不倶戴天の敵だと宣言する。袁林修はたいてい何も音を立てない。ただ、みんなが洗面をほとんど終えた頃、いつの間にか着替え終わって梯子のそばに立っている。\n\n今日はなかった。\n\n寮に残っているのは、低く抑えられた空調の唸り、李向陽がロッカーを開ける小さな音、それから僕が梯子を降りてスリッパで床を踏む鈍い音だけだった。\n\nスマホの画面が一度光った。\n\nA109の小グループに、朱銘が三十分前にメッセージを送っていた。\n\n【朱銘：袁林修に付き添って校医院行く。朝訓は休む。】\n\nその下に、李向陽がいくつか送っていた。\n\n【李向陽：校医院に着いたらまず普通外科か急診にかかれ。医者がどう書くかで休暇申請する。】\n\n【李向陽：休暇メッセージに昨夜の補訓は自分から書くな。まずは足首の痛み、受診が必要と書け。】\n\n読み終えてから、僕はスマホをポケットに押し込んだ。\n\nそれらの文字は頭の中で完全な文にならず、いくつかの単語だけが浮いていた。\n\n校医院。\n\n休暇。\n\n足首。\n\n昨夜。\n\n集合。\n\nどの単語も雨に浸かった紙片みたいで、端がふやけて、どうしても一枚に戻らなかった。\n\n洗面所の灯りがついた。\n\n白い光がドアの隙間から漏れ、床にまっすぐな線を引いた。\n\n僕はその線の外側でしばらく待ち、李向陽が洗面を終えて出てくるまで立っていた。彼は僕を一瞥し、何か言おうとしたようだったが、最後にはただこう言った。\n\n「遅れるなよ」\n\n僕はうなずいた。\n\nその言葉は聞き慣れていた。\n\n軍訓が始まってから、毎朝、誰かが違う語調で似たようなことを言っている。朱銘なら「急げ急げ、遅刻したら終わりだ」と言うし、李向陽なら「あと十二分」と言う。谷懿なら「遅刻もまた主体性の一種の実践だ」と言い、本人はたいてい本当に遅刻はしない。\n\n今日のその言葉は耳に落ちたのに、どこか遠くから聞こえたみたいだった。\n\n洗面台の鏡には薄い水気が曇っていた。\n\n鏡の中の人間は顔色が白く、眼鏡をまだ掛けておらず、五官が湿気でぼやけて一塊になっていた。僕は一度だけ見て、すぐに顔を伏せて水を出した。\n\n蛇口から水が流れ出す音は、いつもより大きく聞こえた。\n\n歯磨き、洗顔、着替え、靴ひもを結ぶ。\n\nそれらの動作は順番に起こった。\n\nまるで列を作って僕の横を通り過ぎていくみたいで、僕はただ身体をそれに追いつかせる係だった。\n\n寮を出ると、廊下にはもう多くの新入生がいた。スリッパ、軍訓靴、プラスチックの水筒、鍵束、抑えた不満の声が混ざり合い、外へ流れる一つの人の流れになっていた。\n\n僕もその中にいた。\n\n路面には昨夜の熱がまだ残っていた。\n\n地砖の隙間から熱気が浮かび上がり、木も、建物も、街灯の柱も、遠くの運動場のフェンスも、一つ一つの色の塊に滲んでいた。人群が前へ動くと、緑色の軍訓服が灰白い空の下でゆっくり移動し、まだ乾ききっていない油絵みたいだった。\n\n誰かが話す声が聞こえた。\n\n笑い声が聞こえた。\n\n水筒がリュックのサイドポケットに当たる音が聞こえた。\n\nけれどそのどれも、耳の中にちゃんと留まらなかった。\n\nただ通り過ぎただけだった。\n\n人の流れについて田径場の近くまで行って、ようやく前方がいつものように素早く隊列を組んでいないことに気づいた。\n\n多くの人が入口で立ち止まっていた。\n\n空を見上げる人。\n\nスマホを掲げる人。\n\n隊列から外へ走っていく人。\n\nそれらの画面には、最初、意味がなかった。\n\n誰かが切り刻んで、僕の前に適当に撒いたみたいだった。\n\n眼鏡に一滴の水が落ちるまでは。\n\n視界の中央に、丸い透明な斑点が現れた。\n\nその斑点は遠くの人影を二つに折った。\n\n僕は瞬きをした。\n\n二滴目が落ちた。\n\n三滴目。\n\nそして、もっと多く。\n\n雨音は最初、葉と帽子のつばから鳴り始め、すぐに田径場の入口全体を覆った。地面の色が数秒で濃くなり、埃の匂いは水に押さえ込まれ、塑胶跑道から返っていた熱気は雨に砕かれ、空気の中に土、草の葉、濡れた布地が混ざった匂いが増えた。\n\n世界が雨に滲んだ。\n\nさっき油絵のように貼りついていた色の塊は、眼鏡の上を伝って流れ始めた。\n\n「雨だ！」\n\n「総教が午前は訓練なしって！」\n\n「マジ？」\n\n「マジ。先に戻って通知待ち！」\n\n人群は一気に息を吹き返した。\n\nその息の吹き返し方は、普段の集合前の騒がしさとは違って、長いあいだ閉じ込められていた何かが突然出口を見つけたようだった。歓声を上げる人、笑う人、すぐに傘を開く人、軍帽だけを頼りに走って戻る人。\n\n雨の中で傘が次々と開いた。\n\n黒、青、透明、カートゥーン柄。\n\nそれらは人群の中から一輪ずつ芽を出す花みたいだった。\n\n僕はその場に立っていた。\n\n雨水が帽子のつばを伝って眼鏡に落ち、またレンズの縁から滑り落ちた。軍訓服はすぐに水を吸い、肩が重くなり、裾がふくらはぎに貼りついた。軍訓靴で濡れた地面を踏むと、靴底がわずかに粘ついた音を立てた。\n\nこの雨はあまりに突然だった。\n\n突然すぎて、喜ぶことさえ半拍遅れた。\n\nようやく戻るべきだと思い出した時には、周りの人はもうかなり減っていた。\n\n朱銘はいない。\n\n谷懿もいない。\n\n普段なら、朱銘はきっと真っ先に、これは天から降りた正義であり、全員で降水雲団に最高の敬意を表すべきだと宣言しただろう。\n\n谷懿なら、おそらくこれは自然界による規訓秩序の一時的破壊であり、大気循環による現代大学統治術への否定だと言ったはずだ。\n\nもちろん、彼もただ一言「最高」とだけ言って、誰よりも速く走る可能性もある。\n\nけれど今、雨の中にそういう声はなかった。\n\n僕はふと、ネット掲示板で有名だったあの言葉を思い出した。暴雨の中を歩く時、傘は空を逆さに漕ぐ船だ。\n\n残念ながら、僕には船がなかった。\n\nあるのは吸水性能にすこぶる優れた軍訓服と、もうすぐ小型貯水池になる軍訓靴だけだった。\n\n僕は寮の方向へ歩き出した。\n\n雨はさっきより強くなっていた。\n\n水滴が帽子のつばを叩き、誰かが鉄皮の屋根にガラス玉を一袋ぶちまけたみたいな密度で鳴った。人影は流れる水越しに見え、輪郭が散ってはまた集まった。路面には浅い水がたまり、木の影と建物の影がいくつもの欠片に砕け、足で踏むたび、その欠片がまた乱れた。\n\n田径場を出て少し行ったところで、頭上の音がふいに変わった。\n\n雨はもう帽子や肩を直接叩いていなかった。\n\nもっと高く、もっと薄いものに落ち、連続した柔らかなぱらぱらという音になっていた。\n\n僕は顔を上げた。\n\n空が消えていた。\n\n米黄色の傘が頭上を遮っていた。\n\n傘骨が描く弧は大きくなく、傘の縁には細かい水滴が垂れていた。水滴は布地を滑り、縁に集まり、一粒ずつ地面へ落ちた。\n\n霍鈺が僕の隣に立っていた。\n\n彼女は今日は淡い色の半袖に、薄い日よけの上着を羽織っていた。袖口が少し雨に濡れている。髪は耳の後ろで緩く留めてあり、湿気に引き出された数本が頬の横に貼りついていた。\n\n彼女は前の雨幕を見ながら言った。\n\n「すごい雨だね」\n\nあまりにも普通の一言だった。\n\n普通すぎて、同じ雨に閉じ込められた二人なら誰でも言いそうな言葉だった。\n\nそれなのに、僕は半拍遅れて反応した。\n\n「霍学姐」\n\n声に出してから、自分の喉が少し掠れていることに気づいた。\n\n彼女は僕を振り向き、目に少し笑みを浮かべた。\n\n「覚えていてくれたんだ」\n\n「もちろん覚えています」\n\n言ってから、その答えが妙に真面目すぎることに気づいた。\n\n霍鈺は追及せず、ポケットからティッシュを一包み取り出して、一枚抜き、こちらに差し出した。\n\n「拭いたら」\n\n僕はティッシュを受け取った。\n\n指先が彼女の指先に触れた瞬間、すぐに離れた。\n\n彼女の手は少し冷たかった。\n\n雨のせいかもしれない。\n\n眼鏡を外すと、目の前はたちまちぼやけた水色だけになった。木も、道も、人も、傘も、すべて境界のない影へ退いた。\n\nレンズを拭いて掛け直すと、世界はようやく元の形に近いものへ組み直された。\n\n「ありがとうございます、学姐」\n\n「どういたしまして」\n\n彼女は傘を少し僕の方へ寄せた。\n\n僕は反射的に横へずれた。\n\n「大丈夫です。こっちは少し濡れても」\n\n霍鈺は僕の肩の軍訓服がもうかなり濃い色になっているのを見た。\n\n「もう少しじゃないよ」\n\n僕は場を和ませるために何か言おうとした。たとえば「どうせ軍訓服も水くらいでは変わらないです」とか。けれど口元まで来たところで、すでにずぶ濡れになった服に対してその冗談はあまりに残酷だと思い、飲み込んだ。\n\n傘は大きくなかった。\n\n二人で差すには、微妙な距離を保たなければならない。離れすぎると誰かが濡れる。近すぎると、手をどこに置けばいいのかわからなくなる。\n\n僕は手をズボンの縫い目の横に置くことを選んだ。\n\n軍訓が僕にくれた数少ない筋肉記憶の一つである。\n\n雨音は傘の外で一つにつながり、遠くの叫び声や足音を隔てていた。傘の下の空間は狭く、呼吸の音まで普段よりはっきり聞こえた。\n\n「雲夢の夏は、よくこうなるよ」\n\n霍鈺が言った。\n\n「さっきまで街全体が溶けそうなくらい暑かったのに、次の瞬間にはこうなる」\n\n「まだ慣れません」\n\n「来たばかりの人はみんな慣れない」\n\n彼女の口調は自然だった。\n\n天気の話をしているようだった。\n\n実際、天気の話だった。\n\n「でも雲夢の雨は来るのが急で、止むのも早いよ。何もかも流してしまいそうに思えても、名残惜しくなった頃には、勝手に止んでしまう」\n\n「わがままですね」\n\n「そうだね」\n\n彼女は笑った。\n\n「でも、完全には嫌いじゃない」\n\n僕たちは一本のクスノキのそばを通った。雨が樹冠を叩き、音が急に厚くなった。水の重みで下がった葉が傘の面を擦り、さらさらと音を立てた。\n\n「高校の時にも、一度こういう雨に遭ったことがある」\n\n霍鈺がふいに言った。\n\n「高校？」\n\n「うん」\n\n彼女は何気なく思い出したようだった。\n\n「夏で、雨も急に降り出した。その時、先生から資料を受け取ったばかりで、外に出たらもう道が塞がれていたの」\n\n僕は彼女を見た。\n\n「道端のバス停みたいな屋根の下で、ずいぶん長く立っていた。雨が大きくて、永遠に止まないみたいで……」\n\n「それで？」\n\n「それから、傘を差した人が一人、歩いてきた」\n\n彼女は傘の外の雨を見ていた。視線が一瞬だけ、ずっと遠いところへ落ちたようだった。\n\n「変な人だった」\n\n「変？」\n\n「うん」\n\n彼女は視線を戻し、口調はまたさっきのように軽くなった。\n\n「初対面なのに、傘を貸してくれたの」\n\n「いい人っぽいですね」\n\n「私は、何かのアニメ主人公ごっこでもしているんですかって訊いた」\n\n「学姐、けっこう容赦ないですね……それで？」\n\n霍鈺の目が少し弧を描いた。\n\n「それで、その人は傘を私の手に押し込んだ」\n\n「強引ですね」\n\n「強引というほどでもないかな」\n\n霍鈺は少し考えた。\n\n「自分はちょっと雨に濡れても大丈夫だから、って」\n\n僕は黙った。\n\nその言葉は、確かに思春期の男子が言いそうな馬鹿げた台詞だった。\n\nとくに、何の根拠もないのに善意を何かの体力自慢みたいに包みたがる男子が。\n\n「それで学姐は受け取ったんですか？」\n\n「うん」\n\n「そのまま？」\n\n「じゃあどうすればよかったの？」\n\n霍鈺は自然に聞き返した。\n\n「手に持っていた資料が濡れたら困るし」\n\n彼女はそこで少し止まった。\n\n霍鈺は指先で、傘の柄の磨り減って白くなった縁に触れた。\n\n「それに、彼は家が近いって言った」\n\n「本当に近かったんですか？」\n\n「さあね」\n\n彼女はまた少し止まった。\n\n「それから、この傘はずっと私のところにある」\n\n彼女は手元の傘の柄を少し上げた。\n\n「この傘？」\n\n「うん」\n\n「長く使ってるんですか？」\n\n「何年か」\n\n彼女はそれ以上説明しなかった。\n\nその米黄色の古い傘は、新しく買ったものには見えなかった。柄の縁は白く擦れ、傘骨が作る弧も完全な左右対称ではない。\n\nけれど霍鈺が持っていると、それはとても自然に見えた。彼女が真面目に手元へ残してきた生活習慣みたいだった。\n\n「何を考えてるの？」\n\n彼女が訊いた。\n\n「この傘には、物語と意味がありそうだなって」\n\n「そう？」\n\n「はい」\n\n「でも、意味っていうものは結局、特定の人が与えるものだから」\n\n彼女は言った。\n\nその言葉のあと、僕たちは少し黙った。\n\n雨はまだ降っていた。\n\n路肩の排水口は水を飲み込みきれず、低く鳴っていた。落ちた数枚の葉が縁に沿って回り、半周したところで、また水の流れに押し戻された。\n\n「昨日のこと」\n\n僕はようやく口を開いた。\n\nその四文字を口にして初めて、それがずっと口の中に置かれていたことに気づいた。\n\n霍鈺はすぐには返事をしなかった。\n\nただ傘を少し低くして、正面から吹き込んでくる雨を避けた。\n\n「学姐は聞きましたか？」\n\n「少しは」\n\n彼女は言った。\n\n「谷懿にメッセージを送りました」\n\n「返ってこない」\n\n霍鈺は僕を一度見た。\n\n「うん」\n\n彼女はあまり意外ではなさそうだった。\n\n僕は地面を見下ろした。\n\n水が靴の縁を越えて流れ、軍訓靴の布地はもう完全に濡れていた。一歩歩くたび、靴の中から細かい水の音が押し出された。\n\n「今、実はちょっと考えられないんです」\n\nその言葉を言ってから、自分でも少し唐突だと思った。\n\n「それなら、急いで考えなくていい」\n\n僕は彼女を見た。\n\n彼女は僕を見ず、相変わらず雨に洗われて光る道の先を見ていた。\n\n「いろんなことは、一晩で考え切れるものじゃないから」\n\n彼女の声は高くなかった。\n\n慰めようと力む感じはなく、ただ当たり前の道理を述べているようだった。\n\n「でも、本当に考えないわけにもいかない」\n\n僕は言った。\n\n「谷懿の言葉を、聞かなかったことにはできない」\n\n「うん」\n\n「でも彼が連れていかれたあと、残ったことは彼一人にだけ落ちたわけじゃない」\n\n「うん」\n\n「罰を受けた人がいて、怪我をした人がいて、彼を責め始めた人もいる」\n\nそこで僕は言葉を止めた。\n\n雨音がちょうど前方の人群の声を押しつぶした。\n\n「でも、彼を責める人が完全に間違っているとも言えない」\n\n霍鈺はまだ急いで話さなかった。\n\n彼女は傘の柄を反対の手に持ち替え、指の節を柄の縁に少し止めた。\n\n彼女は僕の後ろの言葉を代わりに継がなかった。\n\n「僕は、あの教官が間違っていると思います」\n\n僕は言った。\n\n「昨夜の訓練は、そもそもあああるべきじゃなかった。動画が撤回されたのも変です。グループの通知も……変です」\n\n「でも、ただそれだけを言うと、何かが足りない気がする」\n\n僕はティッシュを握っていた。指先は雨水と汗で少しふやけていた。\n\n「谷懿は自分のためにやったんじゃない。少なくとも、僕はそう思います」\n\n「でも結果として、多くの人があの発言のせいで罰を受けた。怪我をした人までいた」\n\n「だから、どう言えばいいのかわからない」\n\n僕の話し方は途切れ途切れだった。\n\n意見を述べているというより、濡れきったものをポケットから一つずつ取り出して地面に置き、どう並べても整わないことに気づく感じだった。\n\n霍鈺がようやく訊いた。\n\n「彼のこと、嫌い？」\n\n僕は一瞬固まった。\n\n相手は「彼が正しいと思う？」と訊くのだと思っていた。\n\nあるいは「彼が間違っていると思う？」と。\n\nけれど彼女が訊いたのは、嫌いかどうかだった。\n\n自分の呼吸が少し乱れたのが聞こえた。\n\n「嫌いじゃない」\n\n僕は言った。\n\n今回は答えが早かった。\n\n早すぎて、自分でも少し意外だった。\n\n「僕は、彼を嫌いじゃない」\n\nもう一度繰り返した。\n\n「ただ、少し怖いんです」\n\n霍鈺は何も言わなかった。\n\n僕は続けた。\n\n「彼が、本当に間違っていたんじゃないかって」\n\nその言葉を言い終えると、喉に雨水を流し込まれたみたいに少し詰まった。\n\n昨夜のうちに、このことはもう考え終えたつもりだった。\n\nけれど口に出して初めて、それらがまだずっと身体の中につかえていたことに気づいた。\n\n霍鈺が傘の柄を握る指を、ほんの少し強くした。\n\n小さな動きだった。\n\n傘の下の空間が狭くなければ、たぶん気づかなかった。\n\n「私も怖くなるよ」\n\n僕は彼女を見た。\n\n傘の下の音が、ふっと一拍空いた。\n\n「学姐も？」\n\n「もちろん」\n\n彼女は笑った。\n\n「私は無敵じゃないから」\n\nその言葉は雨音の中へ軽く放り込まれたようだった。\n\nけれど彼女は、自分が何を怖がっているのか、それ以上は説明しなかった。\n\n彼女の言葉もそこで止まった。\n\nその先には、雨音と沈黙、あるいは次に会う時だけが残った。\n\n「じゃあ、谷懿は大丈夫なんですか？」\n\n僕はやはり訊いてしまった。\n\n霍鈺はしばらく黙った。\n\n今度の沈黙はさっきより長かった。\n\n長すぎて、彼女は答えないのではないかと思いかけた。\n\n「少なくとも、今あなたが考えているような最悪の結果ではないと思う」\n\n彼女は言った。\n\n「学姐は彼がどこにいるか知ってるんですか？」\n\n霍鈺は雨幕を見た。\n\n「少しだけ」\n\n僕は彼女が続けるのを待った。\n\nけれど彼女は続けなかった。\n\nさらに数歩歩いてから、ようやく一言だけ足した。\n\n「彼はこの数日、軍訓には出ないと思う」\n\n「処分ですか？」\n\n「今はまだ、何とも言えない」\n\nそう言い終えると、傘の下はまた静かになった。\n\n僕はそれ以上追わなかった。\n\n知りたくないからではない。\n\nさっきの霍鈺の間が、彼女が言えるのはたぶんここまでなのだと示していたからだ。\n\n彼女は何かを知っている。\n\nけれど全部は言わない。\n\nそれは少し気になった。\n\nただ、その気がかりは雨音に押さえられ、すぐ疑問にはならなかった。\n\n「学姐」\n\n「ん？」\n\n「僕の今の話、めちゃくちゃだと思いませんか？」\n\n霍鈺は少し考えた。\n\n「少し」\n\n「……」\n\n正直さの到着が早すぎて、僕はその二文字につまずきそうになった。\n\n彼女の目が弧を描いた。\n\n「でも嫌いじゃない」\n\n一瞬、それがこの話を嫌いじゃないという意味なのか、僕という人間を嫌いじゃないという意味なのか、それとも今の、論理もなくぐちゃぐちゃな状態を嫌いじゃないという意味なのか、わからなかった。\n\n普通なら、ここで聞き返すべきだった。\n\n問題は、普通なら僕は霍学姐と一本の傘を分け合って暴雨の中を歩いているはずもない、ということだ。\n\nだから僕は黙ることにした。\n\nその問題は、余白と沈黙に預けた。\n\n雨脚は少しずつ弱くなった。\n\n傘を叩いていた密な音は、途切れ途切れの滴りに変わった。路边の木の葉は洗われて光り、過剰なほど緑で、埃の多い夢から目覚めたばかりみたいだった。\n\n寮の建物が前方に現れた。\n\n立華書院のエントランスには、雨の中から戻ってきた新入生が大勢集まっていた。傘を振る人、服を絞る人、濡れきった軍訓靴に絶望の声を上げる人。\n\n僕たちは階下で立ち止まった。\n\n雨はまだ完全には止んでいなかった。\n\n軒先から水滴が一列に落ち、地面の水たまりはエントランスの灯りを揺れる長い帯に映していた。\n\n「着いたよ」\n\n霍鈺が言った。\n\n僕はそこで初めて、田径場から寮までの道のりが、いつもよりずっと短かったように感じられたことに気づいた。\n\n「ありがとうございます、学姐」\n\n僕は傘の柄を彼女の方へ差し出した。\n\n霍鈺は受け取らなかった。\n\n「持っていて」\n\n「え？」\n\n「雲夢に来たばかりで、まだ傘を買えていないでしょう」\n\n「でも、この傘……」\n\n僕は柄の磨り減って白くなった縁を見た。\n\n「何年も使っているんですよね？」\n\n霍鈺もその傘を見下ろした。\n\n「そうだよ」\n\n彼女は言った。\n\n「だから丈夫」\n\n「そういう意味じゃなくて」\n\nそう言ってから、自分でも少し余計な一言だと思った。\n\n霍鈺は僕を見て、僕が続きを言うのを待っているようだった。\n\n雨はまだ止まず、軒の外の地面は一面光っていた。エントランスでは誰かが濡れた靴を引きずって通り、タイルに粘るような音を立てた。\n\n僕は傘の柄を握り、さらに押し戻すべきか、それとも先に手を離すべきかわからなくなった。\n\n「学姐、この傘、あなたにとって大事なものなんじゃないですか」\n\n彼女の唇がはっきり動いた。\n\nけれどまた、手を傘の柄から離した。\n\n米黄色の古い傘は、完全に僕の手の中へ落ちた。\n\n僕は反射的に握りしめた。\n\n「大事なものも、先に貸すことはできるよ」\n\n彼女は言った。\n\n「じゃあ学姐はどうするんですか？」\n\n霍鈺は答えなかった。\n\nただ日よけの上着のフードを頭にかぶり、僕へ手を振って、まだ降り残る雨の中へ歩き出した。\n\n「霍学姐」\n\n僕は彼女を呼んだ。\n\n彼女は振り返った。\n\n雨が彼女の後ろの地面に落ち、細かな白を跳ね上げていた。\n\n「いつ返せばいいですか？」\n\n霍鈺はただ僕を見ていた。\n\n聞こえたようにも、聞こえなかったようにも見えた。\n\n最後に、彼女は笑った。\n\nそして背を向けて去っていった。\n\n僕は寮の下に立ち、手にその傘を握っていた。\n\n柄の縁は白く擦れていて、握ると少し古びて滑らかだった。傘の内側には色褪せたシールが一つあり、もとは何の図案だったのか、今では淡い輪郭しか残っていなかった。傘骨の一箇所はわずかに曲がっていて、畳む時にたぶん少し引っかかるだろう。\n\nそれは長い年月、人に使われてきた傘だった。\n\n経験してきた雨を一つ一つ、傘骨の中へ収めているみたいに古かった。\n\nけれど僕は、その雨たちの物語をまったく知らなかった。\n\n訊きたいことはたくさんあった。\n\nけれど雨が軒の外から斜めに入り、靴先の前に落ちた。\n\n僕は傘を胸元へ少し抱え直し、ようやく自分がまだ入口に立っていることを思い出した。\n\nポケットの中でスマホが震った。\n\n取り出す。\n\n谷懿ではなかった。\n\n朱銘がA109の小グループに送ったメッセージだった。\n\n【朱銘：レントゲン終わった。問題なさそう。】\n\n数秒置いて、もう一言。\n\n【朱銘：雨いつ止むんだよ、俺ら病院で足止めだ。】\n\n僕はその二つを見て、指を画面の上で止めた。\n\n谷懿のチャット欄には、相変わらず新しい返信がなかった。\n\n【僕：ちょっと待って。寮に戻って傘取って、病院まで迎えに行く。】\n\nメッセージを送ると、朱銘はほとんど即答した。\n\n【朱銘：義父。】\n\n【朱銘：ドア裏の青いやつ、俺の。】\n\n僕はスマホをしまい、その古い傘を差して寮へ入った。\n\nエントランスは騒がしかった。\n\n午後も訓練があるのか話す人、靴が濡れたと文句を言う人、やっと寝られると祝う人。\n\n僕が彼らの横を通ると、傘の面の水が縁を伝い、床に小さな水の跡を残した。\n\nそれらはすぐ、もっと多くの足に踏み乱された。\n\n朱銘の言っていた青い折り畳み傘は、寮のドア裏に掛かっていた。傘袋はくしゃくしゃに丸まっている。\n\nけれどその傘を手に取り、数分後もう一度寮を出ると、天気はまったく違っていた。\n\nさっきまで一面につながっていた雨幕は、誰かに真ん中から裂かれたように途切れ、路面にはまばらな水点だけが残っていた。遠くの木の葉では、水が葉先を伝って落ちている。\n\n僕は軒下で立ち尽くした。左手には朱銘の青い傘、右手には学姐の米黄色の傘。\n\nスマホがまた光った。\n\n【朱銘：？】\n\nその疑問符を見て、僕は少し笑いそうになった。\n\nもう一度顔を上げると、雲の切れ間から陽光がこぼれていた。"},{"title":"第十章：君のために証明する","file":"10、第十章.md","volumeTitle":"第一巻：物語の始まりは平凡すぎるくらいでいい","text":"雨が止んだからといって、雲夢の夏が優しくなったわけではなかった。\n\nそれはただ一時的に刃をしまい、刃の背を人の首筋に当てて、ようやく息がつけるのだと錯覚させただけだった。\n\nけれど翌日、太陽がまた昇ると、グラウンドのゴム製トラックはすぐにむっとするようなゴムの匂いを立て、軍訓服はまた背中に貼りつき、靴底はまた足の裏を固く押し、笛の音はまた遠くから切りつけるように飛んできた。\n\n世界が元の姿に戻る速度は、あの雨など最初から降らなかったみたいに速かった。\n\nもちろん、すべてが元通りになったわけではない。\n\nたとえば、僕の机のそばには米色の傘が一本増えていた。傘骨を畳むと一か所だけ少し収まりが悪く、壁に立てかけられたそれは、雨に置き去りにされた夏の小さな切れ端みたいだった。\n\n谷懿は相変わらず返事をしなかった。\n\n僕と朱銘は最初、微信で訊いていただけだった。最初は「どこにいる」、その後は「生きてたら『1』だけ返せ」に変わった。緑色の吹き出しは画面に止まったまま、壁に掛けられた空のコップみたいに、何の返響も返してこなかった。\n\nそのうち朱銘が耐えきれなくなり、僕を連れて哲学班の男子寮まで訊きに行った。\n\nドアを開けたのは、黒縁眼鏡をかけた男子だった。髪は寝癖でぐしゃぐしゃだった。\n\n「あいつ、もう行ったんじゃないの？」\n\n「行った？」朱銘が訊いた。\n\n男子は部屋の中を振り返った。\n\n「俺たちが戻ってきた日には、机の上がもう空になってた。箱もなくなってたし」彼は言った。「君たちは知ってると思ってた」\n\nベッドカーテンの奥から誰かが顔を出し、付け足した。\n\n「退学になったんじゃない？」\n\nそれに対して、朱銘はかなり楽観的な判断を下した。\n\n「たぶん大丈夫だ」\n\n「根拠は？」僕は訊いた。\n\n「本当に退学なら、ルームメイトの口頭発表だけで済むわけないだろ」\n\nその言葉はかなり筋が通っていた。前提として、この世界自体も筋を通すのであれば。\n\nそしてここ数日の世界は、あまり高い論理素養を見せてはいなかった。\n\n袁林修の脚は完全には治っていなかった。\n\nあの日、朱銘が彼を校医院から連れ戻した時、彼の手には薄い診断書が一枚あった。紙に書かれた文字は多くなく、きれいに印刷されていた。いちばん肝心な一行にはこうあった。激しい運動を減らし、必要に応じて再診することを勧める。\n\nそれだけ見れば、とても思いやりのある医学的助言に見えた。\n\nけれどそれを軍訓場に置いた瞬間、その言葉はすぐにある種の言語の罠へ変わった。\n\nどの程度まで減らせば「減らした」ことになるのか。\n\n激しい運動かどうかは誰が判断するのか。\n\n必要に応じて、の「必要」は誰が必要だと感じるのか。\n\nもしこの世界が読解問題なら、出題者はどうやら標準解答を用意するつもりがないらしい。\n\n袁林修は最初、その紙を張迪のところへ持っていかなかった。\n\nそれは彼が本当にまだ耐えられると思っていたからではない。ただ、「大丈夫」と言い続ける時間が長すぎる人間は、「大丈夫ではない」とどう切り出せばいいのかを忘れてしまうことがある。彼はいつもより少しゆっくり歩き、階段では目立たないように手すりに触れ、訓練前には靴紐を人より長く結び、方向転換の時には足元がいつも半拍遅れた。\n\nそれらの変化は、すぐに人が集まって「大丈夫か」と訊くほどではなかった。\n\nだから朱銘も、毎日追いかけて訊いたりはしなかった。\n\n彼はただ、階段を降りる時に少しだけ歩調を落とし、水を汲む時に袁林修のコップもついでに持ち、あるいは袁林修が訓練用品を運ぼうとして腰をかがめた時、先にそれをひょいと持ち上げた。口ではまだ、わざと嫌そうに言う。\n\n「勘違いすんなよ。単純にお前の荷物運びの効率が見てられないだけだからな」\n\n袁林修はたいてい一文字だけ返した。\n\n「ああ」\n\nそれからコップを受け取り、短く「ありがと」と言った。\n\n三日目の午前、訓練内容は正歩と隊列の方向転換になった。\n\n太陽はもう雲の後ろから顔を出していた。地面の水気はすっかり干上がっている。隊列は何度も左へ、右へ、後ろへ向きを変えた。靴底がトラックに落ちる音は、整っているのに妙に苛立たしかった。\n\n袁林修が最初に半拍遅れた時、張迪はただ彼を見ただけだった。\n\n二度目、眉をひそめた。\n\n三度目、彼は直接笛を吹いた。\n\n「止まれ！」\n\nC軍陣全体がその場で止まった。\n\n笛の音がまだ耳の奥で痺れている。\n\n張迪は袁林修の前まで歩いてきた。靴がトラックを踏む音は重くない。それなのに一歩ごとに、周囲の呼吸を押さえつけるようだった。\n\n「号令が聞き取れないのか、それとも脚が自分のものじゃないのか？」\n\n袁林修は少し背筋を伸ばした。\n\n「報告、脚を少し痛めています」\n\nその言い方は大きくもなく、弁解しようとする響きもなかった。まるで小さな事実を差し出して、相手が一目見てくれればそれでいい、とでもいうようだった。\n\n張迪は笑った。\n\n「脚を痛めた？」\n\n彼はその二文字を繰り返した。馬鹿げた言い訳を復唱するような口調だった。\n\n「さっき走ってきた時はどうして言わなかった？　整列した時はどうして言わなかった？　動作を間違えてから脚が痛いと言うのか？」\n\n隊列の中で、誰も声を出さなかった。\n\n僕はすぐそばに立っていて、袁林修の指がズボンの縫い目の横で一度動くのが見えた。彼はポケットに手を入れようとしたようで、途中で止めた。\n\nあの診断書は彼の身にはなかった。\n\n後になってわかったことだが、彼はその紙を寮の机の本の下に挟んでいた。本当に耐えられなくなったら出せばいい、ただそう思っていただけだった。けれど人間というものは、本当に耐えられなくなる前に、たいていもう少し耐えてしまう。\n\nこれはたぶん、人類が誇るべきではない自壊技能の一つだ。\n\n「教官、彼は数日前に校医院へ行っています」\n\n朱銘が口を開いた時、その声は普段より低かった。\n\n張迪が彼を見る。\n\n「君に聞いたか？」\n\n朱銘は口を閉じた。\n\n肩が一度動いた。何かを押し返しそうになったのだと思う。李向陽が後ろから、彼の腕を短く押さえた。\n\nその動きは短かった。\n\n張迪が気づかないほど短かった。\n\n「全員、よく見ておけ」\n\n張迪は向き直り、声を少し上げた。\n\n「訓練場で一番問題なのは動作が遅いことじゃない。遅いなら練習すればいい。一番問題なのは態度が正しくないことだ。理由を探し、言い訳を探し、何かあればすぐ体調が悪いと言う」\n\n袁林修の顔色は少し白かった。\n\n大げさな蒼白ではない。太陽に長く晒された後、血の色がゆっくり皮膚の奥へ退いていくような白さだった。\n\n張迪は彼を列から出させ、ひとりで十回方向転換をさせた。\n\n七回目の時、袁林修の足元が明らかに揺れた。\n\n朱銘の手が握りしめられた。\n\n彼が歯の隙間から、ごく低い罵りを漏らすのが聞こえた。\n\nこの時、李向陽は言葉遣いを直さなかった。\n\n昼休み、朱銘はほとんど袁林修を連れて寮へ戻った。\n\n正確には、引きずってはいない。彼は袁林修の腕に触れず、ただ隣を歩き、速度をとてもゆっくりにしただけだった。\n\n袁林修は机からあの診断書を取り出した。紙の端には、本の角に押されてできた折れ目があった。\n\n彼はその紙を二秒ほど見つめ、最後に二つ折りにしてポケットへ入れた。\n\n李向陽が言った。\n\n「写真を撮って保存しておいた方がいい」\n\n袁林修が顔を上げて彼を見た。\n\n李向陽は説明した。\n\n「紙はなくしやすい。後で欠席届、再診、輔導員への説明、どれにも使う可能性がある」\n\nけれど午後、診断書を張迪に出した時、彼はその紙を持ち、「激しい運動を減らすことを勧める」という一文を一字一句読んだ。\n\n「よく見ろ。減らすことを勧める、であって、訓練しなくていい、ではない」\n\n声には相変わらず威厳があった。\n\n「今後、動作は少し遅くてもいい。だが、これを言い訳にするところは二度と見せるな」\n\nその言葉が落ちた時、隊列の中で何人かが低頭した。\n\n自分の靴先を見ていたのか、それとも袁林修の代わりに腹を立てていたのか、僕にはわからない。\n\n袁林修はただその紙をもう一度折り、ポケットへしまった。\n\n折り目は、さらに深くなった。\n\n……\n\n夕方、訓練はようやく一時的に解散となり、食事の時間になった。\n\n食事と言っても、夜訓の集合まではあまり時間が残っていない。それでも、太陽に一日中炙られた人間にとって、食堂に座って空調の風に当たれるだけで、どこか非現実的な富裕感を覚えるには十分だった。\n\n朱銘は食堂の入口で、短い感想まで述べた。\n\n「早く飯を入れようぜ」朱銘は窓口を見つめた。「あと五分遅れたら、食堂のおばちゃんに『母さん』って叫ぶところだった」\n\n「その親族関係、かなり混乱してない？」僕は訊いた。\n\n「腹が減ると人はそうなる」朱銘は言った。「飯くれる人はみんな身内だ」\n\nそう言い終えると、彼はトレーを持って窓口へ直行した。その動きは、前線から撤退してきた補給兵みたいに素早かった。\n\n袁林修は僕たちと窓口を奪い合わなかった。\n\n彼は通路に近い席に座り、脚をテーブルの内側へ少し引っ込めた。朱銘が戻ってくる時、ついでのように氷水を一本、彼の前に置いた。\n\n「一本多く取った」\n\n「頼んでない」\n\n「自販機が詰まった」朱銘は表情を変えずに言った。「どうしても俺に吐き出したかったらしい」\n\n袁林修は彼を一目見て、最後にキャップを開けた。\n\n李向陽は座ると、まずスマホを一度見た。\n\n「今夜、寮検査があるかもしれない」\n\nその一言は、食堂の空調より効果があった。\n\n朱銘の口の中のご飯が止まった。\n\n「かもしれない？」\n\n「尹先輩が、今夜男子寮の内務を抽查するって言っていた」李向陽は言った。「どの部屋を見るかはまだわからない」\n\n「なんで知ってんの？」\n\n「聞いた」\n\n李向陽の答えは自然だった。まるで、さっき食堂のおばちゃんに今日のスープに塩が入っているか訊いてきた、とでも言うように。\n\n「そこまで聞く？」\n\n「事前に情報があれば、面倒をかなり減らせる」李向陽は言った。「特に、準備していなければ確実に問題が出るタイプの検査は」\n\nそれは小賢しさというより、学ぶ価値のある生活の知恵に聞こえた。\n\n僕が箸を土豆絲へ伸ばしたところで、スマホの画面が光った。\n\n送信者は霍鈺だった。\n\n【霍学姐：ご飯、食べられた？】\n\nこの数日、僕たちは時々やり取りをしていた。\n\nとはいえ、チャット履歴を上へ辿っても、たいてい一、二言で途切れている。\n\n時々、彼女も短い注意を送ってきた。\n\nたとえば、どの棟の階段が少しわかりにくいとか。\n\nたとえば、食堂の二階は人が少なめだとか。\n\nそういう言葉は画面の上に落ちると、どれも半分だけ言われたみたいに見えた。残りの半分は、スマホの中にはなかった。\n\n【僕：食べてます。】\n\n朱銘が覗き込んできた。\n\n「誰と話してんの？　表情が軍訓被害者っぽくないぞ」\n\n僕はすぐにスマホを自分側へ少し寄せた。\n\n「友達」\n\n言ってから、自分の方が一瞬止まった。\n\n友達？\n\nそこまで言える関係には、まだ全然届いていない気がする。僕たちはただ傘を借り、雨の中を少し一緒に歩いただけだ。\n\nけれど、あの言葉は何だったか。\n\n今生もし同じ雪に濡れたなら、この一生も共に白髪になったと数えよう。\n\n僕は慌ててその考えを切り落とした。\n\n「ほう」朱銘は語尾を長くした。「友達ねえ」\n\nこの「ほう」一字に含まれる意味は豊かすぎて、非物質文化遺産を申請できそうだった。\n\n僕は相手にしなかった。\n\nスマホがまた震えた。\n\n【霍学姐：そうだ、今夜男子寮の内務検査があるかもしれない。】\n\n【霍学姐：夜訓から戻ったら、部屋は少し片づけておいた方がいいよ。】\n\nどうやら李向陽が聞いたのは無駄ではなかったらしい。\n\n僕は反射的に自分の本棚を思い浮かべた。\n\n数冊の物理教材、数冊の歴史、哲学、マルクス主義関係の古い本。\n\n報到点で尹淵が僕を見た時の目が、また頭に浮かんだ。\n\n【僕：了解です。】\n\n【僕：でも、どうして入学したばかりで寮検査なんですか？】\n\n【霍学姐：説明しにくい伝統って、あるんだよ。】\n\nその一文はチャット欄に止まった。\n\n食堂はうるさかった。窓口の方では番号を呼ぶ声があり、隣のテーブルでは椅子が引かれて耳障りな音を立てた。\n\n食べ終えると、僕たちはまたグラウンドへ戻った。\n\n夜訓は、昼間あんなことがあったからといって軽くはならなかった。照明がゴム製トラックを照らし、人の影は短く伸び、笛の音が夜色を切り裂いて飛ぶ。昼に炙られた熱気はまだ地面に貼りつき、簡単には散ろうとしなかった。\n\n隊列がようやく解散した時、時刻はもう九時近かった。\n\nA109へ戻ると、部屋の空気はすでに戦備状態に入っていた。\n\n李向陽はスマホを机に置き、メモアプリを開いて、要求を一つずつ読み上げた。\n\n「机上は整潔。寝具は整っていること。床に目立つゴミなし。ゴミ箱にゴミを入れたままにしない。ベランダに雑物を積まない。電源タップを乱接しない」\n\n「ちょっと待って」朱銘が手を挙げた。\n\n「何」\n\n「ゴミ箱にゴミを入れるなって、飯碗に米を入れるなって言ってるのと同じじゃない？」\n\n李向陽は彼を一目見た。\n\n「検査の人が帰った後で、またゴミを戻せばいい」\n\n「じゃあゴミ箱も屈辱に耐えることを学ばなきゃいけないわけだ」\n\n「望むなら、『ゴミ箱の異化について』という文章を書いてもいい」\n\n朱銘は一瞬固まった。\n\n「李哥、今のそういう返しまでできるようになったの？」\n\n李向陽は二つ目の冗談には乗らなかった。\n\nもう腰をかがめて電源タップを整理し始めていた。\n\n僕は本棚の何冊かを下ろし、まとめて紙箱へ入れた。\n\n終えると、本棚には急に一部分だけ空きができた。そこには色の少し薄い埃の跡だけが残っている。\n\n朱銘は僕の紙箱を見て、少し驚いた。\n\n「それも片づけるの？」\n\n「机上整潔」と僕は言った。\n\n「それ本棚だろ」\n\n「広義の机上」\n\n朱銘は少し沈黙した。\n\n「今夜は狭義の検査であることを祈る」\n\n袁林修は椅子に座り、自分の机を片づけていた。動作は僕たちより少し遅かったが、誰にも手伝わせなかった。朱銘が彼のそばを通る時、床の雑巾を足でそっと押して渡した。\n\n「座って机の脚でも拭いとけ。しゃがむな」\n\n袁林修はその雑巾を見た。\n\n「机の脚も見るのか」\n\n「見ない」\n\n「じゃあなんで拭く」\n\n「見てて気に食わない」\n\n袁林修は低頭して机の脚を一度拭いた。\n\n「じゃあ、光栄だな」\n\nそれはたぶん、袁林修がここ数日で言った中で、もっとも冗談に近い一言だった。\n\nけれどその軽さは長く続かなかった。\n\n一時間後、A109は見違えるほどきれいになった。\n\n床はモップがけされ、寝具は標準からは遠いが少なくとも努力は見える四角形になり、机上にはパソコン、スタンド、水杯、そしてどうしても存在しなければならない少数の物だけが残された。ゴミ箱は空にされ、ドアの横にぽつんと立っていた。まるで本来の職務を剥奪された退職幹部みたいだった。\n\n朱銘は椅子に崩れ落ちた。\n\n「今わかった。寮検査の本当の意味は、衛生を見ることじゃない」\n\n「何なの？」僕は訊いた。\n\n「大学生に、表面工程も工程であると早めに理解させることだ」\n\n李向陽は最後の充電ケーブルを巻いていた。\n\n「少なくとも表面工程は、部屋を少しは快適に見せる」\n\n「それは認める」朱銘は言った。「でも同時に、俺の魂はゴミ箱事件に傷つけられた」\n\nその時、ドアの外でノックの音がした。\n\nコン、コン、コン。\n\n強くはない。\n\nそれでも部屋の全員が一瞬静かになった。\n\n「寮検査です」\n\n李向陽が立ち上がってドアを開けた。\n\n外に立っていたのは、背の高い先輩だった。手には採点表を持っている。その後ろに、もう一人。\n\n尹淵。\n\n彼は簡素な白いシャツを着て、袖口を前腕までまくり、胸には班導証を下げていた。軍訓場の端では、彼はいつも木陰に立ち、隊列との間に距離を置いていた。今、ドアは開いている。その距離はもうなかった。\n\n背の高い先輩が先に入ってきた。\n\n「かなり整ってるね」\n\nその声には少し意外そうな響きがあった。彼は李向陽の机の前へ行き、指で机の縁をなぞり、それから低頭してゴミ箱を見た。\n\n「机上に埃なし。床もまあいい。ゴミ箱……にもゴミなし」\n\n朱銘の表情は、「今すぐ何か言いたい」と「今は絶対に言ってはいけない」の間で反復横跳びしていた。\n\n背の高い先輩はさらに寝具を見て回った。\n\n「ベッドもまあ悪くない。君たち、事前に検査を知ってた？」\n\n答えにくい質問だった。\n\nなぜなら答えは明らかに、はい、だからだ。\n\nけれどそのまま認めると、今回の努力が少し純粋でなく見えてしまう気もする。僕たちは衛生を愛していたのではなく、採点制度に屈しただけだと。\n\n実際、その通りなのだが。\n\n「知りませんでした」\n\n李向陽の返事は早かった。\n\n声には、ほどよい疑問さえ含まれていた。\n\n「軍訓から帰ったばかりで部屋が乱れていたので、ついでに片づけただけです」\n\n背の高い先輩は彼を見た。まるで「それを俺が信じるとでも？」と言いたげだった。\n\n尹淵が笑った。\n\n「小林、基準通りに採点すればいい」\n\n小林と呼ばれた先輩は肩をすくめ、表に何かを書き込んだ。\n\n尹淵の視線が、部屋の中をゆっくり流れた。\n\n彼は急いで話さなかった。\n\nその方がかえって不快だった。\n\n彼の目は、ほとんど空になった朱銘の机から、袁林修の椅子の背に掛けられた軍訓服へ移り、李向陽の整った資料ファイルから、最後に僕の本棚へ落ちた。\n\nそこには一部分、空きがあった。\n\n尹淵は半秒止まった。\n\n「準備がいいね」\n\n彼は言った。\n\nその言葉は褒めているように聞こえた。\n\n聞こえただけだった。\n\n彼が何を見抜いたのか、僕にはわからない。もしかするとただの一言だったのかもしれないし、そもそも本には興味がなく、人に「見透かされた」と思わせるのが好きなだけなのかもしれない。\n\n「内務は最も基礎的なものだ」尹淵は視線を戻し、自然な口調で言った。「寮をきちんと整えられるということは、少なくとも基本的な実行力があるということだ」\n\n小林は隣で採点していた。\n\n尹淵は続けた。\n\n「ただし立華書院が見るのは、もちろん実行力だけではない」\n\nその一言が出た瞬間、李向陽は水杯を片づける手を止めた。\n\n袁林修も少し目を上げた。\n\n尹淵はようやく適切な始まりを見つけたように、部屋の中央に立ち、わずかに体を傾け、僕たち全員に向き合った。\n\n「君たちが立華書院に入れたということは、高考で一度、自分を証明したということだ。だが過去の証明は、過去のものにすぎない」\n\nこの言葉は聞いたことがあった。\n\n軍訓動員会で、彼は似たようなことを言っていた。\n\nけれど講堂で聞くのと、寮の部屋で聞くのとでは、まったく違った。前者は放送みたいだった。後者は、目の前に差し出された請求書みたいだった。\n\n「書院には毎年考核がある」尹淵は言った。「資源が多い分、要求も当然高い。ここの学習リズムに適応できなければ、普通専業班へ調整される」\n\n朱銘が思わず背筋を伸ばした。\n\n「調整？」\n\n「淘汰、と理解してもいい」\n\n尹淵は平静に言った。\n\n平静すぎて、「淘汰」という言葉が具体的な学生の身に落ちるものではなく、ただ表の中で筛选できる項目の一つであるかのようだった。\n\n「往年の状況を教えておこう」\n\n「一つ上の二〇級では、毎年の末位淘汰率は二十パーセント。基準は一年を通じた専門課の成績だ」\n\n「僕たち一九級も淘汰率は二十パーセント。さらに規定が一つある。どの専門課であれ、一科目でも落とせば直接淘汰される」\n\n尹淵は淡々と話していた。まるで彼には関係のないことを述べているだけのようだった。\n\n実際、関係ないのだろう。たとえ淘汰率が半分にまで広がっても、成績が常に上位の尹淵に何の関係があるというのか。\n\n部屋は静かになった。\n\n誰もが彼のように気にせずいられるわけではない。\n\n僕たちにとって、大学の学習内容はまだ完全な未知だ。そして立華書院に入って同級生になれるほどなのだから、お互いの高考成績や学力に大きな差があるとは考えにくい。同じスタートラインから始まる長距離走で、誰が最後尾に落ちてもおかしくない。\n\nまして「一科目でも落とせば」という赤線が加わるなら、少しの不注意で全てを失う可能性がある。\n\nそして、いわゆる同じスタートラインは、僕にとっては成立していなかった。\n\n雲夢師範大学立華書院に合格したのは、もう一人の姜嵐であって、僕ではない。では僕は？　思いつく限りの加点項目を全部重ねても、入学点には到底届かない。\n\nもともと、姜嵐の代わりに無事大学を読み終え、学業を修了できるのか、僕には自信がなかった。そこへ淘汰制まであると知った今、僕はもう淘汰される運命なのではないか。\n\n空調はまだ冷風を送っていた。拭いたばかりの床には少し水気があり、絞りきれていないモップの匂いが空気に混じっている。\n\n「高数と力学は、君たちの一学期で最も重要な二科目だ」尹淵は言った。「特に高数は、毎年落とす人がいる。普通の学生なら、落としても補考や再履修で挽回する余地がある。だが書院では、許容される失敗はかなり少ない」\n\n彼は脅そうとしているわけではなかった。\n\nそれこそが一番怖かった。\n\n彼はただ、穏やかに規則を語っている。\n\n規則そのものが、すでに十分冷たかった。\n\n「もちろん」尹淵はふいに笑った。「本当に基礎のある学生にとっては、これらの内容を過度に心配する必要はない。たとえば物理競賽生なら、高校段階で触れてきた訓練の難度は、大一の基礎課より高いことが多い」\n\n彼の目が僕に落ちた。\n\n心が軽く沈んだ。\n\n「姜学弟、実は僕たちは少し縁がある。どちらも物理競賽に参加したことがあり、会場も同じ庐州一中だった」\n\n来た。\n\n「淵哥、この学弟とは同郷なんですか？」\n\n隣の小林が訊いた。\n\n「姜学弟も安徽人だと知ったのは数日前だ。安徽のどこかまでは、まだ聞いていない」\n\n尹淵は僕の机の前まで歩いてきた。姿勢は相変わらず力が抜けている。\n\n「徽州です」\n\n「なるほど、江南水郷か。いいところだね」\n\n尹淵はまず感嘆した。\n\n「ただ、僕は皖北の出身だから、この『同郷』は少し無理があるかな」\n\n安徽は地理的な省というより、純粋な行政区画に近い。\n\n大きな六角形の省は、長江と淮河によって三つに分けられ、生活や文化習慣の大きく異なる三つの地域を形成している。尹淵の出身である皖北は淮河以北で、生活習慣は河南に近い。一方、僕の故郷である皖南は、むしろ蘇杭に近い。\n\nだから、尹淵の口にする「同郷」に、僕は少しも親しみを感じなかった。\n\n「僕が参加したのは第三十五回全国物理競賽。姜学弟が参加したのは第三十七回だろう？　残念ながら僕は力不足で、省三等賞しか取れなかった。君の省二には遠く及ばないよ」\n\n「省二？」\n\n朱銘も僕を見た。\n\nその表情は疑いではなく、何か隠し設定がシステム公告で明かされた時の驚きに近かった。\n\n尹淵はさらに「親切に」周囲へ説明した。\n\n「毎年まず予選があり、全省百万の学生の中から物理分野の優秀者二千名余りが選ばれる。その人たちだけが本選に参加する資格を得る。そしてこの二千人の中で、前八百名に入れば省三等賞、前三百名に入らなければ省二等賞には届かない」\n\n「答案の点数に反映すれば、省二の平均点は省三の何倍にもなる」\n\n彼はとても自然に言った。まるで本心から僕のために箔をつけているようだった。\n\nけれど僕にはずっと、彼の袖の中に針が隠れている感じがしていた。\n\nそして僕の第六感は外れていなかった。尹淵の燕国の地図から、ついに匕首が現れた。\n\n「ただ、姜学弟が参加したその年は、競賽にかなり黒幕があったと聞いている」尹淵は言った。「もちろん、ただ聞いただけだ」\n\n部屋の音が一気に低くなった。\n\n小林は僕を一目見て、すぐに視線を採点表へ戻した。\n\n僕は椅子の背を握ったまま、何も言わなかった。\n\n「本来なら国家のためにトップ人材を選抜し、ごく少数の天賦ある学生へ機会を与える、一挙両得の制度だったはずなのに」尹淵は独り言のように嘆いた。「金玉其外、敗絮其中の酒囊飯袋どもに虚名を占められるとは、本当に惜しい」\n\n「姜学弟、こういう人たちは憎むべきだと思わないか？」\n\n僕を含め、現場にいる全ての知能が原核生物を超えている者なら、尹淵の言外の意味は聞き取れた。\n\n「もちろんです」\n\n受け身で縛られるくらいなら、彼の陰陽怪気をこちらから突き破った方がいい。\n\n「尹学長は、僕が黒幕で賞を取ったと疑っているんですか？」\n\nけれど尹淵は、わかっていながらわからないふりをした。相変わらず学長が学弟を気遣うような口調で続ける。\n\n「もちろん、姜学弟の能力を疑っているわけではない。ただ何となく言っただけだよ」\n\nそれから彼は話を変えた。\n\n「最近、力学関連の論文を読んでいてね。本文中にある公式があって、いくら推演してもどうしても理解しきれない。高校で競賽を学んでいた頃に、似たような物理模型を見た気がするんだ。姜学弟、時間があれば一緒に研究してくれないかな？」\n\n彼はスマホを取り出し、何度か操作した。\n\n「もし空いていれば、見てくれると助かる」\n\n僕は彼を見た。\n\nスマホの画面が彼の手の中で光っている。\n\n「尹学長、論文を送ってください」\n\n自分がそう言うのが聞こえた。\n\n声は思っていたより少し落ち着いていた。\n\n本当に、少しだけ。\n\n尹淵は眉を上げた。\n\n「軍訓中で疲れているだろう。無理しなくていい」\n\n「大丈夫です」僕は言った。「軍訓が終わる前に返します」\n\n言い終えてから、自分が締切を与えてしまったことに気づいた。\n\n「それなら、姜学弟にお願いするよ」\n\n尹淵は満足そうに頷いた。\n\n小林の方も採点を終えていた。\n\n「A109、優秀」\n\n「ほかの部屋も見に行くので、長居はしないよ。また機会があれば」\n\n尹淵と小林が出ていくと、李向陽がドアを閉めた。\n\n部屋はまた静かになった。\n\n空調の吹き出し口が安定した音を立てている。寮検査を迎えるために整えた水杯、スタンド、ファイルはまだ元の場所にあり、整いすぎて少し見慣れなかった。\n\n尹淵が去った後、ずっと黙っていた朱銘がついに我慢できずに訊いた。\n\n「姜嵐、さっき尹淵が言ってた黒幕って……どういうことなんだ？」\n\n僕が口を開く前に、いつも落ち着いている李向陽まで一言続けた。\n\n「疑っているわけじゃない。ただ、競賽は僕たち普通の高考生には確かに遠いものだし、実情もよく知らない」\n\n僕はすぐには答えなかった。\n\n重生してからの一か月あまり、僕は「もう一人の姜嵐」がいったい誰なのかを知るために、いろいろなものを調べ、いろいろなものをめくった。\n\n証書、古い草稿本、保護者グループで教師が送った祝いのメッセージ、それからスマホに残っていたいくつかのチャット履歴。\n\n僕はネットでも、その年の物理競賽を検索した。開催地、実験問題、庐州一中、そしていくつかの重点中学の名前。見つかるものは完全ではなかった。タイトルだけ残っている投稿もあり、真偽のわからないスクリーンショットもあり、最後には互いにレッテルを貼り合うだけになっている議論もあった。\n\n僕が知っているのは、一本の完全な記憶ではない。\n\nむしろ、多くの破片をどうにか継ぎ合わせたものに近い。公開資料が輪郭を与え、古いチャット記録が細部を与え、時折よぎる映像は、その冷たい文字を苦しくする役割だけを担っていた。\n\n「あの年の全国物理競賽は、安徽が主催だった」僕は言った。「命題組には科大の教授がいた」\n\n朱銘は眉をひそめた。\n\n「つまり、問題漏洩？」\n\n「違う」僕は首を振った。「漏洩はリスクが大きすぎるし、馬鹿げている。本当に厄介なのは、多くのことが漏洩なんて必要としないことだ」\n\n李向陽が少し目を上げた。\n\n「出題傾向？」\n\n「だいたいそう」\n\n僕は椅子を少し後ろへ引き、座った。\n\n「競賽は高考と違う。高考には少なくとも厳格な命題、秘密保持、回避制度がある。競賽はそこまで単純じゃない。特に省内復賽、集訓、決賽選抜の段階になると、学校、教授、重点中学の関係がかなり複雑になる」\n\n朱銘は真剣に聞いていた。\n\n彼にとってはたぶん新鮮なのだろう。\n\nたいていの普通高校生にとって、競賽への理解は「成績がものすごくいい人たちが、読めない問題を解いている」程度で止まっている。\n\n「庐州のいくつかの重点中学は、科大とずっと近い関係にある」僕は言った。「教授の中には、中学生の競賽トレーニングに直接関わっている人もいる。彼らが普段何を訓練していて、何が得意で、何が弱いかを知っている。出題の時に少し傾けるだけで、特定の学校に大きな有利を与えられる」\n\n「それも黒幕って言えるのか？」朱銘が訊いた。\n\n「単に作風が少し偏っているだけなら、言い切るのは難しい」李向陽が言葉を受けた。「命題者には必ず自分の偏好がある。本当の問題は、その偏好が長期的かつ安定して特定の数校へ向かうなら、それは選抜上の優位になるということだ」\n\n朱銘は彼を見た。\n\n「李哥、俺より詳しそうに聞こえるぞ」\n\n「論理に沿って考えているだけだ」李向陽は言った。\n\n僕は頷いた。\n\n「競賽は高考と違って、公平性や秘密保持がそこまで規範的で厳格ではない。しかも教授たちの子女、あるいは同僚の子女の中には、参賽選手が少なくない……」\n\n「問題を漏らす必要なんてどこにもない。多くの科大教授の子どもの人生は、生まれた時から父母によって『庐州重点小学、重点中学、科大』というルートに設計されている」\n\n「それがあまりにも順調に進むのは、庐州の重点中学が早くから科大と同じ枝に結ばれていて、教授の中には庐州の中学生競賽を直接担当している人さえいるからだ」\n\n「命題組は、彼らの子どもがいる学校の競賽カリキュラムや重点をよく知っている。出題の時に少し偏らせるだけでいい。たとえ見抜かれても、これは自分たちの出題スタイルだと言い張れば、どこへ訴えればいい？」\n\n「だからこの手のことは一番処理しにくい。漏洩だと言えば、漏洩ではない。公平だと言えば、それも違う。優遇された側は、自分が優遇されたことを知らなくてもいい。いつも通り訓練し、いつも通り試験を受ければ、優位を手にできる」\n\nそこまで言うと、周囲の全員が息を呑んだ。\n\n「つまり……その年の競賽の受賞者は、庐州市のあのいくつかの重点中学の学生が多かった、ってこと？」\n\n「省内復賽だけじゃない」\n\n「最後の全国決賽では、全国各地の若い学生が庐州に集まり、庐州一中で理論と実験の二つの試験を受けた。そのうち実験試験の主要内容の一つは、あるガラスの屈折率を測定することだった。誰も予想していなかったのは、それが規定時間内には絶対に終わらない実験だったということだ」\n\n「終わらない？　どういう意味だ？」\n\n「その実験は何度も測定し、大量のデータを記録する必要があった。正常な手順でやれば、途中がどれほど順調で一歩も間違えなくても、データ量が膨大すぎて時間切れになる。けれど庐州の受験生は、試験場で形だけやればよかった。なぜなら、そのガラスの屈折率を、彼らの先生はもう一人ひとりに丸暗記させていたからだ」\n\n「マジかよ！」朱銘は思わず罵った。「そんな露骨に不正するのか？」\n\n「命題組が自分の子女をえこひいきし、ついでに地元受験生を優遇するのは、物理競賽が始まって以来の黙認された伝統でもある。ただ、庐州の時はやりすぎた。だからいわゆる『黒幕』が暴かれた」\n\n「その後は？」袁林修がふいに訊いた。\n\n「処理されたのか？」\n\n「うやむやになった」\n\n朱銘は二秒ほど固まった。\n\n「クソが」\n\nその二文字は粗かった。\n\nけれどあの瞬間、それはどんな文明的な言葉より正確だった。\n\n李向陽は罵らず、ただ椅子の背にもたれ、沈黙した。\n\n「じゃあ、お前のその年は……」朱銘は途中で止めた。\n\n彼が何を訊きたいのか、僕にはわかった。\n\nもしその年に黒幕があったなら、姜嵐は黒幕によって利益を得たのか、それとも黒幕によって害を受けたのか。\n\n「もしあれがなければ、もっと先へ行けたはずだ」僕は言った。\n\nその声は小さかった。\n\nまるで自分自身のことを話していないみたいに。\n\n実際、そうなのだ。\n\n僕はただ、いくつかの映像を思い出した。成績発表のページ、混み合う教室、肩を叩く先生の手。それから、一人の少年が廊下の端に立ち、低頭してスマホを見ている。顔にはあまり表情がない。\n\n悲しくなかったわけではない。\n\nむしろ、世界が自分に公道を与えないことを、とうに知っていたように見えた。\n\nスマホが震えた。\n\n尹淵からPDFが送られてきた。\n\nファイル名は英字、数字、アンダーバーが連なった冷たい文字列で、チャット欄に横たわっていた。\n\n僕は開いて一目見た。\n\n大量の英語が画面に押し寄せ、その間に密密麻麻とした公式が挟まっている。アルファベット、上下付き文字、ギリシャ文字、積分記号が並び、外来者を歓迎しない暗号のようだった。\n\n一ページ目のタイトルには、なんとか読める単語がいくつかあった。\n\nSwinging up a pendulum。\n\nその後ろにはもっと長いタイトルがあり、spacecraft、trajectoryのような単語も見えた。\n\n「これ、本当にわかるの？」朱銘が覗き込み、表情を急に厳粛にした。「俺はタイトルの時点で、こいつに知り合いと思われたくない」\n\n「僕もわからない」僕は言った。\n\nその言葉を聞くと、朱銘の表情はかえって少し緩んだ。\n\n「じゃあ、ゆっくり見ればいいだろ」彼は言った。「尹淵だって今夜中に宿題回収しに来るわけじゃないし」\n\n李向陽が時間を見た。\n\n「軍訓終了まで、あと四日」\n\nありがとう。\n\nそこまで明確にカウントダウンしなくてもいい。\n\n「草稿紙、要る？」\n\n袁林修が突然訊いた。\n\n僕は一瞬固まった。\n\n「たぶん要る」\n\n袁林修は引き出しから未開封の草稿本を一冊取り出し、僕の机に置いた。\n\n「一冊多く買った」\n\nそう言うと、彼は自分の物を整理する方へ戻った。\n\nその言い方は耳に覚えがあった。\n\nさっき朱銘が置いた「一本多く取った」水と同じだった。\n\n僕は同じように、それを見破らなかった。\n\nその草稿本をパソコンのそばに置き、スマホのPDFをパソコンへ送った。\n\n画面が明るくなり、片づけられたばかりの机に白い光が映った。机がきれいすぎるせいで、草稿本、数本のペン、そして画面上の英語論文が、かえって妙に浮いて見えた。\n\n椅子に座って、ふと気づいた。尹淵が残していったのは、一問の問題ではない。\n\n歩ききらなければならない道だった。\n\nもし僕が何もしなければ、明日も、明後日も、その次の日も、「黒幕で賞を取った」という影はずっと僕について回る。\n\nそして、本当に省二を取った姜嵐にもついて回る。\n\n「とりあえず、やってみる」僕は言った。\n\n朱銘は何か言いかけたが、最後には僕の椅子の背を軽く叩いただけだった。\n\n「うん。わかんなくても無理して徹夜すんなよ。呼べ」\n\n「呼んで役に立つ？」\n\n「少なくとも一緒にわからないことはできる」朱銘は言った。「人数が多いと、陣容が立派に見える」\n\n僕は少し笑いそうになった。\n\nけれどパソコン画面の公式は、すぐにその笑いを押し戻した。\n\n……\n\n時計の針がゆっくり「12」を過ぎた。\n\n夜は低く垂れ、窓の外では木影が揺れ、蝉の声が続いていた。けれど僕には、その静けさを味わう余裕などなかった。\n\n英文論文は画面の左側に開かれ、右側には作ったばかりの空白文書がある。草稿紙には乱れた記号が数行書かれ、すぐに線で消された。\n\n夏の終わりの夜、パソコン画面の弱い光が、同じように弱い蝉の声の中に沈んでいた。\n\nペン先が草稿紙を走り、「さらさら」という小さな音を立てる。それが伴奏のようだった。\n\n空調は時折かすかに震え、寮の中ではほかの人たちの呼吸が少しずつ安定していった。\n\n僕はペンを握り、乾き始めた目を強く瞬かせた。意識がふいに、少しぼやけた。\n\n窓の外の蝉の声が、急に近くなった。\n\n雲夢の寮棟の下にある数本の木の蝉ではない。\n\nもっとずっと昔、熱気に押し下げられた夏の夜、工場の外で喉を枯らすように鳴いていた、あの音に近かった。\n\n接触の悪い蛍光灯。\n\n向かいの誰かが何かを話している。\n\n声は低く、機械音に押し潰されて途切れ途切れだった。\n\n彼女の顔は見えない。ただ、目の前の小さな机に散らばった数枚の紙と、その上で何本もの線が交わっているのだけが見えた。\n\n蛍光灯がもう一度ちらついた。\n\nその声は机の向こう側から聞こえたようでもあり、僕がペンを握る指の中から聞こえたようでもあった。\n\n僕ははっと我に返った。\n\nペン先はまだ草稿紙の上にあり、インクが同じ場所に滲んで小さな黒い点を作っていた。\n\n窓の外では、蝉の声が変わらず続いていた。"},{"title":"第十一章：君のために証明する（下）","file":"11、第十一章.md","volumeTitle":"第一巻：物語の始まりは平凡すぎるくらいでいい","text":"それからの二日間、昼の僕は張迪のもので、夜の僕は尹淵が送ってきたあの論文のものだった。\n\nこう言うと、聞く者は悲しみ、聞いた者は涙する時間管理術のようである。昼はグラウンドで立正、休め、跨立を繰り返し、夜は英文論文と草稿紙に頭から突っ込む。物理法則がぎっしり詰まった公式の隙間から僕に啓示を与えるより先に、僕の方がニュートンと軍訓服に連名で成仏させられそうだった。\n\n幸い、元の姜嵐が残してくれたものは、賞状と草稿本と、気軽には触れない古い本の山だけではなかった。\n\n公式を眺め続けていると、見慣れない導出にも少しずつ掴めそうな糸口が見えてくる。暗闇で階段を探るようなものだ。一歩目は踏み外すのが怖いが、二段三段と足を置けば、足裏がどうにか段差の高さを覚えていく。\n\nもちろん、だからといって昼間の軍訓を愛せる余裕ができたわけではない。\n\n太陽は相変わらずグラウンドで刑を執行していた。\n\n雨上がりの涼しさなど、雲夢の夏はとっくに取り返している。地面は白く焼け、トラックは熱のこもったゴムの匂いを放つ。隊列で立っていると、汗は帽子の縁から抜け出し、こめかみを伝って落ちてくる。運悪く目に入っても手で拭えないので、一時的に視界が塩辛くなったまま軍姿を保つしかない。\n\n僕はこれを、軍訓による人体構造への悪意あるテストと呼びたい。\n\n袁林修の脚もまだ治っていなかった。\n\n校医院の診断書は彼を本当に訓練場から離してはくれず、ただ張迪が彼を睨む時に皮肉の材料を一つ増やしただけだった。\n\n「動作を少し遅くするのはいい。だが俺と条件交渉してるみたいに遅くするな」\n\n「本当に無理なら、校医院はどうして訓練不可と書かない？」\n\n「怪我は免死金牌じゃない。わかるな？」\n\nそんな言葉が落ちてきても、袁林修はたいてい「はい」とだけ答え、動作を最後まで続けた。\n\n彼が何も言わないほど、張迪はますます自分に理があると思っているようだった。\n\nその日の午後は正歩の分解動作を練習していた。\n\n最初は脚を上げ、つま先を伸ばし、その姿勢で止めるだけだった。やがて張迪は一列ずつ前へ進ませ、高さが足りない、着地が揃わない、腕の振りが違うとなれば、その列を元の位置まで戻してやり直させた。\n\n軍訓もここまで来ると、人と人との会話はあまり要らない。隣で靴底が地面に落ちる音の重さだけで、この一回もたぶん無効になるとわかる。\n\n袁林修のいる列が三度目に元の位置へ戻された時、張迪が笛を吹いた。\n\n「袁林修、出列」\n\n袁林修は隊列から出た。\n\n歩き方は平らだった。少なくとも表面上は。けれど隊列の前で止まった時、右足が地面に着く一瞬だけ遅れた。\n\n張迪が見逃すはずもない。\n\n「ここ数日ずっとお前だな」彼は言った。「みんなが練習してる横で、身障者の根性物語でも見せてるつもりか？」\n\n隊列のどこかがわずかに動いた。\n\nその小さな気配はすぐ押し込められた。\n\n袁林修は顔を上げた。\n\n「報告します。動作は引き続き練習します」\n\n「練習する？」張迪は笑うように言った。「ならできるようになれ。今日お前が正歩をまともに歩けなければ、お前の列も一緒にできるまで練習だ」\n\n「報告します、教官。まだ脚が治っていません」\n\n朱銘の声が僕の左前方から聞こえた。\n\n言う前に振り返りもしなかったし、誰を見ることもなかった。まるでその言葉が歯の奥で長くつかえていて、とうとう勝手に飛び出したみたいだった。\n\n張迪が彼へ向き直る。\n\n「名前は？」\n\n「朱銘です」\n\n「朱銘」張迪はその名を一度繰り返した。「お前は医者か？」\n\n「違います」\n\n「教官か？」\n\n「違います」\n\n「なら俺が訓練してるところへ口を挟む番か？」\n\n朱銘は黙った。\n\n日差しで耳が赤くなり、唇もきつく結ばれていた。斜め後ろにいる僕には表情までは見えない。ただ、ズボンの縫い目に沿って下ろした手が少しずつ握られていくのが見えた。\n\n「お前も出ろ」\n\n張迪が言った。\n\n朱銘は前へ出た。\n\n「そんなに同級生思いなら、一緒に練習してやれ」張迪は二歩ほど横へ退いた。「お前らの列もよく見ておけ。今日はいい人をやりたい奴がいたら、誰でも出てこい」\n\n誰も出なかった。\n\n誰も声を出さなかった。\n\n太陽は照りつけたままで、遠くの方陣はまだ掛け声を上げていた。グラウンドの向こうから整然と届く声のせいで、僕らのこの一角の沈黙は余計にみっともなく見えた。\n\n朱銘と袁林修は隊列の前に残され、何度も分解動作を繰り返した。\n\n袁林修の動きはだんだん遅くなった。\n\n何回目だったかはもう覚えていない。もう一度脚を上げて止めた時、体がふらつき、踵を戻した瞬間に立ち切れなかったことだけは覚えている。\n\n朱銘はすぐそばにいて、とっさに手を出して支えた。\n\nあまりに速く起きたので、それを「決断」と呼ぶ時間さえなかった。\n\n張迪は一歩前へ出て、袁林修の肩を掴み、元の位置へ押し戻した。\n\n「立て！」\n\n袁林修の肩が強く揺れた。\n\nその一押しで人が倒れたわけではない。\n\nそして倒れなかったからこそ、周りの隊列はまだ立ったまま、グラウンドもグラウンドのまま、張迪の笛も胸元にぶら下がったままだった。袁林修がその場に立ってさえいれば、今のはただの「動作の矯正」だったことにできるみたいに。\n\n「教官」朱銘の声が変わった。「もう本当にできません」\n\n「お前が代わりに決めるのか？」\n\n張迪は今度は彼へ火を向けた。\n\n「しゃがめ」\n\n朱銘はすぐには動かなかった。\n\n「しゃがめと言ってる！」\n\nそこで彼は両手を頭に回し、しゃがんだ。\n\n張迪は僕らの列へ目を向けた。\n\n「お前らもだ。一人の訓練態度に問題があるのに、一列そろって見物か？」\n\n膝を曲げると、汗で張りついたズボンが脚にまとわりついて鬱陶しい。動作が半拍遅れた者がいると、張迪の笛がすぐ刺さってきた。縦に並んでいた影は一斉に低くなり、地面の熱気はなお上へ返ってくる。世界は急に、酸っぱくなっていく腿と目の前の靴だけになった。\n\n袁林修だけは立ったままだった。\n\n張迪は彼を横に立たせた。\n\n「脚が痛いと言ったな。ならそこで見てろ。お前一人が動作をできなければ、ほかの奴がどれだけ付き合わされるか」\n\n僕はしゃがんだまま、呼吸が少しずつ乱れていくのを感じた。\n\n今回は谷懿が壇上で話しているわけでも、校長がいるわけでも、マイクがあるわけでもない。何かを劇的に見せる道具は一つもなかった。\n\nただ、一人の脚の怪我と、余計な一言と、太陽の下にしゃがまされた一列があるだけだった。\n\nそれなのに、僕は急に罵りたくなった。\n\n心の中で張迪を何かのフォルダへ放り込むのでも、少し笑える比喩で気持ちをましにするのでもない。ただひどく素朴に、ひどく情けなく、罵りたかった。\n\n何でもよかった。\n\n短くて汚くて、胸につかえたものを押し出せる言葉なら。\n\nけれど結局、僕の口から出たのは乱れていく息だけだった。\n\n張迪は僕らを三十分しゃがませはしなかった。\n\n午後の訓練がまだ残っていたからか、グラウンドに彼一人しか教官がいなかったわけではないからか。十数分ほどでようやく立たされ、正歩の続きへ戻された。\n\n立ち上がった瞬間、腿が痺れ、視界が一度暗くなった。\n\n朱銘は隊列に戻った。顔色は普段よりずっと沈んでいた。\n\n袁林修はもう前へ呼び出されなかった。張迪は彼を隊列の脇に立たせ、動作ができないならまず人のやり方を見ろと言った。\n\n彼はそこに立ち、両手をズボンの縫い目に沿わせ、日差しの中で影が薄く見えた。\n\n解散になっても、皆はいつものように一斉に食堂へ走らなかった。\n\n隊列はゆっくりほどけた。\n\n水を取りに行く者もいれば、帽子を外して扇ぐ者もいた。太陽はまだ完全には沈んでおらず、グラウンド脇の木陰はすでに人でほとんど埋まっていた。\n\n「張迪、今日マジで病気だろ」\n\n誰かが先に言った。\n\n声は大きくない。\n\nそれでも一人が口を開けば、周りの言葉が途切れ途切れに続いた。\n\n「前からああだよ」\n\n「今さら知ったのか」\n\n「この前うちの寮の奴が許可取って遅れて戻ったら、横で軍姿を三十分追加された」\n\n「ここで言うなって」\n\n最後の一言で、数人は黙った。\n\n朱銘は僕の隣で水筒を持ち上げ、二口ほど水を飲んだ。喉仏が重く動いた。\n\n「歩く？」彼が訊いた。\n\n「どこへ？」\n\n「どこでも」彼は言った。「今はグラウンド脇の旗まで腹立つ」\n\n晚訓前の空き時間では遠くへ行けず、結局先に食堂で夕飯を済ませ、夜九時過ぎに訓練が終わってから寮を出た。\n\nA109では空調が入ったばかりで、昼に溜まったむっとする熱はまだ追い払われていなかった。朱銘はサンダルに履き替え、それから川沿いを歩くのに向かないと思い直して、ぶつぶつ言いながら運動靴に戻した。\n\n「散歩か遠征かどっち？」僕は訊いた。\n\n「散歩」彼は言った。「道で張迪に会った時、殴りに行くのにサンダルだと支障が出る」\n\n「殴りに走る方なんだ」\n\n「状況次第」\n\nずいぶん柔軟な戦略だった。\n\n僕らはキャンパスを抜け、二里半のあたりから川沿いへ向かった。\n\n夜の潇湘中路は昼ほど熱くない。背後を車の灯りが滑り、風を引きずって通り過ぎると、江面から吹く湿り気がそれをすぐ薄めた。沿江歩道には走る人や自転車がいて、タイヤが舗装の継ぎ目を踏む細かな音がした。もう少し遠くでは学生が二、三人で欄干にもたれ、笑い声は車の音と水の気配に洗われて中身がわからなくなる。\n\n湘江は雲夢を貫き、夜になると昼よりも幅広く見えた。\n\n対岸のビルには窓の灯りが格子のように並び、水面へ落ちた光は流れに引かれて長短の線になる。川の中ほどには橘子洲が横たわり、洲頭に立つ青年の像は水を隔てて細部までは見えない。それでもその一帯の夜に、見過ごしにくい向きを与えていた。\n\nここは教科書で読んだことがある。\n\n本当に川辺に立っても教科書はページをめくらない。その横で、朱銘が長く息を吐いた。\n\n「姜嵐」彼は言った。「今日のあれ、何なんだよ」\n\n「問いの範囲が広いな」僕は言った。「哲学系の方が得意かもしれない」\n\n「谷懿はいない」\n\nその四文字が落ちて、僕はもう冗談を続けなかった。\n\n江風が乾き切らない襟を首に貼りつかせ、少し嫌な涼しさを運んだ。\n\n「午後の俺の一言、またほかの奴を巻き込んだかな」朱銘が訊いた。\n\n「袁林修の脚が治ってないって言ったやつ？」\n\n「うん」\n\n「張迪はもともと彼に絡んでた」\n\n「でも後で一列しゃがまされたのは、俺が口出したからだ」\n\n朱銘は言い終えると、足元の小石を蹴った。石は少し転がり、欄干の根元で止まった。\n\n「谷懿があの日言った時、痛快だったよな」彼は言った。「俺もそう思った。でも毎晩訓練が増えて、今日は袁林修まであんな目に遭ってさ……痛快なだけじゃ、どうにもならない気がする」\n\n「でも黙ってたって、張迪が急に良心を取り戻すわけでもない」\n\nその言葉は思ったより早く僕の口から出た。\n\n朱銘がこちらを見る。\n\n僕も一瞬止まり、仕方なく続けた。\n\n「つまり、あいつは難癖をつけようと思えばいくらでもつけるってこと。袁林修の動作が遅いのも理由、お前が口を挟むのも理由、僕らが横で木みたいに立ててないのも、そのうち理由になるかもしれない」\n\n「じゃあどうする？」朱銘は言った。「明日もこのままあいつにやらせるのか？」\n\n尹淵の論文より難しい問題だった。\n\n論文は少なくとも自分が公式でできていることを認めている。力が足りれば、一歩ずつ推していける。目の前のことには問題文も答えもなく、草稿紙を三枚埋めてもきれいな証明が勝手に現れるわけではない。\n\n「じゃあ……」僕は言いかけ、少し止まった。「まず今日のこと、記録してみる？」\n\n「記録？」\n\n「うん」僕は言った。「誰かに話しに行くにしても、『張迪がクソです』だけじゃ足りないだろ。個人的にはその一文に賛成だけど、有効な材料には聞こえない」\n\n朱銘は二秒ほど黙った。\n\n「今の言い方、李哥みたいだな」\n\n「じゃあ言い換える」僕は少し考えた。「帳面をつける。今日何をしたか、何を言ったか、誰が見たか。二日後に訊かれて、腹の中の怒りと『とにかくやったんだ』しか残ってないのは困る」\n\n朱銘は頷いた。\n\n「それならできる」\n\n彼はスマホを取り出してメモを開いた。画面の光が顔を照らす。空白のページをしばらく見つめたあと、顔を上げた。\n\n「一行目、何て書く？」\n\n「……」\n\nさっきもっともらしいことを言ったのは僕で、今問い詰められて詰まったのも僕だった。\n\n理論が実践を導こうとした時、実践が最初にくれる洗礼とはこういうものなのだろう。\n\n「日付からでいいんじゃない」僕は言った。\n\n朱銘が打つ。\n\n「今日の午後、正歩訓練」彼は読み上げた。「張迪が袁林修の脚の怪我を狙って……」\n\n「狙って、は結論が早いかも」\n\n「じゃあ何て？」\n\n「出列させた？」\n\n「よし」\n\n朱銘は「狙って」を消し、「袁林修を出列させた」に変えた。\n\n張迪の「身障者の根性物語」のところで、また止まった。\n\n「原文これで合ってる？」僕は訊いた。\n\n「合ってる」朱銘は言った。「はっきり聞いた」\n\n「僕も聞いた。書こう」\n\nしゃがまされた時間を書くところで、彼の指が画面の上で止まった。\n\n「十分？」\n\n「だいたい」\n\n「だいたいって書けるか？」\n\n「『約十分』？」\n\n「それだ」\n\n僕らは湘江のほとりで、一つのスマホメモの言葉を詰めていた。江面の遠くを船が過ぎ、灯りが橘子洲の方から移って、別の水面へゆっくり落ちていく。\n\n遠くから見れば、明日どの店で飯を食うか真剣に相談している大学生二人に見えたかもしれない。\n\nスマホの中の数行だけが知っている。僕らは初めて、あの午後をぐちゃぐちゃの怒りの中から掬い上げ、ほかの人にも見える形に置こうとしていた。\n\n「前にしゃがまされたやつもある」朱銘は言った。「谷懿の日の後の」\n\n「別に書ける」僕は言った。「でもまず分けよう。全部混ぜない方がいい」\n\n「お前、ほんとに李哥に乗っ取られてない？」\n\n「僕が乗っ取られてたら、もう表を作ってる」\n\n「いや、李哥なら表に色分けも入れるかもしれない」\n\n否定しにくい。\n\n今日のことを書き終え、前に確かめられる加訓と罚蹲も後ろへ並べた。書いているうちに、空白だったメモは少しずつ伸びていく。まだ乱れていた。原話を書いた箇所もあれば、「要確認」としか置けない箇所もある。時間も「およそ」としか書けない。それでも、胸に詰まった塊だけではなくなった。\n\n「ほかの人にも訊く？」朱銘が言った。\n\n「今？」\n\n「じゃないと、寝て起きたらビビる気がする」\n\n彼は平然と言った。\n\nスマホに並ぶ数行を見て、僕も今の方がいい気がした。\n\n朱銘はまず同じ列の男子にメッセージを送った。返事はすぐ来た。\n\n【俺も見た。】\n\n続けてもう一つ。\n\n【でも反映するなら、俺の名前は先に書かないでくれる？】\n\n朱銘はスマホを僕へ見せた。\n\n僕は頷いた。\n\n「いいって返そう」\n\n二人目の返事はしばらくしてからだった。\n\n【本当にそれやるの？】\n\n【あと何日かで終わるじゃん。】\n\n朱銘はその二行を見つめ、また眉を寄せた。\n\n「言ってることがゼロではないんだよな」彼は言った。「でもなんでこんなに詰まるんだろ」\n\n「言い合わなくていい」僕は言った。「今日見たかだけ訊こう」\n\n結局、相手は【見た】と返し、さらに、先週同じ寮の一人が訓練中に目眩を起こして木陰で数分休み、隊列へ戻った後、張迪に「体がそんなにお上品なら軍訓優秀個人なんか申請するな」と皆の前で言われた、と送ってきた。\n\n「軍訓優秀個人ってそんなのあるの？」朱銘が訊いた。\n\n「知らない」僕は言った。「でもたぶん、あの言葉の重点は賞じゃない」\n\n三人目は前の二人より歯切れがよかった。\n\n張迪は数日前、別の列で動作を間違えた一人を単独で追加練習させ、夕飯が終わりかけるまで放さなかったという。その人は帰り道ずっと罵っていたが、翌日も何事もなかったように隊列へ戻った。\n\nメッセージが一つずつ増えていく。\n\n江風の中でスマホ画面には薄い指紋の光が浮いていた。朱銘は確認できる内容をメモへ足し、途中からあまりに乱れると感じたのか、「他人の話」という見出しを新しく作り、何件かを分けて書いた。\n\n「これ、証拠になるのかな」彼が訊いた。\n\n「わからない」僕は言った。「でも少なくとも、僕ら二人だけが発狂してるわけじゃない」\n\nそう言うと、胸の中が確かに少し緩んだ。\n\n見たのは僕らだけではなかった。\n\nほかの人も、おかしいと思っていた。\n\n言葉を送ってみれば、画面の向こうはいつも沈黙ばかりではなかった。\n\n寮へ戻る道で、朱銘はもう張迪を罵らなかった。\n\n来た時より少し速く歩いた。あの勢いが道の途中で抜けてしまうのを恐れるみたいに。\n\nA109の灯りはまだついていた。\n\n李向陽は机でパソコンを見ている。袁林修はシャワーを終えたばかりで、濡れた髪を拭きながら椅子に座っていた。僕らが入ると、頭からタオルを外して朱銘を見た。\n\n「どこ行ってた？」\n\n朱銘はすぐには答えなかった。\n\nまず扉を閉め、ベランダの方を一度見てから袁林修のそばへ行った。\n\n「ちょっと訊きたいことがある」彼は言った。\n\n袁林修はタオルを椅子の背へ掛けた。\n\n「言って」\n\n「今日の午後の張迪の件」朱銘は一度間を置いた。「俺と姜嵐で、反映してみようかと思ってる。今すぐお前を前に出すとか、絶対出ろとかじゃなくて……でもお前のことが入るから、先に訊いておきたい」\n\n最後の方は明らかにゆっくりになった。\n\n川辺でメモに時間を書くより、本人を前にした方がずっと難しい。スマホに書くのは事実で、目の前に座っているのは人だった。\n\n袁林修はすぐには答えなかった。\n\n濡れたタオルを下へ絞り、水滴が足元の桶に落ちた。\n\n「誰に反映するの？」彼が訊いた。\n\n「まだ決めてない」僕は言った。「辅导员か、書院か、総教官か。まず確かなことを整理したい」\n\n「ほかの人には訊いた？」\n\n「その場にいた何人かには」朱銘が言った。「見たとは言ってくれた。でも名前は出したくない人もいる」\n\n袁林修は小さく頷いた。\n\n「診断書はまだある」\n\n朱銘は彼が先にそれを言うとは思わなかったらしく、少し止まった。\n\n「使っていいの？」\n\n「写真なら」袁林修は言った。「原本は僕が持つ」\n\n「もちろん原本はお前が持つ」朱銘は慌てて言った。「そういう意味じゃなくて」\n\n袁林修は引き出しから診断書を取り出し、机に置いた。\n\n紙は何度か折られ、広げても端が完全には平らにならない。話を聞いた李向陽が椅子を回し、その紙を一度見た。\n\n「張迪を反映するの？」彼が訊いた。\n\n「うん」朱銘は言った。「このままやらせるわけにはいかないだろ」\n\n李向陽はすぐに賛成とも反対とも言わなかった。\n\n「今、何を整理した？」\n\n朱銘はメモを見せた。\n\n李向陽は上から下へ目を通し、画面を二度ほど滑らせた。\n\n「『故意に狙った』は先に書かない方がいい」彼は言った。「そこは証明できない」\n\n「さっき僕も言った」僕は言った。\n\n「ならこの『袁林修に怪我を押して訓練させた』も変える」李向陽は言った。「校医院の勧告を見た後も、どの訓練を要求したかを書いた方がいい。動作を書く」\n\n朱銘は彼を見る。\n\n「李哥、結局これは支持なの？　支持じゃないの？」\n\n「ここまで訊いておいて、今さら僕が支持しないと言って意味ある？」李向陽はスマホを返した。「言うならはっきり言え。事実がはっきりしていれば、『感情的になっている』の一言で返されにくい」\n\n朱銘は返事をせず、下を向いて字を直した。\n\n李向陽はさらに言った。\n\n「チャット履歴は消すな。診断書を撮る時は日付も入れろ。それと、大きいグループには流すな」\n\n「なんで？」\n\n「張迪を反映したいのか、それとも誰かが反映していると先に張迪へ知らせたいのか？」\n\n朱銘は考えた。\n\n「前者」\n\n「ならいい」\n\n李向陽はメモを少し上へ戻した。\n\n「あと、お前ら二人以外の名前は先に書かない方がいい」彼は言った。「出るかどうかは本人のことだ。訊いていないのに人の分まで決めるな」\n\n朱銘は彼を一度見た。\n\n「わかった」\n\n李向陽はそうしてパソコンへ向き直った。\n\n袁林修は診断書を平らに置き、僕に写真を撮らせた。\n\nシャッター音が鳴った時、彼がふいに言った。\n\n「僕のことだけにしないで」\n\n「何？」朱銘が訊いた。\n\n「今日罰を受けたのは一列だ」袁林修は言った。「前だって僕だけじゃない」\n\n朱銘は彼を見て、唇を少し動かした。\n\n最後に言ったのは一言だけだった。\n\n「わかった」\n\nその夜、僕らはスマホと診断書の写真と何人かのメッセージを並べ、テンプレートなど見たこともない初回のグループ課題みたいに作業した。\n\n朱銘は文を人間の言葉にする係で、僕は怒りが一目でわかる形容詞を削る係だった。削っているうちに、朱銘は「張迪は某日午後の訓練中、袁林修を出列させ正歩分解動作を反復させた」という一文を見て苦しそうな顔をした。\n\n「丁寧すぎない？」彼は言った。「知らない人が見たら、袁林修に一対一の精品小班授業してるみたいだ」\n\n「じゃあ後ろに原話を入れよう」僕は言った。「原話は丁寧じゃない」\n\nそうして「身障者の根性物語」という言葉をそのまま置いた。\n\nたちまち文章に生命が宿った。\n\n罵倒の表現力に関しては、張迪本人の方が苦情資料初心者の僕ら二人よりずっと強かった。\n\n最後に整理を終えた時、消灯時間が近かった。\n\n中身はまだ綺麗とは言えない。\n\n何度かしゃがまされた時間は記憶が一致せず、およそとしか書けない。ある同級生は「見た」とだけ言い、名前を文字に残したがらなかった。チャットのスクリーンショットも順序が少し乱れている。けれど朱銘はメモを最初から最後まで、もう一度最初へ戻って見直し、ようやく息を吐いた。\n\n「少なくとも手ぶらじゃない」\n\n僕はスマホのタイトルを見た。\n\n朱銘がつけた題名は「張迪問題記録」。\n\nひどく素朴だった。\n\n素朴すぎて少し笑いそうになり、笑わなかった。\n\n翌日の午前、張迪は僕らをしゃがませなかった。\n\n袁林修を一人だけ隊列の前へ呼ぶこともなかった。\n\n突然改心したわけではない。訓練内容が軍体拳の分解動作に変わり、グラウンド全体が拳と掌を空気へ打ち込む青春で忙しかっただけだ。張迪は隊列の間を歩き、時々動作を直し、顔色は相変わらず悪かった。\n\n僕は号令を聞きながら、昨夜まとめたものが気になっていた。\n\nそれは僕のスマホの中にある。\n\nただのメモとしては薄いのに、ポケットへ触れるたび思い出させるくらいには重かった。\n\n昼休みに朱銘が訊いた。\n\n「誰に言う？」\n\n「考えてる」僕は言った。\n\n「辅导员？」\n\n「あり」\n\n「班導？」\n\n「それもあり」\n\n「総教官は？」\n\n毛鋭が壇上で訓示していた姿を思い出す。一声の号令でグラウンド中から答えが返る姿を。\n\n「なしではない」僕は言った。\n\n「答えてないのと同じじゃん」\n\n「だってまだ答えが出てない」\n\n朱銘はスマホをベッドへ投げ、枕へ倒れた。\n\n「午後考える」彼は言った。「今は頭が張迪に正歩させられてる」\n\n午後になっても答えは出なかった。\n\n夕飯前にもう一度記録を見直し、少なくとも毛鋭を候補の一つに入れることにした。張迪は教官隊の人間で、毛鋭は総教官なのだから。ただ候補に入れることと、総教官の前へ行って「うちの教官に問題があります」と言うことは別物だった。\n\n僕はすでに頭の中で出だしを何度か練習していた。\n\n「毛教官、こんにちは。反映したいことがあります」\n\n硬すぎる。資料を提出しに来たみたいだ。\n\n「毛教官、張迪が人を殴っています」\n\n直球すぎる。次の瞬間には笛で走らされそうだ。\n\n「毛教官、お食事はお済みですか」\n\n親しみは出るが、たぶん食堂満足度調査へ流れていく。\n\nところが運命は、僕の台詞審査が終わるまで待つ気がなかったらしい。\n\n夕飯時の木蘭食堂は混んでいた。\n\n僕と朱銘は半周して、ようやく奥側に二席見つけた。\n\n座ってほどなく、朱銘の箸が空中で止まった。\n\n彼は僕の背後へ目を向けた。\n\n「姜嵐」声を落とす。「急に振り返るなよ」\n\nその言葉の効果は「ピンクの象を絶対想像するな」と同じだった。\n\n僕は急に振り返らないようにした結果、自然を装おうとするロボットのような動きになった。\n\n毛鋭がトレーを前に、斜め後ろのそう遠くない席に座っていた。\n\nこちらは見ていない。\n\n別の教官と飯を食べていて、帽子は隣の空席に置かれている。箸を動かす様子はあまりに普通で、グラウンドで「疲れたか」を雷みたいに響かせる人と同じとは思いにくかった。\n\nそれでも僕は一気に緊張した。\n\nスマホはポケットにある。\n\n昨夜の「張迪問題記録」もそこにある。\n\n昼に総教官の話をしたばかりで、今その総教官が数卓先にいる。機会は速すぎた。開場の台詞をもう少しましに練習する時間すら残してくれない。\n\n言うか。\n\n言わなければ、次はいつだ。\n\n今行くのは唐突すぎないか。\n\n張迪は今夜も訓練場にいる。袁林修も今夜また隊列へ入る。\n\nいくつかの文が頭の中でぶつかり、時間まで短くなった。気づけば朱銘が小声で訊いていた。\n\n「行く？」\n\n彼の声も張っている。\n\n総教官を前に緊張しているのが僕だけではないと知っても、勇気が大きく増えるわけではない。けれど一人で席に縫い止められている感じは少し薄れた。\n\n「行く」僕は言った。\n\n立つ時、膝がテーブルの縁にぶつかりかけた。\n\n格好よくはない。\n\nでも食堂には僕の勇気を動作採点する人はいなかった。\n\n僕と朱銘は毛鋭のテーブルへ行った。\n\n一緒に食べていた教官が先に顔を上げ、毛鋭も続いてこちらを見る。視線は僕らの軍訓服に一度止まった。\n\n「教官、こんにちは」僕は言った。\n\n声は思ったより少し小さかった。\n\nだからもう一度足した。\n\n「毛教官、こんにちは」\n\n「うん」毛鋭は箸を置いた。「用か？」\n\nある。\n\nもちろんある。\n\nけれどその一言で問われると、喉がやはり締まった。\n\n「C陣の張教官のことで、反映したいことがあります」僕は言った。\n\n毛鋭は僕を見た。\n\nすぐ眉をひそめることも、飯へ戻れと言うこともなかった。\n\n「張迪か？」\n\n「はい」\n\n「座って話せ」\n\n隣の帽子を取り、自分の膝元へ置いた。もう一人の教官は毛鋭を一度見て、先に行くと言ってトレーを持って立った。\n\n僕と朱銘はその卓に座った。\n\n本当に椅子へ腰を下ろしてから、手のひらに汗をかいているのに気づいた。\n\n「話せ」毛鋭は言った。「何があった」\n\n出だしさえ越えれば、後は思ったより少し楽だった。\n\n僕はまず袁林修の脚の怪我を話し、校医院が「激しい運動を減らすことを勧める」と書いた診断書を出したことを話し、それでも張迪が訓練へ参加させたことを話した。そして今日の午後の正歩訓練を一つずつ説明した。\n\n「身障者の根性物語」という言葉まで来ると、毛鋭が遮った。\n\n「原話か？」\n\n「原話です」朱銘が言った。「僕も聞きました」\n\n毛鋭は彼を見た。\n\n「午後に出列したのはお前か？」\n\n「はい」\n\n「その後、しゃがまされたのはどれくらいだ？」\n\n「約十分です」朱銘は言った。「最初から計ってはいません」\n\n「ほかに誰がいた？」\n\n「僕らの列は全員いました」僕は言った。「見たと説明してくれる同級生も何人かいます。ただ、少し怖がっています」\n\n言い終えてから、他人を売ったようになっていないか不安になった。\n\n毛鋭は名前を追及せず、ただ訊いた。\n\n「診断書はあるか？」\n\n「写真があります」僕はスマホを出し、袁林修の診断書の写真を開いて見せた。「原本は本人が持っています」\n\n毛鋭は見終えると、昨夜整理した記録も開けと言った。\n\nスマホを渡す時、妙な恥ずかしさがあった。昨夜A109で見た時には成果らしく見えたメモが、総教官の前では初めて出す宿題の下書きみたいに見える。\n\nけれど毛鋭は真剣に読んだ。\n\n笑いもせず、乱れているとも言わなかった。時間が確かでない箇所では「これは誰が確認できる」と訊き、前の罚蹲や夜の追加訓練まで読むと、顔つきが少しずつ沈んだ。\n\n「これは全部張迪が安排したのか？」彼が訊いた。\n\n「はい」僕は言った。「谷懿が壇上で発言した後、C陣の晚訓は長くなりました。罚蹲も今日だけじゃありません」\n\n「張迪が手を出したことは？」\n\nその質問で、僕と朱銘は少し止まった。\n\n「今日は袁林修を押しました」僕は言った。「前にも……」\n\n訓練場脇で低く交わされた話を思い出す。\n\n「前にも人を叩いたり、引っ張ったりするのは見ました。殴られた同級生なら、証明できる人はいるはずです」\n\n「はず？」\n\n「まだ全部は訊けていません」僕は言った。\n\n言った途端、欠けたページの資料を出したような気がした。\n\n毛鋭は責めず、スマホを返した。\n\n「事実をここまで先に整理できたなら、もう十分だ」彼は言った。\n\nその瞬間、張っていた線が胸の中で少し緩んだ。\n\n「軍訓には軍訓の規律がある。教官隊にも教官隊の規律がある」毛鋭は言った。「訓練すべきものは訓練する。だが傷病学生をこう扱っていいわけではないし、体罰を管理手段にしてもいけない」\n\n声は大きくなかった。\n\n食堂は相変わらず騒がしく、隣でスプーンが落ちた金属音もすぐ人声へ沈んだ。それでも僕にははっきり聞こえた。\n\n「お前たちが反映した状況は、こちらで確認する」毛鋭は言った。「事実がまだはっきりしないうちに隊列を乱すことになる。グループには先に広げるな」\n\n「袁林修は今夜も普通に訓練へ出るんですか？」朱銘が訊いた。\n\n毛鋭は彼を見る。\n\n朱銘は明らかに緊張していたが、質問は引っ込めなかった。\n\n「脚が不調なら校医院の勧告に従え」毛鋭は言った。「張迪には俺が訊く」\n\n朱銘は頷いた。\n\n「ありがとうございます、教官」\n\n僕も続けて礼を言った。\n\nその礼は、少なくともその時は本心だった。\n\n僕らが席を立つと、毛鋭が僕を呼び止めた。\n\n「名前は？」\n\n「姜嵐です」\n\n「どこの書院？」\n\n「立華書院です」\n\n毛鋭は頷いた。\n\n「わかった。覚えた」\n\n木蘭食堂を出てから、背中にまた汗が浮いていることに気づいた。\n\n朱銘は階段の下で長く息を吐いた。さっきの数分、肺を十分に使えていなかったみたいに。\n\n「俺、さっきあんまり喋ってなくない？」彼が訊いた。\n\n「そんなことない」僕は言った。「袁林修が今夜どうなるか訊いた」\n\n「そうか」\n\n彼はスマホを一度見た。\n\n「メモ、無駄じゃなかったな」\n\n「うん」\n\n僕もスマホを出した。\n\nあの記録はまだそこにあり、題名は相変わらず素朴で不器用だった。けれど今見ると、それはもう昨夜の川辺で空白の一ページに少しずつ打ち込んだ文字だけではなかった。\n\n朱銘はグラウンドの方へ二歩行き、振り返って僕を急かした。\n\n「行くぞ。遅れたらまた張迪の理由になる」\n\n僕はスマホをポケットへ戻し、追いついた。\n\n木蘭食堂の入口を抜ける風には、食事の匂いと熱いコンクリートと植え込みの湿り気が混ざっていた。グラウンドの方から、もう最初の笛が聞こえている。\n\n僕らは足を速め、そちらへ向かった。"},{"title":"第十二章：誰もいない絵の中で","file":"12、第十二章.md","volumeTitle":"第一巻：物語の始まりは平凡すぎるくらいでいい","text":"軍訓が終わったあの日、天気はどんなだっただろう。\n\nいつも通りの快晴だったのか、それとも肩の荷が下りたような曇り空だったのか。\n\nあの日の発表で、僕らの方陣は何番目に主席台の前を通ったのか。前列の誰かが曲がる時、こっそり半拍踏み間違えたりしたのか。\n\nずっと後になって、たくさんの大事なことや印象が曖昧になってからも、僕はまだグラウンドに響いていたあの歌と、その時に歌声でぎゅっと包まれていた気持ちだけは、はっきり覚えている。\n\nそれがグラウンド四方のスピーカーから流れ出した瞬間の感覚を覚えている。風みたいだった。汗の匂い、土埃、軍訓服の粗い布地、同級生たちがふっとほどいた笑い声、その全部を、短い同じ一日の中へ巻き込んでいった。\n\n後になって、僕は少しずつわかった。\n\n人間がある日々を思い出す時、その記憶は終わりの瞬間ほど、ひどく信用できなくなる。\n\n卒業式でいつも起きるのと同じだ。人は知らないうちに数年分の時間を頭の中で巻き戻し、記憶の中のひどかったことや悲しかったことは歳月に削られ、幸せで楽しかった記憶だけが陽の下できらきら光る。\n\n記憶というものは、やけに世話焼きな編集者みたいに、ひどい部分を短く切り、明るい部分だけ色を整え、そこにちょうどいいBGMまで付けてしまう。\n\nだから一本の木、一棟の建物、毎日歩きすぎて吐きそうになった道まで、急に懐かしくなる。それらは本来、ただ物事が起きた場所にすぎなくて、喜びや痛みや成長と必然的に結びついているわけではない。\n\nけれど物語は、たまたまそこで起きた。\n\nただ、そこに物語があったから。\n\n僕らよりずっと長くそこに留まり続けるものたちは、時間に打ち込まれた道標みたいに、未来の僕らへ何度も告げる。\n\nほら、お前はかつてここを通ったのだ、と。\n\n軍訓が終わった日も、そうだった。\n\n前日まで僕は、この二週間を太陽に何度も焼かれた煎餅みたいだと思っていた。裏返し方もあまり均等ではないタイプのやつだ。\n\nそれなのに、最後にもう一度グラウンドへ立ち、主席台の前を通る時を待っていると、あれだけ先を争って外へ出ようとしていた恨み言が、ふいに静かになった。\n\n張迪の横暴を忘れたわけではない。\n\n谷懿があの日怒ったことを忘れたわけでも、陳小雲が言い終えられなかったあの言葉を忘れたわけでも、袁林修が何度も何度も自分は怠けていないと証明させられたことを忘れたわけでも、正午のトラックに靴底が残した汗の跡を忘れたわけでもない。\n\nただ、最後の数分だけは、もう憎み続けたくなかった。\n\nそれは軍訓と和解したという意味ではない。\n\n僕はただ、そのわずかな時間を、ようやくここまで歩いてきた自分に残しておきたかった。\n\n怖がり、傍観し、徹夜し、それでもどうにか少しだけ何かをした自分に。\n\nたった数分でもいい。\n\n世界に、少しだけ静かでいてほしかった。\n\n……\n\n軍訓発表の日、グラウンドには朝早くから人がいっぱいだった。\n\n大学で最も奇妙な儀式の一つだと思う。\n\n全員が二週間近くかけて、自分を数分間だけ同じ人間に見えるよう訓練する。そして主席台に座っていて、こちらの顔など一人も覚えない人たちに、その数分間の演技を評価される。\n\nもちろん、そこから青春、規律、集団、成長といったキーワードを抽出したい人がいるなら、僕も反論はできない。\n\n少なくともその日以前、僕はまさか自分が正歩を歩くことによって、卒業式に近い複雑な感情を抱く日が来るとは思っていなかった。\n\n僕らはC陣の位置で出番を待っていた。\n\nこの静けさにまず感謝すべき相手は、張迪である。\n\n僕らの教官は欠席していた。\n\nなぜ来なかったのか、誰も正式には説明しなかった。\n\n通達もない。謝罪もない。「調査の結果」もない。まして主席台の誰かが、某教官の訓練管理に重大な問題があったと発表することもない。\n\n臨時の用事が入ったと言う人もいた。\n\n総教官に呼ばれて話をされたらしいと言う人もいた。\n\n昨夜教官宿舎の前を通ったら、張迪が真っ黒な顔で荷物をまとめていたのを見た、と自信満々に言う人までいた。\n\n本当のところは、僕にはわからない。\n\nただ一つわかっていたのは、最後の日、僕らの前に立っていたのは別の教官だったということだ。その教官の姓を、僕は後になっても覚えていない。\n\nただ、袁林修はその日、隊列の中に立っていた。\n\nもう一人だけ呼び出されることはなかった。\n\n朱銘がそれを見て、肘で僕を軽く突いた。\n\n僕は振り返らなかった。\n\n隊列では勝手に動けない。\n\nけれど彼の言いたいことはわかった。\n\nC陣の番になると、前列から号令が伝わり、足音が同時にトラックへ落ちた。\n\n主席台は遠く前方に立っていた。赤い横断幕、マイク、ミネラルウォーターのボトル、指導者たちの白いシャツと濃い色のズボン。そのすべてが太陽の下であまりにも正式に見えた。\n\n正式すぎて、もし誰かがここでくしゃみでもしたら、この儀式に取り返しのつかない損害を与えそうだった。\n\n僕らは脚を上げ、足を下ろし、腕を振った。\n\n訓練の時に張迪に何度も怒鳴られた動作は、本当に主席台を通る時には、逆にあっけない誤解みたいに短かった。\n\n数分にすぎない。\n\nその数分のために、僕らは日に焼かれ、しゃがまされ、追加訓練を受け、汗と靴底と笛と無数の「疲れていません」に耐えた。\n\nそして主席台の
