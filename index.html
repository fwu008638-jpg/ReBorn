    function escapeHtml(s) { return String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }
    function renderMarkdown(text) { return String(text).split(/\n{2,}/).map(block => { const t = block.trim(); if (!t) return ''; if (/^※+/.test(t)) return '<div class="divider">※ ※ ※</div>'; if (/^>\s*/.test(t)) return '<blockquote>' + escapeHtml(t.replace(/^>\s*/gm, '')).replace(/\n/g, '<br>') + '</blockquote>'; return '<p>' + escapeHtml(t).replace(/\n/g, '<br>') + '</p>'; }).join(''); }
    function countReadableChars(text) { const pattern = state.lang === 'ja' ? /[\u3040-\u309F\u30A0-\u30FF\u3400-\u4DBF\u4E00-\u9FFF\uF900-\uFAFF]/g : /[\u3400-\u4DBF\u4E00-\u9FFF\uF900-\uFAFF]/g; return (String(text).match(pattern) || []).length; }
    function renderBook(label, inner, open) { const id = 'book-' + Math.random().toString(36).slice(2); return '<section class="book-section"><button class="book-toggle" data-book-toggle="' + id + '" aria-expanded="' + String(open) + '">' + escapeHtml(label) + '</button><div class="book-panel' + (open ? ' open' : '') + '" id="' + id + '">' + inner + '</div></section>'; }
    function renderList() { const d = data(); list.innerHTML = [renderBook(d.characterTitle, '<div class="placeholder">' + escapeHtml(d.characterPlaceholder) + '</div>', false), renderBook(d.volumeTitle, d.chapters.map((ch, i) => '<button class="chapter-button" data-index="' + i + '">' + escapeHtml(ch.title) + '</button>').join(''), true), renderBook(d.secondTitle, '<div class="placeholder">' + escapeHtml(d.pending) + '</div>', false), renderBook(d.thirdTitle, '<div class="placeholder">' + escapeHtml(d.pending) + '</div>', false)].join(''); }
    list.addEventListener('click', e => { const toggle = e.target.closest('button[data-book-toggle]'); if (toggle) { const panel = document.getElementById(toggle.dataset.bookToggle); const open = toggle.getAttribute('aria-expanded') !== 'true'; toggle.setAttribute('aria-expanded', String(open)); panel.classList.toggle('open', open); return; } const btn = e.target.closest('button[data-index]'); if (!btn) return; showChapter(Number(btn.dataset.index)); document.body.classList.remove('nav-open'); });
    function showChapter(i, keepScroll) { setChapterIndex(i); const d = data(); const ch = d.chapters[chapterIndex()]; title.textContent = ch.title; volumeTitle.textContent = d.volumeTitle; meta.textContent = d.countPrefix + countReadableChars(ch.text).toLocaleString() + d.countSuffix; content.innerHTML = renderMarkdown(ch.text); document.querySelectorAll('.chapter-button').forEach((b, n) => b.classList.toggle('active', n === chapterIndex())); prevBtn.disabled = chapterIndex() === 0; nextBtn.disabled = chapterIndex() >= d.chapters.length - 1; if (!keepScroll) window.scrollTo({ top: 0, behavior: 'smooth' }); }
    function setLanguage(lang) { if (!library[lang]) return; const oldIndex = chapterIndex(); state.lang = lang; if (state.indexByLang[lang] == null) state.indexByLang[lang] = oldIndex; localStorage.setItem('reborn.lang', lang); const d = data(); document.documentElement.lang = d.htmlLang; document.title = d.siteTitle; document.querySelector('meta[name="description"]').setAttribute('content', d.description); siteTitle.textContent = d.siteTitle; siteSubtitle.textContent = d.subtitle; mobileTitle.textContent = d.siteTitle; openNav.textContent = d.navButton; langMobile.textContent = d.langMobile; navTitle.textContent = d.navTitle; topBtn.textContent = d.top; prevBtn.textContent = d.prev; nextBtn.textContent = d.next; document.querySelectorAll('[data-lang-option]').forEach(btn => btn.classList.toggle('active', btn.dataset.langOption === lang)); document.querySelector('[data-theme-option="classic"]').title = d.themeClassic; document.querySelector('[data-theme-option="sky"]').title = d.themeSky; document.querySelector('[data-theme-option="green"]').title = d.themeGreen; document.querySelector('[data-theme-option="wisteria"]').title = d.themeWisteria; document.querySelector('[data-theme-option="night"]').title = d.themeNight; renderList(); showChapter(chapterIndex(), true); }
    function setTheme(theme) { if (!themes.includes(theme)) theme = 'classic'; state.theme = theme; document.documentElement.dataset.theme = theme === 'classic' ? '' : theme; localStorage.setItem('reborn.theme', theme); document.querySelectorAll('[data-theme-option]').forEach(btn => btn.classList.toggle('active', btn.dataset.themeOption === theme)); }
    document.querySelectorAll('[data-lang-option]').forEach(btn => btn.addEventListener('click', () => setLanguage(btn.dataset.langOption))); langMobile.addEventListener('click', () => setLanguage(state.lang === 'zh' ? 'ja' : 'zh')); openNav.addEventListener('click', () => document.body.classList.toggle('nav-open')); topBtn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' })); fontMinus.addEventListener('click', () => { state.font = Math.max(15, state.font - 1); document.documentElement.style.setProperty('--font-size', state.font + 'px'); localStorage.setItem('reborn.font', state.font); }); fontPlus.addEventListener('click', () => { state.font = Math.min(24, state.font + 1); document.documentElement.style.setProperty('--font-size', state.font + 'px'); localStorage.setItem('reborn.font', state.font); }); prevBtn.addEventListener('click', () => showChapter(chapterIndex() - 1)); nextBtn.addEventListener('click', () => showChapter(chapterIndex() + 1)); document.querySelectorAll('[data-theme-option]').forEach(btn => btn.addEventListener('click', () => setTheme(btn.dataset.themeOption))); window.addEventListener('scroll', () => { const h = document.documentElement; const max = h.scrollHeight - h.clientHeight; progress.style.width = (max > 0 ? (h.scrollTop / max) * 100 : 0) + '%'; }); setTheme(state.theme); setLanguage(state.lang);
  </script>
