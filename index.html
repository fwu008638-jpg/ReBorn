人たちは、もちろん知らない。\n\n彼らが見るのは、軍訓服を着た新入生の列が目の前を通り過ぎる光景だけだ。動きはだいたい揃っている。掛け声もだいたい大きい。今期の軍訓が円満に完了したと証明するには、それで十分だった。\n\n「円満」という言葉は、本当に強い。\n\n赤い布みたいに、何にかぶせてもめでたく見える。\n\nすべての方陣の発表が終わると、グラウンドの隊列はようやく解けた。\n\n二週間維持されていた鋼鉄の森が、数分のうちに音を立てて崩壊する。さっきまで立つ位置、間隔、角度、号令を決められていた人々が、急に自由電子みたいに広い芝生の上をばらばらに走り回った。\n\n帽子を脱ぐ人、ベルトを緩める人、帽子を投げ上げてまた受け取る人。自分の方陣の教官へ駆け寄り、騒ぎながら記念写真を撮ろうとする人もいた。まるで数日前に頭皮が痺れるほど怒鳴られていたのは自分ではないみたいに。\n\n人類の忘却能力は、時々畏敬の念を抱くほど強い。\n\nいや、忘れたわけではないのかもしれない。\n\n人は痛みが終わる時、何かを祝わずにはいられないのだ。たとえ祝う相手が、その痛みの構成要素そのものであっても。\n\n「あっちは教官と写真撮れるんだな」朱銘が僕の隣に立ち、隣の方陣の人たちが教官を囲んでいるのを見ながら言った。「うちは気まずいな」\n\n「どうして？」\n\n「空気としか撮れない」朱銘は言った。「タイトルまで考えたぞ。『僕らと存在しない教官』」\n\n「芸術性が強すぎる。写真協会に出した方がいい」\n\n「写真協会も構図が抽象的すぎるって言うわ」\n\n危うく笑いそうになった。\n\n袁林修は少し離れたところに立ち、軍訓帽を手に持っていた。教官を囲むどの人混みにも加わっていない。今日の発表を最後まで歩き終えて、顔色はここ数日よりずっとよく見えた。\n\n朱銘が彼に向かって叫んだ。\n\n「袁林修、こっち来い。写真撮るぞ」\n\n袁林修が顔を上げた。\n\n「僕は撮らなくてもいい」\n\n「出たよ」朱銘は言った。「この二週間立ってきて、写真一枚から逃げる気か？」\n\n袁林修は彼を二秒ほど見て、結局歩いてきた。\n\nちょうど李向陽が横を通りかかった。手にスマホを持っていて、誰かの写真を撮り終えたところらしい。\n\n朱銘はすぐ彼を呼び止めた。\n\n「李哥、行くな。うちの寝室も一枚撮ろう」\n\n李向陽は僕ら三人を見て、それから遠くの主席台を見た。\n\n「いいよ」彼は言った。「ただ、角度を調整しないと」\n\n彼はスマホを地面に置き、二歩下がった。角度が低すぎると思ったのか、腰をかがめて軍訓帽の上にスマホを立てた。\n\nしかし軍訓帽には、撮影機材としての職業意識がなかった。スマホは置いた直後、横へ滑った。\n\n朱銘がしゃがんで帽子のつばを押さえる。\n\n「こいつ使えないな」彼は言った。「李哥、その最新iPhone、地面の協力がないと自立できないのか？」\n\n「スマホの問題じゃない」李向陽は言った。「地面が平らじゃない」\n\n袁林修は黙って、自分の帽子も差し出した。\n\n李向陽は二度目を試した。帽子を二つ重ねると、スマホはようやくなんとか立ったが、画面には僕らの脚しか映っていなかった。\n\n朱銘が画面を覗く。\n\n「いいじゃん」彼は言った。「青春は膝から始まる」\n\n僕が手伝おうとした時、視界の端に、隣の方陣の横を通る見覚えのある姿が映った。\n\n陳小雲がそちらから歩いてきていた。軍訓帽をきちんと胸の前に抱え、つばを外へ向けている。まるで何かの儀式から一時的に退場してきたみたいだった。\n\n彼女はもともと通りすぎるだけだったようだが、偶然僕と目が合うと、小さく手を振った。\n\n僕も頷いた。\n\n「同級生？」朱銘が振り返る。「知り合い？」\n\n「陳小雲」僕は言った。「前に軍訓で知り合った」\n\n陳小雲も僕らへ軽く頷いた。\n\n彼女の視線は、地面のスマホ、重ねられた軍訓帽、そして僕らの顔へと移った。\n\n「写真を撮っているんですか？」\n\n朱銘がすぐ背筋を伸ばした。\n\n「今、万悪の米帝と艱苦卓絶な闘争をしているところです」\n\n幸い、李向陽のスマホはHuaweiではなかった。\n\n陳小雲は朱銘の脳内回路を理解しなかったらしく、地面のスマホを見た。\n\n「よかったら、私が撮りましょうか？」\n\n「本当に助かる」朱銘は即座にスマホを差し出した。「陳同学、今日から君はA109特聘撮影指導だ」\n\n「そこまで正式にしなくていいです」\n\n彼女は軽く手を振り、李向陽のスマホを受け取って画面を見た。\n\n「この角度だと少し逆光です」彼女は言った。「みなさん、もう少し右に立ってください」\n\n李向陽は頷いた。その判断を認めたらしい。\n\n僕らは彼女の指示に従って数歩動いた。朱銘は真ん中に立ち、袁林修を左へ、僕を右へ押しやった。李向陽は端に立ち、この写真に少なくとも一人は信頼できそうな人間が写るよう担当した。\n\n「証明写真みたいにするなよ」朱銘が言った。「軍訓終わったんだから、ちょっとは楽しそうにしろ」\n\n袁林修は協力的に口角を少しだけ上げた。\n\nその角度はとても控えめで、笑いすぎると自分が協力的すぎるように見えるのを恐れているみたいだった。\n\n陳小雲がスマホを構える。\n\n「三、二、一」\n\nシャッター音が鳴った。\n\n朱銘がすぐ覗き込む。\n\n「どう？」\n\n陳小雲はスマホをこちらへ向けた。\n\n画面の中で、朱銘は盛大に笑っている。袁林修の表情は相変わらず控えめだが、少なくとも何か違法行為に無理やり参加させられているようには見えない。李向陽は端に立ち、姿勢が整いすぎていて、いつでもその写真を優秀寝室の掲示欄に貼れそうだった。\n\n僕はというと、眼鏡が少し光を反射していて、やや間抜けに見えた。\n\nまあ、許容範囲内の間抜けだった。\n\n「悪くないですね」陳小雲は言った。\n\n「主に撮影者の腕がいい」朱銘が言った。\n\n彼は画面をさらに二秒見つめた。\n\n「いや待て」彼は言った。「俺、現実より元気そうじゃない？ 陳同学、こっそり美顔入れた？」\n\n陳小雲は彼を見た。\n\n「李同学のスマホです」\n\n李向陽がスマホを受け取り、確認した。\n\n「標準カメラ」\n\n朱銘はしばらく沈黙した。\n\n「じゃあ俺本人の素材がいいんだな」\n\n陳小雲はスマホを李向陽へ返した。\n\n「じゃあ、私は先に行きます」\n\nそう言って彼女が振り返ろうとした時、朱銘がふと何かを思いついたように、僕と陳小雲の間で視線を揺らした。\n\nその揺れは短かった。\n\nだが短いわりに、かなり問題があった。\n\n「ちょっと待って」朱銘は言った。「陳同学、今撮ってくれたし、礼尚往来でこっちも一枚撮ろう」\n\n陳小雲が止まる。\n\n「私を？」\n\n「そうそう」朱銘はやけに熱心だった。「姜嵐と知り合いなんだろ？ 軍訓も終わったし、記念に一枚。普通普通」\n\n僕は一瞬反応できなかった。\n\n反応した時には、李向陽がすでに僕を一度見ていた。\n\n袁林修も僕を一度見た。\n\n朱銘だけは、「僕は何かに気づきました」と顔に書いてあるのに、自分では自然だと思っている表情をしていた。\n\n僕は「そこまでしなくても」と言いかけたが、口まで来て、その拒否の方が写真を撮るより変に見える気がした。\n\n陳小雲の方が僕より落ち着いていた。\n\n少し考えてから、彼女は言った。\n\n「いいですよ」\n\nこうして事は決まった。\n\n僕と陳小雲が並んで立つと、二人の間には多すぎず少なすぎない距離が空いた。彼女は帽子を抱え、肩をまっすぐにして立っている。\n\n僕は急に手をどこへ置けばいいかわからなくなった。\n\n結局、ズボンの脇へ戻した。\n\n朱銘がスマホを持って二歩下がる。\n\n「姜嵐、そんなに固まるな」彼は言った。「写真撮るだけだぞ。張迪に立たされてるわけじゃない」\n\n「早く撮って」\n\n陳小雲がほんの少し笑った。\n\n二度目のシャッター音が鳴った。\n\n過度に偶然だったのは、そのシャッター音とほぼ同時に、グラウンド四方のスピーカーから前奏が流れ出したことだった。\n\n僕は一瞬、朱銘のスマホが学校の放送システムに接続されたのかと思った。\n\n「これ校歌か？」朱銘が訊いた。\n\n「うん」陳小雲は言った。「『麓山南路の風』」\n\n「なんでみんなわかるんだ」\n\n陳小雲は不思議そうに僕を見る。\n\n「姜嵐、志望校を書く前に師大の招生宣伝動画を見なかったんですか？」\n\n「見た」僕は即答した。「もちろん見た」\n\nもちろん見ていない。\n\nなにしろ本当に志望校を書いたのは僕ではない。\n\nしかしここで「招生宣伝動画って何ですか、食べられますか」みたいな顔をすると、さすがに雰囲気を壊す。\n\n朱銘がスマホを渡してきた。\n\n陳小雲は追及せず、写真を確認した。\n\n「いい感じです」\n\n彼女がスマホをこちらへ向ける。\n\n写真の中で僕と陳小雲が並んで立っているのを見て、僕はさっき彼女との距離が思ったより近かったことに気づいた。\n\nふいに、あの米黄色の傘を思い出した。\n\nあの時、雨音が世界を遠くへ押しやり、傘の下の小さな空間だけが切り取られたみたいだった。歩いている途中、手の甲が何度か彼女の袖口に触れ、肩も時々ぶつかり、すぐ離れた。\n\n触れたと言うには短すぎる接触。\n\nけれどそれらは、なぜか残ってしまった。\n\n「姜嵐？」\n\n陳小雲が僕を呼んだ。\n\n僕は我に返った。\n\n「どうした？」\n\n「今、どこを見ていました？」\n\n「何でもない」僕は言った。「校歌が催眠効果高すぎるのかも」\n\n「まだ歌い始めたばかりですよ」\n\nその時、スマホが震えた。\n\n取り出して見ると、霍学姐からのメッセージだった。\n\n【霍鈺：軍訓終わった？】\n\nこれは何かのテレパシーだろうか。\n\n【僕：終わりました。】\n\n少しして、彼女から返事が来た。\n\n【霍鈺：お疲れさま。】\n\nたった三文字。\n\nけれどその三文字を見た時、耳元の校歌も、人の声も、朱銘と陳小雲の話し声も、少し遠くへ押しやられたような気がした。\n\n【僕：学姐も今日はグラウンドにいたんですか？】\n\n送ってから、少し唐突だったかもしれないと思った。\n\n霍学姐は十数秒置いて返した。\n\n【霍鈺：いたよ。】\n\n続けてもう一通。\n\n【霍鈺：姜学弟、なかなかやるね。入学したばかりなのに、もうあんなに綺麗な女の子と知り合いなんだ。】\n\n僕は固まった。\n\n反射的に顔を上げ、周りを見回す。\n\n人混みは激しく流れていた。班導、教師、スタッフ、新入生が入り混じっている。\n\nけれど、あの人の姿は見えなかった。\n\n手の中のスマホがまた震えた。\n\n【霍鈺：探さないで。もう行ったから。】\n\nその一文を見下ろして、僕はさっき周囲をきょろきょろ見回した動きが、たぶんかなり露骨で、ついでにかなり間抜けだったのだと思った。\n\n「姜嵐、またぼーっとしてる」朱銘が言った。「軍訓終わったばっかで、魂がまだ退役手続き終えてないのか？」\n\n「だいたいそんな感じ」僕はスマホをしまった。「今、転業手続き中」\n\n「どこへ転業するんだ」\n\n「寝室で屍になる部署へ」\n\n「将来性がある」\n\n校歌がサビへ入る頃、朱銘がふと思い出したように言った。\n\n「そういえば、お前ら師大に来た理由って何？」\n\n話題の来方があまりに突然だった。\n\n陳小雲は少し考えた。\n\n「私は衡州出身で、雲夢からそこまで遠くないんです。家もあまり遠くへ行ってほしくなかったみたいで、省内で他にもっと合う学校もなかったから、師大に来ました」\n\n素朴で、合理的で、穴がなかった。\n\n僕は徽州出身で、雲夢とは山も川も隔てている。明らかに同じ理由は使えない。\n\nそこで僕は伝統芸能を発動した。\n\n火力の転移である。\n\n「朱銘同学は？」\n\nいつもは冗談の多い朱銘が、急に真面目な顔をした。\n\n僕がこれまで見たことのない真面目さだった。\n\nそのせいで僕も陳小雲も、思わず厳粛な気持ちになった。\n\n朱銘は遠く、グラウンドの端で揺れる旗を見つめ、ゆっくり口を開いた。\n\nその時の僕はまだ知らなかった。\n\nこれから朱銘が発表するのは、東北地方志に載せても差し支えない重要講話だということを。\n\n「話せば長い」彼は言った。「お前らは聞いたことがあるか――豆角バーを」\n\n「何ですか？」陳小雲が固まった。\n\n「え？」\n\n「知らなくても普通だ」朱銘は言った。「そういう場所にいる人間には見えないしな」\n\n陳小雲はさらに困惑した。\n\n「そういう場所？」\n\n「地域ヘイトだ」朱銘は声を低くし、急に厳粛な口調になった。「豆角バーというのは、東北人を地域ヘイトするための掲示板だ。毎日そこでデマを流し、我々東北人を中傷している」\n\n「え？」陳小雲が目を見開いた。「そんなにひどいんですか？」\n\n「非常にひどい」朱銘は言った。「だから俺は東北を離れ、はるばる南方へ来た。誤解された南方の友人たちへ、一つのことを証明するために」\n\n彼は一度止まった。\n\n風がグラウンドを渡り、校歌はまだ流れている。\n\n朱銘の表情はいっそう荘厳になった。\n\n「俺たち東北人は、彼らが言うような人間ではない！」\n\nそう言われると、僕まで少し感化されそうになった。\n\n感染源が豆角バーだという事実は、かなりどうかと思うが。\n\n「朱銘同学」陳小雲が慎重に口を開いた。「一つ聞いてもいいですか？」\n\n「聞け」\n\n「どうして豆角バーって言うんですか？」\n\n朱銘の表情が固まった。\n\n僕は突然、これは東北インターネットの秘史に触れてしまったのかもしれないと思った。\n\n「それは……」朱銘は咳払いした。「暇な連中が、東北人は海南へ行って豆角を盗むって言い出したんだ」\n\n「豆角を盗む？」\n\n「そう」\n\n陳小雲は二秒ほど沈黙した。\n\nそして真面目に訊いた。\n\n「じゃあ……東北人は本当に豆角を盗むんですか？」\n\n世界が静かになった。\n\n少なくとも、僕らの小さな範囲では静かになった。\n\n朱銘は陳小雲を見た。\n\n僕は朱銘を見た。\n\n「……」\n\n「え？ 私、何か変なこと言いました？」\n\n「……」\n\n「……」\n\n僕と朱銘はどちらも沈黙した。\n\nただ『麓山南路の風』だけが、人混みのざわめきと混じりながらグラウンドに響き続けた。何度も何度も、長く疲れた後でようやく緩んだ僕らの心を洗っていく。\n\n[麓山南路を吹き抜ける風]\n\n[僕らの青い日々を吹き抜けた]\n\n風が軍訓服を吹き、脱いだ帽子を吹き、そして朱銘が今どう守るべきかわからなくなった東北の尊厳を吹き抜けた。\n\n陳小雲は空気の不穏さに気づき、慌てて手を振った。\n\n「そういう意味じゃないんです！ 私はただ……」\n\n「大丈夫だ」朱銘は目を閉じた。「これは南下した東北人が必ず直面する魂の問いだ」\n\n「答えは？」\n\n「一部の人間の行為で東北人全体を代表することはできない！」\n\n「ですよね！ 私もそんなわけないと……えっ、違う！？」\n\n陳小雲は頷きかけた姿勢のまま止まった。\n\n彼女の表情が、「やっぱり地域ヘイトは当てにならない」から、「今の言葉、どこかおかしくなかった？」へ、少しずつ変わっていく。\n\n僕はとうとう笑ってしまった。\n\nその後、僕と陳小雲が天に誓って、ネット上の東北人に対する荒唐無稽な中傷を絶対に信じないと表明してから、朱銘はようやく満足そうに頷き、この話題を一旦放免した。\n\n「よし」彼は言った。「今日はここまでだ。東北イメージの体系的釈明については、また機会があれば特別講座を開く」\n\n言い終えると、彼はふと何かを思い出したように、声を少し落とした。\n\n「そういや、谷懿のやつ、今どこで生きてるのか死んでるのかもわからないな」\n\n朱銘はグラウンドの端で少しずつ散っていく人混みを見た。\n\n「あいつも今日いたらよかったのに」\n\n「あなたがここで心配している間、彼は軍訓から逃げてかなり自由にしていましたよ」\n\n陳小雲の声には、明らかに不満が混じっていた。\n\n「何！？」\n\n「何だって！？」\n\n僕と朱銘は同時に固まった。\n\n普通の意味で固まったのではない。\n\n目線から肩、口元に至るまで、一瞬システム応答を失ったような固まり方だった。\n\n「今なんて言った？」朱銘が訊いた。\n\n「彼がさっき上げた朋友圈、見ていないんですか？」\n\n朱銘はすぐスマホを取り出し、谷懿とのチャット画面を開いた。\n\n会話は以前送った二文で止まっていた。\n\n【お前どこだ？】\n\n【生きてたら1って返せ。】\n\nその下は空白だった。\n\n返信はない。\n\n朱銘の表情はいっそう衝撃的なものになった。\n\n「微信には返さない」彼は一字一句区切って言った。「でも朋友圈は上げる？」\n\nそして彼は、ほとんど悲憤に満ちた速度で朋友圈を開いた。\n\n最新の投稿は、やはり谷懿だった。\n\n写真の中で、彼は橋の上に立っている。背後には広い川面。\n\n位置情報は夏口。\n\n投稿文はこうだった。\n\n【いやあ、この川風すごいな。風邪ひきそうだ。】\n\n「谷懿、俺は（ここは自動消音）お前を（ここは自動消音）、お前マジで（ここは自動消音）だろ！！！」\n\n東北人のイメージは、この瞬間、完全に崩壊した。\n\n……\n\nほぼ同じ頃。\n\n夏口長江大橋の上で、谷懿がくしゃみをした。\n\n「誰が俺の悪口を言ってる？」\n\n夏口長江大橋は、川面を横切っている。\n\n新中国成立後に建設された最初の長江公鉄両用橋。\n\nそれは亀山と蛇山を結び、万里長江第一橋と呼ばれてきた。南北の鉄道を本当の意味でつなぎ、鋼鉄、工業、交通、国家意志についての巨大な証言として、かつて長江の上に架けられた橋だった。\n\n今もそれは、そこに架かっている。\n\n橋の下には長江があり、川沿いには古い工業都市の痕跡と、新しい都市の光を反射するビルのガラスがあった。\n\n旧時代の工業重鎮は消えたわけではない。ただ新しい看板、道路、高層ビルに何層も覆われ、今日の都市の下にまだ古い設計図として押し込められている。\n\nその時、谷懿はその設計図の上に立ち、髪を風でめちゃくちゃにされていた。\n\n手の中のスマホが震える。\n\n彼は朱銘のコメントを開いた。\n\n【朱銘：俺たちがお前退学になったと思ってたって知ってるか？】\n\n谷懿は川風に目を細め、顔の笑みをさらに灿然とさせた。\n\n……\n\n今回、僕らはすぐに谷懿の返信を受け取った。\n\n【谷懿：その方が君たちの軍訓にもっとドラマ性が生まれただろう？ 退屈な服従性テストにこれほど大きな楽しみを加えてやった俺へ、早く感謝したまえ。】\n\n朱銘はまたかなり汚い言葉を吐いた。\n\n陳小雲もコメント欄を一瞥し、真面目に評価した。\n\n「本当に殴りたくなりますね」\n\n「だろ」朱銘は言った。「陳同学、その判断はとても正確だ」\n\n僕は谷懿への糾弾には加わらなかった。\n\nただ、もう一度あの朋友圈を見た。\n\n少なくとも彼は退学になっていない。\n\n失踪もしていない。\n\nただ別の都市へ行き、かなり腹の立つやり方で、自分がまだ生きていることを証明しただけだった。\n\n胸の中の石がようやく落ちた。\n\n軍訓は、どうやら本当に終わったらしい。\n\n……\n\nだろうか。\n\nいや、まだだった。\n\nまだ一つ、終わっていないことがあった。\n\n……\n\n物理・電子情報学院は、陸上競技場の向かいの道からそれほど遠くないところにあった。\n\n歩いていけば明らかに近い距離なのに、僕が階段の下へ着いた時には、校歌はすでに背後へ置き去りにされていて、手の中のファイルだけが少し熱を持つほど握られていた。\n\n今日は軍訓が終わる日であると同時に、尹淵と約束した日でもあった。\n\nあの論文、あの導出、そして彼が言った言葉は、全部ファイルの中にある。\n\nそれを持ってきた僕は、まるで一度置かれた駒を、もう一度棋盤の中央へ戻そうとしているみたいだった。\n\nこの数日、僕は使える夜をほとんどすべて、あの論文に渡した。\n\n尹淵が送ってきたPDFは、最初は扉のない壁のようだった。英語、公式、上下の添字、ギリシア文字が混ざり合い、どの行も非常に礼儀正しい方法で僕に告げていた。\n\n君はここに属していない、と。\n\nそれでも僕は、少しずつ読み進めた。\n\n関連文献を大量に調べ、競赛用の教材まで引っ張り出し、さらに検索エンジンへ知能指数をさらけ出すような質問を何度も投げた。もっと多くの時間は、真夜中に草稿紙を前にしてぼんやりしていた。\n\nここで特別に霍学姐へ感謝したい。彼女が教えてくれた論文を読むソフトと公式整理のツールは、僕の命を救った。\n\n導出が本当に完成したのは、今日の明け方だった。\n\nその時、寝室は静まり返っていて、机の上には草稿紙が広がっていた。最後の結果そのものは大した分量ではない。紙一枚にも満たない。けれどそれを書くために、僕はほとんど手探りで歩ける道を全部踏んでいった。\n\n最後の一行の公式が文献中の表式と合ったのを見た時、僕は長い間固まっていた。\n\n自分がすごいと思ったからではない。\n\nこの両手が、本当にこういうものを書けるのだと、ふいに気づいたからだ。\n\n僕は、本当にやり遂げた。\n\n尹淵でさえ解けないと言っていた問題を解いた。力矩、角運動量、調和振動子、ラグランジュ方程式……聞いたことすらなかったはずの名詞の山を、僕はたった数晩で学んでしまった。\n\nしかも、その間、何度も奇妙な感覚があった。\n\nいくつかの概念は、僕にとって明らかに見慣れないものだった。けれど十分長く見つめていると、ある瞬間にふっと懐かしくなる。長い間歩いていなかった道みたいに、草は高く伸び、道標も風で傾いているのに、足裏はためらいの中でわずかな方向を見つける。\n\nたぶん、全部元の姜嵐が残したものなのだ。\n\n才能でも、記憶でも、身体の中に残った説明しきれない何かでも。\n\nとにかく、それは完全に僕だけの力ではなかった。\n\nそれでも僕は、それを嬉しく思った。\n\n「姜嵐。もしかしたら僕は、本当に君になれるのかもしれないな……」\n\n今日までに、僕は尹淵が最後にどんな反応をするか、頭の中で何度も練習していた。\n\n彼は驚くかもしれない。\n\n眉をひそめるかもしれない。\n\nそれでもなお粗を探し、どこか導出が厳密ではないと指摘するかもしれない。\n\n彼が結果を疑うなら、僕は途中過程を見せる。どこかの資料を写しただけだと言うなら、一歩ごとの物理的意味を説明する。彼が僕が解いたと認めるなら、せめてもう人前で物競の黒幕を持ち出して陰陽怪気に言わないでほしいと頼む。\n\nその台本はとても完整だった。\n\n完整すぎて、もし現実が本当にその通りに進んだら、僕は自分用に存在しないBGMを付けてもいいくらいだった。\n\n授業終了のベルが鳴ると、物電院の建物は学生を吐き出し始めた。\n\n学生たちは三々五々、入り口から出てくる。リュックを背負った人、スマホを見ている人、いま終わった授業の内容をまだ話している人。\n\nすぐに、僕は人混みの中に尹淵を見つけた。\n\n彼のそばには二人の同学がいて、何かを話している。\n\n白いシャツ、黒いズボン、温和な表情、落ち着いた姿勢。\n\nどんな出来事があっても、彼は半歩も速くも遅くも歩かないように見えた。\n\n僕は深く息を吸った。\n\n「尹学長！」\n\n尹淵は足を止め、振り向いて僕を見た。\n\n「姜学弟？」\n\n少し意外そうでもあり、ただ礼儀として気づいたことを示しただけのようでもあった。\n\n僕は前へ行き、手の中のファイルをさらに強く握った。\n\n「前に送ってくれたあの論文、中の公式、導出できました」\n\n「ほう」\n\n尹淵は頷いた。\n\n「ずいぶん真面目だね」\n\n僕は一瞬固まった。\n\n想定していた最初の反応と少し違った。\n\n正常な台本なら、ここで彼は少なくとも少し目を見開くか、半秒止まるか、あるいは「ありえない、どうして君が」という目を僕に向けるはずだった。\n\nけれど彼は、ただ頷いただけだった。\n\n「学長、僕は、完整な導出を書いたと言っているんです」\n\n僕はもう一度言った。\n\n「わかってるよ」\n\n尹淵は笑った。\n\n「褒めただろう？」\n\nあまりに自然に言われたので、僕は次の台詞をどこへ差し込めばいいかわからなくなった。\n\n「見ないんですか？」\n\n僕はファイルを差し出した。\n\n尹淵は低く一度見たが、受け取らなかった。\n\n「もちろん見たいよ」彼は言った。「ただ最近は本当に少し忙しくてね。導師の方からまた資料を何本かもらったし、学院の用事もある。時間がかなり詰まっているんだ」\n\nそう言いながら、彼の顔には少しだけ申し訳なさが浮かんだ。\n\nその申し訳なさは、あまりにも体面が整っていた。\n\n整いすぎていて、僕は怒っていいのかどうかさえわからなかった。\n\n「でも、僕らは前に約束しました」\n\n尹淵は僕を見た。\n\n表情は変わらない。\n\n「計画は変化に追いつかないものだよ、姜学弟」\n\nまたその口調だった。\n\n平静で、温和で、少しだけ学長が学弟を包み込むような。\n\nまるで僕の今の不甘心は、若い人間が真面目になりすぎた時に起こりがちな、小さな事故にすぎないみたいだった。\n\n「先にメールで送ってくれればいい」彼は言った。「時間ができたら見るよ」\n\n僕のファイルは宙に止まったままだった。\n\n「学長」僕は言った。「あの時、長いこと考えてもわからなかったと言いましたよね」\n\n「そうだよ」尹淵は言った。「だから君はとても真面目だと言ったんだ」\n\n「なら、せめて結果だけでも見てください」\n\n尹淵の横にいた同学が互いに目を合わせた。\n\n自分が今、少し見苦しいのはわかっていた。\n\nでも止められなかった。\n\nこの数日の明け方、草稿紙、乾いた目、線を引いて消してはまた書いた公式。その全部が、手の中の紙の束へ詰まっていた。\n\nそれらは自分で話すことができない。\n\nだから僕が代わりに、もう少しだけ前へ差し出すしかなかった。\n\n尹淵はようやくファイルを受け取った。\n\n一ページ目を開く。\n\n視線が紙の上に落ちたのは、たぶん十秒にも満たなかった。\n\nそして彼は閉じた。\n\n「たくさん書いたね」彼は言った。「態度がいい」\n\n態度。\n\nまた態度だった。\n\n僕は彼の手の中のファイルを見た。\n\n一ページ目の紙の角は、彼がさっき開いてすぐ閉じた位置で、まだ少し反っている。\n\nそこには、僕が午前三時に書いた最後の一行の公式があった。\n\nけれど彼は、十秒も見なかった。\n\n「ただ、今は本当に急いでいるんだ」尹淵はファイルを僕へ返した。「また機会があれば交流しよう」\n\n「でも――」\n\n「姜学弟」\n\n彼は僕を遮った。\n\n「またね」\n\n尹淵は僕の横を通りすぎていった。\n\n二人の同学も彼について離れていく。彼らは振り返らず、目立った好奇心も示さなかった。彼らにとってこれは、たぶん学長が一人の新入生に呼び止められ、少し気まずい会話をしただけのことだった。\n\n人の流れは、物電院の入り口から続いている。\n\n僕は階段の下に立ち、ファイルを持っていた。\n\n中身は数枚の紙にすぎない。数十ページの草稿から整理した最後の版で、薄い教科書一冊にも届かない厚みだ。\n\nけれど、それは急にひどく重くなった。\n\n僕はたくさんの言葉を用意していた。\n\n導出を説明する言葉。\n\n疑問へ答える言葉。\n\n尹淵が隙を見せた時、そこへ追いかけていくための言葉。\n\nけれどその全部が、喉の奥で詰まってしまった。\n\n「これ、何なんだよ……」\n\nその言葉を、僕は千回も万回も心の中でつぶやいた。つぶやくたび、言いようのない悲しさがあった。\n\n悲しくて、悔しくて、けれどどこにも受け止めてもらえない気持ち。\n\nそれを外へ追い払うこともできず、どこかへ隠すこともできない。\n\nそれは身のそばを掠める川風のように、輪郭も重さもなかった。僕はそれをはっきり目の前へ置くことさえできない。\n\n靴底が階段を踏み、鞄の紐が袖を擦り、笑い声が左から来て右へ散っていく。\n\n人波は絶えず僕のそばを流れていた。\n\nそれなのに僕は、彼らの存在を感じられなかった。大きな世界全体が、僕と平行な直線になって、僕とまったく関係のない一次元の空間を通り抜けていくみたいだった。\n\nふいに、自分こそがその行き場のない気持ちなのだと思った。\n\nどこへ行けばいいのかわからず、どこから来たのかも見つからない。\n\n僕は今、どこにいる？\n\n手の中で、すでに存在する意味を失ったファイルを反射的に握りしめ、慌てて周囲を見回した。\n\n目に入るのは、どこまでも知らない男や女たちだった。\n\n僕は今、どこにいる？\n\n人混みが画面の中から一筆ずつ消されていく。\n\nけれどそのどの線も、僕の上には落ちなかった。\n\n線、色、声。\n\nすべてが賑やかで、孤独とはまるで違うように見えた。\n\nけれどそのどれ一つとして、僕へ教えてくれなかった。\n\n僕は今、どこにいるのか。\n\nだから僕は、意味をなくした紙の束を握ったまま立ち尽くすしかなかった。\n\nどこでもない、誰もいないこの絵の中で。\n\n自分自身を思い出そうとして。\n\n何度も、何度も。\n\n何も得られないまま、自分自身を思い出そうとしていた。"},{"title":"第一章：手を挙げる前に","file":"第二巻/1、第一章.md","volumeTitle":"第二巻：最初に立てたフラグほど折れやすい","text":"「ジャングル、もうフィードするのやめてくれない？」\n\nその言葉が響いた時、教壇でチョークを持っていた尹淵は、ちょうど黒板に「班委選挙」と四文字を書き終えたところだった。\n\n字はなかなかきれいだった。\n\nもし後ろの席でスマホ画面に向かって熱烈に指示を飛ばしている同級生を無視できるなら、この光景はどうにか大学生活の正式な始まりらしく見えたかもしれない。\n\n残念ながら、現実の荘厳な儀式はたいてい脆い。\n\nたとえば、突然鳴りだしたゲームのボイスチャットひとつで、その場の空気はあっさり崩れる。\n\n尹淵のチョークが最後の一画で止まり、教室は一瞬静まった。全員が同時に気づいたのだ。どうやら、ここにあってはいけないものが混じっている、と。\n\nけれど後ろの彼には、その自覚がまったくなかった。\n\n「いや、兄弟、なんで敵タワーの下にフラッシュ切るんだよ。温もり届けに行ったのか？」\n\n声は特別大きいわけではないが、教室では十分にはっきり聞こえた。\n\n隣の朱銘がゆっくり振り返った。表情は、まるで新種の生物の誕生を目撃した人類代表だった。\n\n僕もつられて後ろを見た。\n\nその男子は黒い半袖を着て、髪は少し乱れていた。椅子の背にもたれ、片足を横棒に乗せている。\n\n意識はすべてスマホ画面の中にあり、指はすさまじい速さで動いていた。顔つきだけは異様に真剣で、目の前にあるのがただの一局ではなく、人類文明最後の防衛線なのだと言われても少し納得してしまいそうだった。\n\nある意味では、僕は少し感心した。\n\n尹淵が仕切る班会でマイクをつけて味方を罵る。その勇気は、もはや「余裕がある」という言葉では足りない。精神状態のバージョンが先に進みすぎて、一般人の環境ではまだ対応していないのだ。\n\n「この同学」\n\n尹淵はチョークを置いた。声は相変わらず落ち着いている。\n\n「今は班会の時間です」\n\nその男子は顔を上げて彼を見た。\n\n「あ、すみません」\n\nそう言って、またすぐ顔を下げた。\n\n「続けてください。こっちもうすぐ終わるんで」\n\n教室に、押し殺した笑いがいくつか漏れた。\n\n尹淵の笑みが短く止まった。\n\nその瞬間、僕は「拳が綿に当たる」という言い回しを少し理解した。\n\nもちろん、今回拳を振ったのは僕ではない。\n\nそして僕はかなり率直に認めたい。尹淵がこんな形で詰まるのを見るのは、少し複雑で、少し愉快だった。\n\n「では」\n\n尹淵はすぐにその停滞をしまい込み、改めて全員を見た。\n\n「皆さんも軍訓の状態から通常の学習生活へ戻りました。班の事務も早めに動かす必要があります。今夜は、物理班第一期の班委選挙を行います」\n\n彼が「動かす」と言った時、その言葉はとても自然だった。まるで一台の機械がこれから稼働する、と説明しているようだった。\n\n軍訓が終われば、少なくとも講壇に立って規則を告げる人からは少し離れられると思っていた。\n\n事実は、大学生活がそこまで親切ではないことを証明した。\n\n軍訓が僕たちを方陣に入れるものだとすれば、開学は僕たちを別の仕組みへ入れるものだった。\n\n時間割、出欠、班委、通知、総合評価、単位、活動申し込み。\n\nこれらの言葉は「気をつけ」「休め」「しゃがめ」「立て」よりずっと穏やかに見える。文明社会の書面らしささえある。\n\nけれどそれらもまた、こちらの肩を叩いてくる。\n\n同学、そろそろ走りましょう、と。\n\n「まず班長の選挙です」\n\n尹淵が言った。\n\n「希望する同学は自分から前へ出てください」\n\n教室に短い沈黙が落ちた。\n\nこういう沈黙は珍しくない。\n\n教師が「誰か答えてくれる人はいますか」と聞いた時にも現れるし、食堂のおばちゃんが「最後の鶏もも、誰にする？」と聞いた時にも現れる。\n\n違いは、後者はだいたい三秒以内に流血沙汰へ発展し、前者は集団的な死んだふりになることだ。\n\nただ、今の沈黙は長く続かなかった。\n\n李向陽が立ち上がった。\n\n彼が立つことは唐突ではなかった。全員が彼が立つと知っていたかのようで、椅子を引く音まで計画的に聞こえた。\n\n「だと思った」\n\n朱銘が小声で言った。\n\n「何を？」\n\n「李哥が出ない方が変だろ」\n\n僕はうなずいた。\n\n確かに。\n\n班長という役職が選択問題なら、李向陽は試験用紙の裏に最初から印刷された標準解答みたいだった。\n\n彼は教壇へ上がり、振り返って立ち、軽く皆にうなずいた。\n\n「皆さん、こんばんは。李向陽です。向かうの向、太陽の陽です」\n\n声は高くないが、教室全体に届く安定感があった。\n\n「鄂州漢陽の出身です。高校ではずっと班長を務め、学生会学習部にも所属していました。校内優秀学生幹部、三好学生などの表彰も受けています。入学後も、班導や辅导员の通知、資料整理を少し手伝ってきました」\n\nそこまで話した時、前の方の何人かはもううなずき始めていた。\n\n僕たちが大学生活の始まり方をまだ理解していない間に、李向陽はすでに自分の位置を静かに敷いていたのだと気づいた。\n\n不思議ではない。\n\n新しい環境に入った時、まず食堂と宿舎とエアコンのリモコンを探す人がいる。\n\nまず組織構造を探す人もいる。\n\n「もし班長に選んでいただけるなら、学院、書院、先生方、そして同学の間の連絡をしっかり行い、各種通知を迅速に伝え、班の事務を調整し、明確で効率的な情報経路を作りたいと思います」\n\n李向陽は続けた。\n\n「同時に、皆さんと一緒に、優秀で、団結し、実行力のある物理班を作っていきたいです」\n\n優秀。\n\n団結。\n\n実行力。\n\nどれも間違っていない。\n\nむしろ、すべて正しい。\n\nただ、それらがきっちり並べられると、僕にはまた何かの表が見えてくる気がした。表の上には「班級建設目標」と書かれ、その下にはチェックを待つ空欄がある。\n\n「以上です。ありがとうございました」\n\n李向陽は軽く礼をした。\n\n拍手はすぐに起こった。\n\n僕も拍手した。\n\nその拍手にはもちろん寮の仲間としての気持ちがある。\n\n入学してから、李向陽は確かに僕たちを何度も助けてくれた。查寝の注意、休暇手続き、袁林修が怪我をした時の証明や診断書やチャット記録の整理。校医院の受付より整然としていた。\n\nけれど、そういう事情を抜きにしても、彼の演説には大きな問題がなかった。\n\n堅実で、完整で、経験がある。\n\nまるで形式審査を通過済みの申請書だった。\n\n李向陽が教壇を降りた時、教室の反対側から一人の女子が立った。\n\n立ち上がり方は軽やかで、「空気もここまで来たなら、私も少し」という自然さがあった。\n\n王伊。\n\nエアコンのリモコン事件の時、彼女はA601のリモコンを持って僕たちに謝りに来た。軍訓靴を配る夜には、サイズが合わない女子のためにスタッフとやり取りしていた。\n\nその時から印象は残っていた。彼女の話し方には、相手に断りづらくさせる軽さがある。\n\nそれでも今、全班の前に立つ彼女を見ると少し意外だった。\n\n服装は派手ではない。淡い色の上着にサロペット。\n\n「皆さん、こんばんは」\n\n彼女は笑って言った。\n\n「王伊です。伊人の伊。二文字が硬いと思ったら小伊でもいいです。もちろん、初対面で小伊は近すぎると思う人は、まず王伊同学から始めてもらって構いません。私は社交距離をとても尊重する人間です」\n\n教室に笑いが起こった。\n\n王伊本人も笑った。たぶん今の言葉は、彼女自身も少し面白かったのだ。\n\n「さっき李向陽同学の話はとても正式で、とても優秀でした。下で聞いている時、学生会主席選挙に迷い込んだのかと思いました」\n\n彼女は李向陽の方をちらりと見た。\n\n「なので先に言っておきます。私はあんなにすごい履歴はありません。見た目からしてとても頼れそうで、大人っぽくて、Excelをすごくきれいに作れそうな人を選びたいなら、李同学は本当に強い候補です」\n\nまた笑いが起こった。\n\n李向陽も席で礼儀正しく笑った。\n\nただ、その笑みは短かった。\n\nポップアップ通知が出て、内容を読む前に自動で閉じたみたいに。\n\n「でも、班長について、私は少し考えがあります」\n\n王伊は両手を教卓の端に置き、少し身を乗り出した。本当に皆と話しているようだった。\n\n「班長は指導者ではないと思います。少なくとも、まず指導者であるべきではありません」\n\n教室は少し静かになった。\n\n「私たちはもう大学生です。ここへ来て、また小さな担任を探したいわけではないですよね。班長はもっと、サービスをする人に近い。面倒なことを少し早めに処理する人。何か聞きたい時、遠慮せずに声をかけられる人」\n\n彼女は大げさな手振りを使わず、ただ台下を見ていた。\n\n人を見る時、彼女は演説しているというより、台下の誰かと本当に会話しているみたいだった。同じ教室に座っているだけなのに、「今、自分を見たのでは」と錯覚しやすい。\n\nもし僕があそこに立ったら、たぶん後ろの壁のどこか存在しない点を見つめ、弔辞みたいに原稿を読むだけだ。\n\n「高校でも班干部をしたことがあるので、班の事務には小さなことが多いと知っています」\n\n王伊は続けた。\n\n「教室の場所がわからない、資料の提出を忘れた、活動時間を聞きたい、通知にある『原則として』が結局どういう意味なのかわからない」\n\n何人かが笑った。\n\n「一つ一つは小さいです。でも聞いている本人にとって、その瞬間はけっこう困ることだったりします。だから、もし私が班長になったら、皆さんがそういう小さな困りごとを、とても自然に私へ聞けるようにしたいです。遠慮しなくていいし、班委を群公告の上に座る謎の生物だと思わなくていい」\n\n「もちろん、私も絶対に間違えないとは言いません。間違えたら教えてください。メンタルはそこそこ強いです。ただし夜中三時に『いる？』って送ってきて、次に『やっぱ何でもない』はやめてください」\n\n今度は笑いが大きくなった。\n\n朱銘まで拍手した。\n\n「この子、面白いな」\n\n彼が小声で言った。\n\n僕はうなずいた。\n\n確かに面白い。\n\n李向陽の演説は、彼に任せれば物事がうまく回ると信じさせる。\n\n王伊の演説は、彼女に任せれば、物事が少し疲れにくくなる気がする。\n\nどちらも魅力的だった。\n\nただ後者は夏に冷えた炭酸を一口飲むようなもので、それで腹が満たされるわけではないとわかっていても、泡が上がってくる瞬間、人はまず気持ちよくなる。\n\n「最後に、班長選挙が今夜ここに立っている理由ではあります。でも、それがこの班に来た理由の全部ではありません」\n\n王伊は少し止まった。\n\n「皆さんと同学になれたこと自体、とても幸運だと思っています。これから四年間、私が班長かどうかに関係なく、皆さんと仲良くやっていけたら嬉しいです」\n\n彼女は目を細めた。\n\n「よかったら、票を私にください。投げられなくても大丈夫です。皆さんの顔を頑張って覚えて、今度食堂で会った時、傷ついていないふりをします」\n\n拍手と笑いが同時に起こった。\n\n王伊が降りる時、女子の何人かが小声で「小伊がんばれ」と言った。\n\n僕も拍手していた。\n\n拍手しながら、王伊が席へ戻り、隣の女子の椅子の背を自然に支えるのが見えた。相手が立たなくても彼女のために道を空けられるように。\n\nその動きは自然だった。\n\n自然すぎて、たまたま見ていなければ、たぶん何の意味も持たなかった。\n\n「ほかに班長へ立候補する同学はいますか」\n\n尹淵がまた教壇に立った。\n\n誰も動かなかった。\n\nそれは当然だった。\n\n李向陽と王伊の後で上がるには、勇気だけでなく、現実に床へ押しつけられても平気な楽観精神が必要だ。\n\n「では投票します」\n\n尹淵はチョークを取り、黒板に二つの名前を書いた。\n\n李向陽。\n\n王伊。\n\n「公平を保つため、二人の候補者は教室の外で少し待ってください」\n\n李向陽が立つ時、短く尹淵を見た。\n\nその動きは目立たなかった。\n\n僕が側面に座っていなければ、気づかなかったかもしれない。\n\n王伊はすぐにドアへ向かった。出る前、台下に手を振りさえした。まるでバラエティ番組の最終投票に参加しているようだった。\n\n教室のドアは完全には閉まらず、廊下の灯りが細い白い線になって漏れていた。\n\n「一人一票。重複投票しないように」\n\n尹淵が言った。\n\n「李向陽を班長に支持する同学は、挙手してください」\n\n何本かの手がすぐに上がった。\n\n軍訓中によく李向陽と話していた男子もいた。よく知らない人も何人かいたが、手を上げる速さからして、臨時で決めたわけではなさそうだった。\n\n李向陽の票は十数票まで伸びた。\n\n僕は席で机の縁に指を置き、自分がすぐに手を上げていないことに気づいた。\n\n本来なら、あまりよくない。\n\n人情で言えば、李向陽は寮の仲間だ。\n\n能力で言えば、彼は確かに班長に向いている。\n\n理性で言えば、始まったばかりの班で、事務を熟知し堅実な人に任せるのは悪いことではない。\n\nけれど王伊の「班長は指導者ではない」という言葉が頭の中を揺れていた。\n\n李向陽の履歴より重いとは限らない。けれど、人に票を渡したいと思わせる力があった。\n\n朱銘を見た。\n\n朱銘は手を上げていなかった。\n\n袁林修は少し前に座っていて、動きは見えない。\n\n李向陽はドアの外に立ち、表情は扉で隔てられていた。\n\n試験で主観問題に出会った時のような苦しさがあった。\n\nもっと苦しいのは、この主観問題が今後同じ寝室で暮らす可能性があることだ。\n\n「はい、下ろしてください」\n\n尹淵が言った。\n\n僕が道徳、人情、寮の関係、班級治理の間で複雑な計算を終える前に、第一回の投票は終わった。\n\n「王伊を班長に支持する同学は、挙手してください」\n\n今度は、手の上がり方が少し遅かった。\n\nだが、だんだん増えた。\n\nためらう草が、風に押され、また少しずつ立ち上がるみたいだった。\n\n朱銘が手を上げた。\n\nとても迷いがなかった。\n\n僕はその手を見て、彼の「考えすぎない」力を少し羨ましく思った。\n\n僕はまだ動かなかった。\n\n王伊に投げたくないわけではない。\n\n李向陽に投げたいわけでもない。\n\nただその瞬間、情けないことに、誰も怒らせない選択をしてしまった。\n\nこれがたぶん、成人後はじめての政治実践だ。\n\n民主が天賦人権なら、女媧が僕を作る時、たぶん思想の工程を少し抜かしたのだろう。\n\n「はい」\n\n尹淵は教室を見回した。\n\n「王伊、十三票」\n\n教室に少しざわめきが起こった。\n\n僕も一瞬固まった。\n\n李向陽はさっき十二票だったはずだ。\n\nもし記憶違いでなければ、この票数なら王伊が勝っている。\n\nだが尹淵はすぐに結果を発表しなかった。\n\n彼は教室を見直した。\n\n「何人か投票していない同学がいます。集計誤差を避けるため、未投票の同学だけ再投票してください」\n\nこれは何だよ……。\n\n逃げ切ったと思ったら、今度は人前で選ばされる。\n\n僕は口を歪めた。ついていない。\n\n「李向陽を支持する同学は、挙手してください」\n\n僕は手を上げた。\n\n動きは速くないが、後悔できるほど遅くもなかった。\n\n少し離れたところで、高いポニーテールの女子も動いたように見えた。手が机から離れ、半空で止まり、すぐに戻った。\n\n尹淵の視線がこちらを通った。\n\n「李向陽、十四票」\n\n僕は固まった。\n\n十四？\n\n今、手を上げたのは明らかに僕だけだった。\n\n思わずその高ポニーテールの女子を見た。彼女も顔を上げ、自分の手を見てから教壇を見た。\n\n「王伊を支持する同学は、挙手してください」\n\n誰も動かなかった。\n\n王伊と李向陽はまだ外に立っている。廊下を誰かが通る足音が、扉越しに少しくぐもって聞こえた。\n\n尹淵が口を開こうとした時、後ろからまた声が炸裂した。\n\n「サポート、ワードは？　バッグに記念品入れてんの？」\n\n教室中が再び振り返った。\n\n黒い服の男子は、自分がさっき何を約束したか完全に忘れているらしい。\n\n指は画面上をすばやく滑り、眉は寄っていて、顔全体に「世界はひどいが俺はまだ救おうとしている」と書いてあった。\n\n尹淵がついに眉をひそめた。\n\n「同学、まだ班会中です」\n\n「わかってます、わかってます」\n\nその男子は顔も上げない。\n\n「もうすぐ終わる」\n\n「班会の方を言っています」\n\n「あ」\n\n彼はようやく顔を上げ、尹淵と周囲を見た。\n\n「今どこまで？」\n\n尹淵は答えなかった。\n\nこの人と話し続けることが、自分の生命時間の浪費に当たるかどうかを判断していたのだと思う。\n\n前の方で誰かが小声で言った。\n\n「班長投票」\n\n「班長？」\n\n黒い服の男子は少し考えた。\n\n「さっき、班長はサービス員だって言ってたの誰？」\n\n誰かが小声で「王伊」と言った。\n\n「じゃあ彼女に投げる」\n\nそう言って、彼は片手を上げた。\n\nもう片方の手はまだスマホを操作している。\n\n「サービス員の方がリーダーより耳にいい」\n\n教室は半秒静まった。\n\n尹淵はその高く上がった手を見て、口元を少し硬くした。\n\n「王伊、十四票」\n\n彼は言った。\n\n「同票です」\n\n続けようとした時、その高ポニーテールの女子が口を開いた。\n\n「学長、私はさっき投票していません」\n\n声は大きくなかった。\n\nけれど、とてもはっきりしていた。\n\n笑いが止まった。\n\n尹淵が彼女を見た。\n\n僕も見た。\n\n彼女は王伊がもともと座っていた席の隣にいた。高いポニーテールはきれいに結ばれ、顔立ちは清潔だった。その一言を言った後、慌てて説明を足すこともなく、手を机に戻した。\n\n「確かですか」\n\n尹淵が聞いた。\n\n声はまだ温和だった。\n\n「確かです」\n\n彼女は言った。\n\n「私は誰にも投票していません」\n\nその言葉が落ちると、教室の空気は少し微妙になった。\n\n扉の外は相変わらず静かだった。\n\nただ、この扉の遮音性がどれほどなのかはわからない。\n\n尹淵は数秒止まった。\n\n「わかりました」\n\n彼は言った。\n\n「では票数を訂正します。李向陽十三票、王伊十四票。王伊が物理班班長に当選です」\n\n拍手が起こった。\n\n尹淵はドアへ行き、開けた。\n\n王伊と李向陽が戻ってきた時、教室の熱気に表情が一瞬追いつかなかった。\n\n結果を聞いた王伊の驚きは、作り物には見えなかった。\n\nまず目を大きくし、それからすぐ口元を手で押さえた。本当に自分が勝つとは思っていなかったようだった。\n\nだが次の瞬間にはもう表情を整え、笑って皆に礼をした。\n\n「ありがとうございます」\n\nその後の班委選挙は王伊が進行した。\n\n教壇に立つと、彼女は尹淵を一度見た。\n\n「では、続けますね？」\n\n尹淵はうなずき、前列に戻った。\n\n李向陽はすぐにまた教壇へ上がり、学習委員に立候補した。\n\n今回は対抗者がいなかった。\n\n発言はさっきよりずっと短かったが、やはり明確で、妥当で、筋が通っていた。\n\n王伊が先に拍手し、拍手が起こった時、李向陽がわずかに頭を下げるのが見えた。彼が本当に失望していたのかは、僕にはわからなかった。\n\n朱銘もその後、団支書に立候補した。\n\nこれはかなり驚いた。\n\n彼は教壇に立ち、頭をかきながら、特に立派な履歴はないが、今後走り回ること、物を運ぶこと、活動の調整などが必要なら呼んでほしい、と言った。\n\nその発言は実直だった。実直すぎて選挙演説というより、食堂の窓口でおばちゃんに「本当に二人前食べられます」と証明しているみたいだった。\n\n結局、彼は負けた。\n\n声が甘く、準備も十分な小柄な女子に負けた。\n\n降りてきた時、彼は特に落ち込んでいなかった。席に座ると小声で言った。\n\n「まあ、参加することに意義がある」\n\n「いつから団支書に興味あったの？」\n\n「さっき」\n\n「……さっき？」\n\n「うん。王伊が班委はサービスする人だって言っただろ。聞いたら、なんかそんなに面倒なものでもなさそうだと思って」\n\n彼は真面目だった。\n\n「でも、あの子の発表は確かに俺よりそれっぽかった」\n\n「お前、原稿も書いてないじゃん」\n\n「それはそう」\n\n班会が終わる頃、後ろの男子のゲームもようやく終わりそうだった。\n\nなぜなら彼が長くため息をついたからだ。\n\n「終わった」\n\n朱銘が振り返った。\n\n「同学、さっきずっとゲームしてたの？」\n\n「そうだけど」\n\n程昕亮はスマホをポケットに入れ、実に堂々としていた。\n\n「それでついでに投票までしたの？」\n\n「公民権、天賦人権だから」\n\n「お前、天賦人権とか知ってるの？」\n\n程昕亮は不機嫌そうに朱銘を見た。\n\n「兄弟、俺はゲームしてるだけで、文盲じゃない」\n\n朱銘は一瞬固まり、すぐには返せなかった。\n\n僕は横で笑いそうになった。\n\n「同学、お名前は？」朱銘が聞いた。\n\n「程昕亮」\n\n彼は言った。\n\n「日偏に斤の昕、明るいの亮」\n\n事実として、この程昕亮同学は、わずか一回の班会で、「十年祖安、両親健在」から「決定的な一票で乾坤を定める」までの華麗な転身を成し遂げた。\n\nただし、その転身はどう見ても、転んだついでにトーマス旋回を決めたようにしか見えなかった。\n\n……\n\n翌日の昼、僕たちは木蘭食堂で谷懿を見た。\n\n先に見つけたのは朱銘だった。\n\nその時、僕はトレーを持って空席を探していた。朱銘が急に足を止め、窓際の席をじっと見た。\n\n「うわ」\n\n突然の国粋に驚いて、僕はトレーを落としかけた。\n\n「銘哥、いきなり大声出すのやめてくれない？　昼飯を床に捧げるところだったんだけど……」\n\n朱銘は僕の不満を完全に無視し、さらに大きな、少し震えた声で言った。\n\n「早く、早く見ろ！　あれ、あいつじゃねえか！？」\n\n指の先を見る。\n\n窓際の席で、巻き毛の男子が韭菜盒子をかじっていた。\n\n頭の中が一瞬、ブンと鳴った。\n\n僕たち二人の足音が速く近づくと、谷懿も不速の客に気づいた。\n\n顔を上げた彼の表情はまず明るくなり、すぐに非常に手慣れた無実顔へ変わった。\n\n「よっ、奇遇だな」\n\n朱銘はトレーを彼の向かいに置いた。僕も座り、椅子の脚が床をこすって耳障りな音を立てた。\n\n「奇遇じゃねえよ」\n\n谷懿は身体を少し引いた。\n\n「銘哥、食堂は公共の場だ。文明に注意しよう」\n\n「お前が文明を語るな」\n\n朱銘は彼を指した。\n\n「メッセージを送っても返さない。寮に行ったら、ルームメイトはお前の机が空になってるって言う。なのに朋友圈はちゃんと更新してる。これは何の行為だ？」\n\n「文学的意味での隠遁？」\n\n「存在的意味での自殺志願だろ」\n\n「今回は朱銘同学に同意します」\n\n横から声がした。\n\nそこで僕はやっと、隣にもう一人知り合いがいることに気づいた。\n\n陳小雲の前には麺が置かれていた。箸は碗の縁に止まり、麺からはもう湯気が上がっていなかった。\n\n「小雲、君までそう言うの？」\n\n「だって、本当に殴られても仕方ないから」\n\n陳小雲の声は落ち着いていて、音量も上げていない。\n\nそれでも谷懿はその数文字にひどくむせたようだった。\n\n彼は鼻を触った。\n\n「わかった、わかった。この件は考えが足りなかったと認める」\n\n「考えが足りなかっただけ？」\n\n僕は隣に座り、彼を見た。\n\n谷懿は韭菜盒子をもう一口かじり、口の中に物があるまま弁解した。\n\n「じゃあ何だよ。道徳的に腐敗したところまで上げる必要ある？」\n\n「検討の余地はある」\n\n谷懿は咳き込んだ。\n\n「お前ら、軍訓終わってから攻撃性上がりすぎだろ」\n\n「だって俺たちは本当に軍訓したから」\n\n「誰かさんと違って、主席台で出力したら、そのまま外へ遊びに行ったわけじゃない」\n\nその言葉の後、谷懿の笑みが少し薄くなった。\n\nほんの少しだけ。\n\n注意して見なければ、韭菜にむせただけだと思う程度に。\n\n「遊びに行ったわけでもない」\n\n「夏口へ行って、その周りを少し回った」\n\n「夏口？」\n\n「うん」\n\n谷懿は僕を見た。\n\n「朋友圈に上げただろ。長江大橋も知らないのか」\n\n「写真だけ上げて返信しないのは、何か新型の社交礼儀？」\n\n「神秘感の維持だ」\n\n「殴られ感の維持に見える」\n\n谷懿は笑い、それ以上は返さなかった。\n\n学校の谷懿への処理は、僕たちが想像していたよりずっと軽かった。その落差は、むしろ少し……拍子抜けするくらいだった。\n\n面談、反省文、訓練停止。\n\n反省文は提出した。\n\nただし……。\n\n「現代技術も人類自身の一部だ。石器や青銅器が四肢の延長にすぎないように」\n\n「AIで書いたのか？」\n\n「言い方が狭い」\n\n朱銘は呆れて笑った。\n\n陳小雲はそれを聞いて、眉を少し寄せた。\n\n「本当に、それでいいと思ってるの？」\n\n谷懿の指が紙ナプキンの端で止まった。\n\n「反省文は、他人に向けて書くものじゃない」\n\n「彼らが欲しいのが悔い改めの姿勢なら、形式の整った姿勢を渡す。お互い時間の節約になる」\n\n「反省文のことを言ってるんじゃない」\n\n谷懿はすぐには返さなかった。\n\n木蘭食堂の昼は人が多い。受け取り口では誰かがカードをかざし、トレーを持ち、仲間に席を取っておくよう呼んでいた。油煙と飯菜の匂いが混ざって、空間全体を賑やかで鈍いものにしていた。\n\n僕は谷懿がいなくなった後のことを大まかに話した。朱銘が横から補足し、補足しているうちに、張迪に対する東北地方色のある挨拶まで混ざり始めた。\n\n袁林修の転身が半拍遅れ、張迪がそこを掴んだこと。診断書の「激しい運動を減らすことを勧める」という曖昧な文言を何度も突かれたこと。朱銘が口を出して一緒に罰を受けたこと。張迪が同学を押した時の、軽い「動作を直しただけ」という言葉。さらに、僕たちがどう同学に連絡し、何人かの話をまとめ、食堂の入口で毛鋭に出会い、どうにか口を開いたかということ。\n\n朱銘の話は完整ではなかった。\n\nけれど、ある出来事は完整でないほど、当時の気持ちと状況を思い出させる。\n\nこの時、谷懿は珍しく茶化さなかった。朱銘がもう話すことを思いつかなくなった時、ようやく顔を上げた。\n\n彼は朱銘を見て、僕を見た。\n\n「やるじゃん」\n\n「子どもたち、ついに成長したな。父は嬉しいぞ」\n\n「もう一回調子に乗ってみろ？」\n\n朱銘がすぐに目をむいた。\n\n谷懿は咳払いした。\n\n「つまり、あの日俺が主席台で苦心惨憺、命を代価に諸君の眠れる魂を呼び覚ました甲斐があったということだ」\n\n「お前のは格好つけ失敗して反殺されただけだ」\n\n「叙事角度の違いだ」\n\n谷懿は笑ったが、すぐにその笑みを収めた。\n\n「張迪は学校でどう扱われた？」\n\n「正式な説明はない」\n\n朱銘は冷笑した。\n\n「教官に臨時の予定があるとか言って、後ろは別の人に変わった。ただ、もともと最後の汇演まで一日しかなかったけどな」\n\n「なら、表面上は勝った」\n\n朱銘は眉をひそめた。\n\n「表面上って何だよ」\n\n「人が替わって、その後誰も彼に罰されなかった。もちろん少しは勝った」\n\n谷懿は紙ナプキンを丸め、トレーの端に置いた。\n\n「でも、もし彼らが正式な説明を一言もしないなら、この件は起きなかったことになる」\n\n誰もすぐには返さなかった。\n\n朱銘は口を開きかけ、最後には眉を寄せて聞いた。\n\n「じゃあ、どうしろって？」\n\n谷懿はすぐには答えず、別の話をし始めた。\n\n「夏口で、廃棄された建物を一つ見た」\n\n「入口の壁にまだ標語が残っていた。文字はほとんど落ちかけていた。その隣には今の都市の車が行き交っているのに、あの壁の前で足を止める人はほとんどいない」\n\n僕たちは明らかに、彼が何を言いたいのかわからなかった。\n\n「待て待て！　夢に出てきたことをそのまま喋ってるのか？」\n\n「あるものは名前を変え、塗り直し、看板を替えるだけで、人々は別物だと思う」\n\n陳小雲の箸を握る手が、少しだけ強くなった。\n\n僕はまだ完全には聞き取れなかった。\n\nだが谷懿はそれ以上説明せず、またいつもの腹立たしい顔に戻った。\n\n「とにかく、俺は無事に帰還した」\n\n「この偉大な歴史的瞬間を祝うために、お前らはミルクティーを奢るべきじゃないか？」\n\n朱銘は彼を三秒じっと見た。\n\n「拳なら奢ってやるけど？」\n\n「銘哥、君は暴力的すぎる」\n\n「もう一回言ってみろ？」\n\n「ミルクティーは少糖でいいと言った」\n\n陳小雲は顔を下げ、すでに固まりかけた麺を少し箸で持ち上げた。\n\n笑ってはいなかった。\n\nでも、口元がほんの少し動いたように見えた。\n\n……\n\n軍訓が終わってから、雲夢の夜はようやく昼間ほど攻撃的ではなくなった。\n\n熱はまだ完全には引いていない。校門の外を歩くと、靴底にはまだ昼の温度が少し残っていた。\n\n雲夢師大は、伝統的なキャンパスのようにはっきりした境界を持たない。書院の門を出ればすぐ広い道があり、コンビニ、奶茶店、焼き串屋、果物屋が両側に詰まり、夜を明るくしている。\n\nその明るさは静かではなかった。\n\n電動バイクが路肩をかすめ、配達箱の反射テープがちらちら光る。焼き串の炭火は風で赤くなり、煙が鉄網から上がって、クミンと唐辛子の匂いを空気に貼りつけていた。\n\nバス停の広告は新しいポスターに替わっていた。画面の人は何のプレッシャーもなさそうに笑っている。班委選挙にも参加しないし、谷懿の「廃工場」の比喩を理解する必要もなさそうだった。\n\n僕は氷水を買おうと、コンビニに入った。\n\n入口の自動ドアが開閉し、人の出入りに冷気が少し持ち出される。入ろうとした時、中から先に一人の女子が出てきた。\n\n彼女が顔を上げ、ちょうど僕と目が合った。\n\nその瞬間、米色の古い傘がまだ寮に置きっぱなしだと思い出した。\n\n返すちょうどいい機会を、まだ見つけられていない。\n\n「こんな時間に出てきたの？」\n\n「学姐だって同じじゃないですか」\n\n「寮の下の自販機がまた空だったの」\n\n僕は彼女の手の冷えたミネラルウォーターを見た。ボトルの水滴がラベルに沿ってゆっくり落ちていた。\n\n「あなたは？」\n\n「僕は……散歩です」\n\n嘘ではなかった。\n\n霍学姐は追及しなかった。\n\n彼女は僕の隣へ来て、とても自然に並んで歩き出した。\n\n「班委選挙、終わったって聞いたよ」\n\n「はい」\n\n「結果は？」\n\n「王伊が班長、李向陽が学習委員です」\n\n「王伊？」\n\n「うちの班の女子で、かなり社交が上手いです」\n\n「その評価、慎重だね」\n\n「僕、まだ人を評価するのがあまり上手くないので」\n\n霍学姐は笑った。\n\n「じゃあ李向陽は？」\n\n「もともと班長に立候補してました」\n\n「落ちたんだ」\n\n「はい」\n\n「あなたは彼に入れた？」\n\n彼女は何気なく聞いた。\n\n僕はなぜか少し後ろめたくなった。\n\n「二回目は入れました」\n\n「一回目は？」\n\n「……間に合いませんでした」\n\n霍学姐が首を傾けて僕を見た。\n\n僕は正直に補足するしかなかった。\n\n「間に合わなかったというより、誰に入れるべきか考えてたら、時間が過ぎました」\n\n「あなたらしい」\n\n「それ、褒めてます？」\n\n「褒めてない」\n\n返事が速かった。\n\n僕はため息をついた。\n\n「せめて少し迷ってくださいよ、学姐」\n\n「でも、さっきあなたは迷ったことを後悔してたでしょう？」\n\n反論できなかった。口論の実力差は、僕と霍学姐の間にまだいくつもの段位がある。\n\n僕たちはそのまま歩いた。\n\n大学城の路肩には香樟が並び、葉は灯りの下で黒く光っている。木の下にはシェア自転車がたくさん停まっていて、外側に倒れた一台のカゴには、くしゃくしゃのチラシが半分だけ入っていた。\n\n「程昕亮って同学もいます」\n\n僕は言った。\n\n「班会でずっとゲームしてたのに、最後は王伊の決定的な一票を入れました」\n\n「へえ」\n\n「その同学、将来性がありそうだね」\n\n「どの方面ですか？」\n\n「予想外を作る方面」\n\n「それは確かに。彼は今日、二十一級物理班の民主史に消せない貢献を残しました」\n\n「じゃあ、あなたは？」\n\n「僕？」\n\n「あなたは何を残したの？」\n\n「非常に不名誉な棄権記録を残しました」\n\n「それもあなたらしい」\n\n「学姐、今夜もう二回目です」\n\n「便利だから」\n\n彼女は堂々と言った。\n\n彼女は時々、人を言い返せなくするのが本当に上手い。\n\nしかも強い言い方ではなく、笑いを含んでいるので、反論する方が大げさに見えてしまう。\n\n「でも、すごい女子が一人いました」\n\n僕は少し考えて言った。\n\n「彼女はたぶん投票していなかったんです。でも尹淵が彼女を李向陽の票に数えた。そしたら、その場で自分は投票していないって言いました」\n\n「全班の前で？」\n\n「はい」\n\n「それは確かにすごい」\n\n霍学姐の声が少し真面目になった。\n\n「名前は？」\n\n「知りません」\n\n「同じ班なのに、名前を知らないの？」\n\n「学姐だって班導じゃないですか」\n\n僕はやっと反撃の機会を掴んだ。\n\n「なんで知らないんです？」\n\n霍学姐は僕を見た。\n\n「班導は、あなたたちが時間通り来たかを記録するだけです」\n\nさらに一言足した。\n\n「それに、あなたたちの班の签到表はずっと尹淵のところにあるし」\n\n言い終えると、とても無実そうに瞬きした。\n\nせっかく掴んだ小さな反撃の機会は、彼女に軽くほどかれてしまった。\n\n「まだ開学したばかりですからね」\n\n「それもそう」\n\n彼女はうなずき、話を戻した。\n\n「でも、彼女は正しいことをした」\n\n「どこが？」\n\n「自分の沈黙を他人に持っていかせなかった。自分の代わりに選ばせもしなかった」\n\n霍学姐は前の道を見ていた。\n\n「それだけで、もう多くの人を超えている」\n\n少し間を置いて、彼女は言った。\n\n「特に、沈黙に慣れた時代ではね」\n\nその時の僕は、あの同学を少しこだわりが強い人だと思っただけだった。\n\nけれど霍学姐にそう言われると、「こだわり」という言葉は少し軽すぎる気がした。\n\n僕たちは道沿いを歩き続けた。\n\n河西の大学城は夜の中で静かに横たわり、蝉の声は夏がもう去りかけていると気づいたように、少し弱々しかった。\n\nしばらく、どちらも何も言わなかった。\n\nこの沈黙をそのまま過ぎさせようと思っていた。\n\nけれど歩けば歩くほど、心の中の何かが靴底についた小さな砂粒のようになった。痛くはないが、ずっとそこにある。\n\n「学姐」\n\n「うん？」\n\n「尹淵って、どういう人だと思いますか」\n\n霍学姐の歩みが半拍遅れた。\n\n「急にどうしたの？」\n\n僕は查寝の日のことを簡単に話した。\n\n彼が物理競赛のこと、黒幕のこと、あの理論力学の論文のことを話したこと。僕が本当に資料を調べ、公式を導き、いろいろ整理したのに、最後はまるで最初からコートに立っていない相手へボールを投げたようになったこと。\n\n愚痴が勢いづくにつれて、周囲のまばらな蝉の声は僕の声に覆われた。\n\nその間、彼女はずっとゆっくり歩いていた。歩幅は速くない。僕に最後まで話す時間を残しているみたいだった。\n\n「それで、そんなに気になるの？」\n\n彼女が聞いた。\n\n「彼が気になるわけじゃないです」\n\n僕は少し考えた。\n\n「ただ、けっこう恥ずかしいんです」\n\n「どこが？」\n\n「彼がああいうことを言った時、僕は反論できなかった」\n\n前の道を見た。\n\n「せっかくいろいろ準備したのに、結局何の役にも立たなかった」\n\nそう口にした後、自分でも少し情けなくなった。\n\n一生懸命宿題を書いた小学生が、先生にノートさえ回収されなかったみたいだった。\n\n霍学姐は笑わなかった。\n\n「じゃあ、どうしたいの？」\n\n「彼を超えたいです」\n\nその言葉は思ったより速く出た。\n\n僕は一度止まり、続けた。\n\n「少なくとも、次はあんなふうに簡単に見下されないように」\n\n「それだけ？」\n\n「それだけでもないです」\n\n足元の小石を蹴った。\n\n「彼がどうしてああやって人を扱えるのか、知りたい」\n\n小石は縁石のそばまで転がり、すぐ止まった。\n\n「だから、まず彼を超えたい。彼より高い場所に立ちたい」\n\n霍学姐はしばらく静かだった。\n\n「それは、自分を疲れさせそうな目標だね」\n\n「でも今の僕には、ほかの目標があまりありません」\n\n「なら、それを目標にしてもいい」\n\n彼女は言った。\n\n「ただ、弦は張りすぎると切れるよ」\n\nその声は、道端の雑音に消えそうなくらい小さかった。\n\n彼女の指がボトルキャップの上で少し止まった。\n\nプラスチックボトルが手の中で小さく鳴った。\n\n「学姐にも、張りつめすぎる時があるんですか」\n\nそう言ってから、僕の方が先に固まった。\n\n少し踏み込みすぎたように聞こえたからだ。\n\n霍学姐も一瞬止まった。\n\n前の奶茶店から歌が流れていた。女性の声はスピーカーとガラスドアを隔てていて、歌詞は聞き取れず、旋律だけが夜に浮いていた。\n\n「あるよ」\n\n彼女は僕を見た。\n\n「だから氷水を買いに出てきたの」\n\n僕は二秒固まった。\n\n「その二つに論理関係あります？」\n\n「ある」\n\n「どんな論理ですか？」\n\n「人は切れそうになる前に、水分補給して、熱量を下げる必要がある」\n\n僕は危うく、そのもっともらしいでたらめに騙されるところだった。\n\n「学姐」\n\n「うん？」\n\n「そういう話、班導が言うことっぽくないです」\n\n「班導にも退勤時間があるの」\n\n「なるほど」\n\n「残業代を出してくれたら、残業してあげるよ」\n\n交差点まで来ると、赤信号だった。\n\n何台かの電動バイクが横断歩道の前で止まり、配達員はスマホを見ていた。ハンドルには夜食の袋も掛かっている。\n\nこの街の夜は、少しもロマンチックではない。\n\nけれど赤信号は路口に灯り、車の流れが僕たちの前を一台また一台と過ぎていった。まるで通り全体を二つに分けるみたいに。一方は前へ進み、一方はその場に留まる。\n\n僕はその赤い光の前に立ち、頭の中にはまださっきの「彼を超えたい」という言葉が残っていた。\n\n赤信号の数字が一秒ずつ減っていく。\n\n「半月後、百団大戦」\n\n彼女は何気ないふりで言った。\n\n「来るの、覚えておいて」\n\n「百団大戦？」\n\n「サークル新歓」\n\n「ああ」\n\n霍学姐は僕の返事にかなり不満そうだった。\n\n「ただの、ああ？」\n\n「行きます」\n\n「本当？」\n\n「本当です」\n\n「その時になって、また選ばなかったなんて言わないでね」\n\n「学姐、今のは今日の棄権をからかってます？」\n\n「違うよ」\n\n彼女はかなり真面目に考えたようだった。\n\n「今日だけじゃない」\n\n青信号になった。\n\n電動バイクが先に滑り出し、歩行者がその後に続いた。白い横断歩道は車のライトで、短く区切られて光っていた。\n\n道路の真ん中まで来た時、彼女がふいに聞いた。\n\n「ずっとそう呼ぶつもり？」\n\n僕はすぐには反応できなかった。\n\n「何を？」\n\n「『霍学姐』」\n\n路の真ん中の白線が、車のライトで少し光っていた。\n\n僕はその線を見て、喉に何かが詰まったようになった。\n\nもしこれが青春恋愛作品なら、ここで一陣の風か、少なくともどこからか飛んできた葉っぱが、男主人公に考える時間をくれるはずだった。\n\n現実には何もなかった。\n\n向こうから渡ってくる人がもう目の前まで来ているのに、僕だけが横断歩道の真ん中で詰まっていた。\n\n風が路口を抜け、霍学姐の長い髪をふわりと持ち上げ、また肩のあたりへ落とした。\n\n彼女は急かさなかった。\n\n手の中の氷水が少し揺れ、プラスチックボトルが小さな音を立てた。\n\nその時になって、僕はようやく思い出した。\n\nやばい。\n\n僕、水まだ買ってない。"},{"title":"第二章：遅れてきた人","file":"第二巻/2、第二章.md","volumeTitle":"第二巻：最初に立てたフラグほど折れやすい","text":"チョークが黒板をすべり、さらさらと音を立てた。\n\n窓の外では、九月末の風に木の葉が何度か揺れていた。陽射しが葉の隙間から教室に落ち、前列の机の上で小さく砕ける。教壇の先生は『力学』の序論を話していて、その声は急がず、湘南訛りの普通話に特有の丸い語尾を少し含んでいた。\n\n「物質の運動形式はさまざまで、その中で、機械運動はもっとも単純で、もっとも普遍的なものです……」\n\n僕は教室の中央より少し前の席に座っていた。その瞬間、妙な錯覚が生まれた。\n\n教室が高校よりずっと広くなければ。\n\n誰の手元にもスマホが置かれていなければ。\n\nそして隣の朱銘が水筒の蓋をぎりぎり鳴らしていなければ。\n\n僕はまだ、どこかの高校の教室に座って、もう聞き慣れすぎた概念を先生がもう一度説明するのを聞いているのだと思ったかもしれない。\n\nもちろん、高校の先生は一枚のスライドを話し終えるたびに時計を見たりしない。まるで、入学したばかりの新入生たちをいつでも宇宙の自由意志へ返却する準備があるみたいに。\n\n大学の先生と高校の先生の最大の違いは、たぶんそこにある。\n\n高校の先生は、人生に一時的に配置された保護者のようなものだ。朝ご飯を食べたかどうかまで聞きたがる。\n\n大学の先生は、駅のアナウンスに近い。列車は到着しました、と教えてくれる。乗るかどうか、逆方向に乗るかどうか、途中で寝過ごすかどうかは、主にあなたと人生のあいだの個人的な揉め事である。\n\n『力学』の最初の内容は難しくなかった。\n\n少なくとも今のところ、高校物理との距離は、僕に世界観の再構築を要求するほど遠くない。位置、速度、加速度、質点、座標系、運動方程式。見慣れた概念が、少し大学らしい包装に包み直されて、先生のゆるやかな語り口で僕たちの前に置かれていく。\n\n僕は教科書に目を落とし、指先を次の節の見出しに置いた。\n\nその馴染み深さは、やはりどこか微妙だった。\n\n事故のあと、家で休んでいた一か月あまりのあいだに、僕は「姜岚」が残したものをいくつもめくった。証書、草稿ノート、競赛本、古い試験用紙、それから角の白く擦り切れた物理の資料集。\n\nそれらはすべて静かにそこにあり、僕が「自分のものだ」と認めるのをずっと待っていたようだった。\n\nけれど、それを見るたび、僕は知らない誰かの遺品を見ている気分になった。\n\nただ、その知らない誰かはたまたま僕と同じ名前で、たまたま同じ手を使っていて、たまたま今の僕に必要なものをこの身体の中に残していた。\n\n先生が例題に入った時、僕は本を数ページ先へめくった。\n\n「姜岚」\n\n隣から朱銘の声がした。\n\n顔を上げると、彼はまず教壇をちらっと見て、先生がこちらに気づいていないのを確認してから、声を低くした。\n\n「先生が今話してるやつ、お前にはけっこう簡単なんじゃないの？」\n\n「まあまあ」\n\n「まあまあって何だよ」\n\n「つまり……聞けばわかる」\n\n「聞けばわかる」\n\n朱銘はその三文字を繰り返した。表情は、誰かが「この料理、まあ適当にミシュラン三つ星取っただけです」と言うのを聞いた時みたいだった。\n\n「競赛やってた連中って、最初から装備持ってスタートしてんの？」\n\n「そこまで大げさじゃない」\n\n「謙遜するなって」\n\n朱銘は僕が開いているページを見た。\n\n「先生まだ一ページ目なのに、お前もう三章あたり見てるじゃん。この調子なら、将来保研とかもけっこう余裕なんじゃね？」\n\n保研。\n\nその言葉が朱銘の口から出てきた時、その軽さは食堂のおばちゃんが「卵つける？」と聞く時くらいだった。\n\nけれど僕のところに落ちると、小さな石が水面に投げ込まれたみたいだった。\n\nもちろん、その言葉は知っている。\n\n試験免除で大学院へ推薦されること。成績、順位、GPA、競赛、科研、総合評価。そういうものが大学四年間でたくさんの表、たくさんの試験、たくさんの資料に分解され、最後に見栄えのいい結果として積み上げられる。\n\nでも朱銘に言われるまで、僕はそれを本気で自分につなげて考えたことがなかった。\n\n僕はただぼんやりと、尹淵みたいな人間にあんなふうに軽く見下ろされるわけにはいかない、と思っていただけだった。どんな方法で取り返すのか。成績なのか、論文なのか、竞赛なのか、保研なのか、それとも別の何かなのか。そこまでは考えていなかった。\n\n朱銘の何気ない一言は、その中の一本の道を、ずいぶん雑に僕の前へ指し示した。\n\n「今からそんなこと言うの、早すぎないか」\n\n「早くねえよ。兵馬未動、糧草先行」\n\n朱銘は妙に真面目な顔をした。\n\n「俺ら東北人は宴会前でも、まず子どもがどの卓に座るか見るんだ」\n\nちょうどそこで授業のチャイムが鳴った。\n\n朱銘は残念そうに口を閉じた。時代に阻まれた軍事戦略家のようだった。\n\n僕は教科書に目を戻したが、さっきの言葉は頭の中に数秒だけ残った。\n\n保研。\n\n心の中でその言葉をもう一度つぶやくと、さっき教科書に出てきたどの公式よりも、急に見知らぬものに思えた。\n\n……\n\n二限目は高数だった。\n\n十時ちょうど、赤い短い巻き髪の年配の女性が、資料の束を抱えて教室に入ってきた。\n\nその髪の赤さは、妙に堂々としていた。若者が流行を追って染めた赤ではなく、「この年で赤く染めて何が悪い。意見があるなら飲み込んでおけ」という赤だった。\n\nもし人の髪色が精神状態を表すのなら、この先生はきっと、極限記号すら花文字で書きそうな人だった。\n\n「みなさんこんにちは。方小燕です。今日から皆さんの高数を担当します」\n\n彼女は本を教壇に置き、長い挨拶はせず、すぐに名簿を取り出した。\n\n「まず出欠を取ります」\n\n教室に、本をめくる音と椅子を動かす音が広がった。\n\n「沈婷」\n\n「はい」\n\n「李暢」\n\n「はい」\n\n「吴悠」\n\n「はい」\n\nその名前を聞いた時、僕は思わず声のした方向を見た。\n\n窓際の席で、高いポニーテールの女子が短く手を挙げた。声も高くない。手を下ろすと、すぐにまた教壇へ視線を戻した。\n\n僕もすぐに目を戻した。\n\n出欠は続いた。\n\nそして方小燕が、ある名前を読み上げた。\n\n「程昕亮」\n\n教室には返事がなかった。\n\n方小燕は顔を上げ、もう一度読んだ。\n\n「程昕亮」\n\nやはり返事はない。\n\n教室の空気が、ほんの少しだけ止まった。\n\n大事件ではない。ただ、大学最初の高数の授業に、本当に来ていない人間がいるのだと、みんなが同時に気づいただけだった。\n\nゲーム開始一分で、チュートリアルがまだ終わっていないのに、誰かがすでに戦闘離脱を選んだようなものだ。\n\n方小燕は眉をひそめた。\n\n「誰か彼を知っている人がいたら伝えてください。一回目の授業から来ないなら、これからも来なくて結構です」\n\n声は高くないが、はっきりしていた。\n\n「私の授業は、誰にも無理に聞けとは言いません。ただ、欠席は欠席です。落第するのも本人です」\n\n教室は少しだけ静かになった。\n\nその言葉は厳しく聞こえたが、脅しとは少し違っていた。むしろ、「一回だけ休んだだけです」から「先生、まだ救済できますか」まで走っていく学生を何人も見てきた教師が、最初の段階で結末を置いておくような言い方だった。\n\n朱銘が隣で頭を下げた。\n\n僕はてっきり、高数の落第が人類文明にもたらす深刻な脅威について反省しているのだと思った。だが横目で見ると、彼は机の下でこっそりスマホを操作していた。\n\n数秒後、彼は画面を少しこちらに傾けた。\n\n個人チャットの窓に、程昕亮へ送ったばかりのメッセージがあった。\n\n【朱銘：兄弟、一回目から逃げる勇気あるの？】\n\n返事はない。\n\n朱銘は半分ほど待ってから、さらに送った。\n\n【朱銘：漢としては尊敬するけど、先生がこの授業来ないなら今後も来なくていいって言ってるぞ。】\n\nやはり返事はない。\n\n彼は二秒黙り、スマホをサイレントにしてから電話をかけた。\n\n僕はその一連の操作に少し圧倒された。\n\n方先生が開学第一課で轟々たる出欠大掃除をしているのだとすれば、朱銘は今、敵地に潜伏し、命をかけて覚醒任務を遂行する地下連絡員だった。\n\n幸い、その作業は長くはかからなかった。\n\n電話がつながった瞬間、朱銘はすぐに切った。\n\nそしてスマホを机の中へ戻し、背筋を伸ばした。表情は正しすぎて、さっきまで何も起きていなかったようだった。\n\n方小燕はすでに関数と極限を話し始めている。\n\n僕は黒板の記号を見ながら、思わず考えた。\n\nつまり、あいつは一限の早八の力学にも来ていなかったのか……\n\n二十分ほど経って、後ろの扉がそっと開いた。\n\n最初に振り返ったのは後ろの席の学生だった。\n\nそれからその動きが波紋のように教室の後ろ半分から前へ伝わってきた。\n\n僕も振り返った。\n\n程昕亮が、堂々と扉のところに立っていた。\n\n髪は明らかに寝癖で乱れている。黒い上着のファスナーは半分しか上がっておらず、中のパジャマの襟が少し歪んで覗いていた。片手にはスマホ、もう片手には豆乳。豆乳のストローは蓋に刺さったままで、すでに何口か飲まれているようだった。\n\n彼はまず眠そうに教室番号を見上げ、それから教壇へ視線を向けた。そのぼんやりした目つきは、まるで自分が受け取るべき出前を間違えていないか確認しているようだった。\n\n慌てていない。\n\n気まずそうでもない。\n\n遅刻した学生にありがちな「先生すみません遅れました」という申し訳なさもない。\n\n彼はあまりにも自然にそこに立っていたので、一瞬、遅れたのは彼ではなく、この教室全体が早く来すぎたのではないかという錯覚さえした。\n\n僕はスマホを開いて時間を確認したい衝動をどうにか抑えた。\n\nもちろん、時間は程という姓ではない。方小燕は講義を止めた。\n\n「程昕亮？」\n\n男子は頷いた。\n\nその時になってようやく、自分が豆乳を持っていることに気づいたらしい。彼は豆乳を少し身体の横へ隠した。\n\nその動作自体は礼儀正しかった。\n\nただ、豆乳のカップがあまりにも目立っていたので、隠したことによって、むしろ隠している事実だけがはっきりした。\n\n「先生、言いに来ました」\n\n彼は言った。\n\n「今後の授業、僕のことは気にしなくていいです。自分で勉強します」\n\n挑発ではない。格好つけでもない。谷懿のように舞台中央へ立つ前に照明を確認するような演出感もない。\n\n本当に、普通の連絡事項を伝えているだけだった。\n\n「出前、入口に置きました」\n\n「明日雨だから傘持ってきて」\n\n「僕、今後授業には来ません」\n\n方小燕は彼を見た。\n\n「確かですか」\n\n「はい」\n\n程昕亮は言った。\n\n「授業の邪魔はしません」\n\n教室のどこかで、誰かが鼻から笑いを漏らした。\n\n朱銘は座席で固まっていた。\n\n彼もたぶん、自分の電話が程昕亮を教室へ召喚したのではなく、自学宣言を召喚してしまったとは思っていなかったのだろう。この宣言がこの授業にもたらした偉大さは、北米大陸における独立宣言に匹敵するかもしれない。\n\n方小燕はしかし、すぐに平静を取り戻した。\n\n彼女はチョークを黒板の縁に戻し、声の高さを変えずに言った。\n\n「わかりました。成績は自分で責任を持ちなさい」\n\nそう言って、彼女はまた黒板へ向き直った。\n\n程昕亮は入ってこなかった。\n\n彼は扉のところに立ったまま、用事は済んだと言わんばかりに、そっと扉を閉め、豆乳を持って去っていった。\n\n扉が閉まったあと、教室は二秒ほど静かだった。\n\nその二秒は不思議だった。\n\n黒板にはまだ極限記号が残っていて、先生はすでに説明を続けている。窓の外の木の葉も変わらず揺れていた。\n\n朱銘はゆっくりとスマホを机の中から取り出し、通話履歴を見て、またゆっくり戻した。\n\n僕は初めて気づいた。程昕亮という人間は、たぶん面の皮が厚いのではない。\n\n面の皮が厚いというのは、少なくとも「面の皮」というシステムが存在していることを知っているという意味だ。\n\n彼はもっと根本的に、最初からそのシステムに接続していないのだ。\n\n「やっぱりこの世界には偽物の人間がいるって言っただろ」\n\n朱銘が身を寄せ、小声で言った。\n\n……\n\n高数が終わった時、もう昼食の時間に近かった。\n\n全員の動きが急に速くなった。\n\n大学の授業が終わる前後の空気は面白い。\n\n授業中は、みんなまだ知識への敬意をどうにか保っている。だがチャイムが鳴った瞬間、知識は炭水化物に完敗する。しかもかなり惨敗する。\n\nクラス全員が食堂へ向かおうとしたその時、王伊が教壇の横に立った。\n\n「みんな、ちょっとだけ待って。二分だけ」\n\nその一言で、教室にとても小さなため息が起きた。\n\n不満というほどではない。ただ、魂はすでに立ち上がっていたのに、肉体が通知によって座席へ引き戻されたのだ。\n\n王伊は印刷したばかりの用紙の束を持っていた。少し巻いた髪が肩に落ち、顔には申し訳なさそうな笑みがあった。\n\n「物理学院で今週、新入生向けの学術ナビゲーション活動があります。学院のいくつかの研究方向や课题组を紹介するものです。通知が今来たばかりで、各クラスからまず三名、興味があって、基礎も合いそうな同学を推薦することになっています。紙の回収票を今夜八時までに量子楼へ提出しないといけません」\n\n「量子楼？」\n\n後ろの方で誰かが繰り返した。\n\n「研究生院楼のあたりです」\n\n李向陽がスマホの通知を見ながら補足した。\n\n「通知には『科研に興味があり、一定の専門基礎を持つ新入生を優先推薦』とあります。全員申し込みではありません」\n\n彼の言い方は落ち着いていた。\n\nけれど「全員申し込みではありません」という言葉が出た瞬間、教室の空気は少し変わった。\n\nさっきまでみんな昼食のことしか考えていなかったのに、急に何人かが座り直した。\n\n小声で聞く人もいた。\n\n「行ったら何かあるの？」\n\n「総合評価に入る？」\n\n「入学一週目で科研興味って、今から作って間に合うの？」\n\n朱銘が隣で、決して小さくない声で言った。\n\n「入学一週目で科研興味を検査するって、生まれたばかりの子どもに将来公務員試験受けたいか聞くようなもんじゃね？」\n\n僕は危うく笑いをこらえきれなくなるところだった。\n\n王伊にももちろん聞こえていた。彼女は少し笑ったが、すぐに用紙を教壇の上で整えた。\n\n「たぶん、まずは知ってもらうだけで、すぐ何かをするわけじゃないと思います。通知には先に三人出すって書いてあるから、もし誰も行きたい人がいなかったら、私がその場で壮丁を捕まえるしかなくなります」\n\nすでに鞄を背負って出ようとしていた人もいる。\n\n朱銘が肘で僕をつついた。\n\n「お前、行けよ」\n\n「僕？」\n\n「ほかに誰がいるんだよ」\n\n朱銘の視線は、現実世界のJK美少女を前にしても動かない愚かな二次元オタクを見るようだった。\n\n「高校で物竞やってたんだろ？ ちょうどいいじゃん」\n\n王伊がちょうどそれを聞いた。\n\n彼女は顔を上げ、少し目を明るくした。\n\n「姜岚、前に物理竞赛に参加したことあるの？」\n\n「少しだけ」\n\n本当はもっと曖昧に言いたかった。\n\nたとえば「昔のことだし」とか、「大したことじゃない」とか。そういう言葉に実際の効果はほとんどないが、少なくとも自分を教壇横のだんだん目立つ位置から半歩後ろへ下げることはできる。\n\n問題は、教室の空気が僕に後ろへ下がる余地をあまり残していなかったことだ。\n\n前列では鞄を片づける人がいて、後ろではスマホをポケットにしまう人がいる。食堂の方向からは、すでに召喚の声が聞こえてくる気がした。\n\nみんなの行動は、おおむね同じ意味を表していた。\n\nそれ、いいじゃん。\n\n君が行って。\n\n僕らはご飯を食べる。\n\n王伊は一枚の用紙を差し出し、笑って言った。\n\n「じゃあ先に書いてみない？ とりあえず紹介を聞きに行くだけだから」\n\n僕は朱銘を見た。\n\n朱銘の目は言っていた。\n\n兄弟、組織はもう決定した。\n\n李向陽も通知を見た。\n\n「竞赛経歴は書けます」\n\n彼は言った。\n\n「通知では簡単な説明を添えるようにあります。賞の名称は正式に書いた方がいいです」\n\n賞の名称は正式に。\n\nごく普通の言葉だった。\n\n普通すぎて、僕が止まる理由など何もないはずだった。\n\nそれでも、その用紙を見た時、ペンを持つ指先に少し力が入った。\n\n表の項目ははっきり印刷されていた。\n\n氏名。\n\n学籍番号。\n\n連絡先。\n\n興味方向。\n\n竞赛または科研経歴。\n\nどれも書ける。\n\nなぜなら、すべて本当だからだ。\n\n少なくとも、この世界の材料の中では本当だった。\n\n事故のあと、家で療養していた時期に、僕はその証書を見た。赤い表紙、透明なフィルム、角に目立たない折れ目。そこには全国中学生物理竞赛省級二等賞と書かれていた。\n\n二等賞。\n\n伝奇小説のように、登場した瞬間全国を席巻し、そのまま学神人生を始める金色の伝説ではない。\n\nけれど入学したばかりの一年生にとっては、隣の人間に「けっこうすごい」と言わせるには十分だった。\n\n僕はペンを取り、その欄に書いた。\n\n全国中学生物理竞赛省級二等賞。\n\n書き終えてから、二秒ほど見つめた。\n\n字は僕のものだった。\n\n経歴も「姜岚」のものだった。\n\nけれどその瞬間、僕は、ここに来ていない誰かのために代理でサインしているような気がした。\n\nさっき程昕亮の出席も、誰かが代理で返事しておけばよかったのに……\n\n「これで大丈夫です」\n\n李向陽が一目見て言った。\n\nそう言うと、彼自身も一枚の用紙を取った。\n\n「僕も申し込みます」\n\n彼はペンのキャップを外した。\n\n「课题组の紹介なら、先に聞いておいて損はありません」\n\nその言葉は、とても李向陽らしかった。\n\n興奮でも衝動でもなく、まるで市場で値段の合うものを見つけたので、とりあえず一つ買っておこうと決めたような感じだった。\n\n王伊は用紙を受け取り、ちらっと見て笑った。\n\n「ありがとう。うちのクラス、ようやく二枚は出せるようになった」\n\nただ普通に申し込んだだけなのに、今の僕には、自分がクラスの行政効率を救ったような錯覚が生まれた。\n\n「三人必要なんだろ？」\n\n朱銘が思い出させた。\n\n王伊は頷き、また教室を見渡した。\n\nその時、誰かが言った。\n\n「程昕亮じゃね？」\n\n王伊は瞬きをした。\n\n「本人いないよね？」\n\n「その見解は浅い！ 人は不在でも、精神は在席している」\n\nまさか朱銘まで程昕亮を巻き込む側に回るとは思わなかった。\n\n「さっき本人がわざわざ来て、自学宣言したじゃん。この学術ナビ、彼にとっては次元を下げて降りてくるようなものなんじゃないの？」\n\n王伊はペンを持ったまま、少し迷った。\n\n「それは、ちょっとよくないかも」\n\n李向陽は時間を見た。\n\n「候補として先に書いておけばいいです」\n\n彼は言った。\n\n「あとで本人が嫌なら取り消せばいい。通知にはクラス推薦三名とだけあって、今この場で本人の署名が必要とは書いていません」\n\nその一言で、朱銘は通行証を手に入れたような顔になった。\n\n彼はすぐに程昕亮へメッセージを送った。\n\n【朱銘：学術ナビ、クラスからお前推薦するって。行く？】\n\n返事はない。\n\n数秒待って、もう一通送る。\n\n【朱銘：黙ってたら同意な。】\n\nやはり返事はない。\n\n朱銘はスマホを机に伏せた。表情は、たった今民主的な手続きを完了した人間のように荘重だった。\n\n「同意した」\n\n今度は王伊まで笑いをこらえきれなかった。\n\n「じゃあ、先に候補って書いておくね」\n\n彼女は言った。\n\n「あとで本人に聞いてみる」\n\n彼女は三枚目の用紙に程昕亮の名前を書いた。\n\n僕はその三つの名前が同じファイルに挟まれていくのを見て、第一章の班会で、あの高いポニーテールの女子が立ち上がった時の姿を思い出した。\n\n彼女は言った。\n\n私は投票していません。\n\nあの時は、その言葉がただ率直だと思った。\n\n今、程昕亮の名前が書かれるのを見て、あの言葉は当時聞いた時よりも、少し具体的だったのだと感じた。\n\nただ、その考えが浮かんだ瞬間、朱銘の一言に地面へ引き戻された。\n\n「行くぞ。これ以上遅れたら糖醋里脊なくなる」\n\n糖醋里脊の重力の前では、哲学的思索は昔から抵抗力を持たない。\n\n……\n\n夕方、僕はもともと図書館へ行くつもりだった。\n\n昼間のあの用紙は王伊が回収していったので、それ以上あまり考えなかった。\n\n午後には公共課が一コマあり、先生は半分の時間を使って電信詐欺防止を、もう半分でキャンパスローンを話した。口調は深刻で、僕たち入学したばかりの新入生が次の瞬間には全員高利貸しを背負い、法制番組の常連ゲストになるとでも思っているようだった。\n\n教学楼を出た時、空は少し暗くなっていた。\n\n街灯はまだ完全には点いていない。コンクリートの路面には昼の熱が少し残っていた。バスケットコートの方からは誰かの声が聞こえ、食堂の方向からは油煙と炒め物の匂いが流れてくる。\n\n図書館へ向かう分かれ道に差しかかったところで、王伊が反対側から小走りで来るのが見えた。\n\n彼女はファイルを抱えていた。中の紙が散らないようにしているのか、走り方はあまり速くなかった。\n\n「姜岚！」\n\n僕は足を止めた。\n\n王伊は僕の前まで走ってきて、少し息を整えた。\n\n「今、時間ある？」\n\nその言い方は、かなり不穏だった。\n\n一般的に、夕方の分かれ道で、クラス長がファイルを抱えながら「今、時間ある？」と聞いてきた時、人身の自由はかなり危険な状態にある。\n\n「どうしたの？」\n\n彼女はファイルを少し差し出した。\n\n「これ、午前中の新入生学術ナビの回収票。八時までに量子楼の一階へ出さないといけないの。本当は私が行くつもりだったんだけど、女子寮の方でまだ何枚か集まってなくて、辅导员にもさっき催されちゃって」\n\nそこまで言って、彼女はまたスマホを見た。\n\n「姜岚も申し込んでたよね。もしあまり邪魔じゃなければ、代わりに届けてもらえないかな」\n\n命令ではない。\n\n面倒をそのまま投げつけてくる感じでもない。\n\nただ、ファイルを抱えてそこに立つ彼女の顔には、「大丈夫、また別の方法を考えるから」という逃げ道まで、もう書かれているようだった。\n\n僕は彼女の手の中のファイルを見て、それから自分の空いた手を見た。\n\nここまで言われて断ったら、僕は道がわからないのではなく、人情がわからない人間になる。\n\n「いいよ」\n\n「ありがとう、本当に助かる」\n\n王伊はファイルを僕に渡した。熱いけれど熱いと言ってはいけないものを、ようやく手放したようだった。\n\n「辅导员は、量子楼の一階あたりに出せばいいって言ってた。たぶん研究生の助管が受け取ると思う。見つからなかったら私にメッセージして。もう一回聞いてみる」\n\n「わかった」\n\n「ごめんね、よろしく」\n\n彼女は僕に笑いかけると、すぐに残りの用紙を抱えて女子寮の方向へ走っていった。\n\n僕は手元のファイルを見下ろした。\n\nプラスチックの表紙は少し硬く、中の紙束はきれいに挟まれている。僕の名前はその中の一枚にある。\n\n午前中、「省級二等賞」と書いた時の感覚が短く浮かんだ。\n\nけれど今回は、それはすぐに別の、もっと現実的な問題に覆われた。\n\n量子楼って、どこだっけ？\n\n……\n\n事実が証明した。\n\n雲夢師範大のキャンパスマップは、スマホの画面上ではとても親切に見えるが、現実に落とし込まれると、必ずしもそうではない。\n\nナビは現在地から量子楼まで八百メートルだと教えてくれた。\n\n八百メートル。\n\nその数字は親しみやすく、体育中考さえ思い出させた。\n\nけれど道を半分ほど進んだところで、前方に長い上り坂が現れた瞬間、僕はすぐに悟った。ナビアプリの「距離」に対する理解と、人類の両脚の「距離」に対する理解のあいだには、和解不能な矛盾が存在する。\n\nその長い坂をどうにか上りきると、灰白色の建物が横に見えてきた。\n\n道端の木陰は深く、建物の窓には灯りが一マスずつともっている。ある窓の向こうでは誰かがパソコンを見つめ、別の窓には安全注意と禁煙の表示が貼られていた。\n\n教学区から遠いわけではないのに、ここだけ音の種類が変わったようだった。人が少なくなり、足音までくっきり聞こえる。\n\n量子楼の入口は目の前にあった。\n\n入口のガラスには街灯が映り、中は白い光で明るい。\n\n僕は近づいて、扉を引いた。\n\n動かない。\n\nもう一度試した。\n\nやはり動かない。\n\n扉の横にはカードリーダーがあった。\n\n僕はそれを見た。\n\nそれも黙って僕を見ていた。\n\nその時になって、ようやくとても素朴な問題に気づいた。\n\n王伊の言った「一階の值班室」は、確かに一階にある。\n\nただし、彼女はそこに門禁があるとは教えてくれなかった。\n\n僕はファイルを抱えたまま入口に立ち、自分の身分が何なのか、少しわからなくなった。\n\n材料を届けに来た人間。\n\n迷子の新入生。\n\nそれとも、門禁システムによって科研の外側へ拒まれた科研人員予備軍。\n\nスマホを取り出し、王伊にメッセージを送ろうとした時、背後から足音が聞こえた。\n\n「同学、入れない？」\n\n振り返った。\n\nひとりの男子が階段の下に立っていた。手にはコーヒーとコンビニ袋、肩にはパソコンバッグを掛けている。\n\n彼は僕の抱えたファイルを見て、それから門禁を見た。\n\n「物理一班の新入生学術ナビの回収票を届けに来ました」\n\n僕はファイルを少し持ち上げた。\n\n「一階の方に出すようにって」\n\n彼はファイルの表紙をちらっと見た。\n\n「ああ、それ」\n\nそう言って、彼は階段を上がってきた。\n\n「今夜ちょうど僕が手伝って回収してる」\n\n彼はカードを取り出して、端末にかざした。\n\n門禁が小さく鳴った。\n\n彼は扉を開け、こちらを振り返った。\n\n「入って。ちょうど上に行くところだから」\n\n僕はファイルを抱え、彼の後ろについて量子楼に入った。\n\n背後で扉が閉まる。\n\n白い灯りが落ちてきて、廊下にはコーヒーとコピー用紙が混ざったような匂いが少しあった。\n\n僕はファイルの端から覗いている申込表を見下ろした。\n\n一枚目に僕の名前があり、その下に李向陽、さらにその下に程昕亮。\n\n程昕亮の欄の後ろには、鉛筆で「確認待ち」と書かれていた。\n\n彼はたぶんまだ知らない。\n\n一日のうちに、彼はすでに二度も、被告人として欠席裁判にかけられている。"},{"title":"第三章：人付き合いの機微","file":"第二巻/3、第三章.md","volumeTitle":"第二巻：最初に立てたフラグほど折れやすい","text":"程昕亮は来なかった。\n\n活動の担当者が彼の名前を呼んだとき、誰も返事をしなかった。\n\n彼女はもう一度名簿を見て、読み間違えていないことを確かめた。そばにいた数人が少し顔を上げ、すぐに視線を戻した。\n\n僕は反射的に李向陽を見た。\n\n李向陽は首を横に振った。\n\n担当者は名簿の横に印をつけた。\n\n「では、先に始めます。欠席の同学は、あとで興味があれば学院の通知を確認してください」\n\nそれで終わり？\n\nマジか、そんなのありなのか？\n\nそれに比べると、僕はずいぶん想像力に欠けているらしい。\n\n案内役は周という姓の学姐だった。彼女は名簿をファイルに挟み、臨時の訪問者用ネームプレートを何枚か配った。\n\n「今日は主に見学です。実験操作はありません。見られる場所も多くないので、皆さんついて来てください。実験室内の画面やホワイトボードは撮影しないでください。先生や先輩たちが作業している場合も、礼儀に気をつけてください」\n\n僕は訪問者用ネームプレートを首に掛けた。\n\nそこには「新入生学術ナビゲーション」と印刷されていた。\n\n周学姐は僕たちをエレベーターのほうへ連れて行った。\n\n「量子棟は主に学院の研究・オフィス棟です。量子方向のほかにも、凝縮系、光学、理論物理、計算材料などの研究室があります。皆さんは入学したばかりなので、まず大まかにどんな方向があるかを知れば十分です」\n\nエレベーターには、僕たちの小さな一隊がぎりぎり収まった。\n\n扉が閉まったあと、奥に立っていた数人はまだ小声で話していた。その会話から、僕と李向陽以外は、ほとんど物理学院側の学生なのだと少しずつ分かってきた。\n\n李向陽はエレベーターの数字表示を見ながら、声を落として聞いた。\n\n「こういう方向、前から少しは調べてた？」\n\n「名前だけなら少し」\n\n「どれ？」\n\n「量子、凝縮系、光学……あと天体物理」\n\n「計算材料は？」\n\n「今日までの理解は、ほぼ字面どおりだった」\n\n「字面どおり？」\n\n「計算機で材料を計算する」\n\n李向陽が僕を一瞥した。\n\n自分でもこの答えがほとんど当たり前のことを言っているだけだと分かっていた。\n\nだが少なくとも、間違ってはいない。\n\n最初の見学先は廊下の突き当たりにある成果展示壁だった。\n\nパネルには研究室紹介、論文の表紙、学会写真、それから僕にはよく分からない図が貼られていた。色のついた結晶構造は積み木で組んだ幾何学のおもちゃみたいなのに、その横にはぎっしりと英語と数式が並んでいる。\n\nあるポスターの下には「第一性原理計算」と書かれていた。僕はその文字を数秒見つめ、一文字ずつなら全部読めるのに、組み合わさると意味が分からなくなることを確認した。\n\n周学姐が説明した。\n\n「この方向は、大まかに言えば物理モデルと計算方法を使って材料の性質を研究するものです。たとえば安定性、電子構造、磁性、触媒性能などですね。今すぐ分かろうとしなくて大丈夫です。量子力学や固体物理を学んでから、少しずつつながっていきます」\n\n黒縁眼鏡の男子が小声で言った。\n\n「なんか、本当に科学をやってる感じがする」\n\nさっきからパネルの端にもたれていた男子がすぐに返した。\n\n「そりゃそうだろ。ここ、そもそも研究棟だし」\n\n「いや、そうじゃなくて。授業とは違うっていうか。授業は先生が答えを教えてくれるけど、研究は自分で答えを探す感じがする」\n\nその言葉のあと、何人かがもう一度ポスターを見た。\n\n僕もつられてそちらを見た。\n\n僕もそう思う、と言いたくなった。\n\nだが口元まで出かかったところで、他人の会話に急に割り込むのも変だと思い、結局飲み込んだ。\n\n廊下の反対側には学生用のオフィスがあった。\n\n扉は半分開いていて、中では誰かがイヤホンをつけてパソコンを見ていた。壁際のホワイトボードには数行の数式が書かれ、その横に矢印と丸で囲まれた疑問符が描かれている。\n\n高校の教室で物理を学んでいた頃、黒板の上の数式にはいつも答えがあった。問題が何を聞いているのか、解法がどこにあるのか、最後にいくつを出せばいいのか、すべてがあらかじめ敷かれた道のようだった。\n\nけれど、ここのホワイトボードは違った。\n\nまるで誰かが途中まで歩いてきて、前に道がないことに気づき、その場で壁に一本の道を描いたみたいだった。\n\n「ここには入らず、入口から見るだけにしてください」\n\n周学姐に言われて、僕はさっき一歩だけ前に出しかけた足を引っ込めた。\n\n李向陽は中を長く見てはいなかった。\n\n「学姐、本科の段階で早めに研究室を知りたい場合、学院の通知を見るのが普通ですか。それとも先生や先輩に自分で連絡するほうがいいんでしょうか」\n\n周学姐は少し考えた。\n\n「正式な本科生研究訓練は、普通あまり早くは始まりません。後ろになると大学生創新訓練プロジェクトもありますし、先生自身のグループミーティングや討論会もあります。大一なら、まず基礎科目をしっかりやるのがおすすめです。特に興味があるなら、公開講座を聞いたり、先輩に聞いてみたりするくらいからですね」\n\n李向陽はうなずいた。\n\n「分かりました。ありがとうございます」\n\n見学はさらに奥へ進んだ。\n\n量子棟は教学楼ほど賑やかではなく、図書館ほど静かでもなかった。音は細かく砕けていた。プリンター、キーボード、空調、そしてオフィスの中から聞こえる抑えた話し声。\n\nそれらが混ざり合って、かえって宣伝パネルの大きな言葉よりも、ここを「研究」に近い場所に感じさせた。\n\n一つのオフィスの外で、周学姐が立ち止まった。\n\n「ここは劉克学先生の研究室の学生オフィスです。劉先生のグループは主に計算材料シミュレーションをやっています。中では先輩たちが作業中なので、外から見るだけにしましょう」\n\nオフィスの扉は閉まりきっていなかった。\n\n中には何列かのデスクが近い距離で並び、パソコンの画面には結晶構造の図もあれば、途中まで開かれたコードのウィンドウもあった。誰かが図を修正し、誰かがホワイトボードの前で隣の人と小声で話していた。\n\n僕が隊列についてそのまま先へ進もうとしたとき、中の一人が顔を上げた。\n\nその人は一目で僕に気づいた。\n\n「昨日、回収票を届けに来た同学だよね？」\n\n僕も少し固まった。\n\n徐磊。\n\n「姜岚、だよね？」\n\n「はい。徐師兄、こんにちは」\n\n言ってから気づいたが、僕の「師兄こんにちは」は昨日よりもずっと滑らかになっていた。\n\n人類とは適応力の高い生き物である。\n\n一度でも門禁を開けてくれた人間は、「知らない人」から一気に「師兄と呼べる人」へ進化する。\n\n周学姐も徐磊に気づいた。\n\n「徐師兄、ちょうどよかったです。劉先生のグループについて、簡単に紹介してもらえますか。私が説明すると正確じゃないかもしれないので」\n\nその言い方は素朴で、正直だった。\n\n僕の中で周学姐への好感度が少し上がった。\n\n徐磊は僕たちの小さな一隊を見た。\n\n「いいよ。ただ、入口をふさがないで。少し脇に寄って」\n\n僕たちは廊下の端へ少し移動した。\n\n徐磊はコーヒーを窓台に置き、短く説明した。\n\n「計算材料シミュレーションは、簡単に言えば計算方法で材料の構造や性質を研究するものです。今見えている結晶構造、バンド図、状態密度図は、後で量子力学や固体物理を学ぶと、少しずつ何を言っているか分かるようになります」\n\n彼は明らかに一生懸命聞こうとしている新入生たちを見て、もう一言つけ加えた。\n\n「今すぐ分かろうとしなくていいです。大一の一学期なら、名前をいくつか覚えるだけでも十分です」\n\n黒縁眼鏡の男子が聞いた。\n\n「師兄、この方向って、プログラミングがかなり必要ですか？」\n\n「必要です」\n\n徐磊の答えには、一切の緩衝材がなかった。\n\nその男子は明らかに言葉に詰まった。\n\n徐磊は続けた。\n\n「ただ、最初から複雑なプログラムを書かせるわけではありません。むしろツールの使い方、文献の読み方、入力ファイルの直し方、自分がなぜそう計算しているのかを知ることが多いです」\n\n「じゃあ、数学もかなりできないとだめですか？」\n\n低い位置で髪を結んだ女子が聞いた。\n\n「使える程度で大丈夫です。後から少しずつ補います。最初からそういう言葉に怖がらなくていい」\n\n李向陽が続けて聞いた。\n\n「もし関連する議論を早めに聞いてみたいだけなら、先にどんな基礎内容を見ておくべきですか？」\n\n「高数と力学をまずついていくこと。もし本当に聞くなら、最初は分からなくて普通です。すぐに判断しないほうがいい」\n\n李向陽はうなずき、それ以上は聞かなかった。\n\n徐磊は今度は僕を見た。\n\n「さっき成果壁のところ、けっこう長く見てたね」\n\n「え？」\n\nまさか話が急に僕へ落ちてくるとは思わなかった。\n\n「昨日の回収票に物理競賽って書いてあったから」と彼は言った。「こういう方向に興味ある？」\n\n「物理競賽」という言葉を聞いた瞬間、心の中が少しだけ固くなった。\n\nけれど今回、徐磊の口調には尹渊のような品定めも、方小燕が点名したときのような圧迫感もなかった。ただついでに触れただけだった。\n\n「少しあります」\n\n僕は言った。\n\nそしてすぐに付け足した。\n\n「ただ、あまり分かっていません」\n\n徐磊はうなずいた。\n\n「分からなくて普通」\n\nそう言って、窓台のコーヒーを手に取った。\n\n「活動が終わったら、ここに戻ってきて。少し用がある」\n\n僕は固まった。\n\n聞き返す前に、相手はもうオフィスへ戻ってしまった。\n\n徐師兄が僕みたいな新入生に何の用だろう。\n\nまさか、さっき成果壁を見つめすぎたせいで、「研究棟内不審人物候補」として認定されたのか？\n\n古典的な映画の一場面が、勝手に頭に浮かんだ。\n\n「少年よ、君は骨格が並外れている。ここに一冊……」\n\nだが、考えがまとまる前に、隊列はもう前へ進んでいた。\n\nそばの物理学院の数人が、何かを小声で話し合っているようだった。\n\n次の実験室の外には「柔性電子材料与传感器件」と貼られていた。\n\n周学姐が説明しているとき、中では誰かがピンセットで薄い透明な材料をつまみ、光の下にかざしていた。横の展示ケースには皮膚に貼るパッチのようなサンプルがいくつか置かれ、下には「ウェアラブルセンサー」「電子皮膚」「ヒューマン・マシン・インターフェース」といった言葉が書かれていた。\n\nさっき「自分で答えを探す」と言っていた黒縁眼鏡の男子が、すぐに少し近づいた。\n\n「これって、手に貼って心拍を測るやつみたいなものですか？」\n\n周学姐は言った。\n\n「生理信号を測れるものもありますし、圧力、触覚、人間と機械の相互作用をやるものもあります。細かい分類は多いので、私も適当には言えません」\n\n低い位置で髪を結んだ女子は、展示ケースの薄片を見ながら、少し声を落とした。\n\n「さっきの計算材料より、こっちのほうが未来技術っぽい感じがする」\n\n「少なくとも見た目が未来技術っぽいからな」と別の男子が言った。「さっきの図は、色が多いことしか分からなかった」\n\n何人かが笑った。\n\nこの方向は明らかに、「第一性原理計算」よりも素人に誤解を与えやすかった。\n\n少なくとも僕の第一印象は、これを手に貼ればサイバー三体人に進化できそう、だった。\n\nもちろん、今の僕は高数すらまだよく分かっていないので、サイバー化の進行はひとまず後回しでいい。\n\n隊列が入口の前を通り過ぎるとき、僕は窓際のデスクに小さなネームプレートが置かれているのを見た。\n\nそこには二文字が書かれていた。\n\n霍钰。\n\n僕の足が少し遅れた。\n\n彼女のデスクも、この棟にあるのか。\n\nなぜか、その発見のせいで、さっきまでの「ただの見学」という感じが、少しだけ単純ではなくなった。\n\n活動が終わると、周学姐は僕たちを一階のロビーへ連れて戻った。\n\n物理学院の数人は、また自然と小さな輪を作っていた。\n\n「さっきの柔性電子、けっこう面白かった」と低い位置で髪を結んだ女子が言った。「少なくとも見えるものがあるし。あのバンド図よりは」\n\n「焦るなよ。物理実験でオシロスコープの前に押さえつけられたら、見えない触れないものを愛し直すことになるから」\n\nパネルの端にもたれていた男子が言った。\n\n「俺はやっぱり光学に行きたい。なんかかっこいいし」\n\n「まず高数を生き延びろ、兄弟」\n\n僕はそばに立っていたが、自然に会話へ入ることはできなかった。\n\n李向陽はその中の一人と少し話していた。話題は公共科目、カリキュラム、物理学院側の関連規定だった。\n\n彼の口調は礼儀正しく、質問もどれも実際的だった。\n\n同じように、相手の答えも礼儀正しかった。\n\n李向陽は時間を見た。\n\n「君、徐師兄のところへ行くんだろ？」\n\n「うん」\n\n「じゃあ、僕は先に戻る」\n\nそう言って、彼は訪問者用ネームプレートを周学姐へ返し、一足先にロビーを出た。\n\n僕は来た道を戻り、徐磊のいるオフィスへ向かった。\n\n戻りながら、さっきの「少し用がある」という言葉が、ますます微妙に思えてきた。\n\nただの通知なら、活動が終わったあとにわざわざ戻らせるほどではない。けれど本当に重要なことなら、徐磊の口調はあまりにも何気なさすぎた。まるで、ついでにミルクティーを買ってきてくれないかと頼むくらいの軽さだった。\n\n再びオフィスの入口に着くと、徐磊は自分の席で集中してコードを打っていた。\n\n僕は少し迷ってから、軽くドアを叩いた。\n\n相手は音に気づくと僕にうなずき、外で話そうと合図した。\n\n「うちのグループに興味ある？」\n\nその切り出しがあまりに直球で、僕は少し驚いた。\n\n徐磊は僕の説明を待つつもりはなさそうに続けた。\n\n「劉先生のグループは来週水曜の午後に組会がある。本物の組会がどんなものか見てみたいなら、あるいはうちのグループに興味があるなら、来て少し旁聴してもいい」\n\n「僕でもいいんですか？」\n\n「旁聴するだけだよ」と徐磊は言った。「大一の新入生なんだから、どれだけ分かるかは分かる範囲でいい」\n\n「はい」\n\nそこで僕たちは微信を交換し、そのまま別れた。\n\n……\n\n量子棟を出たばかりのところで、スマホにメッセージが届いた。\n\n【徐磊：来週水曜 15:00、量子棟410、小組組会。】\n\n続けてもう一つ。\n\n【徐磊：事前準備はいらない。だいたい聞いてみるだけでいい。】\n\nその二つのメッセージを見ていると、僕の前に、何か一つ「やってもいいこと」が増えた気がした。\n\n点名されたわけでもなく、回収票を出せと押されたわけでもない。\n\nもっとも、その始まりは、やはり誰かが僕のために記入した一枚の回収票だったのだけれど。\n\n量子棟を出たときには、もう空は暗くなっていた。\n\n棟の前の街灯は点いたばかりで、光はコンクリートの地面に落ちていたが、まだ夜を完全に押し広げるほどではなかった。\n\n遠くの教学楼では窓が一つずつ明るくなり、リュックを背負った学生が階段の下を通り過ぎていく。駐輪場のほうからは、自転車の鍵が閉まる音が聞こえた。\n\n宿舎へ戻る途中、僕は「知乎」を開き、検索欄に「計算材料シミュレーション」と打ち込んだ。\n\n自動候補には、入門、ソフト、就職、そして非常に雰囲気を壊す「計算材料シミュレーションは地雷か」が出てきた。\n\nインターネットとは、ロマンを破壊するのが得意な場所である。\n\n僕はひとまず見なかったことにして、「第一性原理計算」と検索し直した。すると最初の記事を三行読んだだけで、「密度汎関数理論」「交換相関汎関数」「Kohn-Sham方程式」が正面からコンボを叩き込んできた。\n\nよし。\n\n量子棟で生まれたあの少しのロマンは、科学本人によって現実へ蹴り戻された。\n\nそれでも僕はページを閉じなかった。\n\n今度は「計算材料シミュレーション 入門 大一でも読めるか」と検索した。この質問を打ち込んだ瞬間、自分でも少し情けなくなったが、検索欄は寛容で、「ゼロ基礎」「独学ルート」「必要なソフト」まで親切に補完してくれた。\n\n僕は一つの経験談を開いた。投稿者は、まずLinuxを学び、次にPythonを学び、それから量子力学、固体物理、VASPへ進めと書いていた。\n\nその道は長いだけでなく、数百メートルごとに僕がまだ知らないものが埋まっているようだった。\n\nそれでも、僕はそのページをブックマークした。\n\nただ、そのときの僕はまだ、これがただの偶然の幸運だと思っていた。\n\n……\n\n雲麓山のふもとにある小さな粤菜館。\n\n店は大きくなく、入口には赤い灯籠がいくつか吊るされ、ガラス扉には「焼鵝飯」「艇仔粥」「豉汁蒸排骨」のメニューが貼られていた。食事時を過ぎた店内には人も少なく、空調だけがあまりやる気なく動いていて、吹き出す冷気に醤油と熱いスープの匂いが混ざっていた。\n\n「君が気にしてたあの学弟、今日会ったよ」\n\n霍钰はスプーンで碗の粥をかき混ぜていた。\n\n「姜岚？」\n\n「そう。正確には、二日前にも会ってるけど」徐磊は箸を取った。「見た感じ、けっこう素直そうだった」\n\n「素直？ 褒め言葉に聞こえないね」\n\n「じゃあ言い換えるか」徐磊は少し考えた。「ちょっと朴訥」\n\n徐磊は焼鵝を一切れ取った。\n\n「あまり多くは言ってない。来週、組会を一回聞きに来ればって言っただけ。安心して。グループで人手が足りないとも言ってないし、君のことも言ってない」\n\n「ありがとう」\n\n「礼を言うのはまだ早い」\n\n徐磊は話の向きを変えた。\n\n「先に言っておく。組会を聞くくらいなら別にいい。でもその後、劉先生が彼を気に入って、残って仕事をさせることになったら、そこから先は俺には制御できない」\n\n霍钰は目を伏せ、粥の中の葱を端へ寄せた。\n\n「分かってる」\n\n「分かってるならいい」\n\n徐磊は少し間を置いてから続けた。\n\n「老劉は表面上、学生にかなり客気だけど、いざ人を使うとなると容赦ない。大一の新入生は何も分かってないから、先生が機会をくれるだけで、自分を評価してくれてると思いやすい」\n\n霍钰の手元のスプーンが止まった。\n\n「磊哥」\n\n「ん？」\n\n「あなたが大四で保研してきたときも、これがチャンスだと思ってたんじゃない？」\n\n徐磊は言葉に詰まった。\n\n数秒後、彼はため息をついた。\n\n「だから今は、他人に人生経験なんて語る気がしない。語っても意味がない。本当に中へ入る前は、誰だって自分は違うと思うから」\n\n霍钰はそれ以上何も言わなかった。\n\n彼女は焼鵝の皿を徐磊のほうへ少し押した。\n\n徐磊はそれを見て、ふっと笑った。\n\n「この飯、ずいぶん誠意があるな」\n\n「足りなければ、もう一皿頼んでもいいよ」\n\n「やめろ。賄賂は受け取らない。俺ができるのは、せいぜい人を入口まで連れて行くことだけだ。その先をどう歩くかは、彼自身のことだ」\n\n霍钰はうなずいた。\n\n「うん」\n\n店の外を誰かが電動バイクで通り過ぎ、ベルの音が一度鳴って、すぐに遠ざかった。\n\n徐磊は最後の焼鵝を箸で取り、口の中でもごもごしながら言った。\n\n「でも、あの学弟な。目つきは確かに、大学に入ったばかりの新入生の典型って感じだった」\n\n「どんな？」\n\n「研究をしてる人間はみんな、世界を変えてると思ってる感じ」\n\n霍钰はうつむいて少し笑った。\n\n「悪いこと？」\n\n「いいことだよ」\n\n徐磊は箸を置いた。\n\n「ただ、騙されやすい」\n\n霍钰はその言葉には答えなかった。\n\n卓上のスマホ画面がふっと明るくなった。\n\n徐磊が見ると、姜岚からのメッセージだった。\n\n【徐師兄、ありがとうございます。時間どおりに行きます。】\n\n徐磊はスマホを霍钰のほうへ向けた。\n\n「ほら。けっこう素直だろ」\n\n霍钰はその文字列を見つめ、少ししてからスマホをそっと押し返した。\n\n「からかわないであげて」\n\n「からかうわけないだろ」\n\n徐磊はそう言いながら、手元のビール瓶の栓を慣れた手つきで開け、霍钰へ差し出した。\n\n「飲む？」\n\n「やめとく。あとで用事があるから」\n\n「そんなに忙しいのに、俺に飯を奢る暇はあるんだな」\n\n「徐博とご飯を食べられるなんて、私の光栄ですから」\n\n「やめろやめろ、からかうなって。霍教授、俺が大三の頃に君みたいな成果を持ってたら、今ごろ老劉のところでこんな苦労してないだろ」\n\n霍钰は笑い、言い返さず、ただもう一匙粥をすくった。\n\n湯気が碗の口から立ちのぼり、すぐに空調の風の中へ散っていった。"},{"title":"第四章：転生爽文","file":"第二巻/4、第四章.md","volumeTitle":"第二巻：最初に立てたフラグほど折れやすい","text":"陳小雲が草稿用紙をこちらへ押してきたとき、僕はまだ『固体物理』の三ページ目に苦しめられていた。\n\n【何の本を読んでるの？】\n\n陳小雲の字はきれいで、僕の勝手なイメージに合っていた。\n\n僕は目の前に広げた天書をちらりと見た。\n\nページには「結晶格子」「逆格子」「ブリルアンゾーン」と書かれていた。\n\n僕はペンを取り、その行の下に続けて返した。\n\n【固体物理】\n\n夜の図書館は静かだった。聞こえるのは、本をめくる音、キーボードを叩く音、ペン先が紙を走る細かな音だけだった。\n\n僕たちは向かい合って座っていた。間には二冊の本と、たった今往復を始めたばかりの草稿用紙が一枚ある。\n\n【開学したばかりなのに、そんなに努力してるんだ（驚きemoji）？】\n\n僕は机の上に置かれたミネラルウォーターのボトルを見て、数時間前のことを思い出した。\n\n……\n\n僕は量子棟四階の廊下に立っていた。\n\nスマホの時刻はちょうど13:50。\n\n【410、着いたら連絡して。】\n\n徐磊からのメッセージがチャット画面に残っていた。\n\n僕は顔を上げて、ドアプレートを確認した。\n\n「凡人立入禁止」の結界はなかった。ドアはただ半分開いていて、中から何人かが声を落として話しているのが聞こえてきた。\n\n想像していたよりもずっと普通だった。\n\n普通すぎて、僕は一瞬、自分が場所を間違えたのかと思った。\n\n会議室は広くなかった。前方にスクリーンが掛かり、長机の両側にはすでにかなりの人数が座っていた。\n\nノートパソコンを見ている人もいれば、下を向いてスマホをいじっている人もいる。\n\n徐磊は後ろのほうの席を指した。\n\n「そこに座ればいい。聞ける分だけ聞けばいいから」\n\nまもなく、保温杯を持った人が入ってきた。\n\n五十代くらいで、髪は薄く、体つきは少しふっくらしていた。薄い色のシャツを着て、袖口を前腕までまくっている。入ってくると、まず会議室を一周見渡し、人がだいたい揃っていることを確認した。\n\n徐磊が僕の横で声を落とした。\n\n「劉先生」\n\n劉克学教授。\n\n僕は反射的に少し背筋を伸ばした。\n\n劉先生は保温杯を机に置き、後ろの席にいる僕へ視線を向けると、ほんの短く止まった。\n\n「こちらは新しく来た同学？」\n\n劉先生の普通話には濃い方言の響きがあった。標準的ではないのに、意外と親しみやすく聞こえた。\n\n「姜岚、大一の新入生です。前回の学術ナビゲーションに来て、グループの方向にかなり興味を持っているようです」\n\n徐磊が代わりに説明した。\n\n「大一から早めに科研へ触れようとするのは、いいことだ」\n\n劉先生は笑った。\n\n僕は慌てて言った。\n\n「劉先生、こんにちは」\n\n「座って、座って。気楽に聞けばいい」\n\nそう言うと、彼は目の前のノートを開いた。\n\n「では、始めよう」\n\n最初に報告したのは、王という姓の博士生だった。\n\nPPTのタイトルは長く、僕が拾えたのは「輻照欠陥」「分子動力学」といったいくつかの単語だけだった。次のページには、色つきの原子構造図が出てきた。赤い点、青い点、灰色の小球がぎゅうぎゅうに詰まっていて、何かをめちゃくちゃに崩した子ども向け知育玩具みたいだった。\n\nだが、報告している人は明らかにそれを玩具だとは思っていなかった。\n\n「ここでは異なるPKAエネルギーを設定し、変位カスケード終了後に生き残るFrenkel pairの数量変化を観察しました……」\n\nやっぱり天上界に迷い込んだらしい……。\n\nその後の数ページはかなり速く進んだ。\n\n会議室のほかの人たちは、みな真剣に聞いているようだった。\n\n下を向いて記録する人、図を見つめる人、時折一つ二つ質問する人。\n\n僕も下を向いて、それらしくノートを取った。\n\nあの言葉、何だったっけ。\n\n僕が気まずくなければ、気まずいのは他人のほう……。\n\n一人あたりの報告時間は十五分しかなく、王師兄のPPTはすぐ最後の謝辞ページにたどり着いた。\n\n「老師、以上です」\n\n彼は劉先生のほうを向き、相手の意見を待った。\n\n「うん。このプロジェクトはどのくらいやっている？」\n\n「えっと……だいたい七月からです」\n\n王師兄は少し気まずそうにその場に立っていた。\n\n「うん、進度は少し遅いが、成果は悪くない。後続はもう少しスピードを上げよう」\n\n「はい、分かりました、老師」\n\n「次は誰？」\n\n別の師兄が壇上へ上がった。\n\n報告が進むにつれて、眠気もだんだん押し寄せてきた。\n\n最初のうちは、どの師兄や学姐が何を話して、だいたいどんな課題をやっているのか、まだ覚えていられた。だが人数が増えてくると、もう区別がつかなくなった。\n\n何しろ、僕から見れば彼らの話す内容は全部同じだった。\n\n同じように、分からない。\n\n覚えているのは、スクリーンに次々と現れる色つきの欠陥図、温度、エネルギー、dpa、それから意味不明な英語の略語だけだった。\n\n「現在、統計口径の問題ではないかと考えています。あるいはポテンシャル関数が……」\n\nある師兄は、シミュレーション結果と実験結果の差異について話したところで、明らかに言葉に詰まった。\n\nずっとスクリーンを見ていた劉先生が、ふいに言った。\n\n「このページは主線がまだはっきりしていない」\n\n師兄は一瞬固まった。\n\n「老師、この比較図のことですか？」\n\n「そう。問題は先に残しておいていい。ただ、プロジェクト報告のときには、まず自分が何をしたのか、今どこまで進んでいるのかを相手に分からせる必要がある。細部が散りすぎると、聞く側は理解しにくい」\n\n師兄は何度もうなずいた。\n\n「分かりました、老師。戻ったら直します」\n\n僕は後ろで聞きながら、無意識に一緒にうなずいていた。\n\nたしかに科研成果は、ただ作ればいいだけではない。説明できなければならないし、相手に理解してもらえなければならない。\n\nできれば僕にも理解できるようにしてほしい……。\n\nその師兄の報告が終わると、すぐに立ち上がったのは、窓側に座っていた学姐だった。\n\n彼女は細身で、黒髪をゆるく後ろで束ね、黒縁眼鏡の横に数本の髪が落ちていた。ゆったりした白いTシャツを着て、イヤホンの線がまだ襟元に掛かっている。\n\n彼女が自分のパソコンを投影につないだ瞬間、会議室の何人かは明らかに座り方を変えた。\n\nさっきまで下を向いてスマホを見ていた人が顔を上げ、スマホを机に伏せた。ある人は手を再び目の前のキーボードへ戻した。劉先生の隣に座っていた、見たところかなり年上で、椅子の背にもたれて半分寝そべっていた老師まで、このときは身を起こした。\n\nスクリーンにタイトルが映った。\n\n『FeCrAl合金輻照損傷進化のマルチスケールシミュレーション研究』\n\n報告者：潘虹。\n\n余計な前置きはなかった。\n\n「今日は主に三つの問題を報告します。一つ目、異なるPKAエネルギー下で一次変位カスケードが生む欠陥数。二つ目、アニーリング段階における空孔クラスターと格子間原子クラスターの進化。三つ目、シミュレーション結果と実験TEMの転位ループサイズ分布との偏差です」\n\n彼女の話す速度は速かった。\n\n速すぎて、僕にはほとんど聞き取れなかった。\n\n一枚目の図は、異なるPKAエネルギー下でのFrenkel pair数の変化。\n\n二枚目は欠陥再結合率。\n\n三枚目は異なる温度下での空孔クラスターのサイズ分布。\n\n四枚目はFeCrAl合金における転位ループの形成確率。\n\nいくつかのデータ表は一瞥しただけで飛ばし、いくつかの図では立ち止まり、横軸、色、矢印をそれぞれ説明した。\n\n僕は相変わらず大半が分からなかった。\n\nけれど、たとえ鈍い人間でも、彼女が前の数人とは違うことくらいは分かった。\n\n潘師姐のPPTは非常に簡潔で、ほとんど図とタイトルだけだった。長い文章と言えそうなのは、図の下にある参考文献の引用くらいだ。\n\nだが彼女は、滔々と「原稿なしの発表」をしていた。\n\n前の数人とは違い、一ページ、あるいは一枚の図を話し終えるたびに、目線が劉先生の顔で数秒止まり、相手からの質問を待つようなことはなかった。\n\n彼女の発表はほとんど没入に近く、視線は一度も自分のPPTから離れなかった。\n\nシミュレーション結果と実験が一致しない図に差しかかるまでは。\n\n「ここには現在、まだ一つ問題があります。シミュレーションで得た転位ループのサイズ分布は全体的に小さめです。私は、ポテンシャル関数が欠陥移動エネルギー障壁を十分正確に記述できていないのではないかと考えています。設定した時間スケールとも関係があるかもしれません」\n\n劉先生の隣にいた中年の老師が尋ねた。\n\n「統計範囲をすべての欠陥クラスターまで広げれば、実験に近づくのでは？」\n\n「近づきません」\n\n潘虹はすぐに答え、同時にPPTを次のページへ切り替えた。\n\n「すでに試しました。統計範囲を広げると総数は近づきますが、サイズ分布の偏差は残ります。それに、一部の不安定な小クラスターを引き込んでしまい、議論がかえって乱れます。問題は統計範囲ではありません」\n\nその老師はさらに一言聞いた。\n\n「では、この部分はいったん実験と比較せず、傾向だけを見て、一版の結果として書けないか？」\n\n彼女は短く間を置いた。\n\n「段階的な結果としてなら書けます。ただ、結論としては書けません」\n\n彼女はPPTを一ページ戻し、また元に戻した。\n\n「傾向はありますが、メカニズムはまだ確定していません。この差は省けません」\n\nその言葉のあと、会議室は一瞬静かになった。\n\n「この図はあとで少し最適化しよう。展示効果はもっと良くできる。プロジェクト報告のときは、この部分を重点的に話せる」\n\n劉先生が口を開いた。\n\n「プロジェクト報告だけなら、そう話せます。ただ、論文投稿となると、現時点ではここにかなり大きな問題があります」\n\n会議室の誰かが顔を上げた。\n\n「だからこそ、君に続けてやってもらっているんだ」\n\n劉先生は笑って、保温杯を持ち上げた。\n\n「このプロジェクトの後続も、やはり君が牽引してくれ」\n\n潘師姐は小さくうなずき、投影ケーブルを抜いて、パソコンを持ってまた窓側の席に戻った。そしてすぐに下を向き、キーボードを叩き始めた。\n\n組会は続いた。\n\n徐磊師兄も短く報告した。どうやら彼は事前に老師へ進度を報告していたらしく、簡単に数句話しただけで、劉先生はうなずいて合図した。\n\n会議室の時計の分針は何周も回り、僕のノートに書かれた単語もどんどん増えていった。\n\n【金属輻照】\n\n【変位カスケード】\n\n【Frenkel pair】\n\n【僕はいったい何でここにいるんだ……】\n\nこの一行は、明らかに組会ノートとは呼べない。\n\n……\n\n組会が終わったときには、もう六時近かった。\n\nみんながパソコンを閉じ、ケーブルを片づけ、荷物をまとめ始めた。\n\n僕もリュックを背負って出ようとしたところで、劉先生がふいにこちらを向いた。\n\n「小姜、少し残ってくれるかな」\n\n僕は固まった。\n\n徐磊は僕を一瞥した。表情はほとんど変わらず、ただパソコンバッグを肩に掛けた。\n\n「行ってきな」\n\n劉先生のオフィスは廊下の反対側にあった。\n\nドアを入ると、中は思っていたより広かった。\n\n壁際には本棚があり、中にはトロフィー、会議の集合写真、何列もの製本されたプロジェクト資料が並んでいた。デスクの上には書類が積まれ、その横には小さな観葉植物があり、葉が空調の風に軽く揺れていた。\n\n「座って」\n\n劉先生はソファを指した。\n\n僕は立ったまま数句話せばいいと思っていたので、その言葉を聞いて少し戸惑った。\n\n「緊張しなくていい」\n\n彼は横の冷蔵庫からミネラルウォーターを一本取り出し、僕に渡した。\n\n「組会を聞いてみて、どうだった？」\n\n僕は水を受け取った。\n\n「けっこう……よかったです」\n\nさっきの組会中、心の中では一万頭のアルパカが駆け抜けていたはずなのに、この瞬間は語彙が消えた。\n\n劉先生は寛容そうに笑った。\n\n「分からなくて正常だよ。君はまだ大一だ。最初から全部分かったら、そのほうがおかしい」\n\n僕はほっとした。\n\n彼は自分の水杯を少し横へずらした。\n\n「徐磊から聞いたが、高校のとき物理競賽に参加したことがあるんだね？」\n\n「はい……」\n\n「悪くない」\n\n彼はうなずいた。\n\n「競賽生は、だいたい頭は悪くない。今の君に足りないのは能力ではなく、方向だ」\n\n僕はミネラルウォーターのボトルを握った。ボトルの水滴が手のひらについた。\n\n「我々のこの方向は、複雑と言えば複雑だが、実際的と言えば非常に実際的だ」\n\n彼の方言混じりの普通話は、集中して聞かないと少し分かりにくかった。\n\n「核材料、輻照損傷、エネルギー安全。これらはすべて具体的な発展方向だ。国家にも需要があるし、工学上も実際に解決すべき問題がある」\n\n僕はうなずいた。\n\n劉先生の話し方はゆっくりしていた。\n\n「ただ、今の君は焦らなくていい。何しろ入学したばかりだからね。だが、早めに科研関連のものを知ろうとする姿勢は、君にとって必ず大きなプラスになる」\n\n「多くの本科生は、大四で卒業設計をやるときになって初めて科研に触れる。けれど半年少しの時間では、基礎を作るだけでほとんど終わってしまい、まともなものはなかなか作れない」\n\n「君は来るのが早い。これはかなり大きな優勢だ」\n\n【かなり大きな優勢。】\n\n僕は軍訓が終わったあの日、階段の下に立ち、誰にも見てもらえなかった草稿用紙の束を手にしていた自分をふと思い出した。\n\n「後ろで興味があれば、もっと聞きに来ていい。具体的にどんなプロジェクトをやるかはまだ置いておいて、まず方向を知り、師兄師姐たちがどう問題に取り組んでいるのかを見ればいい」\n\nそこで彼は、ついでのように付け加えた。\n\n「ただ、将来君が大学院へ進むにしても、仕事を探すにしても、関連する科研経験があるかどうかで差は大きい」\n\n「大学院」という二文字を聞いた瞬間、胸の中が軽く跳ねた。\n\n「老師、僕は基礎がよくないので、何もできないんじゃないかと……」\n\nずっと小鳥が餌をついばむみたいにうなずいていた僕が、初めて口を開いた。\n\n「それは問題ない」\n\n彼は手を振った。\n\n「君はまだ大一だ。徐磊たちと比べる必要はない。ただ、同級生と比べれば、基礎はかなり良いと言えるはずだ」\n\n僕は少し気まずく笑った。\n\n「それに、我々の課題組は国内でもトップレベルと言っていい。少なくとも輻照の方向ではね」\n\n劉先生の口調はとても平板で、まるで大したことではない事実を述べているだけのようだった。\n\n「我々のグループはこの二年でかなり多くのトップジャーナルを出している。去年はNatureも一本出した。当時、雲夢師大でも報道があった。君も聞いたことがあるだろう？」\n\n僕は慌ててうなずいた。\n\n正直に言えば、僕の見聞は非常に狭かったのだが……。\n\n「今年もPRLを一本出した。一作の潘虹はまだ修士二年の学生だ。保研で我々のグループに来て一年も経たないうちに、非常に良い論文を一本出した」\n\n潘虹。\n\nさっき組会で報告していたあの師姐。\n\nPRLを出すのがどれほど難しいのか、そもそもNatureやPRLが何なのかさえ僕はよく分かっていなかった。それでも、何度もうなずきながら、その名前だけは覚えた。\n\n「それにね、我々のグループはプロジェクトが非常に多い。プロジェクトがないことを心配しているのではなく、受けているプロジェクトが多すぎて、むしろ少しやりきれないくらいだ。はは」\n\nそこまで言って、劉先生も少し困ったように笑った。\n\n「だから後ろで、もし君が本当に入ってくるなら、いくつかプロジェクトを手配することになる。そのとき、あるべき労務費や補助は、グループからちゃんと出す」\n\n僕はそもそもお金のことなど考えていなかった。\n\n向こうから切り出されると、かえって少し恐縮した。\n\n「さっき組会で彼らが報告していたプロジェクトの多くは、彼ら自身の卒業論文でもある。我々の課題組の待遇は非常にいい。修士生は毎月一、二千の補助を受け取れるし、博士やポスドクは言うまでもない」\n\n「徐磊なんかは、プロジェクトの出来がどうであれ、グループから毎月数千元を出している。これに国家から毎月二千八の補助も加わる」\n\n彼はごく自然に言った。\n\nだが、聞いている僕は目玉が地面に落ちそうだった。\n\n「我々の課題組の運営方式は、課題組のお金で皆を支え、皆が勉強し、論文を出し、学位を取れるよう助けるというものだ」\n\n「それに普段から外へ会議に行く機会も多い。交通費もホテル代も、我々の課題組が全部精算する。少し前、徐磊が川西へ会議に行ったが、一銭も彼には出させていない。言ってみれば、グループがお金を出して君たちを旅行に行かせるようなものだ」\n\nそこまで言って、劉先生は笑った。\n\n「だから我々のグループでは、真面目にやりさえすれば、一、二年のうちにかなり良い論文を一本出すことは、完全に可能だ」\n\n論文。\n\n保研。\n\nそれらの言葉は、本来なら僕からとても遠いものだった。\n\n学院の掲示板に貼られた優秀卒業生の証明写真みたいに。\n\n「もちろん、これらはまだ急がなくていい。帰ってからゆっくり考えればいい」\n\n彼は話を少し引き戻した。\n\n「興味があると思えば、もっと来なさい。我々のグループは、皆に非常に良いプラットフォームを提供していると言える。君が努力し、学ぶ気さえあれば」\n\n僕は力いっぱい、うなずいた。\n\nそれでも、態度が十分誠実ではないのではないかと不安になった。\n\n「来なさい。これを見て。今日また博士生の論文が核材料系のジャーナルに受理された。これで今年、我々の課題組では五本目の核材料だ……」\n\n……\n\nそれからさらに十五分ほど経って、僕はオフィスを出た。\n\n手にしたミネラルウォーターは、まだ開ける機会すらなかった。\n\nだが、この短い十五分のあいだに、僕はまるで人生の運命が変わる瞬間を経験したような気がしていた。\n\nこのときの気持ちをまとめるため、僕は具体的な言葉を必死に探していた。\n\n同時に、廊下の灯りはもう点いていた。\n\nその向こうの会議室の入口で、潘虹がまだ別の人と話していた。\n\n僕がそばを通り過ぎると、潘虹はふいに顔を上げ、こちらを一度見た。\n\nけれど、彼女は何も言わなかった。\n\nだから僕も、礼儀として軽くうなずいただけだった。\n\nその視線にどんな意味があったのか、そのときの僕はまったく気づけなかった。\n\nなぜなら当時、僕の頭の中にはただ一つの考えだけが、狂ったように笑っていたからだ。\n\n僕の青春転生爽文ルート、やっぱり何も問題ないじゃないか。\n\n……\n\n師大の図書館は、キャンパスのメインロードの片側にあった。\n\n量子棟ほど新しくもなく、教学楼ほど古くもない。\n\n淡い色の外壁と大きなガラスは、道沿いの木々に半分隠れていた。旧館の輪郭はまだ残り、西側に新しく増築された部分は、より清潔に明るく見えた。\n\n夕方になると、入口前の階段をさまざまな人が絶えず行き来していた。\n\n図書館の席は、公式アカウントで事前に予約する必要がある。\n\nアカウントには各自習室の座席予約状況が表示され、緑は空席、赤は予約済みを表す。システムはさらに、予約開始前後の規定時間内にチェックインしなければ、席は自動的に解放され、予約者は違反扱いになると注意していた。\n\n僕は本当は窓際の席を選びたかった。\n\n何しろ、後ろの席、窓際、王の故郷である。\n\n残念ながら、王になりたい人間は疑わしいほど多かった。\n\n窓際の列は全部赤。\n\nいくつもの階の自習室をめくっても、どこも同じだった。\n\n結局、僕は三階の、コンセントがある席を選ぶしかなかった。\n\n……\n\nそして、今のこの場面に至る。\n\n淡いベージュのシャツを着た陳小雲は、僕の向かいに座っていた。黒髪は無造作に低い位置で結ばれ、数本が自然に耳元へ落ちている。\n\n【お互いさま】\n\n草稿用紙を返して数秒後、陳小雲の口元がほんの少しだけ上がった。\n\n同時に、僕は彼女の前に置かれた本のタイトルを見た。\n\n『共産党宣言』。\n\n本は厚くなく、紙の端は少し古びていた。\n\n僕はその書名を二秒ほど長く見つめた。\n\n僕の寮の本棚にも、たしか一冊あったからだ。\n\nただし新品ではなく、紙の端は黄ばみ、表紙も少し擦れて古くなっていた。\n\n【この本、読んでみたい？】\n\n僕は少女の観察力の鋭さに驚いた。\n\n【いや、ちょっと気になって二度見しただけ】\n\n【そっかぁ╮(╯-╰)╭】\n\nその行を見たとき、陳小雲本人も、彼女が描いた小人と同じように少し口を尖らせたように見えた。\n\n僕は一瞬、迷ってしまった。\n\nなぜかは分からないが、彼女はどうやら僕にその本を読んでほしそうだった。\n\n【次に機会があったら、借りるよ】\n\n「また今度」は、最も古典的な断り文句である。\n\nだから、彼女はもう何も書かなかった。\n\n僕たちの「紙のやり取り」ゲームはいったん終わり、またそれぞれ下を向いて、自分の本を読み始めた。"},{"title":"第五章：実力を証明するには試験が必要だ","file":"第二巻/5、第五章.md","volumeTitle":"第二巻：最初に立てたフラグほど折れやすい","text":"方先生が白い答案用紙の束を抱えて教室に入ってきたとき、僕は驚きはしなかったが、少し緊張していた。\n\n数日前には、方先生が月例テストの告知をしていたからだ。\n\n高校時代、週テスト、月例テスト、さらには毎晩の自習時間に行われる小テストまで、試験というものは日常だった。まるで一つ一つのtRNAが、「高校」という名の途切れないmRNAを追跡しているみたいに。\n\n大学に入ると、どの授業でも第一回目に先生が学期の大まかな予定を説明する。今学期は専門科目の『力学』と『高数』には別途試験があるが、それ以外の科目は基本的に期末試験だけだった。\n\n試験に対してほとんど本能的な拒否感がある一方で、このときの僕は、少しだけ期待していて、少しだけ興奮していた。\n\n入学してからというもの、授業以外の時間、僕はほとんど図書館、寮、食堂という三点を往復していた。劉先生の研究室に入ってからは、そのルートに「量子楼」という名のセーブポイントが一つ増えた。\n\n大学で指定された基礎科目については、たとえ一番肌に合わない金融の選択授業であっても、僕は一度も欠席していない。「資本」だの「市場」だのが背景音として流れるなかで『固体物理』を勉強するのも、ある意味ではなかなか得がたい享受なのかもしれない。\n\n「今日は月例テストです」\n\n方先生が答案用紙を教卓に置く。声は大きくなかったが、教室の中で本をめくる音や話し声が、きれいに止まった。\n\n事実として、中国人は「内巻き」という行為にかなりの才能を持っている。\n\nそして僕は、号主のセーブデータを完全には読み取れない状況で、どうにか号主の「代行プレイ」をするため、全力で巻くしかなかった。\n\n［号主様に本気を出させられず、誠に申し訳ございません〜］\n\nもっとも、寮の連中の目には、このすべてがたぶん「お前より頭のいい奴が、お前より努力している」という図に見えているのだろう。\n\n朱銘は僕の隣に座って、ペンケースのファスナーを開けた。\n\n「うわ、マジかよ」彼は声を落とした。「なんか高考みてえな空気じゃねえか」\n\n「高考は極限と導関数だけじゃ終わらない」\n\n「そう言われると余計しんどいんだけど」\n\n朱銘は僕を見た。\n\n「どうやら俺は縮小版高考ですら厳しいらしい」\n\n僕が慰めの言葉を探そうとしたところで、方先生がふと顔を上げ、視線を前列から後列へと流した。\n\n彼女はすぐには答案用紙を配らなかった。\n\n「程昕亮は来ていますか？」\n\n教室のどこかで、短く笑いが漏れた。\n\nこれは本当に、笑った人を責められない。\n\n物理一班の教室において、程昕亮はもはやただの名前ではなく、一つの「ネタ」へと進化していたからだ。\n\n第一回目の授業は、来てすぐ帰った。\n\n第二回目は欠席。\n\n第三回目も欠席。\n\n第四回目は一応来たが、全編を通して非常に安らかに眠っていた。\n\n第五回目以降、方先生が点呼で「程昕亮」と読むたび、その口調はすでに、太陽が今日もちゃんと昇ったかどうか確認するようなものになっていた。\n\n「先生、俺ここにいます」\n\n僕は反射的に振り返った。\n\n後ろの席に座っていた程昕亮が右手を上げ、同時にもう片方の手で口元を隠してあくびをした。\n\n「あら、試験にも来ないのかと思ったわ」\n\n方先生は笑っていない笑みを浮かべて、不真面目な程昕亮を見た。\n\n程昕亮は豆乳を机の端に置き、真剣に考えてから言った。\n\n「まさか。先生、ご存じでしょう。俺、試験が一番好きなんで」\n\n方先生の口角がわずかに引きつった。\n\n「では、満点を取る準備はできているということですね？」\n\nたしかに、程昕亮の欠席率から計算すると、四割の平常点はすでに彼自身の手で「放流」されている。残りの試験でほぼ満点を取り続けて、ようやく落単を回避できるかどうか、という状態だった。\n\n程昕亮はその言葉に返事をしなかった。ただポケットからペンを取り出し、三割の傲慢さと七割の不羈をまとわせながら、くるりと回し始めた。\n\n朱銘が隣で小声で言った。\n\n「この兄さん、メンタルだけは本物だな」\n\n「たぶん、それが彼を後ろの窓際に座らせている理由なんだろうな……」\n\n答案用紙はすぐに配られた。\n\n僕はすぐに解き始めず、まず手元の試験問題を前後にめくって全体を確認した。\n\n兵法に曰く、彼を知り己を知れば百戦殆うからず。\n\n選択問題十問、二十点。穴埋め十問、二十点。証明問題二問、二十点。計算問題三問、四十点。\n\n量は少なくない。前半は速度を上げないと、後半で時間が足りなくなる可能性が高い。\n\n［1. xが0に近づくとき、関数 lncosx / x*2 の極限を求めよ］\n\n-1/2。\n\n数秒見ただけで、僕は心の中で答えを出していた。\n\n少し置換すれば出るじゃないか。\n\n第一問だからだろうか。\n\n極限。\n\n物理競技に参加していたあの姜岚が今ここに座ってこの試験を見たら、たぶんこの問題が草稿紙を侮辱していると感じるだろう。\n\n［2. f（x）=x*2，g（x）=sinx とする。f（g（x））を求めよ］\n\nsinxの二乗じゃないか？\n\n第二問も簡単すぎないか？\n\nもしかして、ジャックポットはまだ溜まっている途中なのか？\n\n［3. 関数 f（x）=lnx / x-1 の定義域は］\n\nこ……これ、明らかに高校数学では？\n\n［4. 数列 2n-1 / 3n-4 の n が無限大に近づくときの極限を求めよ］\n\n［5. 数列……の極限を求めよ］\n\n［6. 既知の……を用いて関数……の極限を求めよ］\n\n……\n\nまさか、後ろに強敵が潜んでいるのか？\n\n……\n\n選択と穴埋めを一気に解き終えたとき、僕は意識して時計を見上げた。10時09分。まだ十分钟も経っていない。\n\n証明問題二問も、ほとんど手間なく「証明」できた。\n\n計算問題三問の難度も、前半の選択穴埋めと比べれば「臥竜鳳雛」といったところだった。\n\n解答しているあいだ、計算そのものに使った意識よりも、別のことを考えている時間のほうが長かった。\n\n全問を解き終えたとき、試験時間はまだ三分の一しか過ぎていなかった。\n\n僕は余光で周囲を見渡した。\n\nほとんどの同学がまだ必死にペンを走らせている。机の端からはみ出した答案用紙の端を見る限り、多くはようやく選択・穴埋めを終えたところらしい。\n\nこれ……\n\nまさか僕だけ別の試験問題を配られたわけじゃないよな？\n\n僕は教壇に座って監督している方先生をちらりと見た。\n\nもしかして僕は、方先生の生き別れの実子なのか？\n\nそれならまだ、試験用紙を配り間違えたほうを信じたい。\n\n僕はペンを置き、また持ち上げた。\n\nこのタイミングで先に提出するのは明らかに不適切だ。間違いなく衆矢の的になる。\n\n「先生、トイレに行きたいです」\n\n僕のペン先が止まった。\n\n静まり返った教室で、後ろから突然聞こえたその声に、真面目に試験を解いていた同学たちは一瞬固まった。定力の足りない数人は、そのまま振り返った。\n\n「試験中にきょろきょろしない！」\n\n方先生は程昕亮の訴えを直接無視した。\n\n「先生、トイレに行きたいです！」\n\n程昕亮は先生が高齢で耳が遠くなっていることを心配したのか、親切にもさらに大きな声でもう一度繰り返した。\n\n「試験中にトイレは禁止です」\n\n「先生、本当にトイレなんです。我慢できそうにありません！」\n\n程昕亮の声は切迫していた。しかも腰を曲げ、身体をくねらせるという演技まで添えていた。そうしなければ、何らかの液体が次の瞬間にも……\n\n「もういい、今回だけです。早く行きなさい！」\n\n方先生もさすがにどうしようもなくなり、許可を出した。\n\n許可を得た程昕亮は、歓喜に満ちた勢いでドアを押し開け、走って出ていった。\n\nこの人、本当に不真面目すぎるだろ……\n\n開いたままのドアを見て、僕は心の中でため息をついた。\n\n僕は反射的に、彼ともう一人、同じくかなり不真面目な人物を心の中で並べてしまった。\n\n谷懿も普段はかなり大雑把で、時々とんでもない操作をする。しかし、その奔放な言葉の下には、深い哲学的思考と知恵が隠れている。\n\nでは程昕亮は？\n\nどうやら彼には「道化」という称号しか似合わなさそうだった……\n\n……\n\n五分が過ぎた。\n\n十分が過ぎた。\n\n程昕亮は戻ってこない。\n\nまさか大のほうなのか？　僕はかすかに妙な気配を感じた。\n\n同じく異変を感じたらしい方先生が、椅子から立ち上がって教壇を降りた。\n\n僕は余光で、彼女が教室の後ろへ歩いていき、程昕亮の空席の前で止まるのを見た。\n\n彼女は机の上に平らに置かれていた答案用紙を手に取った。\n\n次の瞬間、表情が変わった。\n\n彼女はすぐに答案を置き、身を翻して一歩で教室の外へ飛び出した。\n\nそれほど大きな動きが、教室の他の同学の注意を引かないはずがない。けれど、誰にも方先生の一連の動きの意味はわからなかった。\n\n事実は証明した。\n\n僕らはまだ \"too young\"、\"too simple\"、\"sometimes naive\" だった。\n\n方先生が出ていってから間もなく、程昕亮が教室の入口に現れた。\n\n彼が教室に入ってから、僕の視線はずっと彼を追っていた。\n\n彼は慌てることなく自分の席へ戻る。\n\nそして、ペンを持って書き始めた。\n\nゆっくりではない。\n\nものすごい勢いで。\n\n僕は口元が引きつるのを感じた。\n\nこれが伝説の「山人自有妙計」なのか？\n\n程昕亮は、彼だけのレーンでブルーオーシャンを切り開いてしまったらしい……\n\n待てよ……\n\n程昕亮がもう戻ってきたということは……\n\nじゃあ……方先生は今、何をしているんだ？\n\n……\n\n花は二輪、それぞれの枝に咲く。\n\n休み時間の廊下は、人の往来が絶えなかった。\n\n男子トイレの入口で、方小燕の赤い髪はひときわ目立っていた。\n\n「出てこられるものなら出てきなさい」\n\n方小燕はこうしてトイレの入口に集中して張り込み、一瞬でも油断して程昕亮を見逃すまいとしていた。\n\nそして、その集中の代償として、トイレから出てくる男子は一人残らず、方先生に上から下まで見られることになった。\n\nその結果、ズボンの腰を直しながら出てきた一人の男子が、顔を上げた瞬間、門神のような方先生と目が合った。\n\n「うわっ！　変態だ！」\n\nその男子はズボンを押さえたまま、逃げるように去っていった。\n\n……\n\nたぶん、彼は二度と物電院一階の男子トイレには入らないだろう。\n\nたぶん、方先生もまた、彼女にとっての試験を受けていたのだ。\n\n……\n\nチャイムが鳴り、試験は終わった。\n\n答案用紙は後ろから前へと回収される。\n\n朱銘が自分の答案を前の席へ渡すとき、長く息を吐いた。\n\n「どうだった？」\n\n「終わった」\n\n「それは知ってる」\n\n「お前にはわからん」\n\n朱銘はペンケースを鞄にしまった。\n\n「終、わったんだよ」\n\nそう言って、彼は後ろの、すでに空になっている席を振り返った。\n\n「亮哥、あれどういうことなんだろうな」\n\n「わからない」\n\n僕は正直に答えた。\n\n「先に提出したってことは、それなりに自信があったんだろうけど」\n\n「先生が戻ってきたら教卓に答案が一枚増えてたときの顔、俺、次の瞬間に青龍偃月刀を教卓の下から取り出すんじゃないかと思ったわ」\n\n朱銘は舌を鳴らした。\n\n方小燕が青龍偃月刀を手に高数教室の入口に立っている光景を想像してみた。\n\nまったく違和感がなかった。\n\n方先生の視点で考えれば、これは確かに不思議な事件だ。\n\n出ていく前にも、戻ってきた後にも、教室に程昕亮の姿はなかった。\n\nそれなのに、教卓の上には答案が一枚増えていた。\n\nなぜなら、チャイムが鳴る前に、程昕亮はすでに答案を提出し、一番最初に教室を出ていたからだ。\n\n惜しいのは、彼が答案を出したとき方先生がいなかったことだ。もしその場にいたら、彼女の表情はもっと素晴らしいものになっていただろう。\n\n……\n\nあっという間に、一週間後。\n\n聞き慣れた授業終了のチャイムが、また予定通りに鳴った。\n\n「学委、これが試験の答案です。成績を記録しておいて」\n\n方先生は答案の束を李向陽に渡した。\n\n李向陽は答案を受け取り、頷いた。\n\n次の瞬間、朱銘を含む男子数人が一斉に彼の周りへ集まり、首を伸ばして「天機」を覗こうとした。\n\n「李哥、俺何点？」\n\n「李哥、先にちょっとだけ教えてくれない？」\n\n「李哥、もし不合格なら、まだ言わないで。あと二分だけ生かして」\n\n李向陽は人だかりの中心で、“満身大漢”、“左右逢源”状態になっていた。\n\nもし僕なら、すでに窓を破って逃げる方法を考え始めている。\n\n「整理が終わったら群に送ります」\n\n李向陽は油も塩も通さない。\n\nその言葉を聞いて、周囲の輪はおとなしく散った。\n\n朱銘は席に戻り、肘で僕をつついた。\n\n「姜岚、お前、自分の点数気にならないのか？」\n\n「まあ、普通かな」\n\nそうは言ったものの、内心ではかなり興奮していた。心拍数はもう“あれ”の頻度に追いつきそうだった。\n\n数分後、クラスグループにファイルが一つ送られてきた。\n\n【第一次月测成绩.xlsx】\n\n教室が一気にざわついた。\n\n全員が一斉に表を開く。\n\nただし、誰がこの表を開いても、最初に目に入る一行は同じだった。\n\n［姜岚，学号：202160111021，100］\n\n成績を見た瞬間――\n\n図書館で過ごしたいくつもの昼夜が、一気に全部思い出された気がした……\n\n「うおお！　すげえじゃん！」\n\n僕がまだ何かを考える前に、朱銘が飛びつくように肩を抱いてきた。\n\n「だから全然点数気にしてなかったんだな！　余裕ぶっこいてたわけだ！」\n\n「いやいや、銘哥、運がよかっただけ、運がよかっただけ……」\n\n口ではそんな謙遜をしていたが、自分で言っていても少し殴りたくなる感じがした。\n\n内心では、すでに万丈の波が立っていた。\n\n僕は高ぶる気持ちを押さえつけ、礼儀正しく朱銘に聞き返した。\n\n「銘哥はどうだった？」\n\n朱銘は即座にスマホをズボンのポケットへ入れた。\n\n「教えない」\n\n「……銘哥、表は群に送られてるんだけど」\n\n「……今すぐ李哥に撤回させる」\n\n「……待って！」\n\n「待てない。この行為はプライバシー権と人格尊厳権を著しく侵害し、他の同学の内政に粗暴に干渉し、人権、安全および利益に重大な損害を与えるものであり、私はこれに強い不満と断固たる反対を表明し、直ちに……」\n\n「銘哥！　表の二行目見て！」\n\n僕がここまで驚いたのは、僕の名前の次の行の成績欄にも、同じようにこう書かれていたからだ。\n\n100。\n\n「うわっ！？　もう一人満点いるのか？」\n\n朱銘はゆっくりと表を左へスライドした。\n\n先に学籍番号が現れ、それから名前が現れた。\n\n彼はその三文字をかなり長いあいだ見つめ、それから表を閉じ、もう一度開いた。\n\n閉じる。\n\n開く。\n\n閉じる。\n\n開く。\n\n「なあ、もしかして……」\n\n朱銘の声は異様に重かった。\n\n「李哥が成績、入力ミスした可能性ないか？」"}],"characters":[{"name":"王伊","image":"assets/characters/王伊.png"},{"name":"朱铭","image":"assets/characters/朱铭.png"},{"name":"徐磊","image":"assets/characters/徐磊.png"},{"name":"谷懿","image":"assets/characters/谷懿.png"},{"name":"程昕亮","image":"assets/characters/程昕亮.png"},{"name":"毛锐","image":"assets/characters/毛锐.png"},{"name":"李向阳","image":"assets/characters/李向阳.png"},{"name":"姜岚","image":"assets/characters/姜岚.png"},{"name":"潘虹","image":"assets/characters/潘虹.png"},{"name":"袁林修","image":"assets/characters/袁林修.png"},{"name":"霍钰","image":"assets/characters/霍钰.png"},{"name":"刘克学","image":"assets/characters/刘克学.png"},{"name":"吴悠","image":"assets/characters/吴悠.png"},{"name":"张迪","image":"assets/characters/张迪.png"},{"name":"陈小云","image":"assets/characters/陈小云.png"}]}}</script>
  <script>

    const backgrounds = ['moon', 'skytree', 'tower', 'wires', 'tree'];
