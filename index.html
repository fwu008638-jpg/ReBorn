の物差しのように、僕を頭から足先まで測り、その結果を人前で胸に貼りつけた。\n\n優秀な人間は、見られるべきだ。\n\n優秀な人間なら、見られることにも耐えられるはずだ。\n\n彼の表情から、そんな論理が読める気がした。\n\n「僕は物理班の班導、尹淵」\n\n尹淵は登録表を机に戻し、かすかに笑った。\n\n「書院側も君には少し注目しているんだ。今後、いくつか育成プランがあるかもしれない。身体の状態が学業に影響するようなら、早めに書院へ伝えてほしい」\n\nとても体面の整った言い方だった。\n\n事情を知らない周囲の誰が聞いても、優秀な新入生を気遣う上級生だと思うだろう。\n\nそして体面というものは時々、針をぴかぴかに磨き上げる。刺されたあとでさえ、痛いと叫ぶのをためらわせるくらいに。\n\nけれど僕に聞こえたのは、別の意味だった。\n\n君は本当に、あの物理競賽省二等賞の姜嵐なのか。\n\n今の君は、まだその水準を保てるのか。\n\n事故のあとでも、期待される資格が残っているのか。\n\n僕は口を開いた。喉が少し強張っていた。\n\n「僕は……たぶん大丈夫です」\n\n「たぶん？」\n\n尹淵は突然、その言葉に興味を持ったようだった。\n\n彼は身体の状態を追及せず、話題を軽くずらした。ずらした先は、僕をさらに不安にさせる場所だった。\n\n「競賽では主にどの分野をやっていたの？　力学？　電磁気？　それとも熱学？」\n\nその質問はあまりにも自然だった。\n\n競賽生同士が、新入生受付でつい交わす世間話みたいに自然で、自然すぎて、僕には答えない理由がなかった。\n\n頭の中に、ばらばらの映像がよぎった。公式で埋まった草稿用紙。黒板に描かれた力の分析図。青い表紙の競賽教材。教師がチョークで教卓を叩きながら、「このモデルは覚えておけ」と言っている。けれどそれらの映像は水に浸した紙みたいに、輪郭だけを残し、文字はぼやけていた。\n\n「力学……」僕は一度止まった。「が、多かったと思います」\n\n「そう？」\n\n尹淵は僕を見た。\n\n笑みは消えていなかった。ただ、薄くなった。\n\n「徽州一中の競賽チームって、ずっと電磁寄りだったと記憶しているけど」\n\n心臓が沈んだ。\n\nそれが事実なのか、ただの探りなのか、僕にはわからなかった。\n\nもっと悪いことに、本当でも嘘でも、どう返せばいいのかわからなかった。\n\n「違います」と言えば、なぜ自分がそれを知っているのか説明しなければならない。「たぶん」と言えば、自分がかつて何を学んでいたかさえ覚えていないと認めるようなものだ。本物の姜嵐なら、きっと尹淵を軽く訂正し、ついでに指導教師や問題傾向、省大会の癖について何か話せたのだろう。けれど今ここに立っている人間は、背中の汗が少しずつ服に貼りついていくのを感じることしかできなかった。\n\nその時、横から誰かが手を伸ばし、机の上の登録表を取った。\n\n「尹淵、後ろにまだ人が並んでるよ」\n\n声は高くなかった。けれど、はっきりしていた。\n\n蒸し暑い空気に、一杯の冷たい水が落ちたみたいだった。\n\n尹淵が振り返った。\n\n僕もつられてそちらを見た。\n\nそこに立っていたのは、ひとりの女子学生だった。\n\n彼女はシンプルな薄いベージュの半袖を着ていて、袖口は小腕のあたりまできちんと折られていた。胸には尹淵と同じ班導証が掛かっている。長い髪は後ろでゆるく束ねられ、汗で耳元に貼りついた数本の後れ毛があった。日除けテントの端からこぼれた光が肩に落ち、布地をやわらかな薄金色に照らしている。\n\n周囲は相変わらず騒がしかった。\n\n放送は新入生登録の注意事項を読み上げ、保護者は寮への道を訊ね、ボランティアは「身分証と新入生コードを事前にご用意ください」と繰り返している。けれど彼女を見た瞬間、それらの音が少し遠ざかったような気がした。\n\n彼女は登録表に目を落とした。\n\nその一瞥はとても速かった。速すぎて、彼女が名前を見た時に半拍止まったのかどうか、僕には確信できなかった。\n\nそれから彼女は顔を上げ、自然な表情で僕を見た。\n\n「姜嵐同学、こんにちは。物理班の班導、霍鈺です」\n\n霍鈺。\n\nその名前は、僕の心の中にそっと落ちた。\n\n雷鳴でも、久しぶりの再会でもなかった。\n\nむしろ、ずっと前に聞いた旋律を、壁越しに誰かが一音だけ間違えて弾いたような感じだった。どこから来る懐かしさなのかはわからない。ただ、本能的にこの名前を嫌いではないと思った。\n\n霍鈺は、僕に余計なことを考える時間を与えなかった。\n\n彼女は登録表をボランティアへ返し、パソコン画面を通常の登録ページへ戻した。\n\n「備考欄のことは、あとで輔導員と個別に確認できます。後ろにほかの新入生もいるので、ここで扱う内容ではありません」彼女は言った。「先にキャンパスカードと寮の情報を済ませましょう」\n\n口調は平静だった。\n\n明らかな肩入れも、僕のための説明もなかった。ただ、尹淵が投げ出した問いを、手続きの外へ戻したのだ。越えてきた線を、そっと元の位置へ押し返すみたいに。\n\n尹淵は彼女を見た。\n\n「僕は重点新入生の状況を確認しただけだよ」\n\n「確認は済んだでしょう」\n\n霍鈺は言った。\n\nその一言は、強硬と呼べるほどではない。\n\nけれど尹淵は一瞬止まり、最後にはただ笑って、それ以上は訊かなかった。\n\nボランティアは登録手続きを再開した。\n\n「姜嵐同学、こちらがキャンパスカードです。寮は立華書院A109。鍵はひとまず宿管処で受け取ってください。ここに署名をお願いします」\n\n僕はペンを受け取り、自分の名前を書いた。\n\nペン先が紙に触れた時、奇妙な感覚があった。\n\nこの一ヶ月あまり、僕は多くの場所でこの名前を見てきた。身分証、合格通知書、カルテ、証明書、スマホアカウント。けれど雲夢師範大学の登録表に、自分の手で「姜嵐」と書いたのはこれが初めてだった。\n\n何かの手続きが、ようやく完了したようでもあった。\n\n同時に、何かのなりすましが、ついにシステムに承認されたようでもあった。\n\n署名を終えると、ボランティアは横のファイルから小さな紙を一枚取り出した。\n\n「そうだ、こちらに荷物の受取票があります。差出人はご両親です。書院宛の荷物は、あちらの坂の上にある菜鳥ステーションで一括保管されています。今日の夜七時までなら受け取れます」\n\n「荷物？」\n\n僕は少し固まった。\n\n母からその話は聞いていない。\n\n少なくとも、僕の記憶にはない。\n\nボランティアは頷いた。\n\n「ご家族が先に送ってくれたものだと思います。新入生は、本や寝具を先に送る人が多いですから」\n\n本。\n\n僕の指が少し止まった。\n\nもちろん、その荷物の中身が何なのかはわからない。寝具かもしれないし、ハンガーかもしれない。洗剤かもしれないし、両親が思い出して追加で送ってくれた日用品かもしれない。\n\nけれどボランティアが何気なく口にしたその一文字は、家の本棚に並んでいた、あまりにも見知らぬ背表紙を思い出させた。\n\nもし荷物の中に本があるなら、そこにはあの人の書き込みや折り目、あるいはどこかのページに何気なく引かれた線が残っているかもしれない。\n\nそういうものは成績表よりもずっと個人的で、自分と関係ないふりをするのが難しい。\n\n霍鈺の視線が受取票の上をかすめた。好奇心も、驚きも見せなかった。ただキャンパスカード、寮の情報、受取票を一緒にきちんと整え、僕に渡した。\n\n「なくさないでね」\n\n彼女の指先が紙を離した。\n\n僕はそれを受け取り、礼を言った。\n\n「どういたしまして」霍鈺は言った。「A109なら、木蘭広場の裏の道から行くと近いです。スーツケースが重いなら、正面の階段は使わず、少し回ってスロープを通った方が楽ですよ」\n\nあまりにも滑らかだった。\n\n滑らかすぎて、僕は思わず彼女を見上げた。\n\nけれど霍鈺は、僕が疑問を抱くことまで予想していたかのように、ごく自然に一言を付け足した。\n\n「今日、たくさんの新入生に訊かれたから」\n\n「……ああ」\n\nとても合理的な説明だった。合理的すぎて、これ以上疑えば、僕の自意識が過剰だという話になってしまう。\n\n僕は頷いた。\n\n手続きが終わると、僕はスーツケースを引いて受付を離れた。\n\n太陽はさっきよりも高くなり、広場の人もさらに増えていた。近くでは保護者がボランティア相手に、ベッドの位置は変えられないのかと話している。新入生が地面にしゃがんで荷物紐を結び直している。遠くではサークルが早くもテントを立て、スピーカーからは何期か前の先輩たちが録音したらしい歓迎歌が流れていた。\n\nすべてがごちゃごちゃしたまま、前へ進んでいた。\n\n数歩歩いてから、僕は思わず振り返った。\n\n尹淵は日除けテントの影の中に立ち、別の新入生と話していた。距離があっても、その立ち姿からは一種の余裕が見て取れた。彼は自分がここでどんな位置にいるのかをよく知っている。そして他人が自分をどう見るべきかも、よく知っている。\n\n霍鈺は机の後ろに戻り、風で乱れた書類を低頭して整えていた。胸元の班導証が軽く揺れ、プラスチックケースの縁が陽射しを反射して一瞬だけ光り、すぐに消えた。\n\n僕は手の中の受取票に目を落とした。\n\n受取人：姜嵐。\n\n受取住所：雲夢師範大学立華書院菜鳥ステーション。\n\n僕は受取票をファイルケースにしまった。\n\n紙は薄く、端は僕の指に押されて少し折れていた。\n\n木蘭広場の裏手の道は、正門側より静かだった。両側には木蘭の木が列を作っている。九月はもう花の季節を過ぎていたが、枝葉はまだ濃く茂り、地面に落ちた影は風にかすかに揺れていた。まだ完全には開かれていない地図のようでもあり、難解な文字の列のようでもあった。\n\n僕はその影の中を歩いていった。"},{"title":"第三章：A一〇九","file":"3、第三章.md","text":"僕はスーツケースを引きずりながら木陰の道を歩いていた。車輪が路面の細かな継ぎ目を踏むたび、均一な軽い音が続いた。\n\n木蘭の葉は陽射しに照らされて光っている。時折、枝葉の隙間から風が漏れ、熱気が少しだけほどける。けれどそれもすぐ、また元の場所へ集まってきた。\n\n道端では、新入生と保護者が絶えず行き交っていた。\n\n巨大な編み込み袋を二つも抱え、数歩進むたびに手を持ち替える人がいた。キャンパスマップを目の前に広げ、スマホのナビの矢印と何度も見比べている人がいた。木の下に立って両親の写真を撮っている女子もいた。父親は緊張した様子で襟を整え、母親は笑いながら日傘を背中側へ隠している。レンズの中の校門を遮らないように、ということらしかった。\n\n立華書院は灰白色の建物だった。正面玄関は高くないが、整然とした印象がある。入口の両側には、まだこの暑さに慣れきっていないらしい鉢植えがいくつか並び、葉先が少し巻いていた。ホールには淡い色のタイルが敷かれ、空調は十分とは言えなかったが、それでも外の熱波を半分くらいは食い止めてくれていた。\n\n宿管の窓口は一階の左側にあった。\n\n窓口の前には三、四人ほど並んでいた。鍵を受け取る人、洗濯機の場所を訊く人、ガラス越しに「夜は寮に入れるのか」と何度も確認する保護者。宿管のおばさんは鍵棚をめくりながら、慣れた口調で質問に答えていた。その声は、同じ文句をもう何百回も言ってきたみたいに安定していた。\n\n僕の番になり、キャンパスカードと寮の情報を差し出した。\n\n「A109、姜嵐です」\n\n宿管のおばさんは低頭してちらりと見て、小さな棚から鍵を一本取り出した。\n\n「鍵はちゃんと保管してね。なくしたら再発行。部屋のドアはむやみに開けっぱなしにしないこと。貴重品は自分で管理して。空調のリモコンは隣の箱にあるよ。一部屋に一つ、自分の部屋番号をちゃんと見てから取って」\n\n僕は鍵を受け取り、言われた通り、隣に置かれた仕切り付きのプラスチック箱の前へ行った。\n\n箱の中には透明な袋がたくさん詰め込まれていた。それぞれの袋には小さな白いラベルが貼られ、黒いマーカーの雑な字で寮の番号が書かれている。何度も人に触られたせいで、横向きになったり、斜めに押し込まれたりしている袋もあった。\n\n僕は何度か探した。\n\nA108。\n\nA110。\n\nA107。\n\nA109はない。\n\n手が止まった。\n\n部屋にはもう誰かが着いている。\n\nそういうことだ。\n\n大学生活で最初に直面する現実問題は、理想でも、恋愛でも、学業でも、人生の意味でもない。\n\n見知らぬルームメイトに、どう自然に挨拶するかである。\n\n「次の人」\n\n後ろの人が待ちきれない様子で書類を差し出した。\n\nA109は一階の廊下の突き当たり近くにあった。\n\n廊下はホールより少し静かだった。壁際にはまだ開けられていない宅配箱がいくつか積まれていて、時々、学生が水筒を持って給湯スペースの方から出てくる。A105、A106、A107……と部屋番号が目の前を流れていき、A109が見えた時には、ドアはすでに開いていた。\n\n中に人がいる。\n\n僕は入口で一瞬止まり、それでもドア枠を軽く叩いた。\n\n「どうぞ」\n\n返ってきたのは、はっきりした男子の声だった。\n\n僕はスーツケースを押して中へ入った。\n\n部屋は四人部屋で、上がベッド、下が机のタイプだった。左右に二つずつ。窓側の場所には、まだ整理途中のスーツケースが置かれている。机の上にはノートパソコン、電源タップ、きちんと積まれた数冊の本。男子学生が机の前に立ち、LANケーブルを絡まりにくい輪に巻いていた。\n\n物音を聞いて、彼は振り返った。\n\n「A109？」\n\n「うん」\n\n「李向陽」\n\n男子は僕に軽く頷いた。口調は熱心ではなかったが、冷淡でもなかった。\n\n僕はスーツケースを部屋の中へ引き入れた。\n\n「姜嵐」\n\n李向陽の目が僕の顔に一瞬留まった。何か思い出したようにも見えたが、彼は深く訊かなかった。ただ、ドアに近い右側の机を指差した。\n\nそれで僕は、少しだけ安心した。\n\nもし彼の第一声まで「徽州一中、物理競賽省二等賞、理科総合二百八十点台」だったら、僕はその場で世界線変更申請書を書くところだった。\n\n「ベッドの札は机の端に貼ってある。君はたぶんそっち」\n\n見てみると、たしかに机の隅に白い小さなラベルが貼られていた。印刷された僕の名前がある。\n\n僕はスーツケースを机の横へ押した。\n\n部屋にはもう一人いた。\n\n奥の椅子に、背の高い痩せた男子が座っていた。黒いリュックを足元に置き、スマホをいじっている。僕が入ってきたのに気づくと、彼は顔を少し上げた。\n\n「袁林修」\n\n声は小さかった。\n\n僕もこんにちはと返した。\n\n袁林修は頷き、また視線を落とした。\n\n初対面の短い挨拶は、それで終わった。部屋にはしばらく、スーツケースのファスナーを開ける音だけが残った。\n\n効率だけで評価するなら、これはかなり成功した社交なのかもしれない。\n\n僕はリュックを机の上に置き、すぐには整理を始めなかった。\n\n机の上は綺麗に拭かれていた。ベッド札は右上に貼ってあり、隣には剥がしきれなかった透明テープの跡が少し残っていた。\n\n「さっき宿管のところで、リモコン取った？」\n\n李向陽の声で、僕は意識を引き戻された。\n\n振り返る。\n\n「A109のが見つからなかった」と僕は言った。「もう誰かが取ったんだと思ってた」\n\n李向陽の手の中のLANケーブルが止まった。\n\n彼は袁林修を一度見て、すぐに視線を戻した。\n\n「僕は取ってない。僕が来た時、部屋には袁林修だけだった」\n\n空気が少し静かになった。\n\nその沈黙は短かった。気まずいと呼ぶほどではない。けれど、無視できるほどでもなかった。\n\n袁林修が顔を上げた。\n\n「僕じゃない」\n\n説明や弁解という感じではなかった。\n\n李向陽はすぐに言った。\n\n「そういう意味じゃない」\n\n「今は確認してるだけ。リモコンは部屋にあるか、誰かが間違えて取ったかのどちらかだ。まず探そう」\n\nその一言は、「君を信じている」よりも効果的だった。\n\n話題を「誰が取ったのか」に留めず、そのまま次の手順へ進めたからだ。\n\n僕も腰をかがめ、机の下の戸棚を開けてみた。中は空っぽで、新しい家具特有の木くずが少し落ちているだけだった。引き出しとベッド梯子の周辺も見たが、何もない。\n\n李向陽はもっと細かく確認した。\n\n机の上、引き出し、ベッド板の縁、窓台、衣柜の上段。すべて確認し、ついでに壁の空調コンセントと電源スイッチまで見た。\n\n「部屋にはなさそうだ」\n\n彼は言った。\n\n袁林修は何も言わず、自分の足元のリュックを持ち上げ、下にも何もないことを見せた。\n\nその時、廊下の外からスーツケースを引く音がした。\n\n音は最初、廊下の端から聞こえた。それからだんだん近づいてくる。途中で、誰かが抑えているつもりなのに明らかに聞こえる息切れも混じっていた。\n\n「あの……A109ってここですか？」\n\n入口から一人が顔を覗かせた。\n\n背の高い男子だった。肩幅が広く、背中にはぱんぱんに膨らんだリュックを背負っている。左右の手にはそれぞれ一つずつスーツケース。前髪は汗で少し濡れていたが、顔の表情はとても誠実そうだった。\n\n「そう」李向陽が言った。\n\n男子はようやく安全地帯を見つけたみたいに、ほっと息をついた。\n\n「よかった！　兄弟たち」\n\n僕は反射的に場所を空け、ついでに片方のスーツケースを支えた。\n\n「ありがとうありがとう」\n\n男子は荷物を部屋へ押し込み、手で汗を拭った。\n\n「朱銘。松江出身。物理班」\n\nそう言って、彼は部屋を見回した。\n\n「で、君たちは……もう寮会議始めてる感じ？」\n\n「空調のリモコンが見つからない」と僕は言った。\n\n朱銘は頭上で静かすぎるほど沈黙している空調を見た。\n\n「それは確かに重大議題だな」\n\n彼はその一言を非常に真面目な顔で言った。そのおかげで、空気が少し緩んだ。\n\n気まずい場面で、空気をかき混ぜるのに向いている人間というのはいる。\n\n李向陽が状況を簡単に説明した。\n\n朱銘は聞き終えると、今置いたばかりのスーツケースを横へ押した。\n\n「じゃあ、もう一回探そう。俺は机の下とベッドの下を見る」\n\nそう言ってしゃがみ込んだ。\n\n今度は四人全員が動いた。\n\n李向陽は物が隠れそうな場所を順に確認し、袁林修はベッド梯子を上って、空調の上にも何も置かれていないことを確認した。朱銘は床にしゃがみ、ドアの裏まで見た。僕は自分が引いてきたばかりの荷物の周りをめくってみた。リモコンが僕のスーツケースに勝手に紛れ込むはずがないとわかってはいたが。\n\n数分後、結論は変わらなかった。\n\nリモコンはA109にない。\n\n部屋はかなり蒸し暑かった。\n\n「宿管に聞きに行こう」李向陽が言った。「これは僕たちの問題ではなさそうだ」\n\n朱銘はすぐに立ち上がった。\n\n「行こう」\n\n袁林修もついてきた。\n\n僕はこの件なら二人も行けば十分だと思っていたが、みんなもうドアを出てしまったので、僕も鍵を持ち、最後についていくしかなかった。\n\n宿管の窓口前の人は、さっきより少なくなっていた。\n\nおばさんは低頭して鍵を整理していた。僕たちが用件を説明すると、顔を上げ、男子四人を見た。\n\n「箱はそこにあるでしょ。自分たちで取るんだから、誰がどれを取ったかなんて知らないよ」\n\n「阿姨」と李向陽が言った。「ほかの部屋が取り間違えた可能性を見てもいいですか」\n\n宿管のおばさんは開学初日の小さな混乱を見慣れているらしく、決して熱心とは言えないが、それでも隣のプラスチック箱をこちらへ引き寄せてくれた。\n\n「自分で見て。散らかさないでよ」\n\n李向陽はすぐに隣の部屋番号を探し始めなかった。\n\n「どれがなくなっているかを先に見るのはやめよう」と彼は言った。「今日は早く来る人も遅く来る人もいる。袋がいくつか少ないだけでは、何もわからない」\n\n朱銘が横で小声で訊いた。\n\n「じゃあ何を見るんだ？」\n\n「どの番号が見間違えやすいか」\n\n僕はそのプラスチック箱を見た。\n\n透明な袋に貼られたラベルは、どれも同じ黒いマーカーで書かれていた。字は読めなくはないが、急いで書いたせいで数字がやたら長く伸びているものがある。特に「1」はほとんど一本の縦線で、「9」の丸は潰れ、しっぽが下に引きずられていた。\n\n「隣の番号とは限らないと思う」\n\n僕は口を開いた。\n\n李向陽がこちらを見る。\n\n僕は箱の中で斜めになったラベルを指差した。\n\n「取る時に袋が逆さまだったら、普通の順番で読み間違えたんじゃないかもしれない」\n\n李向陽はすぐには答えなかった。彼は二秒ほど低頭して見つめ、すぐにその考えに沿って先へ進んだ。\n\n「逆さに見ると……」\n\nそれまで隣で黙っていた袁林修が、その時ふいに箱の中の逆向きになったラベルを指差した。\n\n「109を逆さにしたら、601じゃない？」\n\nその一言で、全員が一瞬黙った。\n\n朱銘が袋を低頭して見た。\n\n「ほんとだ」\n\n李向陽はすぐに箱の反対側を探った。\n\n「A601……」\n\n彼は一つの袋を取り出した。\n\n袋の中にはリモコンが入っていて、白いラベルには「A601」と書かれていた。\n\nそれはまだ残っている。\n\n李向陽はそれを一目見て、ようやく眉を少し緩めた。\n\n「つながった。A601のリモコンは残っていて、A109のリモコンはない。おそらく601が僕たちのを間違えて持っていった」\n\n「601？」\n\n朱銘が階段の方を見上げた。\n\n立華書院A区の一階から三階までは男子寮、四階から六階までは女子寮だ。\n\nつまり、601は僕たちが気軽に確認しに行ける範囲ではない。\n\nほとんど同時に、全員がそれに気づいた。\n\n空気が少し微妙になった。\n\n朱銘は鼻の横を触った。\n\n「この問題、急に我々だけで解決するのに向かなくなったな」\n\n李向陽は宿管の窓口を見た。\n\n筋道だけで言えば、最も無難なのは宿管のおばさんに頼んで連絡してもらうことだ。だがその時、おばさんは次の新入生の鍵を探していて、窓口の外にはまた列ができ始めていた。保護者が半身をガラスの前に乗り出して、水カードはどこで作るのかと追及している。その後ろでは、スーツケースを引いた人の車輪が敷居に引っかかり、苛立った音を立てていた。\n\nさらに面倒なことに、僕たちが持っているのはただの推測だった。\n\nA601のリモコンが残っているからといって、A109のリモコンが必ず601にあるとは限らない。もし違っていたら、入学したばかりの男子四人が宿管の窓口前に集まり、女子寮へ連絡してもらって「そちら、僕たちのリモコンを持っていませんか」と訊くことになる。考えるだけで、なかなか言い出しづらい。\n\nまして、僕たちはまだ互いの名前すら完全には覚えていない。\n\n朱銘もそのあたりに思い至ったのか、さっきまでの冗談っぽさを引っ込めた。\n\n「じゃあ……」朱銘は少し迷った。「いったん戻って待つか？」\n\n僕も、それが今のところ一番気まずくない選択だと思った。\n\n空調のないA109が待機に適した場所だとは到底言えないが、宿管の窓口前で女子寮のリモコンの行方を研究し続けるよりは、戻って少し暑さに耐える方がまだ体面を保てる気がする。\n\n頷こうとした時、階段の方から慌ただしい足音が聞こえた。\n\n白い半袖を着たショートヘアの女子が、階段口から小走りで降りてきた。手には袋を一つ持っている。\n\n急いでいるのに、狼狽している感じはない。むしろ明るい生気があった。\n\n開学シーズンには珍しく、忙しさを忙しさのまま、自然に処理できるタイプの人に見えた。\n\n彼女はまず宿管窓口の隣のプラスチック箱を見て、それから箱のそばに立つ男子数人に気づき、足を半拍だけ緩めた。\n\n女子は手の中の袋のラベルを低頭して見た。裏返し、また戻す。\n\n何かを確認したらしく、彼女は顔を上げて僕たちを見た。\n\n「あの、A109の方ですか？」\n\n李向陽が頷いた。\n\n女子は両手で袋を差し出し、非常に真面目に軽く頭を下げた。\n\n「すみません！　うちの部屋が取り間違えました」\n\nあまりにも正式だったので、男子四人の方がかえって申し訳なくなった。\n\n朱銘は反射的に半歩横へ避けた。\n\n「大丈夫大丈夫。重大な被害が出たわけでもないし」\n\n女子は身を起こし、少し申し訳なさそうに笑った。\n\n「さっき、私のルームメイトがついでに持ってきたんです。部屋に戻って机に置いたのを見た瞬間、あれ、うちの部屋っていつからA109に改名したんだろうって思って」\n\nそこで彼女はまた少し照れたように笑った。\n\n李向陽は袋を受け取った。\n\n「開学初日はやることが多いですし、間違えるのは普通です」\n\n「この字、ほんとにちょっと似てるんですよね」\n\n李向陽はさっき取り出したA601の袋を彼女に渡した。\n\n「こちらがたぶん、あなたたちの分です」\n\n「ありがとうございます」\n\n女子は本来601のものだったリモコンを受け取った。\n\n「ほら、逆さにすると109に見えません？」\n\n朱銘が頷いた。\n\n「確かに見間違えやすい」\n\n僕もちらりと見た。\n\n109から601へは、視点をひっくり返すだけでいい。\n\n女子は笑った。\n\nA601の袋を胸元に抱え直し、改めて僕たちの方を向いた。\n\n「王伊です。物理班です。今後会った時、できれば最初に空調リモコン事件を思い出さないでくださいね」\n\n朱銘は少し考え、とても真面目に頷いた。\n\n「じゃあ、リモコンを返しに来てくれた人として覚えておく」\n\n王伊は瞬きをした。\n\n「そのバージョンなら、かなり良さそうです」\n\n彼女がそう軽く笑うと、さっきまでの気まずさも一緒に薄れていった。\n\n李向陽は自分の名前を名乗り、ついでにほかの三人も紹介した。\n\n袁林修の番になると、袁林修はただ頷いただけだった。けれど王伊は冷たくされたような顔を少しもせず、ごく自然に彼へも頷き返した。人によって返事の仕方が違うことを、そのまま受け入れているみたいだった。\n\n最後に僕の番になった。\n\n「姜嵐」\n\n僕は言った。\n\n王伊は僕を一目見た。\n\nその一瞥は短く、ほかの人を見る時とほとんど変わらなかった。\n\n「よろしく」\n\n王伊はもう一度僕たちに謝り、それからA601のリモコンを持って階段を上がっていった。\n\n彼女の姿が階段の角に消えると、朱銘は手の中のA109のリモコンを見た。\n\n「行くか。復活の儀式だ」\n\n李向陽が訂正した。\n\n「ただ空調をつけるだけだ」\n\n「大差ない」\n\n僕たちはA109へ戻った。\n\n部屋に入ると、李向陽はリモコンを取り出し、電源ボタンを押した。\n\n空調が「ピッ」と鳴った。\n\n数秒後、送風口がゆっくり開く。\n\n朱銘はその下に立ってしばらく待ち、手を伸ばして確かめた。\n\n「風が出てる」\n\nその口調は、まるで何かの科学実験の成功を宣言しているように厳粛だった。\n\n僕は机の上のリュックを下ろし、ようやく自分の荷物整理を始めた。\n\n持ってきた荷物は多くなかった。服は母が種類ごとに収納袋へ分けてくれていた。常備薬と充電器は取り出しやすい場所にあり、洗面用品の外側には防水袋まで掛けられている。すべてがきちんと手配されすぎていて、僕はほとんど考える必要がなかった。\n\n朱銘の方は、また別の流派だった。\n\n彼が一つ目のスーツケースを開けると、いちばん上には厚手のコートが入っていた。\n\n李向陽がそれを見た。\n\n「雲夢にそれを持ってきたのか？」\n\n朱銘はコートを持ち上げ、少し沈黙した。\n\n「母さんが、南方には暖房がないから冬は寒いって」\n\n「それは間違ってない」李向陽は言った。「ただ、今は九月だ」\n\n朱銘はコートを畳んでクローゼットに入れた。\n\n「これは戦略的備蓄ってやつだ」\n\n袁林修がようやく口を開いた。\n\n「場所を取る」\n\n朱銘は袁林修を見る。\n\n袁林修は付け加えた。\n\n「棚、そんなに大きくない」\n\n朱銘は自分の二つのスーツケースを低頭して見て、それからクローゼットを見た。表情が真剣になった。\n\n「一理ある」\n\n彼は反論せず、本当に収納スペースの再計画を始めた。\n\n朱銘は時々話が跳ねるけれど、やること自体は雑ではないらしい。\n\n李向陽は、すぐにある種の管理モードに入った。\n\n彼は自分が何を担当すると宣言したわけではない。ただ自分の荷物を整理しながら、部屋のコンセント、LANポート、水道電気の支払い方法を順に確認し、ついでに空調の温度は下げすぎない方がいい、初日はフィルターに埃があるかもしれないから最初は送風にした方がいい、と注意した。\n\nそれらの言葉は、嫌な感じではなかった。\n\n少なくとも、「今後この部屋は俺の指示に従え」よりはずっと良い。\n\n袁林修は相変わらず口数が少なかった。荷物も少ない。スーツケース一つ、リュック一つ。あっという間に整理を終えてしまった。ほかの人が話している時もほとんど口を挟まず、本当に必要な時だけ短く返事をする。\n\n僕はいくつかの服をクローゼットに掛け、振り返って、このリモコン一つで半日近く騒いだ部屋を見た。\n\n四つのベッド、四つの机、別々の場所から来た四人。\n\nそして、ようやく働き始めた一台の空調。\n\nなぜか、入ってきた時より少しだけ現実味が増した気がした。\n\n僕がリュックの内ポケットからファイルケースを取り出すと、中の荷物受取票が机の上に滑り落ちた。\n\nそれを見て、まだこの件が残っていたのを思い出した。\n\n受取票の裏には小さな注意紙が貼られている。\n\n> 当日19:00までに、受取コードを提示してお受け取りください。\n\n「宅配？」\n\n隣のベッドの朱銘が、こちら側のクローゼットを整理していて、ちょうどそれをちらりと見た。\n\n「うん。家から送られてきた」と僕は言った。\n\n「大きいの？」\n\n「わからない」\n\n「中身は？」\n\n「ええと……よくわからない」\n\n「一緒に行くよ」朱銘はクローゼットの扉を閉めた。「寝具とかだったら、一人で運ぶの面倒だろ」\n\n僕は断ろうとしたが、朱銘の好意はなかなか押しが強く、結局頷いた。\n\n「ありがとう」\n\n「気にすんな」朱銘は言った。「ちょうど地形を把握したかったし。今夜、飯を食いに行く時に迷子にならないように」\n\n宅配ステーションは立華書院を出て右手、坂を百メートルほど上がったところにあった。\n\n寮の裏はすぐ雲麓山だ。坂は急ではない。けれど、スーツケースを引いている新入生に、自分はなぜこんなに荷物を持ってきたのかと数歩ごとに後悔させる程度の勾配はあった。道端の木陰は斜めに落ち、蝉の声は葉の裏に貼りついている。聞いているだけで、心の中まで熱くなった。\n\nステーションは坂の上にある小さな店舗列の一つだった。入口は想像していたよりずっと狭い。両側には開けられたばかりの宅配袋や段ボールが積まれ、真ん中には辛うじて二人がすれ違える程度の通路が残っているだけだった。寝具を抱えて外へ出ようとする人、低頭してコードを読み取っている人、ロゴ入りの電動三輪車が入口の脇に停まっていて、もともと狭い出入口をさらに塞いでいた。\n\n中には新入生が先に送ったスーツケース、段ボール、編み込み袋がぎっしり積まれていた。送り状の名前が外側にびっしり貼られている。入口には数人の列ができていたが、進みは遅かった。多くの荷物が奥に押し込まれていて、スタッフは一つ探すたびに腰を曲げてしばらく掘り返さなければならない。\n\n僕の前に並んでいたのは、巻き毛の男子だった。\n\n彼は白いTシャツを着ていて、胸には黒い線でできた図案がプリントされていた。近づいてようやく、それが目のような形だとわかった。瞳孔の中には歯車、書頁、そして途中で断ち切られた鎖が組み込まれている。図案の下には小さな英字が一行あり、最後の単語は「freedom」だった。\n\nスタッフが棚の下から段ボールを引き出すと、その男子はすぐにしゃがんで手を貸した。\n\n箱はそれほど大きくなかったが、妙に重そうだった。スタッフが手を離した途端、段ボールの角のテープが重みに負けて少し裂け、中から何冊かの背表紙が見えた。一冊は濃い青の表紙で、もう一冊はタイトルが長すぎて背表紙いっぱいに詰まっている。僕には「存在」「歴史」「批判」といういくつかの字だけが目に入った。\n\n朱銘はその段ボールを見て、同病相憐れむ者の敬意を浮かべた。\n\n「それ、全部本？」\n\n巻き毛の男子は顔を上げた。朱銘の人懐っこさに少し驚いたようだった。\n\n「ほかに何に見える？」\n\nそう言って箱を横へずらし、スタッフからサイン用のペンを受け取った。\n\n「谷懿。哲学系」\n\nその言葉は、ついでに差し出した自己紹介みたいだった。特に誰かへ向けた感じはない。\n\n朱銘もそのまま受けた。\n\n「朱銘。立華書院、物理」\n\n「物理はいいね」谷懿は伝票にサインし、ペンを返した。「世界がどう運動するかを研究する。ただ、僕らは多くの場合、なぜ世界はそう運動しなければならないのかを問うわけだ」\n\n朱銘は少し考えた。\n\n「じゃあ、世界が『自分でも知らない』って言ったら？」\n\n「その時点で、君は哲学を初歩的に理解したことになる」\n\n谷懿はとても真面目にそう言った。真面目すぎて、僕は彼が冗談を言っているのかどうか、一瞬判断できなかった。\n\nたぶん、これが哲学系の恐ろしさなのだろう。彼らは冗談を言う時、真理を語っているように見える。真理を語る時は、逆に冗談を言っているように聞こえる。\n\n僕の番になると、スタッフは受取票の番号を見てかなり探し、最後に隅から中くらいの大きさの段ボールを運び出した。\n\n箱は特別大きいわけではない。だが見た目よりずっと重かった。\n\n朱銘が片側を持ってみた。\n\n「おお、これは寝具の重さじゃないな」\n\n僕も片側を受け取った。\n\n「たぶん本だと思う」\n\n自分の箱を起こしていた谷懿がそれを聞き、すぐにこちらへ視線を向けた。\n\n「本？」\n\n僕が答える前に、朱銘が代わりに頷いた。\n\n「八割方そうだな」\n\n谷懿は僕を見た。眼差しが急に親しげになった。\n\n「同志？」\n\nその質問はあまりに早かったので、僕は曖昧に答えるしかなかった。\n\n「かもしれない」\n\n「かもしれない？」\n\n谷懿はその答えが気に入ったようだった。\n\n「いいね。少なくとも、本のタイトルを二つ覚えただけで自分にラベルを貼りたがる人間ではないらしい」\n\n僕は黙った。\n\n彼の言うことは筋が通っていた。問題は、僕はその二つのタイトルでさえ、ちゃんと覚えているか怪しいということだ。\n\n朱銘が僕を見て、小声で言った。\n\n「今の、わかった？」\n\n僕も小声で答えた。\n\n「わからない」\n\n谷懿は気にした様子もなく、むしろ少し笑った。今にも裂けそうな段ボールを抱え上げると、箱の底が明らかに下へ沈んだ。\n\n「では先に、人類思想史を救助してくる」\n\nそう言って箱を抱え、外へ歩いていった。出口を出る直前、彼はもう一言付け加えた。\n\n「友情提醒。本というものは、買う時は軽い。運ぶ時になって初めて、その本質を露わにする」\n\n朱銘は彼の背中を見送った。\n\n「哲学系って、みんなああいう会話するの？」\n\n僕は自分の箱を支えながら、正直に言った。\n\n「僕も知らない」\n\nただ、なんとなく思った。\n\n僕はかなり面倒な人間に出会ってしまったのかもしれない。\n\n「君の家、入学早々に勉強モードへ入らせる気満々だな」\n\n朱銘がそう言い、二人で少し笑った。\n\n寮に戻ってドアを開けると、冷気が部屋の中から押し寄せてきた。李向陽は机の前に座り、キャンパスカードや各種登録資料を整理している。袁林修はイヤホンをつけ、静かにスマホを見ていた。\n\n僕は鍵で段ボールのテープを切った。\n\nいちばん上には透明な収納袋があり、中にはタオルが二枚、物干しロープが一巻き、その他の細々したものが入っていた。横には折りたたまれた付箋も挟まっている。\n\n僕は付箋を取り出した。\n\n> 本はあなたの本棚から選んで入れておきました。読みたくなったら読めばいいし、読みたくなければ先に置いておけばいいです。無理しないで。\n>\n> 着いたら連絡すること。\n\n字は決して綺麗ではなかったが、とても丁寧だった。\n\n僕は「無理しないで」の数文字をしばらく見つめ、付箋をもう一度折って、引き出しの中にしまった。\n\nさらに下には、やはり本があった。\n\n『普通物理学』。\n\n『力学』。\n\n『電磁気学』。\n\nそれから、表紙の少し古い本が数冊。牛皮紙で包まれていたものもあり、背表紙には軽い擦れがあった。僕はそれらを一冊ずつ取り出した。動作はいつの間にか遅くなっていた。\n\nそして、分厚い黒い背表紙が現れた。\n\n『資本論』。\n\n僕の指は表紙の縁で止まった。\n\nもちろん、僕はこの本を知っている。\n\nより正確に言えば、もう一人の姜嵐の記憶と記録の中で、この本に関わる影を何度も見てきた。その影は遠くの灯りみたいに、時々光り、時々また霧の中へ沈んだ。\n\nけれど実際にそれを段ボールから取り出した時、胸のあたりがかすかに強張った。\n\nそれは一冊の本というより、誰かが慎重に送り届けてきた古い持ち物のようだった。僕自身が、開くかどうかを決めるのを待っている。\n\n「本だった？」\n\n朱銘が僕の動作を見て、何気なく訊いた。\n\n僕は我に返った。\n\n「うん」\n\n残りの本を取り出し、大きさ順に本棚へ並べた。『資本論』は一番奥に置いた。背表紙を外へ向けると、その黒い表紙は教材の列の中で妙に沈黙して見えた。\n\nそれらを片づけ終え、何気なくスマホを取り出して時間を見た。画面が明るくなると同時に、通知が一つ表示された。\n\n立華書院新入生グループで、尹淵が通知を流していた。\n\n> 21級新入生全員、本日19:00に聯雲講堂で軍訓動員会を行います。少なくとも十分前には到着し、遅刻しないようにしてください。\n\n「今夜もう動員会？」\n\n朱銘は最後の服をクローゼットに入れたところだった。\n\n「今日のメイン任務はベッドを完成させることだと思ってたのに」\n\nその下に、すぐもう一つメッセージが表示された。\n\n送信者は霍鈺だった。\n\n> 道がわからない同学は、18:40に立華書院の入口に集合してください。班導が案内します。\n\n李向陽は通知を読み終え、言った。\n\n「先に一緒に食堂へ行く？　六時半ごろに寮を出れば、時間は足りるはずだ」\n\n「いいね」朱銘はすぐに頷いた。「今の俺は軍訓動員会より食堂への期待値の方がかなり高い」\n\n窓の外では、太陽はまだ沈んでいなかった。建物の外は相変わらず眩しいほど明るい。\n\n僕はスマホを机に置き、本棚の奥にある『資本論』をもう少し内側へ押し込んだ。\n\n黒い背表紙は、何冊かの物理教材に半分隠れた。\n\n「行く？」\n\n朱銘はもう食堂カードを手にして、ドアのところで振り返っている。\n\n「行こう」\n\nドアが閉まる時、A109の空調は背後で静かに冷風を吹き続けていた。"},{"title":"第四章：軍訓という名のもの","file":"4、第四章.md","text":"夕飯は、朱銘が想像していたより慌ただしいものになった。\n\n朱銘は本来、雲夢師大の食堂について真面目に評価するつもりだったらしい。窓口の数、列の進む速度、料理の系統、色合いという四つの角度から、すでに発言の枠組みまで組み立てていた。残念ながら、席に着いてまだ何口も食べないうちに、クラスのグループに新しい通知が飛んできた。\n\n> 21級新入生全員、18:40までに聯雲講堂側門にて軍訓服を受け取ってください。\n>\n> 受け取り後、規定通り着用を整え、19:00より聯雲講堂にて軍訓動員大会を行います。\n>\n> 遅刻しないようお願いします。\n\n朱銘は、まだ数口しか食べていない自分の飯を低頭して見た。\n\n「大学生活初日から、夕飯と時間を奪い合うことになるとはな」\n\n李向陽は時間を確認した。\n\n「今行けば間に合う。先に食べよう。慌てなくていい」\n\n「そうは言ってもさ」朱銘は言った。「軍訓服を受け取って着替える時間もいるだろ」\n\n李向陽はスマホを机の端に戻した。\n\n「じゃあ早く食べればいい」\n\n僕はもともとあまり食欲がなかったが、その一言を聞いて、箸をもう一度しっかり持ち直した。\n\n横では朱銘が、すでに頭を下げて飯をかき込み始めていた。\n\n僕たちは食堂に長居しなかった。外はまだ完全には暗くなっていない。酷暑は、昼がまだ終わっていないことを思い出させるように残っていた。ただ、陽射しの一部だけがこっそり葉の裏へ退いている。\n\nそれでも道路脇の街灯は一つずつ点き始め、地面に淡い黄色の光を落としていた。昼間騒がしかったキャンパスは、夕方の短い時間だけ一層空洞になったようで、まだ息を入れ替える暇もないみたいだった。\n\n聯雲講堂の側門は、ちょうどその逆だった。\n\nすでに列ができていた。\n\n数枚の折りたたみ机が一時的につなげられ、その後ろには段ボール箱が並んでいる。箱の側面には太いマーカーでサイズが書かれていた。上衣170、175、180。ズボン170、175、180。訓練靴39、40、41、42。いくつかの箱は文字の半分がガムテープで隠れ、「混合サイズ」という文字だけが見えていた。\n\n軍訓服は透明なビニール袋に入れられている。濃淡の違う迷彩柄がぎゅうぎゅうに詰め込まれ、その中には帽子、ベルト、黒い訓練靴も入っていた。新しい布、ビニール袋、ゴム底、少し湿気を吸った段ボールの匂いが空気の中で混ざり、夕方の熱気に蒸されていた。倉庫から出してきたばかりの中古品みたいな匂いだった。\n\n僕は列の真ん中あたりに並んでいた。前も後ろも、半袖姿の新入生ばかりだった。\n\n袋を受け取った人がその場で開け、上着を体の前に合わせ、すぐに顔をしかめる。\n\n「これ、大きすぎない？」\n\n「大きいならベルトで締めて」軍訓服を配る先輩は顔も上げなかった。「後ろにまだ人がいるから、詰まらせないで」\n\n隣では女子が靴箱を抱えて訊いていた。\n\n「先輩、三十七の靴はありますか？」\n\n「先に三十八を持って」別の靴担当の学生が言った。「サイズが足りない分は、明日まとめて交換」\n\n「でも三十八だと脱げます」\n\n「中敷きを入れて」\n\nその人は早口で言った。声には隠す気のない苛立ちが混じっていた。\n\n女子は唇を少し噛み、それ以上は言わなかった。ただ、明らかに足に合わない靴を胸元に抱え、横へ一歩下がった。\n\n列は進み続けた。\n\n僕は彼女が階段脇に立ち、無意識に靴箱の縁を指でいじっているのを見ていた。箱の蓋はきちんと閉じておらず、中の黒い靴面が少し見えている。その幅は、彼女の足首よりもずっと広そうだった。\n\nもちろん、大したことではない。\n\n少なくとも、この場では誰もがそう思うだろう。靴が少し大きい。服が少しだぶつく。帽子が少し曲がる。少し我慢すれば終わることだ。軍訓はそもそも人を快適にするためのものではない。配る側は忙しい。新入生は多い。サイズが合わないことくらいある。いくらでも理由は言える。\n\n僕は、相手の代わりにその理由を一通り考えてしまっていた。\n\nけれど、まさにそれらの理由が全部それなりに合理的だからこそ、胸の中が少し詰まった。\n\nその時、別の列から見覚えのある人影が離れた。\n\n王伊だった。午後と同じ白い半袖を着ている。彼女は靴を配っている人の前にいきなり立ち塞がったりはしなかった。相手が次の靴を渡し終えるのを待ってから、ごく自然に声をかけた。\n\n「すみません、少しだけいいですか」\n\n靴担当の男子が顔を上げた。\n\n「何？」\n\n「この子の靴、本当に大きすぎるんです」王伊は隣の女子を指し、軽い口調で言った。「もう一度だけ、合うサイズがないか見てもらえませんか。今なければ、明日私も一緒に交換に来ます。でも今夜の動員会から履くんですよね。歩いている途中で靴が脱げたら、かなり気まずいと思うので」\n\n男子は女子の抱える靴箱を見て、また後ろの列を見た。\n\n「三十七は本当にあるかわからない」\n\n「あそこにまだ開けてない箱がありますよね？」王伊は机の下に押し込まれている段ボールを指した。「上に37から38の混合サイズって書いてあるように見えます。よければ私も一緒に探します。二人なら早いですから」\n\nそう言い終える頃には、彼女はもう腰をかがめ、段ボールの縁に手をかけていた。\n\n動きがあまりにも自然だった。\n\n自然すぎて、その男子は「駄目だ」とも「いいよ」とも言う前に、結局一緒に箱を引っ張り出すしかなかった。\n\n段ボールはガムテープできつく封じられていた。王伊はポケットから小さな鍵を取り出し、その先でテープを切った。\n\n「すみません、皆さん、半分だけお時間ください」\n\n後ろの数人は手を振った。\n\n「大丈夫です」\n\n箱を開けると、二人は苦労することなく三十七の靴を見つけた。\n\n王伊は振り返り、その靴を女子へ渡した。\n\n「試してみる？」\n\n女子は明らかにほっとして、小さな声でありがとうと言った。\n\n王伊は笑って首を振った。\n\n「どういたしまして。軍訓はまだ始まってないんだから、まず靴に負けないで」\n\n少し茶目っ気のある言い方で、近くの数人が笑った。列とサイズ違いで積もっていた苛立ちも、彼女に軽く受け流された。\n\n僕は列の中で、王伊が段ボールを机の下へ戻し、手を払って立ち上がるのを見ていた。\n\n彼女は大それたことをしたわけではない。\n\nただ、誰かが横に退いた時に、ちょうど一歩前へ出ただけだった。\n\n「姜嵐」\n\n前方から李向陽の声がした。\n\n我に返ると、もう僕の番だった。\n\n「身長は？」軍訓服を配る先輩が訊いた。\n\n「一七〇です」\n\n相手は箱から一式を取り出し、手慣れた動作で僕に渡した。\n\n袋の中では、迷彩の上着が四角く折られていた。帽子のつばはベルトの下に押し込まれ、硬い弧を少し覗かせている。\n\n朱銘が受け取ったのは一八〇サイズだった。\n\n李向陽はすでに、袋の中身が揃っているか独り言のように確認している。\n\n「上衣、ズボン、帽子、ベルト、靴……」\n\n「李哥」朱銘が言った。「物を確認してる時の君、旅行三日前にはチェックリストを印刷してそうな人に見える」\n\n「印刷はしない」李向陽は言った。「スマホのメモで十分だ」\n\n講堂の後方には、新入生が着替えるためにいくつかの空き教室が臨時開放されていた。\n\nドアを開けると、教室は人でいっぱいだった。机と椅子は壁際に押しやられ、みんなビニール袋を机や床に置き、まだ折り目のついた軍訓服にぎこちなく着替えている。\n\n迷彩の上着は、思っていたより硬かった。\n\n布が腕を擦ると少しざらつき、襟の内側のタグは首筋に当たってちくちくする。ベルトの金具は安っぽい金属で、留める時に軽い音を立てた。ズボンの腰は少し緩く、裾はやや長い。靴底は薄く、床のタイルの硬さが伝わってくるほどだった。\n\n教室のあちこちで、布の擦れる音と金属片の触れ合う音がしていた。スマホの画面を鏡代わりに帽子を整える人、ベルトを逆向きに通してしまい、外して締め直す人、靴紐を結びながら「この靴、クッションという概念がない」と文句を言う人。\n\n朱銘のズボンの裾は明らかに長かった。彼は数秒それを見下ろし、最後に一折りした。\n\n「どう見える？」\n\n僕は彼を一目見た。\n\n「少なくとも軍人には見えない」\n\n「よし」\n\n李向陽は腰帯の余った部分を腰の横へ差し込んでいた。\n\n「とりあえずこれで。動員会が終わってから戻って調整しよう」\n\n僕も袖口を整えた。迷彩の布地は肌に張りつき、すぐに背中から汗が滲んできた。さっきのビニールとゴムの匂いは消えるどころか、みんなが同じ服を着たせいで、さらに濃くなっている。\n\nその瞬間、ふと意識が揺れた。\n\n車のライトでも、病院でもない。\n\n蒸し暑い部屋だった。似たような靴を履いたたくさんの足がセメントの床を踏んでいる。空気には機械油、汗、そして安い接着剤のような匂いが混じっていた。誰かが入口に立ち、こう叫んでいる。\n\n「支給されたもんを着ろ。仕事するのに、合うだの合わないだの言ってられるか」\n\nその声はすぐ近くにあるのに、分厚い水の層を隔てているようにも聞こえた。\n\n僕は顔を上げた。\n\n教室は、やはり教室だった。\n\n窓の外では空が少しずつ暗くなり、廊下では班導が新入生に入場を促している。\n\n「行こう」李向陽が言った。「そろそろ入る時間だ」\n\n僕は脱いだ服を袋に詰め、彼らと一緒に教室を出た。\n\n聯雲講堂は、想像していたより大きかった。\n\n照明はすでにすべて点いていて、冷たい白い光が頭上から降り、全員の迷彩服を少し色褪せたように見せている。空調は強く、外から入った直後は少し寒いほどだった。けれど人が増えると、熱気と布の匂いはすぐに座席のあいだへ浮かび上がってきた。\n\n新入生たちが次々に入場してくる。\n\nみんな似たような軍訓服を着て、ビニール袋や靴箱を抱え、まだ動きに慣れていない。帽子が斜めになっている人。ベルトが緩い人。ズボンの裾を折った高さが左右で違う人。椅子の脚が床をこすり、踏まれたビニール袋がしゃりしゃりと音を立て、低い話し声が講堂の中に散っていった。\n\n朱銘が見回した。\n\n「どこ座る？」\n\n李向陽は言った。\n\n「中央寄りの前の方。前すぎると不便だし、後ろすぎると聞き取りにくい」\n\n「経験ありそうな判断だな」朱銘が言った。\n\n「常識だ」\n\n僕たちは最終的に、第六列のやや右側に座った。前方中央には数人の教師と班導が座り、机の上にはミネラルウォーターと印刷された会議進行表が置かれている。演台に近い席は明るすぎるし、静かすぎる。そこに座れば、ほぼ全員の視線にさらされることになる。\n\n僕が足元にビニール袋を置いた時、谷懿が反対側の通路から入ってくるのが見えた。\n\n彼も軍訓服を着ていた。\n\nけれどなぜか、同じ服なのに、彼の身体にはどこか馴染んでいない感じがあった。帽子は脇に挟まれ、襟元から白いTシャツの一部が覗いている。黒い線の図案が迷彩の襟の縁から少し見えていて、まるで完全には隠されなかった注釈みたいだった。\n\n谷懿も僕に気づいたらしい。\n\n彼は数列越しに軽く顎を上げた。挨拶のつもりだろう。\n\n通知の十九時まで、あと十分あった。\n\n講堂はすでに半分以上埋まっていた。\n\n班導たちは通路の両側に立ち、秩序を保ちながら、遅れて入ってくる学生に内側へ詰めるよう促している。尹淵は前列左側に立ち、名簿を持って時々人数を確認していた。白いシャツを着た彼は、迷彩服の集団の中でひときわ涼しげに見えた。\n\n霍鈺は反対側に立っていた。長い髪はまとめられていて、日除けテントの下にいた時より、暑さに追われる慌ただしさが少し薄れている。\n\n僕はただ班導がどちら側にいるか確認するつもりだったのに、視線は彼女の上で少し余計に止まった。\n\n十九時ちょうど、会議は始まらなかった。\n\n十九時三分、講堂の話し声が増え始めた。\n\nさらに数分が過ぎると、後方では「遅刻するなって言ったのに」と小さく文句を言う声が出た。隣の人が少し笑い、すぐに声を落とした。班導たちは何も言わず、時々入口の方を見るだけだった。\n\n朱銘は椅子の背にもたれ、小声で言った。\n\n「俺たちが受け取った集合時間と、偉い人たちの時間って、そもそも同じ時計じゃないんだろうな」\n\n李向陽は言った。\n\n「正式な会議には普通、組織調整の時間が含まれている」\n\n「それ、誰かを弁護してるみたいに聞こえる」\n\n「事実を述べてるだけだ」\n\n朱銘が僕を見る。\n\n「姜哥、評価をどうぞ」\n\n僕が答えようとした瞬間、講堂の入口から整った足音が聞こえた。\n\n大きな音ではなかった。けれど、揃っていた。\n\n空気の中に散っていた低い声が、見えない手で押さえつけられたように、だんだん止まっていく。全員が反射的に入口を見た。\n\n統一された制服を着た教官の一隊が、側門から入ってきた。\n\n彼らはただ歩いてきたのではない。二列に並び、歩幅を揃えて通路を進んできた。靴底が床を踏む音が、一歩ごとに講堂の中へ打ち込まれていく。\n\n彼らの服は、新入生に配られた軍訓服とは明らかに別物だった。新入生の迷彩布は薄くて緩く、折り目もまだ残り、ズボンの裾が靴の上にたまっている人もいる。だが彼らの服はずっと張りがあった。肩線、ベルト、帽子のつばはちょうどよい位置に収まり、袖口でさえ見えない定規で測られたようだった。\n\n教官たちは演台の前で止まった。\n\n先頭の男は、特別背が高いわけではない。けれど肩と背中はぴんと張っていた。彼は立ち止まってすぐには話さず、後列から前列へ、左側から右側へ、視線だけをゆっくり走らせた。\n\n講堂は完全に静かになった。\n\n数秒後、彼は突然口を開いた。\n\n「後ろの席、前へ詰めろ」\n\nマイクは使っていなかった。\n\n後ろの学生たちは一瞬固まった。\n\n「聞こえなかったのか？」\n\n教官の声が急に高くなった。\n\n「後ろは全員前へ詰めろと言っている！　前にこんなに席が空いているのに、お前たちは芝居でも見に来たのか、それとも会議に来たのか？」\n\nようやく後ろの学生たちが動き始めた。\n\n椅子の脚が床を引きずり、ビニール袋が慌ただしく持ち上げられる。誰かが落とした帽子を拾おうとして、少し動きが遅れた。\n\n「早くしろ！」\n\n男は移動する人の列を睨んだ。\n\n「歩くのもぐずぐずして、何だその様は？　列の作り方も、歩き方も、教わったことがないのか？」\n\n通路を移動していた数人の学生が明らかに硬直した。\n\n混雑の中、ある男子の手から袋が落ちた。袋が開き、中から靴が半分転がり出る。彼が拾おうと身をかがめた時、演台の上から教官の声がまた降ってきた。\n\n「前を見ろ！　その程度の協調性もないのに、明日訓練場へ行ってどうする！」\n\n男子の顔が一気に赤くなった。\n\n僕は第六列に座っていたので、移動を求められなかった。けれど背中は同じように強張った。\n\n後ろの学生が全員座り直すと、教官はようやく演台の中央へ歩き、マイクを手に取った。\n\n音響から耳障りなハウリングが鳴った。\n\n多くの人が反射的に眉をひそめた。\n\n「毛鋭だ。今回の軍訓の総教官を務める」\n\n彼は一拍置き、台下を見渡した。\n\n「今夜から軍訓が終わるまで、私を見たら毛教官と呼べ。ほかの教官を見ても『教官好！』と挨拶しろ。わかったか？」\n\n「わかりました」\n\n台下の返事はまばらだった。\n\n毛鋭の帽子のつばの下の表情は、曇ったり晴れたりしそうでしなかった。\n\n「聞こえない！」\n\n今度は声が大きくなった。\n\n「わかりました！」\n\n「まだ聞こえない！」\n\n「わかりました！」\n\n講堂の声は無理やり引き上げられ、壁にぶつかって反響した。\n\n僕も一緒に叫んだ。周りの全員が叫んでいたので、僕の声もその中に巻き込まれた。\n\n毛鋭はようやく少し頷いた。\n\n「雲夢師範大学に合格できたということは、頭は悪くないはずだ。特に立華書院は、各専攻の優秀な学生が集まっていると聞いている」\n\n彼が「優秀な学生」と言った時、その声には賞賛がなかった。\n\nむしろその四文字をつまみ上げ、手の中で重さを測り、あまり満足できずに投げ返したような感じだった。\n\n「だが言っておく。訓練場に出れば、以前何点取ったか、どんな賞をもらったか、家がどんな条件かなど誰も見ない。軍訓にあるのは一つだけだ。命令への服従」\n\n彼は手を上げ、台下を指した。\n\n「服が合わないなら、自分で克服しろ。靴が足を擦るなら、自分で克服しろ。天気が暑いなら、自分で克服しろ。立っていて疲れるなら、自分で克服しろ。お前たちは享受しに来たのではない。教官と値段交渉をしに来たのでもない」\n\nさっき着替えた時に浮かんだ映像が、また頭の中に戻ってきた。\n\n蒸し暑い部屋。\n\nセメントの床。\n\n似たような靴がたくさん。\n\n誰かが低頭し、右手を袖口の中へ隠した。\n\n「二日も我慢すりゃ慣れる」\n\n次の瞬間、その映像は毛鋭の声に引き裂かれた。\n\n「明朝六時二十分、全員木蘭広場に集合。ひとりでも遅刻すれば、全隊追加訓練。隊列の中にひとりでも指示に従わない者がいれば、全隊追加訓練。不満があっても構わない。不満があっても飲み込め。わかったか？」\n\n「わかりました！」\n\n今度は、ほとんど誰も声を抑えなかった。\n\n毛鋭はマイクを机に戻した。\n\n「よし。明日もその元気があることを期待している」\n\n彼が座ると、講堂には空調の送風音だけが聞こえるほどの静けさが残った。\n\n僕は自分の靴を低頭して見た。\n\n深緑の軍訓靴は、床の上にきちんと揃っていた。つま先は隣の人のつま先とほとんど平行で、さっきまで散らばっていた足取りさえ、台上の声によって同じ方向へ押し揃えられたみたいだった。\n\n次に登壇したのは輔導員の彭悦だった。\n\n彼女は軍装を着ていなかった。マイクの前に立つと、まず軽く微笑んだ。\n\n「同学のみなさん、こんばんは。これから四年間、みなさんの輔導員を務める彭悦です」\n\n彼女の声は毛鋭よりずっと柔らかく、講堂の空気もようやく少し緩んだ。\n\nただ、続く内容は、だいたい誰でも予想できるものだった。\n\n大学に入ることは新しい出発点であり、軍訓は意志を鍛える重要な一課であり、組織と規律への意識を高め、集団の名誉感を育て、立華学子の精神風貌を示してほしい。\n\n語句はとても整っていた。\n\n整いすぎて、宣伝掲示板に貼られたばかりの紙みたいだった。\n\n僕は周りに合わせて拍手した。\n\n彭悦の挨拶のあと、各班の班導が自己紹介をした。\n\n前の数人の班導が順番に立ち、名前、専攻、連絡先を紹介する。\n\n班導といっても、結局は僕たちより一、二年上の学生にすぎない。\n\n緊張している人もいた。慣れている人もいた。軽い冗談を言おうとした人もいたが、さっき毛鋭が残した空気のせいで、大きく笑う人はあまりいなかった。\n\nまもなく尹淵の番になった。\n\n彼は立ち上がり、台下を向いた。\n\n「学弟学妹のみなさん、こんばんは。尹淵です。十九級立華書院物理班の学生で、今回、物理班の班導を務めます」\n\n声ははっきりしていて安定していた。昼間の受付と同じく、自分が何をしているのかをよくわかっている人間だと、簡単に信じさせる落ち着きがあった。\n\n「入学以来、僕はクラスの団支書を務め、校一等奨学金を受け、数学モデリング競賽やいくつかの科研プロジェクトにも参加しました。班導を引き受けたのは、みなさんが大学に入ったばかりの時期に少しでも助けになれればと思ったからです。同時に、みなさんにはできるだけ早く立華書院のリズムに適応してほしいと思っています」\n\n彼は一度止まった。\n\n「立華書院がみなさんに与える資源は、普通のクラスより少し多いです。資源が多いということは、当然、機会が多いということです。しかし同時に、それはより高い基準を意味します」\n\n礼儀正しい口調だったが、そこには薄い圧力があった。\n\n「大学は高校とは違います。毎日誰かが見張ってくれるわけではありません。緩むこともできるし、自分に厳しくあり続けることもできます。四年間の差は、往々にしてそういうところで開きます」\n\n台下が少し静かになった。\n\n「ここに入れた時点で、みなさんは一度自分を証明しています。ただし、過去の証明は過去を代表するだけです。立華書院には賢い人も、高考の成績が良い人も足りています。本当に優位を残せるのは、自律、効率、そして規則への適応能力です」\n\n「適応能力」と言う時、彼の視線はごく自然に台下を一巡した。\n\n「だから、みなさんには初日から、より高い基準で自分を律してほしい。軍訓も同じです。これはただ日焼けしたり、隊列に立ったりするだけのものではありません。集団生活において、規則は常に個人の感受より先にあるのだと、できるだけ早く理解するためのものです。今後、学習や生活で問題があれば僕に相談してください。ただ、その前にまず自分で問題を解決することも学んでほしいと思います」\n\n拍手が起きた。\n\n次は霍鈺だった。\n\n彼女が立ち上がると、前列の男子数人が明らかに姿勢を正した。朱銘も反射的にそちらを見て、小声で言った。\n\n「霍学姐、人気高いな」\n\n李向陽は台上を見たまま、声を低くした。\n\n「もともと有名だ」\n\n「なんで？」\n\n李向陽は少し止まった。\n\n「理由はいろいろある」\n\n朱銘がさらに訊こうとした時、霍鈺はもうマイクの前に立っていた。\n\nマイクスタンドは彼女には少し高かった。彼女が手を伸ばして低くすると、音響がまた小さく雑音を立てた。彼女は半秒ほど固まり、それから笑った。\n\n「すみません。今夜はみなさんの耳もお疲れさまですね」\n\n台下に、ようやく小さな笑いがいくつか起きた。\n\n彼女は原稿を持っていなかった。\n\n「みなさん、こんばんは。霍鈺です。私も十九級立華書院物理班の学生で、これから尹淵と一緒に物理班の班導を務めます」\n\n彼女の話す速さはゆっくりで、声も高くない。それでも、とても聞き取りやすかった。\n\n「今日は登録したばかりで、手続き、書類、寮、軍訓服で、もう一通り振り回されたと思います。これから軍訓はもう少し大変になります。ただ疲れるだけなら、たぶんみんなで少しずつ慣れるしかありません。でも、本当に体調が悪い時や、自分では処理できない問題に出会った時は、無理に我慢しないでください。班導、輔導員、教官に早めに連絡して大丈夫です」\n\n彼女は台下の新入生たちを見た。\n\n「自分で処理できることは、まず自分でやってみてもいいです。でも本当にできない時に、恥ずかしいと思う必要はありません。大学は、初日からみんなを万能な人間に変える場所ではないので」\n\nその言葉のあと、講堂は一瞬静かになった。\n\nそして拍手が起きた。\n\nさっきより、少し本物に近い拍手だった。\n\n僕も手を上げて拍手した。\n\n掌がぶつかる時、ふと毛鋭がさっき言った言葉を思い出した。\n\n服が合わないなら、自分で克服しろ。\n\n靴が足を擦るなら、自分で克服しろ。\n\n立っていて疲れるなら、自分で克服しろ。\n\n台上の霍鈺を見ながら、彼女は遠くに置かれた灯りみたいだと思った。\n\nもちろん、ほかの人が悪役を演じ、彼女が善玉を演じている可能性も否定できないけれど……。\n\n会議の後半はかなり速く進んだ。\n\n彭悦は明日の集合時間、訓練場所、欠席届の手順、注意事項を読み上げた。毛鋭は横に座ったまま、再び口を開かなかった。けれどその沈黙は、机の上に置かれた鉄の塊みたいで、そこに存在していることを全員が知っていた。\n\n解散時、クラスグループにも正式な通知が流れた。\n\n> 明日6:20、木蘭広場集合。\n>\n> 軍訓服一式を着用し、水筒を持参すること。遅刻禁止。\n>\n> 遅刻者が出た場合、全隊追加訓練。\n\n朱銘は通知を読み、長く息を吸った。\n\n「六時二十分」\n\n李向陽はスマホを取り出し、画面を何度か押した。\n\n「五時五十分起床が安定だな」\n\n朱銘は李向陽を見た。\n\n「その言葉、俺にはちょっと残酷だ」\n\n「なら五時五十五分にアラームをかければいい」\n\n「五分の自由をくれてありがとう」\n\n僕たちは人の流れについて外へ出た。\n\n夜は完全に降りていた。聯雲講堂の外の階段は街灯に照らされて光っている。空気は昼間より少し涼しくなっていたが、まだ湿っていた。講堂の中で空調に冷やされた軍訓服は、外へ出るとすぐまた肌に貼りつき、布が腕を擦り、襟のタグは相変わらず首筋に刺さる。\n\n道には同じ迷彩服の新入生が溢れていた。\n\n靴が硬いと文句を言う人。明日の朝は何時に起きるべきか相談する人。軍訓にアームカバーを持っていけるのか訊く人。けれど、みんなの声は会場へ入る前よりも少し低かった。おそらく毛鋭の声がまだ耳元に残っていて、完全には散っていないのだ。\n\n朱銘は僕の隣を歩きながら、ふいに帽子を脱ぎ、手に持って二回ほど扇いだ。\n\n「この帽子、暑すぎるだろ」\n\n言ったあと、その動作があまり役に立たないと気づいたらしい。けれど彼は帽子をかぶり直さず、そのまま手に持った。\n\n「全国的に有名な985大学なんだから、帽子くらいもう少しまともに作ってくれよ」\n\n前を歩いていた李向陽がその言葉を聞き、振り返って朱銘を見た。\n\n「度胸があるなら、明日それを教官か輔導員に言ってみろ」\n\n「それは無理」朱銘は言った。「俺、馬鹿じゃないし」\n\n彼は少し止まり、もう一言足した。\n\n「ただ、なんか息苦しいんだよ」\n\n今度は李向陽も答えなかった。\n\n僕たち四人は木蘭路に沿って立華書院へ戻った。夜風は昼間の熱を完全には吹き払えず、ズボンの裾と靴下の口は蒸れていた。遠くからは他の新入生の笑い声が聞こえたり遠のいたりしている。\n\n寮に戻ると、空調はまだ動いていた。\n\n部屋の中は外よりずっと涼しかった。冷気が体に当たり、軍訓服に染みた汗が一気に意識される。朱銘は部屋に入るなり帽子を脱ぎ、机の上に置いた。\n\n何か言おうとして、彼の視線はふと空調の吹き出し口で止まった。\n\n「待って」朱銘は一瞬固まった。「俺たち、出る時に空調消してなかった？」\n\n李向陽は顔を上げて一目見た。\n\n「元の予定では、夕飯を食べてから戻って荷物を片づけて、それから講堂へ行くつもりだった」彼は言った。「でも途中で直接軍訓服を取りに行く通知が来た」\n\n「つまりこいつ、二時間以上、誰もいない部屋を冷やし続けてたってこと？」朱銘が言った。\n\n最後に入った僕はドアを閉めながら、少し後ろめたくなった。\n\n「電気代ってどうなるの？」と僕は訊いた。\n\n「寮で割り勘」李向陽が言った。\n\n朱銘は二秒黙った。\n\n「今この瞬間から、俺はこの冷風の一口一口を貴重なものとして扱う」\n\n僕は自分の椅子に座り、ベルトを外し、服を脱いで椅子の背に掛けた。軍訓服が体から離れた瞬間、襟のタグで擦れた首筋が、ようやく少し痛み始めた。\n\n指で触れると、小さく腫れている。\n\n大したことではない。たぶんすぐ消える。\n\nスマホが光った。\n\n> 登録は順調だった？\n>\n> 軍訓は明日から？\n\n僕は低頭して文字を打った。\n\n> 順調。\n>\n> 明日の朝集合。\n\n少し考えて、もう一文足した。\n\n> 服は少し合わないけど、大した問題じゃない。\n\n送ると、母はすぐ返してきた。\n\n> 合わないなら早めに交換して。体調が悪かったら先生に休みをもらいなさい。\n\nその文字を見ながら、僕は台上で霍鈺が言った言葉を思い出した。\n\nそれから、毛鋭の「自分で克服しろ」も。\n\n何を返せばいいか考えていると、隣で朱銘がわざとらしく咳払いした。\n\n「大学寮の伝統に従うなら」彼は言った。「初日の夜、寝る前には、意味はないけど必要な夜トークをするべきじゃないか？」\n\n李向陽は机の整理を続けたまま、顔も上げなかった。\n\n「明日は早い」\n\n「だから簡略版を申請する」朱銘は言った。「三分」\n\nそう言うと、ほかの人の同意を待たずに椅子にもたれた。\n\n「今日、一つ気づいたことがある」\n\n「何？」\n\n部屋が少し静かになった。\n\n僕はスマホをしまおうとしていたが、その言葉を聞いて手を止めた。\n\n「霍学姐って、なんか普通じゃない気がする」\n\n「その発見の新規性はどこにある？」\n\n李向陽も冗談を言うことがあるらしい。\n\n「新規性足りない？」\n\n「彼女はもともと有名だ」\n\n朱銘は一気に食いついた。\n\n「詳しく」\n\n「成績が良い。競賽、学生工作、サークル活動、どれにもかなり積極的」李向陽は言った。「ただ、有名なのはそれだけが理由じゃない」\n\n「ほかには？」\n\n「言いづらい」李向陽は少し止まった。「彼女をとても優しいと思う人もいれば、実は近づきにくいと思う人もいる」\n\n朱銘は考えた。\n\n「その二つ、矛盾しないの？」\n\n「必ずしも」李向陽は言った。\n\n彼はそれ以上説明しなかった。\n\nけれど朱銘は逃がさなかった。\n\n「いや待てよ」彼は言った。「なんでそんなに知ってるんだ？」\n\n李向陽は机の上の資料を揃え、引き出しに入れた。\n\n「三分経った」\n\n「そこで時間切り上げるの？」\n\n「切り上げる」李向陽は言った。「消灯。寝る」\n\n朱銘は口を開けたが、結局そのまま言葉を飲み込んだ。\n\n部屋の灯りが消え、闇が降りると、僕は狭いベッドの上に横になった。頭の中で何度も浮かぶのは、霍鈺が演台の前で言った「恥ずかしいと思う必要はない」という言葉だった。\n\n暗闇の中、スマホの画面がまた一度光った。\n\nクラスグループで誰かが「收到」と送ったのだ。すぐに、その下へ同じ「收到」がずらりと続いた。\n\n僕は返信しなかった。\n\n軍訓服は、ベッドの下の見えない椅子の背に掛けられている。僕にはそれが暗闇の中で空っぽに垂れ下がり、世界全体と一緒に静まり返っているところを想像することしかできなかった。\n\n明日の朝六時二十分、全員が同じ服を着て、同じ広場に立つ。よく考えると、そういうことは少し不思議だ。あまりにも奇妙で、それでいて当然のように存在するその「同一」の前では、「合うか合わないか」なんて小さな差異は、たいして重要ではないものに見えてくる。\n\n僕は目を閉じた。\n\n襟が擦れた場所は、まだかすかに痛んでいた。\n\nその痛みが消えるより先に、「軍訓」と呼ばれる生活が始まろうとしていた。"},{"title":"第五章：晴天万里","file":"5、第五章.md","text":"僕はアラームに起こされた。\n\n着信音はごく普通だった。\n\n普通すぎて、鳴り始めた瞬間、怒りをぶつける相手を一人も見つけられなかった。枕元のスマホがただぶうぶう震え、画面が明るくなり、五時五十分が来たことを知らせているだけだった。\n\n起きたくない。\n\nその考えは、誰かが天井に書きつけたみたいにはっきりしていた。\n\n寮の中はまだ暗かった。夜のあいだに積もった空調の冷気が、薄く肌の上に乗っている。目を閉じたら眠気に包まれてまた落ちてしまいそうで怖かった。かといって、目覚めている感覚にもまだ馴染めない。だから僕は目を開けたまま、しばらくぼんやり天井を見ていた。五分後、アラームが二度目に鳴るまで。\n\n意識よりも先に、身体が今日起こることを思い出した。\n\n昨夜、襟で擦れた首筋の後ろはまだ痛い。細かい紙やすりで軽く擦られた皮膚が、一片だけ残っているような感じだった。脚はまだ痛くない。昨日は本当の軍訓が始まっていなかったからだ。ただ、あの軍訓靴はすでに予告編を見せてくれていた。履き口は硬い。底は薄い。履くと足の甲も足裏も、どちらもあまり快適ではない。\n\n僕は起き上がり、暗がりの中で眼鏡を掛けた。\n\nつるが少し冷たく、耳の横に触れた時、ようやく本当に目が覚めたのだとわかった。\n\nドアの外の廊下から、ごく軽い足音がした。誰かがスリッパで通り過ぎたらしい。その音は一度止まり、また前へ進み、最後には隣の部屋のトイレから途切れ途切れに聞こえる水音に覆われた。\n\n軍訓服は椅子の背に掛けられていた。暗闇の中では輪郭しか見えない。迷彩の上着を頭からかぶると、首筋の後ろの皮膚にすぐ襟が触れ、僕は反射的に身を縮めた。\n\n朱銘の方から、ごく軽いため息が聞こえた。\n\n「俺、信じることにした」彼は寝ぼけた声で言った。「大学生活って、たしかに意志を鍛えるな」\n\n誰も返事をしなかった。\n\n返す気がないというより、たぶんこの時間帯では、ツッコミという概念さえまだ完全には起きていないのだ。\n\nトイレの灯りはすでについていて、水音が途切れ途切れにしていた。最初のアラームが鳴った時点で、李向陽はすでにベッドから下り、服を着替えて洗面を済ませていた。\n\n僕がトイレに入ると、洗面台の端にはまだ拭かれていない水の跡が残っていた。\n\n鏡の中の人間はすでに軍訓服を着ていた。ただ、帽子はまだかぶっていないし、ベルトもきちんと締めていない。全体として、早朝に慌てて見慣れない外殻の中へ詰め込まれたように見えた。\n\n歯ブラシを口に入れながら、僕はふとこの光景が少しおかしくなった。\n\nけれど歯磨き粉のミント味が、すぐその笑いを押し潰した。\n\n六時十分ごろ、僕たちはA109を出た。\n\n廊下にはすでに多くの新入生が出てきていた。\n\nみんな同じ迷彩服を着ているのに、服の大きさがそれぞれ違うせいで、それぞれ別の狼狽え方をしていた。袖口が手の甲まで覆っている人。ズボンの裾が靴の上にたまっている人。髪に押されて帽子が片側へ傾いている人。\n\n寮の外の空は、よく晴れていた。\n\n少し、腹が立つほどに。\n\n朝の陽射しはまだ強烈ではなく、路面に澄んだ光を敷いていた。遠くの雲麓山の輪郭は、水で洗われたばかりみたいにきれいだった。空には雨の気配も、雲一つもない。\n\nもし今日が軍訓でなければ、開学写真を撮り、キャンパスを散歩し、朋友圈に「大学初日Vlog」と投稿するのに向いた天気だっただろう。\n\n残念ながら、僕たちは軍訓服を着ていた。\n\n立華書院から木蘭広場へ向かう道では、上級生たちが次々に通り過ぎていった。短パンとサンダルで朝食を提げている人。パソコンバッグを背負い、イヤホンのコードを肩から垂らしている人。薄い色のスカートを履いた女子が僕たちの横を通り過ぎると、洗剤と日焼け止めが混じったような匂いが少し残った。\n\n彼らはみんな軽く見えた。\n\n僕たちと同じ大学にいるとは思えないくらい、軽かった。\n\n二人の先輩女子が道端を通る時、声の大きさが小さすぎず大きすぎないくらいで、何かを言った。前半は聞き取れなかったが、後半の「また軍訓の季節だね」だけが耳に入った。隣の女子が軽く笑い、その笑い声はすぐ彼女たちの足音に連れられて遠ざかった。\n\n誰だって軍訓を経験する。上級生にとって、新入生が迷彩服を着てキャンパスを移動する光景は、九月にいちばんよくある景色の一つにすぎない。\n\nそれでも僕は、少し落ち着かなかった。まるでこの服に何かの印があり、自由に歩く人々の中から僕たちだけを取り出して、見えないラベルを貼ったみたいだった。\n\n「恥ずかしがる必要はない」\n\n横から李向陽の声がした。\n\n「軍訓服は作りこそ普通だけど、半分は軍服みたいなものだ」と彼は言った。「これを着るということは、これから正式な訓練を受けるということだ。別に変な活動に参加するわけじゃない」\n\n少し止まって、彼は付け加えた。\n\n「そういう意味では、これは名誉でもある」\n\n僕は一瞬、どう受け止めればいいのかわからなかった。\n\n朱銘が隣で小声で言った。\n\n「李哥、その話を軍訓服のメーカーが聞いたら、感動して割引してくれると思う」\n\n李向陽は彼を見た。\n\n「象徴的意義の話をしている」\n\n「わかってる」朱銘は言った。「でも今、俺のかかとはかなり唯物論的なんだ」\n\n木蘭広場には、すでに多くの人が立っていた。\n\n広場一面に迷彩が広がり、まるで粗い顔料を撒いたようだった。各班の班導たちは端で人数を確認し、輔導員は前方で何人かの教官と話している。昨夜見た毛鋭は国旗掲揚台のそばに立ち、背筋をまっすぐ伸ばしていた。地面に突き刺さった標尺みたいだった。\n\n霍鈺の姿は見えなかった。\n\n尹淵も見えなかった。\n\nそれが妙に不安だった。\n\nもちろん、彼らがいたところで軍訓から守ってくれるわけではない。けれど人間とは時々そういうものだ。ある安心感に実用性がないとわかっていても、それがなくなった瞬間、身の回りから何か一片が欠けたように感じる。\n\n六時二十分、集合が始まった。\n\n「立華書院全新入生、専攻とクラスごとに集合！」\n\n毛鋭は拡声器を持ち、声を広場全体に転がした。\n\n人の群れが動き始めた。\n\n偶然にも、物理班と哲学班はどちらもC軍陣に分けられた。\n\n「哲学班」という三文字を聞いた瞬間、僕は反射的に横を見た。そしてすぐ近くに谷懿を見つけた。彼はかなり目立つからだ。\n\n谷懿も軍訓服を着ていた。帽子はきちんと頭にかぶり、ベルトも締めている。個々の部分だけを見れば、特に問題はない。\n\nただ、一語で彼の状態を表すなら、それはきっと「ゆるい」だった。\n\n僕たちはこの服を着ると、多少なりとも姿勢や動きを規範に合わせようとする。だが谷懿は片手に水筒をぶら下げ、もう片方の手をだらりとベルトのあたりに置いていた。襟元の一番上のボタンは留められておらず、袖口も適当に少し捲られている。内側には、昨日と同じ白いTシャツがうっすら見えていた。\n\n彼も僕に気づいたらしく、人混み越しに顎を少し上げた。\n\n返事をする前に、隊列の前方から声が飛んだ。\n\n「ちゃんと立て！」\n\nその声は特別太くはなかったが、とても鋭かった。一文字ずつ、人の耳の奥へ釘を打ち込むような響きだった。\n\n僕は慌てて前を向いた。\n\nC軍陣の前に、背の高い痩せた教官が立っていた。\n\n見たところ、僕たちよりそれほど年上ではない。むしろ顔にはまだ少し青さが残っている。だがベルトはきつく締め、帽子のつばは低く、服は僕たちの軍訓服よりずっと張りがあった。\n\n彼は顎を少し上げ、すぐには自己紹介せず、隊列の周りを一周した。\n\n「帽子を正せ」\n\n「ベルトを締めろ」\n\n「水筒を手に持つな」\n\n「ズボンの裾を下ろせ。何だその格好は？」\n\n彼は一言ごとに少し止まり、指摘された人が慌てて直すのを待った。その間は短い。けれど周囲を緊張させるには十分だった。\n\n僕たちの列の前に来ると、彼はふいに止まった。\n\n「お前たちは軍訓に来たんだ。旅行に来たんじゃない」\n\nそう言いながら、彼の視線は一人ひとりの顔をなぞっていった。\n\n「ここでは、以前どこの重点高校だったか、どんな賞を取ったか、高考で何点取ったか、何の役にも立たない。軍訓にあるのは一つ。命令に服従することだ」\n\n昨夜の毛鋭が言った言葉によく似ていた。\n\n「わかったか？」\n\n「わかりました」\n\n「聞こえない！」\n\n「わかりました！」\n\n彼はようやく少し頷いた。\n\n「張迪だ。この二週間、C軍陣は私が担当する」\n\n拍手は起きなかった。\n\nたぶん、今回は明確な指示がなかったからだ。\n\n毛鋭は前方で各軍陣の配置を続けて発表していた。張教官は僕たちの前に立ち、両手を背中に回し、時々隊列の中へ視線を走らせる。彼の視線が誰かの上で止まるたび、その人は反射的に背筋を伸ばした。\n\nまもなく、四つの軍陣の分配が終わった。\n\n「C軍陣！」\n\n張教官が振り返った。\n\n「目標、二里半キャンパス田径場。駆け足前進！」\n\n隊列が動き出した。\n\nだがこれは、一般的な意味でのキャンパスランではまったくなかった。雲夢師大には、そもそも本当の意味での壁がないからだ。\n\n木蘭広場から二里半キャンパスの田径場までのあいだには、完全に閉じたキャンパス道路など存在しない。僕たちは校内道路、交差点、信号を通り、自転車に乗る学生、清掃員のおばさんが押すカート、朝食を運ぶ電動バイク、そして散発的な通行人と同じ朝を共有しなければならなかった。\n\n普段なら、それは自由に見えるのかもしれない。\n\nだが張教官が「隊形を維持しろ」と要求した瞬間、それはすぐ苦行になった。\n\n前列が青信号を渡った時、後列は赤信号で切られる。\n\n張教官は前方で振り返って「ついてこい」と叫ぶ。後ろの人間は慌てて小走りするしかない。道端では電動バイクが隊列の横を迂回し、隊列は内側へ縮まざるを得ず、もともと整っていた間隔はたちまち歪んだ。\n\n誰かの靴紐がほどけた。\n\nその人が低頭して一度見たのを僕は見た。だが彼は止まらなかった。ただ走りながら足先を靴の中へ押し込み、足の指でほどけた靴を固定しようとしているようだった。\n\n僕の靴も不快だった。\n\n靴底が薄すぎる。アスファルトを踏むたび、足裏にはすぐ熱がこもった。焼けるような熱ではなく、硬い振動が足底からずっと伝わってくる、苛立たしい熱だった。\n\n隊列が小さな交差点を通る時、数人の上級生が道端に立ち止まり、僕たちを先に通してくれた。\n\n誰かが小声で言った。\n\n「初日から走るんだ」\n\n別の人が続けた。\n\n「普通だよ。最初に威を殺すんだ」\n\nようやく田径場に着いた時、隊列はほとんどばらばらになっていた。\n\n張教官はトラックの端に立ち、右手を握って上げた。\n\n「C軍陣！　私の前に集合！」\n\n全員が自分の位置を探し始めた。\n\nだが、さっきまでずっと走ってきて、誰が自分の前後左右だったかなど、誰が覚えていられるだろう。\n\n僕が覚えていたのは、左がたぶん李向陽、後ろがたぶん朱銘、という程度だった。右側はもともと哲学班の隊列だったが、走っている途中で混ざってしまった。今、僕の右に立っているのは、背の低い女子だった。\n\n彼女の顔は小さかった。軍帽が深く下り、つばがほとんど眉に触れている。そのせいで、かえって目が静かに見えた。細い前髪が汗で額に貼りついている。顔色はあまり良くなかったが、それでも低頭してつま先の位置を真面目に整え、左足をさらに半寸ほど後ろへ引いた。\n\n「第四列第四排、出列！」\n\n隊列が一瞬静かになった。\n\n僕は素早く数えた。\n\n僕は第五列。\n\n指名されたのは、僕の前にいる背の低くて少し太った男子だった。\n\n彼はまずその場で数秒固まり、それからおずおずと前へ出た。\n\n張教官は彼を睨んだ。\n\n「そこはお前の位置か？」\n\n男子は低頭し、黙っていた。\n\n「返事！」\n\n「報告教官、僕……背が低くて、後ろだと見えなくて」\n\n「私はなぜ位置を変えたのかと訊いたか？」\n\n張教官は一歩前へ出た。\n\n男子は明らかに震えた。\n\n「私が訊いているのは、位置を変える前に報告したのか、ということだ」\n\n男子は口を開いた。\n\n「してません……」\n\n「大きく！」\n\n「報告教官！　してません！」\n\n「報告もなしに、誰が勝手に変えていいと言った？」\n\n男子はまた低頭した。\n\n「見えなくて……」\n\n「見えなければ勝手に位置を変えていいのか？　不便だと思えば報告しなくていいのか？　それなら訓練中に疲れたと思ったら勝手に座るのか？　暑いと思ったら勝手に寮へ帰るのか？」\n\n張教官の声はどんどん高くなった。\n\n田径場は広く、声はトラックと観客席に跳ね返り、実際よりも耳障りに聞こえた。\n\n「大学生にもなって、その程度の規律性か？」\n\n男子は彼の前に立ち、顔を真っ赤にしていた。\n\n「これ、いじめだろ」\n\n後ろで朱銘がとても小さく罵った。\n\n「帰隊！」\n\n張教官はようやく彼を解放した。\n\n男子が隊列へ戻る時、頭はほとんど胸につきそうなほど下がっていた。\n\nだが、そこで終わりではなかった。\n\n張教官は全員を見た。\n\n「さっき走ってきた時、全体がめちゃくちゃだった。田径場に着いても自分の位置すらわからない。初日の午前でこれなら、この先訓練する必要があるのか？」\n\n誰も答えなかった。\n\n「全員、五周」\n\n彼はトラックを指した。\n\n「グラウンドを五周。十分以内に元の位置へ戻れ。終わらなかった者は、自分で前へ出ろ！」\n\nその言葉が落ちた瞬間、隊列はまず静まり、それから小さな息を吸う音がいくつか聞こえた。\n\n五周。\n\n二千メートル。\n\n十分。\n\n高校時代で、普通の運動靴と半袖短パンを着ていて、日頃から運動している人なら、それほど難しいことではないのかもしれない。\n\nけれど今の僕たちは軍訓服を着て、木蘭広場から田径場まで走ってきたばかりで、体力はまったく戻っていない。そのうえ隊列には、さっきの太った男子のように、ひと目で運動が得意ではないとわかる人もいる。\n\n教官がそれを知らないはずがない。\n\nだが彼は、説明も猶予も与えなかった。\n\n「走れ！」\n\n隊列が動いた。\n\n一周目、みんなはまだ命令に押される緊張を抱えていた。トラック外側の芝生は濃い緑で、朝の陽射しを受けて、いっそ綺麗にさえ見えた。近くで誰かが呼吸を整える音が聞こえ、誰かの靴底がトラックを踏んで鈍い音を立てる。\n\n二周目には、隊列はもう散っていた。\n\n誰かが人を追い越し、誰かが遅れ始める。呼吸音は粗くなり、不安定なふいごがいくつも並んでいるみたいだった。帽子のつばは額を押さえ、汗は髪の根元から滲み、軍訓服は背中に貼りつく。腕を振るたび、布が皮膚を擦った。\n\n三周目、喉が乾き始めた。\n\n右側にいた女子は、もう隣にはいなかった。\n\nカーブで彼女が少し後ろに落ちているのが見えた。手で肋骨のあたりを押さえ、歩幅は小さい。それでも止まってはいない。速くはない。むしろかなり苦しそうだった。けれど一歩を上げるたび、とても真面目だった。ただ、どれほど姿勢が真面目でも、今の速度が歩くより少し速い程度であることは変えられない。\n\n四周目、汗がレンズの縁へ流れてきた。\n\n世界が少しぼやけた。\n\nトラック脇の張教官はゴール付近に立ち、両手を背中に回したまま、走ってくる一人ひとりの顔を見ていた。\n\n彼は時計を見ていなかった。\n\n少なくとも、僕が彼の横を通り過ぎた時には。\n\n五周目には、十分という時間が合理的かどうかなど、もう考えていなかった。\n\n張教官がわざと難癖をつけているのか、それともほかに何か目的があるのかも考えていなかった。\n\nただ早く走り終えたい。早く止まりたい。早く、普通に息をする権利を取り戻したい。\n\nどれほどの時間が過ぎたのかわからない。ようやく、僕はどうにか五周を走り終えた。\n\n隊列の近くへ戻った時、僕は腰を曲げ、両手を膝につき、喉の奥に錆びた鉄のような味を感じていた。\n\n朱銘はすでに元の位置に立っていた。どうやらかなり前に走り終えていたらしい。李向陽も隊列に戻り、自分の水筒の蓋を開けていた。\n\n僕には彼らと話す力もなく、ただ顔を上げて周囲を見た。\n\n隊列には空きがあちこちにあった。\n\n戻ってきているのは、おそらく半分ほどだった。立ったまま息を切らす人。トラック脇にしゃがみ込む人。腰を曲げたまま、しばらく直れない人。\n\n反射的に時間を見ようとした。\n\n手がポケットに触れた瞬間、横から朱銘の声がした。\n\n「見なくていい。とっくに十分は過ぎてる」\n\n僕は一瞬固まり、彼を見た。\n\n朱銘は水筒の蓋を開けて一口飲み、口元を拭った。\n\n「十分で二千メートル。体力のあるやつなら走れる。じゃあほかの人は？　小柄な女子とかは？」\n\nそう言って、彼はトラック脇の張教官を見た。\n\n「あいつは最初から、本気で十分を計るつもりなんてなかったんだと思う。あまりにもひどい走り方じゃなければ、たぶん時間を見ることすら面倒だったんだ」\n\nかなり筋が通っているように聞こえた。\n\nもちろん、今の僕の脳が酸欠に近い状態である以上、誰かが十分自信ありげに「マルクスは実はとっくに中国人だった」と言っても、僕は二秒くらい真面目に考えてしまうかもしれない。\n\n僕は朱銘の視線を追った。\n\n張教官はゴール付近に立っていた。両手を背中に回し、確かに時計は見ていない。戻ってくる人々を一人ずつ見て、時々眉をひそめるだけだった。隊列がゆっくり埋まっていくのを待っているようだった。\n\n走り始める前、水筒は田径場の芝生の上に適当に置かれていた。杯の壁はもう日差しで熱くなり、水も冷たくなかった。僕はそれを持ち上げて一口飲んだ。ぬるい水が喉を下り、乾きだけを一時的に押さえ込んだ。\n\n戻ってくる人はどんどん増えた。\n\nほとんど足を引きずるように隊列へ戻る人もいた。腰を曲げ、太腿に手をついたまま、しばらく身を起こせない人もいた。\n\nさっき僕の右側に立っていた女子も戻ってきた。\n\n彼女は隊列の端で止まり、濡れた前髪が額に張りついていた。頬は少し赤く焼けているのに、唇にはあまり血色がなかった。\n\nもう、だいたい揃った……のだろうか。\n\nそう思った時、トラックの遠くから一つの人影がこちらへ「走って」くるのが見えた。\n\n走る、というより、その姿はゲーム『Left 4 Dead』に出てくるゾンビに近かった。\n\n谷懿。\n\n彼はまだ走っていた。\n\n見たところ、とにかく必死だった。しかも風にむせたのか、走りながら咳をしている。肺まで咳き出しそうな勢いだった。\n\nようやく、谷懿は五周を走り終え、忠実なるC軍陣へ戻ってきた。\n\nその時、疲れすぎて腰を上げられない数人を除いて、ほとんど全員の視線が彼に集まった。教官も含めて。\n\nだが、さっきまで鬼のように険しかった教官の顔に、今はなんと心配そうな表情が浮かんでいた。\n\n「お前たち二人、早く彼を支えろ」\n\n今にも倒れそうな谷懿を見て、彼は前列の二人に向かって急いで言った。\n\n「ほ、報告教官！　自分は規定時間内に任務を完了できませんでした！　処罰をお願いします！」\n\nしかしその二人が谷懿のそばへ行く前に、今にも朽ち果てそうだった谷懿は、最後の力を振り絞るように、喉を張り裂けそうにして教官へ叫んだ。\n\nその声は、ほとんど声の隙間から無理やり絞り出されたようなものだった。僕たちは全員ぎょっとしたし、その内容にはさらに驚いた。\n\nそもそも、この「十分で走り終える」というのは建前ではなかったのか？\n\n時間内に終わらなかった学生はあれほどいたのに、教官は何も言っていないではないか。\n\n谷懿がどうしてこんな瀕死みたいな状態になったのかはわからない。だがそんな状態なのに、自分から処罰を求めるのか？\n\n僕が呆然としていると、背後の朱銘が突然大声で笑った。\n\nその遠慮のない笑い声に、僕は本気で驚いた。慌てて教官を見たが、幸い教官の注意はすべて谷懿に向いていたので、少し安心した。\n\n「銘哥、何笑ってるの？」\n\nけれど朱銘は答えなかった。\n\nただ、すぐに僕にも彼が答えなかった理由がわかった。軍陣全体の空気が、非常に奇妙なものへ変わっていたからだ。\n\n多くの学生が緊張した顔で、軍陣の前方にいる教官と谷懿を一心に見つめていた。特に谷懿の少し前にどうにか五周を走り終えた数人の女子はそうだった。\n\n教官の顔色は、今やかなり悪かった。目線も落ち着かない。数メートル離れていても、彼が何度か口を開いたのに、声が一つも出なかったように見えた。まるで誰かにその場へ固定されたみたいに立っている。\n\n「こほん。君たちは規定時間内に任務を完了できなかったが、全力を尽くしたことに免じて、今回は特例として処罰しない」\n\nさっきまで冷静で、すべてを支配しているように見えた教官が、今はどこか後ろめたそうに見えた。さっきの一幕を予想していなかったらしい。\n\n「だが今回だけだ。次はない！」\n\n最後の一文は少し音量が上がったが、どういうわけか虚勢のように聞こえた。\n\nなるほど。\n\nもし教官が谷懿を処罰するなら、彼が定めた時間内に走り終えられなかった全員を公平に処罰しなければならない。\n\nそしてそれは明らかに不可能だった。教官が処罰を用いる目的は威を立てることだ。だが何事も度を越せば、逆効果になる。\n\nつまり、教官は最初からこの時間制限を本気で扱っていなかった。谷懿という変数がなければ、おそらく朱銘の言った通り、彼は自分からその話を持ち出すことなどなかっただろう。むしろ今後、その件は僕たちに圧力をかけるための材料にさえなったはずだ。\n\nだが谷懿は……どうやらその心理を読んだ上で、自ら罠になりにいったらしい。\n\nしかし、自分が任務を完了できなかったことを言い逃れるためではないなら、彼はなぜそんなことをしたのだろう。\n\n何にせよ、教官がそう言い終えると、多くの学生はようやく胸のつかえを下ろした。\n\nけれど、ほとんどの人がこれで終わったと思ったその時、さらに大げさな場面が起きた。\n\nさっきの谷懿の行動が「理解はできないが、とにかく震撼した」ものだったとすれば、この瞬間の谷懿の行動は、その場にいた全員に、あの痩せた巻き毛の男子を永遠に記憶させるものだった。\n\n教官の言葉が終わった途端、さっきまで弱々しい身体を引きずり、地面を這う寸前だった谷懿が、まるで別人のようになった。脚は震えず、息も切れていない。目の中から衰弱は消え、むしろすぐにきらきらと光り始めた。\n\nどう見ても、命がけで二千メートルを走り終えた人間には見えなかった。今の彼を、足裏マッサージ店でフルコースを堪能して出てきたばかりだと言われても、僕は信じたかもしれない。\n\n場の空気は凍りついたようだった。全員が怪物を見るような目で彼を見ている。\n\nだが谷懿はその視線をまったく気にせず、ぴょんぴょん跳ねるように隊列へ戻っていった。\n\nその時ようやく、僕たちは理解した。谷懿は体力が尽きていたわけではない。この場でさらに五周走れと言われても、たぶん走れてしまう。\n\n彼は十分以内に走り切る能力があった。それなのに、わざと急がず、散歩でもするように教官の処罰に付き合っていたのだ。最後の一周、いや最後の百メートル、あるいは僕たち全員の視界に入ったあとになってから、初めて全力を尽くし、体力の限界に見える姿を演じた。\n\nそしてさっき、教官や、彼と同じように時間内に終わらなかった学生たちが見せた反応も、おそらくすべて彼の計算のうちだった。\n\nそう思うと、僕は思わず息を呑んだ。\n\n谷懿の頭の良さに驚いたというだけではない。彼の選択に震えた。彼は自分のために逃げ道を作ったのではなく、自分の身体を使って教官の逆鱗に触れにいったのだ。\n\n案の定、その姿を見た張教官の、少し戻りかけていた顔色は、一瞬で豚の肝みたいな色になった。\n\n威風堂々としていた教官が谷懿にここまでからかわれるのを見て、きっと多くの学生が僕と同じように、心の中でひそかに爽快感を覚えていたはずだ。\n\n実際、まさにその通りだった。最初に教官に引きずり出されて標的にされた男子は、隊列の中で歯を見せ、身体をくねらせるほど笑っていた。\n\n最初から教官にやり玉に挙げられ、最も怒りを飲まされた彼が、あの時どれだけ悔しかったか。それと同じ分だけ、今は痛快だったのだろう。\n\n周囲の何人かも彼につられて、次々に嬉しさを顔に出し始めた。\n\nけれど隣の李向陽は、顔を引き締め、微動だにせず軍姿で立っていた。\n\nその違いに僕も気づかされ、慌ててさっきまでの緩みを引っ込めた。\n\n隙を見て教官の方を一瞥すると、僕の記憶の中で狼狽していたはずの教官は、すでにいつもの厳しい表情を取り戻していた。前のめりに笑っている数人の学生をじっと見つめ、何も言わず隊列の中へ歩いてくる。\n\n得意忘形、とはこういうことだ。人は得意になりすぎると、自分の「形」を忘れやすい。\n\nさっきの数人を含め、多くの学生はおそらく、自分たちの身分を忘れていた。教官の手の中にいる「兵」であり、もっと正確に言えば、軍訓される対象なのだということを。\n\n「そんなに笑うのが好きか？」\n\nまだあの喜劇の余韻に浸っていた数人は、さっき隊列の外にいたはずの教官が、すでに目の前まで来ていることにまったく気づいていなかった。\n\nその至近距離の影を見て、数人は一瞬で黙った。\n\n「お前たち、さっき笑っていたな。前へ出ろ！」\n\n一万回嫌だと思っても、その軍服が表す絶対の権威の前では、彼らはおとなしく前へ出るしかなかった。そこには当然、最初のあの男子も含まれていた。これはもはや二度目の収監である。\n\n「そんなに笑いたいなら、いっそ笑い尽くせ！」\n\n教官は暗い顔で命じた。\n\n数人は前に立ち、顔を見合わせた。この状況で本当に笑えるのは、たぶん馬鹿だけだ。\n\n「こんな簡単な言葉もわからないのか？」\n\n教官はそう言いながら、一人の前へ歩いた。\n\n「お前！　笑え！」\n\nその学生は仕方なく、数回乾いた笑いを絞り出した。口角は無理に引き上げられ、硬い弧を作っている。\n\nほかの数人もそれを見て、慌てて「笑い」始めた。その様子は、泣くよりもずっと見苦しかった。\n\nそして、その異様な光景の中で、教官の声が続いた。\n\n「覚えておけ。隊列の中に、お前たちが笑いたい時に笑い、動きたい時に動く自由はない！」\n\n「これからの二週間、お前たちは軍人になる方法を学ぶ！　斉歩、正歩、そんなものは最も基礎的なものだ！」\n\n「そして今日は初日だ！　まずは最も基本の軍姿から始める！　軍姿一つ立てないなら、ここに立つ資格などない！」\n\n「わかったか！」\n\n出た。これも定番コーナーだ。昨夜と同じである。『スポンジ・ボブ』の片目の海賊の真似でもするのが、雲夢師大教官隊の伝統芸能なのだろうか。\n\nただ、さっきの数人の犠牲を見たあとでは、しばらく張教官に逆らって何か言う人は現れなかった。谷懿でさえ、今はおとなしく立っている。\n\n――まあ、少なくとも表面上はそう見えた。\n\n短い「小事件」のあと、軍訓初日は正式に始まった。最も基本的な立ち姿勢から。\n\n最も基本。\n\nその三文字は簡単に聞こえる。だが実際に立ってみると、まったくそうではなかった。\n\n踵を合わせる。つま先を開く。膝を伸ばす。指を揃えてズボンの縫い目に貼りつける。肩を開く。顎を少し引く。目は前を見る。要求を一つずつ取り出せば難しくない。だがそれらが同時に、汗をかき、息を切らし、喉が乾いた人間の身体に乗ってくると、別のものになる。\n\n太陽はさらに高くなった。\n\n帽子のつばは光の一部を遮ったが、熱気も額にしっかり閉じ込めた。汗はこめかみから流れ、顎へ滑り、最後に襟の中へ滴った。襟で擦れた場所は汗を吸って、痛みがよりはっきりした。\n\n眼鏡は汗で少し滑り、フレームがじわじわ下がっていく。手を上げて直したかったが、動けない。仕方なく鼻梁で支え続けた。最後には、鼻梁まで痛くなり始めた。\n\n足元のゴムトラックは絶えず熱を放っていた。地面の灼熱は、評判の悪い軍訓靴を通じて僕の足をじりじりと炙ってくる。\n\n肉体的な苦しみよりさらにきついのは、精神的な退屈だった。\n\n遠くの地平線はぼやけ、まるで烈日に溶かされているようだった。前の人の後頭部以外、ほとんど何も見えない。唯一の娯楽は、他人の首筋を汗の粒が一つずつ滑り落ちていくのを眺めることくらいだった。\n\nこの終わりのない暑さと乾きは、人の生命力が少しずつ抜けていくような気にさせた。\n\nちなみに、手を抜くことも、気を緩めることも、この状況では賢明な選択ではない。張教官はもう隊列の前方に立っているのではなく、隊列の中を絶えず歩き回っていたからだ。\n\n時には左から通り過ぎ、時には右から通り過ぎ、時には突然誰かの背後で止まる。彼がどこにいるかは見えない。だが、いつでも現れる可能性があることだけはわかる。\n\n「手を貼りつけろ！」\n\n「脚を伸ばせ！」\n\n「何を低頭している！」\n\n「肩がそんなに落ちているのは、朝飯を食っていないのか？」\n\n一言一言が、突然落ちてくる鞭のようだった。\n\n少しでも緩めたいと思ったり、両足が近すぎたり、膝が伸びきっていなかったり、手のひらがズボンにまっすぐ貼れていなかったりすると、張教官は次の瞬間、背後から現れ、まさにその緩めようとした場所へ容赦なく一撃を入れてくる。\n\nやはり、既知の危険よりも、常に頭上に吊られたダモクレスの剣の方が人を怖がらせる。\n\n隊列の中では、すでに多くの人が彼の巡回を受けていた。その中でも谷懿が最も頻繁に目をつけられていた。\n\n気を逸らすためか、僕は時々そばの人を横目で見た。\n\nこの極端な天気と長時間の直立は、李向陽にはあまり影響していないようだった。彼は相変わらずぴんと立っていて、動作も非常に規範的だった。少なくとも僕には、欠点を見つけられない。\n\n右側の女子も真面目に立っていた。張教官が僕たちの前を通り過ぎる時、彼女は背筋をさらにまっすぐ伸ばした。\n\n最初の二十分が終わり、張教官はようやく休憩を告げた。\n\n全員がほとんど同時に緩んだ。\n\nすぐに地面へしゃがむ人。水筒のところへ駆ける人。帽子を外して風を送る人。さっきまで無理やり張りつめさせられていた静けさが一気に裂け、息遣いと小さな不満があちこちから湧き上がった。\n\n僕は水筒を取り、何口か飲んだ。\n\n水はもう日差しでぬるくなっていて、喉を下る時、プラスチックの杯壁にこもった熱まで一緒に飲み込んでいるようだった。\n\n水筒を置いた時、右側の女子が地面にしゃがんで靴紐を結んでいるのが見えた。\n\n彼女はかなり低くしゃがみ、帽子のつばが顔の半分近くを隠していた。靴紐はさっきのランニングでほどけたのだろう。少し灰がつき、靴の表面に貼りついている。彼女は二本の指で紐の端をつまみ、一周巻いたところで止まった。呼吸を整えてから、また巻き直そうとしているようだった。\n\n二秒ほど見てから、他人をそんなふうに見ているのはあまりよくないと気づき、僕は視線を逸らした。\n\nだがすぐに、隣で靴底がゴムトラックを軽くこする音がした。\n\n半ばしゃがんだ彼女の身体が少し揺れた。膝に手をつき、ようやくまた体勢を保つ。\n\n僕は少し迷った。\n\n「大丈夫？」\n\n彼女の動きが一瞬止まり、それからこちらを向いた。\n\n帽子のつばが上がった時、ようやく彼女の目が見えた。疲れているように見えた。それでも、彼女は僕をきちんと一度見た。\n\n「大丈夫です。ありがとう」\n\nそして低頭し、靴紐を最後まで締めた。結び目はあまり綺麗ではなかった。\n\n僕は何と続ければいいかわからず、「うん」とだけ言った。\n\n彼女は靴紐を結び終えると、膝に手をついて立ち上がった。\n\n僕たちの間はまた静かになり、短い休憩もすぐ終わった。\n\n張教官の笛が再び鳴る。\n\n午前中の残り時間は、同じ軍姿訓練に細切れにされた。\n\n三十分。\n\n休憩。\n\nまた三十分。\n\nまた休憩。\n\nやがて時間は時計の数字ではなく、太陽に晒されて柔らかくなった縄みたいに、身体にまとわりついて離れなくなった。\n\n昼に解散した時、全員が見えない型から流し出されたみたいだった。\n\n田径場を出て初めて、自分の脚がかすかに震えていることに気づいた。\n\n昼飯も、決して愉快なものではなかった。\n\n朱銘は本来、各窓口を一つずつ評価するつもりだったのだろう。結局、僕と一緒に適当に列の少ないところを選び、飯を受け取るとそのまま口へかき込んだ。\n\n午前中の訓練を経て、僕は一時的に谷懿のことさえ忘れていた。\n\n唯一、少し面白かったと言えるのは、軍姿の休憩中に偶然気づいたことだ。僕の足が立っていた場所には、濃い色の水跡が残っていた。この靴の品質ときたら……。\n\n寮へ戻ると、空調の冷気が押し寄せてきた。汗で湿った軍訓服が背中に貼りつき、冷たさに僕は小さく震えた。午前中はずっと涼しさを望んでいたのに、実際に冷えると、身体は逆に一部を抜き取られたように感じた。\n\n横になれたのは二十分にも満たなかった。\n\nアラームがまた鳴った。\n\n午後の田径場は、午前よりもさらに肉挽き機に近かった。\n\n午前には少なくとも朝の澄んだ空気が少し残っていた。午後になると、陽射しは完全に降りかかり、トラックも観客席も芝生も旗竿も、遠くの教学楼の壁面も、すべて白く照らされていた。空は迷いのない青だった。雲さえない。\n\n晴天万里。\n\n僕は、これほど晴れを嫌いになったことがなかった。\n\nすべてが明るい天光の下に隠れる場所を失い、苦しみでさえ当然のものになってしまう。\n\n張教官は午前よりも忍耐強くなったように見えた。\n\nだがその忍耐は、温和さを意味しなかった。彼は少しずつ僕たちを削り始めた。\n\n軍姿、斉歩の分解動作、その場足踏み、方向転換、集合、解散、また集合。どの動作も単純で、どの動作も訂正可能で、どの動作も彼が誰かを列から出す理由になった。\n\n「腕を振り切れ！」\n\n「足を高く上げろ！」\n\n「これは斉歩走か、それとも散歩か？」\n\n「この列、やり直し！」\n\n靴底がトラックを踏む。足裏はずっと硬い紙板を敷いているみたいに痛んだ。汗は帽子の内側から滴り、目尻へ流れ込むと少ししみた。誰かが頭がくらくらすると報告すると、張教官はまず数秒その人を見た。\n\n「続けられるか？」\n\nその人は口を開いた。\n\n「続けられます……」\n\n「なら戻れ」\n\n彼は戻った。\n\n僕の右側の女子は、午後になると明らかにきつそうだった。\n\n一度、その場足踏みが終わった時、彼女の身体が軽く揺れた。ほんの少しだったが、僕には見えた。彼女はすぐに立て直し、手をまたズボンの縫い目に貼りつけた。\n\n次の休憩で、朱銘はようやく谷懿のそばへ行く機会を見つけた。\n\n僕もそばにいた。\n\n正確には、朱銘に引っ張られて行った。彼いわく、「こんなに精彩な人類行動サンプルを、近距離で観察しないのはもったいない」らしい。\n\n谷懿はトラックの端に座っていた。帽子を膝に置き、髪は汗で少し濡れている。\n\n朱銘は単刀直入に言った。\n\n「午前のあれ、わざとだろ」\n\n谷懿は顔を上げた。\n\n「何がわざと？」\n\n「とぼけるな」朱銘が言った。「最後のあれだよ」\n\n谷懿は笑った。\n\n「僕は教官の命令を真面目に執行しただけだ」\n\n「執行しすぎて教官の処理系を落としかけたけどな」\n\n「それはシステム互換性の問題だ」谷懿は言った。「ユーザーのせいにされても困る」\n\n朱銘は笑った。\n\n僕は谷懿を見て訊いた。\n\n「本当に罰せられるとは思わなかったの？」\n\n谷懿は僕の方を向いた。\n\nそれはたぶん、僕たちが初めてまともに互いを観察した瞬間だった。\n\n以前、宅配ステーションで、僕たちは本と段ボールによって同じ狭い場所へ一時的に押し込まれたことがある。そして今、汗、太陽、トラック、張教官の笛の音が、僕たちを同じ大地の上に押しつけていた。\n\n彼の目は明るかった。\n\n温かな光ではない。燃え盛る火のようだった。\n\n「怖いよ」\n\n彼はごく自然に言った。\n\n「だからこそ、あいつが本気で罰せない時を選ぶんだ」\n\n僕は少し固まった。\n\n谷懿は帽子をもう一度頭にかぶった。\n\n「怖くない人間はつまらない」彼は言った。「怖くないなら、それはただの無謀だ。怖い。それでもどこなら少し動かせるか計算する。そこに多少の技術がある」\n\n笛が鳴った。\n\n休憩終了。\n\n谷懿は立ち上がり、ズボンの裾を払って自分の位置へ戻っていった。\n\n僕も立ち上がった。\n\nその時、太陽は高く、足元の影はとても短かった。短すぎて、人それぞれが本来どんな形をしているのか、ほとんどわからなかった。\n\n午後の残り時間は、午前よりさらに遅かった。\n\n遅すぎて、時間そのものが日に晒されて溶けているのではないかと疑い始めた。\n\n張教官は相変わらず隊列の中を行き来していた。谷懿はまた何度か重点的に見られたが、意外なことに、それでも彼は大きな欠点を見つけられなかった。\n\n隣の朱銘の顔色はだんだん悪くなっていったが、あまり何も言わなかった。李向陽の動作は相変わらず標準的だった。ただ、休憩中に水を飲む速度は午前よりかなり速くなっていた。\n\n熱中症や体力不足で、やむなく「出列」する学生は次々に出た。張教官の言葉による羞辱を代価にして、短い息継ぎを得るのだ。\n\nそして、午前からすでに「今にも崩れそう」だったあの女子は、奇跡的にここまで持ちこたえていた。\n\n僕の注意力は、その程度にまで狭まっていた。\n\n最後には、自分の足裏、首筋、眼鏡、喉、そしてあの少しも遮るもののない青空だけを覚えている。\n\n解散の号令がかかった時、太陽はもう西へ傾いていた。\n\n張教官が「解散」と言い終えても、人群はすぐには生き返らなかった。みんな動きが遅い。帽子を外すと髪が完全に濡れている人。腰をかがめてふくらはぎを揉む人。トラックの端に座り込み、しばらく立ち上がれない人。\n\n僕は帽子を手に取り、ようやく頭の上に少し風が通るのを感じた。\n\nその風はとても軽かった。\n\n遅れて届いた補償みたいに。\n\n田径場を出る頃、夕焼けはもう田径場の西側まで燃えていた。\n\n斜めに田径場の外柵を越え、遠くの教学楼を越え、やっと解放された新入生の群れを越え、キャンパス全体を燃えるような橙色に染めている。\n\n遠くの雲麓山は濃い輪郭だけになっていた。山の向こうには大きな夕霞が広がり、誰かが空の端で絵の具をこぼしたみたいだった。色があまりにも濃くて、この街があと数歩進めば、あの燃える空に丸ごと呑み込まれてしまうような錯覚さえあった。\n\n丸一日、烈日に晒されたおかげで、今の黄昏はほとんど優しく見えた。たとえ気温がまだ三十度を下回っていなくても、たとえ今日みたいな日があと十三日繰り返されるとしても。\n\n何にせよ、少なくともこの瞬間、僕たちは久しぶりの自由を感じていた。意図的に同じリズムで歩く必要もないし、その中に意味のない動作を挟む必要もない。両手をズボンに貼りつけ続ける必要もない。\n\n僕と朱銘が、もう少しずつ見慣れてきた十字路まで歩いた時、偶然にも谷懿を見つけた。\n\n「谷懿」\n\n名前を呼ばれた彼は振り返った。\n\n「すごかったな。教官に一日中見られてたのに、結局何も見つけられなかった」\n\n朱銘はかなり真面目に言った。\n\n谷懿は明らかにそれを気に入った。\n\n口元が少し上がったが、どうでもいいという顔を作った。\n\n「普通だよ」\n\n「普通？」朱銘は言った。「正直に言え。午前、お前一周少なく走っただろ」\n\n谷懿はようやく笑った。\n\n「二周だ」\n\n「二周少なく走ったの？」\n\n僕は驚きすぎて声が裏返りかけた。\n\n「ふふ、僕は二周しか走っていない」\n\nなるほど。これは完全に、彼の望み通りに決まってしまった。\n\n夕陽は僕たちの背後から追いつき、三人の影を歪めながら路面に伸ばした。\n\n「あいつが欲しかったのは、僕らが本当に十分以内に走り切ることじゃない」谷懿は言った。「僕らがその十分を恐れることだ」\n\n朱銘が頷いた。\n\n「つまり、規則そのものを利用したわけだ」\n\n「そう」谷懿は言った。「規則とはそういうものだ。規則の内容は重要じゃない。規則が規則になった瞬間、それはすでに目的を達成している」\n\n言っていることはかなり抽象的で、かなり回りくどかった。\n\n僕にはよくわからなかった。けれど身体の中で何かが軽く動いたような気がした。\n\n「もちろん」谷懿は続けた。「こういうことは毎日やるものじゃない。やりすぎたら、本気で潰しに来る」\n\n「溺れるのは泳げるやつって言うしな」朱銘がからかった。\n\n「確かに。歴史は、泳げることが危険であると証明している」\n\n今度は朱銘もそのネタを拾えず、僕も完全にわからなかった。\n\nその様子を見て、谷懿は一瞬だけ失望したように見えた。だが次の瞬間には、また別の話題を話し始めていた。\n\n夕陽が谷懿の顔に落ちた。\n\n彼は話が乗ってくると、目がはっきり明るくなる。色があり、温度があり、近づきたいと錯覚させる何かがある。\n\n僕は確かに、彼をすごいと思った。\n\nそれだけではなかった。\n\n一日中、日に焼かれ、叱られ、命令に消耗させられたあとで、谷懿の軽くて面白い言葉は、暗くなりかけた街に突然現れた一抹の夕霞みたいだった。\n\n夕霞が残らないことを知っていても、それでももう少し見ていたくなる。\n\n途中で、午前に笑わされて罰を受けたあの男子が、僕たちのそばを回り込んで通り過ぎるのが見えた。\n\n彼には同行者がいなかった。歩き方も、どこか少し不自然だった。\n\nけれどその時の僕の目は、より多く谷懿の上に留まっていた。夕陽に照らされた彼の横顔に。朱銘の興味津々な質問に。この一日がようやく終わったあとだからこそ、妙に美しく見える空に。\n\n谷懿はまだ喋り続けていた。\n\n朱銘はかなり真面目に聞き、時々本気で頷いた。\n\n「張って名字のやつを片づけるなんて分単位の問題だ」とか、「いつかあの張を俺たちの前に跪かせる」とか、完全に口だけの大言壮語まで、朱銘は楽しそうに相槌を打っていた。\n\nそのせいで谷懿はますます調子に乗り、ますます話の限界を失っていった。\n\n遠くの太陽は少しずつ沈んでいく。\n\n晴天万里の一日目が、ようやく終わろうとしていた。\n\nこうして僕たち三人の姿は、谷懿が吹いた大風呂敷もろとも、この夕陽の中へ沈んでいった。"},{"title":"第六章：烈日に心を灼かれて","file":"6、第六章.md","text":"二週間の軍訓は、口で言えば短い。けれど実際には長かった。まるで誰かにピンセットでつままれて、一分一秒ずつ外へ引きずり出されているみたいだった。\n\n特に、雲夢の九月の太陽の下では。\n\n李向陽によれば、今年の雲夢は例年のこの時期よりさらに数度暑いらしい。いかにもデータ精神に満ちた判断に聞こえるが、彼は気象局の報告書を出してきたわけではない。ただ、普段の彼が食堂へ行く時でさえ事前にルートを組んでいそうな人間であることを考えると、僕は一応、それを単なる愚痴ではないと信じることにした。\n\nもちろん、彼が間違っていたとしても、僕たちが田径場で、焼き上がりを待つ失敗したソーセージみたいに炙られている事実には何の影響もない。\n\n軍訓初日が終わったあと、僕は天真爛漫にも、人類の苦痛への適応力はかなり強いはずだと思っていた。たとえば二日目は一日目より少し楽になり、三日目には二日目より少し麻痺し、四日目にはもしかすると「どうせ抵抗できないなら楽しもう」という、何か玄学じみた境地へ入れるのではないか、と。\n\n結論から言えば、僕は人類という種を少し盲信していた。\n\n軍訓というものは、慣れてきたからといって優しくなったりはしない。\n\nただ別の方法で人を苦しめてくるだけだ。\n\n一日目に最も苦しかったのは軍姿だった。二日目に最も苦しかったのは斉歩だった。三日目に最も苦しかったのは正歩だった。四日目に最も苦しかったのは、前三日の内容が全部そのまま続くのだと知ったことだった。\n\nそして五日目になると、もう苦しいのは特定の訓練項目ではなくなっていた。\n\nそれらの苦痛が時間割のように正確に現れ、しかも時間割よりずっと信頼できるのだと、ついに理解してしまうことだった。\n\n初日の地獄みたいな軍姿訓練のあと、寮に戻っていくら石鹸で身体をこすっても、汗に浸された皮膚には発酵したような酸っぱい匂いがずっとまとわりついていた。\n\n少しでも暇になると、その匂いはほとんど瞬時に鼻腔を襲ってくる。\n\n抜け道はない。\n\n逃げ場もない。\n\nなぜなら、それは僕たち自身だからだ。\n\nその時初めて、僕は理解した。「軍訓」という記憶は、本当に匂いの形で人の心に根を下ろすのだと。\n\nただ幸いなことに、その後の数日間、僕たちは初日のように朝から晩まで軍姿を立ち続ける必要はなくなった。\n\nとはいえ、その最低限の慰めは教官たちの慈悲ではなく、彼らがほかの訓練項目のために時間を確保する必要があったからにすぎない。\n\nこの天気では、何もしなくても、ただ太陽の下に立っているだけで目が眩む。まして正歩、斉歩、跑歩、その場足踏み、集合と解散の反復などは、「人類はなぜ直立歩行をするのか」という問題に対して、僕たちに過剰に踏み込んだ実践研究をさせているようなものだった。\n\nそしてこの数日間で、僕は少しずつ気づいた。この身体の体質は、思っていたよりずっと良い。\n\n僕の知る限り、彼はバスケ部のエースでも、サッカー場の猛者でもない。むしろ中学高校の履歴を見るかぎり、人生の大部分は本、競賽、試験と一緒に過ごしていたはずだ。けれど実際に走り、立ち、耐えてみると、この身体はかなり丈夫だった。\n\nその発見は、僕に複雑な気分をもたらした。\n\n一方では、身体能力が良いのはもちろん良いことだ。だが他方では、僕はますます、自分が一時的に他人のアカウントを借りてログインし、誰かが苦労して育てたキャラクター性能を使っているだけのように感じた。\n\nもちろん、どうであれこの身体も朱銘や李向陽には及ばない。\n\n朱銘は軍訓に対して一貫して強い抵抗感を抱いていた。にもかかわらず、正式な訓練の中では一度たりとも手を抜かなかった。彼を知らなければ、訓練中の様子だけを見て、彼こそ軍訓を最も愛している人間の一人だと勘違いしたかもしれない。\n\nこれについて、彼自身の説明は「それとこれとは別」だった。\n\n「この制度に反対することと、張迪に前へ出されてみんなの前で罵られたくないことは、別問題だ」ある夜、シャワーを浴びたあと朱銘はそう総括した。「前者は思想の問題、後者は生存の問題」\n\n僕は、彼の言うことはかなり道理があると思った。\n\n道理がありすぎて、一瞬、彼が軍訓に反対しているのか、それとも軍訓における自分の優秀なパフォーマンスに理論的根拠を与えているのか、わからなくなったほどだ。\n\n同じく一糸乱れないのが李向陽だった。\n\n正歩の練習では、全員の脚が酸っぱく痺れて、張迪が見ていない隙に少し高さを下げ、わずかな息継ぎを得ようとする。だが李向陽はずっと高く上げていた。教官へ報告を叫ぶ時も、彼の声は最も標準的で、まるで「声は胸腔から出す」という講座を体系的に履修したかのようだった。\n\n僕は軍訓が嫌いだ。\n\nけれど、それは李向陽のような人を尊敬することの妨げにはならない。\n\nただ、その尊敬には多少の距離感が混じっていた。\n\n僕には、彼のようにはできないとわかっている。\n\n人に怒鳴られながら「東西南北どこから風が吹こうと、我は動かず」みたいな姿勢を保つことはできない。まして、ある事柄が荒唐無稽で、退屈で、場合によっては侮辱的な意味すら帯びているとわかっていながら、それを満点答案みたいに仕上げる必要など僕にはない。\n\n軍訓のように拒否できない不可抗力であっても、せめて心の中では象徴的な抵抗くらいしていたい。\n\n抵抗と言えば、すぐ谷懿が思い浮かぶ。\n\n初日の、張迪の表情管理をほとんど失敗させた跑圈事件のあと、谷懿はC軍陣で有名になった。\n\nもっとも、この「有名」は、総合評価資料に書き込むのに向いたものでは明らかにない。\n\nその後の数日間、張迪の谷懿への注目は目に見えて増えた。斉歩の時も見る。軍姿の時も見る。休憩前にも一度見る。その目は学生を見るというより、まだ開封されていない時限爆弾を見ているようだった。\n\nだが谷懿は、妙におとなしく振る舞っていた。\n\n少なくとも表面上は、とてもおとなしかった。\n\n帽子は正しくかぶる。ベルトも締める。隊列の中でむやみに動かない。張迪が見れば見るほど、彼は規則の許す範囲できっちり立った。きっちりしすぎて、少し皮肉に見えるほどだった。\n\n毎日訓練が終わると、彼は僕と朱銘を見つけ、一緒に食堂へ行った。\n\nたぶん彼が学ぶ哲学という専攻が、僕にとってあまりにも見知らぬもので、かつ神秘的すぎるせいだろう。僕はどうしても、彼の性格と哲学を結びつけてしまう。\n\n中学の政治教科書に載っていた有名な挿絵を思い出す。プラトンとアリストテレスが、一人は天を指し、一人は地を指している。おそらく哲学を学ぶ人間というのは、皆ああいうふうに奔放なのだろう。\n\nこんな偏った一般化について、僕は特に問題を感じなかった。\n\nだって、哲学班で僕が知っているのは谷懿一人だけなのだから。\n\n谷懿は僕たちと話す時、時々哲学について語った。\n\n彼がとても真剣に、とても情熱的に話すので、誓って言うが、最初のうちは僕も真面目に理解しようとした。\n\nだが「主体性」や「大他者」だけでもすでに僕には雲をつかむような話で、もっと恐ろしいのは、それらの言葉がしばしば無秩序に並び替えられることだった。ある事柄が、さっきまでは「身体の規訓」と呼ばれていたかと思うと、しばらくすると「象徴秩序の内面化」になり、さらに十分後には突然「現代大学はいかにして合格主体を生産するか」へ曲がっていく。\n\n長く聞いているうちに、僕は理解を諦めた。\n\nあるいは彼がそういう話を始めた時、脳内に「谷懿の大風呂敷」というフォルダを作り、まとめてそこへ入れることにした。\n\n違ったのは、朱銘が最初から谷懿のこういう話に強い興味を示していたことだ。\n\n同じ理科出身の朱銘がどれほど理解できているのか、僕にはわからない。けれど彼は毎回かなり真剣に聞き、時々頷きさえする。\n\nそのせいで僕は一時期、朱銘は哲学を理解しているのではなく、谷懿が非常に哲学っぽく話す能力を鑑賞しているだけなのではないかと疑っていた。\n\nとにかく、そんな数日のあいだに、僕たちの肌が少しずつ黒くなっていくのと同じように、人と人の距離も少しずつ縮まっていった。\n\n谷懿と朱銘は、大学という新しい環境で僕が最初に作った小さな輪だった。\n\nその輪が今後四年間の親友チームになるのか、それとも軍訓が終わったら自然に散っていく一時的な避難所にすぎないのか、今の僕には細かく考える余裕はなかった。\n\n時間はとても遅く進んだ。\n\nそれでも、ついに軍訓五日目が来た。\n\nその日の午後の天気は、相変わらず人を落ち込ませるものだった。\n\n雲ひとつない空から奇跡的に雨滴が落ちてくる日はいつなのか、という問題以前に、空気の中にわずかに残っていた水分でさえ、太陽に蒸発し尽くされたようだった。\n\n「水が一口飲めたらいいのに」\n\nトラックで正歩を蹴りながら、僕はそう思った。\n\nだが、もちろん不可能だった。\n\n訓練中、スマホと水筒は遠く離れた大樹の陰に置かれている。張迪が笛を吹いて休憩を告げた時だけ、僕たちは列ごとに順番に行き、水分を補給できた。\n\n烈日に晒されたまま立つ僕は、この瞬間ほど、砂漠で迷った旅人がオアシスや水源を求める気持ちを理解したことがなかった。\n\n水を飲むのが不可能なら、僕は曹操の兵士に倣って、梅を望んで渇きを止めるしかない。\n\nそうして僕は首をわずかに傾け、視線だけを遠くの大樹の下にある、心を潤すような陰と、そこにきちんと並べられた水筒たちへ向け続けた。\n\nそこには、今この瞬間僕が最も求めているものが入っている。\n\nその時だった。視界の中に突然、一つの人影が現れた。\n\n尹淵。\n\n彼は淡い紫色の半袖に、灰色のカジュアルショートパンツという格好で、悠々とその大樹の下へ歩いていった。手にはミルクティーを持っている。\n\n軍訓中、班導が新入生に付き添わなければならないという規定はない。それでもこの数日、多くの班導が田径場へ各班の訓練を見に来ていた。隣の生科班の班導など、疲れ切った学生たちへ、雪中送炭とばかりにレモン水を二箱も差し入れていた。\n\nだから尹淵が現れたこと自体は奇妙ではない。\n\n奇妙なのは、彼の出現によって、僕の「望梅止渇」が突然効かなくなったことだった。\n\nほとんどの人が気づいていない場所で、涼しい格好をした尹淵はその木陰に立ち、手のミルクティーを飲みながら、訓練中の僕たちを興味深そうに見ていた。\n\n正確に言えば、厚くてだぶついた軍訓服を着て、馬鹿みたいに炎天下で動かず立っている僕たちを見ていた。\n\n彼の顔には、かすかに「優雅」と呼ばれる笑みが浮かんでいた。\n\n軍訓場では、僕たちは訓練を受ける新入生であり、軍訓の規律に拘束される対象だった。\n\nそして三年生の尹淵は、当然のようにその規律の外側に立っている。\n\nすべての新入生が烈日に焼かれ、訓練し、水を飲むこともできない時、彼はあの手のひらほどの木陰に楽に立ち、手の中のミルクティーを楽しむことができた。\n\n尹淵の様子を見るかぎり、彼はただごく普通のことをしているだけだった。\n\n実際、その通りだ。\n\n尹淵は班導であり、三年生であり、軍訓の対象ではない。空調の効いた教室や寮からわざわざ田径場まで僕たちを見に来るだけで、すでに追加の労力と言える。\n\nミルクティーも、木陰も、それは彼の自由だ。\n\nまさか尹淵も太陽の下に出て、僕たちと一緒に軍訓し、苦楽を共にするべきだとでも言うのか？\n\n僕はそんな単純な理屈がわからないわけではない。\n\nだが目の前の光景があまりにも合理的だからこそ、理由のない負の感情はさらに強くなった。\n\n頭上の烈日は、もはや僕の肉体だけを焼いているのではない。尹淵の出現によって平静さを失い、少し歪んだ僕の内心まで炙っていた。\n\n僕は心の中で何度も繰り返した。尹淵は軍訓する必要がない。彼は誰の邪魔もしていない。それはただ彼の自由だ。\n\nけれど尹淵がしばらく見てから去るまで、僕の心は少しも静まらなかった。\n\n自分の考えがどれほど理不尽で、どれほど醜いかはよくわかっていた。\n\n僕はただ、他人が自分たちと一緒に苦しまないというだけで、恨みを抱いている。\n\nそんな考えを抱いたこと以上につらかったのは、僕が心の中からその考えを追い出せなかったことだった。\n\n尹淵の、気楽で、軽やかで、こちら側の外にいる姿が、何度も目の前に浮かんだ。\n\n午後の訓練が終わる頃、僕はほとんど水の中から引き上げられたみたいになっていた。\n\n軍訓服は身体に貼りつき、襟が擦れた場所は痛く、痒い。朱銘が帽子を外すと、髪は汗でぐちゃぐちゃに押し潰され、強制的に水泳テストを受けさせられた陸生動物みたいに見えた。\n\n「今日の晩飯は、尊厳のあるものを食う」朱銘は言った。\n\n「例えば？」\n\n「例えば、自分がまだ生きていると実感できるもの」\n\n要求が高そうに聞こえた。\n\nだが結局、僕たちは食堂の二階へ行き、ごく普通の丼飯を注文しただけだった。\n\n人類の尊厳は、時にそこまで高くない。\n\n僕と朱銘、谷懿がトレーを持って席を探していると、スマホが突然震えた。\n\n僕のスマホだけではなかった。\n\n周囲の多くの人が次々に動きを止め、画面を低頭して見た。そのあちこちで起こる停止は、これがあるクラスの小さな通知ではなく、もっと大きな範囲の何かだと一瞬で理解させた。\n\n僕はスマホを開いた。\n\n立華書院新入生通知グループで、輔導員が一つのメッセージを転送していた。\n\n【21級新入生各位、本日夜七時、クラスごとに至善楼の指定教室へ集合し、入学関連事項の説明およびキャンパス通信サービス登録を行います。具体的な教室配置は添付表をご確認ください。各班導は協力して組織し、必ず全員へ通知してください。】\n\n下には表が続いていた。\n\n物理班：115。\n\n哲学班：117。\n\n中文班：119。\n\n……。\n\n僕が何か言う前に、谷懿がスマホ画面をこちらへ向けた。\n\n「どうやらサプライズらしい」\n\n朱銘は眉をひそめた。\n\n「入学関連事項？　オンラインと登録日にもう全部やったんじゃないのか？」\n\n「大学の関連事項はゲームのデイリー任務みたいなものだ」谷懿は言った。「終わったと思っても、翌日にはまた更新される」\n\n通知にある「キャンパス通信サービス登録」という文字を見て、胸の中にごく軽い違和感が生まれた。\n\n別に、僕が何か問題を見抜いたわけではない。\n\nただ、「登録」という言葉と「必ず全員へ通知してください」が一緒に置かれていると、何とも言えない面倒くささがある。\n\n李向陽もメッセージを見た。\n\n彼は向かいに座り、すぐ添付ファイルを開いて確認した。\n\n「統一事項だろう」彼は言った。「七時なら、食べ終わって戻って着替える時間は少し厳しい。直接行く方が安定だ」\n\n「李哥、君の人生理解って、『安定』と『不安定』の二択しかないの？」朱銘が訊いた。\n\n李向陽は彼を見た。\n\n「あと、『かなり不安定』がある」\n\n朱銘は二秒沈黙した。\n\n「いい分類だ」\n\n今回は谷懿まで笑った。\n\n僕は笑わなかった。\n\n尹淵が木陰でミルクティーを飲んでいた光景が、また頭の中に浮かんだからだ。\n\n彼が今夜もいるのかどうか、僕にはわからなかった。\n\n夜七時前、至善楼の前にはすでに多くの新入生が集まっていた。\n\n軍訓五日目の夜、みんなの身体には、昼間の疲労がまだ完全には抜けていなかった。私服に着替えた人もいれば、僕たちのように面倒で、軍訓ズボンと半袖のまま来た人もいた。空気には汗の匂い、シャンプーの匂い、食堂の油煙、そして廊下の空調室外機が吹き出す熱風が混じっていた。\n\n至善楼一階の廊下は明るかった。\n\nいくつかの教室の前には臨時の机が置かれ、机の上にはチラシ、表、未開封のスマホSIMカードの束が並んでいる。通信会社のベストを着た人と、数人の先輩たちがその後ろに座り、前には微信と支付宝の決済コードが貼られていた。\n\nこの配置だけ見れば、開学登録に少し似てさえいた。\n\nただ、僕たちはもう登録を済ませているはずだった。\n\n「この構え……」\n\n朱銘は115の入口で止まった。\n\n「入学関連事項の説明って感じがあんまりしないな」\n\n谷懿は隣の117をちらりと見た。\n\n哲学班の方も、同じような長机、表、決済コード、スマホカードが並んでいる。\n\n「説明の内容はたぶん」谷懿は言った。「入学関連事項を、どうやって通信会社関連収入に変えるか、だな」\n\n「その発言、ちょっと危険そうだぞ」\n\n「安心して」谷懿は言った。「危険なことは、僕ならもっと大きな声で言う」\n\n僕は返事をしなかった。\n\n尹淵が見えたからだ。\n\nもし僕が日本語を話せたなら、その瞬間、間違いなくこう呟いていただろう。やっぱり……。\n\n彼は115教室の入口に立ち、胸には班導証を掛け、白いシャツの先輩女子と話していた。その様子は相変わらず自然で、体面が整っていて、またしてもごく普通の書院業務をこなしているだけに見えた。\n\n僕たちが来たのを見ると、尹淵は顔を上げて微笑んだ。\n\n「物理班の同学は115へ。順番に並べばいい。先輩たちの説明を聞いて、それから登録してください」\n\n李向陽が前へ出た。\n\n「尹学長、今夜の主な内容はキャンパス電話カードの手続きですか？」\n\n「そう理解していい」尹淵は言った。「これは書院と通信会社が協力して行う新入生向けキャンパス通信サービスだ。今後の通知受信や、輔導員・班導との連絡が便利になる。強制ではないけれど、みんなに办理することを勧めている。後々の統一管理も少し楽になるからね」\n\n彼は落ち着いていた。\n\nしかもわざわざ「強制ではない」という四文字を付け加えた。\n\nけれど、その四文字は僕をあまり安心させなかった。\n\n僕たちは列に従って115へ入った。\n\n教室にはすでに多くの人がいた。\n\n長机が一列に並べられ、その後ろに数人の高学年学生と通信会社のスタッフが座っている。教壇の横のスクリーンにはプラン説明が投影されていた。三ヶ月割引、月間通信量、通話分数、キャンパスネットワーク連携権益、初回チャージ金額。\n\n確かに正式に見えた。\n\n正式すぎて、どこがおかしいのかをすぐに言うのが難しいほどだった。\n\n前の学生たちは順番に表を記入し、コードを読み、カードを受け取っていった。すぐ終わる人もいれば、少し迷う人もいたが、最後にはやはりスマホを取り出した。\n\n李向陽は僕たちの前に並んでいた。\n\n彼の番になると、すぐには表に書き込まなかった。まずプラン説明を見て、いくつか質問した。\n\n「有効化しないことはできますか？」\n\n「できます。ただ、割引期間中はお得なので有効化をおすすめします」\n\n「三ヶ月後は自動更新ですか？」\n\n「期限後は標準プランになります。ご自身で解約できます」\n\n「キャンパスネットワークとの連携は必須ですか？」\n\n「必須ではありません。ただ連携すると、今後キャンパスネットワークの利用が便利になります」\n\n李向陽は頷いた。\n\nそして表を書き、コードを読み、支払った。\n\n全過程は二分もかからなかった。\n\n僕は彼がスマホをしまうのを見ながら、いかにも李向陽らしいと思った。\n\n彼はこの件に少し変なところがあると気づいていないわけではない。\n\nただ彼にとって、九十九元、三ヶ月プラン、解約可能、自分に大きな影響はない、という条件が揃えば、結論はかなり明確になる。これに余計なコストをかけるほどの価値はない。\n\nすぐ朱銘の番になった。\n\n机の向こうの長髪の先輩は笑顔で表を差し出した。\n\n「同学、名前と専攻を書いて、それからこのコードを読んで支払ってください」\n\n朱銘は表を低頭して見た。\n\n「学長、僕は办理しません」\n\n先輩は少し固まった。\n\n「これはですね、書院側が新入生に統一しておすすめしているプランなんです。みなさんは学校に来たばかりですし、これから輔導員や班導と連絡したり、通知を受け取ったりするのに便利です」\n\n「もう電話カード二枚持ってるんです」朱銘は言った。「これ以上増やすと、僕の人生は正式に三カード時代へ突入します」\n\n長髪の先輩は、彼がそう返すとは思っていなかったらしい。\n\n半秒止まってから、笑顔を保ったまま続けた。\n\n「同学、これは普通の電話カードではなく、キャンパス通信サービスです。みなさん基本的に办理しますし、办理しないと後々の通知や統計で少し不便になるかもしれません」\n\n「微信で通知は受け取れます。QQでも通知は受け取れます。スマホで電話もできます」朱銘は言った。「最悪、夢枕に立って伝えてもらっても」\n\n僕は危うく耐えられなくなるところだった。\n\n長髪の先輩の笑顔が、ついに少し固まった。\n\n「では、先に横でお待ちください」\n\n朱銘はそれ以上争わず、教室の外へ向かった。\n\n僕の横を通る時、彼は僕の肩を軽く叩いた。\n\n力は強くなかった。\n\nけれどその一回は、何かの選択肢を僕の手に渡したみたいだった。\n\n僕の番だった。\n\n机の上の表が僕の前へ押し出される。\n\n姓名、学院、専攻、クラス、連絡電話、身分証番号の下六桁。\n\nペンは表の横に置かれていた。\n\n僕はその表を低頭して見つめ、ふとそのペンが重く見えた。\n\n「同学？」\n\n長髪の先輩が声をかけた。\n\n「書くだけで大丈夫です」\n\n「学長」と僕は言った。「これは必ず办理しないといけないんですか？」\n\n「必ずではありません」彼は言った。「ただ、办理をおすすめしています。さっき尹学長からも説明があったと思いますが、これは書院で統一して進めているキャンパス通信サービスで、今後の通知、管理、連絡が少し便利になります」\n\n僕は前の方を見た。\n\n尹淵は教壇の横に立ち、別の班導と低い声で話していた。彼は僕を見ていなかった。あるいは、見ていても何も異常を示さなかった。\n\n教室は暑かった。\n\n空調はついていたが、人が多すぎて、冷気は何層もの身体に遮られ、不完全な涼しさだけが残っていた。\n\n僕はペンを取った。\n\nペン先が表に触れようとした瞬間、頭の中に、数日前に谷懿が言った言葉がよぎった。\n\n班導だから、成績がいいからといって、何でも言いなりになるな。\n\n言いなり。\n\nそれは確かに、僕のいつもの処世術にかなり近い。\n\nむしろ、この世界に来てからの僕は、ほとんどの時間、この人生に対して言いなりになろうとしていた。\n\n誰かが行くべき場所を示せば、そこへ行く。\n\n資料に自分がどんな人間だと書かれていれば、そういう人間のふりをする。\n\n通知が何かを要求すれば、できるだけ時間通りに行く。\n\n十分に協力的でいれば、僕が実は「姜嵐」になる準備など何もできていないことを、誰にも見抜かれないのではないかと思っていた。\n\nけれど、それはあの姜嵐のやり方ではない気がした。\n\n僕の手は表の上で止まった。\n\n次の瞬間、ぼんやりした音が遠くから聞こえた。\n\n教室ではない。\n\n至善楼でもない。\n\n古いプリンターが動く時の、カタカタという音だった。\n\n紙が一枚ずつ吐き出され、温かいトナーの匂いを少し帯びている。夏の小さな部屋には空調がなく、扇風機が首を振るたびにぎしぎし鳴った。机の上には練習帳の束が積まれている。誰かが声を潜めて言った。\n\n「嵐哥、そんなことしたら学校の偉い人に目をつけられるよ」\n\nもう一つの声は若く、そして焦っていた。\n\n「これは君一人の問題じゃないんだよ」\n\n僕には、複写したばかりの紙を揃える一つの手が見えた。細い指が紙の縁で浅く切れている。\n\nそして、もっと深いところから一つの言葉が浮かび上がった。\n\n「僕は学生の一員だ」\n\nその声は近く、同時に分厚い水を隔てているようでもあった。\n\n「学生の権益を守るのは、当然だろ」\n\n僕ははっと我に返った。\n\nペン先はまだ表の上に浮いていた。\n\n手のひらは汗でいっぱいだった。\n\n僕はそれを自分の記憶だとは思わない。\n\n少なくとも、この瞬間は思わなかった。\n\nむしろそれは、この身体に残されたどこかの場面が、目の前の表、このペン、この教室に満ちた妙に馴染みのある話術によって、短く呼び覚まされたものに近かった。\n\n物質は精神の担い手だ。\n\nもし身体が本当に、もう一人の人間の精神の痕跡を抱えているのなら、ある動作、ある匂い、ある場面は、それらをもう一度押し出すことがあるのかもしれない。\n\nこの説明は科学的ではない。\n\nけれど僕は、科学がこの世界のすべてを説明できるとは限らないと信じたい。\n\n「同学？」\n\n長髪の先輩がもう一度僕を呼んだ。\n\n「これは強制ではありませんが、今办理しておくことをおすすめします。後で寮の通知、学院の連絡、キャンパスネットワーク認証など、多くの場面でこのカードがデフォルトになります。今办理しないと、あとで自分で営業所へ行く必要が出て、面倒になりますよ」\n\n彼の言い方は、とても慣れていた。\n\n何度も何度も繰り返してきた言葉のようだった。\n\nだが、ある言葉は、繰り返される回数が十分に多いからといって真理になるわけではない。\n\n僕はペンを机に戻した。\n\n「办理しません」\n\n相手の表情がさっと変わった。\n\n「もうカードをお持ちですか？」\n\n「はい」\n\n本当はそこが重点ではない。\n\nそれでも僕は頷いた。\n\n「カードを持っていても办理できます」彼は少し無理に笑顔を戻した。「これは主にキャンパスプランで、割引期間中はかなりお得です。みなさん办理していますし、办理しないと後でクラスの統計も面倒になります」\n\n「办理しないと、通常の通知受信に影響しますか？」\n\n「それはこちらでは保証できません」彼は言った。「ですから、やはりおすすめとしては……」\n\n「つまり、影響するんですか、しないんですか」\n\n「一般的にはしませんが……」\n\n「通常の通知に影響しないなら、办理しません」\n\n一連の言葉が口をついて出たあとで、自分の声が少し強張っていることに気づいた。\n\n熱血漫画に出てくる、澄んでいて揺るぎない少年の声ではない。\n\nむしろ、担任に指名されて暗唱する時、暗唱できるとわかっているのに、次の一句でつまずくのではないかと心配している声に近かった。\n\n「同学、そうされるとこちらもやりにくいです」\n\n長髪の先輩の笑顔は、少しずつ引っ込んでいった。\n\n「今日は君だけを対象にしているわけではありません。立華書院の新入生全体が办理しています。みんなが協力すれば、手続きはすぐ終わります。特別な事情があるなら班導に説明してもいいですが、ここで後ろの同学に影響を与えないでください」\n\n後ろの同学。\n\n手続きへの影響。\n\nみんなが協力。\n\n言葉が一つずつ落ちてきて、どれも合理的に聞こえた。\n\n合理的すぎて、少し息が詰まった。\n\nその時、尹淵が歩いてきた。\n\n「どうしたの？」\n\n声は相変わらず穏やかだった。\n\n「尹学長、この同学があまり办理したくないようで」\n\n尹淵は僕を見た。\n\n彼はそこで初めて僕を認識したように、僕の顔に目を少し留めた。\n\n「姜嵐？」\n\n僕は頷いた。\n\n「何か気になることがある？」\n\n「すでに電話カードを持っています」僕は言った。「それに、さっき学長も、办理しなくても通常の通知には影響しないと言いました」\n\n尹淵はすぐには反論しなかった。\n\nむしろ軽く頷いた。\n\n「理論上はそうだね」\n\nそれから彼は言った。\n\n「ただ、大学では多くのことが、理論上必要かどうかだけで決まるわけではない。協作コストも見なければならない。みんなが協力すれば物事は簡単になる。一人ひとりが自分の考えだけで動くと、後の実行がとても面倒になる」\n\n平静で、合理的で、体面がある。\n\n汚い言葉も、明らかな脅しも一つもない。\n\n「姜嵐」尹淵は続けた。「君はこの道理を理解できない人ではないはずだ」\n\n教室の中が少し静かになった。\n\n全員が僕を見ているわけではない。\n\nただ近くにいる学生たちは、表を書く手を少し遅くしていた。低頭してプラン説明を研究しているふりをする人。余光でこちらをちらちら見る人。\n\n僕は急に、もう一度ペンを取りたくなった。\n\n書く。\n\n払う。\n\nカードを受け取る。\n\nそして出ていく。\n\n九十九元にすぎない。\n\n三ヶ月にすぎない。\n\n一ヶ月あたり三十数元、朝食数回分の金額だ。\n\nこの先起こりうる面倒に比べれば、それは僕のために用意された割引プランみたいに安い。\n\nだがそう思った瞬間、頭の中で古いプリンターの音がもう一度カタカタと鳴った。\n\n紙が吐き出される。\n\n温かく、ざらついて、トナーの匂いがする紙。\n\n喉が動いた。\n\n「これが自願なら、办理しない人がいることも認められるべきです」\n\n自分がそう言うのが聞こえた。\n\n声は大きくなかった。\n\nでも周囲には届いた。\n\n尹淵は僕を見た。\n\n「もちろん認められるよ」\n\n「でも办理しないと、あなたたちがやりにくくなる。クラスの統計が面倒になる。後の管理が不便になる。そういうことなら、それは単純な自願ではありません」\n\n僕は一度止まった。話す速度が自分でも抑えられないくらい速くなり始めた。\n\n「もしこれが学校や書院の正式な要求なら、正式な通知があるべきです。必ず办理しなければならないこと、費用がいくらなのか、用途は何なのかを明確に書くべきです。正式な要求ではないなら、『統一安排』や『みんなが協力している』という言い方で、全員に办理を求めるべきではありません」\n\nそこまで言ったところで、自分が少し速く言いすぎていることに気づいた。\n\n速すぎて、まだ完全に覚えていない台詞を、急いで最後まで読み上げようとしているみたいだった。\n\nそれでも、止まれなかった。\n\n「僕はプランに必ず問題があると言っているわけではありません。他の人が办理するなと言っているわけでもありません。办理したい人は办理すればいい。でも僕は办理したくない。だから办理しません」\n\n教室は完全に静かになった。\n\n静かすぎて、隣の117教室から聞こえる話し声まで耳に入った。\n\nあちらでも誰かが先輩と言い争っているのかもしれない。\n\nそれとも、僕の錯覚かもしれない。\n\n尹淵は僕を見ていた。\n\n彼の顔には、ほとんど表情の変化が見えなかった。\n\nどうしても言うなら、むしろその笑みがさっきより少しはっきりしているようにさえ見えた。\n\n僕には理解できなかった。\n\n直接冷たい顔をされるより、そちらの方がずっと居心地悪かった。\n\n「君の言いたいことはわかった」\n\n彼は言った。\n\n「君がそこまで言うなら、もちろん办理しなくていい」\n\nその言葉は譲歩のように聞こえた。\n\nけれど僕は、それで安心できなかった。\n\n尹淵はすぐに続けたからだ。\n\n「ただ、大学は高校とは違う。多くの場合、何がやる価値のあることか、何がやる価値のないことか、自分で判断できるようにならないといけない」\n\n僕は答えなかった。\n\nこのまま言い続ければ、さっきようやく積み上げた少しの勢いを、全部漏らしてしまいそうだったからだ。\n\nだから僕は教室の外へ向かった。\n\n本来なら、とても尊厳のある行動だったはずだ。\n\nもしこれが熱血漫画なら、ここでBGMが流れ、カメラは少し寂しげな主人公の背中をゆっくり引きながら、全員が沈黙の中で彼の颯爽とした退場を見送るのかもしれない。\n\nだが次の瞬間、現実では、僕は急ぎすぎ、緊張しすぎたせいで、入口の少し盛り上がったタイルにつまずいた。\n\nかなりはっきりと半歩よろけ、あと少しで地面と親密な接触を交わすところだった。\n\n背後から小さなどよめきが聞こえた気がした。少なくとも、僕のBGMではなかった。\n\n振り返るな。絶対に振り返るな。\n\n「真の男は爆発を振り返らない」\n\n僕はこの極限まで気まずい「気まずさ」を必死に無視し、何事もなかったふりをした。\n\nようやく、この一幕はカットされた。\n\n廊下の空気は、教室の中より少し涼しいように感じた。\n\nその瞬間、僕は自分の手がまだ震えていることに気づいた。\n\n目立つほどではない。\n\nけれど確かに震えていた。\n\n朱銘は少し離れた壁にもたれていた。僕が出てくると、身体を起こした。\n\n办理したのかとは訊かなかった。\n\nただ、さっき僕がつまずきかけた場所を見た。\n\n「前半はかなりかっこよかった」\n\n僕は少し沈黙した。\n\n「後半は？」\n\n「後半は物理法則が君に勝ちかけた」\n\n急に少し笑いたくなった。\n\nけれど、息を吐いただけだった。\n\n「笑うなよ」僕は言った。「まだ脚が少し震えてる」\n\n「わかる」朱銘は言った。「今の表情、かなりいい」\n\nその時ようやく、教室を出た瞬間に自分の表情管理が完全に崩壊していたことに気づいた。\n\n「それでもかっこいいって言ったのか？」\n\n「人生には、いくつかハイライトがあるものだ」\n\n僕たちがそう話していると、隣の117教室の入口からふいに騒ぎが聞こえた。\n\n振り向く。\n\n谷懿が中から出てきた。\n\n手には空白の登録表を持っている。どこかの戦場から鹵獲した敵軍文書みたいだった。\n\n僕を見ると、彼の目が光った。\n\n「よう」\n\n「君も办理しないの？」\n\n「僕は本当は、彼らが『自願』という言葉をどれだけ変化させられるのか見てみたかったんだ」谷懿は言った。「結果、この技術は専攻を問わず、かなり均衡に発展していることがわかった」\n\n朱銘が訊いた。\n\n「そっちはどうだった？」\n\n「だいたい同じ」谷懿は表を折った。「書院全体で進めている、不办理だと後の管理に影響する、と言っていた。だから僕は訊いた。通信サービスなら、まず僕の通信の自由にサービスしてくれないのか、と」\n\n「通信の自由？」\n\n「たとえばね、入学前から僕は大四の蔡学姐や大二の王学姐と友好的な個人関係を築きたかったんだが、残念ながら連絡先を得る機会に恵まれなくて……」\n\n「はいはい、脱線するな。それで？」\n\n「それで出てきた」谷懿は言った。「あのまま続けたら、うちの班導が人生の意義に疑問を抱き始めるところだった」\n\n彼は軽く言った。\n\n今夜の件は、確かに尹淵一人の考えではない。\n\nそれは書院の通知から来ていた。管理層の黙認から来ていた。班導の実行から来ていた。通信会社の机から来ていた。「みんな办理している」という人群から来ていた。そして、それぞれが「まあいいか」と思う瞬間からも来ていた。\n\nだからこそ、より面倒だった。\n\n谷懿は僕の横へ来ると、急に真面目な顔になり、重々しく僕の肩を叩いた。\n\n「小嵐の慷慨激昂な演説を聞き逃したのは、まことに遺憾だ」\n\n僕は固まった。\n\n「聞こえてたの？」\n\n「ドアがちゃんと閉まってなかった」彼は言った。「それに後半、君は音量も上がっていたし、話す速度も速かった。知らない人が聞いたら戦前動員かと思う」\n\n「……あの時、めちゃくちゃ緊張してたんだけど。相手は二対一の車輪戦だったし」\n\n「はいはい、二言褒めたらすぐ調子に乗る」\n\n谷懿は心から笑った。\n\n「得意になるなよ。次は僕が本物の演説を見せてやる。その時はよく見て、よく学ぶこと。あ、できればカメラを携帯しておけ。僕の英姿を記録して、後世の人々が繰り返し観摩学習できるように……」\n\n谷懿はまた、責任感ゼロの大言壮語を始めた。\n\n当時の僕は当然、その言葉を本気にしなかった。\n\nあとで思い返すと、あの日カメラを携帯していなかったことは、少しだけ後悔することになる。\n\n僕は隣で、ひたすら終わりのない気まずさに沈んでいた。\n\n本物の黒歴史は、教室を出たからといって終わるわけではない。隣の専攻によって、学際的に聴講されるだけなのだ。\n\n谷懿は僕を見て、少し笑みを薄めた。\n\n「でも本当に、さっき一番面白かったのは、君が拒否したことじゃない」\n\n「じゃあ何？」\n\n「死ぬほど怖がっていたのに、論理が崩れなかったこと」\n\n彼はごく普通に言った。\n\nそのせいで、僕は一瞬返す言葉を失った。\n\n僕はもちろん怖かった。\n\n自分がさっき何か間違ったことを言ったのではないか。\n\n尹淵にこれから目をつけられるのではないか。\n\n教室の人に面倒くさいやつだと思われたのではないか。\n\n……。\n\nそして、僕のものではないはずの姜嵐が本当にここに立っていたなら、もっと綺麗にやれたのではないか。\n\n「行こう」\n\n朱銘が僕の肩を叩いた。\n\n「ここにこれ以上いたら、奴らがその場で打法をアップデートし、粒度を揃えて、第二段階プランを出してくるかもしれない。不办理者には統一で思想教育ギフトパックをプレゼント、みたいな」\n\n谷懿は真剣に考えるふりをした。\n\n「そのプランに夜間データ容量があるなら、僕は検討するかもしれない」\n\n「検討すんな」\n\n僕たち三人は階段を下りていった。\n\n至善楼の外には、もう夜が降りていた。\n\n昼間ずっと焼かれていた地面には、まだ熱が残っている。建物を出ると、そのむっとする熱がまた顔に押し寄せた。遠くの運動場の方からは、どこかの学院の軍陣がまだ訓練を終えていないのか、かすかに掛け声が聞こえてきた。\n\n僕は振り返った。\n\n115教室の灯りはまだついていた。\n\n窓越しに、尹淵が長髪の先輩と何か話しているのだろうか。教室に残った他の同学は、僕という「刺頭」についてひそひそ話しているのだろうか。\n\n僕にはわからなかった。\n\nそしてこの瞬間は、そこまで知りたいとも思わなかった。\n\n朱銘が隣を歩きながら、ふいに訊いた。\n\n「で、本当に办理しないの？」\n\n「しない」\n\n「よし」彼は言った。「じゃあ俺も三枚目は办理しない」\n\n僕は彼を見た。\n\n「そもそも三枚目を办理するべきじゃないだろ」\n\n「そうとも限らない」朱銘は真顔で言った。「人類文明の偉大な進歩の多くは、やるべきではないことから始まった」\n\n谷懿が横で頷いた。\n\n「たとえば資本主義」\n\n「たとえば君の二周省略」と僕は言った。\n\n谷懿は自然な動作で、手の空白登録表をポケットへ入れた。\n\n「あれは省略ではない」\n\n「じゃあ何？」\n\n「価値を生産しない無意味な反復的機械労働に対する理性的拒否だ」\n\n朱銘は二秒沈黙した。\n\n「長すぎて覚えられなかった。もう一回言ってくれ。次に休みを申請する時使いたい」\n\n夜風が教学楼のあいだを抜けてきた。まだ残っている熱を少しだけ運んでいる。\n\n僕は二人のあいだを歩きながら、手のひらの汗がようやく少しずつ乾いていくのを感じた。\n\n実のところ、さっきの反抗が美しいものではなかったことはわかっている。\n\n僕は早口だった。\n\n危うく転びかけた。\n\n教室を出たあとも脚が震えていた。\n\nもしこれを何かの俺TUEEE系爽文に書き込んだら、編集者に「主人公のオーラが足りないので書き直しましょう」とやんわり言われるかもしれない。\n\nけれど、僕に書き直しの機会はない。\n\n現実の言葉は、一度しか言えない。\n\n言ってしまえば、それが綺麗でも狼狽えていても、そこに残る。\n\n僕が記入しなかったあの表のように。\n\n机の上に戻したあのペンのように。\n\nそして、遠い遠いどこかで、まだカタカタと鳴っている古いプリンターのように。\n\n僕が「原主」と呼んでいる姜嵐が、今どこにいるのかはわからない。\n\n今夜のあと、尹淵が騒がしかった僕をどこかのリストに入れるのかどうかもわからない。\n\nそれでも少なくとも今、至善楼の外の蒸し暑い夜風の中を歩きながら、僕は少しだけ思った。\n\n複写機のそばで話していた彼を、完全には裏切らなかったのかもしれない。\n\nたとえそれが、ごく小さく、ひどく不器用な一歩にすぎないとしても。\n\nスマホがまた震えた。\n\n今度は朱銘がA109の小グループに送ったメッセージだった。\n\n【朱銘：今夜、あるプレイヤーが新実績を解除しました：キャンパス通信サービス拒否。】\n\n続けて、もう一通。\n\n【朱銘：追加実績：危うくタイルに単独キルされる。】\n\n僕は無表情でスマホをロックした。\n\n大学生活は実に豊かだ。\n\n一回電話カードを办理しないだけの小事件が、ほとんど僕の人生最終章になりかけるくらいには。\n\n大学城の街区はすでに夜に沈んでいた。周囲は静かで、遠くから時折車のクラクションが聞こえるだけだった。道の両側の木々は微風にさらさらと鳴り、たまに数枚の葉が吹き落とされる。それはまるで、秋が頑固に、自分はもう来ているのだと証明しようとしているようだった。"},{"title":"第七章：招かれざる客","file":"7、第七章.md","text":"尹淵に言い返したあの夜、僕は一時、自分の大学生活がこれでまったく新しいルートへ入ったのではないかと思った。\n\nよくある爽文の展開に従うなら、僕はここから主人公の魂に目覚め、立華書院のさまざまな不公正の前で一路高歌猛進し、尹淵を拳で打ち、張迪を足で蹴り、最後には夕陽の下でカメラに向かって、ショート動画のサムネイルにできるような決め台詞を言うべきだった。\n\nけれど翌朝、アラームが鳴った時、僕が最初に直面したのは運命でも理想でもなく、軍訓服だった。\n\nしかも、選択の余地など一切ない軍訓服である。\n\n現実とはそういうものだ。\n\n前日の夜に、人格上の小さなアップグレードを完了したかどうかなど気にしない。キャンパス通信カードを一枚拒否したばかりかどうかも気にしない。朝六時二十分が来れば、ベッドから這い出し、あの蒸れて、硬くて、洗っても落ち切らない汗の匂いを少し帯びた迷彩服を、もう一度身体に着なければならない。\n\nそうして、少しだけ芽生えた英雄感は、僕がベルトの金具と十秒ほど格闘したあと、あっさり夭折した。\n\nその後の数日も、だいたいそんなものだった。\n\n昼間は軍姿、正歩、跑歩、掛け声。\n\n夜は寮に戻ってシャワーを浴び、服を洗い、髪を乾かし、身体がまだ完全には自分に戻らないうちに眠る。\n\n三日目から、軍訓服の匂いは説明しがたいものになった。\n\n朱銘の評価はこうだった。\n\n「この服、もう霊性を持ち始めてる」\n\n「どんな霊性？」と僕は訊いた。\n\n「自発的に洗浄を拒否し始めた」\n\nその時、僕は反論したかった。\n\nだが袖口を低頭して嗅いだあと、事実を尊重することにした。\n\nもちろん洗ってはいる。\n\nしかも毎日、違うブランド、違う香り、違う価格帯の洗剤で真面目に洗っている。\n\nけれど汗、埃、日に干された布、プラスチックの靴底、安っぽい迷彩布が混ざったその匂いは、もはや一つの匂いではなかった。軍訓という出来事そのものが、物理的な形で服に根を下ろしたようだった。\n\n「自由」や「自我」などという言葉は、この数日間どこにも見つからなかった。訓練後に軍帽の下から髪を救い出す自由でさえ、毛教官に奪われた。\n\nある朝の集合時、毛教官は突然すべての軍陣の前へ大股で歩き出て、僕たちにこの軍装が何を意味するのか本当にわかっているのかと訊いた。\n\n当然、僕たちは答えられなかった。すると彼は、「一部の同学」が訓練後すぐ軍帽を脱ぎ、さらには手に持って弄ぶという大逆不道の行為を痛烈に叱責し始めた。それは身にまとう軍服への深刻な侮辱であり冒瀆であり、軍人は軍人らしくあるべきだ、というわけだ。\n\nそして最後に、結論のような命令を下した。軍装は必ず身につけ、軍帽は必ず頭にかぶること。\n\nそんな日々の中で、僕は谷懿の言葉のいくつかを、だんだん理解できるようになっていった。\n\n彼は、軍訓は服従性テストだと言った。\n\n最初、僕はその言葉も、彼のほかの危険発言と一緒に「谷懿の大風呂敷フォルダ」へ入れていた。なにしろそのフォルダは容量が大きい。資本主義から跑歩二周省略、哲学系の尊厳から彼が将来世界を変えるかもしれない話まで、何でも入る。\n\nだが、人が何日も続けて太陽の下に立たされ、他人の号令に合わせて足を上げ、下ろし、向きを変え、立正し、稍息し、少しずつその生活に慣れていく時、自分に対して何の疑いも持たないのは難しい。\n\n特に、僕がほかの人より苦しんでいるわけでも、ほかの人より清醒であるわけでもないと気づいた時には。\n\n僕はただみんなと同じように、笛が鳴れば動き、口令が落ちれば止まった。\n\nそれは大げさに書き立てるほどの堕落ではない。\n\nもっと悪いことに、それはあまりにも普通だった。\n\n九月二十一日、中秋。\n\n本来なら、その言葉は月餅、夕飯、家族のグループチャット、そして居間のテレビから何度目かわからないほど流れてくる祝賀番組のオープニングを思い出させるはずだった。\n\nけれど雲夢師大では、それはまず、いつも通りの笛、集合、運動場を意味していた。\n\n集合前、母から微信が届いた。\n\n【母：中秋快乐。今日も軍訓？　暑いから日焼けに気をつけてね。】\n\n僕はそのメッセージを見つめ、指を画面の上で少し止めた。\n\n普通のメッセージだった。\n\nけれど、僕はその普通さの前で数秒ためらってしまった。\n\nそれはこの身体の母親から届いたものだった。\n\nそして僕が今、一生懸命演じようとしている身分の母親から届いたものでもあった。\n\n最後に、僕は四文字だけ返した。\n\n【僕：中秋快乐。】\n\n少し考えて、もう一文足した。\n\n【僕：心配しないで。】\n\n送信してから、スマホをポケットに入れた。\n\nその日の午前の訓練内容にも、相変わらず新鮮味はなかった。\n\n張迪は僕たちに高抬腿を練習させた。\n\n高抬腿という名前だけ聞けば、簡単な動作のように思える。\n\nだがそれが九月の太陽の下に置かれ、すでに長時間軍姿を立った脚に課され、そしていつでも「もっと高く」と叫ぶ教官の前で行われると、人類が長時間維持するのにあまり向いていない姿勢へ変わる。\n\n「脚を上げろ！」\n\n張迪は隊列の前に立ち、硬く明るい声で叫んだ。\n\n「これは高抬腿か、それとも散歩か？　第四列、やり直し！」\n\n隊列の中に、抑えた息を吸う音が広がった。\n\n誰も文句を言わなかった。\n\nいや、文句という行為は、すでにみんなの顔に浮かぶ細かな表情へ自動圧縮されていた。\n\n僕の右側に立っていた女子の名前を知ったのは、その後のことだ。\n\n数日前から、僕は彼女に気づいていた。\n\n何か特別な出来事があったからではない。\n\n彼女は背が高くなく、軍帽をかぶると顔がさらに小さく見えた。\n\n張迪が「つま先を伸ばせ」と叫ぶと、本当に低頭して自分のつま先を確認する人だった。休憩中、ほかの人が小声で不満を言っている時も、彼女はまず最後まで聞き、それから何かを真面目に考えているような表情を少し見せた。\n\nその真面目さは、少し不器用で、少し頑固だった。\n\nその日の午前、僕が本当に彼女に注意を向けたのは、彼女の水筒だった。\n\n前の休憩の時点で、彼女の水筒はもう空だった。透明なボトルの中には、太陽に晒されてできた水気が少し残っているだけだった。\n\n訓練の合間は短い。しかも張迪は早いうちから、誰も軍訓場を離れて水を買いに行ってはならないと言っていた。\n\n「休憩は状態を整えるためのものだ。お前たちがコンビニをぶらつくためのものじゃない！」\n\n彼がそう言う時の口調は、軍訓場の端にある自動販売機が何かの敵対勢力であるかのように理直気壮だった。\n\n僕の水はまだ小半分残っていた。\n\n正直、その水は僕にとってもかなり重要だった。\n\n太陽の下に長く立った人間は、一口の水にほとんど宗教的な敬意を抱くようになる。普段なら二元のミネラルウォーターも、その瞬間には神棚に祀られる資格を得る。\n\n休憩の笛が鳴ると、みんなほとんど同時にしゃがみ、座り、帽子を脱ぎ、水を飲んだ。\n\n僕はボトルの蓋を開け、一口飲んだ。\n\n水はすでに少し温かくなっていた。\n\nおいしいとは言えない。\n\nでも、水だった。\n\n陳小雲が自分の空のボトルを持ち上げ、一度止まり、また隅へ置くのが見えた。彼女は手の甲で額の汗を拭った。\n\n僕はもう一度蓋を閉めた。\n\n「よければ、僕のを飲む？」\n\n陳小雲は横を向いて僕を見た。\n\n明らかに少し驚いていた。\n\n「大丈夫です」\n\n声は軽かった。\n\n「あとでまた訓練だし」僕は付け足した。「教官も外へ買いに行かせてくれないし」\n\n彼女は自分のボトルを低頭して見た。\n\nそれから、僕の手の中の水筒を見た。少しためらった。\n\n同じボトルから水を飲むという行為は、青春キャンパス作品ならどこにでも、作者が不必要な曖昧さを盛り込む材料として使いがちだ。\n\nそして今の僕たちの関係は、ほとんど陌生人に近い。そんな展開を支えられるほど親しくはない。\n\n僕は慌てて付け足した。\n\n「君のボトルを出してくれたら、少し移すよ」\n\n彼女はようやく同意するように頷き、自分の空ボトルを差し出した。\n\n僕はゆっくり動いた。できるだけボトルの口同士が触れないようにした。\n\n水が空のボトルへ落ち、澄んだ音を立てた。透明な水の線が落ちていき、すぐにボトル中央のラベルの縁を越えた。\n\n彼女は指先でボトルに軽く触れた。\n\n「あなたも残して」\n\n僕はその言葉に少し固まり、手の動きも止まった。\n\n「大丈夫」\n\n「ありがとう。でももう十分です」\n\n彼女はほんの一口だけ飲み、すぐに蓋を閉めた。\n\n「陳小雲です」\n\n突然自己紹介されると思っていなかったので、僕は反応が半拍遅れた。\n\n「姜嵐。物理系」\n\n「うん。哲学系」\n\nすぐに笛が鳴った。\n\n休憩終了。\n\n全員がもう一度立ち上がる。\n\nけれど僕が隊列に戻った時、右側のあの少し頑固な女子は、もうただの「右側の女子」ではなくなっていた。\n\n彼女には名前があった。\n\n何かが、その半分の水のせいで少し変わったような気がした。\n\n午後三時過ぎ、主席台の方から突然笛が鳴った。\n\nこれは珍しいことではない。\n\n軍訓期間中、笛の音は人類の言語より上位の存在である。説明はしない。ただ全員に即座に今の動作を止めさせ、次に何が起こるのかを各自推測させる。\n\n張迪は笛を聞くと、主席台の近くまで小走りし、ほかの教官数人と一緒に一列に並んだ。\n\nさらに数分後、張迪はようやく戻ってきた。もちろん、僕たちは彼の帰還を期待していたわけではない。むしろ、できればもう少し遅く戻ってきて、毛教官に主席台の方で捕まっていてほしかった。\n\n「全体！　立正！」\n\n「稍息！」\n\n「これから重要なことを通知する！」\n\n「今日は中秋節だ。しばらくしたら、譚校長がみなさんを慰問に来られる」\n\n「これは我々の訓練成果を示す貴重な機会だ！　今から全員、十二分に気を引き締めろ！　最高の状態を見せろ！　いつでも譚校長を迎えられるよう準備しろ！」\n\n「全体！　訓練続行！」\n\n言い終わると、隊列の中で低くざわめきが起きた。\n\n「何？　偉い人が来るの？」\n\n「今、名前聞こえた？」\n\n「いやお前、譚院士も知らないの？」\n\n「え……」\n\n「静かに！」\n\n張迪は僕たちを見渡した。\n\n「訓練続行！　気を引き締めろ。もし誰かがその時に足を引っ張ったら、容赦しない」\n\n譚校長。\n\nその名前は、僕にとって陌生ではなかった。\n\n正確に言えば、雲夢師大に入ってから、僕はすでにいろいろな場所で何度も聞いていた。\n\n開学式の資料に彼はいた。\n\n学校公式サイトのトップページにもいた。\n\nキャンパスの掲示板にもいた。\n\nそれどころか、今年の開学宣伝動画の主役も彼だった。『雲夢師範大学譚子厚院士、2021級新入生へ寄語』。\n\n動画のサムネイルの譚子厚は青白いチェックシャツを着て、髪は半分白く、表情は温和だった。副校長というより、ドキュメンタリーで海洋と生命の神秘をゆっくり語る年長者のように見えた。\n\nけれど新入生にとって、彼はもちろんただの「長者」ではない。\n\n「院士」という二文字だけで、すべてを説明するには十分だった。\n\n院士が慰問に来るという知らせは、瞬く間に田径場全体へ炸裂した。教官たちは秩序を維持しようとしていたが、学生たちの興奮は隠しきれなかった。\n\n特に少し離れた生科班の学生にとって、「譚子厚」という名前は間違いなくさらに馴染み深いものだった。中には彼を偶像のように見ている人もいるかもしれない。自分の憧れで、学術界の大物が直接慰問に来ると聞いて、軍訓の緊張や疲労は一瞬で吹き飛んだようだった。\n\n「本当に譚院士なの？」\n\n「当たり前だろ、雲夢師大で譚って名字の校長はあの人だけだろ」\n\n「工程院院士だぞ！」\n\n「父親も院士って聞いた」\n\n「一門双院士？」\n\n「そう。譚家は海洋生物研究の家系らしい。めちゃくちゃ強い」\n\n「うわ、何それ学閥じゃん」\n\n最後の一言は朱銘だった。\n\n言い終えたあと、李向陽に訂正された。\n\n「学術世家、書香門第だ。何が『学閥』だ。口は禍の元だぞ」\n\n朱銘は彼を見た。\n\n「李哥、君ほんとにユーモアないな」\n\n李向陽はそのツッコミを無視し、主席台の方向を見ていた。\n\n表情は普段より少し真剣だった。\n\n「譚校長は本科、修士、博士、おそらく全部国内で、その後海外で訪問学者をして、帰国後に国家級プロジェクトを取った。三十代で重点実験室の方向責任者になっている」\n\n「なんでそこまで知ってるんだ？」朱銘が訊いた。\n\n「学校公式サイトにある」\n\n「暇な時に学校公式サイト見るの？」\n\n李向陽は少し沈黙した。\n\n「学校資源を理解するためだ」\n\n朱銘はまた敬意の表情を浮かべた。\n\n「負けた。俺なんかまだ教務システムのパスワードも設定してない」\n\n周囲の人々の顔に浮かぶ興奮は本物だった。\n\nこの数日軍訓に苦しめられ、ほとんど表情を失っていた人でさえ、「院士」「譚校長」「慰問」という言葉を聞いたあと、少しだけ光を取り戻していた。\n\n僕も思わず主席台の方を見た。\n\nその時、僕はまだ譚校長本人を見ていない。ただ周囲の人が「院士」「国家級プロジェクト」「一門双院士」と何度も口にするのを聞いているだけで、胸の中には何とも言えない期待が少し浮かび始めていた。\n\nその期待は少し俗っぽい。\n\nだが運動場にいる人間で、完全に俗を免れている人など、たぶんほとんどいなかった。\n\nおよそ二十分後、主席台の近くに明らかに人が増えた。\n\n毛鋭が台の横に立っている。\n\n輔導員の彭悦もいた。\n\n白いシャツを着た教師が数人、教学楼の方から歩いてきた。その後ろにはカメラやビデオカメラを持つ人もいる。\n\n田径場全体の空気が、それに伴って変わった。\n\n教官たちは普段より厳粛になった。\n\n学生たちも無意識に背筋を伸ばし始めた。\n\nその変化はとても微妙だった。\n\n誰も正式に何かを発表したわけではない。けれど全員が、「見られる」瞬間が近づいていることを知っていた。\n\nまもなく、青白いチェックシャツの男が主席台へ上がった。\n\n彼は宣伝動画より少し痩せて見えた。髪は黒と白が半々で、袖口はそれほど高くまくっていない。歩く時も、わざと指導者らしさを出そうとはしていなかった。周りには教師や教官が数人ついていたが、彼だけ少し画風が違っていた。普通の老人のように見えた。\n\n田径場が一瞬静かになった。\n\n次に、拍手が起きた。\n\n最初は主席台の近くからだった。\n\nすぐに、拍手は中央から広がる水紋のように、一層ずつ各軍陣へ伝わっていった。\n\n僕もそれに合わせて拍手した。\n\n譚校長はマイクの前へ歩き、軽く身をかがめた。\n\n「同学のみなさん、こんにちは」\n\n彼の声は音響を通して流れ、想像よりずっと温和だった。\n\n張迪のようにわざと声を張り上げる命令感はなく、動員会の指導者挨拶によくある滑らかな腔調もなかった。\n\nただ、ゆっくりで、安定していた。\n\n「今日は中秋節です。中国の伝統文化において、とても大切な日です。私は学校を代表して、みなさんを見に来ました。そして、みなさんと一緒にこの祝日を過ごしたいと思います」\n\n拍手が再び起きた。\n\n今度はさらに熱かった。\n\n譚校長は続けた。\n\n「先ほど、場の外で少し見ていました。私たちの同学は、訓練にとても真面目に取り組んでいて、精神もあります」\n\n数人の教官が主席台の横に立ち、背筋をまっすぐ伸ばしていた。\n\n張迪も同じだった。\n\n少なくとも遠くから見れば、普段よりずっと合格した教官らしく見えた。\n\n譚校長は少し止まり、口調を緩めた。\n\n「この数日の軍訓、同学のみなさん、本当にお疲れさまでした」\n\nその言葉が落ちた瞬間、田径場にはごく短い静けさが生まれた。\n\n誰も聞いていない静けさではない。\n\nむしろ全員が聞いていたからこその静けさだった。\n\nお疲れさまでした。\n\nその言葉自体はとても普通だ。\n\n食堂のおばさんが持ち帰りの飯を渡す時にも言える。宅配員が荷物を寮の下まで運んできた時にも言える。\n\nけれど軍訓場では、それが突然重くなった。\n\nこの数日、教官は毎日僕たちに訊いていた。\n\n「疲れたか？」\n\nそして正しい答えは、いつも一つしかなかった。\n\n「疲れていません」\n\n汗が帽子のつばから滴っていても。\n\n足裏が擦れて痛んでいても。\n\n夜、寮へ戻る時、階段を上ることさえ嫌になっていても。\n\n僕たちは疲れていないと叫ぶしかなかった。\n\nだから「お疲れさまでした」という言葉が主席台から出た時、それは誰かがようやく、全員が知っているのにずっと口に出せなかった事実を認めてくれたようだった。\n\n次の瞬間、拍手が爆発した。\n\n本当に爆発した。\n\n拍手しながら叫ぶ人がいた。\n\n手を強く叩く人がいた。\n\n口笛を吹く人さえいて、すぐ隣の同学に肘で突かれていた。\n\n僕は隣の朱銘が低声で言うのを聞いた。\n\n「今ここに宣言します。譚校長は今日唯一、人間の言葉を話した人です」\n\n「言葉に注意しろ」と李向陽が言った。\n\n「じゃあ言い直す」朱銘はすぐ従った。「譚校長は今日唯一、人類が理解可能な言語を発した人です」\n\n李向陽は彼を白い目で見た。\n\n拍手は長く続いた。\n\n長すぎて、譚校長は手を上げて下へ押し、みんなに静まるよう示さなければならなかった。\n\n田径場がもう一度秩序を取り戻すと、彼は手を少し上げた。さっきの熱烈すぎる拍手を受け止めるような動作だった。\n\n「どうやら、みなさん本当に辛かったようですね」\n\n今度は台下から笑い声が起きた。\n\n大きくはない。\n\nけれど、とても本物だった。\n\nその瞬間、僕はなぜ多くの人がこういう人を崇拝するのか、少しわかった気がした。\n\n彼は大声を出す必要がない。\n\n叱責する必要もない。\n\n誰かに立正、稍息、五周走れと命じる必要もない。\n\n主席台に立ち、全員が聞きたい一言を言うだけで、田径場全体の空気が彼の方へ寄っていく。\n\nこれも一種の権力なのだろう。\n\nただ、それはより温和に見え、そして人を心から従わせやすい。\n\n譚校長はその後もいくつか話した。\n\n中秋について。\n\n青年について。\n\n雲夢師大がみなさんを歓迎していることについて。\n\nどれも新しい話ではなかった。\n\nだが彼が言うと、学生たちはやはり真面目に聞いた。\n\n同じ「努力して勉強しなさい」でも、担任が言えば逃げ出したくなるかもしれない。だが院士が言えば、突然、検証可能な重みのようなものが増す。\n\n僕にはそれが人類の奇妙さなのかどうか、わからなかった。\n\n「今日はみなさんと一緒に祝日を過ごすのですから、私だけがここで一方的に話すのもよくありません」\n\n譚校長は台下を見た。\n\n「この数日の軍訓について、感想を話してくれる同学はいませんか？」\n\n田径場はまず一瞬静かになった。\n\nそれから、多くの軍陣で細かなざわめきが起きた。\n\n明らかに心が動いた人がいた。\n\n何しろ、院士と同じ台で話す機会なのだ。\n\nたとえ「軍訓で成長を得ました」「教官は辛いです」「これからも努力します」といった標準回答を数句言うだけでも、あとで朋友圈に上げれば、高校の同級生から十分な数のいいねをもらえる。\n\nしかも、横にはカメラまである。\n\nカメラというものは危険だ。\n\nそれは突然、自分の人生が今、記録されるに値する瞬間へ入ろうとしているのではないかと、人に信じさせる。\n\n「緊張しなくていいですよ。気軽に話してくれれば」\n\n生科班の方で、最初に手を上げる人が出た。\n\n続いて、ほかの軍陣でも手が上がった。\n\n「私！」\n\n「譚校長、こっちです！」\n\n「選んでください！」\n\n場面は一瞬で、軍訓慰問から大型抽選会へ変わった。\n\nしかし、全員がまだ「手を上げて機会を争う」という通常の遊び方に留まっていた時、一つの声が背後から突然響いた。\n\n「譚校長！」\n\nその声は明るかった。\n\nそして、聞き覚えがあった。\n\n胸が跳ねた。\n\n振り返る前に、哲学班の隊列から一人が飛び出すのが見えた。\n\n谷懿。\n\n彼は手を上げなかった。\n\n誰かに指名されるのも待たなかった。\n\n彼は直接、軍陣から走り出した。\n\nその感じを説明するのは難しい。表計算シートの一つのセルが、突然動画を再生し始めたようだった。\n\n「譚校長！　僕を選んでください！」\n\n谷懿は走りながら叫んだ。\n\n「21級哲学班、谷懿！　発言を申請します！」\n\n台下は一瞬で爆発した。\n\n「うわ、そんなのあり？」\n\n「あいつ誰だ？」\n\n「哲学班の変人か。そりゃそうだ」\n\n「いや、哲学班でも主席台に突撃はしないだろ」\n\n張迪の顔色が変わった。\n\n「谷懿！　帰隊！」\n\n張迪は、目の前のこの場面が自分の隙から生まれたものだと理解していた。だが衆目の中で、谷懿を直接捕まえて引き戻すこともできなかった。\n\nそのためらいの一瞬で、谷懿はすでに飛ぶように主席台の前まで走っていた。\n\n主席台の横に立っていた総教官が、すぐに一歩前へ出た。谷懿を止めようとしたのだろう。\n\nけれど一路走ってきた男子を見て、譚校長は怒らなかった。それどころか、横の人たちにまだ動かないよう手で示した。\n\nこうして谷懿は、本当に一息に主席台へ駆け上がった。\n\nマイクを渡す役の司会者は、明らかにまだ驚きから戻っていなかった。手に持ったマイクは半空中で止まり、突然それを誰に渡すべきか忘れてしまったみたいだった。\n\n言うが早いか、谷懿は一歩踏み出し、ほとんど流れるような動作で、司会者の手からマイクを奪い取った。\n\n「譚校長、どうか僕に同学を代表して発言することをお許しください！」\n\nその口調は、さっきの全力疾走が無謀ではなく、必要な礼節だったかのように真剣だった。\n\n譚校長が次の瞬間に発した言葉も、同じく全員の顎を落とした。\n\n「いいでしょう。では、この同学に口火を切ってもらいましょう」\n\n譚校長は大きく手を振り、谷懿の無作法を許しただけでなく、周囲の人が羨んでやまない機会を彼に与えた。\n\nこれほど規則を破った谷懿を見て、田径場全体で張迪だけはおそらく胸を撫で下ろしていた。ほかの人々の顔には、悔しさ、残念さ……そして、軽蔑が浮かんでいた。\n\n「うわ、あいつズルじゃん！」\n\n「いや、そんな遊び方ありなのかよ？」\n\n台下には、驚き、羨望、悔しさ、不服が入り混じった声が一斉に広がった。\n\n「嘘だろ、本当に上がれたの？」\n\n「これもあり？」\n\n「早く知ってたら俺も突っ込んだのに」\n\n「突っ込んでみろよ。教官に地面へ押さえつけられるぞ」\n\n朱銘は僕の横に立ち、同じように呆然としていた。ただ、彼の注目点は少し妙だった。\n\n「こんなに体力あるのに、あの数周を少なく走ったのか……谷懿、お前というやつは！」\n\n僕は返事をしなかった。\n\n谷懿が主席台へ上がった瞬間、数日前、至善楼の外で彼が笑いながら僕に言った言葉を思い出したからだ。\n\n「次は僕が本物の演説を見せてやる。その時はよく見て、よく学ぶこと。できればカメラを携帯しておけ」\n\n谷懿はマイクを受け取った。\n\n主席台の上は風が強く、彼の額の前髪を軽く揺らした。\n\n彼はすぐには話さなかった。\n\nまず、台下を見た。\n\nその一瞥は、同じ迷彩服を着た無数の新入生を通り過ぎ、隊列の横に立つ教官たちを通り過ぎ、主席台側の毛鋭を通り過ぎ、どうやら一瞬、僕の視線とも交差したようだった。\n\nそして、彼の顔に明るい笑みが咲いた。\n\n僕はふと後悔した。\n\n本当にカメラを携帯していなかったことを。\n\n「みなさん、こんにちは」\n\n谷懿が口を開いた。\n\n音響は彼の声を田径場の隅々まで運んだ。\n\n「21級哲学班の谷懿です」\n\nとても普通の冒頭だった。\n\n普通すぎて、ここだけ聞けば、誰もが彼はこれから「軍訓を通じて規律意識と集団栄誉感を得ました」と言うのだろうと思ったはずだ。\n\nだが、僕はそうはならないと知っていた。\n\nなぜそう思ったのかは、うまく言えない。\n\nたぶん、僕が谷懿を知っていたからだ。\n\nあるいは、今主席台に立つ彼の姿が、標準答案を言う準備をしている人間にはまったく見えなかったからだ。\n\n田径場は静かになった。\n\n谷懿はマイクを握り、一秒止まった。\n\n「僕から見ると、軍訓の意義は」\n\n「意義がない、ということです」"}]}}  </script>
