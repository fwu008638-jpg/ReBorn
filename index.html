充分的行动自由。\n\n它们可以随意越过床铺边界，低空侦察，精准打击，然后在我抬手之前潇洒撤退。\n\n如果有一天蚊子也参加军训，我相信它们一定会因为机动性过强被张迪重点关照。\n\n我抬手挥了一下。\n\n什么都没打到。\n\n黑暗重新安静下来。\n\n可那种嗡嗡声还在。\n\n像某种很小、很执着的回音。\n\n谷懿的声音也在。\n\n张迪的口令也在。\n\n辅导员群里的通知也在。\n\n李向阳那句“他这种人最方便”也在。\n\n我翻了个身，膝盖和小腿传来酸痛。\n\n那痛感提醒我，今晚不是幻觉。\n\n一切都发生过。\n\n谷懿站上主席台，陈小云试图替他说话，袁林修落在路边，朱铭背他回来，李向阳把风险一条条摆出来，而我从头到尾，都只是在这些事情之间迟缓地移动。\n\n我没有站上主席台。\n\n没有反驳张迪。\n\n没有替陈小云说完那句话。\n\n也没有在李向阳说出那些刺耳的话时给出一个漂亮答案。\n\n我只是查了校医院电话。\n\n帮袁林修拿了水杯。\n\n在群消息被撤回后，对着黑掉的屏幕发了一会儿呆。\n\n这些事情太小了。\n\n小到如果写进英雄故事里，大概会被编辑建议删掉，理由是“不推动主线”。\n\n可我又隐约觉得，也许正是这些小到不像剧情的东西，把今晚真正留了下来。\n\n谷懿把问题抛向了整个田径场。\n\n而夜晚把问题一点点还给了每一个具体的人。\n\n还给陈小云没有说完的话。\n\n还给袁林修疼痛的脚踝。\n\n还给朱铭弯下去的背。\n\n还给李向阳冷静到近乎残酷的判断。\n\n也还给我这具疲惫、犹豫、害怕，却再也没办法假装什么都没听见的身体。\n\n窗外没有月亮。\n\n也许云梦的中秋月被云藏起来了。\n\n又或者它只是悬在我们看不见的地方，照着田径场，照着主席台，照着那条回宿舍的路，照着一条被撤回的视频消息，也照着某个不知道现在被带到哪里的谷懿。\n\n我在黑暗里睁着眼，心里或许还期待着摩西的出现，期待他将我带出这片只能作为奴隶生存的埃及，将我带去自由的应许之地。\n\n但只有蚊虫予我回音。"},{"title":"第九章：恋如雨止","file":"9、第九章.md","volumeTitle":"第一卷：故事的开篇就是要平庸得过头","text":"彻夜未眠不能作为拒绝第二天军训的理由。\n\n至少在云梦师大的新生管理制度里，不能。\n\n如果能凭借“昨晚被蚊子和人生意义联手攻击，所以今天无法参加训练”这样的理由成功请假，那我愿意承认，云梦师范大学在人文关怀方面已经走在了全国高校，甚至世界高校前列。\n\n很遗憾，那只是幻想时间。\n\n早上六点二十，手机闹钟响起。\n\n那段旋律从枕边钻出来时，宿舍里还很暗。窗帘缝隙外的天色不是黑，也不是亮，而是一种像被水泡过的灰。\n\n我睁着眼，看见床帘内侧垂下来的一小段线头。\n\n它在空调风里晃。\n\n一下。\n\n又一下。\n\n我盯着它看了几秒，直到隔壁床传来李向阳下床的动静，才慢吞吞地把手机按掉。\n\nA109少了两个人。\n\n这种“少”不是通过清点人数得出的结论，而是从声音里漏出来的。平时这个时候，朱铭大概会先把床板弄出一声巨响，再用某种半死不活的语气宣布自己与清晨势不两立；袁林修则通常没有什么声音，只会在大家都快洗漱完时，忽然已经穿好衣服站在梯子旁。\n\n今天没有。\n\n宿舍里只剩空调压低后的嗡声，李向阳开柜门的轻响，还有我踩下梯子时拖鞋碰到地面的钝响。\n\n手机屏幕亮了一下。\n\nA109小群里，朱铭半小时前发过一条消息。\n\n【朱铭：我陪袁林修去校医院，早训请假。】\n\n下面是李向阳发的几条东西。\n\n【李向阳：到校医院后先挂普通外科或急诊，医生怎么写就怎么请假。】\n\n【李向阳：别在请假消息里主动写昨晚补训，先写脚踝疼痛，需就医。】\n\n我看完之后，把手机塞进口袋。\n\n那些字没有在脑子里连成完整的句子，只剩下几个词浮在那儿。\n\n校医院。\n\n请假。\n\n脚踝。\n\n昨晚。\n\n集合。\n\n每个词都像被雨泡过的纸片，边缘发软，怎么也拼不到一起。\n\n卫生间里的灯被打开。\n\n白色光从门缝里漏出来，照在地面上，像一条被拉直的线。\n\n我站在那条线外等了一会儿，直到李向阳洗漱完出来。他看了我一眼，似乎想说什么，最后只说：\n\n“别迟到了。”\n\n我点了点头。\n\n这句话很熟悉。\n\n军训开始后，每天早晨都有人用不同语气说类似的话。朱铭会说“快点快点，迟到就寄”；李向阳会说“还有十二分钟”；谷懿会说“迟到也是主体性的一种实践”，然后本人通常并不会真的迟到。\n\n今天这句话落进耳朵里，却像从很远的地方传来。\n\n洗漱台的镜子蒙着一层薄薄的水汽。\n\n镜子里的人脸色发白，眼镜还没戴，五官被雾气糊成一团。我看了一眼，就低下头接水。\n\n水从龙头里冲出来，声音比平时大。\n\n刷牙、洗脸、换衣服、系鞋带。\n\n这些动作依次发生。\n\n它们像排好队从我身边经过，而我只负责让身体跟上。\n\n走出宿舍楼时，楼道里已经有不少新生。拖鞋、军训鞋、塑料水杯、钥匙串、压低的抱怨声混在一起，挤成一条往外流的人流。\n\n我也在里面。\n\n路面还残留着昨夜的热。\n\n热气从地砖缝隙里浮上来，把树、楼、路灯杆和远处操场的围网都晕成一块一块的色团。人群往前走，绿色军训服在灰白天色里缓慢移动，像一幅还没有干透的油画。\n\n我听见有人说话。\n\n听见笑声。\n\n听见水杯碰到书包侧袋的声音。\n\n可那些声音没有一个真正停在耳朵里。\n\n它们只是经过。\n\n我跟着人群走到田径场附近，才发现前面好像没有像往常那样迅速排成队列。\n\n很多人停在入口处。\n\n有人仰头看天。\n\n有人举着手机。\n\n有人从队伍里往外跑。\n\n这些画面一开始没有意义。\n\n它们像被谁剪碎后随手撒在我面前。\n\n直到一滴水落在镜片上。\n\n视野中央多出一个圆形的透明斑点。\n\n那个斑点把远处的人影折成两半。\n\n我眨了一下眼。\n\n第二滴落下来。\n\n第三滴。\n\n然后是更多。\n\n雨声先是从树叶和帽檐上响起，随后迅速铺满整个田径场入口。地面颜色在几秒钟内变深，尘土味被水压下去，塑胶跑道返上来的热气被雨砸散，空气里忽然多了一股泥土、草叶和湿布料混在一起的气味。\n\n世界被雨打花了。\n\n刚才那些像油画一样黏在一起的色块，开始沿着镜片往下流。\n\n“下雨了！”\n\n“总教说今天上午不训了！”\n\n“真的假的？”\n\n“真的，先回去等通知！”\n\n人群一下子活了过来。\n\n那种活不是平时集合前的吵闹，而更像某种被困住很久的东西突然找到了出口。有人欢呼，有人笑，有人立刻撑开伞，有人直接顶着军帽往回跑。\n\n一把把伞在雨里打开。\n\n黑色的、蓝色的、透明的、印着卡通图案的。\n\n它们从人群里一朵朵冒出来，像这个早晨临时生长出的花。\n\n我站在原地。\n\n雨水顺着帽檐滴到镜片上，又从镜片边缘滑下去。军训服很快吸了水，肩膀变得沉，裤脚贴住小腿。军训鞋踩在湿地上，鞋底发出轻微的黏响。\n\n这场雨来得太突然。\n\n突然到我连高兴都慢了半拍。\n\n等我终于想起自己应该往回走时，身边已经少了很多人。\n\n朱铭不在。\n\n谷懿也不在。\n\n如果是平时，朱铭一定会第一个宣布这是天降正义，并要求全体人员对降水云团致以最高敬意。\n\n谷懿则大概会说，这是自然界对规训秩序的短暂破坏，是大气环流对现代大学治理术的否定。\n\n当然，他也可能只是说一句“爽”，然后跑得比谁都快。\n\n可现在，雨里没有这些声音。\n\n我突然想起贴吧里那个很有名的梗：于暴雨中行走，伞是倒划天空的船。\n\n可惜我没有船。\n\n只有一身吸水效果相当优秀的军训服，以及一双即将变成小型水库的军训鞋。\n\n我跟着往宿舍方向走。\n\n雨比刚才更大。\n\n水点砸在帽檐上，声音密得像有人把一袋玻璃珠倒在铁皮屋顶。眼前的人影隔着一层流动的水，边缘不断散开又合拢。路面积起浅浅的水，树影和楼影在里面碎成许多块，脚踩过去，碎片又重新乱掉。\n\n刚走出田径场没多远，头顶的声音忽然变了。\n\n雨不再直接砸在帽檐和肩膀上。\n\n它落到某个更高、更薄的地方，发出连续而柔和的噼啪声。\n\n我抬起头。\n\n天空不见了。\n\n一把米黄色的伞挡在上方。\n\n伞骨撑开的弧线不大，伞面边缘垂着细小水珠。水珠顺着布料往下滑，在伞沿汇聚，又一颗颗落到地上。\n\n霍钰站在我旁边。\n\n她今天穿了一件浅色短袖，外面套着很薄的防晒衫，袖口被雨水沾湿了一点。头发在耳后松松地别着，几缕被潮气带出来，贴在脸颊旁。\n\n她看着前面的雨幕，说：\n\n“雨好大。”\n\n这句话普通得不能再普通。\n\n普通到像是任何两个被困在同一场雨里的人都会说的话。\n\n我却慢了半拍才反应过来。\n\n“霍学姐。”\n\n声音一出口，我才发现自己嗓子有点哑。\n\n她转头看我，眼睛里带着一点笑意。\n\n“还记得我啊。”\n\n“当然记得。”\n\n我说完后，才意识到这个回答听起来有点过于认真。\n\n霍钰没有追问，只从口袋里拿出一包纸巾，抽出一张递过来。\n\n“擦一下吧。”\n\n我接过纸巾。\n\n手指碰到她指尖的一瞬间，很快又分开。\n\n她的手有些凉。\n\n也许是雨的缘故。\n\n我摘下眼镜，眼前立刻只剩一团模糊的水色。树、路、人、伞，全都退成没有边界的影子。\n\n等我擦好镜片，重新戴上，世界才勉强拼回原来的样子。\n\n“谢谢学姐。”\n\n“不客气。”\n\n她把伞稍微往我这边移了一点。\n\n我下意识往旁边挪。\n\n“不用，我这边淋一点没事。”\n\n霍钰看了看我肩膀上已经深了一大片的军训服。\n\n“已经不只是一点了。”\n\n我本来想说点什么缓和尴尬，比如“反正军训服也不差这一点水”，但话到了嘴边又觉得这个笑话对一件已经彻底湿透的衣服来说过于残忍，只好咽了回去。\n\n伞不大。\n\n两个人一起撑时，必须保持一个微妙的距离。离得太远，会有人被雨淋；离得太近，又会让人不知道该把手放在哪里。\n\n我选择把手放在裤缝旁。\n\n这是军训带给我的少数肌肉记忆之一。\n\n雨声在伞外连成一片，远处的喊声和脚步声都被隔开。伞下面的空间很小，连呼吸声都比平时清楚。\n\n“云梦的夏天经常这样。”\n\n霍钰说。\n\n“前一会儿还热得像整座城都要被晒化，下一会儿就能变成这样。”\n\n“我还没习惯。”\n\n“刚来的人都不习惯。”\n\n她的语气很自然。\n\n像是在说天气。\n\n也确实是在说天气。\n\n“不过云梦的雨来得急，停得也快。”霍钰看着前方，“有时候觉得它能把一切都冲刷带走，结果意犹未尽时，它就自顾自地停了。”\n\n“听起来很任性。”\n\n“是啊。”\n\n她笑了一下。\n\n“但也不是完全讨厌。”\n\n我们经过一棵香樟树，雨打在树冠上，声音忽然变厚。几片叶子被水压得低下来，擦过伞面，发出沙沙声。\n\n“高中时我也遇到过一次这样的雨。”\n\n霍钰忽然说。\n\n“高中？”\n\n“嗯。”\n\n她像是随口提起。\n\n“夏天，雨也是突然下起来的。那时候我刚从一位老师那里拿完资料，出来时雨已经把路拦住了。”\n\n我看向她。\n\n“我在路边的候车棚下面站了很久，雨大得好像永远也不会停下……“\n\n”那后来呢？“\n\n”后来有个人撑着一把伞走了过来。”\n\n她看着伞外的雨，眼神像是短暂地落到了很远的地方。\n\n“一个很奇怪的人。”\n\n“奇怪？”\n\n“嗯。”\n\n她收回视线，语气又变得像刚才那样轻松。\n\n“明明只是第一次见面，却把伞借给了我。”\n\n“看起来是个好人？”\n\n“我问他是不是在玩什么动漫男主扮演游戏。”\n\n“学姐还真是不客气啊…然后呢？”\n\n霍钰的眼睛弯了一下。\n\n“然后他就把伞塞到了我手里。”\n\n“这么强硬？”\n\n“也不算强硬。”\n\n霍钰想了想。\n\n“他说，反正自己就算淋点雨也没有关系。”\n\n我沉默了一下。\n\n这句话确实有点像青春期的男生能说出来的蠢话。\n\n尤其是那种明明没什么把握，却非要把善意包装成某种体育特长的高中男生。\n\n“然后学姐就收下了？”\n\n“嗯。”\n\n“就这么收下了？”\n\n“不然呢？”\n\n霍钰反问得很自然。\n\n“那时手里的资料要是被淋湿了就麻烦了呢。”\n\n她说到这里，停了一下。\n\n霍钰用指尖碰了碰伞柄边缘被磨白的地方。\n\n“而且他说，他家离得不远。”\n\n“真的不远？”\n\n“谁知道呢。”\n\n她说到这里，停了一下。\n\n“后来这把伞就一直在我这里。”\n\n她抬了抬手里的伞柄。\n\n“就是这把？”\n\n“嗯。”\n\n“用了很久？”\n\n“有几年了。”\n\n她没有再解释。\n\n那把米黄色的旧伞，看起来不像新买的东西，伞柄边缘被磨得发白，伞骨撑起的弧度也不是完全对称。\n\n可霍钰拿着它时，它又显得很合适，像某种被她认真保留下来的生活习惯。\n\n“你在想什么？”\n\n她问。\n\n“在想这把伞很有故事和意义。”\n\n“是吗？”\n\n“是的。”\n\n“不过意义这种东西，说到底不过都是由特定的人来赋予的。”\n\n她说。\n\n这句话说完后，我们都安静了一会儿。\n\n雨还在下。\n\n路边排水口吞不下那么多水，低低地响着。几片被打落的树叶贴着路缘打转，转了半圈，又被水流推回原处。\n\n“昨天的事。”\n\n我终于开口。\n\n说出这四个字时，我才发现它们在嘴里放了很久。\n\n霍钰没有立刻接话。\n\n她只是把伞稍微压低了一点，避开迎面吹来的雨。\n\n“学姐听说了吗？”\n\n“听说了一些。”\n\n她说。\n\n“我给谷懿发了消息。”\n\n“他没回。”\n\n霍钰看了我一眼。\n\n“嗯。”\n\n她好像并不意外。\n\n我低头看着地面。\n\n水从鞋边漫过去，军训鞋的布料已经完全湿透。每走一步，鞋里都会挤出一点细小的水声。\n\n“我现在其实有点想不动了。”\n\n这句话说出口后，我自己都觉得有些没头没尾。\n\n“那就先别急着想。”\n\n我看向她。\n\n她没有看我，依旧看着前方被雨水冲得发亮的路。\n\n“很多事情不是一个晚上就能想明白的。”\n\n她的声音不高。\n\n没有那种试图安慰人的用意，像在陈述一个再平常不过的道理。\n\n“可是又不能真的不想。”\n\n我说。\n\n“谷懿说的话，我没办法当作没听见。”\n\n“嗯。”\n\n“可他被带走以后，剩下的事又不是只落在他一个人身上。”\n\n“嗯。”\n\n“有人受了罚，有人受了伤，也有人开始怪他。”\n\n说到这里，我停了一下。\n\n雨声正好把前方人群的声音压过去。\n\n“但我也没办法说，怪他的人就完全错了。”\n\n霍钰仍然没有急着说话。\n\n她把伞柄换到另一只手里，指节在伞柄边缘停了一下。\n\n她没有替我把后面的话接上。\n\n“我觉得那个教官才是错的。”\n\n我说。\n\n“昨晚的训练本来就不该那样。视频被撤回也很奇怪。群里的通知……也很奇怪。”\n\n“可是如果只说这些，好像又少了什么。”\n\n我抓着纸巾，指尖被雨水和汗水弄得有些发皱。\n\n“谷懿不是为了自己。至少我觉得他不是。”\n\n“但结果就是很多人因为他那场发言受了罚。甚至有人因此受伤了。”\n\n“所以我不知道该怎么说。”\n\n我说得断断续续。\n\n不像表达观点。\n\n更像把一堆湿透的东西从口袋里掏出来，放在地上，却发现它们怎么摆都不整齐。\n\n霍钰终于问：\n\n“你讨厌他吗？”\n\n我愣了一下。\n\n我以为对方会问“你觉得他对吗”。\n\n或者“你觉得他错吗”。\n\n可她问的是讨厌不讨厌。\n\n我听见自己呼吸乱了一下。\n\n“不讨厌。”\n\n我说。\n\n这次回答得很快。\n\n快到我自己都有些意外。\n\n“我不讨厌他。”\n\n我又重复了一遍。\n\n“我只是有点害怕。”\n\n霍钰没有接话。\n\n我继续说：\n\n“害怕他真的做错了。”\n\n这句话说完后，我喉咙像被雨水灌进去一样，有点发紧。\n\n我本来以为自己昨晚已经把这些东西想完了。\n\n可直到说出口，我才发现它们还一直堵在身体里。\n\n霍钰握着伞柄的手指微微收了一下。\n\n动作很小。\n\n如果不是伞下空间太窄，我大概不会注意到。\n\n“我也会害怕。”\n\n我看向她。\n\n伞下的声音忽然空了一拍。\n\n“学姐也会？”\n\n“当然会。”\n\n她笑了笑。\n\n“我又不是无敌的。”\n\n这句话像是随口丢进雨声里的。\n\n可她没有继续解释自己害怕什么。\n\n她的话也停在那里。\n\n再往后，就只剩雨声、沉默，或者下一次见面。\n\n“那谷懿会有事吗？”\n\n我还是问了出来。\n\n霍钰沉默了一会儿。\n\n这次沉默比刚才长。\n\n长到我几乎以为她不会回答。\n\n“至少不会是你现在想的那种最坏结果。”\n\n她说。\n\n“学姐知道他在哪吗？”\n\n霍钰看着雨幕。\n\n“大概知道一点。”\n\n我等着她继续说。\n\n但她没有继续。\n\n又走出几步后，她才补了一句：\n\n“他这几天应该不会参加军训了。”\n\n“是处分吗？”\n\n“现在还不好说。”\n\n她说完这句后，伞下重新安静下来。\n\n我没有再追问。\n\n不是因为不想知道。\n\n而是霍钰刚才的停顿已经说明，她能说的大概只有这么多。\n\n她知道一些事情。\n\n但她不把它们全说出来。\n\n这让我有点在意。\n\n可那种在意被雨声压着，没有立刻变成疑问。\n\n“学姐。”\n\n“嗯？”\n\n“你不会觉得我刚才说得很乱吗？”\n\n霍钰想了想。\n\n“有点。”\n\n“……”\n\n诚实来得太快，我差点被这两个字绊倒。\n\n她眼睛弯起来。\n\n“不过我不讨厌。”\n\n我一时间不知道她说的是不讨厌这段话，还是不讨厌我这个人，或者不讨厌我当下这种混乱得毫无逻辑的状态。\n\n正常情况下，我应该问清楚。\n\n但问题在于，正常情况下我也不应该和霍学姐共撑一把伞走在暴雨里。\n\n所以我选择闭嘴。\n\n把问题交给留白和沉默。\n\n雨势渐渐小了。\n\n原本砸在伞面上的密集声音变成了断断续续的滴答。路边树叶被洗得发亮，绿得有些过分，像刚从某种灰尘很重的梦里醒来。\n\n宿舍楼出现在前方。\n\n立华书院的门厅里挤着不少刚从雨里跑回来的人，有人甩伞，有人拧衣服，有人对着湿透的军训鞋发出绝望哀叹。\n\n我们在楼下停住。\n\n雨还没有完全停。\n\n屋檐边缘往下落着一串水珠，地面积水把门厅的灯光映成晃动的长条。\n\n“到了。”\n\n霍钰说。\n\n我这才发现，从田径场到宿舍楼这段路，好像比平时短了很多。\n\n“谢谢学姐。”\n\n我把伞柄往她那边递。\n\n霍钰没有接。\n\n“你拿着吧。”\n\n“啊？”\n\n“你刚来云梦，应该还没来得及买伞。”\n\n“可是这把伞……”\n\n我看了一眼伞柄上磨白的边缘。\n\n“不是用了很多年吗？”\n\n霍钰也低头看了看那把伞。\n\n“是啊。”\n\n她说。\n\n“所以比较经用。”\n\n“我不是这个意思。”\n\n这句话说出口后，我自己都觉得有点多余。\n\n霍钰看着我，像是在等我把后面的话说完。\n\n雨还没有停，屋檐外的地面一片发亮，门厅里有人拖着湿鞋走过，发出黏在地砖上的声音。\n\n我握着伞柄，一时间不知道是该继续推回去，还是该先把手松开。\n\n“学姐，这把伞对你来说，应该挺重要的吧。”\n\n她的唇明显动了一下。\n\n但又把手从伞柄上松开了。\n\n那把米黄色旧伞一下子完全落到我手里。\n\n我下意识握紧。\n\n“重要的东西，也可以先借出去。”\n\n她说。\n\n“那学姐怎么办？”\n\n霍钰没有回答。\n\n她只是把防晒衫的帽子往头上一扣，朝我挥了挥手，转身走进屋檐外那片还没有停尽的雨里。\n\n“霍学姐。”\n\n我叫了她一声。\n\n她回头。\n\n雨水落在她身后的地面上，溅起一层细碎的白。\n\n“我什么时候还你？”\n\n霍钰只是看着我。\n\n她像是听见了，又像是没听见。\n\n最后，她笑了一下。\n\n然后转身离开。\n\n我站在宿舍楼下，手里握着那把伞。\n\n伞柄边缘已经被磨得发白，握上去有些旧旧的滑。伞面内侧有一小块褪色的贴纸，原本应该是什么图案，现在只剩浅浅的轮廓。伞骨有一处微微弯着，收伞时大概不会那么顺手。\n\n它被人用了很多年。\n\n旧得像把经历过的每一场雨都收在了伞骨里。\n\n可我完全不了解那些雨的故事。\n\n我还有很多想问的地方。\n\n可雨从屋檐外斜进来，落在鞋尖前面。\n\n我把伞往怀里收了收，才想起自己还站在门口。\n\n手机在口袋里震了一下。\n\n我拿出来。\n\n不是谷懿。\n\n是朱铭在A109小群里发的消息。\n\n【朱铭：拍完了片，问题不大。】\n\n下面隔了几秒，又补了一句。\n\n【朱铭：雨啥时候才能停啊，我俩被困医院了。】\n\n我看着那两条消息，手指停在屏幕上方。\n\n谷懿的聊天框仍然没有新的回复。\n\n【我：等我一下，我回宿舍拿伞，去医院接你们。】\n\n消息发出去后，朱铭几乎是秒回。\n\n【朱铭：义父。】\n\n【朱铭：门后那把蓝色的是我的。】\n\n我把手机收起来，撑着那把旧伞走进宿舍楼。\n\n门厅里很吵。\n\n有人讨论今天下午还训不训，有人抱怨鞋湿了，有人庆祝终于能补觉。\n\n我经过他们时，伞面上的水沿着边缘往下流，在地砖上留下一串小小的水迹。\n\n它们很快被更多人的脚步踩乱。\n\n朱铭说的那把蓝色折叠伞就挂在宿舍门后，伞套皱巴巴地团在一起。\n\n可等我拿上伞，几分钟后再次走出宿舍楼时，天气却截然不同了。\n\n刚才还连成一片的雨幕像被谁从中间撕开，路面上只剩零星的水点，远处树叶上的水顺着叶尖往下滴。\n\n我愣在屋檐下，左手拿着朱铭那把蓝色的伞，右手握着学姐那把米黄色的伞。\n\n手机又亮了一下。\n\n【朱铭：？】\n\n我看着那个问号，忽然有些想笑。\n\n再抬头时，乌云的缝隙间已经洒落阳光。"},{"title":"第十章：为你证明（上）","file":"10、第十章.md","volumeTitle":"第一卷：故事的开篇就是要平庸得过头","text":"雨停之后，云梦的夏天并没有因此变得温柔。\n\n它只是短暂地收起了刀，把刀背贴在人的脖子上，让人误以为自己终于可以喘一口气。\n\n可等到第二天太阳重新升起来，操场上的塑胶跑道很快又被晒出一层发闷的橡胶味，军训服重新贴在后背上，鞋底重新硌住脚掌，哨声重新从远处划过来。\n\n世界恢复原状的速度，快得像从来没有下过那场雨。\n\n当然，也不是所有东西都能恢复原状。\n\n比如我桌边多了一把米黄色的伞。伞骨收起来时有一处不太服帖，靠在墙边，像一小截被雨水留下来的夏天。\n\n谷懿依旧没有回消息。\n\n我和朱铭起初只是在微信上问。先是“你人呢”，后来变成“还活着回个‘1’”。绿色气泡停在屏幕上，像几只被挂在墙上的空杯子，里面什么回音也没有。\n\n到后来，朱铭终于受不了，拉着我去哲学班男寝问了一趟。\n\n给我们开门的是个戴黑框眼镜的男生，头发睡得乱七八糟。\n\n“他不是已经走了吗？”\n\n“走了？”朱铭问。\n\n男生回头看了一眼寝室里面。\n\n“我们回来那天，他桌上就已经清空了，箱子也不见了。”他说，“我还以为你们知道。”\n\n寝室里有人从床帘后面探出头，补了一句：\n\n“可能是被退学了吧。”\n\n对此，朱铭发表了一个相当乐观的判断。\n\n“他应该没事。”\n\n“依据呢？”我问。\n\n“真要退学，总不能只有一个舍友的口头通知吧。”\n\n这句话听起来很有道理，前提是世界本身也讲道理。\n\n而这几天里，世界显然没有表现出太高的逻辑素养。\n\n袁林修的腿没有完全好。\n\n那天朱铭把他从校医院带回来时，他手里拿着一张薄薄的诊断单。单子上的字并不多，打印得很整齐，最关键的一行写着：建议减少剧烈运动，必要时复诊。\n\n这句话单独看，像是一句非常体贴的医学建议。\n\n可一旦把它放进军训场，就立刻变成了某种语言陷阱。\n\n减少到什么程度算减少？\n\n剧烈运动由谁判断？\n\n必要时是谁觉得必要？\n\n如果这个世界是一道阅读理解题，那么出题人显然不打算给标准答案。\n\n袁林修一开始没有拿那张单子去找张迪。\n\n这倒不是因为他真的觉得自己还能撑。只是有些人说“没事”说得太久，就会忘记“有事”应该怎么开口。他走路比平时慢一点，上楼时会不太明显地扶一下栏杆，训练前把鞋带系得比别人久，转身时脚下总会滞一下。\n\n这些变化不至于让人立刻围上去问他“你还好吗”。\n\n所以朱铭也没有每天追着问。\n\n他只是下楼时把速度放慢一点，打水时顺手把袁林修的水杯也拿起来，或者在袁林修准备弯腰搬训练用品时抢先一步拎走，嘴上还要装作十分嫌弃：\n\n“你别误会，我只是单纯看不惯你这个搬东西效率。”\n\n袁林修通常只回一个字。\n\n“哦。”\n\n然后接过水杯，说一句很短的“谢了”。\n\n第三天上午，训练内容变成正步和队列转向。\n\n太阳已经从云层后面露出来，地面上的水汽被晒得一点不剩。队伍一次次向左、向右、向后转，鞋底落在跑道上，发出整齐又烦躁的声音。\n\n袁林修第一次慢了半拍时，张迪只是看了他一眼。\n\n第二次，他皱起眉。\n\n第三次，他直接吹响哨子。\n\n“停！”\n\n整个C军阵立刻停在原地。\n\n哨声还在耳边发麻。\n\n张迪走到袁林修面前，靴子踩在跑道上，声音不重，却一下下压住周围的呼吸。\n\n“你是听不懂口令，还是腿不归你管？”\n\n袁林修站直了些。\n\n“报告，腿有点伤。”\n\n他说这句话时声音不大，也没有任何要为自己辩解的意思。仿佛只是把一件很小的事实递出去，希望对方看一眼就算了。\n\n张迪却笑了。\n\n“腿伤？”\n\n他把这两个字重复了一遍，语气像是在重复某种荒唐的借口。\n\n“刚才跑过来的时候怎么不说？站队的时候怎么不说？非要做错了动作才说腿伤？”\n\n队伍里没有人说话。\n\n我站在旁边，能看见袁林修的手指在裤缝边动了一下。他似乎想把手伸进口袋，又停住了。\n\n那张诊断单不在他身上。\n\n后来我才知道，他把单子压在宿舍桌上的书下面。他本来只是想，等真的撑不住了再拿出来。可人在真正撑不住之前，往往还会先撑一会儿。\n\n这大概也是人类最不值得骄傲的自毁技能之一。\n\n“教官，他前几天去过校医院。”\n\n朱铭开口时，声音比平时低。\n\n张迪转头看向他。\n\n“我问你了吗？”\n\n朱铭闭上嘴。\n\n他的肩膀动了一下，像是差点把什么话顶出去。李向阳站在后面，伸手按了一下他的胳膊。\n\n动作很短。\n\n短到张迪没有注意到。\n\n“所有人看清楚。”\n\n张迪转回去，声音提高了一点。\n\n“训练场上最怕的不是动作慢。动作慢可以练。最怕的是态度不端正，找理由，找借口，一出问题就说自己身体不舒服。”\n\n袁林修的脸色有些发白。\n\n不是那种夸张的惨白，而是被太阳晒久了以后，血色慢慢退到皮肤深处的白。\n\n张迪让他出列，单独做了十次转向。\n\n做到第七次时，袁林修脚下明显晃了一下。\n\n朱铭的手攥紧了。\n\n我听见他从牙缝里挤出一句很轻的脏话。\n\n这次李向阳没有纠正措辞。\n\n中午休息时，朱铭几乎是拖着袁林修回了一趟宿舍。\n\n准确来说，不是拖。他没有碰袁林修的胳膊，只是走在旁边，把速度放得很慢。\n\n袁林修从桌上拿出那张诊断单，纸边已经被书角压出一道折痕。\n\n他看着那张纸，看了两秒，最后把它对折，放进口袋里。\n\n李向阳说：“最好拍照留一份。”\n\n袁林修抬头看他。\n\n李向阳解释：“纸容易丢。后面请假、复诊、找辅导员，都可能用得上。”\n\n可下午把诊断单交给张迪时，他拿着那张纸，一字一顿地读了一遍“建议减少剧烈运动”。\n\n“看清楚，建议减少，不是不用训练。”\n\n他的声音依旧充满威严。\n\n“以后动作可以慢一点，但别让我再看见你拿这个当借口。”\n\n这句话落下时，队伍里有人低下头。\n\n我不知道他们是在看自己的鞋尖，还是在替袁林修不平。\n\n而袁林修只是把那张纸重新折好，塞进口袋。\n\n折痕更深了。\n\n……\n\n傍晚，训练终于暂时放人吃饭。\n\n说是吃饭，其实距离晚训集合也没剩太久。可对于被太阳晒了一整天的人来说，能坐在食堂里吹到空调，已经足够让人产生某种不切实际的富裕感。\n\n朱铭甚至在食堂门口发表了简短感言。\n\n“快点整口饭吧。”朱铭盯着窗口，“再晚五分钟，我就要对着食堂阿姨喊妈了。”\n\n“这个亲缘关系是不是有点混乱？”我问。\n\n“饿急眼了。”朱铭说，“谁给饭谁是亲人。”\n\n他说完，端着餐盘直奔窗口，动作迅速得像是刚从前线撤下来的后勤兵。\n\n袁林修没有跟我们抢窗口。\n\n他在靠近过道的位置坐下，把腿往桌子里面收了收。朱铭回来时顺手把一瓶冰水放到他面前。\n\n“多拿了一瓶。”\n\n“我没说要。”\n\n“贩卖机卡了。”朱铭面不改色，“它非要吐给我。”\n\n袁林修看了他一眼，最后拧开瓶盖。\n\n李向阳坐下后，先看了一眼手机。\n\n“今晚可能查寝。”\n\n这句话比食堂空调还有效。\n\n朱铭嘴里的饭停住。\n\n“可能？”\n\n“尹学长说男寝今晚会抽查内务。”李向阳说，“具体查哪几间不一定。”\n\n“你怎么知道？”\n\n“问的。”\n\n李向阳回答得很自然，像是在说自己刚问了食堂阿姨今天汤里有没有放盐。\n\n“你连这个都问？”\n\n“提前知道信息可以减少很多麻烦。”李向阳说，“尤其是这种不提前准备就一定会出问题的检查。”\n\n听起来不像小聪明，而像一种值得学习的生活智慧。\n\n我刚把筷子伸向土豆丝，手机屏幕亮了一下。\n\n发信人是霍钰。\n\n【霍学姐：吃上饭了吗？】\n\n这几天我们偶尔会聊天。\n\n不过，把聊天记录往上翻，常常是一两句就断开。\n\n偶尔她也会发来一些很短的提醒。\n\n比如哪栋楼楼梯有点绕。\n\n比如食堂二楼人会少一点。\n\n这些话落在屏幕上，都像只说了一半。剩下的一半不在手机里。\n\n【我：吃上了。】\n\n朱铭凑过来。\n\n“跟谁聊呢？表情这么不像军训受害者。”\n\n我立刻把手机往自己这边挪了一点。\n\n“朋友。”\n\n说完我自己先顿了一下。\n\n朋友？\n\n好像也还远远算不上。我们不过是借过一把伞，又在雨里一起走过一段路而已。\n\n可那句话怎么说来着。\n\n今生若是同淋雪，此生也算共白头。\n\n我赶紧把这个想法掐掉。\n\n“哦。”朱铭拖长声音，“朋友啊。”\n\n这个“哦”字的含义丰富得足以申请非物质文化遗产。\n\n我懒得理他。\n\n手机又震了一下。\n\n【霍学姐：对了，今晚男寝可能查内务。】\n\n【霍学姐：晚训回去以后，卫生记得收拾一下。】\n\n看来李向阳没有白问。\n\n我下意识想起了自己的书架。\n\n那几本物理教材，几本历史、哲学和马克思主义相关的旧书。\n\n尹渊当初在报到点看我的眼神又浮现在我脑海中。\n\n【我：收到。】\n\n【我：不过为什么刚开学就查寝？】\n\n【霍学姐：因为有些传统很难解释。】\n\n这句话停在聊天框里。\n\n食堂里的声音很吵，窗口那边有人喊号，隔壁桌的椅子被拖出一道刺耳的响。\n\n吃完饭以后，我们又回到操场。\n\n晚训没有因为白天发生过那些事而变得轻松。灯光照在塑胶跑道上，人的影子被拉得很短，哨声从夜色里切过来，白天晒出来的热气还贴在地面上，不肯散干净。\n\n等队伍终于解散时，时间已经接近九点。\n\n回到A109时，寝室里的气氛已经进入战备状态。\n\n李向阳把手机放在桌上，打开备忘录，逐条念要求：\n\n“桌面整洁，床铺整齐，地面无明显垃圾，垃圾桶不得存放垃圾，阳台不得堆放杂物，插线板不能乱接。”\n\n“等一下。”朱铭举手。\n\n“说。”\n\n“垃圾桶不得存放垃圾，是不是相当于饭碗不得存放米饭？”\n\n李向阳看了他一眼。\n\n“你可以在检查的人走后再把垃圾放回去。”\n\n“那垃圾桶岂不是也要学会忍辱负重。”\n\n“你如果愿意，也可以写一篇《论垃圾桶异化》。”\n\n朱铭愣了一下。\n\n“李哥，你现在都会接这种话了？”\n\n李向阳没有接第二句。\n\n他已经弯腰去整理插线板。\n\n我把书架上的几本书拿下来，一起放进纸箱。\n\n动作做完之后，书架忽然空出一截，只留几道颜色略浅的灰尘印。\n\n朱铭看见我的纸箱，有些惊讶。\n\n“你这也要收？”\n\n“桌面整洁。”我说。\n\n“你那是书架。”\n\n“广义桌面。”\n\n朱铭沉默了一下。\n\n“那我希望今晚是狭义查寝。”\n\n袁林修坐在椅子上，正把自己的桌面清出来。他动作比我们慢一点，但没有让别人帮忙。朱铭经过他身边时，顺手把地上的抹布踢过去。\n\n“你坐着擦桌腿吧，别下蹲了。”\n\n袁林修看着那块抹布。\n\n“桌腿也查？”\n\n“不查。”\n\n“那为什么擦？”\n\n“看它不顺眼。”\n\n袁林修低头擦了一下桌腿。\n\n“那它挺荣幸。”\n\n这大概是袁林修这几天说过最像玩笑的一句话。\n\n可这种轻松没有持续太久。\n\n一小时后，A109焕然一新。\n\n地面被拖过，床铺被重新叠成不太标准但至少看得出努力过的方块，桌面上只留下电脑、台灯、水杯和少数几件必须存在的物品。垃圾桶被清空后孤零零地站在门边，像一位被剥夺本职工作的退休干部。\n\n朱铭瘫在椅子上。\n\n“我现在觉得，查寝真正的意义不是检查卫生。”\n\n“是什么？”我问。\n\n“是让大学生提前理解，表面工程也是工程。”\n\n李向阳正在把最后一根充电线卷起来。\n\n“至少表面工程能让寝室看起来舒服一点。”\n\n“我承认现在是舒服了。”朱铭说，“但我也承认，我的灵魂被垃圾桶事件伤害了。”\n\n就在这时，门外响起敲门声。\n\n砰砰砰。\n\n不重。\n\n但屋里所有人都安静了一下。\n\n“查寝。”\n\n李向阳站起来开门。\n\n门外站着一个高个子学长，手里拿着评分表。他身后还有一个人。\n\n尹渊。\n\n他穿着简单的白衬衫，袖口挽到小臂，胸前挂着班导证。军训场边，他总是站在树下，和队列隔着一段距离。现在门开着，那段距离似乎没有了。\n\n高个子学长先走进来。\n\n“挺整齐啊。”\n\n他说这话时语气里有点意外。他走到李向阳桌前，用手指在桌面边缘擦了一下，又低头看了看垃圾桶。\n\n“桌面无灰，地面还行，垃圾桶……也没有垃圾。”\n\n朱铭的表情在“我很想说话”和“我知道现在不能说话”之间反复横跳。\n\n高个子学长又看了一圈床铺。\n\n“床也还可以。你们是不是提前知道要查？”\n\n这是一个很难回答的问题。\n\n因为答案显然是：是。\n\n但如果直接承认，似乎又会让这次努力显得有点不够纯粹。仿佛我们不是热爱卫生，而是屈服于评分制度。\n\n虽然事实确实如此。\n\n“不知道啊。”\n\n李向阳回答得很快。\n\n他的语气甚至带着一点恰到好处的疑惑。\n\n“我们只是觉得刚军训完，寝室太乱，顺手收了一下。”\n\n高个子学长看着他，像是想说“你看我信吗”。\n\n尹渊却笑了一下。\n\n“小林，按标准打分吧。”\n\n被称为小林的学长耸耸肩，低头在表格上写了几笔。\n\n尹渊的视线在寝室里慢慢扫过。\n\n他没有急着说话。\n\n这反而更让人不舒服。\n\n他的目光从朱铭那张几乎空掉的桌面，移到袁林修椅背上挂着的军训服，又从李向阳收得整齐的材料夹，最后落到我的书架上。\n\n那里空出一截。\n\n尹渊停了半秒。\n\n“准备得挺充分。”\n\n他说。\n\n这句话听起来像表扬。\n\n也只是听起来像。\n\n我不知道他到底看出了什么。也许只是随口一说，也许他根本不在意书，只是喜欢让人觉得自己被看穿。\n\n“内务只是最基础的东西。”尹渊收回视线，语气很自然，“能把寝室收拾干净，说明大家至少有基本的执行力。”\n\n小林在旁边低头打分。\n\n尹渊继续说：\n\n“不过立华书院看重的，当然不只是执行力。”\n\n这句话一出来，李向阳停下了收拾杯子的动作。\n\n袁林修也抬了一下眼。\n\n尹渊像是终于找到合适的开场，站在屋子中央，微微侧身，让自己面对我们所有人。\n\n“你们能够进入立华书院，说明已经在高考里证明过一次自己。但过去的证明，只代表过去。”\n\n这句话我听过。\n\n在军训动员会上，他就说过类似的话。\n\n可在讲堂里听见，和在宿舍里听见，是两种完全不同的感觉。前者像广播，后者像一张被递到面前的账单。\n\n“书院每年都会有考核。”尹渊说，“资源更多，要求自然也更高。如果不能适应这里的学习节奏，就会被调整到普通专业班。”\n\n朱铭下意识坐直了一点。\n\n“调整？”\n\n“也可以理解为淘汰。”\n\n尹渊说得很平静。\n\n平静到仿佛“淘汰”不是一个会落到具体学生身上的词，只是表格里某个可以被筛选的字段。\n\n“我可以告诉你们往届的情况。”\n\n“你们上一届20级每年末位淘汰比例是百分之二十，参考的是全学年专业课成绩。”\n\n“我们19级淘汰比例也是百分之二十，另外还有一条规定：任何一门专业课挂科都会被直接淘汰。”\n\n尹渊淡淡地说着，所说似乎不过是与他无关的一件事。\n\n实际上也确实无关，即便淘汰比例扩大到对半切，又和成绩常年数一数二的尹渊有什么关系呢？\n\n寝室里安静下来。\n\n并非所有人都能像他那样不在意。\n\n对于我们来说，大学的学习内容还是全然未知的，而能够进入立华书院成为同学，彼此之间的高考成绩乃至学习能力想来相差都不会多大。在这场从同一起跑线开始的长跑中，谁落在最后都有可能。\n\n更何况如果再加上一条“任一专业课挂科”的红线，那稍有不慎就可能满盘皆输。\n\n而且，所谓的同一起跑线，于我而言是不成立的。\n\n毕竟考入云梦师大立华书院的是另一个姜岚，不是我；至于我？哪怕把所有能想到的加分项都叠在一起，也绝达不到入学的分数线。\n\n本来，能否顺利顶替姜岚读完大学、完成学业，我就很不自信，现在还得知有个淘汰制，那我岂不是注定要被淘汰出去了？\n\n空调还在吹冷风，刚拖过的地面有一点水汽，拖把没完全拧干的味道混在空气里。\n\n“高数和力学，是你们第一个学期最重要的两门课。”尹渊说，“尤其高数，每年都会有人挂科。对普通学生来说，挂科之后补考、重修，当然还有挽回空间。但在书院，容错率会低很多。”\n\n他说这些时，没有刻意吓唬人。\n\n这正是最吓人的地方。\n\n可他现在只是温和地讲述规则。\n\n规则本身就已经足够冷。\n\n“当然。”尹渊忽然笑了笑，“对于真正有基础的同学来说，这些内容也不必过分担心。比如物竞生，高中阶段接触过的训练难度，往往比大一基础课还要高。”\n\n他的目光落到我身上。\n\n我心里轻轻一沉。\n\n“姜学弟，其实我们之间很有缘分，不仅都参加过物理竞赛，参赛地点还同在庐州一中。”\n\n来了。\n\n“渊哥，你和这位学弟是老乡？”\n\n一旁的小林问道。\n\n“我也是前几天才知道姜学弟也是安徽人，至于是安徽哪的，我还没问过。”\n\n尹渊走到我桌前，姿态依然很放松。\n\n“徽州。”\n\n“原来是江南水乡，好地方啊！”\n\n尹渊闻言先是赞叹了一句。\n\n“不过我是皖北的，这个‘老乡’倒是算得有些勉强了。”\n\n安徽并不是一个地理意义上的省份，而更像是一个纯粹的行政区划。\n\n偌大的六边形的省份，被长江、淮河划分为三个部分，也形成了三片生活、文化习惯大相径庭的地区：皖北、皖中、皖南。尹渊所来自的皖北，在淮河以北，生活习惯与河南人更为接近，而我的故乡皖南，则亲近苏杭一带。\n\n因此，对尹渊口中的这个“老乡”，我是一点也不感冒。\n\n“我参加的是第三十五届全国物竞，姜学弟参加的应是第三十七届吧？可惜我实力不济，只取得了省三的成绩，远不及学弟你的省二呀。”\n\n“省二？”\n\n朱铭也看向我。\n\n他的表情不是怀疑，更像是第一次听见某个隐藏设定被系统公告出来的惊讶。\n\n尹渊继续“贴心”地向周围人解释道。\n\n“每年先是通过预赛，在全省百万学子中选出两千余名物理领域的佼佼者，这些人才有资格参加正赛。而在这两千多人中，只要进入前八百名，就能获得省三，而省二，则必须要进入前三百名。”\n\n“而反映在卷面分数上，省二的均分几乎是省三的几倍。”\n\n他说得很自然，像是真心在替我贴金。\n\n但我始终能感觉到他的袖里藏针。\n\n而我的第六感并没有出错，尹渊的燕国地图中终于露出了匕首。\n\n“不过我听说，姜学弟参加那届，竞赛里有不少黑幕。”尹渊说，“当然，我只是听说。”\n\n寝室里的声音一下子低下去。\n\n小林抬头看了我一眼，又很快把视线放回评分表上。\n\n我握着椅背，没有说话。\n\n“唉，本该是既为国家甄选顶尖人才，又为极少数天赋异禀的学子提供机会的两得之举，却被一些金玉其外，败絮其中的酒囊饭袋之徒给占了虚名，实在可惜。”\n\n尹渊似是自顾自地感慨道。\n\n“姜学弟，你说这些人可恨吗？”\n\n包括我在内，现场所有智力超过原核生物的，都能听出尹渊的弦外之音。\n\n“当然。”\n\n与其被动受制，不如主动点破尹渊的阴阳怪气。\n\n“尹学长难道怀疑我是靠黑幕得奖的吗？”\n\n但尹渊却是揣着明白装糊涂，只继续用那种学长关心学弟的语气说：\n\n“当然，我不是怀疑姜学弟的能力。只是随便说说而已。”\n\n接着，他又话锋一转：\n\n“我最近在看一篇力学相关的文献，文中有一个公式，我推演了很久，还是百思不得其解，只依稀记得以前高中学习竞赛时似乎碰见过类似的物理模型，不知姜学弟可有空帮我研究一下？”\n\n他拿出手机，点了几下。\n\n“如果姜学弟有空，可以帮我看看。”\n\n我看着他。\n\n手机屏幕在他手里亮着。\n\n“尹学长，把论文发我吧。”\n\n我听见自己说。\n\n声音比想象中稳一点。\n\n也只是稳一点。\n\n尹渊挑了挑眉。\n\n“军训期间应该挺累的，不用勉强。”\n\n“没事。”我说，“军训结束前给你。”\n\n这句话说出口后，我才意识到自己给了一个截止时间。\n\n“那就麻烦姜学弟了。”\n\n尹渊满意地点点头。\n\n小林那边也打完了分。\n\n“A109，优秀。”\n\n“我们还要去检查其他寝室的内务，就不多逗留了，之后有机会再见。”\n\n尹渊和小林离开后，门被李向阳关上。\n\n宿舍重新安静下来。\n\n空调送风口发出稳定的响声。刚才为了迎接查寝而摆好的水杯、台灯、文件夹还留在原位，整洁得有些陌生。\n\n尹渊走后，一直没出声的朱铭终于忍不住问道。\n\n“姜岚，刚才尹渊说的黑幕……是怎么一回事？”\n\n还未等我开口，一向沉稳的李向阳居然也跟了一句。\n\n“我们不是怀疑你。只是竞赛离我们普通高考生确实有点远，很多真相也不了解。”\n\n我没有立刻回答。\n\n重生后的那一个多月里，我为了弄清楚“另一个姜岚”到底是谁，查过很多东西，也翻过很多东西。\n\n证书、旧草稿本、家长群里老师发过的祝贺消息，还有手机里一些聊天记录。\n\n我也在网上搜过那届物竞，搜过承办地、实验题、庐州一中和几所重点中学的名字。能找到的东西并不完整，有些帖子只剩标题，有些截图真假难辨，还有些争论到最后变成了互相扣帽子。\n\n我知道的不是一段完整记忆。\n\n更像是很多碎片被勉强拼在一起。公开资料给了轮廓，旧聊天记录给了细节，而偶尔闪过的画面，只负责让那些冷冰冰的字变得难受。\n\n“那届全国物竞，是安徽承办的。”我说，“命题组里有科大的教授。”\n\n朱铭皱起眉。\n\n“所以是泄题？”\n\n“不是。”我摇头，“泄题风险太大，也太蠢。真正麻烦的是，很多东西根本不需要泄题。”\n\n李向阳抬了一下眼。\n\n“出题偏向？”\n\n“差不多。”\n\n我把椅子往后拉了一点，坐下。\n\n“竞赛和高考不一样。高考至少有一套很严格的命题、保密和回避制度。竞赛没那么简单，尤其到了省内复赛、集训和决赛选拔这些环节，学校、教授、重点中学之间的关系会复杂很多。”\n\n朱铭听得很认真。\n\n这对他来说大概很新鲜。\n\n毕竟大多数普通高中生对竞赛的理解，基本停留在“有一群成绩特别好的人在做看不懂的题”。\n\n“庐州那几所重点中学，和科大关系一直很近。”我说，“有些教授本来就会参与中学生竞赛培训，知道他们平时训练什么、擅长什么、薄弱什么。出题的时候只要稍微偏一点，就能让某些学校占很大便宜。”\n\n“这也能算黑幕？”朱铭问。\n\n“如果只是风格偏一点，很难说。”李向阳接过话，“因为命题人总会有自己的偏好。真正的问题是，这种偏好如果长期稳定地指向某几所学校，就会变成筛选优势。”\n\n朱铭看了他一眼。\n\n“李哥，你听起来比我还懂。”\n\n“我只是在按逻辑推。”李向阳说。\n\n我点点头。\n\n“竞赛不同于高考，公平性和保密性都没那样规范、严格，而教授们的子女，或他们同事的子女，其中不乏参赛的选手……”\n\n“哪还用得着泄题？许多科大教授子女的人生路径自出生起就被他们的父辈提前规划好了：‘庐州重点小学-重点中学-科大’。”\n\n“之所以能如此顺利，是因为庐州的重点中学早已与科大同气连枝，甚至一些教授直接分管的就是庐州的中学生竞赛。”\n\n“命题组对他们子女所在学校的竞赛课程和重点了然于掌，只需要在出题的时候有所偏向即可。即便被人看出来，人家只要一口咬定这是他们的出题风格，又能上哪去告状？”\n\n“所以这种事最难处理。你说它泄题，它没有。你说它公平，它也不是。被照顾的人甚至不用知道自己被照顾了，只要照常训练、照常考试，就能把优势拿到手。”\n\n说到这，周围人无不倒吸一口凉气。\n\n“所以……那届竞赛获奖者多是庐州市那几所重点中学的学生，对吗？”\n\n“不仅省内复赛如此。”\n\n“到了最后的全国决赛，来自五湖四海的青年学子齐聚庐州，在庐州一中完成理论与实验两项考试。其中，实验考试中一项主要内容是测量一块玻璃的折射率，可谁都没想到的是，这根本是一个不可能在规定时间内完成的实验。”\n\n“不可能完成？这是什么意思？”\n\n“那项实验需要反复测量、记录大量数据，如果按照正常的操作步骤，即便过程中非常顺利，一步不错，也会因为数据量的庞杂超时。但庐州的考生，只要在考场上做做样子就行了，因为那块玻璃的折射率，他们的老师早就让他们每个人都背得烂熟于心了。”\n\n“我靠！”朱铭一时没忍住爆了粗口，“他们竟敢这么明目张胆地作弊？”\n\n“命题组偏袒自己子女，连带照顾本地考生，本就是自物竞举办多年以来的默许传统，只不过庐州那次实在做的太过分，以致所谓‘黑幕’被爆出。”\n\n“后来呢？”袁林修忽然问。\n\n“处理了吗？”\n\n“不了了之。”\n\n朱铭愣了两秒。\n\n“我操。”\n\n这两个字很糙。\n\n但在那个瞬间，它比任何文明用语都准确。\n\n李向阳没有骂人，只是靠回椅背上，陷入了沉默。\n\n“所以你那年……”朱铭说到一半，又停住了。\n\n我知道他想问什么。\n\n如果那届有黑幕，那姜岚到底是靠黑幕得利，还是被黑幕害了？\n\n“如果没有那些事，应该能更进一步。”我说。\n\n这句话说得很轻。\n\n轻到几乎不像在说我自己。\n\n事实上，也确实不是在说我自己。\n\n我只是忽然想起一些画面：成绩公布的页面，拥挤的教室，老师拍在肩上的手，还有一个少年站在走廊尽头，低头看着手机，脸上没有太多表情。\n\n不是不难过。\n\n更像是早就知道世界不会给他一个公道。\n\n手机震了一下。\n\n尹渊发来了PDF。\n\n文件名是一串英文、数字和下划线，冷冰冰地躺在聊天框里。\n\n我点开看了一眼。\n\n大段英文从屏幕上挤出来，中间夹着密密麻麻的公式。那些字母、上下标、希腊符号和积分号排在一起，像某种不欢迎外来者的密文。\n\n第一页标题里有几个词我勉强看懂：\n\nSwinging up a pendulum。\n\n后面还有一行更长的标题，出现了spacecraft、trajectory之类的词。\n\n“这玩意儿你真会？”朱铭凑过来看了一眼，表情立刻变得肃然起敬，“我连标题都觉得它不想认识我。”\n\n“我也不确定。”我说。\n\n这句话一出口，朱铭的表情反而比刚才放松了一点。\n\n“那就慢慢看呗。”他说，“反正尹渊也不是今晚就来收作业。”\n\n李向阳看了一眼时间。\n\n“军训结束前，还有四天。”\n\n谢谢。\n\n倒也不用把倒计时念得这么清楚。\n\n“需要草稿纸吗？”\n\n袁林修突然问。\n\n我愣了一下。\n\n“可能需要。”\n\n袁林修从抽屉里拿出一本没拆封的草稿本，放到我桌上。\n\n“多买了一本。”\n\n他说完，就转回去整理自己的东西。\n\n这句话听起来很耳熟。\n\n和刚才朱铭那瓶“多拿了一瓶”的水一样。\n\n我同样没有拆穿他。\n\n我把那本草稿本放在电脑旁边，又把手机里的PDF传到电脑上。\n\n屏幕亮起来，刚刚被收拾过的桌面映出一块白光。桌面太干净，反而显得那本草稿本、那几支笔和屏幕上的英文文献格外突兀。\n\n我坐在椅子上，忽然意识到，尹渊留下的不是一道题。\n\n是一段必须被走完的路。\n\n如果我什么都不做，明天、后天、大后天，那个“靠黑幕得奖”的影子就会一直跟着我。\n\n也会跟着那个真正拿到省二的姜岚。\n\n“我先试试看吧。”我说。\n\n朱铭本来还想说什么，最后只是拍了拍我的椅背。\n\n“行。看不懂也别硬熬，喊我们。”\n\n“喊你有用吗？”\n\n“至少我能陪你一起看不懂。”朱铭说，“人多，显得阵仗大。”\n\n我终于有点想笑。\n\n但电脑屏幕上的公式很快把那点笑意压了回去。\n\n……\n\n时针缓缓划过“12”。\n\n夜幕低垂，窗外树影婆娑，声声蝉鸣，但我却无暇享受这一抹静谧。\n\n英文文献打开在屏幕左侧，右侧是我刚建的空白文档。草稿纸上写了几行乱七八糟的符号，又很快被我划掉。\n\n夏末的夜，电脑屏幕微弱的光沉浸在同样微弱的蝉鸣声中。\n\n笔尖掠过草纸，发出“沙沙”的轻声，为之伴奏。\n\n空调偶尔发出轻微的震动，寝室里其他人的呼吸声渐渐平稳下来。\n\n我握着笔，用力眨了眨又有些干涩的眼睛，神情突然一阵恍惚。\n\n窗外的蝉声忽然近了一点。\n\n不是云梦宿舍楼下那几棵树上的蝉。\n\n更像是很久以前，某个被热气压低的夏夜里，厂房外面那种叫到发哑的声音。\n接触不良的灯管。\n\n对面的人说着话。\n\n声音很低，被机器声挤得断断续续。\n\n我看不清她的脸，只看见身前小桌上几张散落的纸，一道道线条交错在上面。\n\n灯管又闪了一下。\n\n声音像是从桌子另一边传来，又像是从我握着笔的手指里传来。\n\n我回过神。\n\n笔尖在纸上洇出一个小黑点。\n\n窗外蝉声依旧。"},{"title":"第十一章：为你证明（下）","file":"11、第十一章.md","volumeTitle":"第一卷：故事的开篇就是要平庸得过头","text":"接下来的两天里，我的白天属于张迪，夜晚则属于尹渊的那篇论文。\n\n这听上去像是某种听者伤心、闻者落泪的时间管理。白天在操场上反复立正、稍息、跨立，晚上一头扎进英文文献和草稿纸里，物理规律尚未从密密麻麻的公式中向我显灵，我倒先快被牛顿和军训服联合超度了。\n\n好在原主姜岚留给我的新手村装备，并不只有证书、草稿本和一堆让我不敢随便碰的旧书。\n\n那些公式看久了，有些陌生的推导也会慢慢露出一点能抓住的线头。像是在黑暗里摸索楼梯，第一脚总担心踩空，踩到第二三级后，脚底便能勉强记住台阶的高度。\n\n当然，这并不意味着我已经有余裕去热爱白天的军训。\n\n太阳照常在操场上执行它的酷刑。\n\n雨后那点凉意早就被云梦的夏天收回去了。地面被晒得发白，塑胶跑道散出一股热得发闷的味道，站在队列里时，汗会从帽檐底下钻出来，沿着太阳穴一路往下爬。若是它刚好流进眼睛里，人还不能抬手擦，只能在视野短暂变咸的情况下继续保持军姿。\n\n袁林修的腿也还没有好。\n\n校医院那张诊断单没有让他真正离开训练场，只让张迪在盯着他时多了一个可以拿出来阴阳怪气的东西。\n\n“动作慢一点可以，别慢得像在跟我谈条件。”\n\n“你要是真不行，校医院为什么不写不能参训？”\n\n“受伤不是免死金牌，懂吗？”\n\n类似的话落下来时，袁林修大多只是应一声“是”，然后把动作继续做完。\n\n他说得越少，张迪似乎越觉得自己有道理。\n\n那天下午练的是正步分解动作。\n\n一开始还只是踢腿、绷脚尖、定住。到了后来，张迪让我们一排一排往前走，谁的高度不够、落脚不齐、手臂摆幅不对，整排就退回去重来。\n\n军训进行到这个阶段，人和人之间已经不需要太多交流，光听身边那一声鞋底落地的轻重，就能判断这一遍大概又要作废。\n\n袁林修所在那一排第三次退回原地时，张迪吹了哨。\n\n“袁林修，出列。”\n\n袁林修从队列里走出来。\n\n他走得很平，至少表面上看起来很平。可到了队列前方停下时，右脚落地那一下还是慢了一点。\n\n张迪当然看见了。\n\n“这几天一直是你。”他说，“别人都在练，你是在这儿给我表演身残志坚？”\n\n队列里有人动了一下。\n\n很小的动静，很快又压住了。\n\n袁林修抬起头。\n\n“报告，动作我会继续练。”\n\n“会继续练？”张迪像是听见了什么好笑的话，“那你倒是练出来。你今天要是正步走不明白，你们这一排就陪你练到明白。”\n\n“报告教官，他的腿还没好。”\n\n朱铭的声音从我左前方传过来。\n\n他开口前没有回头，也没有看任何人，像是那句话在牙关后面顶了太久，终于自己冲出来了。\n\n张迪转向他。\n\n“你叫什么？”\n\n“朱铭。”\n\n“朱铭。”张迪把他的名字念了一遍，“你是医生？”\n\n“不是。”\n\n“你是教官？”\n\n“不是。”\n\n“那我在训练，轮得到你插嘴？”\n\n朱铭没说话。\n\n他耳朵被太阳晒得发红，嘴唇也抿得很紧。我站在斜后方，看不见他的表情，只看见他垂在裤缝边的手一点点攥起来。\n\n“你也出列。”\n\n张迪说。\n\n朱铭走到前面。\n\n“既然你这么关心同学，就陪他一起练。”张迪往旁边退了两步，“你们这一排也看着。今天谁想做好人，都可以站出来。”\n\n没人站出来。\n\n也没人说话。\n\n太阳还在照，远处别的方阵还在喊口号。声音隔着操场传过来，整整齐齐，显得我们这一小块沉默格外难堪。\n\n朱铭和袁林修被留在队列前面，一遍一遍做分解动作。\n\n袁林修的动作越来越慢。\n\n到第几遍时我已经记不清了。只记得他再次踢腿定住，身体忽然晃了一下，脚跟落回地面时没有站稳。\n\n朱铭就在旁边，下意识伸手扶了他一把。\n\n动作发生得太快，甚至没有来得及称之为“决定”。\n\n张迪上前一步，一把扣住袁林修的肩，把他重新推回站位。\n\n“站好！”\n\n袁林修肩膀猛地一顿。\n\n那一下并没有把人推倒。\n\n也正因为没有推倒，周围的队列仍旧站着，操场仍旧是操场，张迪的哨子仍旧挂在胸前。仿佛只要袁林修还站在原地，刚才那一下就只是“纠正动作”。\n\n“教官。”朱铭的声音变了，“他真练不了了。”\n\n“你替他决定？”\n\n张迪转身就把火压向他。\n\n“蹲下。”\n\n朱铭没有立刻动。\n\n“我说，蹲下！”\n\n他这才双手抱头蹲下去。\n\n张迪又看向我们这一排。\n\n“你们也蹲。一个人训练态度有问题，一排人陪着看热闹，是吧？”\n\n膝盖弯下去的时候，裤料被汗黏在腿上，闷得让人烦躁。\n\n有人动作慢了半拍，张迪的哨声立刻刺过来。\n\n队列从竖直变成一片矮下去的影子，热气仍从地面往上返，世界却突然只剩下自己发酸的大腿和前面那双靴子。\n\n袁林修还站着。\n\n张迪让他站在旁边看。\n\n“你不是说腿伤吗？”他说，“行，那你站旁边看着。看清楚，你一个人的动作做不好，别人要不要跟着受累。”\n\n我蹲在队伍里，呼吸一点点乱起来。\n\n这一次没有谷懿在台上说话，没有校长，没有话筒，也没有任何足以让事情显得轰轰烈烈的东西。\n\n只有一个人的腿伤，一句多出来的话，一排人在太阳底下蹲着。\n\n可我忽然很想骂人。\n\n不是在心里把张迪归进什么文件夹，不是用一个稍微好笑一点的比喻让自己好受些，就是非常朴素、非常没出息地想骂人。\n\n骂什么都行。\n\n只要那几个字够脏，够短，能从胸口顶出去。\n\n可最后从我嘴里出去的，只有越来越急的喘气声。\n\n张迪没有让我们蹲半个小时。\n\n也许因为下午后面还有训练，也许因为操场上不止他一个教官。过了十来分钟，他终于让我们站起来，继续正步。\n\n站起身时，我的大腿一阵发麻，眼前黑了一瞬。\n\n朱铭回到队列里，脸色比平时沉得多。\n\n袁林修没有再被单独叫出去。张迪让他站到队伍边上，说既然动作做不好，就先看别人怎么做。\n\n他站在那里，手贴着裤缝，身影被太阳照得很薄。\n\n……\n\n散训以后，大家没有像往常一样立刻一股脑往食堂跑。\n\n队列散开得很慢。\n\n有人去拿水，有人把帽子摘下来扇风。太阳还没有完全落下去，操场边的树荫已经被一群人分得所剩无几。\n\n“张迪今天是真有病吧。”\n\n不知是谁先说了一句。\n\n声音不大。\n\n可一旦有人开了头，旁边的话便断断续续接上来。\n\n“之前就这样。”\n\n“你们才知道啊？”\n\n“上回我们宿舍那个请假晚回队列，他让人在旁边补了半小时军姿。”\n\n“别在这儿说。”\n\n最后那句话说完，几个人都安静下来。\n\n朱铭拿着水杯站在我旁边，仰头灌了两口水，喉结重重滚了一下。\n\n“走走？”他问。\n\n“脚不疼？”\n\n“心里闷得慌。”\n\n“去哪？”\n\n“随便。”他说，“我现在看操场边上那排旗子都来气。”\n\n晚训前的空档不够我们走远，最后我们还是先去食堂吃了饭，又在晚上九点多下训后从宿舍出来。\n\n朱铭起初换了双拖鞋，但没走两步脚就疼的难受，又骂骂咧咧换回运动鞋。\n\n“我脚也疼的不行。”我问。\n\n“我是怕路上碰到张迪，上去揍他的时候拖鞋影响发挥。”\n\n我们穿过校园，沿着二里半那一带往江边去。\n\n夜里的潇湘中路没有白天那么烫。\n\n车灯从身后滑过，带起一阵风，又很快被江面吹来的潮气抹平。\n\n沿江步道上有人跑步，有人骑着车从我们旁边经过，轮胎碾过地砖缝，发出细碎的声响。\n\n更远一点的地方，三三两两的学生靠在护栏边说话，笑声被车流和水声一冲，听不清内容。\n\n湘江从云梦的中心穿过，江面在夜里显得比白天更宽。\n\n对岸的楼亮着一格格窗，灯影落到水上，被水流拖成长短不一的线。江心的橘子洲横在中间，洲头那尊青年雕像隔着江水立在那里，轮廓并不十分清楚，却让那一片夜色有了一个不会轻易被忽略的方向。\n\n虽然来到云梦已经一周有余，但还是第一次见到这座城市地标。\n\n我以前在课本中读到过这。\n\n如今真的站到江边，课本没有翻页，朱铭却在旁边长长叹了口气。\n\n“姜岚。”他说，“你说今天这事，算个啥？”\n\n“你这个问题范围有点大。”我说，“哲学系可能比较擅长回答。”\n\n“谷懿不在。”\n\n这四个字落下来，我没再接玩笑。\n\n江风把汗没干透的衣领吹得贴在脖子上，带来一点不太舒服的凉。\n\n“我下午那句，是不是又害了别人？”朱铭问。\n\n“你说袁林修腿没好那句？”\n\n“嗯。”\n\n“张迪本来就在找他麻烦。”\n\n“可后面那一排人蹲着，也是因为我出声了。”\n\n朱铭说完，低头踢开脚边一颗小石子。石子滚出几步，停在护栏底下。\n\n“谷懿那天说得痛快吧。”他说，“我当时也觉得痛快。后来每天晚上加训，袁林修今天还被他这么整，我又觉得……光痛快好像不顶用。”\n\n“但不说，也没见张迪突然良心发现。”\n\n这句话从我嘴里出来得比我预想中快。\n\n朱铭看了我一眼。\n\n我自己也愣了一下，只好继续说下去。\n\n“我的意思是，他今天要找茬，总能找着。袁林修动作慢是理由，你插话是理由，我们在旁边站着不够像木头，说不定也是理由。”\n\n“那咋办？”朱铭问，“总不能明天继续让他这么来吧。”\n\n这问题比尹渊那篇论文还难。\n\n论文至少承认自己由公式和逻辑组成，只要足够有本事，总能一步步推过去。眼前这件事却没有题干，没有答案，也不会因为我写满三页草稿纸就自动给出一个漂亮的证明。\n\n“要不……”我开口，又停了一下，“要不我们先把今天的事写下来？”\n\n“写下来？”\n\n“嗯。”我说，“真要去找人说，总不能只说一句‘张迪太不是东西了’。虽然这句我个人很赞成，但听起来不太像有效材料。”\n\n朱铭沉默两秒。\n\n“你这话说得怎么跟李哥似的。”\n\n“那我换个说法。”我想了想，“先记账。今天他干了什么，说了什么，谁看见了，别过两天一问，我们只剩下一肚子火和一句‘反正他就是干了’。”\n\n朱铭点头。\n\n“这个可以。”\n\n他拿出手机，打开备忘录。屏幕的光照在他脸上，他盯着空白页看了一会儿，又抬头看我。\n\n“第一行咋写？”\n\n“……”\n\n刚才说得像模像样的人是我，现在被问住的人也是我。\n\n这大概就是理论指导实践时，实践给理论的第一个下马威。\n\n“日期先写上吧。”我说。\n\n朱铭打字。\n\n“今天下午，正步训练。”他念，“张迪针对袁林修腿伤……”\n\n“针对这个词是不是有点先下结论？”\n\n“那写啥？”\n\n“叫他出列？”\n\n“行。”\n\n朱铭把“针对”删掉，改成“叫袁林修出列”。\n\n写到张迪那句“身残志坚”时，我们又卡住了。\n\n“他原话是不是这个？”我问。\n\n“是。”朱铭说，“我听得真真的。”\n\n“我也听见了。”我说，“写。”\n\n写到罚蹲时，朱铭的手指停在屏幕上。\n\n“十分钟？”\n\n“差不多。”\n\n“差不多不能写吧。”\n\n“那写‘约十分钟’？”\n\n“有道理。”\n\n我们站在湘江边，对着一个手机备忘录抠字眼。江面上远远有船过去，灯光从橘子洲那边移出来，慢慢落到另一段水面上。\n\n这画面若是从远处看，可能会像两个大学生正在认真商量明天去哪家店吃饭。\n\n只有手机里那几行字知道，我们第一次试图把一个下午从乱糟糟的愤怒里捞出来，摆成能让别人看见的样子。\n\n“还有之前罚蹲那几次。”朱铭说，“谷懿那天之后的。”\n\n“可以另写。”我说，“但先分开，别全糊到一块儿。”\n\n“你是真的被李哥夺舍了吧？”\n\n“我如果被他夺舍，现在应该已经建好表格了。”\n\n“那也不一定。”朱铭说，“李哥说不定还会给表格做颜色分类。”\n\n这很难反驳。\n\n我们把今天的事写完，又把之前能确定的几次加训和罚蹲列在后面。写着写着，原本空白的备忘录慢慢长起来。它还很乱，有的地方记了原话，有的地方只写了“待问”，有的时间只敢写“大约”，可至少不再只是胸口那团堵着的东西。\n\n“问问别人？”朱铭说。\n\n“现在？”\n\n“不然呢？我怕睡一觉醒来怂了。”\n\n他说这句话时很坦然。\n\n我看着手机上那几行字，忽然也觉得现在比较好。\n\n于是朱铭先给同排一个男生发消息。对方回得很快。\n\n【我也看见了。】\n\n紧接着又补上一句：\n\n【但你们要去反映的话，先别写我名字行不？】\n\n朱铭把手机递给我看。\n\n我点点头。\n\n“回他可以。”\n\n第二个同学隔了好一会儿才回。\n\n【你们真要搞这个？】\n\n【再过几天就结束了。】\n\n朱铭盯着那两句，眉头又皱起来。\n\n“他说得也不是没道理。”他说，“可怎么听着这么憋屈呢。”\n\n“先别跟他争。”我说，“问他今天看没看见。”\n\n最后对方回了一个【看见了】，又发来一段话，说上周自己宿舍有个人训练时头晕，去树荫下坐了几分钟，回队列后被张迪当着大家说“身体娇贵就别报军训先进个人”。\n\n“军训先进个人，还有这玩意儿？”朱铭问。\n\n“我不知道。”我说，“但他那句话重点应该也不在奖项。”\n\n第三个同学比前两个干脆。\n\n他直接说，张迪前几天让他们另一列一个动作做错的人单独加练，练到晚饭快结束才放人走。那个人回来时骂了半路，但第二天还是照常站进队伍。\n\n消息一条条进来。\n\n朱铭把能确认的内容往备忘录里添，添到后面又觉得这样太乱，索性新建了一个标题叫“别人说的”，把几条消息分开记。\n\n“这能当证据吗？”他问。\n\n“我不知道。”我说，“但至少现在幻想的人多了一些。”\n\n的确……\n\n原来不是只有我们看见了。\n\n原来别人也会觉得不对。\n\n原来把话发出去，屏幕另一头并不总是一片沉默。\n\n回宿舍的路上，朱铭没再骂张迪。\n\n他走得比来时快一点，像是怕那股劲在路上泄掉。\n\nA109的灯还亮着。\n\n李向阳坐在桌前看电脑，袁林修刚洗完澡，头发还湿着，正坐在椅子上擦。我们进门时，他把毛巾从头上拿下来，看了朱铭一眼。\n\n“你俩跑哪去了？”\n\n朱铭没有立刻回答。\n\n他先把门关上，又往阳台那边看了一眼，才走到袁林修旁边。\n\n“有个事想问你。”他说。\n\n袁林修把毛巾搭到椅背上。\n\n“说。”\n\n“今天下午张迪那事。”朱铭顿了顿，“我跟姜岚想去反映一下。不是现在就把你推出去，也不是非得你出面，就是……那事毕竟有你，我们先问你一声。”\n\n他说到后面明显慢下来。\n\n比起江边对着备忘录记时间，面对袁林修本人反而更难。因为手机里写的是事实，坐在面前的是人。\n\n袁林修没有马上说话。\n\n他低头把湿毛巾拧了一下，水滴落进脚边的盆里。\n\n“反映给谁？”他问。\n\n“还没定。”我说，“辅导员、书院，或者总教官。我们想先把能确定的事理清楚。”\n\n“你们问过别人了？”\n\n“问了几个在场的。”朱铭说，“有人愿意说看见了，也有人不想留名。”\n\n袁林修点了下头。\n\n“诊断单还在我这儿。”\n\n朱铭像是没料到他先说这个，愣了愣。\n\n“你愿意给吗？”\n\n“拍照可以。”袁林修说，“原件我自己留。”\n\n“肯定原件你留。”朱铭赶紧说，“我不是那个意思。”\n\n袁林修从抽屉里把那张诊断单拿出来，放到桌上。\n\n纸被折过几次，摊开时边角没有完全平下去。李向阳听见我们说话，转过椅子，看了那张单子一眼。\n\n“你们要反映张迪？”他问。\n\n“嗯。”朱铭说，“总不能让他继续这么整。”\n\n李向阳没有立刻说行，也没有说不行。\n\n“你们现在整理了什么？”\n\n朱铭把备忘录给他看。\n\n李向阳从头往下扫，手指在屏幕上滑了两下。\n\n“先别写‘故意针对’。”他说，“这个你们证明不了。”\n\n“我刚才也说了。”我说。\n\n“那这句‘逼袁林修带伤训练’也换一下。”李向阳说，“写他在看到校医院建议之后，仍然要求袁林修参加哪些训练。把动作写出来。”\n\n朱铭看着他。\n\n“李哥，你这到底是支持还是不支持？”\n\n“你们都问到这一步了，我现在说不支持有用吗？”李向阳把手机还给他，“要说就说清楚。事实越清楚，别人越难一句‘你们情绪激动’打回来。”\n\n朱铭没接话，低头改字。\n\n李向阳又说：\n\n“聊天记录别删。诊断单拍照的时候把日期拍清楚。还有，别往大群里发。”\n\n“为什么？”\n\n“你是想反映张迪，还是想先让张迪知道有人在反映他？”\n\n朱铭想了想。\n\n“前者。”\n\n“那就行。”\n\n李向阳又把备忘录往上划了一段。\n\n“还有，除了你们两个，其他同学的名字先别往里写。”他说，“他们愿不愿意出面，是他们自己的事。没问过，就别替别人决定。”\n\n朱铭看了他一眼。\n\n“行。”\n\n李向阳说完转回电脑前。\n\n袁林修把诊断单放平，让我拍了一张。\n\n快门声响起时，他忽然说：\n\n“别只写我的事情。”\n\n“什么？”朱铭问。\n\n“今天他罚的是一排人。”袁林修说，“之前也不只我。”\n\n朱铭看着他，嘴唇动了动。\n\n最后只说：\n\n“行。”\n\n那天晚上，我们把手机、诊断单照片和几个人发来的消息摊在一起，像两个第一次做小组作业却谁也没见过模板的新生。\n\n朱铭负责把句子写得像人话，我负责删掉那些一看就带火气的形容词。\n\n删到后来，朱铭看着“张迪于某日下午训练中要求袁林修出列重复正步分解动作”这一句，满脸痛苦。\n\n“这写得也太客气了。”他说，“不知道的还以为他在给袁林修一对一精品小班课。”\n\n“那你在后面把原话写上。”我说，“原话不客气。”\n\n于是那句“表演身残志坚”被我们原封不动放了进去。\n\n这一招立刻显得文字有了生命。\n\n张迪本人在骂人方面的表现力，确实比我们两个初学投诉材料写作的新手强得多。\n\n等到最后整理完，已经快到熄灯时间。\n\n内容仍然算不上漂亮。\n\n有几次罚蹲的时间我们记得不完全一致，只能写大概；有些同学只愿意说一句“我看到了”，不肯把名字留在文字里；那几条聊天记录截出来，顺序也有些乱。可朱铭把备忘录从头翻到尾，又翻回开头，终于长出一口气。\n\n“至少不是空手了。”他说。\n\n我看着手机上那行标题。\n\n标题是朱铭取的，叫“张迪问题记录”。\n\n十分朴素。\n\n朴素得让我有点想笑，又没笑出来。\n\n第二天上午，张迪没有再让我们罚蹲。\n\n也没有再把袁林修单独叫到队伍前面。\n\n这并不代表他突然转性，只是训练内容换成了军体拳的拆分动作，整个操场都忙着一拳一掌地往空气里交代青春。张迪在队列间走来走去，偶尔纠正动作，脸色依旧不怎么好看。\n\n我一边听口令，一边惦记着昨晚整理出来的东西。\n\n它就躺在我手机里。\n\n薄得只是一份备忘录，重得又让我每次摸到裤兜都想起它。\n\n午休时，朱铭问我：\n\n“找谁？”\n\n“我也在想。”我说。\n\n“辅导员？”\n\n“可以。”\n\n“班导？”\n\n“也可以。”\n\n“总教官呢？”\n\n我想起毛锐站在主席台上训话的样子，想起他一声口令下去整个操场跟着响起来的回答。\n\n“也不是不行。”我说。\n\n“你这个答案跟没答一样。”\n\n“我也不知道啊。”\n\n朱铭把手机往床上一丢，躺回枕头上。\n\n“下午再想。”他说，“我现在脑袋已经被张迪拿去踢正步了。”\n\n下午没有想出答案。\n\n晚饭前，我们又把几条记录看了一遍，决定至少先把毛锐列进可选项。毕竟张迪归教官队管，毛锐又是总教官。只不过列进可选项是一回事，真的走到总教官面前说“我们教官有问题”又是另一回事。\n\n我甚至已经开始在脑子里排练开场白。\n\n“毛教官您好，我们想向您反映一件事。”\n\n太正式，像来交材料。\n\n“毛教官，张迪打人。”\n\n太直接，像下一秒就要被吹哨子罚跑。\n\n“毛教官，您吃了吗？”\n\n这个开头倒是亲切，就是很可能把事情带向食堂满意度调查。\n\n结果命运显然懒得等我通过台词审核。\n\n晚饭时，木兰食堂里人很多。\n\n我和朱铭绕了半圈，才在靠里侧找到两个位置。\n\n坐下没多久，朱铭的筷子忽然停在半空。\n\n他抬眼看向我身后。\n\n“姜岚。”他压低声音，“你别回头太猛。”\n\n这句话的效果等同于“千万不要想象一只粉色大象”。\n\n我尽量不猛地回头，结果动作僵硬得像正在尝试假装自然的机器人。\n\n毛锐端着餐盘，就坐在斜后方不远处。\n\n他没在看我们。\n\n他和另一个教官坐在一起吃饭，帽子放在旁边空位上，拿筷子的动作普通得让人很难把他和操场上那个能把“累不累”喊成一道雷的人拼起来。\n\n可我还是一下子紧张起来。\n\n手机在口袋里。\n\n昨晚那份“张迪问题记录”也在。\n\n我们中午才说到总教官，现在总教官就坐在几张桌子之外。机会来得太快，快得没有留给我继续把开场白排练得像样一点。\n\n说吗？\n\n不说的话，下次是什么时候？\n\n现在过去，会不会显得太冒失？\n\n张迪今晚还在训练场。袁林修今晚也还要站进队伍里。\n\n这几句话在我脑子里撞了一圈，撞得时间都短了。等我回过神，朱铭已经小声问：\n\n“去吗？”\n\n他的声音也绷着。\n\n原来并不是只有我一个人面对总教官会紧张。\n\n这发现没有让我变勇敢多少，但至少让我不至于一个人坐在原地发怵。\n\n“去。”我说。\n\n站起来的时候，膝盖差点碰到桌沿。\n\n这很不帅。\n\n但好在食堂里没人给我的勇气做动作评分。\n\n我和朱铭走到毛锐桌边。\n\n那个和他一起吃饭的教官先抬起头看我们。毛锐随后也看过来，目光在我们身上的军训服停了一下。\n\n“教官好。”我说。\n\n声音出口时比自己想象中小一点。\n\n于是我又补了一遍。\n\n“毛教官好。”\n\n“嗯。”毛锐放下筷子，“有事？”\n\n有。\n\n当然有。\n\n可真被问到这一句，我喉咙还是紧了一下。\n\n“我们想向您反映一下C阵张教官的事。”我说。\n\n毛锐看着我。\n\n没有立刻皱眉，也没有让我们回去吃饭。\n\n“张迪？”他问。\n\n“是。”\n\n“坐下说。”\n\n他把旁边那顶帽子拿起来，放到自己腿边。另一个教官看了毛锐一眼，端起餐盘说自己先走。\n\n我和朱铭在那张桌子旁坐下。\n\n直到屁股真的挨到椅子，我才发现自己手心出汗了。\n\n“说吧。”毛锐说，“什么情况？”\n\n一旦开了头，后面反而比想象中容易一点。\n\n我先说袁林修腿伤，说校医院开了建议减少剧烈运动的诊断单，说张迪仍让他参加训练，又把今天下午正步训练的事一段段讲出来。\n\n讲到那句“表演身残志坚”时，毛锐打断我：\n\n“原话？”\n\n“原话。”朱铭说，“我也听见了。”\n\n毛锐看了他一眼。\n\n“你就是下午出列的那个？”\n\n“是。”\n\n“后来罚蹲多久？”\n\n“大概十分钟。”朱铭说，“我们看过时间，但不是一开始就掐表。”\n\n“还有谁在场？”\n\n“我们这一排都在。”我说，“有几个同学愿意说明看见了，但他们有点怕。”\n\n说完这句，我忽然担心自己是不是把别人卖了。\n\n毛锐却没有追着问名字，只问：\n\n“你们有诊断单吗？”\n\n“有照片。”我把手机拿出来，点开袁林修诊断单的照片给他看，“原件在同学那里。”\n\n毛锐看完，又让我把昨晚整理的记录打开。\n\n我把手机递过去时，心里有一种奇怪的羞耻感。那份备忘录昨晚在A109看着已经颇有成果，现在到了总教官面前，忽然又显得像第一次交作业的草稿。\n\n可毛锐看得很认真。\n\n他没有笑，也没有说我们写得乱。看到几处时间不确定的地方，他会问一句“这一条谁能确认”；看到之前罚蹲和晚间加训的记录，他的脸色慢慢沉下来。\n\n“这些都是张迪安排的？”他问。\n\n“是。”我说，“谷懿上台发言之后，C阵晚训时间就变长了。罚蹲也不止今天。”\n\n“张迪动过手吗？”\n\n这个问题出来时，我和朱铭都停了一下。\n\n“今天他推了袁林修。”我说，“之前……”\n\n我想起训练场边那些低声说过的话。\n\n“之前我们也看见他拍过人、拽过人。被他打过的同学，应该有人能证明。”\n\n“应该？”毛锐问。\n\n“我们还没问全。”我说。\n\n话一出口，我又觉得自己的回答像是交了一份缺页材料。\n\n毛锐没有责怪，只把手机还给我。\n\n“能把事实先整理到这个程度，已经可以了。”他说。\n\n那一瞬间，我心里绷着的那根线忽然松了一截。\n\n“军训有军训的纪律，教官队也有教官队的纪律。”毛锐说，“该训练的要训练，但不能这么处理伤病学生，也不能拿体罚当管理办法。”\n\n他说话时声音不高。\n\n食堂里依旧吵，隔壁一声勺子落地的脆响很快没进人声里。可我听得很清楚。\n\n“你们反映的情况，我会核实。”毛锐说，“这件事先不要在群里扩散，免得事实还没弄清楚，先把队伍弄乱了。”\n\n“那袁林修今晚还要照常训练吗？”朱铭问。\n\n毛锐看向他。\n\n朱铭明显紧张，却没有把问题收回去。\n\n“他如果腿伤不适，按校医院建议来。”毛锐说，“我会问张迪。”\n\n朱铭点头。\n\n“谢谢教官。”\n\n我也跟着说了声谢谢。\n\n这大概是这一周多来最真心的一句客套话。\n\n我们正要起身，毛锐又突然叫住了我。\n\n“你叫什么？”\n\n“姜岚。”\n\n“哪个学院？”\n\n“立华书院。”\n\n毛锐点了下头，摆了摆手，示意我们可以走了。\n\n……\n\n从木兰食堂出来时，我才发现后背又出了一层汗。\n\n朱铭站在台阶下，长长吐出一口气，像是刚才那几分钟一直没敢把肺用满。\n\n“我刚才是不是说得有点少？”他问。\n\n“没有。”我说，“你还帮袁林修争取到了今晚的休息。”\n\n“也是。”\n\n他低头看了一眼手机。\n\n“备忘录没白写。”\n\n“嗯。”\n\n我也把手机拿出来。\n\n那份记录还在，标题仍然朴素得近乎笨拙。可再看见它时，它已经不只是昨晚江边那一页空白上慢慢敲出来的字了。\n\n朱铭往操场方向走了两步，又回头催我。\n\n“走啊，再晚张迪又有理由了。”\n\n我把手机收回口袋，跟了上去。\n\n晚风从木兰食堂门口吹过来，带着饭菜、热水泥地和树丛里潮湿的味道。\n\n耳边隐约已经听见了哨声。"},{"title":"第十二章：于无人之画","file":"12、第十二章.md","volumeTitle":"第一卷：故事的开篇就是要平庸得过头","text":"军训结束的那天，天气是怎样的呢？\n\n是照旧的大晴天，还是如释重负的阴天？\n\n那天表演时，我们方阵是第几个走过主席台的？前排有没有人在转弯时悄悄踩错半拍？\n\n很久之后，当很多重要的事和印象都变得模糊，我却还清楚地回荡在操场上的那首歌，和那时被歌声紧紧包裹着的心情……\n\n记得它从操场四周的音箱里响起来时的感觉，就像一阵风，把汗味、尘土、军训服粗糙的布料、同学们忽然松开的笑声，全都卷进短暂的同一天。\n\n后来我才慢慢明白，人对一段日子的记忆，总是会在结束时变得格外可疑。\n\n就像在每个毕业典礼上都会发生的那样，人们总是会不自主地在脑海中倒带起数年的时光，记忆中糟糕、悲伤的部分早已被岁月磨去，只留下幸福、快乐的记忆在阳光下闪烁。\n\n记忆像某个过度热心的后期剪辑师，会把糟糕的部分剪短，把明亮的部分调色，再给它们配上一首恰到好处的BGM。\n\n于是，一棵树、一栋楼、一条每天走到想吐的路，突然都变得值得留恋。它们本来只是事情发生的地点，和快乐、痛苦、成长都没有必然关系。\n\n可故事偏偏发生在那里，也只是因为那里发生过故事罢了。\n\n那些比我们停留得更久的东西，就像钉在时间里的路标，不断提醒着未来的我们：看，你曾经从这里经过。\n\n军训结束那天也是这样。\n\n明明前一天我还觉得这两周像一只被太阳反复煎过的煎饼，翻面都翻得不太均匀。可当我重新站到操场上，等待最后一次走过主席台时，那些怨气忽然不再争先恐后地往外冒了。\n\n不是因为我忘了张迪的嚣张，忘了谷懿那天的愤怒，忘了陈小云那句没能说完的话，忘了袁林修被迫一次次证明自己不是偷懒，也不是忘了鞋底在正午的跑道上踩出的汗印。\n\n我只是忽然不太想在这最后几分钟里继续恨下去。\n\n这并不代表我和军训和解了。\n\n我只是想把这点时间留给那个终于走到这里的自己。那个害怕过、旁观过、熬夜过、也勉强做过一点事的自己。\n\n哪怕只是几分钟。\n\n我希望世界能稍微安静一点。\n\n……\n\n军训汇演那天，操场上很早就站满了人。\n\n这大概是大学里最奇怪的一种仪式：所有人花了将近两周时间，把自己训练成能够在几分钟里看上去像同一个人的样子，然后由一群坐在主席台上、并不会记住你脸的人，对这几分钟的表演指指点点。\n\n当然，如果有人非要从中提炼出青春、纪律、集体、成长之类的关键词，我也无法反驳。\n\n毕竟在那天之前，我确实从没想过自己有朝一日会因为走正步而产生一种接近毕业典礼的复杂情绪。\n\n我们站在C阵的位置上等待上场。\n\n这份宁静首先要归功于张迪，我们教官的缺席。\n\n没有人正式向我们解释过他为什么没来。\n\n没有通报，没有道歉，没有“经查明”，更没有哪个领导在主席台上宣布某位教官训练管理存在严重问题。\n\n有人说他临时有事。\n\n有人说他被总教官叫去谈话。\n\n也有人信誓旦旦地表示，自己昨晚路过教官宿舍时看见张迪黑着脸收拾东西。\n\n事实如何，我并不知道。\n\n我只知道，最后一天站在我们面前的人换成了另一个教官。那位教官姓什么，我后来也没记住。\n\n只是袁林修那天站在队伍里，没有再被单独叫出去。\n\n朱铭看见后，用胳膊轻轻碰了我一下。\n\n我没有回头。\n\n队伍里不能随便乱动。\n\n但我知道他的意思。\n\n轮到C阵时，前排的口令传下来，脚步声同时落在跑道上。\n\n主席台远远立在前方，红色横幅、麦克风、矿泉水瓶、领导们的白衬衫与深色裤子，都在太阳底下显得无比正式。正式到让人觉得，如果此时有谁突然打了个喷嚏，都会对这场仪式造成不可挽回的损害。\n\n我们抬腿，落脚，摆臂。\n\n训练时被张迪吼过无数次的动作，在真正走过主席台时，反而短得像一场误会。\n\n也不过几分钟。\n\n为了这几分钟，我们挨晒、罚蹲、加训，忍受汗水、鞋底、哨声和无数句“不累”。\n\n而主席台上的人当然不会知道。\n\n他们只会看见一排穿着军训服的新生从面前经过，动作大体整齐，口号大体响亮，足以证明这一届军训工作圆满完成。\n\n“圆满”这个词总是很厉害。\n\n它像一块红布，盖住什么都显得喜庆。\n\n所有方阵表演结束后，操场上的队列终于散开。\n\n维持了两周的钢铁森林在几分钟内轰然解体。方才还被规定站位、间距、角度和口令的人群，忽然像自由电子一样在一大片绿茵地上乱窜。\n\n有人摘帽子，有人解腰带，有人把帽子抛起来又接住。也有人冲向自己方阵的教官，吵吵嚷嚷地要合影，仿佛前几天被训得头皮发麻的人并不是自己。\n\n人类的遗忘能力有时强得令人敬畏。\n\n当然，也可能不是遗忘。\n\n只是人总需要在一段痛苦结束时找点东西庆祝一下。哪怕庆祝对象正是痛苦的组成部分。\n\n“他们那边还能和教官合影。”朱铭站在我旁边，看着隔壁方阵一群人把教官围住，“咱们这边就尴尬了。”\n\n“怎么了？”我问。\n\n“我们只能和空气拍。”朱铭说，“标题我都想好了：《我们与不存在的教官》。”\n\n“艺术感过强，建议投给摄影协会。”\n\n“摄影协会看了都得说这构图太抽象。”\n\n我被他说得差点笑出来。\n\n袁林修站在不远处，把军训帽拿在手里，没有加入任何围着教官合影的人群。他今天走完整个汇演后，脸色比前几天好了不少。\n\n朱铭朝他喊：\n\n“袁林修，过来拍照。”\n\n袁林修抬头。\n\n“我不拍也行。”\n\n“你少来。”朱铭说，“这两周都站过来了，拍张照还想躲？”\n\n袁林修看了他两秒，还是走了过来。\n\n李向阳正好从旁边经过，手里拿着手机，似乎刚帮别人拍完照。\n\n朱铭立刻叫住他：\n\n“李哥，别走，咱寝室也拍一张。”\n\n李向阳看了看我们三个，又看了看远处的主席台。\n\n“可以。”他说，“不过得调整下角度。”\n\n他把手机支在地上，往后退了两步，又觉得角度太低，于是弯腰把手机立到军训帽上。\n\n可军训帽显然没有承担摄影器材的职业素养，手机刚放稳就往旁边滑了一下。\n\n朱铭蹲下去扶住帽檐。\n\n“这玩意儿不行啊。”他说，“李哥，你这最新款iPhone怎么还需要地面配合？”\n\n“手机没问题。”李向阳说，“问题是地面不平。”\n\n袁林修站在旁边，默默把自己的帽子也递过去。\n\n李向阳试了第二次。两个帽子叠在一起，手机终于勉强立住，但镜头里只能拍到我们的腿。\n\n朱铭低头看了眼屏幕。\n\n“挺好。”他说，“青春就是从膝盖开始的。”\n\n我正准备上前帮忙，余光里却看见一个熟悉的身影从隔壁方阵旁边经过。\n\n陈小云从隔壁方阵那边走过来，军训帽被她端端正正地抱在怀里，帽檐朝外，像刚从某种仪式里暂时退场。\n\n她原本只是路过，意外和我对视后，向我挥了挥手。\n\n我朝她点了点头。\n\n“同学？”朱铭回头看我，“认识？”\n\n“陈小云。”我说，“之前军训时认识的。”\n\n陈小云也朝我们点了一下头。\n\n她的目光从地上的手机、叠在一起的军训帽，再移到我们几个人脸上。\n\n“你们是在合影吗？”她问。\n\n朱铭立刻站直。\n\n“正在和万恶的美帝进行艰苦卓绝的斗争。”他说。\n\n幸好李向阳的手机不是华为，我心想。\n\n陈小云并没有get到朱铭的脑回路，看了看地上的手机。\n\n“要不我帮你们拍吧？”\n\n“太感谢了。”朱铭立刻把手机递过去，“陈同学，你就是我们A109今日特聘摄影指导。”\n\n“不用这么正式。”陈小云摆了摆手。\n\n她接过李向阳的手机，又看了一眼屏幕。\n\n“这个角度会有点背光。”她说，“你们往右边站一点。”\n\n李向阳点点头，像是认可了这个判断。\n\n我们按照她的指挥挪了几步。朱铭站在中间，硬把袁林修拉到左边，又把我推到右边，李向阳则站在最旁边，负责让这张照片看起来至少有一个人比较可靠。\n\n“别整得跟证件照似的。”朱铭说，“都军训结束了，开心点。”\n\n袁林修配合地把嘴角往上提了一点。\n\n那点弧度很克制，像是怕笑得太明显，会让自己显得过分配合。\n\n陈小云举起手机。\n\n“三，二，一。”\n\n快门声响起。\n\n朱铭立刻凑过去看。\n\n“怎么样？”\n\n陈小云把手机转过来给我们看。\n\n屏幕上，朱铭笑得很开，袁林修的表情仍然克制，但至少不像被迫参与某项违法活动。李向阳站在最边上，姿势端正得像随时可以把照片拿去贴进优秀寝室评比栏。至于我，眼镜反了一点光，看上去有点傻。\n\n不过是可以接受的那种傻。\n\n“还不错。”陈小云说。\n\n“主要是摄影师水平高。”朱铭说。\n\n他又盯着屏幕看了两秒。\n\n“不对啊。”他说，“我怎么比现实里精神？陈同学，你是不是偷偷开美颜了？”\n\n陈小云看了他一眼。\n\n“那是李同学的手机。”\n\n李向阳把手机接回去，低头确认了一下。\n\n“原相机。”他说。\n\n朱铭沉默片刻。\n\n“那就是我本人底子不错。”\n\n陈小云把手机还给李向阳。\n\n“那我先走啦。”\n\n她说完，刚准备转身，朱铭忽然像是想到了什么，眼神在我和陈小云之间来回晃了一下。\n\n这个晃动很短。\n\n但短得很有问题。\n\n“等一下。”朱铭说，“陈同学，你刚才帮我们拍了，礼尚往来，我们也帮你拍一张呗。”\n\n陈小云停住。\n\n“我？”\n\n“对啊。”朱铭说得很热心，“你和姜岚不是认识吗？军训都结束了，拍张纪念照，多正常。”\n\n我一时没反应过来。\n\n等反应过来时，李向阳已经看了我一眼。\n\n袁林修也看了我一眼。\n\n朱铭则露出一种自以为十分自然、实则把“我好像发现了什么”写在脸上的表情。\n\n我本来想说“不用这么麻烦”，但话到嘴边，又觉得这句拒绝好像比拍照本身更奇怪。\n\n陈小云倒是比我大方一些。\n\n她只是想了想，说：\n\n“也行。”\n\n于是事情就这么定下来了。\n\n我和陈小云站到一起时，中间隔着一点不多不少的距离。她抱着帽子，肩膀站得很直。\n\n我忽然不知道该把手放在哪里。\n\n最后还是放回了裤缝旁。\n\n朱铭拿着手机，退后两步。\n\n“姜岚，别这么僵。”他说，“你是拍照，不是被张迪罚站。”\n\n“你快拍。”我说。\n\n陈小云很轻地笑了一下。\n\n快门声第二次响起。\n\n过分巧合的是，就在快门声响起的同时，操场四周的音箱忽然传出前奏。\n\n我差点以为是朱铭手里的手机连上了学校广播系统。\n\n“这是校歌吧？”朱铭问。\n\n“嗯。”陈小云说，“《麓山南路的风》。”\n\n“你们怎么都听得出来？”\n\n陈小云疑惑地看着我。\n\n“姜岚，你填志愿前没看过师大的招生宣传片吗？”\n\n“看过。”我立刻说，“当然看过。”\n\n我当然没看过。\n\n毕竟真正填志愿的人不是我。\n\n但这种时候如果露出一副“招生宣传片是什么，可以吃吗”的表情，多少有点破坏气氛。\n\n朱铭把手机递过来。\n\n陈小云没有追问，而是低头检查照片。\n\n“还不错诶。”\n\n她把手机转过来给我们看。\n\n看到照片中我和陈小云并肩而立的样子，我才发现原来刚才和她之间的距离有这么近。\n\n我忽然想起那把米黄色的伞。\n\n那个时候，雨声把世界推远，伞下那一小块空间像被单独裁了下来。一路上，手背有几次擦过她的袖口，肩膀也偶尔碰到一起，又很快分开。\n\n那些触碰短得几乎不能算作触碰。\n\n可它们偏偏留了下来。\n\n“姜岚？”\n\n陈小云叫了我一声。\n\n我回过神。\n\n“怎么了？”\n\n“你刚刚在看哪儿？”\n\n“没什么。”我说，“可能是校歌太催眠。”\n\n“这才刚开始唱。”\n\n“说明催眠效果很好。”\n\n就在这时，我的手机震了一下。\n\n我拿出来一看，居然是霍学姐发来的消息。\n\n【霍钰：军训结束了？】\n\n这算某种心灵感应吗？\n\n【我：结束了。】\n\n过了一会儿，她回：\n\n【霍钰：辛苦了。】\n\n只有三个字。\n\n可我看见这三个字时，耳边的校歌、人群、朱铭和陈小云的说话声，都像被稍稍推远了一点。\n\n【我：学姐今天也在操场吗？】\n\n这句话发出去后，我才觉得自己问得有点突兀。\n\n霍学姐隔了十几秒才回。\n\n【霍钰：在。】\n\n后面又跟了一句：\n\n【霍钰：姜学弟挺有本事的嘛，刚入学就认识了那么漂亮的女生。】\n\n我愣住。\n\n下意识抬头向周围看去。\n\n周围人潮汹涌，班导、老师、工作人员、新生混在一起。\n\n可我没看到那个人的身影。\n\n这时，手中的手机又震了一下。\n\n【霍钰：别找了，我已经走了。】\n\n我低头看着那行字，忽然觉得自己刚才四处张望的动作大概有点明显，也有点白痴。\n\n“姜岚，你又发呆。”朱铭说，“是不是刚结束军训，灵魂还没完成退伍手续？”\n\n“差不多。”我把手机收起来，“正在办理转业。”\n\n“转去哪？”\n\n“转去宿舍躺尸。”\n\n“有前途。”\n\n校歌唱到副歌时，朱铭忽然想起什么。\n\n“对了，你们当时报师大都是为啥？”\n\n这个话题来得毫无预兆。\n\n陈小云想了想。\n\n“我家在衡州，离云梦不算远。家里不太想让我去太远的地方，省内又没有更合适的学校，就来师大啦。”\n\n这个理由朴素、合理、无懈可击。\n\n而我来自徽州，离云梦隔着千山万水，显然不能照抄。\n\n于是我立刻发动传统艺能：转移火力。\n\n“朱铭同学呢？”\n\n以往一向风趣幽默的朱铭，表情忽然变得严肃。\n\n那是一种我从未见过的严肃。\n\n连带着一旁的我和陈小云也不自觉地变得郑重了起来。\n\n朱铭看着远处操场边飘动的旗子，缓缓开口……\n\n那一刻的我还不知道，接下来，朱铭将要发表的是，足以载入东北地方志的重要讲话：\n\n“说来话长。”他说，“你们可曾听闻过——豆角吧？”\n\n“什么？”陈小云愣住。\n\n“啊？”\n\n“你们没听过也正常。”朱铭说，“一看就不是混那种地方的人。”\n\n陈小云更疑惑了。\n\n“哪种地方？”\n\n“地域黑。”朱铭压低声音，语气忽然严肃，“豆角吧，就是一个专门地域黑东北人的贴吧。一群人天天在里面造谣，抹黑我们东北人。”\n\n“啊？”陈小云睁大眼睛，“这么过分吗？”\n\n“非常过分。”朱铭说，“所以我离开东北，千里迢迢来到南方，就是为了向被误导的南方朋友证明一件事。”\n\n他停顿了一下。\n\n风从操场上吹过来，校歌还在响。\n\n朱铭的神情越发庄重。\n\n“我们东北人，不是他们说的那样！”\n\n这句话说完，连我都有点被感染。\n\n虽然这个感染的源头是豆角吧，听起来多少有些离谱。\n\n“朱铭同学。”陈小云小心翼翼地开口，“我能问一个问题吗？”\n\n“问。”\n\n“为什么叫豆角吧？”\n\n朱铭的表情僵了一下。\n\n我突然意识到，这可能触及了某种东北互联网秘辛。\n\n“这个……”朱铭咳了两声，“就是一些很无聊的人，说东北人去海南偷豆角。”\n\n“偷豆角？”\n\n“对。”\n\n陈小云沉默了两秒。\n\n然后她很认真地问：\n\n“所以……东北人真的偷豆角吗？”\n\n世界安静了。\n\n至少我们这个小范围内安静了。\n\n朱铭看着陈小云。\n\n我看着朱铭。\n\n“……”\n\n“诶？我是不是说错了什么。”\n\n“……”\n\n“……”\n\n我和朱铭都沉默了。\n\n只剩那首《麓山南路的风》，夹杂着人群的嘈杂声在操场上回荡，一遍又一遍地，洗涤着我们长久疲惫后，终于放松下来的心灵。\n\n[麓山南路吹过的风~~]\n\n[吹过了我们的青葱~~]\n\n风吹过我们的军训服，吹过已经摘下的帽子，吹过朱铭此刻不知该如何捍卫的东北尊严。\n\n陈小云意识到气氛不对，立刻摆手。\n\n“我不是那个意思！我就是……”\n\n“没事。”朱铭闭了闭眼，“这是每个东北人南下后都必须面对的灵魂拷问。”\n\n“那答案是？”\n\n“个别人的行为不能代表全体东北人！”\n\n“就是嘛！我就说怎么可能……诶！不是！？”\n\n陈小云原本已经点到一半的头停在半空。\n\n她脸上的表情正在从“我就知道地域黑不靠谱”，一点点变成“刚才那句话是不是哪里不太对”。\n\n我终于没忍住笑了。\n\n后来，在我和陈小云都对天发誓，绝对不会相信网上那些对东北人的离谱抹黑后，朱铭终于满意地点了点头，暂时放过了这个话题。\n\n“行。”他说，“今天先讲到这儿。关于东北形象的系统性澄清，咱们以后有机会再开专题讲座。”\n\n他说完，忽然又想起什么似的，声音低了一点。\n\n“说起来，谷懿那家伙现在也不知道是死是活。”\n\n朱铭看了看操场边逐渐散开的人群。\n\n“要是他今天也在就好了。”\n\n“你在这挂念他，他可是逃离军训潇洒了好久呢。”\n\n陈小云语气里明显带着不满。\n\n“什么！？”\n\n“你说什么！？”\n\n我和朱铭同时定住了。\n\n不是普通意义上的定住。\n\n而是从眼神到肩膀再到嘴角，全部短暂失去系统响应的那种定住。\n\n“你刚说什么？”朱铭问。\n\n“你们去看他刚发的朋友圈嘛。”\n\n朱铭立刻拿出手机点进和谷懿的聊天界面。\n\n聊天内容还停在之前发过去的两句话。\n\n【你人呢？】\n\n【还活着回个1。】\n\n下面空空荡荡。\n\n没有回复。\n\n朱铭的表情变得更加震惊。\n\n“他不回微信。”朱铭一字一句地说，“但他发朋友圈？”\n\n然后他以一种近乎悲愤的速度点进朋友圈。\n\n最新一条，果然是谷懿。\n\n照片里，他站在一座桥上，背后是很宽的江面。\n\n定位是夏口。\n\n朋友圈配文：\n\n【哎哟，这江风真大啊，都要吹感冒了。】\n\n“谷懿我（此处自动消音）你（此处自动消音），你（此处自动消音）真是（此处自动消音）了！！！”\n\n东北人的形象在这一刻彻底崩塌了。\n\n……\n\n几乎同一时间。\n\n夏口长江大桥上，谷懿打了个喷嚏。\n\n“谁在骂我？”\n\n夏口长江大桥横跨在江面上。\n\n新中国成立后修建的第一座公铁两用长江大桥。\n\n它连接龟山与蛇山，被称作万里长江第一桥。它曾把南北铁路真正接到一起，也曾作为一个时代关于钢铁、工业、交通和国家意志的巨大证词，横在长江之上。\n\n如今它依然横在那里。\n\n桥下是长江，江边是老工业城市留下的痕迹和新城市里反着光的大厦玻璃。\n\n旧时代的工业重镇没有消失，只是被新的招牌、道路和高楼一层层覆盖，像一张旧图纸还压在今天的城市底下。\n\n此时此刻，谷懿就站在那张图纸上方，头发被风吹得乱七八糟。\n\n手机在他手里震了一下。\n\n他低头点开朱铭的评论。\n\n【朱铭：你知不知道我们以为你被退学了？】\n\n谷懿迎着江风眯了眯眼，脸上笑容的灿烂程度又多了几分。\n\n……\n\n这一次，我们很快就收到了谷懿的回复：\n\n【谷懿：那你们的军训不是更有戏剧张力了？还不快感谢我给你们无聊的服从性测试加上了如此大的乐趣？】\n\n朱铭又骂了一句很脏的话。\n\n陈小云也看了一眼评论区，认真评价：\n\n“他真的很欠打。”\n\n“是吧。”朱铭说，“陈同学，你这个判断很准确。”\n\n我没有加入对谷懿的声讨。\n\n只是又看了一眼那条朋友圈。\n\n至少他没被退学。\n\n也没失踪。\n\n他只是跑到了别的城市，用一种很欠揍的方式证明自己还活着。\n\n我心中的一块石头终于落地了，军训，似乎彻底结束了……\n\n……吗？\n\n不，还没有。\n\n还有一件事没有完成。\n\n……\n\n物理与电子信息学院就在田径场对面那条马路的不远处。\n\n走过去的路明明很近，但我走到台阶下时，校歌已经被落在身后，只剩文件夹在手里被攥得有些发热。\n\n今天不仅是军训结束的日子，也是我和尹渊约定的日子。\n\n那篇文献，那道推导，还有他说过的那些话，都在文件夹里。\n\n我把它们带过来，就像把一枚已经落下的棋子重新摆到棋盘中央。\n\n这几天里，我几乎把能用的晚上都交给了那篇文献。\n\n尹渊发来的PDF一开始像一块没有门的墙。英文、公式、上下标、希腊字母混在一起，仿佛每一行都在用非常礼貌的方式告诉我：你不属于这里。\n\n可我还是一点点看下去了。\n\n查了一堆其他的相关文献，甚至还去翻了竞赛的教材，以及问电脑搜索引擎一些足以暴露智商的问题，还有更多时候，是在半夜对着草稿纸发呆。\n\n这里要特别感谢霍学姐，她给我推荐的几个读论文和整理公式的软件救了大命。\n\n推导真正完成，是在今天凌晨。\n\n那时寝室里很安静，草稿纸铺了一桌。最后的结果其实没占多少地方，只有不到一页纸，可为了把它写出来，我几乎把前面所有能走的路都踩了一遍。\n\n看见最后一行公式和文献里的表达对上时，我愣了很久。\n\n不是因为自己有多厉害。\n\n而是因为我忽然意识到，这双手真的能写出这些东西。\n\n我，竟然真的做到了，解决了尹渊都做不出的难题。力矩、角动量、谐振子、拉格朗日方程……一大堆我连听都没听过的名词，竟然在短短的几个晚上就被我学会了。\n\n而且，这些天里，我不止一次产生一种奇怪的感觉。\n\n有些概念对我来说明明陌生，可当我足够久地盯着它们时，它们又会在某个瞬间变得熟悉。像一条很久没走过的路，草长得很高，路牌也被风吹歪了，可脚底还是能在犹豫中找到一点方向。\n\n大概这都是原主姜岚留下的东西。\n\n天赋也好，记忆也好，身体里那些说不清的残留也好。\n\n总之，那不是完全属于我的力量。\n\n但我仍然为它感到高兴。\n\n“姜岚，也许，我真的能够成为你也不一定呢……”\n\n在今天之前，我已在脑中排练过很多次最后尹渊的反应。\n\n他也许会惊讶。\n\n也许会皱眉。\n\n也许会继续挑错，指出我哪里推得不严谨。\n\n如果他质疑我的结果，我就把中间过程拿给他看。如果他说我只是抄了什么资料，我就告诉他每一步对应的物理意义。如果他承认我做出来了，我就请他至少别再在别人面前拿物竞黑幕阴阳怪气。\n\n这套剧本非常完整。\n\n完整到如果现实真的照它演下去，我甚至可以考虑给自己配一段并不存在的BGM。\n\n下课铃响起后，物电院的大楼开始往外吐人。\n\n学生三三两两从门口出来，有人背着包，有人低头看手机，有人还在讨论刚下课的内容。很快，我在人群里看见了尹渊。\n\n他身边跟着两个同学，正在说什么。\n\n白衬衫，黑色长裤，表情温和，姿态从容。\n\n仿佛他不会因为任何一件事走快或走慢半步。\n\n我深吸一口气。\n\n“尹学长！”\n\n尹渊停下脚步，转头看见我。\n\n“姜学弟？”\n\n他像是有些意外，又像只是礼貌地表示自己注意到了。\n\n我走上前，把手里的文件夹攥得更紧。\n\n“你之前发给我的那篇文献，里面那个公式，我推出来了。”\n\n“噢。”\n\n尹渊点了点头。\n\n“很认真啊。”\n\n我愣了一下。\n\n这和我预想中的第一反应不太一样。\n\n按照正常剧本，这里他至少应该微微睁大眼睛，或者停顿半秒，或者用某种“不可能，你怎么会”的眼神看我。\n\n可他只是点了点头。\n\n“学长，我是说，我把完整推导写出来了。”\n\n我又说了一遍。\n\n“我知道。”\n\n尹渊笑了笑。\n\n“我不是表扬过你了吗？”\n\n他说得很自然。\n\n自然到我一时不知道该怎么把接下来的台词塞进去。\n\n“你……不看看吗？”\n\n我把文件夹递过去。\n\n尹渊低头看了一眼，没有接。\n\n“我当然也想看。”他说，“不过最近确实有点忙。导师那边又给了几篇材料，学院那边也有事，时间排得比较满。”\n\n他说完，脸上还流露出一点歉意。\n\n那歉意太得体了。\n\n得体得让我甚至不知道该不该生气。\n\n“可是我们之前说好了。”\n\n尹渊看着我。\n\n他的表情没有变。\n\n“计划赶不上变化呀，姜学弟。”\n\n又是这种语气。\n\n平静，温和，甚至带着一点学长对学弟的包容。\n\n好像我此刻所有的不甘，都只是年轻人太认真以后难免发生的一点小事故。\n\n“你可以先发我邮箱。”他说，“有空我会看的。”\n\n我手里的文件夹停在半空。\n\n“学长。”我说，“你当时不是说，你推演了很久也没弄明白吗？”\n\n“是啊。”尹渊说，“所以我才说你很认真。”\n\n“那你至少看一眼结果。”\n\n尹渊旁边的同学互相看了一眼。\n\n我知道自己现在可能有些难看。\n\n可我控制不住。\n\n这几天的凌晨，草稿纸，干涩的眼睛，被划掉又重写的公式，全都挤在手里这叠纸上。\n\n它们没有办法自己说话，只能由我替它们再往前递一点。\n\n尹渊终于接过文件夹。\n\n他翻开第一页。\n\n视线落在上面，大概停了不到十秒。\n\n然后他合上了。\n\n“写得挺多。”他说，“这态度很好。”\n\n态度。\n\n又是态度。\n\n我看着他手里的文件夹。\n\n第一页的纸角还停在他刚才翻开又合上的位置，微微翘着。\n\n那上面有我凌晨三点写下的最后一行公式。\n\n可他刚才只看了不到十秒。\n\n“只是我现在真的赶时间。”尹渊把文件夹递还给我，“之后有机会再交流吧。”\n\n“可——”\n\n“姜学弟。”\n\n他打断我。\n\n“再见咯。”\n\n尹渊从我身旁走了过去。\n\n那两个同学也跟着他离开。他们没有回头，也没有表现出明显的好奇。对他们来说，这大概只是学长被一个新生拦住，说了几句不太愉快的话。\n\n人流继续从物电院门口涌出。\n\n我站在台阶下，手里拿着文件夹。\n\n里面不过是几张纸，几十页草稿里整理出的最后版本，不到一本薄教材的厚度。\n\n可它们忽然都变得很沉重。\n\n我原本准备了很多话。\n\n准备解释推导，准备回应质疑，准备在尹渊露出破绽时把话追过去。\n\n可那些话全都堵在喉咙里。\n\n“这算什么啊……”\n\n这句话我默念了千百遍，每次念时都觉得有一股难以言说的悲哀。\n\n这种悲伤委屈却又无处收留的心绪，我既不能将其排遣在外，又不能将其藏于何处。\n\n它像身边掠过的江风一样，没有轮廓，没有重量，我甚至连把它清楚地摆在眼前都做不到。\n\n鞋底踏过台阶，书包带擦过衣袖，谈笑声从左边过来，又从右边散开。\n\n人潮不断从我身侧涌过，我却感受不到他们的存在。整个偌大的世界，就像一根根与我平行的直线，从与我毫无关联的一维空间中穿过。\n\n我突然觉得，自己就是那股无处可去的心情，不知道去向何方，也找不到来时的路。\n\n我现在哪里？\n\n我下意识捏紧了手中那早已失掉所有存在意义的文件，慌乱地环视着四周，目光所及，无不是陌生的男男女女。\n\n我现在哪里？\n\n人群从画面里一笔一笔擦过去。可没有一笔落在我身上，线条、色块、声音，全都热闹得不像孤独。\n\n可它们没有一个能告诉我：\n\n我现在哪里。\n\n我只好继续攥着那叠已经没有任何意义的纸。\n\n在这幅哪也不是的无人之画里，不断回忆着自己，不断地，一无所获地，回忆着自己……"},{"title":"第一章：举手之前","file":"第二卷/1、第一章.md","volumeTitle":"第二卷：在开始就立下的flag最容易折断","text":"“打野你别送了行不行？”\n\n这句话响起时，讲台上的尹渊刚在黑板上写下“班委竞选”四个字。\n\n字写得挺漂亮。\n\n如果无视后排那位正对着手机屏幕激情输出的同学，眼前这场景大概还能勉强算作大学生活正式开始前的庄严仪式。\n\n可惜现实生活里的庄严仪式，往往只需要一只不合时宜的游戏麦克风，就能当场破功。\n\n尹渊的粉笔停在最后一笔上，教室里随之安静了一瞬。所有人都在同一时间意识到：好像有什么不该存在的东西出现了。\n\n后排那位同学却完全没有这方面的自觉。\n\n“不是，兄弟，你往人塔下闪现干嘛？你是去送温暖的吗？”\n\n他声音不算特别大，但在教室里足够清楚。\n\n坐在我旁边的朱铭缓缓转过头，表情像是亲眼见证了某种新物种的诞生。\n\n我跟着回头看了一眼。\n\n那男生穿着一件黑色短袖，头发有些乱，整个人斜靠在椅背上，一只脚还不太安分地踩在椅子横杠上。\n\n他的注意力全在手机屏幕里，手指移动得飞快，脸上的表情极其认真，认真到仿佛眼前不是一局普通游戏，而是人类文明最后的防线。\n\n从某种意义上来说，我甚至有些佩服他。在尹渊主持的班会上开麦骂队友，这份勇气已经不能用“松弛感”来概括了。\n\n“这位同学。”\n\n尹渊放下粉笔，语气依旧平稳。\n\n“现在是班会时间。”\n\n那男生抬头看了他一眼。\n\n“噢噢，抱歉。”\n\n他说完，又低下头。\n\n“你们继续，我这边快结束了。”\n\n教室里传来几声压低的笑。\n\n尹渊脸上的笑容短暂地停了一下。\n\n那一刻，我有点理解什么叫“一拳打在棉花上”。\n\n当然，这一次出拳的人不是我。\n\n我非常愿意承认，看见尹渊被人用这种方式卡住，心情多少有那么一点复杂的愉快。\n\n“好了。”\n\n尹渊很快把那点停顿收了回去，重新看向全班。\n\n“既然大家已经从军训状态回到正常学习生活，那么班级事务也需要尽快运转起来。今天晚上，我们先完成物理班第一届班委选举。”\n\n他说“运转”这个词时很自然，像是在介绍一台机器即将开始工作。\n\n军训结束之后，我原本以为自己至少能暂时远离这种站在讲台上宣布规则的人。事实证明，大学生活显然不会这么体贴。\n\n课表，考勤，班委，通知，综测，学分，活动报名。\n\n这些词比“立正”“稍息”温和许多，甚至还有一种文明社会的书面感。但它们同样会走到你面前，拍拍你的肩膀：同学，该跑起来了。\n\n“首先竞选班长。”\n\n尹渊说。\n\n“有意愿的同学可以主动上台。”\n\n教室里短暂沉默。\n\n这种沉默很常见。\n\n老师问“有没有同学主动回答一下”时会出现，食堂阿姨问“最后一个鸡腿谁要”时也会出现。\n\n区别在于后者通常会在三秒内爆发血案，而前者会变成一种集体性的装死。\n\n不过眼下的沉默却没有持续多久。\n\n李向阳站了起来。\n\n这个动作并不突兀。好像所有人都早就知道他会站起来，甚至连椅子被推开的声音都显得很有计划。\n\n“我就知道。”\n\n朱铭在旁边小声说。\n\n“你知道什么？”\n\n“李哥不上去才奇怪吧。”\n\n确实。\n\n如果说班长这个职位是一道选择题，那么李向阳看起来简直像标准答案提前印在了试卷背面。\n\n他走上讲台，转身，站定，甚至略微向大家点了点头。\n\n“大家好，我叫李向阳，朝向的向，阳光的阳。”\n\n他说话时声音不高，但很稳，刚好能让整个教室听清。\n\n“我来自鄂州汉阳，高中期间一直担任班长，也曾担任学生会学习部负责人，获得过校优秀学生干部、校三好学生等荣誉。入学以来，我也一直在协助班导和辅导员整理一些通知和材料。”\n\n这句话讲完，前排几个同学已经开始点头。\n\n在我们还没反应过来大学生活到底怎么开始时，李向阳已经悄悄把自己的位置铺好了。\n\n这倒也不奇怪。\n\n有些人进入一个新环境，第一反应是找食堂、找宿舍、找空调遥控器。\n\n有些人进入一个新环境，第一反应是找组织结构。\n\n“如果我能够当选班长，我会尽力做好学院、书院、老师和同学之间的沟通工作，及时转达各类通知，协调班级事务，建立清晰高效的班级信息渠道。”\n\n“同时，我也希望能和大家一起，把物理班建设成一个优秀、团结、有执行力的集体。”\n\n优秀。\n\n团结。\n\n执行力。\n\n这些词没有任何问题，甚至每一个都很正确。\n\n但不知道为什么，当它们被整整齐齐地排在一起时，我总觉得自己好像又看见了某种表格。表格上方写着“班级建设目标”，下面则留着等待勾选的空格。\n\n“我的发言完毕，谢谢大家。”\n\n李向阳微微鞠躬。\n\n掌声很快响起。\n\n我跟着鼓掌。\n\n这掌声里当然有舍友情。自从开学以来，李向阳确实帮了我们不少。他提醒过查寝，整理过请假流程，甚至在袁林修受伤那几天，把证明、诊断单、聊天记录理得比校医院的挂号窗口还清楚。\n\n但就算不算舍友情，他的演讲也挑不出什么大问题。\n\n稳妥，完整，有经验。\n\n简直像一份已经通过格式审查的申请材料。\n\n李向阳走下讲台时，教室另一侧有个女生站了起来。\n\n她起身的动作很利落，带着一点“既然气氛都到这儿了，那我也来一下吧”的自然。\n\n王伊。\n\n空调遥控器事件中，她拿着A601的遥控器向我们道歉；发军训鞋那晚，她又替一个鞋码不合适的女生和工作人员周旋。\n\n那时我对她的印象就挺深。只是眼下，看见她站到全班面前，还是有些意外。\n\n她没有穿得很夸张，只是一件浅色上衣配背带裤。\n\n“大家晚上好。”\n\n她笑着说。\n\n“我叫王伊，伊人的伊。大家如果觉得两个字太正式，也可以叫我小伊。当然，如果觉得刚认识就叫小伊过于亲切，也可以先叫我王伊同学，我这个人非常尊重社交距离。”\n\n教室里响起笑声。\n\n王伊自己也跟着笑起来，说到“小伊”时还用手指在空中轻轻点了一下，像给这个称呼加了个并不存在的括号。\n\n“刚才李向阳同学讲得非常正式，也非常优秀。我坐在下面听的时候，差点以为自己误入了学生会主席竞选现场。”\n\n她朝李向阳那边看了一眼。\n\n“所以我先声明一下，我没有那么多厉害履历。如果大家想选一个看起来特别可靠、特别成熟、特别像能把Excel表做得很漂亮的人，李同学确实非常有竞争力。”\n\n又是一阵笑。\n\n李向阳坐在座位上，跟着礼貌地笑了一下。\n\n只不过那笑容很短。\n\n短到像刚弹出的系统提示，还没看清内容就自动关闭了。\n\n“不过，班长这件事嘛，我有一点自己的想法。”\n\n王伊双手扶在讲台边缘，身体微微前倾，像真的在和大家聊天。\n\n“我觉得班长不是领导者。至少，不该首先是领导者。”\n\n教室里安静了一点。\n\n“我们都已经上大学了，谁也不是来这里再找一个小班主任管自己的。班长更像是一个服务者，一个负责把麻烦事提前处理掉的人，一个大家需要找人问事情时不会害怕打扰的人。”\n\n她说这句话时，没有用太多夸张手势，只是看着台下。\n\n她看人的时候不太像在发表演讲，更像真的在和台下某个人聊天。明明大家都坐在同一个教室里，却很容易让人产生一种“她是不是刚好在看我”的错觉。\n\n如果换我站在台上，大概只会盯着后墙某个不存在的点，把发言稿读得像遗体告别仪式。\n\n“我高中也做过班干部，知道班级事务里很多事情都不大。”\n\n王伊继续说。\n\n“比如有人找不到教室，有人忘了交材料，有人问活动时间，有人不知道通知里那句‘原则上’到底是什么意思。”\n\n不少人笑了起来。\n\n“这些事单独看都很小，但对正在问的人来说，那一刻可能就挺麻烦。所以我希望，如果我当班长，大家遇到这些小麻烦时，可以很自然地来找我。不要觉得不好意思，也不要觉得班委是坐在群公告上方的神秘生物。”\n\n“当然，我也不保证自己永远不出错。真出错了，大家可以提醒我。我心理承受能力还可以，除非你们半夜三点给我发‘在吗’，然后下一句是‘没事了’。”\n\n这次笑声更大，连朱铭都鼓起掌来。\n\n“这姑娘挺有意思啊。”\n\n他小声说。\n\n确实有意思。\n\n李向阳的演讲让人相信他能把事情做好。\n\n王伊的演讲则让人觉得，如果事情交给她，好像会没那么累。\n\n两种感觉都很有吸引力。\n\n只是后者更像在夏天喝到一口冰镇汽水。明知道汽水不能当饭吃，但气泡涌上来的时候，人总会先舒服一下。\n\n“最后，我想说，竞选班长当然是我今晚站在这里的原因，但不是我来到这个班的全部原因。”\n\n王伊停了一下。\n\n“能和大家成为同学，本身就是一件很幸运的事。以后四年，不管我是不是班长，都希望能和大家好好相处。”\n\n她弯起眼睛。\n\n“如果大家愿意的话，请把票投给我。投不了也没关系，我会努力记住你们的脸，下次在食堂碰见时假装没有伤心过。”\n\n掌声和笑声同时响起来。\n\n王伊下台时，甚至有几个女生小声喊了句“小伊加油”。\n\n我也跟着鼓掌。\n\n王伊走回座位时，顺手扶了一下旁边女生的椅背，让对方不用起身也能给她让出位置。\n\n那动作太自然了，如果不是刚好看见，大概不会有任何意义。\n\n“还有同学要竞选班长吗？”\n\n尹渊重新站上讲台。\n\n没人动。\n\n这很合理。毕竟在李向阳和王伊之后再上去，需要的不只是勇气，还需要一种不怕被现实按在地上摩擦的乐观精神。\n\n“既然没有，那就投票。”\n\n尹渊拿起粉笔，在黑板上写下两个名字。\n\n李向阳。\n\n王伊。\n\n“为了保证公平，请两位竞选人到教室外稍等。”\n\n李向阳起身时，短暂看了一眼尹渊。\n\n那个动作不明显。\n\n我刚好坐在侧面，才注意到这一眼。\n\n王伊倒是很快往门口走，临出门前甚至还朝台下挥了挥手，像是在参加什么综艺节目的最终投票环节。\n\n教室门被带上时没有完全合严，外面的走廊灯漏进来一条窄窄的白边。\n\n“每人一票，不要重复投票。”\n\n尹渊说。\n\n“支持李向阳担任班长的同学，请举手。”\n\n几只手很快举了起来。\n\n其中有些人我认得，是军训时经常和李向阳说话的男生。还有几个我不熟悉，但看他们举手的速度，显然不是临时决定。\n\n李向阳的票数一路升到十几票。\n\n我坐在座位上，手指搭在桌沿，没有立刻举手。\n\n这其实不太应该。李向阳是我舍友，也确实适合做班长。可王伊那句“班长不是领导者”又在脑子里晃来晃去。\n\n它未必比李向阳的履历更有分量，却更容易让人把票递过去。\n\n我看了一眼朱铭。\n\n朱铭没举手。\n\n袁林修坐在更前面一点，我看不清他的动作。\n\n李向阳站在门外，门板隔开了他的表情。\n\n我有种在考试里遇到主观题的痛苦。\n\n更痛苦的是，这道主观题以后可能还会和你住同一个寝室。\n\n“好，放下。”\n\n尹渊说。\n\n我还没来得及完成道德、人情、舍友关系和班级治理之间的复杂计算，第一轮投票已经结束。\n\n“支持王伊担任班长的同学，请举手。”\n\n这一次，教室里的手举得慢一些，但越来越多。\n\n像一片本来犹豫的草，被风一阵阵压过去，又一阵阵抬起来。\n\n朱铭举手了。\n\n他举得很干脆。\n\n看着他的手，我有点羡慕他那种“不想那么多”的能力。\n\n我依旧没动。\n\n不是不想投王伊，也不是想投李向阳，而是在那个瞬间，很没出息地选择了谁也不得罪。\n\n这大概就是成年人的第一次政治实践。\n\n如果民主是天赋人权，那么女娲捏我时大概思想开了小差吧。\n\n“好。”\n\n尹渊看了一圈。\n\n“王伊，十三票。”\n\n教室里响起一点骚动。\n\n我愣了一下。\n\n李向阳刚才似乎是十二票。\n\n如果我没记错的话，按这个票数，王伊已经赢了。\n\n可尹渊没有立刻宣布结果。\n\n他重新看向教室。\n\n“刚才有几位同学没有投票。为了避免统计误差，未投票同学重新投一次。”\n\n这算什么事啊……\n\n本以为逃过一劫，这下好了，不仅要做出选择，还得在众目睽睽之下。\n\n我撇了撇嘴，暗道倒霉。\n\n“支持李向阳的同学，请举手。”\n\n我抬起手。\n\n动作不快，但也没有慢到能让自己后悔。\n\n旁边不远处，一个高马尾女生也似乎动了一下。她的手离开桌面，又停在半空，很快重新放下。\n\n尹渊的视线从我们这边扫过去。\n\n“李向阳，十四票。”\n\n我怔了一下。\n\n十四？\n\n刚才明明只有我举手。\n\n我下意识看向那个高马尾女生。她也抬起头，先看了看自己的手，又看向讲台。\n\n“支持王伊的同学，请举手。”\n\n没人动。\n\n王伊和李向阳仍然站在门外，走廊里偶尔有人经过，脚步声隔着门板听起来有点闷。\n\n尹渊刚要继续，后排又炸出一道声音。\n\n“辅助你眼呢？你背包里装的是纪念品吗？”\n\n教室里所有人再次回头。\n\n那位黑衣服男生显然已经完全忘记自己刚才承诺过什么。\n\n他手指飞快地在屏幕上滑动，眉头紧皱，整张脸写满了“世界很糟但我仍在努力拯救”。\n\n尹渊终于皱起眉。\n\n“同学，现在还在开班会。”\n\n“知道知道。”\n\n那男生头也不抬。\n\n“快结束了。”\n\n“我是说班会。”\n\n“噢。”\n\n他终于抬起头，看了看尹渊，又看了看四周。\n\n“现在到哪一步了？”\n\n尹渊没有回答。\n\n他大概正在判断，和这个人继续沟通究竟算不算浪费生命。\n\n前排有人小声说：“投班长。”\n\n“班长？”\n\n黑衣服男生想了想。\n\n“刚才那个说班长是服务员的是谁？”\n\n有人小声说：“王伊。”\n\n“那我投她。”\n\n他说完，举起一只手。\n\n另一只手还在手机屏幕上操作。\n\n“服务员比领导听着顺耳。”\n\n教室里安静了半秒。\n\n尹渊看着那只高高举起的手，嘴角绷了一下。\n\n“王伊，十四票。”\n\n他说。\n\n“平票。”\n\n他刚要继续，那个高马尾女生忽然开口。\n\n“学长，我刚才没有投票。”\n\n她的声音不大，但很清楚。\n\n笑声停了。\n\n尹渊看向她。\n\n我跟着看向她。\n\n那女生坐在王伊原本位置的旁边，高马尾扎得很整齐。她说完那句话后，没有急着补充解释，只把手重新放回桌面。\n\n“你确定吗？”\n\n尹渊问。\n\n语气仍然温和。\n\n“确定。”\n\n她说。\n\n“我谁都没有投。”\n\n这句话落下之后，教室里的空气变得有些微妙。\n\n门外一如既往地安静。\n\n只是不知道这扇门的隔音效果究竟如何。\n\n尹渊停了几秒。\n\n“好。”\n\n他说。\n\n“那票数更正为，李向阳十三票，王伊十四票。王伊当选物理班班长。”\n\n掌声响起。\n\n尹渊走到门口，把门打开。\n\n王伊和李向阳从外面回来时，脸上的表情都有一瞬间没接上教室里的热闹。\n\n王伊听见结果后，先是睁大眼睛，然后很快抬手捂了一下嘴，像是真的没想到自己能赢。\n\n下一秒，她已经笑着朝大家鞠了一躬。\n\n“谢谢大家。”\n\n后面的班委竞选由王伊主持。\n\n她站上讲台，先看了尹渊一眼。\n\n“那我继续？”\n\n尹渊点点头，坐回前排。\n\n李向阳则很快再次上台，竞选学习委员。\n\n这一次没有人和他竞争。他的发言比刚才短得多，依然清楚、妥当、有条理。\n\n王伊带头鼓掌，掌声响起时，我看见李向阳微微低头。至于他刚才到底有没有失落，我看不出来。\n\n朱铭后来也上去竞选了团支书。\n\n这件事让我非常震惊。\n\n他站到讲台上，挠了挠头，说自己没什么漂亮履历，但如果大家以后有什么需要跑腿、搬东西、协调活动的事情，可以叫他。\n\n他说得很实在，甚至实在到不像竞选发言，更像在食堂窗口前向阿姨证明自己真的能吃两份饭。\n\n最后，他输了。\n\n输给了一个声音很甜、准备充分的小个子女生。\n\n他下台时倒也没什么沮丧，坐下后小声对我说：\n\n“没事，重在参与。”\n\n“你什么时候对团支书感兴趣了？”\n\n“就刚才。”\n\n“……刚才？”\n\n“嗯。王伊说班委是服务者，我一听，感觉这东西好像也没那么烦人。”\n\n他说得很认真。\n\n“不过那个女生讲得确实比我像样。”\n\n“你连稿都没写。”\n\n“那倒也是。”\n\n班会结束后，后排那男生那局游戏似乎也终于要结束了。\n\n因为我听见他长长地叹了一口气。\n\n“寄了。”\n\n朱铭回头看向他。\n\n“同学，你刚才一直在打游戏？”\n\n“对啊。”\n\n程昕亮把手机往兜里一塞，表情相当坦荡。\n\n“那你还顺手投个票？”\n\n“这不是公民权利、天赋人权嘛。”\n\n“你还知道天赋人权？”\n\n程昕亮没好气地白了朱铭一眼。\n\n“哥们，我是打游戏，不是文盲。”\n\n朱铭愣了一下，竟然没能立刻接上话。\n\n我在旁边差点笑出来。\n\n“同学，贵姓？”朱铭问。\n\n“免贵，程昕亮。”\n\n他说。\n\n“日斤昕，明亮的亮。”\n\n现实是，这位程昕亮同学在短短一个班会中，就完成了从“祖安十年双亲在”到“关键一票定乾坤”的华丽转变。\n\n虽然这个转变怎么看都像滑倒时顺便做了个托马斯全旋。\n\n……\n\n第二天中午，我们是在木兰食堂看见的谷懿。\n\n准确地说，是朱铭先看见的。\n\n当时我正端着餐盘找空位，朱铭停住脚步，眼睛直勾勾地看向靠窗那排桌子。\n\n“我草。”\n\n我被这突如其来的一句国粹吓了一跳，手里的餐盘差点没稳住。\n\n“铭哥，你能别老这么一惊一乍的吗？我午餐差点就喂给地板了……”\n\n朱铭完全没有理会我的不满，反而用更大的分贝，甚至略微颤抖的声音说：\n\n“快、快！快看！这不那个谁吗！？”\n\n我顺着他手指的方向看过去。\n\n靠窗的位置上，一个卷发男生正低头啃着韭菜盒子。\n\n脑子里嗡的一下。\n\n我和朱铭冲过去时，谷懿也注意到了我们。\n\n他抬头看向我们，表情先是一亮，随后立刻变成一种非常熟练的无辜。\n\n“哟！好巧。”\n\n朱铭把餐盘往他对面一放，我也跟着坐下，椅子腿在地上拖出一声刺耳的响。\n\n“巧你大爷。”\n\n谷懿身体往后一缩。\n\n“铭哥，食堂公共场合，注意文明。”\n\n“你还知道文明？”\n\n朱铭坐下后，指着他。\n\n“我们给你发消息，你不回；去你寝室找你，你舍友说你桌子都清空了；朋友圈倒是发得挺勤快。你这属于什么行为？”\n\n“文学意义上的归隐？”\n\n“我看是存在意义上的找死。”\n\n“这次我同意朱铭同学。”\n\n旁边响起一个声音。\n\n我这才发现，坐在旁边的还有一位熟人。\n\n陈小云面前摆着一碗面，筷子停在碗沿上。\n\n“小云，你怎么也这样？”\n\n“因为你确实很欠揍。”\n\n陈小云的语气很淡定，也没有提高音量。\n\n谷懿却像是被那几个字狠狠呛了一下。\n\n他摸了摸鼻子。\n\n“好吧好吧，我承认，这件事是我考虑不周。”\n\n“只是考虑不周？”\n\n我坐到旁边，看着他。\n\n谷懿又咬了一口韭菜盒子，口齿不清地辩解道：\n\n“那不然呢？总不能上升到道德败坏吧。”\n\n“可以考虑。”\n\n谷懿顿时咳了一下。\n\n“你们这群人怎么军训完以后攻击性变得这么强。”\n\n“因为我们真的军训了。”\n\n“不像某些人，主席台上输出完，转头就去外边潇洒。”\n\n这句话落下后，谷懿脸上的笑稍微淡了一点。不仔细看，大概会以为他只是被韭菜呛到了。\n\n“我也不是去潇洒。”\n\n“去了趟夏口，又在周边转了转。”\n\n“夏口？”\n\n“嗯。”\n\n谷懿看了我一眼。\n\n“朋友圈不是发了吗？长江大桥不认识啊！”\n\n“只发照片，不回消息，这是什么新型社交礼仪？”\n\n“叫保持神秘感。”\n\n“我看你是保持挨揍感。”\n\n谷懿笑了笑，没有继续接这句。\n\n学校对谷懿的处理，比我们想象中轻得多，这一反差甚至让我们觉得有些……没劲？\n\n谈话，检讨，停训。\n\n检讨交了。\n\n只不过……\n\n“现代科技也是人类自身的一部分，就像石器和青铜器不过是人四肢的延伸一样。”\n\n“你用AI写的？”\n\n“措辞不要这么狭隘。”\n\n朱铭被气笑了。\n\n陈小云听完后，眉头微微皱起来。\n\n“你真的觉得这样没关系吗？”\n\n谷懿的手指在纸巾边缘停了停。\n\n“检讨本来就不是写给别人看的。”\n\n“如果他们想要的是一个悔过的姿态，那我给他们一个格式正确的姿态。这样对彼此都省时间。”\n\n“我不是说检讨。”\n\n谷懿没有立刻接话。\n\n木兰食堂中午人很多，取餐口那边不断有人刷卡、端盘、喊同伴占座。油烟和饭菜味混在一起，把整个空间熏得热闹又迟钝。\n\n我把谷懿离开之后的事大概说了一遍。朱铭在旁边补充，补着补着就开始对张迪进行带有东北地方特色的问候。\n\n袁林修转身慢半拍，张迪抓着不放；诊断单上的“建议减少剧烈运动”被反复拿来挑刺；朱铭替他说话，被一起罚；张迪推搡同学时那句轻飘飘的“纠正动作”；还有后来我们怎么去联系其他同学，怎么把几个人的说法凑到一起，怎么在食堂门口遇见毛锐，又是怎么硬着头皮开口。\n\n朱铭说得并不完整。\n\n可有些事，越是不完整，越能让我们回忆起当时的心情和处境。\n\n这一次，谷懿居然没有插科打诨。直到朱铭再想不出什么该说的话时，他才重新抬起头。\n\n他看了看朱铭，又看了看我。\n\n“可以啊。”\n\n“孩儿们终于长进了，为父很欣慰。”\n\n“你再占便宜试试？”\n\n朱铭立刻瞪眼。\n\n谷懿咳了一声。\n\n“我的意思是，不枉我当日在主席台上含辛茹苦，以生命为代价唤醒诸位沉睡的灵魂。”\n\n“你那叫装逼不成被反杀。”\n\n“叙事角度不同。”\n\n谷懿笑了一下，很快又收了回去。\n\n“张迪那小子，学校怎么说的？”\n\n“没正式说。”\n\n朱铭冷笑了一声。\n\n“就说教官临时有安排，后面换了个人，不过本来也只剩最后一天汇演了。”\n\n“那表面上就是赢了。”\n\n朱铭皱了皱眉。\n\n“什么叫表面上？”\n\n“人换掉了，后面没人再被他罚，这当然算赢了一点。”\n\n谷懿把纸巾揉成一团，放在餐盘边上。\n\n“可如果他们连一句正式说明都没有，那这件事就相当于根本没有发生过。”\n\n这句话说完，桌边没人立刻接话。\n\n朱铭张了张嘴，最后只皱着眉问：\n\n“那不然呢？”\n\n谷懿没有立即回答，反而说起了别的事情。\n\n“我在夏口看到一座废弃的建筑。”\n\n“门口的墙上还留着标语，不过字都快掉完了。旁边就是现代城市的车水马龙，却没有几个人会停下来看那堵墙。”\n\n我们显然都没明白他想表达什么。\n\n“停停停！你梦到什么说什么？”\n\n“有些东西只要换个名字、刷层新漆，再换个招牌，人们就会以为它不一样了。”\n\n陈小云握着筷子的手轻轻收紧了一点。\n\n我还是没完全听懂。\n\n但谷懿没有继续解释，而是重新换回那副欠揍的表情。\n\n“总之，我平安归来了。”\n\n“为了庆祝这个伟大的历史时刻，你们是不是应该请我喝杯奶茶？”\n\n朱铭盯着他看了足足三秒。\n\n“我请你喝拳头行不行？”\n\n“铭哥，你这个人就是太暴力。”\n\n“你再说一句？”\n\n“我说奶茶可以少糖。”\n\n陈小云低头夹起一把已经坨掉的面。\n\n她没有笑。\n\n但我好像看见她嘴角微微动了一下。\n\n……\n\n军训结束后，云梦的夜晚终于不再像白天那样咄咄逼人。\n\n河西的大学城安静地躺在夜色的笼罩下，蝉鸣似乎因意识到夏天即将离去而显得有些有气无力。\n\n书院大门外就是大学城。便利店、奶茶店、烧烤摊和水果店挤在两侧，把夜晚照得很亮。电动车从路边掠过去，外卖箱上的反光条一闪一闪，孜然和辣椒面的味道黏在空气里。\n\n我走进一家便利店，想买瓶冰水。\n\n门口的感应门开合着，冷气被人流带出几分。我正要进去，里面先走出一个女生。\n\n她抬头时，正好和我撞上视线。\n\n看见她的瞬间，我才想起那把米黄色旧伞还放在宿舍。\n\n我一直没找到合适的机会还给她。\n\n“这么晚还出来？”\n\n“学姐不也是吗？”\n\n“寝室楼下的自动售货机又空了。”\n\n我看了眼她手里的冰镇矿泉水。\n\n“你呢？”\n\n“我……散步。”\n\n霍学姐没有追问。\n\n她走到我旁边，很自然地和我同行。\n\n“听说班委竞选结束了？”\n\n“嗯。”\n\n我把结果简单说给她听。\n\n王伊当了班长，李向阳当了学习委员。程昕亮同学在全程开麦骂队友的情况下，用一句“服务员比领导听着顺耳”投出了关键一票。还有一个我不知道名字的高马尾女生，当场说自己没有投票。\n\n讲到最后，我很诚实地补充了自己第一轮弃权、第二轮被迫举手的光荣事迹。\n\n霍学姐听完后，评价非常简洁：\n\n“挺像你。”\n\n“这算夸奖吗？”\n\n“不算。”\n\n她回答得很快。\n\n我叹了口气。\n\n“至少稍微犹豫一下吧，学姐。”\n\n“可你刚刚不才为犹豫后悔吗？”\n\n我无法反驳。口才这一块，我和霍学姐之间还差着好几个大段。\n\n大学城路边种着一排香樟，树下停着很多共享单车。有一辆倒在最外侧，车筐里还塞着半张被揉皱的宣传单。\n\n“不过那个女生做得很对。”\n\n霍学姐说。\n\n“哪个？”\n\n“说自己没有投票的那个。”\n\n“哪里对？”\n\n“没有放弃自己的投票权，没有沉默着被别人代表。”\n\n她低下头，看着前面的路。\n\n“这一点已经超过大多数人了。”\n\n当时我只是觉得那个同学有点较真。现在被霍学姐这么一说，又觉得“较真”这个词好像太轻了些。\n\n我们沿着路边继续往前走。河西的大学城安静地躺在夜色里，蝉鸣断断续续。\n\n有一会儿，我们都没有说话。\n\n我本来想让这段沉默就这么过去。可越往前走，心里那点东西越像鞋底沾住的一小块砂砾，不疼，但一直在。\n\n“学姐。”\n\n“嗯？”\n\n“你觉得尹渊这个人怎么样？”\n\n霍学姐的脚步慢了半拍。\n\n“怎么问起他？”\n\n我把查寝那天的事简单说了一遍。\n\n说他说起物竞，说起黑幕，说起那篇理论力学文献，又说起我后来真的去查资料、推公式、整理了一堆东西，最后却像把球传给一个根本没有站在场上的人。\n\n随着我的抱怨渐入佳境，周围的稀疏蝉鸣就被我盖去。\n\n霍学姐一直慢慢往前走，步子不快，像给我留着把话说完的时间。\n\n“所以你很在意？”\n\n她问。\n\n“也不是在意他。”\n\n我想了想。\n\n“就是觉得挺丢人的。”\n\n“哪里丢人？”\n\n“他说那些话的时候，我反驳不了。”\n\n我看着前面的路。\n\n“我好不容易准备了一堆东西，结果也没什么用。”\n\n这句话说出口后，我自己都觉得有点没出息。\n\n像一个小学生认真写完作业，结果老师连本子都没收。\n\n霍学姐没有笑我。\n\n“那你想怎么办？”\n\n“我想超过他。”\n\n这句话出来得比我预想中更快。\n\n我顿了一下。\n\n“至少下次不会再被人这样轻易地看不起。”\n\n霍学姐安静了一会儿。\n\n“这听起来像一个会把自己累坏的目标。”\n\n“可我现在好像也没有别的目标。”\n\n“那就以这个为目标吧。”\n\n她说。\n\n“只是弦别绷太紧，小心断掉。”\n\n这句话差点被路边的噪音盖过去。\n\n她的手指在矿泉水瓶盖上停了一下。塑料瓶被她握出一声细小的动静。\n\n“学姐也有绷太紧的时候吗？”\n\n话说出口后，我自己先愣了一下。\n\n因为它听起来有点越界。\n\n霍学姐也停了一瞬。\n\n“会啊。”\n\n她转头看我。\n\n“所以我才出来买冰水。”\n\n我愣了两秒。\n\n“这两件事之间有逻辑关系吗？”\n\n“有。”\n\n“什么逻辑？”\n\n“人在快断掉之前，需要补充水分、降低热量。”\n\n我差点被她这本正经的胡说八道骗过去。\n\n“学姐。”\n\n“嗯？”\n\n“你这些话，听起来不像班导该说的。”\n\n“班导也有下班时间。”\n\n“原来如此。”\n\n“你得给加班费，我才能加班噢。”\n\n我们走到路口时，红灯亮着。\n\n几辆电动车停在斑马线前，外卖员低头看手机，车把上还挂着一袋夜宵。\n\n这个城市的夜晚，明明一点也不浪漫。\n\n可红灯亮在路口，车流从我们面前一辆接一辆地过去，像是把整条街道分成了两半，一半向前、一半留在原地。\n\n我站在那道红光前，脑子里还残留着刚才那句“超过他”。\n\n红灯的数字一秒一秒往下跳。\n\n“半个月后百团大战。”\n\n她装作漫不经心地说。\n\n“你记得来。”\n\n“百团大战？”\n\n“社团招新。”\n\n“噢。”\n\n她对我的回答相当不满意。\n\n“只是噢？”\n\n“我会去的。”\n\n“真的？”\n\n“真的。”\n\n“那到时候别又不做选择。”\n\n“学姐，你现在是在嘲讽我今天弃权吗？”\n\n“不是。”\n\n她似乎很认真地想了想。\n\n“不止今天。”\n\n绿灯亮了。\n\n电动车先一步滑出去，行人跟在后面，白色斑马线被车灯照得一截一截发亮。\n\n走到路中央时，她突然问：\n\n“你打算一直这么叫我吗？”\n\n我一时没反应过来。\n\n“什么？”\n\n“[霍学姐]。”\n\n风从路口吹过，她的长发轻轻扬起，又落回肩侧。  \n\n不等我思考清楚问题背后的含义，绿灯已经开始闪烁。  \n\n我盯着她平静的侧脸，脑海里一片空白。\n\n也是在这时，我终于想起来。 \n\n我靠。\n\n我水还没买。"},{"title":"第二章：迟到的人","file":"第二卷/2、第二章.md","volumeTitle":"第二卷：在开始就立下的flag最容易折断","text":"粉笔在黑板上划过，沙沙作响。\n\n窗外的树叶被九月末的风吹得晃了几下，阳光从叶缝里落进教室，在前排同学的桌面上碎成一小块一小块。讲台上的老师正在讲《力学》的绪论，声音不急不慢，带着一点湘味普通话特有的圆润尾音。\n\n“物质的运动形式是多种多样的，其中，机械运动是最简单、最普遍的一种……”\n\n我坐在教室中间靠前的位置，一瞬间竟然生出了一种很奇怪的错觉。\n\n如果不是教室比高中宽敞太多，如果不是每个人手边都放着手机，如果不是旁边的朱铭正把水杯拧得嘎吱作响，我大概会以为自己仍然坐在某间高中教室里，听老师把已经熟到不能再熟的概念重新讲一遍。\n\n当然，高中老师不会在讲完一页课件之后就低头看一眼表，仿佛随时准备把我们这些刚入学的新生交还给宇宙的自由意志。\n\n大学老师和高中老师最大的区别，大概就在这里。\n\n高中老师像一位被命运安排到你人生里的临时监护人，恨不得连你早饭吃没吃都问一句。大学老师则更像是站在车站广播里的声音，提醒你车已经到了，至于你上不上车、坐不坐反方向、会不会在半路睡过站，那主要属于你和人生之间的私人恩怨。\n\n《力学》前面的内容并不难。\n\n至少到目前为止，它和高中物理之间的距离，还没有远到需要我重新建立世界观的程度。位置、速度、加速度，质点，参考系，运动学方程。熟悉的概念换了一套更大学的包装，又被老师用一种更平缓的语气重新摆到我们面前。\n\n我低头看着课本，指尖停在下一节的标题上。\n\n那种熟悉感仍然有些微妙。\n\n车祸之后的那一个多月里，我在家里翻过不少“姜岚”留下来的东西。证书、草稿本、竞赛书、旧试卷，还有几本边角被磨得发白的物理资料。\n\n那些东西都安静地躺在那里，仿佛早就在等我承认它们属于我。\n\n可我每次看到它们，都如同看着一个陌生人的遗物。\n\n只是这个陌生人恰好和我同名，恰好用过同一双手，恰好把许多我现在需要的东西留在了身体里。\n\n老师讲到例题时，我把书往后翻了几页。\n\n“姜岚。”\n\n朱铭的声音从旁边传来。\n\n我抬头看他。\n\n他先看了一眼讲台，确认老师没有注意这边，才压低声音问：\n\n“老师刚才讲这些，对你是不是挺简单？”\n\n“还好。”\n\n“还好是啥意思？”\n\n“就是……能听懂。”\n\n“能听懂。”朱铭把这三个字重复了一遍，脸上的表情像是听见有人说“这道菜也就随便拿了个米其林三星”，“你们搞竞赛的是不是开局自带装备啊？”\n\n“也没有那么夸张。”\n\n“你别谦虚了。”朱铭看了一眼我翻开的页码，“老师讲第一页，你都快翻到第三章去了。照这么下去，你以后保研是不是也挺稳？”\n\n保研。\n\n这个词从朱铭嘴里蹦出来时，语气轻得像食堂窗口阿姨问“要不要加个蛋”。\n\n可它落到我这里，却像有一颗小石子被丢进了水里。\n\n我当然知道这个词。\n\n免试推荐研究生。成绩、排名、绩点、竞赛、科研、综合评价，这些东西会在大学四年里被拆成许多张表格、许多次考试、许多份材料，最后堆成一个看起来很体面的结果。\n\n可在朱铭提起之前，我从来没有认真把它和自己连起来。\n\n我只是模模糊糊地想过，不能再被尹渊那样轻飘飘地看低。至于要用什么方式赢回来，成绩、论文、竞赛、保研，还是别的什么东西，我并没有想清楚。\n\n朱铭这一句倒是很随意地替我把其中一条路指了出来。\n\n“现在说这个也太早了吧。”我说。\n\n“早啥啊？兵马未动，粮草先行。”朱铭一本正经，“我们东北人吃席前都知道，先看小孩坐哪桌。”\n\n上课铃就在这时响了。\n\n朱铭遗憾地闭上嘴，像一位被时代耽误的军事战略家。\n\n我低头看着课本，刚才那个词却还在脑子里多停了几秒。\n\n保研。\n\n我在心里把这个词默念了一遍，忽然觉得它比刚才课本上的任何一个公式都要陌生。\n\n……\n\n第二节课是高数。\n\n十点整，一个顶着红色短卷发的老太太抱着一叠材料走进教室。\n\n她的头发红得很坦荡，不是那种年轻人追求潮流的红，而是一种“我都这个年纪了还染红发，谁有意见也请憋着”的红。\n\n如果说人的发色能够体现一个人的精神面貌，那么这位老师大概是那种会把极限符号写成花体的人。\n\n“同学们好，我叫方小燕，从今天开始带你们的高数。”\n\n她把书放到讲台上，没有寒暄太久，很快拿出名单。\n\n“先点名。”\n\n教室里响起一阵翻书和挪椅子的声音。\n\n“沈婷。”\n\n“到。”\n\n“李畅。”\n\n“到。”\n\n“吴悠。”\n\n“到。”\n\n我听见这个名字时，下意识往声音传来的方向看了一眼。\n\n靠窗的位置，一个扎着高马尾的女生举了下手。动作很短，声音也不高。她放下手后就重新看向讲台。\n\n我很快收回视线。\n\n点名继续。\n\n直到方小燕念到一个名字。\n\n“程昕亮。”\n\n教室里没有人应声。\n\n方小燕抬起头，又念了一遍：\n\n“程昕亮。”\n\n仍然没人回答。\n\n教室里的空气出现了短暂的停顿。\n\n那种停顿很微妙，不是惊天动地的大事，只是大家忽然意识到，大学第一堂高数课居然真的有人没来。\n\n这就像游戏开局第一分钟，系统教程还没播完，就有人已经选择了退出战斗。\n\n方小燕皱了皱眉。\n\n“你们谁认识他，转告一下。第一节课都不来，后面如果也不想来，可以不用来了。”\n\n她的声音不高，却很清楚。\n\n“我的课不强迫谁听，但缺勤就是缺勤，挂科也是自己挂。”\n\n教室里更安静了一点。\n\n这句话听起来很严肃，却不太像威胁。更像一个见过太多学生从“我就缺一次”一路走到“老师我还能不能补救”的老教师，在事情刚开始时提前把结局摆出来。\n\n朱铭在旁边低下头。\n\n我原本以为他是在反思高数挂科对人类文明的严重威胁，结果余光一瞥，发现他正在桌子底下偷偷按手机。\n\n几秒后，他把屏幕往我这边偏了一下。\n\n私聊小窗里，他刚给程昕亮发了一条消息。\n\n【朱铭：哥们，你第一节课就敢逃啊？】\n\n没有回复。\n\n朱铭等了半分钟，又发：\n\n【朱铭：我敬你是个汉子，但是老师说你这节课不来以后也不用来了。】\n\n还是没有回复。\n\n他沉默两秒，默默把手机调成静音，然后拨了个电话。\n\n我被他这一整套操作震住了。\n\n如果说方老师是在进行开学第一课轰轰烈烈的查到大扫荡，那么朱铭此刻就像一名潜伏在敌后、冒着生命危险执行唤醒任务的地下交通员。\n\n好在这个过程并不算太久。\n\n电话接通的一瞬间，朱铭立刻挂断。\n\n他把手机塞回桌洞，坐直身体，表情正经得仿佛刚才什么都没有发生。\n\n方小燕已经开始讲函数和极限。\n\n我看着黑板上的符号，忍不住想：也就是说，那家伙第一节的早八力学课也没来……\n\n二十多分钟后，后门被轻轻推开。\n\n最先回头的是后排同学。\n\n然后这种回头像波纹一样，从教室后半部分慢慢传到前面。\n\n我也转过头。\n\n程昕亮赫然站在门口。\n\n他头发明显睡乱，黑色外套拉链只拉到一半，里面的睡衣领口歪着、露出来一角。一只手拿手机，另一只手拎着一杯豆浆。豆浆的吸管还插在杯盖上，看起来刚被喝过几口。\n\n他先睡眼惺忪地抬头看了一眼门牌，又扭头看向讲台，那略带朦胧的眼神像是在确认有没有拿错外卖。\n\n没有慌张。\n\n没有尴尬。\n\n也没有那种迟到学生常见的“老师对不起我来晚了”的歉意。\n\n他站在那里，状态自然得让我产生了一种错觉，仿佛迟到的不是他，而是整间教室都早到了。\n\n我强忍着没有打开手机确认一遍时间。\n\n时间当然没有姓“程”，方小燕停下了讲课。\n\n“程昕亮？”\n\n男生点了点头。\n\n他大概这才意识到自己手里还拿着豆浆，于是把豆浆往身侧藏了一点。\n\n这个动作本身很礼貌。\n\n但因为豆浆杯太显眼，藏了等于没藏。\n\n“老师，我过来跟你说一声。”他说，“以后上课不用管我，我自己学。”\n\n不是挑衅，不是装酷，也没有谷懿那种站到舞台中央前会先调整灯光的表演感。\n\n他真的像是在……通知一件普通事项。\n\n“外卖放门口了”。\n\n“明天下雨记得带伞”。\n\n“我以后不来上课了”。\n\n方小燕看着他。\n\n“你确定？”\n\n“嗯。”程昕亮说，“我不影响课堂。”\n\n教室里有人没忍住，从鼻子里漏出一声笑。\n\n朱铭整个人僵在座位上。\n\n他大概也没想到，自己那通电话没有把程昕亮召唤进课堂，而是召唤出了一份自学宣言，这份宣言于这节课堂的伟大程度，大概不亚于独立宣言之于北美洲。\n\n方小燕倒是很快恢复了平静。\n\n她把粉笔放回黑板边沿，声音仍然不高：\n\n“行。成绩自己负责。”\n\n说完，她转身继续讲课。\n\n程昕亮没有进来。\n\n他站在门口，像事情已经办完了，便轻轻把门带上，拿着那杯豆浆走了。\n\n门合上的时候，教室里安静了两秒。\n\n那两秒很奇妙。\n\n黑板上还停着极限符号，老师已经开始继续讲解，窗外的树叶也照常摇晃。\n\n朱铭慢慢把手机从桌洞里拿出来，看了一眼通话记录，又慢慢放回去。\n\n我第一次意识到，程昕亮这个人可能不是脸皮厚。\n\n脸皮厚至少说明你还知道脸皮这套系统存在。\n\n他更像是从一开始就没接入这套系统。\n\n“我就说这个世界上有伪人存在吧。”\n\n朱铭凑过来小声说道。\n\n……\n\n高数课下课时，已经快到午饭时间。\n\n所有人的动作都变快了。\n\n大学课堂下课前后的气氛很有意思。\n\n上课时，大家还勉强维持着对知识的尊重；下课铃一响，知识立刻输给碳水化合物，而且败得非常彻底。\n\n就在全班同学即将奔向食堂的时候，王伊站到了讲台旁边。\n\n“大家先等一下，占用两分钟。”\n\n这句话一出，教室里响起一阵非常轻微的叹息。\n\n不是不满，只是灵魂已经起身了，肉体却被通知拽回了座位。\n\n王伊手里拿着一叠刚打印出来的表，微卷的头发垂在肩边，脸上带着一点抱歉的笑。\n\n“物理学院这周有一个新生学术导航活动，主要是给大家介绍学院里的几个研究方向和课题组。通知刚发下来，每个班先推荐三名有兴趣、基础也比较合适的同学，晚上八点前要把纸质回执交到量子楼。”\n\n“量子楼？”\n\n后排有人重复了一遍。\n\n“就是研究生院楼那边。”李向阳翻着手机里的通知，补了一句，“通知里写的是‘优先推荐有科研兴趣和一定专业基础的新生’，不是全员报名。”\n\n他说得很淡定。\n\n但“不是全员报名”几个字一出来，教室里本来松散的气氛一下子有了点变化。\n\n刚才大家还只是想去吃饭，现在忽然有人开始重新坐直。\n\n也有人小声问：\n\n“这个去了有什么用啊？”\n\n“算综测吗？”\n\n“刚开学就科研兴趣，这东西能现编吗？”\n\n朱铭在旁边用不算小的声音说：\n\n“刚开学第一周就检测科研兴趣，这跟刚出生就问孩子以后想不想考公有啥区别。”\n\n我差点没绷住。\n\n王伊果然也听见了，笑了一下，但很快又把表往讲台上理齐。\n\n“应该就是先了解一下，不一定要马上做什么。通知里说先报三个人，要是没人想去的话，我就只能现场抓壮丁了。”\n\n有人已经背上书包准备走。\n\n朱铭用胳膊撞了我一下。\n\n“你去啊。”\n\n“我？”\n\n“不然呢？”\n\n朱铭看我的眼神像是在看一个面对现实世界的JK美少女却坐怀不乱的傻逼二次元。\n\n“你高中不是搞物竞的吗？这不正适合你？”\n\n王伊刚好听见这句。\n\n她抬起头，眼睛亮了一点。\n\n“姜岚，你之前参加过物理竞赛吗？”\n\n“参加过一点。”\n\n我本来想把这句话说得更含糊一点。\n\n比如“都是以前的事了”，或者“也不算什么”。这类话虽然没什么实际作用，但至少能把自己从讲台旁边那个越来越明显的位置上往后挪半步。\n\n问题是，教室里的空气已经不太允许我往后挪了。\n\n前排有人在收拾书包，后排有人把手机揣进兜里，食堂方向仿佛已经提前传来了召唤。\n\n所有人的行为大概都在表达同一个意思：\n\n这事挺好。\n\n你去。\n\n我们吃饭。\n\n王伊把一张表递过来，笑着说：\n\n“那你要不要先填一个？反正只是去听介绍。”\n\n我看了一眼朱铭。\n\n朱铭用眼神告诉我：兄弟，组织已经决定了。\n\n李向阳也看了眼通知。\n\n“竞赛经历可以写上。”他说，“通知里让附一个简单说明，奖项名称最好写完整。”\n\n奖项名称最好写完整。\n\n这句话很普通。\n\n普通到它完全不该让我停顿。\n\n可我看着那张表，指尖还是在笔杆上微微收紧了一下。\n\n表格上几栏印得很清楚。\n\n姓名。\n\n学号。\n\n联系方式。\n\n兴趣方向。\n\n竞赛或科研经历。\n\n这些东西都可以填。\n\n因为它们都是真的。\n\n至少在这个世界的材料里，它们是真的。\n\n车祸后在家休养的那段时间，我见过那张证书。红色封面，透明塑封，角上压着一道不太明显的折痕。上面写着全国中学生物理竞赛省级二等奖。\n\n二等奖。\n\n不是传奇小说里那种一出现就横扫全国、从此开启学神人生的金色传说。\n\n但对一个刚入学的大一新生来说，已经足够让旁边的人说一句“挺厉害”。\n\n我拿起笔，在那一栏写下：\n\n全国中学生物理竞赛省级二等奖。\n\n写完之后，我看了两秒。\n\n字迹是我的。\n\n经历也是“姜岚”的。\n\n可那一瞬间，我总觉得自己像是在替一个没有到场的人补签。\n\n要是刚才也有人替程昕亮补到就好了……\n\n“这样就行。”李向阳看了一眼。\n\n他说完，自己也拿了一张表。\n\n“我也报一个吧。”他把笔帽拔下来，“课题组介绍这种东西，先听听不亏。”\n\n这句话说得很李向阳。\n\n不是兴奋，也不是冲动，更像是在菜市场看见某样东西价格合适，于是决定先买一份。\n\n王伊接过表，看了一眼，笑着说：\n\n“谢谢。我们班终于有两张表能交出去了。”\n\n明明我只是普通地报了个名，眼下自己却有一种拯救了班级行政效率的错觉。\n\n“不是要三个人吗？”\n\n朱铭提醒道。\n\n王伊点了点头，目光又扫向台下。\n\n这时，不知道谁喊了一句：\n\n“程昕亮啊。”\n\n王伊眨了眨眼。\n\n“他本人不在吧？”\n\n“此言差矣！他人不在，但是精神很在。”\n\n想不到朱铭也会跟着一起“陷害”程昕亮。\n\n“他刚才不还亲自过来宣布自学了吗？这种学术导航对他来说是不是属于降维打击？”\n\n王伊拿着笔，有点犹豫。\n\n“这不太好吧？”\n\n李向阳看了一眼时间。\n\n“先写候选也行。”他说，“后面本人不愿意再撤。通知只说班级推荐三名，没说必须现在本人签字。”\n\n这句话一出来，朱铭立刻像拿到了通行证。\n\n朱铭立刻在手机上给程昕亮发去消息。\n\n【朱铭：学术导航，班级推荐你去。去不去？】\n\n没有回复。\n\n他又等了几秒，补了一句。\n\n【朱铭：不说话当默认。】\n\n依旧没有回复。\n\n朱铭把手机扣到桌上，神情庄重得像刚刚完成了一次民主程序。\n\n“默认了。”\n\n这回连王伊都没憋住笑。\n\n“那我先写候选。”她说，“回头我再问他本人。”\n\n她在第三张表上写下程昕亮的名字。\n\n我看着那三个名字被夹进同一个文件夹里，忽然想起第一章班会里那个高马尾女生站起来时的样子。\n\n她说，我没有投票。\n\n当时我只觉得那句话很直接。\n\n现在看着程昕亮被写上去，才觉得那句话似乎比当时听起来还要具体一点。\n\n不过这个想法刚冒出来，就被朱铭一句话拽回了地面。\n\n“走不走啊？再不走糖醋里脊就没了。”\n\n在糖醋里脊的重力面前，哲学思辨向来缺乏抵抗之力。\n\n……\n\n傍晚的时候，我原本打算去图书馆。\n\n白天那张表被王伊收走之后，我就没再想太多。\n\n下午还有一节公共课，老师照本宣科讲了半节课防范电信诈骗，另外半节课讲校园贷款，语气严肃得像我们这群刚开学的新生下一秒就会集体背上高利贷，从此踏上法制节目常驻嘉宾的不归路。\n\n从教学楼出来时，天已经暗了一点。\n\n路灯还没完全亮起来，水泥路面还留着白天晒过的余温。篮球场那边有人在叫喊，食堂方向飘来油烟味和炒菜声。\n\n我刚走到通往图书馆的岔路口，就看见王伊从另一边小跑过来。\n\n她手里抱着一个文件夹，跑得不快，像是怕里面的纸散出来。\n\n“姜岚！”\n\n我停下。\n\n王伊跑到我面前，稍微喘了口气。\n\n“你现在方便吗？”\n\n这句话听起来很不妙。\n\n一般来说，当一个班长在傍晚的路口抱着文件夹问你“现在方便吗”时，你的人身自由已经处在了非常危险的状态。\n\n“怎么了吗？”\n\n她把文件夹递过来一点。\n\n“这个是上午那个新生学术导航的回执，八点前要交到量子楼一楼值班室。我本来想自己去，但是女生宿舍那边还有几张表没收齐，辅导员刚刚又在催。”\n\n她说到这里，又看了一眼手机。\n\n“你不是也报名了吗？如果不太耽误你的话，能不能帮我送一下？”\n\n不是命令，也不是把麻烦砸过来。\n\n但她抱着文件夹站在那里，连“没关系，我再想办法”这种后路都已经写在脸上了。\n\n我看着她手里的文件夹，又看了看自己空着的手。\n\n话都说到这份上，再拒绝就显得我不是不通人情，而是不通人性。\n\n“可以。”\n\n“谢谢，真的救命。”\n\n王伊把文件夹递给我，像终于把一块烫手但又不能表现得烫手的东西放下了。\n\n“辅导员说交到量子楼一楼那边，好像有研究生助管收。你要是找不到人，就给我发消息，我再问问。”\n\n“好。”\n\n“麻烦你啦。”\n\n她朝我笑了一下，很快又抱着剩下几张表往女生宿舍方向跑去。\n\n我低头看着手里的文件夹。\n\n塑料封皮有点硬，里面那叠纸被夹得很整齐。我的名字就在其中一张上。\n\n上午写下那行“省级二等奖”时的感觉又短暂地浮上来一下。\n\n不过这一次，它很快被另一件更现实的事盖过去了。\n\n量子楼在哪来着？\n\n……\n\n事实证明，云梦师大的校园地图在手机上看起来很友好，落实到现实里就不一定了。\n\n手机导航告诉我，量子楼距离当前位置只有八百米。\n\n八百米。\n\n这个数字听起来很亲切，甚至让我想起体育中考。可当我沿着路走到一半，发现前面出现一长段上坡路时我立刻意识到，导航软件对“距离”的理解和人类双腿对“距离”的理解之间，存在不可调和的矛盾。\n\n艰难地爬上这道长长的坡道，灰白色的建筑已经出现在一旁。\n\n路边树影很深，楼里的灯一格一格亮着。有的窗户后面有人低头看着电脑，有的窗户上贴着安全须知和禁止吸烟的标识。\n\n这里离教学区不远，却像换了一种声音。人少了，脚步声也变得清楚。\n\n量子楼大门就在前面。\n\n楼门口的玻璃映着路灯，里面亮着白色的光。\n\n我走过去，拉了一下门。\n\n没动。\n\n我又试了一下。\n\n还是没动。\n\n门旁边有一个刷卡器。\n\n我看着它，它也沉默地看着我。\n\n这时我才意识到一个非常朴素的问题。\n\n王伊说的“一楼值班室”，确实在一楼。\n\n但她没告诉我有门禁。\n\n我抱着文件夹站在门口，忽然有点不知道自己的身份是什么。\n\n送材料的人？\n\n迷路的新生？\n\n还是一名被门禁系统拒绝在科研之外的科研人员预备役？\n\n我拿出手机，正准备给王伊发消息，身后传来脚步声。\n\n“同学，进不去？”\n\n我回过头。\n\n一个男生站在台阶下，一手拿着一杯咖啡，一手拎着一个便利店袋子，肩上背着电脑包。\n\n他看了一眼我怀里的文件夹，又看了一眼门禁。\n\n“我来送物理一班的新生学术导航回执。”我把文件夹抬起来一点，“说是交到一楼那边。”\n\n他低头扫了一眼文件夹封面。\n\n“哦，这个。”他说着走上台阶，“今晚正好是我帮忙收。”\n\n他把袋子换到另一只手，拿出卡来刷了一下。\n\n门禁轻轻响了一声。\n\n他拉开门，回头看我。\n\n“进来吧，我正好上去。”\n\n我抱着文件夹，跟在他身后走进量子楼。\n\n门在身后合上。\n\n白色灯光落下来，走廊里有一点咖啡和打印纸混在一起的味道。\n\n我低头看了一眼文件夹边缘露出的那张报名表。\n\n第一页上是我的名字，下面是李向阳，再下面是程昕亮。\n\n程昕亮那一栏后面还用铅笔写着“待确认”。\n\n他大概还不知道，一天之内，他已经两次作为被告缺席审判了。"},{"title":"第三章：人情世故","file":"第二卷/3、第三章.md","volumeTitle":"第二卷：在开始就立下的flag最容易折断","text":"程昕亮没有来。\n\n活动负责人点到他名字的时候，没人应声。\n\n她又看了一眼名单，确认自己没有念错。旁边几个人抬了下头，很快又把视线收回去。\n\n我下意识看向李向阳。\n\n李向阳摇了摇头。\n\n负责人在名单旁边做了个记号。\n\n“那我们先开始。缺席的同学后面如果还有兴趣，可以再关注学院通知。”\n\n就这样？\n\n我靠，原来还可以这样？\n\n相比之下，我显得格外缺乏想象力。\n\n负责带队的是一位姓周的学姐。她把名单夹进文件夹里，又把几张临时访客挂牌分给我们。\n\n“今天主要是参观，不涉及实验操作。能看的地方不多，大家跟着走就行。实验室里有些屏幕和白板不要拍照，老师和师兄师姐在工作的话，也请注意礼貌。”\n\n我把访客挂牌挂到脖子上。\n\n上面印着“新生学术导航”几个字。\n\n周学姐领着我们往电梯口走。\n\n“量子楼主要是学院的科研办公楼。除了量子方向，也有凝聚态、光学、理论物理、计算材料这些课题组。你们刚入学，先知道大概有哪些方向就可以。”\n\n电梯勉强装下我们这一小队人。\n\n门合上后，靠里面的几个同学仍在低声说话。从他们话里，我才慢慢拼出来，除了我和李向阳，剩下几个人大多是物理学院那边的。\n\n李向阳看着电梯上跳动的数字，压低声音问：\n\n“你之前了解过这些方向吗？”\n\n“了解过一点名字。”\n\n“哪些？”\n\n“量子、凝聚态、光学……还有天体物理。”\n\n“计算材料呢？”\n\n“今天之前，我对它的了解主要来自字面意思。”\n\n“字面意思？”\n\n“用计算机算材料。”\n\n李向阳看了我一眼。\n\n我知道这个回答非常像废话。\n\n但它至少没有错。\n\n参观的第一站是走廊尽头的成果展示墙。\n\n展板上贴着课题组简介、论文封面、会议照片，还有一些我看不太懂的图。彩色晶体结构像被人用积木搭出来的几何玩具，旁边却配着密密麻麻的英文和公式。\n\n某张海报下方写着“第一性原理计算”。我盯着那几个字看了几秒，确认自己每个汉字都认识，但合在一起就不知道是什么意思了。\n\n周学姐介绍说：\n\n“这个方向大致可以理解为用物理模型和计算方法研究材料性质。比如稳定性、电子结构、磁性、催化性能这些。你们现在不用急着搞懂，很多内容要等后面学了量子力学、固体物理才会慢慢接上。”\n\n戴黑框眼镜的男生小声说：\n\n“听起来好像真是在做科学。”\n\n刚才一直靠在展板边缘的男生接得很快：\n\n“废话，这里本来就是科研院楼。”\n\n“不是，我是说，和上课不一样。上课就是老师把答案讲给你，做科研更像是自己在找答案。”\n\n这句话说完，几个人都往那几张海报上多看了一眼。\n\n我也跟着看了过去。\n\n我有点想说“我也这么觉得”。\n\n可话到嘴边，又觉得自己贸然插进他人的对话有点奇怪。\n\n走廊另一侧是一间学生办公室。\n\n门半开着，里面有人戴着耳机看电脑。靠墙的白板上写着几行公式，旁边画着一个箭头和一个被圈起来的问号。\n\n高中时期在教室里学物理，黑板上的公式总有答案。题目问什么，解法在哪里，最后算到几，都像一条事先铺好的路。\n\n可这里的白板不一样。\n\n它看起来像是有人走到半路，发现前面没有路，于是在墙上临时画了一条。\n\n“这里不要进去，我们在门口看一下就好。”\n\n经周学姐提醒，我把刚刚往前挪出的半步又收了回来。\n\n李向阳没有往里面看太久。\n\n“学姐，如果本科阶段想提前了解课题组，一般是看学院通知，还是自己联系老师、师兄师姐比较合适？”\n\n周学姐想了想。\n\n“正式的本科生科研训练一般不会太早。后面会有大学生创新训练项目，也有老师自己的组会和讨论班。大一的话，建议先把基础课学好。如果特别感兴趣，可以先听公开讲座，或者找师兄师姐问问。”\n\n李向阳点头。\n\n“明白，谢谢学姐。”\n\n参观继续往里走。\n\n量子楼不像教学楼那样热闹，也不像图书馆那样安静。它的声音很碎：打印机、键盘、空调，还有办公室里压低的讨论声。\n\n这些声音混在一起，反而让我觉得这里比那些宣传栏上的大词更接近“科研”。\n\n走到一间办公室外时，周学姐停了下来。\n\n“这里是刘克学老师课题组的学生办公区，刘老师组主要做计算材料模拟。里面师兄师姐还在工作，我们就在外面看一下吧。”\n\n办公室门没有关严。\n\n里面几排工位挨得很近，电脑屏幕上有晶体结构图，也有打开到一半的代码窗口。有人低头改图，有人在白板前和同伴小声说话。\n\n我正准备跟着队伍离开，继续往前走，里面有人抬头看了过来。\n\n那人一眼就认出了我。\n\n“你是昨天来送回执的同学吧？”\n\n我也愣了一下。\n\n徐磊。\n\n“姜岚，对吧？”\n\n“嗯。徐师兄好。”\n\n我说完才发现，自己这个“师兄好”比昨天熟练多了。\n\n人类真是一种适应性很强的生物。\n\n只要一个人帮你刷过一次门禁，他就会从“陌生人”迅速进化成“可以叫师兄的人”。\n\n周学姐看见徐磊。\n\n“徐师兄，你在就正好。刘老师组这边能不能简单给他们介绍一下？我怕我说不准确。”\n\n这句话说得很朴素，也很诚实。\n\n我对周学姐的好感立刻上升了一点。\n\n徐磊看了一眼我们这一小队人。\n\n“可以，不过别站门口堵着。往旁边靠一点。”\n\n我们于是往走廊侧边挪了挪。\n\n徐磊把咖啡放到窗台上，讲得很简短。\n\n“计算材料模拟，简单说就是用计算方法研究材料的结构和性质。你们现在看到的晶体结构、能带图、态密度图，后面学到量子力学和固体物理，会慢慢知道它们在说什么。”\n\n他看了看那几个明显听得很努力的新生，又补了一句：\n\n“现在不用急着懂。大一第一学期能记住几个名字就不错了。”\n\n戴黑框眼镜的男生问：\n\n“师兄，那这个方向需要很强的编程吗？”\n\n“需要。”\n\n徐磊回答得没有任何缓冲。\n\n那个男生明显噎了一下。\n\n徐磊又说：\n\n“不过刚开始不是让你写复杂程序。更多是学会用工具、看文献、改输入文件，知道自己为什么这么算。”\n\n“那是不是数学也要很好？”\n\n扎低马尾的女生问到。\n\n“够用就行。后面会慢慢补。不要一开始就被这些词吓到。”\n\n李向阳接着问：\n\n“如果只是想提前听听相关讨论，需要先看哪些基础内容？”\n\n“高数和力学先跟上。真想听的话，前面听不懂很正常，别急着下结论。”\n\n李向阳点点头，没再追问。\n\n徐磊又看向我。\n\n“你刚才在成果墙那边看了挺久。”\n\n“啊？”\n\n我完全没想到这个问题会突然落到我身上。\n\n“昨天回执上写了物竞。”他说，“对这些方向有兴趣？”\n\n我听见“物竞”两个字时，心里先是紧了一下。\n\n不过这一次，徐磊的语气里没有尹渊那种打量，也没有方小燕点名时的压迫。他只是顺手提起。\n\n“有一点。”\n\n我说。\n\n说完又补了一句：\n\n“就是看不太懂。”\n\n徐磊点点头。\n\n“看不懂正常。”\n\n他说完，拿起窗台上的咖啡。\n\n“一会儿活动结束，你回这里找我一下，我找你有点事情。”\n\n我愣了一下。\n\n不等我询问确认，对方就已经走回了办公室。\n\n徐师兄找我这个新生能有什么事？\n\n难道是我刚才盯着成果墙看的时间太长，已经被判定为“疑似科研楼可疑人员”？\n\n一部经典老电影的情节不由自主地浮现了出来：\n\n“少年，我看你骨骼清奇，我这里有……”。\n\n不过不等我思考清楚。\n\n队伍就继续往前了。\n\n旁边几个物理学院的同学似乎在交头接耳地说些什么。\n\n另一间实验室外面贴着“柔性电子材料与传感器件”。\n\n周学姐介绍时，里面正有人用镊子夹起一片薄薄的透明材料，放到灯下看。旁边的展示柜里有几块像皮肤贴片一样的样品，下面写着“可穿戴传感器”“电子皮肤”“人机交互界面”之类的词。\n\n刚才说“自己在找答案”的黑框眼镜男生立刻凑近了一点。\n\n“这个是不是能贴在手上测心率那种？”\n\n周学姐说：“有些可以测生理信号，也有做压力、触觉、人机交互的。具体分类很多，我也不敢乱讲。”\n\n扎低马尾的女生看着展示柜里那块薄片，声音低了一点：\n\n“感觉这个比刚才那个计算材料更像未来科技。”\n\n“因为它至少长得像未来科技。”另一个男生说，“刚才那堆图，我只看出了颜色很多。”\n\n几个人笑了一下。\n\n这个方向显然比“第一性原理计算”更容易让外行产生误解。\n\n至少我第一反应是：这东西看起来好像能贴在手上，然后让我进化成赛博三体人。\n\n当然，考虑到我现在连高数都还没学明白，赛博化进程暂时可以往后排一排。\n\n队伍从门口经过时，我看见靠窗的一张工位上放着一块小小的名牌。\n\n上面写着两个字：\n\n霍钰。\n\n我脚步慢了一拍。\n\n原来她的工位也在这栋楼里。\n\n不知道为什么，这个发现让我刚才那种“只是参观”的感觉，忽然变得没那么单纯了。\n\n活动结束时，周学姐把我们带回一楼大厅。\n\n那几个物理学院的同学已经重新围成一小圈。\n\n“我觉得刚才那个柔性电子挺有意思。”低马尾的女生说，“至少能看见东西，不像那堆能带图。”\n\n“你别急，等物理实验把你摁在示波器前面，你就会重新爱上看不见摸不着的东西。”\n\n靠在展板边缘的男生说：“我还是想去光学，感觉比较酷。”\n\n“先活过高数吧，兄弟。”\n\n我站在旁边，没能自然地加入他们。\n\n李向阳倒是和其中一个男生聊了几句，问的是公共课、培养方案、物理学院那边的相关政策。\n\n他的语气礼貌，问题也都很实际。\n\n同样，对方回答得也很礼貌。\n\n李向阳看了一眼时间。\n\n“你不是还要去找徐师兄？”\n\n“嗯。”\n\n“那我先回去了。”\n\n他说完，把访客挂牌交还给周学姐，先一步出了大厅。\n\n我又沿着刚才的路线，返回徐磊所在的办公室。\n\n越往回走，我越觉得刚才那句“找你有点事情”很微妙。\n\n如果只是普通通知，应该不至于特意让我活动结束后回来一趟。可如果真是什么很重要的事，徐磊刚才的语气又太随意，随意到仿佛只是问我要不要顺手帮他带一杯奶茶。\n\n当我重新回到办公室门口时，徐磊正坐在工位上聚精会神地敲着代码。\n\n我犹豫了一会后还是轻轻敲了敲门。\n\n对方听见后向我点了点头，示意到外面去说。\n\n“对我们课题组有兴趣吗？”\n\n我没想到他的开场如此直白。\n\n徐磊像是没打算等我解释，继续说：\n\n“刘老师组下周三下午有组会。你要是想参与一下真实的组会，或者对我们组感兴趣，可以过来旁听一下。”\n\n“我可以吗？”\n\n“只是旁听而已。”徐磊说，“你一个大一新生，能听懂多少算多少。”\n\n“好。”\n\n于是我们互相加了微信就道别了。\n\n……\n\n我刚走出量子楼。\n\n手机上就发来一条消息。\n\n【徐磊：下周三 15:00，量子楼410，小组组会。】\n\n后面又跟了一句：\n\n【徐磊：不用提前准备，听个大概就行。】\n\n我看着那两条消息，忽然觉得自己多了一件可以去做的事。\n\n不是被点名，也不是被推着交表。\n\n虽然这件事的开头，仍然来自一张别人替我填好的回执。\n\n我从量子楼出来时，天已经暗了下来。\n\n楼前的路灯刚亮，光落在水泥地上，还没来得及把夜色完全照开。\n\n远处教学楼的窗户一格一格亮着，几个背着书包的学生从台阶下经过，车棚那边传来自行车锁扣合上的声音。\n\n回宿舍的路上，我点开“知乎”，在搜索框里输入“计算材料模拟”。\n\n自动联想跳出来一串词：入门、软件、就业，以及一个非常破坏气氛的“计算材料模拟是天坑吗”。\n\n互联网真是一个善于毁灭浪漫的地方。\n\n我决定先假装没看见它，改搜“第一性原理计算”。结果第一篇介绍刚看了三行，“密度泛函理论”“交换关联泛函”“Kohn-Sham方程”就迎面打了一套组合拳。\n\n很好。\n\n刚才在量子楼里产生的那点浪漫，被科学本人一脚踢回了现实。\n\n但我没有关掉页面。\n\n我又搜了“计算材料模拟 入门 大一能看吗”。这个问题一打出来，我自己都觉得有点丢人，搜索框却很宽容，甚至贴心地给我补全了“零基础”“自学路线”“需要学什么软件”。\n\n我点开一个经验帖。楼主说先学Linux，再学Python，再学量子力学，再看固体物理，再学VASP。\n\n这条路不仅长，而且中途每隔几百米就埋着一个我暂时不会的东西。\n\n可我还是把它收藏了起来。\n\n只不过那时的我还以为，这只是一次很偶然的幸运。\n\n……\n\n云麓山脚下一家很小的粤菜馆。\n\n店面不大，门口挂着几串红色灯笼，玻璃门上贴着“烧鹅饭”“艇仔粥”“豉汁蒸排骨”的菜单。饭点过后，店里人少了许多，只剩下空调还在不太努力地工作，吹出来的冷气混着酱油和热汤的味道。\n\n“你托我留意的那个学弟，我今天见到了。”\n\n霍钰正用勺子把碗里的粥搅开。\n\n“姜岚？”\n\n“对，准确来说前两天就见过了。”徐磊拿起筷子，“看着挺老实的。”\n\n“老实？听上去不像是在夸人。”\n\n“那我换个词。”徐磊想了想，“有点憨。”\n\n徐磊夹了一块烧鹅。\n\n“我没跟他说太多，就让他下周来听一次组会。放心，我没说组里缺人，更没说你的事情。”\n\n“谢谢。”\n\n“先别谢。”\n\n徐磊话锋一转。\n\n“我丑话说前面。听组会没什么，但后面刘老师要是看上他，让他留下来做事，那就不是我能控制的了。”\n\n霍钰垂着眼，把粥里的葱花挑到一边。\n\n“我知道。”\n\n“你知道就行。”\n\n徐磊顿了一下，才接着说：\n\n“老刘这个人，表面上对学生挺客气，真用起人来可不含糊。大一新生什么都不懂，最容易觉得老师给机会就是看重自己。”\n\n霍钰手里的勺子停了一下。\n\n“磊哥。”\n\n“嗯？”\n\n“你当年大四保研来的时候，不也觉得这是机会吗？”\n\n徐磊被她噎住。\n\n过了几秒，他才叹了口气。\n\n“所以我现在才懒得给别人讲人生经验。讲了也没用。没真进去之前，谁都觉得自己不一样。”\n\n霍钰没有再说话。\n\n她把那碟烧鹅往徐磊那边推近了一点。\n\n徐磊看着她，忽然笑了一声。\n\n“你这顿饭请得挺有诚意啊。”\n\n“不够的话还可以再加一份。”\n\n“算了，别贿赂我。我最多帮你把人带到门口，后面怎么走是他的事。”\n\n霍钰点点头。\n\n“嗯。”\n\n店外有人骑着电动车经过，车铃响了一下，很快又远了。\n\n徐磊把最后一块烧鹅夹走，含糊不清地说：\n\n“不过你这个学弟吧，眼神确实像那种刚进大学的新生典型。”\n\n“哪种？”\n\n“觉得做科研的每个人都在改变世界。”\n\n霍钰低头笑了一下。\n\n“不好吗？”\n\n“挺好的。”\n\n徐磊把筷子放下。\n\n“就是容易被骗。”\n\n霍钰没有接这句话。\n\n桌上的手机屏幕亮了一下。\n\n徐磊看过去，是姜岚刚发来的消息。\n\n【谢谢徐师兄，我会准时到。】\n\n徐磊把手机转给霍钰看。\n\n“你看，还挺乖。”\n\n霍钰看着那行字，过了一会儿，才把手机轻轻推回去。\n\n“别逗他。”\n\n“我哪敢啊。”\n\n徐磊说着，熟练地旋开了手中啤酒瓶的盖子，向霍钰递去。\n\n“喝点？”\n\n“不了，我待会还有事情。”\n\n“这么忙还有空请我吃饭呢？”\n\n“能跟咱们徐博吃饭，是我的荣幸。”\n\n“停停停，你可别损我了，霍教授，我要是大三的时候有你这个成果，现在还至于在老刘这儿苦逼地干着吗？”\n\n霍钰笑着，也不还嘴，只又舀了一勺粥。\n\n热气从碗口升起来，很快散在空调风里。"},{"title":"第四章：重生爽文","file":"第二卷/4、第四章.md","volumeTitle":"第二卷：在开始就立下的flag最容易折断","text":"陈小云把草稿纸推过来的时候，我还在被《固体物理》的第三页折磨。\n\n【你在看什么书呀？】\n\n陈小云的字很娟秀，符合我的刻板印象。\n\n我低头看了一眼摊在面前的天书。\n\n书页上写着“晶格”“倒格子”“布里渊区”。\n\n我拿起笔，紧接着那行字下面回：\n\n【固体物理】\n\n晚上的图书馆很安静，只有翻书、敲键盘和笔尖划过纸面的细碎声响。\n\n我们面对面坐着，中间隔着两本书，和一张刚刚开始传递的草稿纸。\n\n【刚开学就这么努力呀（惊讶emoji）？】\n\n我看着桌上摆着的那瓶矿泉水，又想起了几个小时前的事情。\n\n……\n\n我站在量子楼四楼的走廊里。\n\n手机上的时间正好13:50。\n\n【410，到了给我发消息。】\n\n徐磊发来的消息停在聊天框里。\n\n我抬头确认了一下门牌号。\n\n没有“凡人止步”的结界，门只是虚掩着，传出几个人压低嗓子说话的声音。\n\n比我想象中更普通，普通到我差点以为自己走错了地方。\n\n会议室不大，前面挂着一块投影幕，长桌两侧已经坐了不少人。\n\n有人看着笔记本电脑，有人低头刷着手机。\n\n徐磊指了指靠后的位置。\n\n“你坐那儿就行。能听多少听多少。”\n\n很快，有人端着保温杯走进来。\n\n他五十多岁，头发稀疏，身材有些发福，穿一件浅色衬衫，袖口挽到小臂。进门时，他先看了一圈会议室，确认人到得差不多了。\n\n徐磊在我旁边压低声音说：\n\n“刘老师。”\n\n刘克学教授。\n\n我下意识坐直了一点。\n\n刘老师把保温杯放到桌上，目光扫过后排的我时，短暂停了一下。\n\n“这位是新来的同学？”\n\n刘老师的普通话能听出浓厚的方言味道，虽不标准却意外地有亲和力。\n\n“姜岚，大一新生。上次学术导航来过，对组里的方向很有兴趣。”\n\n徐磊替我解释到。\n\n“大一就愿意提前接触科研，挺好。”\n\n刘老师笑了一下。\n\n我赶紧说：\n\n“刘老师您好。”\n\n“坐，坐，随便听听就行。”\n\n他说完，翻开面前的本子。\n\n“那我们开始吧。”\n\n第一位汇报的是一个姓王的博士生。\n\nPPT标题很长，我只来得及捕捉到“辐照缺陷”“分子动力学”几个词。下一页上出现了一幅彩色的原子结构图，红点、蓝点和灰色小球挤在一起，看起来像某种被打乱的儿童益智玩具。\n\n但汇报的人显然没有把它当玩具。\n\n“这里我们设定了不同的PKA能量，观察位移级联结束后存活Frenkel pair的数量变化……”\n\n果然还是误闯天家了……\n\n后面的几页翻得很快。\n\n会议室里的其他人似乎都很认真地听着。\n\n有人低头记录，有人盯着图，有人偶尔提问一两句。\n\n我也低头装模作样地记录着。\n\n那句话怎么说来着？\n\n只要我不尴尬，尴尬的就是别人……\n\n每个人的汇报时间只有十五分钟，很快这位王师兄的PPT就只剩下最后一页致谢。\n\n“老师，我汇报完了。”\n他转头看向刘老师，等待对方的意见。\n\n“嗯，你这个项目做了多久了？”\n\n“额……大概是从七月份开始做的。”\n\n王师兄有些尴尬地站在原地。\n\n“嗯，进度虽然有点慢，但是成果还可以，后续要再加快进度。”\n\n“啊，好的老师。”\n\n“下一个谁？”\n\n另一位师兄走上了讲台。\n\n随着汇报的进行，我的困意也逐渐涌了上来。\n\n一开始我还能记得哪位师兄或师姐讲了什么内容，做的大概是什么课题，但随着汇报的人数越来越多，我已经分不清了。\n\n毕竟他们所讲的内容在我看来都是一样的。\n\n一样的听不懂。\n\n我只记得屏幕上不断出现彩色缺陷图、温度、能量、dpa，还有一些完全不明所以的英文缩写。\n\n“目前我们怀疑是统计口径的问题，也可能是势函数……”\n\n一位师兄在讲到模拟和实验结果的差异时，明显有些卡壳。\n\n一直盯着屏幕的刘老师突然说：\n\n“你这页主线还不够清楚。”\n\n师兄愣了一下。\n\n“老师，是指这张对比图吗？”\n\n“对。问题可以先保留，但项目汇报的时候，要让人先看懂你做了什么、现在推进到哪一步。细节太散，别人就不容易听懂。”\n\n师兄连连点头。\n\n“好的老师，我回去就改。”\n\n我在后面听着，不自觉地跟着点头。\n\n毕竟科研成果不只是要做出来，还要能讲出来，更要能让别人听懂。\n\n最好是能够让我听懂……\n\n这位师兄的汇报结束后，立即起身的是一位一直坐在窗侧的学姐。\n\n她身形偏瘦，黑发松松地束在脑后，几缕头发垂在黑框眼镜旁边，一件宽松的白T，耳机线还挂在衣领前。\n\n在她把自己的电脑接上投影的那一刻，会议室里有几个人明显换了坐姿。\n\n刚刚还在低头看手机的人抬起头，把手机倒扣到桌面上，有人把手重新放回了身前的键盘上，刘老师身边的一位看上去年龄不小的、半躺在椅背上的老师，这时竟也坐直了身子。\n\n投影幕上出现标题：\n\n《FeCrAl合金辐照损伤演化的多尺度模拟研究》\n\n汇报人：潘虹。\n\n没有多余的开场白：\n\n“今天主要汇报三个问题。第一，不同PKA能量下初级位移级联产生的缺陷数量；第二，退火阶段空位团簇和间隙原子团簇的演化；第三，模拟结果与实验TEM位错环尺寸分布之间的偏差。”\n\n她语速很快，快的让我几乎听不清她在说什么。\n\n第一张图是不同PKA能量下Frenkel pair数量变化。\n\n第二张是缺陷复合率。\n\n第三张是不同温度下空位团簇大小分布。\n\n第四张是FeCrAl合金里位错环的形成概率。\n\n有些数据表她只扫一眼就跳过去，有些图却会停下来，把横坐标、颜色和箭头分别解释一遍。\n\n我仍然大半都听不懂。\n\n但即便是再不敏感的人，也能看出她和前面几位汇报的同学的不同。\n\n潘师姐的PPT内容非常简洁，几乎只有图片和标题，唯一称得上长段的文字是图片下方的参考文献引用。\n\n但她却滔滔不绝地进行着“脱稿演讲”。\n\n不同于前面几位，讲完一页或一张图，眼神总要在刘老师脸上停留几秒，似乎是在等待对方的提问。\n\n她的演讲近乎忘我，目光从来没有离开过自己的PPT。\n\n直到讲到一张模拟结果与实验不一致的图时：\n\n“这里目前还有一个问题。模拟得到的位错环尺寸分布整体偏小，我怀疑是势函数对缺陷迁移能垒的描述不够准确，也可能和我们设定的时间尺度有关。”\n\n刘老师旁边的那位中年老师问到：\n\n“如果把统计范围扩大到所有缺陷团簇，会不会更接近实验？”\n\n“不会。”\n\n潘虹回答得很快，同时把PPT切到了下一页。\n\n“我已经试过。扩大统计范围会让总数更接近，但尺寸分布偏差仍然存在，而且会引入一部分不稳定的小团簇，反而把讨论弄乱。问题不在统计范围。”\n\n那位老师又问了一句：\n\n“那如果这部分先不和实验对比，只看趋势，能不能先写成一版结果？”\n\n 她短暂地停顿了一下。\n\n“可以写成阶段结果，但不能写成结论。”\n\n她把PPT往前翻了一页，又翻回来。\n\n“趋势是有的，机制还没确定。这个差别不能省。”\n\n这句话说完，会议室里安静了一瞬。\n\n“这个图后面再优化一下，展示效果还可以更好。项目汇报的时候，这部分可以重点讲。”\n\n刘老师开口道。\n\n“如果只是项目汇报，可以这么讲。但论文投稿的话，目前这里的问题还很大。”\n\n会议室里有人抬了一下头。\n\n“所以才让你继续往下做嘛。”\n\n刘老师笑了笑，端起保温杯。\n\n“这个项目后续还是你来牵头。”\n\n潘师姐轻轻点了一下头，把投影线拔下来，拿上电脑又回到靠窗的位置，低头敲起了键盘。\n\n组会继续进行着。\n\n徐磊师兄也进行了简短的汇报，似乎他私底下已经向老师汇报过进度了，所以只是简单讲了几句，刘老师就点点头示意了。\n\n会议室时钟上的分针转过一圈又一圈，我笔记本上的词汇也变得越来越多。\n\n【金属辐照】\n\n【位移级联】\n\n【Frenkel pair】\n\n【我到底为什么会在这里……】\n\n——这句显然不能算作组会笔记。\n\n……\n\n组会结束时，已经快六点。\n\n大家开始合电脑、收线、拿东西。\n\n我正准备背上书包离开，刘老师忽然扭头看向我。\n\n“小姜，麻烦你留一下。”\n\n我愣住。\n\n徐磊看了我一眼，表情没什么变化，只是把电脑包背到肩上。\n\n“去吧。”\n\n刘老师的办公室就在走廊另一侧。\n\n门进去后，里面比我想象中要宽。\n\n靠墙是书柜，书柜里放着奖杯、会议合影和几排装订好的项目材料。办公桌上堆着文件，旁边还有一小盆绿植，叶子被空调吹得轻轻晃。\n\n“坐吧。”\n\n刘老师指了指沙发。\n\n我原本以为自己只要站着说几句话，听到这句后有点不知所措。\n\n“别拘束。”\n\n他从旁边冰箱里拿了一瓶矿泉水递给我。\n\n“刚听完组会，感觉怎么样？”\n\n我接过水。\n\n“挺……好的。”\n\n明明刚才组会时内心有一万匹草泥马奔腾，此刻却词穷了。\n\n刘老师却宽容地笑了笑。\n\n“听不懂很正常。你才大一，要是一上来全听懂了，那才不正常。”\n\n我松了一口气。\n\n他把自己的水杯往旁边挪了挪。\n\n“徐磊跟我说，你高中参加过物理竞赛？”\n\n“嗯……”\n\n“不错。”\n\n他点点头。\n\n“竞赛生脑子一般不会差。你现在缺的不是能力，是方向。”\n\n我握着矿泉水瓶，瓶身的水雾沾到手心里。\n\n“我们这个方向，说复杂也复杂，说实在也实在。”\n\n他的方言版普通话，不聚精会神很难听懂。\n\n“核材料、辐照损伤、能源安全，这些都是具体的发展方向。国家有需求，工程上也确实有问题要解决。”\n\n我点头。\n\n刘老师说话慢条斯理。\n\n“不过你现在不用急，毕竟你才刚刚入学，但你愿意提前了解科研相关的东西，这对你肯定是很有好处的。”\n\n“很多本科生，直到大四做毕设的时候才开始接触科研，但只有半年多的时间，打个基础就不剩多少时间了，根本做不出什么像样的东西。”\n\n“你来得早，这是很大的优势。”\n\n【很大的优势。】\n\n我突然想到军训结束那天，自己站在台阶下时，手里那叠没有人愿意看的草纸。\n\n“你后面如果有兴趣，可以多来听听。先不说具体要做什么项目，可以先了解一下方向，看看师兄师姐们都在怎么做问题。”\n\n他说到这里，才像顺手补充一样提起：\n\n“不过，你以后不管是继续读研也好，找工作也好，有没有相关的科研经历，差别是很大的。”\n\n我听见“读研”两个字时，心里轻轻跳了一下。\n\n“老师，我怕自己基础不好，做不了什么。”\n\n一直小鸡啄米般点头的我第一次开口。\n\n“这个没有关系。”\n\n他摆摆手。\n\n“你现在才大一，跟徐磊他们肯定比不了，但是你跟你的同学相比，基础应该说是很好的。”\n\n我有些尴尬的笑了笑。\n\n“而且，我们课题组应该可以说是国内数一数二的，至少在辐照这个方向。“\n\n刘老师的语气很平淡，像是在说某件不值一提的小事。\n\n”我们课题组这两年发了不少顶刊，去年就发了一篇Nature，当时云梦师大也有报导，你应该也听过吧？“\n\n我赶紧点了点头，但说实话，我孤陋寡闻得很……\n\n”我们今年也发了一篇PRL，一作潘虹还只是硕士二年级的学生，保研到我们课题组才一年不到的时间，就发了一篇特别好的文章。“\n\n潘虹——\n\n刚才组会时汇报的那个师姐。\n\n尽管我并不了解发一篇PRL的难度，甚至连Nature和PRL是什么都不清楚，但我还是在连连点头中，记住了这个名字。\n\n”而且呢，我们组项目是非常多的，我们不是发愁没有项目，而是项目接的太多了，甚至都有些做不过来，呵呵。”\n\n说到这，刘老师也略显无奈地笑了笑。\n\n“所以后面，如果你真的加入进来，也会给你安排一些项目做，到时候该有的劳务费、补助，组里都会发给你。”\n\n我本来压根没想到钱。\n\n他主动提起时，我反而有些不好意思。\n\n“刚才组会上他们汇报的那些项目，很多就是他们自己的毕业论文。我们课题组的待遇是非常好的，硕士生每个月都能拿到一两千的补助，博士和博士后就更不用说了。”\n\n“像徐磊，不管他项目做的怎么样，组里每个月都给他发几千块，这还不算国家每个月两千八的补助。”\n\n他说得很自然。\n\n可我听得眼睛都快跌到地上了。\n\n“我们课题组的运营方式，就是用课题组的钱，供大家读书，帮大家发文章、获得文凭。”\n\n“而且我们平时也经常有出去开会的机会，全程的机酒，我们课题组都是报销的。像前段时间徐磊去川西开一个会，一分钱都没要他出，相当于组里花钱让你们出去旅游。”\n\n说到这，刘老师笑了起来。\n\n“所以在我们组里，只要认真做，一两年的时间内，发一篇很好的文章，是完全有可能的。”\n\n论文。\n\n保研。\n\n这些词原本离我很遥远。\n\n就像挂在学院宣传栏上的优秀毕业生大头照。\n\n“当然，这些都还不着急，你回去之后可以再好好思考一下。”\n\n他把话往回收了一点。\n\n“你觉得有兴趣，就多来。我们组应该说是给大家提供了一个很好的平台，只要你愿意努力，愿意学。”\n\n我用力地点了点头。\n\n但即便如此，我还是担心态度不够诚恳。\n\n“来，你过来看，今天我们又有一个博士生的论文被核材料期刊接收了，这已经是我们课题组今年第五篇核材料了……”\n\n……\n\n大概又过了一刻钟后，我从办公室走了出来。\n\n手里的矿泉水还完全没开封的机会。\n\n但这短短的十五分钟，我好像经历了一场人生命运的转变。\n\n我急于找到一些具体的词汇或是言语，来概括我此刻的心情。\n\n与此同时，走廊里的灯已经亮了。\n\n那一头的会议室门口，潘虹居然还站在门口和另一个人交谈着。\n\n我从旁边走过去的时候，潘虹忽然抬头看了我一眼。\n\n但她没有说话。\n\n于是我也只是出于礼貌微微点了下头。\n\n至于她眼神中的含义，那时候的我完全没能注意到——\n\n因为当时，我的脑海中只有一个念头在疯狂地大笑：\n\n我的青春重生爽文剧情，果然没问题~\n\n……\n\n师大的图书馆在校园主路的一侧。\n\n它不像量子楼那样新，也不像教学楼那样陈旧。\n\n浅色外墙和大片玻璃被路边的树遮去一半，老馆的轮廓还留着，西侧新扩出来的部分则亮得更干净。\n\n傍晚时分，入口前的台阶上不断形形色色的人经过。\n\n图书馆的座位需要提前在公众号上预约。\n\n公众号上有各个自习室的座位预约情况，绿色是空位，红色则代表已预约。系统还提醒，预约开始前后规定时间内要签到，否则座位会自动释放，预约者记为违规。\n\n我原本想选靠窗的位置。\n\n毕竟后排靠窗、王的故乡。\n\n可惜想当王的人疑似有点太多了：\n\n靠窗那排全红。\n\n翻了好几个楼层的自习室，都是如此。\n\n最后，我只好选了一个三楼、有插座的位置。\n\n……\n\n于是，就有了现在这一幕。\n\n穿着淡米色衬衫的陈小云就坐在我对面，黑发随意地扎成低马尾，几缕自然地落在耳边。\n\n【彼此彼此】\n\n将草稿纸传回去几秒后，陈小云嘴角微微上扬了一点。\n\n与此同时，我看清了她面前的书名。\n\n《共产党宣言》。\n\n书并不厚，纸页边缘有点发旧。\n\n我盯着那个书名多看了两秒。\n\n因为在我宿舍的书架上，好像也有一本。\n\n不过不是崭新的，纸边已经发黄，封面被磨得有些旧。\n\n【你想看这本书嘛？】\n\n我惊讶于女孩观察力之敏锐。\n\n【没，就是好奇多看了两眼】\n\n【好叭╮(╯-╰)╭】\n\n看到这行字时，陈小云本人似乎也像她画的小人一样嘟了下嘴。\n\n我一时有些犹豫了起来。\n\n虽然不知为何，但她似乎很想让我看那本书。\n\n【下次有机会的话，我会向你借的】\n\n“下次一定”是最经典的拒绝话术。\n\n于是，她没有再写。\n\n我们的“传纸条”游戏暂时告一段落，又重新低下头，看起各自的书。"},{"title":"第五章：一场考试需要证明实力","file":"第二卷/5、第五章.md","volumeTitle":"第二卷：在开始就立下的flag最容易折断","text":"当方老师捧着一叠白卷走进教室时，我虽不惊讶，却也有些紧张。\n\n早在几天前，方老师就宣布了月测的通知。\n\n在高中时，周测、月测乃至每日晚自习时进行的晚测都已司空见惯，考试就像一个个tRNA，追踪上那连续不断、名为高中的mRNA。\n\n而进入大学后，在各门课程的第一节课，老师大多就会宣布学期的大致安排，这学期除专业课《力学》和《高数》另还设有其他考试外，其他课程均只有期末考试这一次测验。\n\n虽然对考试有着近乎本能的抗拒，但此时，我却有几分期待和兴奋。\n\n自开学以来，除上课外，我基本都奔波于图书馆和寝室、食堂的三点一线中，加入刘老师的课题组后，路线上又新增了一个名为量子楼的存档点。\n\n对于学校安排的基础课程的学习，即便是我最不感冒的金融选修课，我也从未缺席，在“资本”、“市场”的背景音中学习《固体物理》，大概也是一种不可多得的享受。\n\n“今天月测。”\n\n方老师把试卷放到讲台上，声音不大，却让教室里翻书和交谈的声音都整齐地停了一下。\n\n事实证明，中国人在“内卷”一事上是很有天赋的。\n\n而我为了在无法完整读取号主存档的情况下，也能替号主“代练”，只能拼尽全力去卷。\n\n[没能让号主大人使出全力，真是抱歉啊~]\n\n只不过，这一切在舍友的眼里，大概却是“那你比你聪明的人还比你努力”。\n\n朱铭坐在我旁边，低头把笔袋拉开。\n\n“我靠。”他压低声音，“这咋整得跟高考似的呢？”\n\n“高考不会只考极限和导数。”\n\n“你这么一说，我更难受了。”\n\n朱铭看了我一眼。\n\n“看来我连缩水版高考都够呛。”\n\n我正想安慰他两句，方老师忽然抬起头，视线从教室前排扫到后排。\n\n她没有急着发卷。\n\n“程昕亮来了没有？”\n\n教室里有人发出一声短促的笑。\n\n这还真不能怪人笑场。\n\n毕竟在物理一班的课堂上，程昕亮已经不再只是一个姓名，而进化成了一个“梗”。\n\n第一节课来了就走。\n\n第二节课缺勤。\n\n第三节课依旧缺勤。\n\n第四节课虽然来了，但全程都睡得很安详。\n\n自第五节课起，方老师点名时每念到“程昕亮”三个字，语气已像是在确认太阳是否照常升起。\n\n“老师我在这。”\n\n我下意识回头。\n\n坐在后排的程昕亮伸出右手示意，同时还用另一只手掩面、打了个哈欠。\n\n“哟，我还以为你考试也不来了呢。”\n\n方老师皮笑肉不笑地看着不着调的程昕亮。\n\n程昕亮把豆浆放到桌角，认真想了想。\n\n“哪能呢？老师，您知道的，我最喜欢考试了。”\n\n方老师扯了一下嘴角。\n\n“看来你是已经做好考满分的准备了？”\n\n的确，按照程昕亮的缺课率，百分之四十的平时分已经被他自己“放生”了，其余的考试他都必须要考到满分，才有可能不挂科。\n\n程昕亮没接这句话，只是把笔从口袋里摸出来，三分嚣张七分不羁地转起了笔。\n\n朱铭在旁边小声说：\n\n“这哥们心态是真行。”\n\n“也许这就是他能坐在后排靠窗的原因……”\n\n试卷很快发了下来。\n\n我没有着急作答，而是先来回、前后翻看了一下手中的这份试卷。\n\n兵法有云：知己知彼，百战不殆。\n\n十道选择，20分；十道填空，20分；两个证明题，20分；三个计算题，40分。\n\n看来题量不小，前面必须要加快速度，否则后面极有可能来不及作答。\n\n[1.求函数lncosx/x*2在x趋于0时的极限]\n\n-1/2。\n\n看了几秒钟后，我便在心里算出了答案。\n\n这题稍作代换，结果不就出来了吗？\n\n是因为第一题的缘故吗？\n\n求极限。\n\n参加物竞的那个姜岚此刻如果坐在这里，看着这份试卷，大概只会觉得这题侮辱了他的草稿纸。\n\n[2.设f（x）=x*2，g（x）=sinx，求f（g（x））]\n\n不就是sinx的平方吗？\n\n这第二题会不会也过于简单了？\n\n难道奖池还在累计？\n\n[3.函数f（x）=lnx/x-1的定义域是]\n\n这……这明明是高中题目吧？\n\n[4.求数列2n-1/3n-4在趋近于无穷时的极限]\n\n[5.求数列……的极限]\n\n[6.若已知……求函数……的极限]\n\n……\n\n难道，后面还有高手？\n\n……\n\n当一口气做完所有的选择和填空题时，我有意识地抬头看了眼时间，10：09，才过去不到十分钟的时间。\n\n很快，两个证明题也不费吹灰之力就“证得”了。\n\n三个计算题的难度相比前面的选择填空也不过就是“卧龙凤雏”的水平。\n\n作答的过程中，相较于花在计算上的心思，我更多时候不由地在分心思考。\n\n当我做完整张试卷时，考试时间才刚刚过去三分之一。\n\n我用余光瞟了一圈四周。\n\n大多数同学都还在奋笔疾书地认真作答，通过不自觉伸出桌面的试卷边缘，我发现他们大都刚做完选择、填空。\n\n这……\n\n总不能我和其他人拿到的不是同一份试卷吧？\n\n我不禁瞥了一眼坐在台上监考的方老师。\n\n难道我是她失散多年的亲生儿子？\n\n我宁愿相信是发错了试卷。\n\n我放下笔，又重新拿起。\n\n这时候提前交卷显然不太合适，绝对会成为众矢之的。\n\n“老师，我想上厕所。”\n\n我的笔尖停住。\n\n寂静的教室里，正在认真考试的同学们都被这个突然在身后响起的声音弄得一怔，不少定力不足的更是下意识回头看去。\n\n“考试期间不准东张西望！”\n\n方老师直接无视了程昕亮的诉求。\n\n“老师，我想上厕所！”\n\n程昕亮像是担心老师年岁已高、耳聋目眩，又贴心地以更大的音量重复了一遍。\n\n“考试期间不准上厕所。”\n\n“老师，我真得上厕所，我快忍不住了！”\n\n程昕亮呼声急切，同时
